      файлів (FTP), системи зазвичай надсилають повідомлення про припинення доступу у вигляді останніх повідомлень
      до завершення сеансів.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ac-12.3
    ref_id: AC-12(3)
    name: Припинення сеансу — Застережне повідомлення про те, що час сесії добігає кінця
    category: technical
    csf_function: protect
    description: 'Відобразити виразне повідомлення користувачам, що вказує, що сесія добігає кінця [Завдання: визначений
      організацією час до кінця сесії].


