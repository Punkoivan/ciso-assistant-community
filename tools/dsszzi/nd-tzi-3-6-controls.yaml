  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:pl-4
    ref_id: PL-4
    name: Правила поведінки
    category: policy
    csf_function: govern
    description: 'a. Створити та надати особам, що потребують доступу до інформаційної системи, правила, які описують
      їхні обов’язки й очікувану поведінку щодо інформації та використання інформаційної системи, безпеки та приватності.

      b. Отримати документальне підтвердження від таких осіб про те, що вони прочитали, зрозуміли та погодилися
      дотримуватися правил поведінки, перш ніж дозволяти доступ до інформації та інформаційної системи.

      c. Переглядати й оновлювати правила поведінки [Призначення: з визначеною організацією частотою].

      d. Вимагати від осіб, які підписали попередню версію правил поведінки, перечитати та повторно підписати правила
      [Вибір (один або декілька): [Призначення: з визначеною організацією частотою]; коли правила переглядаються
      чи оновлюються].


      Параметри:

      1. Призначення: з визначеною організацією частотою

      2. Вибір (один або декілька): [Призначення: з визначеною організацією частотою]; коли правила переглядаються
      чи оновлюються'
    annotation: Це вдосконалення стосується користувачів організації. Інші типи угод, за якими дозволяються надавати
      доступ, включають в себе угоди про нерозголошення, конфлікт інтересів, а також угоди про правила використання
      (див. PS6). Організації розглядають правила поведінки, що базуються на окремих ролях і обов’язках користувачів,
      розрізняючи правила для привілейованих і непривілейованих користувачів. Встановлення правил поведінки для
      деяких типів користувачів, що не є працівниками організації, включно з, наприклад, особами, які просто отримують
      дані чи інформацію з системи, часто не є можливим, враховуючи велику кількість таких користувачів та обмежений
      характер їхньої взаємодії із системами. Правила поведінки для користувачів організації також можуть бути встановлені
      в AC-8. У цьому розділі наведено список заходів захисту, які мають відношення правил поведінки в організації.
      Вимоги PL-4b можуть забезпечуватися навчанням щодо інформованості про безпеку та приватність, а також навчальними
      програмами з питань безпеки та приватності, що розробляються організаціями, якщо таке навчання містить правила
      поведінки. Документальним підтвердженням ознайомлення та погодження із правилами поведінки є електронний або
      фізичний підпис особи, а також прийняття електронної угоди розміщенням галочки у відповідному полі.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:pl-4.1
    ref_id: PL-4(1)
    name: Правила поведінки — Обмеження на соціальні медіа та мережу
    category: policy
    csf_function: govern
    description: 'Внести до правил поведінки обмеження щодо:

      a) використання соціальних медіапорталів, вебсайтів, а також зовнішніх/сторонніх сайтів/додатків;

      b) розміщення інформації, що належить організації, на загальнодоступних вебсайтах;

      c) використання наданих організацією ідентифікаторів (наприклад, електронна пошта) та секретів автентифікації
      (наприклад, паролі) для створення акаунтів на зовнішніх/сторонніх вебсайтах/додатках.'
    annotation: Це вдосконалення стосується правил поведінки, пов’язаних з використанням соціальних медіа та мережевих
      вебсайтів, коли персонал організації використовує такі сайти для службових обов’язків, а також коли організаційна
      інформація залучається до соціальних медіа та мережевих транзакцій і коли персонал здійснює доступ до соціальних
      медіа та мережевих сайтів з систем організації. Організації також встановлюють конкретні правила, які не дають
      можливість стороннім організаціям отримувати недержавну організаційну інформацію із соціальних медіа та мережевих
      сайтів.
