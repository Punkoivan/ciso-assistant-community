      з відновлення функціонування;

      2. у разі внесення змін у систему;

      3. надалі з [Призначення: визначеною організацією частотою].

      b. Переглядати та оновлювати зміст тренінгів на випадок надзвичайних ситуацій [Призначення: частота, визначена
      організацією] та дотримання [Призначення: події, визначені організацією].


      Параметри:

      1. Призначення: визначеного організацією періоду часу

      2. Призначення: визначеною організацією частотою

      3. Призначення: частота, визначена організацією

      4. Призначення: події, визначені організацією'
    annotation: Навчання із забезпечення безперервної роботи повинне бути пов’язане з обов’язками конкретних ролей
      та/або організаційного персоналу. Наприклад, звичайним користувачам можливо лише знати, коли й де потрібно
      звітувати про виконання службових обов’язків під час функціонування системи в позаштатному режимі. Для адміністраторів
      системи може знадобитися додаткове навчання щодо налаштування систем на місцях альтернативної обробки та зберігання
      інформації. Менеджери/старші керівники мають отримувати більш глибоку підготовку щодо того, як виконувати
      важливі функції у визначених місцях поза межами звичних компонентів та як встановити зв’язок з іншими установами
      з метою координації заходів, пов’язаних з надзвичайними ситуаціями. Навчання ролям або обовʼязкам на випадок
      надзвичайних ситуацій відображає конкретні вимоги в плані для відновлення безперервної роботи системи. Події,
      які можуть спричинити оновлення вмісту навчання на випадок надзвичайних ситуацій, включають, але не обмежуються
      тестуванням плану на випадок надзвичайних ситуацій або фактичних надзвичайних випадків (засвоєних уроків),
      висновків з оцінювання чи аудиту, інцидентів чи порушень безпеки або змін в законах, розпорядженнях, директивах,
      правилах, політиках, стандартах, тощо. На розсуд організації, участь у випробуванні плану дій у надзвичайних
      ситуаціях або навчаннях, включаючи заняття з вивчення уроків після випробування чи вправ, може задовольнити
      вимоги до підготовки плану дій у надзвичайних ситуаціях.
