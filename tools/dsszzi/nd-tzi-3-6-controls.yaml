    category: process
    csf_function: identify
    description: 'Вилучено: Включено до SC-7(5).'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ca-3.6
    ref_id: CA-3(6)
    name: Взаємодія систем — Передача дозволів
    category: process
    csf_function: identify
    description: Переконатися, що особи або системи, які передають дані між взаємопов'язаними системами, мають необхідні
      повноваження (тобто дозволи на запис або привілеї), до прийняття таких даних.
    annotation: Для запобігання неавторизованого доступу особами і системами при передачі інформації до захищених
      систем, захищена система перевіряє за допомогою незалежних засобів — чи має особа або система, які намагаються
      передати інформацію такі повноваження (наприклад, маршрутизація та DNS і служби як, автентифіковані ретранслятори
      SMTP).
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ca-3.7
    ref_id: CA-3(7)
    name: Взаємодія систем — Транзитивний обмін інформацією
    category: process
    csf_function: identify
    description: 'a) Визначити транзитивний (низхідний) обмін інформацією з іншими системами через системи, визначені
      в CA-3a;


      b) Вжити заходів для забезпечення припинення транзитивного (низхідного) обміну інформацією, коли засоби контролю
      ідентифікованих транзитивних (низхідних) систем не можуть бути перевірені або підтверджені.'
    annotation: Транзитивний або «нисхідний» обмін інформацією — це обмін інформацією між системою або системами,
      з якими система організації обмінюється інформацією. Для важливих систем, послуг і програм, включаючи активи
      високої вартості, необхідно ідентифікувати такі обміни інформацією. Прозорість засобів контролю або заходів
      захисту, що діють у таких нисхідних системах, прямо чи опосередковано пов'язаних з організаційними системами,
      має важливе значення для розуміння ризиків безпеки та приватності, пов'язаних із таким обміном інформацією.
      Системи, що належать організації, можуть успадкувати ризики від нисхідних систем через транзитивні зв'язки
      та обмін інформацією, та стати більш сприйнятливими до загроз, небезпек і несприятливих впливів.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ca-4
    ref_id: CA-4
    name: Сертифікація безпеки
    category: process
    csf_function: identify
    description: 'Вилучено: Включено до CA-2.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ca-5
    ref_id: CA-5
    name: План усунення недоліків та контрольні показники
    category: process
    csf_function: identify
    description: 'a. Розробити для системи план усунення недоліків та контрольні показники з метою документування
      запланованих коригувальних дій організації для усунення недоліків і зауважень, які виявлені в ході оцінювання
      заходів захисту, а також для зменшення або усунення відомих вразливостей у системі.


      b. Оновлювати чинний план усунення недоліків та контрольні показники з [Призначення: визначеною організацією
      частотою] на основі результатів оцінювання заходів, незалежних аудитів та постійного моніторингу.


      Параметри:

      1. Призначення: визначеною організацією частотою'
    annotation: Плани усунення недоліків та контрольні показники є необхідними документами в пакетах дозволів.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ca-5.1
    ref_id: CA-5(1)
    name: План усунення недоліків та контрольні показники — Автоматизація підтримки задля точності та вживаності
    category: process
    csf_function: identify
    description: 'Забезпечити точність, актуальність і доступність плану усунення недоліків і основних етапів для
      системи за допомогою [Завдання: автоматизовані механізми, визначені організацією].


      Параметри:

      1. Завдання: автоматизовані механізми, визначені організацією'
    annotation: Використання автоматизованих інструментів допомагає підтримувати точність, актуальність і доступність
      плану усунення недоліків і етапів, а також полегшує координацію та обмін інформацією про безпеку та приватність
      у всій організації. Така координація та обмін інформацією допомагають виявляти слабкі місця або недоліки в
      системах і забезпечують своєчасне спрямування відповідних ресурсів на найбільш критично вразливі місця системи.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ca-6
    ref_id: CA-6
    name: Акредитація
    category: process
    csf_function: identify
    description: 'a. Призначити старшого керівника, який відповідає за систему;


      b. Призначити старшого керівника, відповідального за систему, та будь-які загальні заходи захисту, успадковані
      системою.


      c. Переконатися перед початком функціонування системи, що посадова особа:


      1. акредитує загальні заходи захисту, що успадковані системою;


      2. акредитує систему на функціонування за призначенням.


      d. Переконайтеся, що посадова особа, яка акредитує засоби захисту, дозволяє використання цих засобів захисту
      для успадкування організаційними системами;


      e. Оновлювати акредитацію [Призначення: з визначеною організацією частотою].


      Параметри:

      1. Призначення: з визначеною організацією частотою'
    annotation: Акредитація — це офіційне рішення керівних органів, які надають дозвіл на експлуатацію систем (включно
      з управлінням дочірніми системами) та приймають ризик для операцій організації і активів фізичних осіб, інших
      організацій на основі реалізації узгоджених принципів, після впровадження заходів захисту. Уповноважені посадові
      особи здійснюють нагляд за системами організації або беруть на себе відповідальність за функції та процеси,
      підтримувані цими системами. Уповноважені посадові особи несуть відповідальність за ризики безпеки та приватності,
      пов'язані з функціонуванням та використанням систем. Організації проводять постійну акредитацію систем шляхом
      постійного моніторингу безпеки. Уповноважені особи видають поточні дозволи системам на основі доказів, отриманих
      із запроваджених програм постійного моніторингу. Надійні програми постійного моніторингу зменшують потребу
      в окремих процесах акредитації. Завдяки використанню всебічних процесів постійного моніторингу безпеки важлива
      інформація, що міститься в пакетах акредитації, включно з планами захисту інформації та персональних даних,
      звітами про оцінювання безпеки та приватності, а також планами усунення недоліків та контрольними показниками,
      постійно оновлюються. Це забезпечує уповноваженим посадовим особам, власникам систем наявність інформації
      про актуальний стан безпеки та приватності систем, органів управління та робочих середовищ. Щоб зменшити витрати
      на повторну акредитацію, уповноважені особи максимально використовують результати безперервного моніторингу
      безпеки як основу для ухвалення рішень про повторну акредитацію.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ca-6.1
    ref_id: CA-6(1)
    name: Акредитація — Спільна акредитація — Одна й та сама організація
    category: process
    csf_function: identify
    description: Впровадити спільний процес акредитації для системи, що має кількох уповноважених посадових осіб
      однієї організації, які здійснюють акредитацію.
    annotation: Призначення декількох уповноважених осіб однієї організації виконувати спільні функції з акредитації
      підвищує рівень незалежності в процесі ухвалення рішень. Також реалізується концепція поділу обов'язків. Це
      посилення є найбільш актуальним для взаємопов'язаних систем, спільних систем і систем з декількома власниками
      інформації.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ca-6.2
    ref_id: CA-6(2)
    name: Акредитація — Спільна акредитація — Різні організації
    category: process
    csf_function: identify
    description: Впровадити спільний процес акредитації для системи, що має кількох уповноважених посадових осіб
      з принаймні однією уповноваженою посадовою особою з організації, яка є зовнішньою організацією, що здійснює
      акредитацію.
    annotation: Призначення декількох уповноважених службових осіб, принаймні одна з яких є від зовнішньої організації,
      виконувати спільні функції підвищує рівень незалежності в процесі ухвалення рішень. Також реалізується концепції
      поділу обов'язків. Залучення уповноважених осіб із зовнішніх організацій для доповнення функцій посадової
      особи, яка має дозвіл від організації, що є власником системи або власником приміщення, де розміщується система,
      може бути необхідним у випадках, коли ці організації мають заінтересовані частки або акції. Це посилення може
      застосовуватися для взаємопов'язаних систем, спільних систем і систем з декількома власниками інформації.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ca-7
    ref_id: CA-7
    name: Безперервний моніторинг
    category: process
    csf_function: detect
    description: 'Розробити стратегію безперервного моніторингу безпеки та приватності й упровадити програму безперервного
      моніторингу безпеки та приватності, яка охоплює:


      a. встановлення показників безпеки та приватності, які необхідно відстежувати: [Призначення: визначені організацією
      метрики];


      b. встановлення [Призначення: визначена організацією частота] для моніторингу та [Призначення: визначена організацією
      частота] для безперервного оцінювання ефективності заходів захисту;


      c. поточні оцінювання заходів захисту відповідно до стратегії безперервного моніторингу організації;


      d. постійний моніторинг стану безпеки та приватності відповідно до встановлених організацією метрик і відповідно
      до стратегії безперервного моніторингу організації;


      e. зіставлення та аналіз інформації, отриманої в результаті оцінювання та моніторингу безпеки та приватності;


      f. дії реагування за результатами аналізу інформації, пов''язаної з безпекою та приватністю;


      g. повідомлення про статус безпеки та приватності системи [Призначення: визначені організацією персонал або
      ролі] з [Призначення: визначеною організацією частотою].


      Параметри:

      1. Призначення: визначені організацією метрики

      2. Призначення: визначена організацією частота

      3. Призначення: визначені організацією персонал або ролі

      4. Призначення: визначеною організацією частотою'
    annotation: Програма безперервного моніторингу безпеки сприяє постійній поінформованості про загрози, вразливості,
      інформаційну безпеку та приватність для підтримки ухвалення рішень організації щодо управління ризиками. Терміни
      «безперервний» і «постійний» означають, що організації оцінюють і контролюють свої заходи захисту та ризики
      з частотою, достатньою для підтримки рішень на основі оцінки ризиків. Для різних типів заходів захисту може
      знадобитися різна частота моніторингу. Результати безперервного моніторингу генерують дії організацій щодо
      реагування на ризики. Під час моніторингу ефективності кількох заходів захисту, які були згруповані, може
      знадобитися аналіз першопричини, щоб визначити конкретний захід захисту, який не працює. Програми безперервного
      моніторингу також дозволяють підтримувати акредитацію систем і контроль у режимі реального часу, враховуючи
      динамічні умови роботи із зміною потреб, загроз, вразливостей і технологій. Доступ до інформації, що стосується
      безпеки та приватності, постійно надається у вигляді звітів та інформаційних панелей і дає посадовим особам
      можливість ухвалювати ефективні та своєчасні рішення щодо управління ризиками, включно з поточними рішеннями
      про акредитацію. Автоматизація моніторингу підтримує частіші оновлення обладнання, програмного забезпечення,
      пакетів акредитації та іншої системної інформації. Ефективність підвищується, коли результати безперервного
      моніторингу форматуються для надання інформації, яка є конкретною, вимірюваною, дієвою, відповідною та своєчасною.
      Заходи безперервного моніторингу масштабуються відповідно до категорій безпеки систем. Вимоги до моніторингу,
      включно з потребою в спеціальному моніторингу, вказані в інших заходах захисту та посилених заходах захисту,
      таких як AC-2g, AC 2(7), AC-2(12)(a), AC-2(7)(b), AC-2(7)(c), AC-17(1), AT-4a, AU-13, AU-13(1), AU-13(2),
      CM-3f, CM 6d, CM-11c, IR-5, MA-2b, MA-3a, MA-4a, PE-3d, PE-6, PE-14b, PE-16, PE-20, PM-6, PM-23, PM 31, PS-7e,
      SA-9c, SR-4, SC-5(3)(b), SC-7a, SC-7(24)(b), SC-18b, SC-43b і SI-4.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ca-7.1
    ref_id: CA-7(1)
    name: Безперервний моніторинг — Незалежне оцінювання
    category: process
    csf_function: detect
    description: Залучити незалежних експертів або групи з оцінювання, щоб постійно спостерігати за заходами захисту
      в системі.
    annotation: 'Організації можуть максимізувати значення контрольних оцінок під час процесу постійного моніторингу,
      вимагаючи, щоб оцінювання проводились експертами з відповідним рівнем незалежності. Необхідний рівень незалежності
      експерта визначається, базуючись на стратегії безперервного моніторингу. Незалежність експерта забезпечує
      певну неупередженість у процесі моніторингу. Для досягнення такої неупередженості експерти: не повинні мати
      жодного конфліктного інтересу з організаціями, де проводяться оцінювання; не повинні оцінювати власну роботу;
      не повинні виконувати функції посадових осіб організацій.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ca-7.2
    ref_id: CA-7(2)
    name: Безперервний моніторинг — Види оцінок
    category: process
    csf_function: detect
    description: 'Вилучено: Включено до CA-2.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ca-7.3
    ref_id: CA-7(3)
    name: Безперервний моніторинг — Аналіз тенденції
    category: process
    csf_function: detect
    description: Впровадити аналіз тенденцій, щоб визначити, чи потрібно змінювати реалізацію заходу захисту, частоту
      постійних моніторингових заходів і види діяльності, що використовуються в процесі безперервного моніторингу,
      на основі емпіричних даних.
    annotation: 'Аналіз тенденцій включає: вивчення останніх відомостей про загрози, що відбулися в межах організації;
      вивчення показників успішності певних типів атак; вивчення вразливих ситуацій у конкретних технологіях (у
      тому числі реалізованих за допомогою методів соціальної інженерії та інтелектуального аналізу); вивчення результатів
      багаторазового оцінювання заходів, ефективності параметрів конфігурації та висновків інспекторів або аудиторів.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ca-7.4
    ref_id: CA-7(4)
    name: Безперервний моніторинг — Моніторинг ризику
    category: process
    csf_function: detect
    description: 'Забезпечити моніторинг ризиків, що є невід''ємною частиною стратегії постійного моніторингу та
      включає:

      (a) моніторинг ефективності;

      (b) моніторинг відповідності;

      (c) моніторинг змін.'
    annotation: Моніторинг ризиків базується на встановленій організаційній толерантності до ризику. Моніторинг
      ефективності визначає постійну ефективність впроваджених заходів реагування на ризики. Моніторинг відповідності
      перевіряє, чи впроваджено необхідні заходи реагування на ризики. Він також перевіряє дотримання вимог безпеки
      та приватності. Моніторинг змін визначає зміни в системах організації і робочому середовищі, які можуть вплинути
      на ризики безпеки та приватності.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ca-7.5
    ref_id: CA-7(5)
    name: Безперервний моніторинг — Узгоджений аналіз
    category: process
    csf_function: detect
    description: 'Застосуйте наступні дії, щоб перевірити, що політики встановлені, а запроваджені заходи захисту
      працюють узгоджено: [Призначення: дії, визначені організацією].


      Параметри:

      1. Призначення: дії, визначені організацією'
    annotation: Елементи керування безпекою та приватністю часто додаються до системи поступово. Як наслідок, політика
      вибору та впровадження засобів захисту може бути непослідовною, а засоби захисту можуть не працювати узгоджено
      чи скоординовано. Як мінімум відсутність узгодженості та координації може означати, що в системі є прогалини
      в безпеці та приватності. У гіршому випадку це може означати, що деякі елементи заходи захисту, реалізовані
      в одному місці або одним компонентом, фактично перешкоджають функціонуванню інших заходів захисту (наприклад,
      шифрування внутрішнього мережевого трафіку може перешкоджати моніторингу). Також, відсутність узгодженого
      моніторингу всіх реалізованих мережевих протоколів (наприклад, подвійний стек IPv4 і IPv6) може створити ненавмисні
      вразливості в системі, якими можуть скористатися зловмисники. Підтвердження того, що впроваджені заходи захисту
      працюють узгоджено, скоординовано та не перешкоджають роботі одне одному, досягається за допомогою тестування,
      моніторингу та аналізу.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ca-7.6
    ref_id: CA-7(6)
    name: Безперервний моніторинг — Автоматична підтримка моніторингу
    category: process
    csf_function: detect
    description: 'Забезпечити точність, актуальність і доступність результатів моніторингу для системи за допомогою
      [Завдання: автоматизовані механізми, визначені організацією].


      Параметри:

      1. Завдання: автоматизовані механізми, визначені організацією'
    annotation: Використання автоматизованих інструментів для моніторингу допомагає підтримувати точність, актуальність
      і доступність моніторингової інформації, та, як наслідок, допомагає підвищити рівень постійної обізнаності
      про безпеку системи та стан конфіденційності для підтримки рішень організації щодо управління ризиками.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ca-8
    ref_id: CA-8
    name: Тестування на проникнення
    category: process
    csf_function: detect
    description: 'Проводити тестування на проникнення з [Призначення: визначеною організацією частотою] у [Призначення:
      визначеній організацією інформаційній системі чи системному компоненті].


      Параметри:

      1. Призначення: визначеною організацією частотою

      2. Призначення: визначеній організацією інформаційній системі чи системному компоненті'
    annotation: Тестування на проникнення — це спеціалізований тип оцінювання, що проводиться стосовно систем або
      окремих компонентів системи для виявлення вразливих місць, які можуть бути використані зловмисниками. Тестування
      на проникнення виходить за рамки автоматизованого сканування вразливості й найефективніше проводиться агентами
      тестування на проникнення та командами, що мають навички й досвід, які залежать від сфери тестування на проникнення,
      включно з технічною експертизою в мережі, в операційній системі та/або в безпеці на рівні застосунків. Тестування
      на проникнення можна використовувати або для перевірки вразливості, або для визначення ступеня стійкості до
      проникнення в межах визначених обмежень. Такі обмеження містять, наприклад, час, ресурси та навички. При тестуванні
      на проникнення експерт намагається дублювати дії супротивників при здійсненні нападів та забезпечує глибший
      аналіз безпеки та приватності. Тестування на проникнення намагається дублювати дії зловмисників і забезпечує
      більш глибокий аналіз слабких місць або недоліків, пов'язаних із безпекою та конфіденційністю. Тестування
      на проникнення особливо важливо, коли організації переходять від старих технологій до новіших (наприклад,
      переходять від мережевих протоколів IPv4 до IPv6). Організації можуть використовувати результати аналізу вразливостей
      для підтримки тестування на проникнення. Тестування на проникнення може проводитися всередині або ззовні на
      апаратних, програмних або мікропрограмних компонентах системи та може здійснювати як фізичний, так і технічний
      контроль. Стандартний метод тестування на проникнення включає попередній аналіз на основі повного знання системи,
      попереднє визначення потенційних уразливостей на основі попереднього аналізу та тестування, призначеного для
      визначення можливості використання цих вразливостей. Усі сторони погоджуються з правилами взаємодії перед
      початком сценаріїв тестування на проникнення. Правила взаємодії для тестів на проникнення схожі з інструментами,
      методами та процедурами, які, як очікується, використовуватимуть супротивники. Тестування на проникнення може
      призвести до розкриття інформації, яка захищена законами чи правилами, особам, які проводять тестування. Правила
      участі, контракти чи інші відповідні механізми можуть бути використані для захисту такої інформацію, а оцінка
      відповідних ризиків визначає рішення щодо рівня незалежності осіб, які проводять тестування на проникнення.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ca-8.1
    ref_id: CA-8(1)
    name: Тестування на проникнення — Незалежна команда або агент на проникнення
    category: process
    csf_function: detect
    description: Залучити незалежного агента або команду для виконання тестування на проникнення системи або системного
      компонента.
    annotation: Незалежні агенти або команди тестувальників на проникнення — це особи або групи осіб, які проводять
      неупереджене тестування на проникнення. Неупередженість передбачає, що ці тестувальники або групи тестувальників
      не мають будь-якого інтересу щодо розвитку, експлуатації чи управління системою, яка є ціллю тестування на
      проникнення. Захід безпеки CA-2(1) надає додаткову інформацію про незалежні оцінювання, які можна застосувати
      для тестування на проникнення.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ca-8.2
    ref_id: CA-8(2)
    name: Тестування на проникнення — Червона команда
    category: process
    csf_function: detect
    description: 'Використовувати наступні вправи червоної команди, для імітації спроб супротивників скомпрометувати
      системи організації відповідно до прийнятих правил ведення бойових дій: [Завдання: визначені організацією
      вправи червоної команди].


      Параметри:

      1. Завдання: визначені організацією вправи червоної команди'
    annotation: Червона команда здатна провести більш глибоке тестування на проникнення шляхом вивчення системи
      безпеки та приватності організації та її здатності застосовувати ефективні засоби захисту від кіберзагроз.
      Вправи червоної команди імітують спроби зловмисників скомпрометувати місію та бізнес-функції організації та
      забезпечують комплексну оцінку стану безпеки та приватності систем і організації. Змодельовані атаки також
      містять атаки на основі технологій і соціальної інженерії. Технологічні атаки включають взаємодію з апаратними,
      програмними чи апаратно-програмними компонентами та/або процесами. Атаки на основі соціальної інженерії включають
      взаємодію через електронну пошту, телефон або особисті розмови. Навчання червоної команди є найефективнішими,
      якщо їх проводять тестувальники на проникнення та команди, які мають знання та досвід поточної тактики, методів,
      процедур та інструментів боротьби. Хоча тестування на проникнення є в основному лабораторним тестуванням,
      організації можуть використовувати вправи червоної команди для забезпечення повноти оцінки, яка відображає
      реальні умови. Результати тестування на проникнення червоною командою можуть бути використані для підвищення
      рівня безпеки та обізнаності щодо приватності.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ca-8.3
    ref_id: CA-8(3)
    name: Тестування на проникнення — Можливості перевірки на проникнення
    category: process
    csf_function: detect
    description: 'Впровадити процес тестування на проникнення, який охоплює [Призначення: визначену організацією
      частоту] [Вибір: з попередженням; без попередження] спроб обійти чи зламати заходи захисту, пов''язані з фізичними
      точками доступу до об''єкта.


      Параметри:

      1. Призначення: визначену організацією частоту

      2. Вибір: з попередженням; без попередження'
    annotation: Тестування на проникнення фізичних точок доступу може надати інформацію про критичні вразливості
      в операційних середовищах систем організації. Така інформація може бути використана для виправлення слабких
      місць або недоліків у фізичних заходах захисту, необхідних для захисту систем організації.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ca-9
    ref_id: CA-9
    name: Внутрішні з'єднання системи
    category: process
    csf_function: identify
    description: 'a. Авторизувати внутрішні підключення [Призначення: системні компоненти або класи компонентів,
      що організація визначила] до системи;


      b. Задокументувати, для кожного внутрішнього з''єднання, характеристики інтерфейсу, вимоги безпеки та приватності,
      а також характер переданої інформації;


      c. Розірвати внутрішні системні підключення після [Призначення: умови, визначені організацією];


      d. Переглядати [Призначення: частота, визначена організацією] постійну потребу в кожному внутрішньому з''єднанні.


      Параметри:

      1. Призначення: системні компоненти або класи компонентів, що організація визначила

      2. Призначення: умови, визначені організацією

      3. Призначення: частота, визначена організацією'
    annotation: Цей захід безпеки застосовується до зв'язків між організаційними системами та окремими складовими
      компонентами системи, включаючи компоненти, що використовуються для розробки системи. Ці внутрішньосистемні
      з'єднання містять, наприклад, з'єднання з мобільними пристроями, ноутбуками, настільними комп'ютерами, робочими
      станціями, принтерами, факсимільними машинами, сканерами, датчиками та серверами. Замість надання дозволу
      кожного окремого внутрішнього підключення до системи організації можуть дозволити внутрішні з'єднання для
      класу компонентів системи із загальними характеристиками та/або конфігураціями. Сюди можна віднести, наприклад,
      усі цифрові принтери, сканери та копіювальні машини із заданою можливістю обробки, передачі та зберігання
      або всі смартфони з певною базовою конфігурацією. Тривала потреба у підключенні до внутрішньої системи розглядається
      з точки зору того, чи забезпечує вона підтримку завдань організації або бізнес-функцій.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ca-9.1
    ref_id: CA-9(1)
    name: Внутрішні системні з'єднання — Відповідність перевірки
    category: process
    csf_function: identify
    description: Виконати перевірку безпеки та приватності компонентів складової системи до встановлення внутрішнього
      з'єднання.
    annotation: Перевірки відповідності можуть містити, наприклад, перевірку відповідної базової конфігурації.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:cm-1
    ref_id: CM-1
    name: Політика та процедури управління конфігурацією
    category: policy
    csf_function: govern
    description: "a. Розробити, задокументувати та поширити серед [Призначення: визначених організацією персоналу\
      \ або ролей]:\n1. [Вибір (один або декілька): Рівень організації; Рівень місії/бізнес-процесу; рівень системи]\
      \ політики управління конфігурацією, яка:\n\n2. (a) містить мету, сферу застосування, ролі, обов’язки, відповідальність\
      \ керівництва, координацію між організаційними підрозділами та систему контролю відповідності (complaince);\n\
      \t(b) відповідає чинним законам, нормативним документам, наказам, положенням, політикам, стандартам і керівним\
      \ принципам;процедури, що сприяють реалізації політики управління конфігурацією та пов’язаних з нею заходів\
      \ управління конфігурацією.\n\nb. Призначити [Призначення: посадова особа, визначена організацією] для управління\
      \ розробкою, документуванням і розповсюдженням політики та процедур керування конфігурацією. c. Переглядати\
      \ та оновлювати поточну політику управління конфігурацією:\n1. Політика [Призначення: частота, визначена організацією]\
      \ та наступні [Призначення: події, визначені організацією];\n2. Процедури [Призначення: частота, визначена\
      \ організацією] та наступні [Призначення: події, визначені організацією].\n\nПараметри:\n1. Призначення: визначених\
      \ організацією персоналу або ролей\n2. Вибір (один або декілька): Рівень організації; Рівень місії/бізнес-процесу;\
      \ рівень системи\n3. Призначення: посадова особа, визначена організацією\n4. Призначення: частота, визначена\
      \ організацією\n5. Призначення: події, визначені організацією"
    annotation: 'Цей захід захисту стосується встановлення політики та процедур для ефективного здійснення заходів
      і їх посилень у класі CM. Стратегія управління ризиками є важливим фактором у встановленні політики та процедур.
      Комплексна політика та процедури допомагають забезпечити безпеку та приватність. За наявності політики, а
      також планів захисту інформації та персональних даних на рівні організації, конкретні системні політики та
      процедури можуть бути не потрібні. Політика може бути введена до складу загальної політики безпеки та приватності
      або може бути представлена кількома політиками (у випадках складної архітектури). Процедури описують, як має
      реалізуватися політика чи заходи захисту та як вони можуть бути спрямовані на персонал або роль, яка є об’єктом
      процедури. Процедури можуть бути задокументовані в планах захисту інформації та персональних даних (як один
      або декілька документів). Події, які можуть спричинити оновлення політики та процедур управління конфігурацією,
      включають: висновки оцінювання чи аудиту, інциденти чи порушення безпеки, зміни у відповідних законах, розпорядженнях,
      директивах, постановах, політиках, стандартах і вказівках, але не обмежуються ними. Просте повторне встановлення
      засобів контролю не є організаційною політикою чи процедурою.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:cm-2
    ref_id: CM-2
    name: Базова конфігурація
    category: process
    csf_function: protect
    description: 'a. Розробити, задокументувати та підтримувати за допомогою заходів конфігурації поточні базові
      налаштування системи.


      b. Переглядати та оновлювати базові налаштування системи:

      1. з [Призначення: визначеною організацією частотою];

      2. за потреби внаслідок [Призначення: визначених організацією обставин];

      3. коли встановлені нові або оновлені компоненти системи.


      Параметри:

      1. Призначення: визначеною організацією частотою

      2. Призначення: визначених організацією обставин'
    annotation: Базові конфігурації для систем і компонентів системи включають підключення, експлуатацію та комунікаційні
      аспекти систем. Базові конфігурації — це задокументовані та узгоджені набори специфікацій для систем або елементів
      конфігурації в цих системах. Базові конфігурації служать основою для майбутніх збірок, випусків або змін у
      системах і включають впровадження контролю безпеки та приватності, операційні процедури, інформацію про компоненти
      системи, топологію мережі та логічне розміщення компонентів в архітектурі системи. Базові конфігурації систем
      мають відображати поточну архітектуру підприємства та (за потреби) можуть бути змінені з часом.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:cm-2.1
    ref_id: CM-2(1)
    name: Базова конфігурація — Перегляд та оновлення
    category: process
