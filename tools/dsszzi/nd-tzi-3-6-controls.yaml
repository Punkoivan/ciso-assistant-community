      до [Призначення: визначені організацією місця] на основі [Призначення: визначених організацією вимог або умов].
  
  
  
      Параметри:
  
  
      1. Вибір (один або більше): обробка інформації; інформація або дані; системні служби
  
  
      2. Призначення: визначені організацією місця
  
  
      3. Призначення: визначених організацією вимог або умов'
    annotation: Місце обробки інформації, зберігання інформації та даних або послуг для системи може мати прямий вплив на здатність
      організацій успішно виконувати свою місію та бізнес-функції. Вплив виникає, коли зовнішні постачальники контролюють розташування
      обробки, зберігання чи послуг. Критерії, які використовують зовнішні постачальники для вибору місць обробки, зберігання
      чи обслуговування, можуть відрізнятися від критеріїв, які використовують організації. Наприклад, організації можуть забажати,
      щоб місця зберігання даних або інформації були обмежені певними місцями, щоб допомогти полегшити заходи реагування на
      інциденти у випадку інцидентів або порушень інформаційної безпеки. Діяльність реагування на інциденти, включаючи судово-медичний
      аналіз і постфактумне розслідування, може бути піддано негативному впливу регулюючих законів, політик або протоколів у
      місцях обробки та зберігання та/або місцях, з яких надходять системні служби.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:sa-9.6
    ref_id: SA-9(6)
    name: Зовнішні послуги для системи — Послуги, керовані організацією
    category: process
    csf_function: protect
    description: 'СИСТЕМИ-
  
  
      КРИПТОГРАФІЧНІ
  
  
      КЛЮЧІ,
  
  
      Зберігати контроль над криптографічними ключами для зашифрованої інформації, яка зберігається або передається через зовнішню
      систему.'
    annotation: Збереження контролю над криптографічними ключами у зовнішній системі запобігає дешифруванню даних організації
      персоналом зовнішньої системи. Контроль організації криптографічних ключів може бути реалізований шляхом шифрування та
      дешифрування даних всередині організації, коли дані надсилаються до зовнішньої системи та отримуються від неї, або шляхом
      використання компонента, який дозволяє функціям шифрування та дешифрування бути локальними для зовнішньої системи, але
      дозволяє ексклюзивний доступ до ключів шифрування організації.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:sa-9.7
    ref_id: SA-9(7)
    name: Зовнішні послуги для системи — Перевірка цілісності, що контролюється організацією
    category: process
    csf_function: protect
    description: Забезпечити можливість перевірки цілісності інформації в організації під час її перебування в зовнішній системі.
    annotation: Зберігання інформації організації у зовнішній системі може обмежити видимість стану безпеки її даних. Здатність
      організації перевіряти та підтверджувати цілісність збережених даних без передачі їх із зовнішньої системи забезпечує
      таку видимість.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:sa-9.8
    ref_id: SA-9(8)
    name: Зовнішні послуги для системи- місце обробки та зберігання — Юрисдикція україни
    category: process
    csf_function: protect
    description: Обмежити географічне розміщення обробки та зберігання даних об’єктами, розташованими в межах юридичної юрисдикції
      України.
    annotation: Географічне розташування обробки та зберігання даних може мати прямий вплив на здатність організацій успішно
      виконувати свою місію та бізнес-функції. Компрометація або порушення інформації та систем, які мають великий вплив, може
      мати серйозні або катастрофічно несприятливі наслідки для активів та операцій організації, окремих осіб, інших організацій
      і країни. Обмеження обробки та зберігання важливої інформації об’єктами в межах юридичної юрисдикції України забезпечує
      більший контроль над такою обробкою та зберіганням.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:sa-10
    ref_id: SA-10
    name: Управління конфігурацією розробника
    category: process
    csf_function: protect
    description: 'Вимагати від розробника системи, системного компонента або системної служби:
  
      a. виконання управління конфігурацією під час [Вибір (один або кілька): проєктування; розробки; реалізації; експлуатації;
      видалення] системи, компонента або служби;
  
      b. документувати, керувати та контролювати цілісність змін у [Призначення: визначених організацією елементах конфігурації
      при управлінні конфігурацією];
  
      c. впроваджувати тільки схвалені організацією зміни в системі, компоненті або службі;
  
      d. документувати зміни в системі, компоненті або службі та можливі наслідки таких змін для безпеки та приватності;
  
      e. відстежувати недоліки безпеки та усунення дефектів у системі, компоненті або службі та повідомляти про результати [Призначення:
      визначений організацією персонал].
  
  
  
      Параметри:
  
  
      1. Вибір (один або кілька): проєктування; розробки; реалізації; експлуатації; видалення
  
  
      2. Призначення: визначених організацією елементах конфігурації при управлінні конфігурацією
  
  
      3. Призначення: визначений організацією персонал'
    annotation: Організації розглядають якість і повноту керування конфігурацією, яку здійснюють розробники, як пряме свідчення
      застосування ефективних заходів захисту. Заходи захисту включають захист головних копій матеріалу, який використовується
      для створення важливих для безпеки частин системного обладнання, програмного забезпечення та вбудованого програмного забезпечення
      від несанкціонованої модифікації або знищення. Підтримка цілісності змін у системі, системному компоненті чи системній
      службі вимагає суворого контролю конфігурації протягом усього життєвого циклу розробки системи для відстеження авторизованих
      змін і запобігання несанкціонованим змінам. Елементи конфігурації, які розміщуються під керуванням конфігурації, включають
      формальну модель; функціональні, високорівневі та низькорівневі специфікації проектування; інші проектні дані; документація
      щодо реалізації; вихідний код і схеми обладнання; поточна запущена версія об'єктного коду; інструменти для порівняння
      нових версій описів обладнання та вихідного коду, що стосуються безпеки, з попередніми версіями; а також тестове обладнання
      та документація. Залежно від місії та бізнес-потреб організацій і характеру діючих договірних відносин розробники можуть
      надавати підтримку керування конфігурацією на стадії експлуатації та обслуговування життєвого циклу розробки системи.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:sa-10.1
    ref_id: SA-10(1)
    name: Управління конфігурацією розробника — Перевірка цілісності програмного забезпечення та мікропрограм
    category: process
    csf_function: protect
    description: Вимагати від розробника системи, системного компонента або системної служби забезпечити перевірку цілісності
      програмного забезпечення та компонентів програмного забезпечення.
    annotation: Перевірка цілісності програмного забезпечення та мікропрограми дозволяє організаціям виявляти несанкціоновані
      зміни компонентів програмного забезпечення та мікропрограм за допомогою наданих розробниками інструментів, методів і механізмів.
      Механізми перевірки цілісності також можуть усунути підробку програмного забезпечення та компонентів мікропрограм. Організації
      перевіряють цілісність програмного забезпечення та мікропрограмних компонентів, наприклад, за допомогою безпечних односторонніх
      гешів, наданих розробниками. Поставки програмного забезпечення та компонентів мікропрограм також включають оновлення для
      таких компонентів.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:sa-10.2
    ref_id: SA-10(2)
    name: Управління конфігурацією розробника — Альтернативні процеси керування конфігурацією
    category: process
    csf_function: protect
    description: Забезпечити альтернативний процес керування конфігурацією за допомогою організаційного персоналу за відсутності
      спеціалізованої команди керування конфігурацією розробників.
    annotation: Альтернативні процеси керування конфігурацією можуть знадобитися, коли організації використовують комерційні
      готові продукти інформаційних технологій. Альтернативні процеси керування конфігурацією включають персонал організації,
      який переглядає та затверджує запропоновані зміни до систем, компонентів системи і послуг для системи, а також проводить
      аналіз впливу на безпеку та приватність перед впровадженням змін у системи, компонент чи службу.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:sa-10.3
    ref_id: SA-10(3)
    name: Управління конфігурацією розробника — Перевірка цілісності апаратних засобів
    category: process
    csf_function: protect
    description: Вимагати від розробника системи, компонента системи або системної служби забезпечувати перевірку цілісності
      апаратних компонентів.
    annotation: Перевірка цілісності апаратного забезпечення дозволяє організаціям виявляти несанкціоновані зміни компонентів
      апаратного забезпечення за допомогою наданих розробником інструментів, методів, і механізмів. Організації можуть перевіряти
      цілісність апаратних компонентів за допомогою етикеток, які важко копіювати, серійних номерів, які можна перевірити, наданих
      розробниками, а також вимагаючи використання технологій захисту від несанкціонованого доступу. Поставлені апаратні компоненти
      також включають оновлення апаратного забезпечення та мікропрограм для таких компонентів.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:sa-10.4
    ref_id: SA-10(4)
    name: Управління конфігурацією розробника — Довірче генерування
    category: process
    csf_function: protect
    description: Вимагати від розробника системи, системного компонента або системної служби використовувати інструменти для
      порівняння новозгенерованих версій апаратних описів, вихідного коду та об’єктного коду, що стосуються безпеки, з попередніми
      версіями.
    annotation: Надійна генерація описів, вихідного коду та об’єктного коду стосується авторизованих змін апаратного забезпечення,
      програмного забезпечення та компонентів мікропрограм між версіями під час розробки. Основна увага зосереджена на ефективності
      процесу керування конфігурацією розробником, щоб гарантувати, що нові згенеровані версії описів обладнання, що стосуються
      безпеки, вихідного коду та об’єктного коду, продовжують застосовувати політику безпеки для системи, системного компонента
      або системної служби . Навпаки, SA-10(1) і SA-10(3) дозволяють організаціям виявляти неавторизовані зміни в апаратних,
      програмних і мікропрограмних компонентах за допомогою інструментів, методів або механізмів, наданих розробниками.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:sa-10.5
    ref_id: SA-10(5)
    name: Управління конфігурацією розробника — Відображення цілісності для керування версіями
    category: process
    csf_function: protect
    description: Вимагати від розробника системи, системного компонента або системної служби підтримувати цілісність відображення
      між основними даними збірки, що описують поточну версію апаратного, програмного забезпечення та мікропрограм, що стосуються
      безпеки, і локальною головною копією даних для поточних версій.
    annotation: Відображення цілісності для контролю версій стосується змін апаратного, програмного забезпечення та компонентів
      мікропрограм під час початкової розробки та оновлень життєвого циклу розробки системи. Підтримка цілісності між основними
      копіями апаратного, програмного та вбудованого програмного забезпечення (включно з проектами, кресленнями апаратного забезпечення,
      вихідним кодом) і еквівалентними даними в основних копіях в операційних середовищах має важливе значення для забезпечення
      доступності систем організації, які підтримують критичні місії і бізнес-функції.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:sa-10.6
    ref_id: SA-10(6)
    name: Управління конфігурацією розробника — Довірене постачання
    category: process
    csf_function: protect
    description: Вимагати від розробника системи, системного компонента або системної служби виконувати процедури для забезпечення
      того, щоб апаратні засоби, програмне забезпечення й оновлення прошивки, що стосуються безпеки й оновлюються в організації,
      точно відповідали оригінальним копіям.
    annotation: Довірене постачання оновлень апаратного, програмного та мікропрограмного забезпечення, пов’язаного із безпекою,
      допомагає переконатися, що ці оновлення є правильним представленням оригінальних копій, які зберігаються розробником,
      і не змінюються під час розповсюдження.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:sa-10.7
    ref_id: SA-10(7)
    name: Управління конфігурацією розробника — Представники безпеки та приватності
    category: process
    csf_function: protect
    description: 'Вимагати, щоб [Призначення: визначені організацією представники безпеки та приватності] були включені в [Призначення:
      визначене організацією керування змінами конфігурації та процес контролю].
  
  
  
      Параметри:
  
  
      1. Призначення: визначені організацією представники безпеки та приватності
  
  
      2. Призначення: визначене організацією керування змінами конфігурації та процес контролю'
    annotation: Представники безпеки та приватності можуть включати офіцерів системної безпеки, старших офіцерів інформаційної
      безпеки агентства, старших посадових осіб агентства з приватності та офіцерів конфіденційності системи. Персонал, який
      має досвід інформаційної безпеки та приватності є важливим, оскільки зміни конфігурацій системи можуть мати непередбачені
      побічні ефекти, та можуть мати відношення до безпеки чи приватності. Виявлення таких змін на ранній стадії процесу може
      допомогти уникнути ненавмисних негативних наслідків, які зрештою можуть вплинути на стан безпеки та приватності систем.
      Процес управління змінами конфігурації та вдосконалення контролю стосується процесу керування змінами та контролю, визначеного
      організаціями в SA-10b.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:sa-11
    ref_id: SA-11
    name: Тестування та оцінювання розробника
    category: technical
    csf_function: protect
    description: 'Вимагати від розробника системи, системного компонента або системної служби на всіх етапах проєктування та
      життєвого циклу розробки системи:
  
      a. створити та впровадити план з оцінювання безпеки та приватності;
  
      b. виконати [Вибір (один або кілька): одиниця; інтеграція; система; регресія] тестування/оцінювання [Призначення: з визначеною
      організацією частотою] з [Призначення: визначена організацією глибиною та охопленням];
  
      c. надати докази (свідчення) виконання плану оцінювання та результати тестування й оцінювань;
  
      d. впровадити перевірку процесу виправлення недоліків;
  
      e. виправити дефекти, виявлені під час тестування та оцінювання.
  
  
  
      Параметри:
  
  
      1. Вибір (один або кілька): одиниця; інтеграція; система; регресія
  
  
      2. Призначення: з визначеною організацією частотою
  
  
      3. Призначення: визначена організацією глибиною та охопленням'
    annotation: Тестування та оціннювання розробки підтверджує, що необхідні заходи захисту реалізовано правильно і вони працюють
      за призначенням, забезпечують виконання бажаної політики безпеки та приватності та відповідають установленим вимогам безпеки
      та приватності. Властивості безпеки систем і конфіденційність окремих осіб можуть залежати від взаємозв’язку компонентів
      системи або змін у цих компонентах. Взаємозв’язки або зміни, включаючи оновлення або заміну програм, операційних систем
      і мікропрограм, можуть негативно вплинути на раніше реалізовані заходи захисту. Постійне оцінювання під час розробки дозволяє
      проводити додаткові типи тестування та оцінювання, які розробники можуть проводити для зменшення або усунення потенційних
      недоліків. Тестування спеціальних програмних компонентів може вимагати таких підходів, як ручний перегляд коду, огляд
      архітектури безпеки та тестування на проникнення, а також статичний аналіз, динамічний аналіз, двійковий аналіз або гібридний
      аналіз. Розробники можуть використовувати підходи до аналізу разом із різноманітними інструментами безпеки та фаззингом
      при огляді вихідного коду. Плани оцінки безпеки та приватності включають конкретні дії, які планують виконати розробники,
      зокрема типи аналізів, тестування, оцінки та оглядів компонентів програмного забезпечення та мікропрограми; ступінь суворості,
      який буде застосований; частота поточного тестування та оцінювання; і типи артефактів, створених під час цих процесів.
      Глибина тестування та оцінювання стосується суворості та рівня деталізації, пов’язаних із процесом оцінювання. Охоплення
      тестування та оцінювання відноситься до обсягу (тобто кількості та типу) артефактів, включених до процесу оцінювання.
      Контракти визначають критерії прийнятності для планів оцінки безпеки та приватності, процесів усунення недоліків і підтвердження
      того, що плани та процеси були ретельно застосовані. Методи перевірки та захисту планів оцінювання, доказів і документації
      відповідають категорії безпеки або рівню класифікації системи. Контракти можуть визначати вимоги щодо захисту документації.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:sa-11.1
    ref_id: SA-11(1)
    name: Тестування та оцінювання розробника — Аналіз статичного коду
    category: technical
    csf_function: protect
    description: Вимагати від розробника системи, системного компонента або системної служби використовувати інструменти аналізу
      статичних кодів для виявлення поширених недоліків і документувати результати аналізу.
    annotation: Статичний аналіз коду надає технологію та методологію перевірки безпеки та включає перевірку на наявність слабких
      місць у коді, а також на включення бібліотек чи іншого включеного коду з відомими вразливими місцями або застарілого чи
      того, що більше не підтримується розробником. Статичний аналіз коду можна використовувати для виявлення вразливостей і
      застосування безпечних методів кодування. Він найбільш ефективний, коли використовується на ранніх стадіях процесу розробки,
      коли кожна зміна коду може автоматично скануватися на потенційні недоліки. Статичний аналіз коду може надати чіткі вказівки
      щодо виправлення та виявити дефекти, які необхідно виправити. Докази правильного впровадження статичного аналізу можуть
      включати сукупну щільність дефектів для критичних типів дефектів, докази того, що дефекти були перевірені розробниками
      або фахівцями з безпеки, і докази того, що дефекти були виправлені. Висока щільність ігнорованих результатів, які зазвичай
      називають хибними спрацьовуваннями, вказує на потенційну проблему з процесом аналізу або інструментом аналізу. У таких
      випадках організації зважують достовірність доказів із доказами з інших джерел.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:sa-11.2
    ref_id: SA-11(2)
    name: Тестування та оцінювання розробника — Моделювання загроз та аналіз вразливостей
    category: technical
    csf_function: protect
    description: 'Вимагати від розробника системи, системного компонента або системної служби виконувати моделювання загроз
      та аналіз вразливостей під час розробки та під час подальшого тестування й оцінювання системи, компонента або служби,
      що:
  
      (a) використовує [Призначення: визначену організацією інформацію щодо критичності, середовища функціювання, відомих або
      передбачуваних загроз і прийнятних рівнів ризику];
  
      (b) використовує такі інструменти та методи: [Завдання: інструменти та методи, визначені організацією]; впровадив [Призначення:
      визначені організацією інструменти та методи];
  
      (c) проводить моделювання та аналізи на такому рівні ретельності: [Завдання: визначена організацією широта та глибина
      моделювання та аналізу];
  
      (d) надає докази (свідчення), які відповідають таким критеріям прийнятності [Призначення: визначеним організацією критеріям
      прийняття].
  
  
  
      Параметри:
  
  
      1. Призначення: визначену організацією інформацію щодо критичності, середовища функціювання, відомих або передбачуваних
      загроз і прийнятних рівнів ризику
  
  
      2. Завдання: інструменти та методи, визначені організацією
  
  
      3. Призначення: визначені організацією інструменти та методи
  
  
      4. Завдання: визначена організацією широта та глибина моделювання та аналізу
  
  
      5. Призначення: визначеним організацією критеріям прийняття'
    annotation: Системи, системні компоненти та системні служби можуть суттєво відрізнятися від функціональних і проектних специфікацій,
      створених під час вимог і етапів проектування життєвого циклу розробки системи. Таким чином, оновлення моделювання загроз
      і аналізу вразливостей цих систем, компонентів системи і послуг для системи під час розробки та перед поставкою мають
      вирішальне значення для їх ефективної роботи. Моделювання загроз і аналіз вразливостей на цій стадії життєвого циклу розробки
      системи гарантують, що зміни в проектуванні та реалізації були враховані, а вразливості, створені внаслідок цих змін,
      були переглянуті та пом’якшені.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:sa-11.3
    ref_id: SA-11(3)
    name: Тестування та оцінювання розробника — Незалежна перевірка планів оцінювання та доказів
    category: technical
    csf_function: protect
    description: '(a) Вимагати від незалежного агента, що задовольняє [Призначення: визначені організацією критерії незалежності]
      перевірити правильність виконання планів оцінювання безпеки та приватності розробника й доказів (свідчень), отриманих
      під час тестування та оцінювання.
  
      (b) Переконатися, що незалежному агентові надано достатньо інформації для завершення процесу верифікації або надані повноваження
      для отримання такої інформації.
  
  
  
      Параметри:
  
  
      1. Призначення: визначені організацією критерії незалежності'
    annotation: Незалежні агенти повинні мати відповідну кваліфікацію, включаючи досвід, навички, навчання та сертифікати для
      перевірки правильності реалізації планів оцінки безпеки та приватності розробників.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:sa-11.4
    ref_id: SA-11(4)
    name: Тестування та оцінювання розробника — Ручний аналіз кодів
    category: technical
    csf_function: protect
    description: 'Вимагати від розробника системи, системного компонента або системної служби виконувати ручний аналіз коду
      [Призначення: визначений організацією певний код], використовуючи [Призначення: визначені організацією процеси, процедури
      та/або методики].
  
  
  
      Параметри:
  
  
      1. Призначення: визначений організацією певний код
  
  
      2. Призначення: визначені організацією процеси, процедури та/або методики'
    annotation: Ручний аналіз коду зазвичай зарезервований для критичного програмного забезпечення та мікропрограмних компонентів
      системи. Такий аналіз ефективний для виявлення слабких місць, які вимагають знання вимог програми або контексту, який
      у більшості випадків недоступний для автоматизованих аналітичних інструментів і методів, таких як статичний і динамічний
      аналіз. Переваги ручного аналізу включають можливість перевірки заходів захисту матриці керування доступом, заходів захисту
      відповідності додатків та перегляд детальних аспектів криптографічних реалізацій.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:sa-11.5
    ref_id: SA-11(5)
    name: Тестування та оцінювання розробника — Тестування на проникнення
    category: technical
    csf_function: protect
    description: 'Вимагати від розробника системи, системного компонента або системної служби виконувати тестування на проникнення:
  
      a) з таким рівнем детальності [Призначення: визначена організацією широта і глибина];
  
      b) за таких обмежень [Призначення: визначені організацією обмеження].
  
  
  
      Параметри:
  
  
      1. Призначення: визначена організацією широта і глибина
  
  
      2. Призначення: визначені організацією обмеження'
    annotation: Тестування на проникнення – це метод оцінки, у якій оцінювачі, використовуючи всю доступну документацію на продукт
      або систему і працюючи в умовах певних обмежень, намагаються обійти реалізовані функції безпеки та приватності. Корисна
      інформація для оцінювачів, які проводять тестування на проникнення, включає технічні характеристики продукту та системи,
      вихідний код, а також посібники для адміністратора та оператора. Тестування на проникнення може включати тестування білої
      скриньки, сірої скриньки або чорної скриньки з аналізом, що виконується кваліфікованими фахівцями, які імітують дії противника.
      Метою тестування на проникнення є виявлення вразливостей у системах, компонентах системи і службах, які є результатом
      помилок впровадження, помилок конфігурації або інших операційних слабких місць чи недоліків. Тести на проникнення можна
      виконувати в поєднанні з автоматизованими та ручними перевірками коду, щоб забезпечити вищий рівень аналізу, ніж зазвичай.
      Коли інформація про сеанс користувача та інша персональна інформація фіксується або записується під час тестування на
      проникнення, така інформація обробляється належним чином для захисту приватності.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:sa-11.6
    ref_id: SA-11(6)
    name: Тестування та оцінювання розробника — Аналіз поверхні атаки
    category: technical
    csf_function: protect
    description: Вимагати від розробника системи, компонента системи або системної служби виконувати аналіз поверхніх атак (вразливостей).
    annotation: Поверхня атаки — це загальна кількість можливих уразливостей інформаційної системи. Поверхні атаки включають
      будь-які доступні області, де слабкі місця або недоліки в апаратному, програмному та мікропрограмному забезпеченні надають
      зловмисникам можливість використовувати вразливості. Огляди поверхонь атак гарантують, що розробники аналізують зміни
      в проектуванні та реалізації систем і пом’якшують вектори атак, створені в результаті змін. Виправлення виявлених недоліків
      включає скасування небезпечних функцій.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:sa-11.7
    ref_id: SA-11(7)
    name: Тестування та оцінювання розробника — Перевірка обсягу тестування та оцінювання
    category: technical
    csf_function: protect
    description: 'Вимагати від розробника системи, системного компонента або системної служби перевіряти, що обсяг тестування
      й оцінювання забезпечує повне охоплення необхідних засобів захисту та приватності на [Призначення: визначену організацією
      глибину тестування та оцінювання].
  
  
  
      Параметри:
  
  
      1. Призначення: визначену організацією глибину тестування та оцінювання'
    annotation: Перевірка того, що тестування та оцінювання забезпечують повне охоплення необхідних заходів захисту, які можна
      здійснити за допомогою різноманітних аналітичних методів, починаючи від неофіційних до формальних. Кожен з цих методів
      забезпечує зростаючий рівень впевненості, який відповідає ступеню формальності аналізу. Суворе охоплення заходів захисту
      на найвищих рівнях надійності може бути досягнуто за допомогою формальних методів моделювання та аналізу, включаючи кореляцію
      між впровадженими заходами захисту та відповідними тестовими випадками.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:sa-11.8
    ref_id: SA-11(8)
    name: Тестування та оцінювання розробника — Динамічний аналіз коду
    category: technical
    csf_function: protect
    description: Вимагати від розробника системи, системного компонента або системної служби використовувати динамічні інструменти
      аналізу коду для виявлення загальних недоліків та документування результатів аналізу.
    annotation: Динамічний аналіз коду забезпечує перевірку програмного забезпечення під час виконання за допомогою інструментів,
      здатних контролювати програми на предмет пошкодження пам’яті, проблем із привілеями користувачів та інших потенційних
      проблем безпеки. Динамічний аналіз коду використовує інструменти виконання, щоб гарантувати, що функціональні можливості
      безпеки працюють так, як вони були розроблені. Тип динамічного аналізу, відомий як фаз-тестування, викликає збої програм
      шляхом навмисного введення неправильних або випадкових даних у програми. Стратегії фаз-тестування виводяться з передбачуваного
      використання програм, а також функціональних і проектних специфікацій для програм. Щоб зрозуміти обсяг динамічного аналізу
      коду та надану гарантію, організації також можуть розглянути можливість проведення аналізу охоплення коду (тобто перевірки
      ступеня коду за допомогою таких показників, як відсоток перевірених підпрограм або відсоток операторів програми, викликаних
      під час виконання набору тестів) та/або аналіз узгодженості (тобто перевірка слів, які не є доречними в коді програмного
      забезпечення, наприклад слів неанглійською мовою або образливих термінів).
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:sa-11.9
    ref_id: SA-11(9)
    name: Тестування та оцінювання розробника — Інтерактивне тестування безпеки додатків
    category: technical
    csf_function: protect
    description: Вимагати від розробника системи, системного компонента або системної служби використання інтерактивних інструментів
      тестування безпеки програми для виявлення недоліків і документування результатів.
    annotation: Інтерактивне тестування безпеки додатків (також відоме як інструментальне) — це метод виявлення вразливостей
      шляхом спостереження за додатками під час тестування на предмет їх виконання. Використання інструментарію базується на
      прямих вимірюваннях фактично запущених додатків і використовує доступ до коду, взаємодії з користувачем, бібліотек, фреймворків,
      підключень і конфігурацій для безпосереднього вимірювання ефективності керування. У поєднанні з методами аналізу інтерактивне
      тестування безпеки програми може виявити широкий спектр потенційних вразливостей і підтвердити ефективність контролю.
      Тестування на основі інструментів працює в режимі реального часу та може використовуватися безперервно протягом життєвого
      циклу розробки системи.
