name: НД ТЗІ 3.6-006-24 — Каталог заходів захисту
description: 'Каталог заходів захисту з НД ТЗІ 3.6-006-24 (український переклад каталогу NIST SP 800-53 rev5). Наразі
  містить родини: AC (Управління доступом), AT (Обізнаність та навчання), AU (Аудит та підзвітність), CA (Оцінювання,
