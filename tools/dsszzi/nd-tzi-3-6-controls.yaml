  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:cm-2.2
    ref_id: CM-2(2)
    name: Базова конфігурація — Автоматизація точності та актуальності
    category: technical
    csf_function: protect
    description: 'Підтримувати актуальність, повноту, точність і доступність базової конфігурації системи за допомогою
      [Призначення: автоматизовані механізми, визначені організацією].


      Параметри:

      1. Призначення: автоматизовані механізми, визначені організацією'
    annotation: 'Автоматизовані механізми, що допомагають організаціям підтримувати послідовну базову конфігурацію,
      можуть охоплювати: апаратні та програмні засоби інвентаризації, засоби управління конфігурацією та засоби
      управління мережею. Такі інструменти можуть бути використані як загальні елементи управління на системному
      рівні, або на рівні операційної системи чи компонентів (наприклад, на робочих станціях, серверах, ноутбуках,
      мережевих компонентах або мобільних пристроях). Інструменти можна використовувати для відстеження номерів
      версій в операційних системах, застосунках, типах встановленого програмного забезпечення тощо. Це посилення
      заходу може бути забезпечене вимогами заходу безпеки CM-8 (2) для організацій, які поєднують інвентаризацію
      компонентів системи і базову конфігурацію.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:cm-2.3
    ref_id: CM-2(3)
    name: Базова конфігурація конфігурацій
    category: process
    csf_function: protect
    description: 'Зберігати [Призначення: кількість, визначена організацією] попередніх версій базових конфігурацій
      системи для підтримки відкату.


      Параметри:

      1. Призначення: кількість, визначена організацією'
    annotation: Зберігання попередніх версій базових конфігурацій для підтримки відкату включає апаратне і програмне
      забезпечення, мікропрограми, файли конфігурації, записи конфігурації та відповідну документацію.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:cm-2.4
    ref_id: CM-2(4)
    name: Базова конфігурація забезпечення
    category: process
    csf_function: protect
