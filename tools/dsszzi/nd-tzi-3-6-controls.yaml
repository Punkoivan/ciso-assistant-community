    description: Встановити та явно авторизувати користувачів, яким дозволено самостійно налаштовувати можливості
      бездротових мереж.
    annotation: Уповноваженим користувачам може бути дозволено налаштовувати можливості бездротових мереж у рамках
      чинних механізмів управління доступом.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ac-18.5
    ref_id: AC-18(5)
    name: Бездротовий доступ — Антени та рівень потужності передачі
    category: technical
    csf_function: protect
    description: Вибрати радіоантени та калібрувати рівень потужності передачі, щоб зменшити ймовірність того, що
      сигнали від бездротових точок доступу можуть бути отримані за межами контрольованих організацією меж.
    annotation: 'Дії, що можуть бути вжиті для обмеження несанкціонованого використання бездротового зв’язку поза
      межами контрольованих меж, охоплюють: зменшення потужності бездротових передач (для зниження ймовірності випромінювання
      сигналу поза фізичним периметром організації); застосування заходів контролю бездротових випромінювань;

      використання спрямованих або променевих форматних антен, які знижують імовірність того, що сторонні приймачі
      зможуть перехоплювати сигнали.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ac-19
    ref_id: AC-19
    name: Контроль доступу для мобільних пристроїв
    category: technical
    csf_function: protect
    description: 'a. Встановити обмеження на використання, вимоги до конфігурації, вимоги до підключення і рекомендації
      щодо впровадження мобільних пристроїв, контрольованих організацією.


      b. Авторизувати підключення мобільних пристроїв до систем, які експлуатуються організацією.'
    annotation: 'Мобільний пристрій — це обчислювальний пристрій, який:

      має малий форм-фактор; може легко транспортуватися однією особою; призначений для роботи без фізичного з’єднання;
      володіє локальним сховищем даних; має автономне джерело живлення. Функціональність мобільного пристрою може
      містити можливості голосового зв’язку, вбудовані датчики, які дозволяють пристрою отримувати інформацію, та/або
      вбудовані функції для синхронізації місцевих даних.

      Прикладами можуть виступати смартфони, електронні зчитувачі та планшети.

      Мобільні пристрої, як правило, асоціюються з однією особою, і зазвичай мобільний пристрій перебуває поруч
      з особою. Однак ступінь близькості може змінюватися залежно від форм-фактора та розміру пристрою. Контрольовані
      райони — це зони, для


      яких може бути забезпечена відповідність вимогам, встановленим для захисту інформації та систем (за допомогою
      фізичних чи процедурних заходів).


      Через велику різноманітність мобільних пристроїв з різними характеристиками та можливостями організаційні
      обмеження можуть відрізнятися для різних класів/типів таких пристроїв. Обмеження використання мобільних пристроїв
      можуть містити:

      управління конфігурацією, ідентифікацію та автентифікацію пристрою, інсталяцію (з подальшим обов’язковим оновленням)
      обов’язкового антивірусного програмного забезпечення, сканування пристроїв на наявність шкідливого коду, сканування
      критичних оновлень програмного, проведення перевірок цілісності первинної операційної системи (та, можливо,
      іншого програмного забезпечення) та відключення зайвого обладнання.


      Обмеження щодо використання та дозвіл на підключення можуть залежати від конкретних систем. Наприклад, підключення
      мобільних пристроїв до організаційної мережі може бути дозволено при виконанні набору обмежень щодо використання,
      або система може відмовитись від авторизації підключення мобільних пристроїв до конкретних програм, або система
      може встановити додаткові обмеження використання перед тим, як дозволити підключення мобільних пристроїв до
      системи. Питання забезпечення належної безпеки для мобільних пристроїв виходить за рамки вимог цього заходу
      безпеки. Багато вимог для мобільних пристроїв містяться в інших засобах безпеки (передбачається виділення
      на початку вихідних точок для розробки планів безпеки з подальшою адаптацією). Захід безпеки AC-20 стосується
      мобільних пристроїв, які не контролюються організацією.'
