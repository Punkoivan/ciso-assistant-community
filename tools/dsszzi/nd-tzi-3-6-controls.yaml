    description: Відключати, у разі відсутності необхідності у використанні, вбудовані в системні компоненти можливості
      бездротових мереж до їх виклику та розгортання.
    annotation: 'Бездротові мережі, вбудовані в системні компоненти, є значною потенційною вразливістю, якою можуть
      скористатися зловмисники.

      Вимкнення бездротових можливостей, коли вони не потрібні для виконання важливих місій або функцій організації,
      може зменшити сприйнятливість до загроз з боку зловмисників.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ac-18.4
    ref_id: AC-18(4)
    name: Бездротовий доступ — Обмеження налаштування користувачами
