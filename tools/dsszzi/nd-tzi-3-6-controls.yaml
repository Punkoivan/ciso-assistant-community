    annotation: Механізми одностороннього потоку також можуть називатися односпрямованою мережею, односпрямованим
      шлюзом безпеки або діодом даних. Механізми одностороннього потоку можна використовувати, щоб запобігти експорту
      даних із домену або системи з більшим впливом або класифікованим, одночасно дозволяючи імпортувати дані з
      системи з меншим впливом або з некласифікованого домену.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ac-4.8
    ref_id: AC-4(8)
    name: Управління інформаційними потоками — Фільтри політики безпеки
    category: technical
    csf_function: protect
    description: 'a) Забезпечити контроль над потоком інформації, використовуючи [Призначення: визначені організацією
      фільтри безпеки або політики конфіденційності] як основу для рішень щодо керування потоком для [Призначення:
      визначені організацією потоки інформації];


      b) [Вибір (один або кілька): Блокування; Зміна; Карантин] даних після помилки обробки фільтра відповідно до
      [Призначення: політика безпеки або конфіденційності, визначена організацією].


      Параметри:

      1. Призначення: визначені організацією фільтри безпеки або політики конфіденційності

      2. Призначення: визначені організацією потоки інформації

      3. Вибір (один або кілька): Блокування; Зміна; Карантин

      4. Призначення: політика безпеки або конфіденційності, визначена організацією'
    annotation: Фільтри політик безпеки стосуються як структури даних, так і вмісту. Наприклад, фільтри політик
      безпеки щодо структур даних можуть накладати обмеження на максимальну довжину файлів, максимальний розмір
      поля та типи даних/файлів. Фільтри політик безпеки щодо вмісту даних можуть перевіряти наявність певних значень
      або діапазонів даних і вмісту. Вміст структурованих даних може інтерпретуватися застосунками. До неструктурованих
      даних належить цифрова інформація без структури даних або з такою структурою, яка не може бути оброблена відповідно
      до визначеного набору правил (растрові зображення, відео, аудіоконтейнери, рукописні тексти тощо). Кількість
      фільтрів, яка впроваджується, має залежати від цілей управління.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ac-4.9
