  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ac-4.13
    ref_id: AC-4(13)
    name: Управління інформаційними потоками — Декомпозиція на відповідні політиці субкомпоненти
    category: technical
    csf_function: protect
    description: 'При передачі інформації між різними захищеними доменами здійснювати декомпозицію інформації на
      [Призначення: визначені організацією субкомпоненти, що відповідають політиці] для представлення в механізмах
      реалізації політики.


      Параметри:

      1. Призначення: визначені організацією субкомпоненти, що відповідають політиці'
    annotation: Механізми виконання політики можуть застосовувати правила фільтрації до відповідних підкомпонентів
      інформації для полегшення управління потоком. Декомпозиція файлів полегшує рішення щодо політики, сертифікатів,
      класифікації, вкладених файлів та інших диференціаторів компонентів щодо безпеки.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ac-4.14
    ref_id: AC-4(14)
    name: Управління інформаційними потоками — Обмеження фільтра політики безпеки
    category: technical
    csf_function: protect
    description: 'При передачі інформації між різними захищеними доменами реалізувати [Призначення: визначені організацією
      фільтри політики безпеки], що вимагають повного переліку форматів, які обмежують структуру та зміст даних.


      Параметри:

      1. Призначення: визначені організацією фільтри політики безпеки'
    annotation: 'Структурування даних і обмеження вмісту зменшують діапазон потенційно шкідливого чи несанкціонованого
      вмісту в міждоменних транзакціях. Фільтри політики безпеки, що обмежують структуру даних, можуть містити обмеження
      розмірів файлів та довжини поля. Фільтри політики безпеки щодо вмісту даних можуть охоплювати: формати кодування;
      обмеження символьних полів (наприклад наявність лише буквено-цифрових символів);

      заборону використання спеціальних символів; валідацію структур тощо.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ac-4.15
    ref_id: AC-4(15)
    name: Управління інформаційними потоками — Виявлення несанкціонованої інформації
    category: technical
    csf_function: protect
    description: 'При передачі інформації між різними захищеними доменами перевіряти інформацію на наявність [Призначення:
      визначеної організацією несанкціонованої інформації] та забороняти передачу такої інформації відповідно до
      [Призначення: визначеної організацією політики безпеки].


      Параметри:

      1. Призначення: визначеної організацією несанкціонованої інформації

      2. Призначення: визначеної організацією політики безпеки'
    annotation: Несанкціонована інформація може включати зловмисний код, інформацію, яку не можна оприлюднити з
      вихідної мережі, або виконуваний код, який може порушити або зашкодити службам або системам мережі.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ac-4.16
    ref_id: AC-4(16)
    name: Управління інформаційними потоками — Передача інформації про взаємопов’язані системи
    category: technical
    csf_function: protect
    description: '[Вилучено: включено до AC-4].'
    annotation: null
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ac-4.17
    ref_id: AC-4(17)
    name: Управління інформаційними потоками — Автентифікація домену
    category: technical
    csf_function: protect
    description: 'Унікально ідентифікувати й автентифікувати джерела та пункти призначення за допомогою [Вибір (один
      або декілька): організації, системи, програми, служби, індивідуума] для передачі інформації.


      Параметри:

      1. Вибір (один або декілька): організації, системи, програми, служби, індивідуума'
    annotation: Процедура призначення атрибутів є найважливішим компонентом концепції безпеки операцій. Можливість
      ідентифікації джерела та пунктів призначення потоку інформації в системах дозволяє в разі необхідності проводити
      реконструкцію подій і може встановити порушників, що своєю чергою заохочує посадових осіб дотримуватися політики.
      Успішна автентифікація домену вимагає, щоб мітки системи розрізняли системи, організації та осіб, які беруть
      участь у підготовці, передачі, отриманні чи поширенні інформації. Процедура призначення атрибутів також дозволяє
      краще обробляти персональну інформацію, що проходить через системи, і полегшувати відстеження згоди, запитів
      на виправлення, видалення або доступу від окремих осіб.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ac-4.18
    ref_id: AC-4(18)
    name: Управління інформаційними потоками — Прив’язка атрибуту безпеки
    category: technical
    csf_function: protect
    description: '[Вилучено: включено в AC-16].'
    annotation: null
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ac-4.19
    ref_id: AC-4(19)
    name: Управління інформаційними потоками — Перевірка метаданих
    category: technical
    csf_function: protect
    description: Під час передачі інформації між різними захищеними доменами застосовувати до метаданих ту ж політику
      безпеки фільтрації, що й для корисних даних.
    annotation: 'Це посилення заходу вимагає перевірки метаданих на рівні з даними, до яких вони застосовуються.
      Метадані можуть вноситися або не вноситися до складу корисного навантаження даних. Незалежно від цього, уся
      інформація (включно з метаданими та даними, до яких вони застосовуються)

      підлягає фільтруванню та перевірці.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ac-4.20
    ref_id: AC-4(20)
    name: Управління інформаційними потоками — Затверджені рішення
    category: technical
    csf_function: protect
    description: 'Впровадити [Призначення: визначені організацією рішення про схвалені конфігурації] для керування
      потоком [Призначення: інформації, визначеної організацією] через захищені домени.


      Параметри:

      1. Призначення: визначені організацією рішення про схвалені конфігурації

      2. Призначення: інформації, визначеної організацією'
    annotation: Затверджені рішення та конфігурації в міждоменній політиці та керівництвах відповідно до типів потоків
      інформації можуть визначатися через межі класифікації. Наявність єдиного кросс-доменного менеджменту може
      забезпечити базовий список затверджених рішень для міждоменних рішень.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ac-4.21
    ref_id: AC-4(21)
    name: Управління інформаційними потоками — Фізичне та логічне відділення інформаційних потоків
    category: technical
    csf_function: protect
    description: 'Відокремлювати потоки інформації логічно або фізично, використовуючи [Призначення: визначені організацією
      механізми та/або методи] для досягнення [Призначення: визначеного організацією необхідного поділу за типами
      інформації].


      Параметри:

      1. Призначення: визначені організацією механізми та/або методи

      2. Призначення: визначеного організацією необхідного поділу за типами інформації'
    annotation: 'Відокремлення інформаційних потоків за типом може підвищити захист, гарантуючи, що інформація не
      перемішується під час передачі. Це дозволить управляти шляхами передачі потоку (за неможливості організації
      іншого виду управління). Типи, за якими інформація може відокремлюватися: вхідний і вихідний трафік, запити
      на послуги та відповіді й інформацію, яка належить до різних категорій безпеки.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ac-4.22
    ref_id: AC-4(22)
    name: Управління інформаційними потоками — Єдиний доступ
    category: technical
    csf_function: protect
    description: Забезпечити доступ з одного пристрою до обчислювальних платформ, застосунків або даних, що розташовуються
      в декількох різних захищених доменах, одночасно запобігаючи передачі будь-якого потоку інформації між різними
      захищеними доменами.
    annotation: Наприклад, забезпечення єдиного робочого стола для доступу користувачів до кожного підключеного
      домену безпеки, не надаючи механізмів, що дозволяють переносити інформацію між різними доменами безпеки.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ac-4.23
    ref_id: AC-4(23)
    name: Управління інформаційними потоками — Модифікована інформація, яка не підлягає оприлюдненню
    category: technical
    csf_function: protect
    description: 'Під час передачі інформації між різними доменами безпеки змінюйте інформацію, яка не підлягає
      оприлюдненню, реалізувавши [Призначення:

      визначена організацією дія модифікації]


      Параметри:

      1. Призначення: визначена організацією дія модифікації'
    annotation: Зміна інформації, яка не підлягає оприлюдненню, може допомогти запобігти витоку даних або атаці,
      коли інформація передається між доменами безпеки. Дії модифікації включають маскування, перестановку, зміну,
      видалення або редагування.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ac-4.24
    ref_id: AC-4(24)
    name: Управління інформаційними потоками — Внутрішній нормалізований формат
    category: technical
    csf_function: protect
    description: Під час передачі інформації між різними доменами безпеки аналізуйте вхідні дані у внутрішньому
      нормалізованому форматі та повторно генеруйте дані, щоб вони відповідали призначеній специфікації.
    annotation: Перетворення даних у нормалізовані форми є одним із найбільш ефективних механізмів для припинення
      зловмисних атак і викрадання великих класів даних.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ac-4.25
    ref_id: AC-4(25)
    name: Управління інформаційними потоками — Очищення даних
    category: technical
    csf_function: protect
    description: 'Під час передачі інформації між різними доменами безпеки очищуйте дані, щоб мінімізувати [Вибір
      (один або кілька): доставка зловмисного вмісту, керування та керування зловмисним кодом, доповнення зловмисного
      коду та стеганографічно закодовані дані; витік конфіденційної інформації] відповідно до [Призначення: політика,
      визначена організацією]].


      Параметри:

      1. Вибір (один або кілька): доставка зловмисного вмісту, керування та керування зловмисним кодом, доповнення
      зловмисного коду та стеганографічно закодовані дані; витік конфіденційної інформації

      2. Призначення: політика, визначена організацією'
    annotation: Очищення даних — це процес безповоротного видалення або знищення даних, що зберігаються на пристрої
      пам’яті (наприклад, на жорстких дисках, флеш-пам’яті/твердотільних накопичувачах, мобільних пристроях, компакт-дисках
      і DVD-дисках) або у вигляді паперових копій.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ac-4.26
    ref_id: AC-4(26)
    name: Управління інформаційними потоками — Дії з фільтрації аудиту
    category: technical
    csf_function: protect
    description: Під час передачі інформації між різними доменами безпеки записуйте та перевіряйте дії фільтрації
      вмісту та результати для інформації, що фільтрується.
    annotation: 'Фільтрування вмісту — це процес перевірки інформації під час проходження міждоменного рішення та
      визначення відповідності інформації попередньо визначеній політиці. Дії фільтрації вмісту та результати дій
      фільтрації записуються для окремих повідомлень, для визначення правильності застосованих дій фільтра. Звіти
      про вміст фільтрів використовуються, щоб допомогти у вирішенні проблем, наприклад, визначаючи, чому вміст
      повідомлення було змінено та/або чому він не пройшов процес фільтрації. Події аудиту визначені в AU-2. Записи
      аудиту створюються в

      AU-12.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ac-4.27
    ref_id: AC-4(27)
    name: Управління інформаційними потоками — Надлишкові/незалежні фільтруючі механізми
    category: technical
    csf_function: protect
    description: Під час передачі інформації між різними доменами безпеки впроваджуйте рішення фільтрації вмісту,
      які забезпечують надлишкові та незалежні механізми фільтрації для кожного типу даних.
    annotation: 'Фільтрування вмісту — це процес перевірки інформації під час проходження міждоменного рішення та
      визначення відповідності інформації попередньо визначеній політиці. Надлишкова та незалежна фільтрація вмісту
      усуває єдину систему фільтрації збоїв.

      Незалежність визначається як реалізація фільтра вмісту, який використовує іншу кодову базу та допоміжні бібліотеки
      (наприклад, два фільтри JPEG із використанням бібліотек JPEG різних постачальників) і кілька незалежних процесів
      системи.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ac-4.28
    ref_id: AC-4(28)
    name: Управління інформаційними потоками — Лінійні фільтрувальні канали
    category: technical
    csf_function: protect
    description: Під час передачі інформації між різними доменами безпеки запровадьте конвеєр лінійного фільтрування
      вмісту, який забезпечується дискреційним і обов’язковим контролем доступу.
    annotation: Фільтрування вмісту — це процес перевірки інформації під час проходження міждоменного рішення та
      визначення відповідності інформації попередньо визначеній політиці. Використання конвеєрів лінійного фільтрування
      вмісту гарантує, що процеси фільтрації не можна обійти. Загалом, використання архітектур паралельної фільтрації
      для фільтрації вмісту одного типу даних створює проблеми з обходом і невикликом.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ac-4.29
    ref_id: AC-4(29)
    name: Управління інформаційними потоками — Фільтр механізмів оркестровки
    category: technical
    csf_function: protect
    description: 'Під час передачі інформації між різними доменами безпеки використовуйте механізми оркестровки
      фільтрів вмісту, щоб забезпечити:


      a. Механізми фільтрації вмісту успішно завершують виконання без помилок;


      b. Дії фільтрації вмісту виконуються в правильному порядку та відповідають [Призначення: політика, визначена
      організацією]


      Параметри:

      1. Призначення: політика, визначена організацією'
    annotation: Фільтрування вмісту — це процес перевірки інформації під час проходження міждоменного рішення та
      визначення відповідності інформації попередньо визначеній політиці безпеки. Механізм оркестровки координує
      послідовність дій (ручну та автоматизовану) у процесі фільтрації вмісту. Помилки визначаються як аномальні
      дії або несподіване завершення процесу фільтрації вмісту. Це не те саме, що вміст, який не вдається відфільтрувати
      через невідповідність політиці. Звіти фільтрів вмісту – це механізм, який зазвичай використовується для забезпечення
      успішного виконання очікуваних дій фільтрації.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ac-4.30
    ref_id: AC-4(30)
    name: Управління інформаційними потоками — Механізми фільтрації з використанням кількох процесів
    category: technical
    csf_function: protect
    description: Під час передачі інформації між різними доменами безпеки реалізуйте механізми фільтрації вмісту
      за допомогою кількох процесів.
    annotation: Використання кількох процесів для впровадження механізмів фільтрації вмісту зменшує ймовірність
      єдиної точки збою.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ac-4.31
    ref_id: AC-4(31)
    name: Управління інформаційними потоками — Запобігання спробам передачі вмісту, який не пройшов перевірку фільтрації
    category: technical
    csf_function: protect
    description: Під час передачі інформації між різними доменами безпеки запобігайте передачі вмісту, який не пройшов
      перевірку фільтрації до домену-одержувача.
    annotation: Вміст, який не пройшов перевірку фільтрації, може пошкодити систему, якщо його передати в домен-одержувач.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ac-4.32
    ref_id: AC-4(32)
    name: Управління інформаційними потоками — Вимоги до процесу передачі інформації
    category: technical
    csf_function: protect
    description: 'Під час передачі інформації між різними доменами безпеки, процес, який передає інформацію між
      конвеєрами фільтрації:


      a. не фільтрує вміст повідомлення;

      b. перевіряє метадані фільтрації;

      c. забезпечує успішне завершення фільтрації вмісту, пов’язаного з метаданими фільтрації; і

      d. передає вміст до цільового фільтруючого конвеєра.'
    annotation: Процеси, що передають інформацію між фільтруючими конвеєрами, повинні мати мінімальну складність
      і функціональність для гарантування того, що процеси працюють правильно.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ac-5
    ref_id: AC-5
    name: Розмежування обов’язків
    category: process
    csf_function: protect
    description: 'a. Розмежувати і документувати [Призначення: визначені організацією обов’язки окремих осіб].


      b. Установити правила авторизації доступу для підтримки розмежування обов’язків.


      Параметри:

      1. Призначення: визначені організацією обов’язки окремих осіб'
    annotation: Розмежування обов’язків запобігає можливості зловживання уповноваженими привілеями та сприяє зниженню
      ризику зловмисної діяльності без змови. Розмежування обов’язків може охоплювати розподіл функцій, включно
      з функціями підтримки системи, між різними особами та/або ролями, а також забезпеченням того, щоб персонал
      служби безпеки, який здійснює функції управління доступом, не виконував функції аудиту. При розробці політики
      розмежування доступу необхідно проводити аналіз всієї організаційної системи та її компонентів. Розподіл обов’язків
      забезпечується діями керування обліковими записами в AC-2, механізмами контролю доступу в AC-3 та діями керування
      ідентифікацією в ІА-2, ІА-4 та ІА-12.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ac-6
    ref_id: AC-6
    name: Мінімізація повноважень
    category: technical
    csf_function: protect
    description: Впровадити принцип мінімізації повноважень, який дозволяє користувачам (або процесам, що діють
      від імені користувачів) здійснювати лише такі авторизовані звернення, які необхідні для виконання визначених
      завдань відповідно до цілей (призначення, місії) організації та функцій.
    annotation: Рекомендується запровадження принципу мінімізації повноважень для конкретних обов’язків і систем.
      Принцип мінімізації повноважень застосовується також до процесів системи для забезпечення їхнього функціонування
      на рівнях привілеїв не вищих, ніж це необхідно для виконання ї функцій організації. Для досягнення мінімізації
      повноважень може розглядатися потреба у виділенні додаткових процесів, ролей або облікових записів системи.
      Принцип мінімізації повноважень також застосовується щодо розробки, впровадження та функціонування систем
      організації.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ac-6.1
    ref_id: AC-6(1)
    name: Мінімізація повноважень — Авторизований доступ до функцій безпеки
    category: technical
    csf_function: protect
    description: 'Авторизуваний доступ для [Призначення: особи або ролі, визначені організацією] до:


      a) [Призначення: функції безпеки, визначені організацією (розгорнуті в апаратному, програмному та мікропрограмному
      забезпеченні)];


      b) [Призначення: визначена організацією інформація, необхідна для забезпечення безпеки].


      Параметри:

      1. Призначення: особи або ролі, визначені організацією

      2. Призначення: функції безпеки, визначені організацією (розгорнуті в апаратному, програмному та мікропрограмному
      забезпеченні)

      3. Призначення: визначена організацією інформація, необхідна для забезпечення безпеки'
    annotation: Функції захисту можуть охоплювати встановлення облікових записів системи; налаштування авторизацій
      доступу (тобто дозволів, привілеїв); визначення подій, що підлягають аудиту, та встановлення параметрів виявлення
      вторгнень. Інформація, що стосується безпеки, може містити правила фільтрації маршрутизаторів/брандмауерів,
      інформацію про управління криптографічними ключами, параметри конфігурації служб безпеки та списки контролю
      доступу. До уповноваженого персоналу можуть належати адміністратори безпеки, системні адміністратори й адміністратори
      мереж, працівники служби захисту інформації, персонал з обслуговування системи, системні програмісти та інші
      привілейовані користувачі.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ac-6.2
    ref_id: AC-6(2)
    name: Мінімізація повноважень — Непривілейований доступ до незахищених функцій
    category: technical
    csf_function: protect
    description: 'Вимагати від користувачів облікових записів системи або ролей, які мають доступ до [Призначення:
      визначених організацією функцій безпеки або інформації, що стосується безпеки], використовувати непривілейовані
      облікові записи чи ролі під час доступу до незахищених функцій.


      Параметри:

      1. Призначення: визначених організацією функцій безпеки або інформації, що стосується безпеки'
    annotation: 'Це посилення заходу обмежує сферу дії під час роботи з привілейованих облікових записів або ролей.
      Впровадження ролей організується в разі реалізації рольової політики контролю доступу (rolle-based).

      При цьому зміна ролі має гарантувати однаковий ступінь зміни дозволів на доступ як для користувача, так і
      для всіх процесів від його імені аналогічно тому, якби це було передбачено зміною привілейованого облікового
      запису на непривілейований.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ac-6.3
    ref_id: AC-6(3)
    name: Мінімізація повноважень — Мережевий доступ до привілейованих команд
    category: technical
    csf_function: protect
    description: 'Авторизувати мережевий доступ до [Призначення: визначених організацією привілейованих команд]
      тільки для [Призначення: визначених організацією невідкладних операційних потреб] та задокументувати обґрунтування
      необхідності такого доступу в плані безпеки системи.


      Параметри:

      1. Призначення: визначених організацією привілейованих команд

      2. Призначення: визначених організацією невідкладних операційних потреб'
    annotation: Мережевий доступ — це будь-який доступ через мережеве з’єднання (тобто коли користувач не має фізичного
      доступу, наприклад, до робочої станції).
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ac-6.4
    ref_id: AC-6(4)
    name: Мінімізація повноважень — Роздільні домени обробки
    category: technical
    csf_function: protect
    description: Надати окремі домени обробки даних для забезпечення більш точного розподілу повноважень користувача.
    annotation: Забезпечення роздільних доменів обробки для розподілу привілеїв користувача може містити використання
      віртуальних машин для надання додаткових привілеїв користувачу, при цьому обмежуючи привілеї інших віртуальних/фізичних
      машин; використання апаратних/програмних механізмів розділення домену та реалізацію окремих фізичних доменів.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ac-6.5
    ref_id: AC-6(5)
    name: Мінімізація повноважень — Привілейовані облікові записи
    category: technical
    csf_function: protect
    description: 'Обмежити привілейовані облікові записи в системі згідно з [Призначення:

      визначеним організацією персоналом або ролями].


      Параметри:

      1. Призначення: визначеним організацією персоналом або ролями'
    annotation: 'Привілейовані облікові записи можуть містити облікові записи суперкористувачів (наприклад обліковий
      запис системного


      адміністратора) Використання привілейованих облікових записів лише конкретними посадовими особами виключає
      можливість доступу до таких облікових записів всіх інших штатних працівників. Застосування цього посилення
      заходу щодо управління привілеями локальних облікових записів і облікових записів доменів може відрізнятися
      залежно від організаційної структури, за умови збереження можливості контролю конфігурації системи за ключовими
      параметрами безпеки.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ac-6.6
    ref_id: AC-6(6)
    name: Мінімізація повноважень — Привілейований доступ користувачами, що не належать до організації
    category: technical
    csf_function: protect
    description: Заборонити привілейований доступ до системи користувачам, які не належать до організації.
    annotation: Користувач в організації — це працівник або особа, яку організація вважає еквівалентним статусу
      працівника. Організаційні користувачі включають підрядників, запрошених дослідників або окремих осіб з інших
      організацій. Політика та процедури надання статусу співробітників окремим особам включають інформацію про
      громадянство та стосунки з організацією таких осіб.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ac-6.7
    ref_id: AC-6(7)
    name: Мінімізація повноважень — Перегляд повноважень користувача
    category: process
    csf_function: protect
    description: 'a) Переглядати [Призначення: з визначеною організацією частотою] повноваження призначених для
      [Призначення: визначених організацією посад або класів користувачів] для перевірки необхідності таких повноважень;

      b) За необхідності перепризначити або зняти повноваження, для правильного відображення цілей (місії) організації
      та потреб організації.


      Параметри:

      1. Призначення: з визначеною організацією частотою

      2. Призначення: визначених організацією посад або класів користувачів'
    annotation: Потреба в призначених привілеях користувача може змінюватися з часом, відображаючи зміни в цілях
      (місіях) організації і функціях, середовищах роботи, технологіях чи загрозах. Необхідно проводити періодичний
      перегляд призначених привілеїв користувача, щоб визначити, чи залишається обґрунтованим призначення таких
      привілеїв.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ac-6.8
    ref_id: AC-6(8)
    name: Мінімізація повноважень — Рівні привілеїв для виконання коду
    category: technical
    csf_function: protect
    description: 'Запобігати виконанню програмного забезпечення на рівні привілеїв вищому, ніж доступний користувачеві,
      який використовує програмне забезпечення [Призначення: визначене організацією програмне забезпечення].


      Параметри:

      1. Призначення: визначене організацією програмне забезпечення'
    annotation: У певних ситуаціях програмне забезпечення / програмний продукт має виконуватися з підвищеними привілеями
      для виконання необхідних функцій. Однак якщо привілеї, необхідні для виконання, перебувають на вищому рівні,
      ніж привілеї, призначені користувачам, які використовують таке програмне забезпечення / програмний продукт,
      виникає ситуація, що цим користувачам опосередковано надаються більші привілеї, ніж призначені.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ac-6.9
    ref_id: AC-6(9)
    name: Мінімізація повноважень — Аудит використання привілейованих функцій
    category: technical
    csf_function: protect
    description: Реєструвати виконання привілейованих функцій.
    annotation: Навмисне чи ненавмисне зловживання привілейованими функціями уповноваженими користувачами або сторонніми
      організаціями, які мають компрометовані системні облікові записи, є серйозною загрозою та може мати значні
      негативні наслідки для організацій. Аудит використання привілейованих функцій — це один зі способів виявлення
      подібних зловживань, який допомагає зменшити ризик від інсайдерських загроз.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ac-6.10
    ref_id: AC-6(10)
    name: Мінімізація повноважень — Заборона непривілейованим користувачам виконувати привілейовані функції
    category: technical
    csf_function: protect
    description: Вжити заходи для запобігання можливості виконувати привілейовані функції непривілейованими користувачами.
    annotation: 'До привілейованих функцій можуть належати:

      відключення, обхід або зміна впровадженого заходу безпеки, створення облікових записів системи, проведення
      перевірок цілісності системи або адміністрування криптографічних ключів. Непривілейовані користувачі — це
      особи, які не мають відповідних дозволів. Механізми виявлення та запобігання вторгненням або механізми захисту
      від шкідливого коду є прикладами привілейованих функцій, які потребують захисту від непривілейованих користувачів.
      Заборона непривілейованим користувачам у виконанні привілейованих функцій забезпечується AC-3.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ac-7
    ref_id: AC-7
    name: Невдалі спроби входу в систему
    category: technical
    csf_function: protect
    description: 'a. Встановити обмеження на [Призначення: визначену організацією кількість] послідовних неуспішних
      спроб входу користувача в систему впродовж [Призначення: визначеного організацією часового періоду].


      b. Автоматично виконати [Вибір (один або декілька): блокування облікового запису/вузла на [Призначення: визначений
      організацією часовий період]; блокування облікового запису/вузла, доки він не буде розблокований адміністратором;

      затримання наступної команди входу в систему за [Надання: визначеним організацією алгоритмом затримки]; виконати
      [Призначення: визначені організацією дії]], коли перевищено максимальну кількість невдалих спроб входу в систему.


      Параметри:

      1. Призначення: визначену організацією кількість

      2. Призначення: визначеного організацією часового періоду

      3. Вибір (один або декілька): блокування облікового запису/вузла на [Призначення: визначений організацією
      часовий період]; блокування облікового запису/вузла, доки він не буде розблокований адміністратором; затримання
      наступної команди входу в систему за [Надання: визначеним організацією алгоритмом затримки]; виконати [Призначення:
      визначені організацією дії]'
    annotation: 'Необхідність обмежити невдалі спроби входу в систему та вжити подальших заходів, коли максимальна
      кількість спроб входу перевищена, застосовується незалежно від того, через локальне або мережеве з’єднання
      відбувається вхід. Через потенційну відмову в обслуговуванні автоматичне блокування, ініційоване системами,
      зазвичай є тимчасовим і автоматично відновлюється через визначений період часу. Якщо вибрано алгоритм затримки,
      організації можуть використовувати різні алгоритми для різних компонентів системи на основі можливостей цих
      компонентів. Реакція на невдалі спроби входу може бути реалізована на рівні операційної системи та програми.
      Визначені організацією дії, які можуть бути виконані, коли перевищено дозволену кількість спроб входу, включають
      прохання користувача відповісти на секретне запитання на додаток до імені користувача та пароля, виклик режиму
      блокування з обмеженими можливостями користувача (замість повного блокування) , дозволяючи користувачам входити
      лише із вказаних IP-адрес та вимагаючи CAPTCHA для запобігання автоматичним атакам або застосовуючи профілі
      користувачів, такі як місцезнаходження, час доби, IP-адреса, пристрій або MAC-адреса.

      Якщо автоматичне блокування системи або виконання алгоритму затримки не реалізовано, організації розглядають
      комбінацію інших дій, щоб допомогти запобігти атакам грубою силою. На додаток до вищезазначеного, організації
      можуть запропонувати користувачам відповісти на секретне запитання до того, як кількість невдалих спроб входу
      буде перевищена. Автоматичне розблокування облікового запису після певного періоду часу зазвичай не дозволяється.
      Однак можуть знадобитися винятки залежно від операційної місії або потреби.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ac-7.1
    ref_id: AC-7(1)
    name: Невдалі спроби входу в систему — Автоматичне блокування облікового запису
    category: technical
    csf_function: protect
    description: '[Вилучено: включено в AC-7].'
    annotation: null
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ac-7.2
    ref_id: AC-7(2)
    name: Невдалі спроби входу в систему — Очищення або стирання мобільного пристрою
    category: technical
    csf_function: protect
    description: 'Очистити або стерти інформацію з [Призначення: визначених організацією мобільних пристроїв] на
      основі [Призначення: визначених організацією вимог та методик очищення чи стирання] після [Призначення: визначеної
      організацією кількості] послідовних невдалих спроб входу в систему з пристрою.


      Параметри:

      1. Призначення: визначених організацією мобільних пристроїв

      2. Призначення: визначених організацією вимог та методик очищення чи стирання

      3. Призначення: визначеної організацією кількості'
    annotation: Це посилення заходу стосується лише мобільних пристроїв, з яких відбувається вхід. Вхід на мобільний
      пристрій не має означати вхід в обліковий запис. Успішні входи в облікові записи на мобільних пристроях мають
      обнуляти кількість невдалих входів. Якщо інформація на мобільному пристрої захищена досить сильними механізмами
      шифрування, додаткові засоби забілювання інформації можуть бути опущені.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ac-7.3
    ref_id: AC-7(3)
    name: Невдалі спроби входу в систему — Обмеження на спроби біометричного входу
    category: technical
    csf_function: protect
    description: 'Обмежити кількість невдалих спроб входу за допомогою біометрики


      [Призначення: визначена організацією кількість].


      Параметри:

      1. Призначення: визначена організацією кількість'
    annotation: Біометрика має ймовірнісний характер. На успішність автентифікації може впливати безліч факторів,
      включно з ефективністю механізмів порівняння та методів виявлення атак. Відповідно до цих показників має бути
      вибрана відповідна кількість спроб та механізми відмови у вході.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ac-7.4
    ref_id: AC-7(4)
    name: Невдалі спроби входу в систему — Використання альтернативного фактора
    category: technical
    csf_function: protect
    description: 'a) Дозволити використання [Призначення: визначені організацією фактори автентифікації], які відрізняються
      від основних факторів автентифікації після перевищення визначеної організацією кількості послідовних невдалих
      спроб входу в систему;


      b) Обмежити [Призначення: визначена організацією кількість] послідовних невдалих спроб входу за допомогою
      використання альтернативних факторів користувачем протягом [Призначення: визначеного організацією періоду
      часу].


      Параметри:

      1. Призначення: визначені організацією фактори автентифікації

      2. Призначення: визначена організацією кількість

      3. Призначення: визначеного організацією періоду часу'
    annotation: Це посилення заходу дозволяє користувачеві, який випадково був заблокований, використовувати додаткові
      фактори автентифікації для обходу блокування.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ac-8
    ref_id: AC-8
    name: Попередження про використання системи
    category: technical
    csf_function: protect
    description: 'a. Демонструвати користувачам [Призначення: визначене організацією сповіщення або банер про використання
      системи] перед тим, як надавати доступ до системи, що забезпечує безпеку та приватність відповідно до чинних
      законів, нормативних документів, наказів, директив, політик, правил, стандартів і керівних принципів, які
      зазначають, що:


      1. користувачі здійснюють доступ до урядової системи;


      2. використання системи може контролюватися, реєструватися та підлягати аудиту;


      3. несанкціоноване використання системи забороняється та приводить до кримінальної та цивільної відповідальності;


      4. використання системи означає згоду на моніторинг і запис дій користувача.


      b. Зберігати сповіщення або банер на екрані, доки користувачі не визнають умови використання та не приймуть
      явних дій для входу в систему або подальшого доступу до системи.


      c. Для загальнодоступних систем:


      1. демонструвати інформацію про умови використання системи [Призначення:

      визначені організацією умови], перш ніж надавати подальший доступ до загальнодоступної системи;


      2. демонструвати посилання, якщо такі є, на моніторинг, запис або аудит, які узгоджуються з акомодацією приватності
      для таких систем, які зазвичай забороняють такі дії;


      3. мати опис авторизованого використання системи.


      Параметри:

      1. Призначення: визначене організацією сповіщення або банер про використання системи

      2. Призначення: визначені організацією умови'
    annotation: Сповіщення про використання системи можуть бути реалізовані за допомогою повідомлень або банерів
      попередження, що відображаються перед тим, як користувач входить у систему. Сповіщення про використання системи
      мають бути присутніми лише в тому разі, якщо в систему входить користувач (наприклад, такі сповіщення не потрібні,
      якщо до системи звертається процес). На основі оцінки ризику організації розглядають, чи потрібне сповіщення
      про використання вторинної системи для доступу до програм або інших ресурсів системи після початкового входу
      в мережу. Залежно від потреб, сповіщення можуть відображатися декількома мовами.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ac-9
    ref_id: AC-9
    name: Сповіщення про попередній вхід (доступ)
    category: technical
    csf_function: protect
    description: Сповіщати користувача після успішного входу (доступу) до системи про дату та час останнього входу
      (доступу).
    annotation: Цей захід безпеки застосовується при вході до системи користувачів незалежно від типу архітектур.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ac-9.1
    ref_id: AC-9(1)
    name: Сповіщення про попередній вхід (доступ) — Невдалі спроби входу до системи
    category: technical
    csf_function: protect
    description: Сповіщати користувача, після успішного входу/доступу, про кількість невдалих спроб входу/доступу
      після останнього успішного входу/доступу.
    annotation: Інформація про кількість невдалих спроб входу з моменту останнього успішного входу дозволяє користувачеві
      визначити, чи кількість невдалих спроб входу відповідає фактичним спробам користувача.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ac-9.2
    ref_id: AC-9(2)
    name: Сповіщення про попередній вхід (доступ) — Успішні та невдалі спроби входу до системи
    category: technical
    csf_function: protect
    description: 'Сповіщати користувача, після успішного входу/доступу до системи про кількість [Вибір: успішних
      спроб доступу/входу; невдалих спроб входу/доступу;

      обидва варіанти] за [Призначення: визначений організацією період часу].


      Параметри:

      1. Вибір: успішних спроб доступу/входу; невдалих спроб входу/доступу; обидва варіанти

      2. Призначення: визначений організацією період часу'
    annotation: Інформація про кількість успішних і невдалих спроб входу в систему протягом певного періоду часу
      дозволяє користувачеві визначити, чи кількість і тип спроб входу відповідають фактичним спробам користувача.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ac-9.3
    ref_id: AC-9(3)
    name: Сповіщення про попередній вхід (доступ) — Повідомлення про зміни в обліковому записі
    category: technical
    csf_function: protect
    description: 'Сповіщати користувача, після успішного входу/доступу, про внесення змін до [Призначення: певних
      характеристик/параметрів облікового запису користувача, визначених організацією] протягом [Призначення: визначеного
      організацією періоду часу].


      Параметри:

      1. Призначення: певних характеристик/параметрів облікового запису користувача, визначених організацією

      2. Призначення: визначеного організацією періоду часу'
    annotation: Інформація про зміни в пов’язані із безпекою характеристиках облікового запису протягом визначеного
      періоду часу дозволяє користувачам розпізнати, чи зміни були внесені без їх відома.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ac-9.4
    ref_id: AC-9(4)
    name: Сповіщення про попередній вхід (доступ) — Додаткова інформація про вхід
    category: technical
    csf_function: protect
    description: 'Повідомляти користувачеві, після успішного входу/доступу, наступну додаткову інформацію: [Призначення:
      інформація, визначена організацією, яка повинна бути включена на додаток до дати та часу останнього входу/доступу].


      Параметри:

      1. Призначення: інформація, визначена організацією, яка повинна бути включена на додаток до дати та часу останнього
      входу/доступу'
    annotation: Це посилення заходу дозволяє визначати додаткову інформацію, яка повинна надаватися користувачам
      під час входу, включно з, наприклад, місцем останнього входу. Місцеперебування користувача — це інформація,
      яка може бути визначена системами, наприклад, адресами Інтернетпротоколу (IP), з яких відбулися входи в мережу,
      сповіщення локальних систем або ідентифікаторів пристроїв.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ac-10
    ref_id: AC-10
    name: Управління паралельною сесією
    category: technical
    csf_function: protect
    description: 'Обмежити кількість одночасних сеансів для кожного [Призначення: визначеного організацією облікового
      запису та/або типу облікового запису] до [Призначення:


      визначеної організацією кількості].


      Параметри:

      1. Призначення: визначеного організацією облікового запису та/або типу облікового запису

      2. Призначення: визначеної організацією кількості'
    annotation: Організації можуть визначати максимальну кількість одночасних сеансів для облікових записів системи
      у всьому світі, за типом облікового запису, за самим обліковим записом або будь-якою їх комбінацією. Наприклад,
      організації можуть обмежити кількість одночасних сеансів для адміністраторів системи або інших осіб, які працюють
      в особливо чутливих доменах або критично важливих програмах. Керування одночасним сеансом стосується облікових
      записів системи, а не одночасні сеанси окремих користувачів через кілька облікових записів системи.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ac-11
    ref_id: AC-11
    name: Блокування пристрою
    category: technical
    csf_function: protect
    description: 'a. Заборонити подальший доступ до системи шляхом ініціювання блокування пристрою після [Призначення:
      визначеного організацією періоду] бездіяльності або після отримання запиту від користувача.


      b. Зберігати блокування пристрою, поки користувач не відновить доступ, використовуючи встановлені процедури
      ідентифікації та автентифікації.


      Параметри:

      1. Призначення: визначеного організацією періоду'
    annotation: 'Блокування пристроїв — це тимчасові дії, що вживаються для запобігання доступу до інформаційних
      систем у разі, коли користувачі тимчасово припиняють виконання своїх повноважень, але не хочуть виходити із
      системи.

      Блокування пристроїв може бути реалізовано лише за можливості відстежування сеансів. Здебільшого це реалізується
      на рівні операційної системи, але може бути реалізовано на рівні програм. Блокування пристроїв не може бути
      дозволено як заміна виходу із системи в разі, коли є вимоги, наприклад щодо обов’язковості виходу із системи
      в кінці робочого дня.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ac-11.1
    ref_id: AC-11(1)
    name: Блокування пристрою — Приховані дисплеї
    category: technical
    csf_function: protect
    description: Приховувати, через блокування пристрою, інформацію, раніше видиму на дисплеї, із загальнодоступним
      зображенням.
    annotation: На дисплеї блокування можуть відображатися статичні або динамічні зображення, візерунки, фотографічні
      зображення, суцільні кольори, годинник, індикатор ресурсу акумулятора чи порожній екран, який запобігає відображенню
      змістовно критичної інформації.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ac-12
    ref_id: AC-12
    name: Припинення сеансу
    category: technical
    csf_function: protect
    description: 'Сеанс користувача має завершуватися автоматично після [Призначення: визначених організацією умов
      або тригерних подій, що вимагають припинення сеансу].


      Параметри:

      1. Призначення: визначених організацією умов або тригерних подій, що вимагають припинення сеансу'
    annotation: 'На відміну від заходу SC-10 (який стосується відключення мережі), цей захід безпеки стосується
      припинення ініційованих користувачем логічних сеансів. Логічний сеанс (для локального, мережевого та віддаленого
      доступу)

      починається щоразу, коли користувач (або процес, що діє від імені користувача), отримує доступ до системи.
      Такі сеанси користувача можуть бути спинені без припинення мережевих сеансів. Закінчення сеансу припиняє всі
      процеси, пов’язані з логічним сеансом користувача, за винятком тих процесів, які спеціально створені користувачем
      (тобто власником сеансу) для продовження після закінчення сеансу.

      Умови або тригерні події, що вимагають автоматичного припинення сеансу, можуть містити визначені періоди бездіяльності
      користувача, реакції на певні типи інцидентів, обмеження часу використання системи.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ac-12.1
    ref_id: AC-12(1)
    name: Припинення сеансу — Ініційоване користувачем блокування
    category: technical
