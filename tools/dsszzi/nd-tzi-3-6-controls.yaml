  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ac-1
    ref_id: AC-1
    name: Політика та процедури управління доступом
    category: policy
    csf_function: protect
    description: 'a. Розробити, задокументувати та поширити [Призначення: серед визначеного організацією персоналу
      або ролей]:


      1. [Вибір (один або декілька): Рівень організації; Рівень місії/бізнес-процесу;

      рівень системи] політики контролю доступу, яка:


      (a) містить мету, сферу застосування, ролі, відповідальність, зобов’язання керівництва, координацію між організаційними
      підрозділами та систему контролю відповідності (compliances);


      (b) відповідає чинному законодавству, нормативним документам, директивам, нормам, політикам, стандартам і
      керівним документам.


      2. Процедури, що сприяють реалізації політики управління доступом і відповідних заходів управління доступом.

      b. Призначити на посаду [Призначення: визначену організацією посадову особу] для управління, документування
      і розповсюдження політики та процедур контролю доступом.


      c. Переглянути та оновити:


      1. поточну політику управління доступом [Призначення: з визначеною організацією частотою] та [Призначення:
      події, визначені організацією];


      2. поточні процедури управління доступом [Призначення: з визначеною організацією частотою] та [Завдання: події,
      визначені організацією].


      Параметри:

      1. Призначення: серед визначеного організацією персоналу або ролей

      2. Вибір (один або декілька): Рівень організації; Рівень місії/бізнес-процесу; рівень системи

      3. Призначення: визначену організацією посадову особу

      4. Призначення: з визначеною організацією частотою

      5. Призначення: події, визначені організацією'
    annotation: 'Цей захід захисту впроваджує політику та процедури з ефективної реалізації заходів захисту та посилення
      заходів захисту, пов’язаних з управлінням доступом. Важливим фактором формування політики та процедур управління
      доступом є стратегія управління ризиками. Комплексні політики та процедури дозволяють забезпечити виконання
      вимог безпеки та приватності. Політики та процедури безпеки, які сформовані на організаційному рівні, можуть
      вимагати розроблення окремих політик і процедур для компонентів складної системи. Політика конкретного компонента
      системи може бути включена до загальної політики безпеки або бути окремим документом (залежно від рівня складності
      організаційної структури).

      Аналогічно, процедури безпеки можуть бути запроваджені на організаційному рівні та поширюватися на всі компоненти
      (підсистеми) інформаційної системи, або, за необхідності, бути розробленими для специфічних компонентів. Процедури
      мають описувати спосіб реалізації політик, а також засоби контролю за їх виконанням.

      Процедури можуть бути задокументовані в планах захисту інформації та персональних даних або в окремих документах.
      Події, які можуть спричинити оновлення політики та процедур контролю доступу, включають висновки оцінки або
      аудиту, інциденти чи порушення безпеки або зміни в законах, розпорядженнях, директивах, постановах, політиках,
      стандартах і вказівках. Просте повторне встановлення засобів контролю не є заходом чи процедурою організаційної
      політики.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ac-2
    ref_id: AC-2
    name: Управління обліковими записами
    category: technical
    csf_function: protect
    description: 'a. Визначити та задокументувати типи облікових записів системи, дозволених для використання в
      ІС для підтримки цілей, завдань, функцій і процесів організації.


      b. Призначити менеджерів облікових записів для управління системними обліковими записами.


      c. Створити умови для групового та рольового членства.


      d. Визначити авторизованих користувачів інформаційної системи, членство в групі та ролі, а також дозволи доступу
      (наприклад, привілеї) та інші атрибути (за потреби)

      для кожного облікового запису.


      e. Вимагати схвалення [Призначення: визначеною організацією відповідальною особою або роллю] запитів на створення
      облікових записів системи.


      f. Створювати, активувати, змінювати, деактивувати та видаляти системні облікові записи відповідно до [Призначення:
      визначених організацією політики, процедур та умов].


      g. Впровадити моніторинг використання облікових записів системи.


      h. Повідомляти адміністраторів облікових записів у межах [Призначення: визначеного організацією часового періоду
      для кожної ситуації]:


      1. коли облікові записи більше не потрібні;


      2. коли користувачі звільнені чи переведені;


      3. коли використовуються індивідуальні системи або наявні зміни, які потребують нових знань.


      i. Авторизувати доступ до системи на основі:


      1. Дійсної авторизації доступу.


      2. Передбачуваного використання системи.


      3. Інших атрибутів, що вимагаються організацією.


      j. Проводити перегляд облікових записів на відповідність вимогам управління обліковими записами з [Призначення:
      визначеною організацією частотою].


      k. Впровадити процес повторного випуску облікових даних спільного/групового облікового запису (якщо він буде
      розгорнутий), коли особи виходять з групи.


      l. Узгодити процеси управління обліковими записами з процесами звільнення та переводу (передачі повноважень)
      персоналу.


      Параметри:

      1. Призначення: визначеною організацією відповідальною особою або роллю

      2. Призначення: визначених організацією політики, процедур та умов

      3. Призначення: визначеного організацією часового періоду для кожної ситуації

      4. Призначення: визначеною організацією частотою'
    annotation: 'Типи облікових записів системи містять, наприклад, індивідуальний, спільний, груповий, системний,
      гостьовий, анонімний, запис розробника/виробника/постачальника, екстрений, тимчасовий. Ідентифікація авторизованих
      користувачів системи та специфікація привілеїв доступу мають відображати вимоги, що містяться в інших елементах
      управління. Користувачі, які потребують адміністративних привілеїв на облікових записах системи, повинні проходити
      додаткову перевірку відповідальною за затвердження таких облікових записів особою (власник системи або адміністратор
      безпеки). Організації можуть визначати привілеї доступу чи інші атрибути безпосередньо за обліковим записом,
      типом облікового запису або комбінацією обох. Інші атрибути, необхідні для авторизації доступу, містять, наприклад,
      обмеження часу чи дня тижня. Для визначення інших атрибутів облікових записів організаціям необхідно враховувати
      системні вимоги та вимоги організації. Неврахування цих факторів може вплинути на доступність системи.


      Тимчасові та екстрені облікові записи призначені для короткострокового використання. Тимчасові облікові записи
      виступають частиною стандартних процедур активації облікових записів, коли виникає потреба в короткострокових
      облікових записах, без вимоги негайності активації запису. Екстрені облікові записи можуть бути створені у
      відповідь на кризові ситуації та потребують швидкої активації. Тому активація екстреного облікового запису
      може обійти звичайні процеси авторизації облікового запису. Треба зауважити, що екстрені й тимчасові облікові
      записи не слід плутати з обліковими записами, які рідко використовуються (наприклад, локальні облікові записи
      для доступу до спеціальних завдань). Такі облікові записи залишаються доступними й не потребують автоматичного
      відключення чи видалення. Умови деактивації облікових записів містять, наприклад, ситуації, коли спільні/групові,
      резервні або тимчасові облікові записи більше не потрібні; чи коли персонал переводиться або звільняється
      (складає повноваження).'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ac-2.1
    ref_id: AC-2(1)
    name: Управління обліковими записами — Автоматизоване управління системними обліковими записами
    category: technical
    csf_function: protect
    description: Використовувати автоматизовані механізми для підтримки управління системними обліковими записами.
    annotation: Використання автоматизованих механізмів може охоплювати, наприклад, використання електронної пошти
      чи текстових повідомлень для автоматичного сповіщення менеджерів облікових записів про припинення роботи користувачів;
      використання системи моніторингу активності облікових записів і використання телефонного сповіщення для повідомлення
      про нетипове використання облікового запису.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ac-2.2
    ref_id: AC-2(2)
    name: Управління обліковими записами — Видалення тимчасових та екстрених облікових записів
    category: technical
    csf_function: protect
    description: 'Автоматично [Вибір: видаляти, деактивувати] тимчасові та екстрені облікові записи після [Призначення:
      визначеного організацією часового періоду для кожного типу облікових записів].


      Параметри:

      1. Вибір: видаляти, деактивувати

      2. Призначення: визначеного організацією часового періоду для кожного типу облікових записів'
    annotation: 'Це посилення вимагає автоматичного видалення або деактивацію тимчасових і екстрених облікових записів
      після того, як минув попередньо визначений період часу, без участі системного адміністратора.

      Автоматичне видалення або деактивація облікових записів забезпечує послідовну реалізацію політики управління
      обліковими записами.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ac-2.3
    ref_id: AC-2(3)
    name: Управління обліковими записами — Деактивація облікових записів
    category: technical
    csf_function: protect
    description: 'Автоматично деактивувати облікові записи коли:


      a) їх строк дії минув;

      b) вони більше не пов’язані з користувачем;

      c) вони порушують організаційну політику;

      d) вони були неактивними впродовж [Призначення: визначеного організацією періоду часу].


      Параметри:

      1. Призначення: визначеного організацією періоду часу'
    annotation: Вимкнення прострочених, неактивних або іншим чином аномальних облікових записів підтримує концепцію
      найменших привілеїв і найменших функціональних можливостей, які зменшують поверхню атаки системи.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ac-2.4
    ref_id: AC-2(4)
    name: Управління обліковими записами — Дії при автоматизованому аудиті
    category: technical
    csf_function: protect
    description: Проводити автоматизований аудит створення, модифікації, активації, деактивації та видалення облікових
      записів і сповіщення про дії.
    annotation: Записи аудиту управління обліковими записами визначаються відповідно до AU-2 та переглядаються,
      аналізуються і звітуються відповідно до AU-6.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ac-2.5
    ref_id: AC-2(5)
    name: Управління обліковими записами — Вихід із системи за відсутності активності
    category: technical
    csf_function: protect
    description: 'Вимагати від користувачів виходити із системи, коли [Призначення: вичерпано визначений організацією
      періоду часу очікування або опис того, коли необхідно вийти із системи].


      Параметри:

      1. Призначення: вичерпано визначений організацією періоду часу очікування або опис того, коли необхідно вийти
      із системи'
    annotation: Це посилення вимагає від користувачів виходити із системи в разі перевищення визначеного періоду
      бездіяльності. Автоматичний примусовий вихід із системи бездіяльності регулюється AC-11.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ac-2.6
    ref_id: AC-2(6)
    name: Управління обліковими записами — Динамічне управління привілеями
    category: technical
    csf_function: protect
    description: 'Реалізувати такі можливості динамічного управління привілеями: [Призначення:

      визначений організацією перелік можливостей динамічного управління привілеями].


      Параметри:

      1. Призначення: визначений організацією перелік можливостей динамічного управління привілеями'
    annotation: На відміну від звичайних підходів до управління доступом, які використовують статичні облікові записи
      системи та попередньо визначені привілеї користувачів, підходи до динамічного управління доступу залежать
      від часових обмежень (наприклад управління доступом на основі атрибутів — ABAC). Хоча ідентичність користувачів
      залишається постійною протягом часу, їхні привілеї змінюються залежно від поточних вимог та операційних потреб
      організацій. Динамічне управління привілеями може містити, наприклад, негайне скасування привілеїв користувачів,
      без необхідності завершення та перезапуску сеансів. Динамічне управління привілеями також може містити ті
      механізми, які змінюють привілеї користувача на основі динамічних правил і не вимагають редагування конкретних
      профілів користувачів. До прикладів належать автоматичні коригування привілеїв користувачів, якщо вони працюють
      поза звичайним робочим часом, змінюються їхні робочі функції або якщо системи перебувають у позаштатних умовах
      функціонування. Це посилення заходу також охоплює випадки зміни ключів шифрування.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ac-2.7
    ref_id: AC-2(7)
    name: Управління обліковими записами — Схеми, засновані на ролях
    category: technical
    csf_function: protect
    description: 'a) Створювати й адмініструвати привілейовані облікові записи користувачів відповідно до схеми
      доступу на основі ролей (role-based), яка реалізує дозволений доступ до системи та призначення привілеїв для
      ролей.

      b) Проводити моніторинг призначення привілейованих ролей.


      c) Відстежувати зміни ролей або атрибутів.


      d) Скасовувати доступ, коли призначені привілейовані ролі більше не потрібні.'
    annotation: Привілейовані ролі — це визначені організацією ролі, що призначені особам і дозволяють цим особам
      виконувати певні функції безпеки, які звичайні користувачі не мають права виконувати. Ці привілейовані ролі
      містять, наприклад, управління ключами, управління обліковими записами, мережеве та системне управління, адміністрування
      баз даних і вебадміністрування. Схема доступу на основі ролей організовує дозволений доступ до системи та
      привілеїв в ролі. Навпаки, схема доступу на основі атрибутів визначає дозволений доступ до системи та привілеїв
      на основі атрибутів.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ac-2.8
    ref_id: AC-2(8)
    name: Управління обліковими записами — Динамічне управління обліковими записами
    category: technical
    csf_function: protect
    description: 'Створювати, активувати, управляти та деактивувати [Призначення: системні облікові записи, визначені
      організацією] динамічно.


      Параметри:

      1. Призначення: системні облікові записи, визначені організацією'
    annotation: Підходи до динамічного створення, активації, управління та деактивації облікових записів системи
      чи служб/застосунків покладаються на автоматичне обслуговування облікових записів суб’єктів, які раніше не
      були відомі безпосередньо під час функціонування. Динамічне управління цих облікових записів планується шляхом
      встановлення довірчих відносин, ділових правил і механізмів з відповідними органами для підтвердження відповідних
      дозволів і привілеїв.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ac-2.9
    ref_id: AC-2(9)
    name: Управління обліковими записами — Обмеження на використання спільних та групових облікових записів
    category: process
    csf_function: protect
    description: 'Використовувати лише ті спільні та групові облікові записи, які відповідають [Призначення: визначеним
      організацією умовам для створення спільних та групових облікових записів].


      Параметри:

