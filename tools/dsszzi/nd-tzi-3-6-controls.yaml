      забезпечення безперервної роботи та відновлення функціонування із зовнішніми організаціями таким чином, щоб
      окремі плани відображали загальні потреби організації в позаштатних ситуаціях.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:cp-2.8
    ref_id: CP-2(8)
    name: План забезпечення безперервної роботи та відновлення функціонування — Визначення критичних активів
    category: process
    csf_function: recover
    description: 'Визначити критичні активи системи, що підтримують критичні функції [Вибір: усі; основні].


      Параметри:

      1. Вибір: усі; основні'
    annotation: 'Організації можуть вирішити, чи проводити заходи з планування забезпечення безперервної роботи
      та відновлення функціонування як частину аналізу критичної діяльності організації або планування безперервності
      (враховуючи результати аналізу впливу на організацію). Організації мають визначити критичні активи системи
      щодо яких потрібно застосовувати додаткові гарантії та контрзаходи (за винятком тих гарантій та контрзаходів,
      що виконуються звичайно) для забезпечення безперервного виконання завдань/функцій у позаштатних ситуаціях.
      Наявність переліку критично важливих інформаційних ресурсів також полегшує визначення пріоритетності ресурсів
      організації. Критичні активи системи охоплюють як технічні, так і операційні аспекти. До технічних аспектів
      належать: послуги інформаційних технологій, компоненти системи, продукти інформаційних технологій та механізми.
      До операційних аспектів належать: процедури (операції, що виконуються вручну) та персонал (особи, які забезпечують
      технічні гарантії та/або виконують ручні процедури). Плани захисту програм організації можуть допомогти у
      визначенні критичних активів. Якщо критичні активи є резидентами або підтримуються зовнішніми постачальниками
      послуг, організації розглядають впровадження CP-2(7) як покращення контролю.'
