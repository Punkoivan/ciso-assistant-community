  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:cm-6
    ref_id: CM-6
    name: Налаштування конфігурації
    category: technical
    csf_function: protect
    description: 'a. Встановити та задокументувати параметри конфігурації компонентів, які застосовуються в системі,
      які відображають найбільш обмежений режим, що відповідає експлуатаційним вимогам, використовуючи [Призначення:
      визначені організацією загальні безпечні конфігурації].

      b. Реалізувати конфігураційні установки.

      c. Визначити, задокументувати та затвердити будь-які відхилення від встановлених конфігураційних параметрів
      конфігурації для [Призначення: визначених організацією компонентів системи] на основі [Призначення: визначених
      організацією експлуатаційних вимог].

      d. Відстежувати та керувати змінами конфігураційних параметрів відповідно до організаційної політики та процедур.


      Параметри:

      1. Призначення: визначені організацією загальні безпечні конфігурації

      2. Призначення: визначених організацією компонентів системи

      3. Призначення: визначених організацією експлуатаційних вимог'
    annotation: Параметри конфігурації — це параметри, які можна змінити в апаратних та/або програмних компонентах
      системи та які впливають на захищеність або функціональність системи. Продукти інформаційних технологій, для
      яких мають бути визначені параметри конфігурації, пов’язані з безпекою, охоплюють персональні комп’ютери,
      сервери, робочі станції, пристрої вводу/виводу, мережеві пристрої, операційні системи та програми. Параметри
      безпеки — це ті параметри, які впливають на стан безпеки систем, включно з параметрами, необхідними для задоволення
      інших вимог заходів безпеки. Параметри безпеки містять параметри реєстру; налаштування дозволів акаунтів,
      файлу, каталогу; налаштування функцій, портів, протоколів та віддалених з’єднань. Організації встановлюють
      налаштування конфігурації для всієї організації і згодом отримують конкретні параметри конфігурації для систем.
      Встановлені параметри стають частиною базової конфігурації системи. Загальні безпечні конфігурації (також
      їх називають контрольними списками конфігурації безпеки, керівництвом з техніки безпеки, посібниками з технічної
      реалізації безпеки) забезпечують визнані, стандартизовані та встановлені орієнтири, які передбачають безпечні
      налаштування конфігурації для конкретних платформ/продуктів інформаційних технологій та інструкції з налаштування.
      Загальні безпечні конфігурації можуть бути розроблені різними організаціями, зокрема розробниками продуктів
      інформаційних технологій, виробниками, постачальниками, консорціумами, науковцями, представниками промисловості,
      зовнішніми агенціями та іншими організаціями в державному та приватному секторах. Реалізація конкретної безпечної
      конфігурації може бути доручена на рівні організації чи на більш високому рівні із залученням регуляторного
      агентства. Загальні безпечні конфігурації містять базову конфігурацію, яка впливає на реалізацію CM-6 та інших
      заходів безпеки, таких як AC-19 та CM-7. Протокол автоматизації контенту безпеки (SCAP) та визначені стандарти
      в протоколі забезпечують ефективний метод унікальної ідентифікації, відстеження та керування налаштуваннями
      конфігурації.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:cm-6.1
    ref_id: CM-6(1)
    name: Налаштування конфігурації — Автоматизоване управління, застосування та верифікація
    category: technical
    csf_function: protect
    description: 'Керувати, застосовувати та перевіряти налаштування конфігурації для [Призначення: системні компоненти,
      визначені організацією] за допомогою [Призначення: визначені організацією автоматизовані механізми].


      Параметри:

      1. Призначення: системні компоненти, визначені організацією

      2. Призначення: визначені організацією автоматизовані механізми'
    annotation: Автоматизовані інструменти (наприклад, інструменти підвищення безпеки, інструменти базової конфігурації)
      можуть підвищити точність, узгодженість і доступність інформації про налаштування конфігурації. Автоматизація
      також може забезпечити агрегацію та кореляцію даних, механізми попередження та інформаційні панелі для підтримки
      прийняття рішень на основі оцінки ризиків в організації.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:cm-6.2
    ref_id: CM-6(2)
    name: Налаштування конфігурації несанкціоновані зміни
    category: technical
    csf_function: respond
    description: 'Виконайте такі дії у відповідь на неавторизовані зміни в [Призначення: параметри конфігурації,
      визначені організацією]: [Призначення: дії, визначені організацією].


      Параметри:

      1. Призначення: параметри конфігурації, визначені організацією

      2. Призначення: дії, визначені організацією'
    annotation: Реагування на несанкціоновані зміни в налаштуваннях конфігурації можуть охоплювати оповіщення персоналу,
      відновлення встановлених налаштувань конфігурації або, у крайньому разі, зупинку функціонування системи.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:cm-6.3
    ref_id: CM-6(3)
    name: Налаштування конфігурації — Виявлення неавторизованих змін
    category: technical
    csf_function: detect
    description: 'Вилучено: Включено до SI-7.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:cm-6.4
    ref_id: CM-6(4)
    name: Налаштування конфігурації — Демонстрація відповідності
    category: technical
    csf_function: protect
    description: 'Вилучено: Включено до CM-4.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:cm-7
    ref_id: CM-7
    name: Мінімально необхідна функціональність
    category: technical
    csf_function: protect
    description: 'a. Налаштуйте систему для забезпечення лише [Призначення: основні функції, визначені організацією
      для місії]; b. Заборонити або обмежити використання таких функцій, портів, протоколів, програмного забезпечення
      та/або служб: [Призначення: визначені організацією заборонені або обмежені функції, системні порти, протоколи,
      програмне забезпечення та/або служби].


      Параметри:

      1. Призначення: основні функції, визначені організацією для місії

      2. Призначення: визначені організацією заборонені або обмежені функції, системні порти, протоколи, програмне
      забезпечення та/або служби'
    annotation: Системи можуть надавати широкий спектр функцій і послуг. Деякі функції та послуги, що зазвичай надаються
      за замовчуванням, можуть не знадобитися для підтримки основних місій організації, функцій або операцій. Крім
      того, іноді зручно надавати кілька послуг з одного компонента системи, але це збільшує ризик обмеження послуг,
      що надаються цим компонентом. Там, де це можливо, слід обмежувати функціональність однією функцією на компонент.
      Організації переглядають функції та послуги, що надаються системами або компонентами для визначення тих функцій
      і послуг, які не є першочерговими. Має розглядатися можливість відключення фізичних і логічних портів та протоколів,
      які є надлишковими або рідко використовуються для запобігання несанкціонованому підключенню пристроїв та передачі
      інформації. Для виявлення та запобігання використанню заборонених функцій, протоколів, портів і послуг можуть
      бути застосовані засоби мережевого сканування, системи виявлення та запобігання вторгненням і технології захисту
      кінцевих точок, такі як брандмауери та системи виявлення вторгнень.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:cm-7.1
    ref_id: CM-7(1)
    name: Мінімально перегляд
    category: technical
    csf_function: protect
    description: '(a) Проводити перегляд системи [Призначення: з визначеною організацією частотою] для виявлення
      непотрібних та/або незахищених функцій, портів, протоколів і послуг;

      (b) Вимкнути [Призначення: визначені організацією функції, порти, протоколи та послуги в системі, які вважаються
      непотрібними та/або незахищеними].


      Параметри:

      1. Призначення: з визначеною організацією частотою

      2. Призначення: визначені організацією функції, порти, протоколи та послуги в системі, які вважаються непотрібними
      та/або незахищеними'
    annotation: Перевірка функцій, портів, протоколів та служб, які можна вимкнути. Такі перевірки особливо важливі
      здійснювати під час переходу від старих технологій до нових (наприклад, перехід від IPv4 до IPv6). Ці технологічні
      переходи можуть вимагати впровадження старих і нових технологій одночасно протягом перехідного періоду та
      повернення до мінімально необхідних функцій, портів, протоколів і послуг за першої нагоди. Оцінювання безпеки
      функції, порту, протоколу та/або послуги може бути зроблене в порівнянні з іншими. Наприклад, протоколи Bluetooth,
      FTP та однорангові мережі є менш безпечними.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:cm-7.2
    ref_id: CM-7(2)
    name: Мінімально необхідна виконання програми
    category: technical
    csf_function: protect
    description: 'Заборонити виконання програми відповідно до [Вибір (один або кілька): [Призначення: визначеної
      організацією політики, правил поведінки та/або угод про доступ щодо використання програмного забезпечення
      та обмежень]; правил, що встановлюють терміни та умови використання програмного забезпечення].


      Параметри:

      1. Вибір (один або кілька): [Призначення: визначеної організацією політики, правил поведінки та/або угод про
      доступ щодо використання програмного забезпечення та обмежень]; правил, що встановлюють терміни та умови використання
      програмного забезпечення'
    annotation: Це посилення заходу стосується організаційної політики, правил поведінки та/або угод про доступ,
      які обмежують використання програмного забезпечення, а також умов, встановлених розробником або виробником,
      включаючи ліцензування програмного забезпечення та авторські права. Обмеження охоплюють, наприклад, обмеження
      ролей, які можуть використовувати програми; заборону автоматичного виконання; запровадження чорного та білого
      списків або обмеження кількості екземплярів програми, які виконуються одночасно.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:cm-7.3
    ref_id: CM-7(3)
    name: Мінімально необхідна функціональність — Відповідність реєстрації
    category: technical
    csf_function: protect
    description: 'Забезпечити відповідність [Призначення: визначеним організацією вимогам до реєстрації для функцій,
      портів, протоколів і послуг].


      Параметри:

      1. Призначення: визначеним організацією вимогам до реєстрації для функцій, портів, протоколів і послуг'
    annotation: Процес реєстрації необхідний для можливості управління, відстеження й контролю за системами, функціями,
      портами, протоколами та послугами.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:cm-7.4
    ref_id: CM-7(4)
    name: Мінімально необхідна функціональність — Неавторизоване програмне забезпечення — Чорний список
    category: technical
    csf_function: protect
    description: '(a) Визначити [Призначення: визначені організацією програмне забезпечення, що не має дозволу виконуватися
      в системі].

      (b) Впровадити політику «дозволу всього, за винятком деяких» для заборони виконання неавторизованих програм
      у системі;

      (c) Переглядати та оновлювати список неавторизованих програм [Призначення: з визначеною організацією частотою].


      Параметри:

      1. Призначення: визначені організацією програмне забезпечення, що не має дозволу виконуватися в системі

      2. Призначення: з визначеною організацією частотою'
    annotation: Неавторизоване програмне забезпечення може бути обмежено певними версіями або з певного джерела.
      Концепція заборони виконання неавторизованого програмного забезпечення також може бути застосована до дій
      користувачів, портів і протоколів системи, IPадрес/діапазонів, веб-сайтів і MAC-адрес.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:cm-7.5
    ref_id: CM-7(5)
    name: Мінімально необхідна функціональність — Авторизоване програмне забезпечення — Білий список
    category: technical
    csf_function: protect
    description: '(a) Визначити [Призначення: визначені організацією програмне забезпечення, яке авторизовано виконується
      в системі]

      (b) Впровадити політику «заборони всього, за винятком деяких», щоб дозволити виконання авторизованих програм
      у системі.

      (c) Переглядати та оновлювати список авторизованих програм [Призначення: з визначеною організацією частотою].


      Параметри:

      1. Призначення: визначені організацією програмне забезпечення, яке авторизовано виконується в системі

      2. Призначення: з визначеною організацією частотою'
    annotation: 'Процес, який використовується для визначення конкретних програм або цілих категорій програм, дозволених
      до виконання в системах організації, зазвичай називають білим списком. Для формування всебічного білого списку
      та підвищення рівня захисту від атак, програми можуть відстежуватися на різних рівнях деталізації. Можуть
      бути визначені наступні рівні деталізації програм: програми, інтерфейси програмування, модулі, застосунки,
      скрипти, системні процеси, системні послуги, дії ядра, регістри, драйвери та бібліотеки динамічних посилань.
      Концепція білого списку також може бути застосована до дій користувачів, портів, IP-адрес і адреси контролю
      доступу (MAC). Цілісність програм з білого списку може бути перевірена за допомогою криптографічних контрольних
      сум, цифрових підписів або гешфункцій. Перевірка програмного забезпечення може відбуватися як перед виконанням,
      так і при запуску системи. Ідентифікація авторизованих URL-адрес для вебсайтів розглядається в CA-3(5) і SC-7.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:cm-7.6
    ref_id: CM-7(6)
    name: Мінімально необхідна функціональність середовища з обмеженими привілеями
    category: technical
    csf_function: protect
    description: 'Вимагайте, щоб визначене програмне забезпечення, встановлене користувачем, виконувалося в обмеженому
      середовищі фізичної або віртуальної машини з обмеженими привілеями: [Призначення: програмне забезпечення,
      встановлене користувачем, визначене організацією]


      Параметри:

      1. Призначення: програмне забезпечення, встановлене користувачем, визначене організацією'
    annotation: Організації виявляють програмне забезпечення, яке має невідоме походження або потенційний вміст
      шкідливого коду. Для цього типу програмного забезпечення користувачі встановлюються в обмеженому робочому
      середовищі, щоб обмежити або стримати пошкодження від шкідливого коду, який може бути виконаний.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:cm-7.7
    ref_id: CM-7(7)
    name: Мінімально необхідна функціональність — Виконуваний код у захищеному середовищі
    category: technical
    csf_function: protect
    description: 'Дозволити виконання двійкового або машинно-виконуваного коду лише в обмеженому фізичному або віртуальному
      машинному середовищі та за явного дозволу [Призначення: персонал або ролі, визначені організацією], якщо такий
      код:


      a) Отримано з джерел з обмеженою гарантією або без неї; та/або

      b) Без надання вихідного коду.


      Параметри:

      1. Призначення: персонал або ролі, визначені організацією'
    annotation: Виконання коду в захищених середовищах стосується всіх джерел двійкового або машинного виконуваного
      коду, включаючи комерційне програмне забезпечення та мікропрограми та програмне забезпечення з відкритим кодом.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:cm-7.8
    ref_id: CM-7(8)
    name: Мінімально необхідна функціональність — Бінарний або машинний виконуваний код
    category: technical
    csf_function: protect
    description: 'a) Заборонити використання двійкового або машинно-виконуваного коду з джерел з обмеженою гарантією
      або без неї або без надання вихідного коду; і

      b) Дозволяти винятки лише для обов’язкових місій або оперативних вимог і за погодженням з уповноваженою посадовою
      особою.'
    annotation: Двійковий або машинний виконуваний код застосовується до всіх джерел двійкового або машинного виконуваного
      коду, включаючи комерційне програмне забезпечення, вбудоване програмне забезпечення та програмне забезпечення
      з відкритим кодом. Організації оцінюють програмні продукти без вихідного коду або з джерел з обмеженою гарантією,
      або без неї щодо потенційного впливу на безпеку. Оцінюється те, що програмні продукти без наданого вихідного
      коду складно перевірити, відлагодити або розширити. Крім того, може не бути власників, які б проводили таке
      відлагодження за дорученням організацій. Якщо використовується програмне забезпечення з відкритим вихідним
      кодом, оцінюється також те, що гарантія відсутня, а програмне забезпечення може містити бекдори або зловмисне
      програмне забезпечення, може не бути підтримки від виробника.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:cm-7.9
    ref_id: CM-7(9)
    name: Мінімально необхідна функціональність використання неавторизованого обладнання
    category: technical
    csf_function: protect
    description: 'a. Визначити [Призначення: апаратні компоненти, визначені організацією, авторизовані для використання
      в системі];

      b. Заборонити використання або підключення неавторизованих апаратних компонентів;

      c. Перегляд та оновлення списку авторизованих апаратних компонентів [Призначення: частота, визначена організацією].


      Параметри:

      1. Призначення: апаратні компоненти, визначені організацією, авторизовані для використання в системі

      2. Призначення: частота, визначена організацією'
    annotation: Апаратні компоненти забезпечують основу для систем організації і платформу для виконання авторизованих
      програм. Управління інвентаризацією апаратних компонентів і контроль того, які апаратні компоненти дозволено
      встановлювати або підключати до систем організації, є важливими для забезпечення належної безпеки.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:cm-8
    ref_id: CM-8
    name: Інвентаризація компонентів системи
    category: process
    csf_function: identify
    description: "a. Розробити та задокументувати процес інвентаризації компонентів системи, який: \n1. точно описує\
      \ поточну систему;\n2. охоплює всі компоненти в межах акредитації системи;\n3. не включає повторний облік\
      \ компонентів або компонентів, будь-якої іншої системи;\n4. визначає рівень деталізації, який є необхідним\
      \ для відстеження та звітування;\n5. включає інформацію для досягнення підзвітності компонентів системи: [Призначення:\
      \ визначена організацією інформація, необхідна для досягнення ефективної підзвітності компонентів системи].\n\
      \nb. Переглядати та оновлювати опис компонентів системи з [Призначення: визначеною організацією частотою].\n\
      \nПараметри:\n1. Призначення: визначена організацією інформація, необхідна для досягнення ефективної підзвітності\
      \ компонентів системи\n2. Призначення: визначеною організацією частотою"
    annotation: 'Компоненти системи — це окремі елементи (продукти) інформаційних технологій, які являють собою
      блоки системи й містять апаратне, програмне забезпечення та віртуальні машини. Може бути ухвалено рішення
      щодо впровадження «централізованого» підходу, при якому система розглядається як єдиний блок, що містить усі
      організаційні компоненти. У таких ситуаціях організації мають забезпечити наявність всієї інформації, достатньої
      для належної реалізації та звітності всіх компонентів. Інформація, що необхідна для ефективної звітності компонентів
      системи, містить, наприклад: технічні характеристики; інформацію про ліцензії на програмне забезпечення; власників
      програмних компонентів; номери версій; а для мережевих компонентів або пристроїв — назви машин і мережеві
      адреси. Специфікація інвентаризації містить, наприклад: інформацію про виробника; тип пристрою; модель; серійний
      номер; фізичне розташування компоненту. Запобігання повторному обліку компонентів системи усуває недолік,
      який виникає, коли власник компонента та зв’язок системи невідомі, особливо у великих або складних системах.
      Для ефективного запобігання повторного обліку компонентів системи необхідно використовувати унікальний ідентифікатор
      для кожного такого компонента. Для того, щоб здійснити інвентаризацію програмного забезпечення, централізовано
      кероване програмне забезпечення, доступ до якого здійснюється через інші системи, розглядається як компонент
      системи, у якій воно встановлено та в якій здійснюється його управління. Програмне забезпечення, встановлене
      в кількох системах, управління яким здійснюється на системному рівні, враховується для кожної окремої системи
      та може з’являтися в централізованому інвентаризаційному обліку більше одного разу, такий облік потребує системної
      привʼязки для кожного такого екземпляра програмного забезпечення в централізованому інвентаризаційному обліку.
      Системи сканування, які реалізують кілька мережевих протоколів (наприклад, IPv4 та IPv6), можуть призвести
      до виявлення повторюваних компонентів в різних адресних просторах. Впровадження CM-8(7) може допомогти усунути
      дублюючий облік компонентів.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:cm-8.1
    ref_id: CM-8(1)
    name: Інвентаризація компонентів системи — Оновлення під час встановлення та видалення
    category: process
    csf_function: identify
    description: Оновлювати інвентарний опис компонентів системи як складової частини процесу інсталяції, видалення
      та оновлення компонентів системи.
    annotation: Організації можуть підвищити точність, повноту та узгодженість інвентаризації компонентів системи,
      якщо централізований інвентаризаційний облік оновлюватимуть під час встановлення чи видалення компонентів
      ситеми або під час загальних оновлень системи. Якщо такий облік не оновлюється в ці ключові моменти, існує
      ймовірність того, що інформація не буде належним чином зібрана та задокументована. Оновлення системи включають
      апаратні, програмні та мікропрограмні компоненти.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:cm-8.2
    ref_id: CM-8(2)
    name: Інвентаризація компонентів системи — Автоматизована підтримка
    category: process
    csf_function: identify
    description: 'Підтримувати актуальність, повноту, точність і доступність інвентаризації компонентів системи
      за допомогою [Завдання: автоматизовані механізми, визначені організацією].


      Параметри:

      1. Завдання: автоматизовані механізми, визначені організацією'
    annotation: Опис компонентів системи має бути вичерпним наскільки це можливо. Наприклад, віртуальні машини важко
      віслідковувати, оскільки їх не видно в мережі, коли вони не використовуються. У таких випадках організації
      мають вести максимально актуальний, повний і точний облік компонентів системи. Вимоги цього посилення заходу
      можуть бути реалізовані впровадженням CM-2 (2) для організацій, які вирішили поєднувати процедури інвентаризації
      компонентів системи та базову конфігурацію.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:cm-8.3
    ref_id: CM-8(3)
    name: Інвентаризація компонентів системи — Автоматизоване виявлення неавторизованих компонентів
    category: technical
    csf_function: detect
    description: '(a) Виявляти наявність несанкціонованого обладнання, програмного забезпечення та мікропрограмних
      компонентів у системі за допомогою [Призначення: автоматизовані механізми, визначені організацією] [Призначення:
      частота, визначена організацією]; (b) При виявленні неавторизованих компонентів виконувати такі дії: [Вибір
      (один або кілька): відключення доступу до мережі такими компонентами; ізолювати компоненти; повідомити [Призначення:
      визначені організацією персонал або посади]].


      Параметри:

      1. Призначення: автоматизовані механізми, визначені організацією

      2. Призначення: частота, визначена організацією

      3. Вибір (один або кілька): відключення доступу до мережі такими компонентами; ізолювати компоненти; повідомити
      [Призначення: визначені організацією персонал або посади]'
    annotation: Це посилення заходу додатково застосовується до моніторингу несанкціонованих віддалених з’єднань
      і мобільних пристроїв. Моніторинг неавторизованих компонентів системи може здійснюватися на постійній основі
      чи періодично. Автоматизовані механізми можуть бути реалізовані в системах або окремих пристроях. При придбанні
      та впровадженні автоматизованих механізмів організації розглядають, чи залежать такі механізми від здатності
      компонента системи підтримувати агента або запитувача, щоб бути виявленим, оскільки деякі типи компонентів
      не мають або не можуть підтримувати агентів (наприклад, пристрої IoТ, датчики). Ізоляція може бути досягнута,
      наприклад, розміщенням неавторизованих компонентів в окремих доменах чи підмережах або способом переміщення
      на карантин таких компонентів. Такий тип ізоляції компонентів зазвичай називають «пісочницею».
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:cm-8.4
    ref_id: CM-8(4)
    name: Інвентаризація компонентів системи — Інформація про підзвітність
    category: process
    csf_function: identify
    description: 'Увести в інвентаризаційну інформацію компоненту системи засіб для ідентифікації за [Вибір (один
      або більше): ім’ям; позицією; роллю] осіб, відповідальних і підзвітних за управління цими компонентами.


      Параметри:

      1. Вибір (один або більше): ім’ям; позицією; роллю'
    annotation: Ідентифікація осіб, які несуть відповідальність за адміністрування компонентів системи, допомагає
      забезпечити правильне управління призначеними компонентами, а також дозволяє організаціям зв’язатися з цими
      особами, якщо потрібні певні дії (наприклад, якщо компонент визначається як джерело порушення, або компонент
      потрібно відкликати, замінити або перенести).
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:cm-8.5
    ref_id: CM-8(5)
    name: Інвентаризація компонентів системи дублювання компонентів обліку
    category: process
    csf_function: identify
    description: 'Вилучено: перенесено до CM-8.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:cm-8.6
    ref_id: CM-8(6)
    name: Інвентаризація компонентів системи налаштування та затверджені відхилення
    category: process
    csf_function: identify
    description: Включити перевірені налаштування компонентів і будь-які затверджені відхилення до поточних розгорнутих
      конфігурацій в інвентаризаційний облік компонентів системи.
    annotation: Це посилення управління охоплює налаштування конфігурацій, встановлені організаціями, на конкретних
      компонентах, які були оцінені для визначення відповідності необхідним параметрам конфігурації; а також будь-які
      затверджені відхилення від встановлених параметрів конфігурації.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:cm-8.7
    ref_id: CM-8(7)
    name: Інвентаризація сховище
    category: process
    csf_function: identify
    description: Впровадити централізоване сховище для інвентаризаційного обліку компонентів системи.
    annotation: Може бути ухвалено рішення щодо впровадження «централізованого» підходу, при якому система розглядається
      як єдиний блок, що охоплює всі організаційні компоненти. Централізоване сховище для інвентаризаційного обліку
      компонентів системи надає можливості для ефективності обліку активів обладнання та програмного забезпечення.
      Таке сховище за потреби може також допомогти швидко визначити місцезнаходження компонентів системи та відповідальних
      осіб, які стали учасниками інциденту безпеки. У таких ситуаціях організації мають забезпечити наявність всієї
      інформації, достатньої для належної реалізації та звітності всіх компонентів.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:cm-8.8
    ref_id: CM-8(8)
    name: Інвентаризація компонентів системи — Автоматизоване відстеження місця розташування
    category: process
    csf_function: identify
    description: 'Відстежувати компоненти системи за географічним розташуванням за допомогою [Призначення: автоматизовані
      механізми, визначені організацією].


      Параметри:

      1. Призначення: автоматизовані механізми, визначені організацією'
    annotation: Використання автоматизованих механізмів для відстеження розташування компонентів системи може підвищити
      точність визначення місцезнаходження компонентів. Така спроможність може допомогти організаціям швидко визначити
      місцезнаходження компонентів системи та відповідальних осіб, які стали учасниками інциденту безпеки. Використання
      механізмів відстеження можна узгоджувати з консультантами з питань приватності, якщо є наслідки, які впливають
      на приватність особи.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:cm-8.9
    ref_id: CM-8(9)
    name: Інвентаризація компонентів компонентів системам
    category: process
    csf_function: identify
    description: '(a) Призначити визначені компоненти системі;

      (b) Отримати підтвердження від [Призначення: персонал або ролі, визначені організацією] про виконання призначення.


      Параметри:

      1. Призначення: персонал або ролі, визначені організацією'
    annotation: Компоненти, які не призначені системі, можуть бути некерованими, не мати необхідного захисту та
      стати вразливістю для системи.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:cm-9
    ref_id: CM-9
    name: План управління конфігурацією
    category: process
    csf_function: govern
    description: 'Розробити, задокументувати та реалізувати план управління конфігурацією системи, який:

      a. описує ролі, відповідальність, процеси та процедури управління конфігурацією;

      b. встановлює процес ідентифікації елементів конфігурації протягом всього життєвого циклу розробки системи
      та для управління конфігурацією елементів;

      c. визначає елементи конфігурації для системи та розміщує елементи конфігурації під управлінням конфігурації;

      d. розглядає та затверджує [Призначення: визначеним організацією персоналом або ролями];

      e. захищає план управління конфігурацією від несанкціонованого розкриття та модифікації.


      Параметри:

      1. Призначення: визначеним організацією персоналом або ролями'
    annotation: План управління конфігурацією має відповідати вимогам політики керування конфігурацією, проте одночасно
      адаптуватися до конкретної системи. План управління конфігурацією визначає процеси та процедури, як управління
      конфігурацією використовується для підтримки життєвого циклу розвитку системи. План управління конфігурацією
      зазвичай розробляється на етапі розробки системи. У плані має бути описано, як оновлювати параметри конфігурації,
      як проводити інвентаризацію компонентів системи, як контролювати середовища розробки, тестування та експлуатації,
      а також, як розробляти, випускати та оновлювати ключові документи. Організації можуть використовувати шаблони
      для забезпечення послідовної та своєчасної розробки та реалізації планів управління конфігурацією. Такі шаблони
      можуть представляти головний план управління конфігурацією для організації з підмножинами планів, реалізованими
      в системі на конкретних компонентах. Процеси затвердження керування конфігураціями включають призначення ключових
      зацікавлених сторін, відповідальних за перегляд і затвердження запропонованих змін до систем, а також персоналу,
      який проводить аналіз впливу на безпеку та приватність перед впровадженням змін у системи. Елементи конфігурації
      — це компоненти системи (тобто апаратне, програмне забезпечення та документація), за допомогою яких відбувається
      управління конфігурацією. Протягом життєвого циклу системи нові елементи конфігурації можуть бути ідентифіковані,
      а деякі наявні елементи конфігурації можуть більше не потребувати управління.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:cm-9.1
    ref_id: CM-9(1)
    name: План управління відповідальності
    category: process
    csf_function: govern
    description: Встановити відповідальність за реалізацію процесу управління конфігурацією персоналу, який безпосередньо
      не бере участь у розробці системи.
    annotation: За відсутності спеціалізованих команд управління конфігурацією, призначених в організації, до процесу
      управління конфігурацією можуть залучати персонал, який безпосередньо не бере участь у розробці або інтеграції
      системи. Такий розподіл обов’язків гарантує, що організація встановлює та підтримує достатній ступінь незалежності
      між процесами розробки й інтеграції системи та процесами управління конфігурацією для полегшення контролю
      якості та більш ефективного нагляду.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:cm-10
    ref_id: CM-10
    name: Обмеження використання програмного забезпечення
    category: process
    csf_function: protect
    description: 'Заходи захисту: a. Використовувати програмне забезпечення та супутні документи відповідно до договірних
      угод та законів про авторські права. b. Відстежувати використання програмного забезпечення та пов’язаної документації,
      захищеної ліцензіями, для контролю копіювання та розповсюдження. c. Контролювати та документувати використання
      технології однорангового обміну файлами, щоб гарантувати, що ця можливість не використовується для несанкціонованого
      розповсюдження, відображення, виконання або відтворення програмного забезпечення, захищеного авторським правом.'
    annotation: Відстеження ліцензій на програмне забезпечення може здійснюватися вручну або автоматизованими методами
      залежно від потреб організації. Прикладами угод є ліцензійні угоди на програмне забезпечення та угоди про
      нерозголошення.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:cm-10.1
    ref_id: CM-10(1)
    name: Обмеження використання програмного забезпечення програмне забезпечення з відкритим вихідним кодом
    category: process
    csf_function: protect
    description: 'Встановити такі обмеження на використання програмного забезпечення з відкритим вихідним кодом:
      [Призначення: визначені організацією обмеження].


      Параметри:

      1. Призначення: визначені організацією обмеження'
    annotation: Програмне забезпечення з відкритим кодом є доступним у формі вихідного коду. Певні права на програмне
      забезпечення, які зарезервовані для власників авторських прав, забезпечуються ліцензійними угодами (це дозволяє
      вивчати, змінювати та вдосконалювати програмне забезпечення). З погляду безпеки, головна перевага програмного
      забезпечення з відкритим кодом полягає в тому, що воно надає організаціям можливість досліджувати вихідний
      код. У деяких випадках існує онлайн-спільнота, пов’язана з програмним забезпеченням, яка постійно перевіряє,
      тестує, оновлює та звітує про проблеми, виявлені в програмному забезпеченні. Однак усунення вразливостей у
      програмному забезпеченні з відкритим кодом може бути проблематичним. Також, є питання щодо ліцензування програмного
      забезпеченням з відкритим кодом, включно з обмеженням щодо використання похідного програмного забезпечення.
      Крім того, програмне забезпечення з відкритим кодом, доступне лише у двійковій формі, може збільшити рівень
      ризику його икористання.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:cm-11
    ref_id: CM-11
    name: Встановлене користувачем програмне забезпечення
    category: process
    csf_function: protect
    description: 'a. Встановити [Призначення: визначені організацією правила (політики)], що регулюють встановлення
      програмного забезпечення користувачами.

      b. Застосувати правила (політики) встановлення програмного забезпечення за допомогою таких методів: [Призначення:
      визначені організацією методи].

      c. Відстежувати відповідність правилам (політики) з [Призначення: визначеною організацією частотою].


      Параметри:

      1. Призначення: визначені організацією правила (політики)

      2. Призначення: визначені організацією методи

      3. Призначення: визначеною організацією частотою'
    annotation: Користувачі, які мають відповідні привілеї, можуть встановлювати програмне забезпечення в системах
      організації. Для підтримки контролю над типами встановленого програмного забезпечення організації визначають
      дозволені та заборонені дії щодо встановлення програмного забезпечення. Дозволене програмне забезпечення може
      містити, наприклад, оновлення до наявного програмного забезпечення та завантаження програм із затверджених
      організацією «магазинів застосунків». До забороненого програмного забезпечення може належати, наприклад, програмне
      забезпечення з невідомим чи підозрілим походженням або програмне забезпечення, яке організації вважають потенційно
      шкідливим. Політики щодо встановленого користувачем програмного забезпечення можуть бути розроблені безпосередньо
      організацією або зовнішніми експертами. Методи застосування політики можуть включати організаційні та автоматизовані
      методи.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:cm-11.1
    ref_id: CM-11(1)
    name: Встановлене користувачем програмне забезпечення попередження про несанкціоновану інсталяцію
    category: process
    csf_function: protect
    description: 'Вилучено: Включено до CM-8(3).'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:cm-11.2
    ref_id: CM-11(2)
    name: Встановлене користувачем програмне забезпечення встановлення програмного забезпечення з привілейованим
      статусом
    category: process
    csf_function: protect
    description: Дозволити користувачам встановлювати програмне забезпечення лише за наявності привілейованого статусу.
    annotation: Привілейований статус може мати, наприклад, адміністратор системи.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:cm-11.3
    ref_id: CM-11(3)
    name: Встановлене користувачем програмне автоматичне виконання і моніторинг
    category: technical
    csf_function: detect
    description: 'Застосування та моніторинг відповідності політикам встановлення програмного забезпечення за допомогою
      [Призначення: автоматизовані механізми, визначені організацією]


      Параметри:

      1. Призначення: автоматизовані механізми, визначені організацією'
    annotation: Організації забезпечують дотримання та контролюють відповідність політикам встановлення програмного
      забезпечення за допомогою автоматизованих механізмів для більш швидкого виявлення та реагування на несанкціоноване
      встановлення програмного забезпечення, яке може бути показником внутрішньої чи зовнішньої ворожої атаки.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:cm-12
    ref_id: CM-12
    name: Розташування інформації
    category: process
    csf_function: identify
    description: 'a. Визначити місце розташування [Призначення: інформації, визначеної організацією] та конкретних
      компонентів системи, на яких зберігається інформація.

      b. Визначити та задокументувати користувачів, які мають доступ до системи та компонентів системи, де зберігається
      інформація.

      c. Задокументувати зміни в розташуванні (наприклад, системи або компонентів системи), де перебуває інформація.


      Параметри:

      1. Призначення: інформації, визначеної організацією'
    annotation: Цей захід захисту формулює необхідність розуміння того, де інформація обробляється та зберігається,
      і здебільшого застосовується до критичної інформації. Під розташуванням інформації розуміється місце, де конкретні
      типи інформації перебувають у компонентах системи, і порядок її обробки. Це потрібно для розуміння інформаційних
      потоків задля забезпечення належного захисту та управління політикою безпеки інформації та компонентів системи.
      Категорія безпеки інформації також є чинником при визначенні заходів захисту, необхідних для захисту відповідної
      інформації та системного компонента, де зберігається така інформація (див. FIPS 199). Розташування інформаційних
      і компонентів системи також є фактором, який впливає на архітектуру та проектування системи (див. SA-4, SA-8,
      SA-17)
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:cm-12.1
    ref_id: CM-12(1)
    name: Розташування інформації — Автоматизовані інструменти підтримки розташування інформації
    category: process
    csf_function: identify
    description: 'Використовувати автоматизовані інструменти для ідентифікації [Призначення: визначеної організацією
      інформації за типом інформації] на [Призначення: визначених організацією компонентах системи] для впровадження
      належних заходів захисту щодо інформації про організацію і персональних даних.


      Параметри:

      1. Призначення: визначеної організацією інформації за типом інформації

      2. Призначення: визначених організацією компонентах системи'
    annotation: Використання автоматизованих інструментів допомагає підвищити ефективність реалізованої в системі
      можливості визначення місця розташування інформації. Автоматизація також допомагає керувати даними, отриманими
      під час діяльності з визначення інформації, і обмінюватися такою інформацією в межах організації. Вихідні
      дані автоматизованих інструментів визначення місцезнаходження інформації можуть бути використані для керівництва
      та інформування про архітектуру системи та проектні рішення.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:cm-13
    ref_id: CM-13
    name: Відображення дій даних
    category: process
    csf_function: identify
    description: Розробіть і задокументуйте карту дій даних системи
    annotation: Дії з даними – це системні операції, які обробляють особисту інформацію. Обробка такої інформації
      охоплює повний життєвий цикл інформації, який включає збір, генерацію, перетворення, використання, розкриття,
      збереження та видалення. Карта дій із даними системи включає окремі дії з даними, елементи персональної інформації,
      яка обробляється під час дій із даними, системні компоненти, залучені до дій із даними, і власників або операторів
      компонентів системи. Розуміння того, яка ідентифікаційна інформація обробляється (наприклад, конфіденційність
      ідентифікаційної інформації), як обробляється персональна інформація (наприклад, чи дані дані доступні людині
      чи обробляються в іншій частині системи), і ким (наприклад, особи можуть мати різні уявлення про конфіденційність
      залежно від суб’єкта, який обробляє особисту інформацію), надає низку контекстуальних факторів, важливих для
      оцінки ступеня ризику конфіденційності, створеного системою. Карти даних можна проілюструвати різними способами,
      а рівень деталізації може відрізнятися залежно від місії та бізнес-потреб організації. Карта даних може бути
      накладанням будь-якого артефакту проектування системи, який використовує організація. Розробка цієї карти
      може вимагати координації між програмами конфіденційності та безпеки щодо охоплених дій із даними та компонентів,
      визначених як частина системи.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:cm-14
    ref_id: CM-14
    name: Підписані компоненти
    category: technical
    csf_function: protect
    description: 'Запобігання інсталяції [Призначення: програмне забезпечення та мікропрограмні компоненти, визначені
      організацією] без перевірки того, що компонент має цифровий підпис за допомогою сертифіката, визнаного та
      схваленого організацією.


      Параметри:

      1. Призначення: програмне забезпечення та мікропрограмні компоненти, визначені організацією'
    annotation: Компоненти програмного забезпечення та мікропрограми, заборонені для встановлення, якщо вони не
      підписані визнаними та схваленими сертифікатами, включають оновлення версій програмного забезпечення та мікропрограми,
      виправлення, пакети оновлень, драйвери пристроїв і базові оновлення системи введення/виведення. Організації
      можуть ідентифікувати застосоване програмне забезпечення та мікропрограмні компоненти за типом, конкретними
      елементами або комбінацією обох. Цифрові підписи та організаційна перевірка таких підписів є методом автентифікації
      коду.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:cp-1
    ref_id: CP-1
    name: Політика та процедури планування безперервної роботи
    category: policy
    csf_function: govern
    description: "a. Розробити, задокументувати та поширити серед [Призначення: визначених організацією персоналу\
      \ або посад]:\n1. [Вибір (один або декілька): Рівень організації; Рівень місії/бізнес-процесу; рівень системи]\
      \ політику планування безперервної роботи на випадок надзвичайної ситуації, яка:\n\t(a) містить мету, сферу\
      \ застосування, ролі, обов’язки, відповідальність керівництва, координацію між організаційними підрозділами\
      \ та систему контролю відповідності (complaince);\n\t(b) відповідає чинним законам, виконавчим розпорядженням,\
      \ директивам, положенням, політиці, стандартам і керівним принципам.\n2. процедури, що сприяють реалізації\
      \ політики планування безперервної роботи та пов’язаних з ними заходів, на випадок надзвичайної ситуації.\n\
      b. Призначити [Призначення: визначену організацією посадову особу вищого керівництва] для управління, документування\
      \ і розповсюдження політики та процедур планування безперервної роботи на випадок надзвичайних ситуацій.\n\
      c. Переглядати та оновлювати:\n###### \n1. поточну політику планування безперервної роботи з [Призначення:\
      \ визначеною організацією частотою];\n2. поточні процедури планування безперервної роботи з [Призначення:\
      \ визначеною організацією частотою].\nd. Забезпечити, щоб процедури планування безперервної роботи реалізовували\
      \ політику та заходи планування безперервної роботи.\ne. Розробити, задокументувати та здійснити коригувальні\
      \ заходи щодо виправлення становища в разі порушень політики планування безперервної роботи.\n\nПараметри:\n\
      1. Призначення: визначених організацією персоналу або посад\n2. Вибір (один або декілька): Рівень організації;\
      \ Рівень місії/бізнес-процесу; рівень системи\n3. Призначення: визначену організацією посадову особу вищого\
      \ керівництва\n4. Призначення: визначеною організацією частотою"
    annotation: 'Цей захід захисту стосується встановлення політики та процедур для ефективного здійснення заходів
      та їх посилень у класі CP. Стратегія управління ризиками є важливим фактором у встановленні політики та процедур.
      Комплексна політика та процедури допомагають забезпечити безпеку та приватність. За наявності політики, а
      також планів захисту інформації та персональних даних на рівні організації, конкретні системні політики та
      процедури можуть бути не потрібні. Політика може бути внесена до складу загальної політики безпеки та приватності
      або може бути представлена кількома політиками (у випадках складної архітектури). Процедури описують, як має
      реалізуватися політика чи заходи захисту та як вони можуть бути спрямовані на персонал або роль, яка є об’єктом
      процедури. Процедури можуть бути задокументовані в планах захисту інформації та персональних даних (як один
      або декілька документів). Події, які можуть спричинити оновлення політики та процедур планування безпеки на
      випадок надзвичайних ситуацій, включають: висновки аудиту, інциденти чи порушення безпеки, зміни в законах,
      розпорядженнях, директивах, постановах чи стандартах. Просте повторне встановлення засобів захисту не є організаційною
      політикою чи процедурою.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:cp-2
    ref_id: CP-2
    name: План забезпечення безперервної роботи та відновлення функціонування
    category: process
    csf_function: recover
    description: 'a. Розробити план забезпечення безперервної роботи та відновлення функціонування системи на випадок
      надзвичайної ситуації, який:

      1. визначає основні завдання, функції та пов’язані з ними вимоги щодо безперервної роботи;

      2. забезпечує цілі, пріоритети та відповідні показники відновлення функціонування;

      3. визначає ролі, обов’язки та відповідальних осіб з контактною інформацією;

      4. спрямований на підтримку основних завдань і функції, попри системні збої, компрометації або помилки;

      5. спрямований на повне відновлення функціонування системи без погіршення запланованих і реалізованих заходів
      захисту інформації та персональних даних;

      6. вирішує питання обміну інформацією про надзвичайні ситуації;

      7. переглядається та затверджується [Призначення: персонал або ролі, визначені організацією];

      b. Поширити копії плану забезпечення безперервної роботи та відновлення функціонування серед [Призначення:
      визначеного організацією ключового персоналу з непередбачених обставин (ідентифікується за ім’ям та/або за
      ролями) та елементів організації].

      c. Координувати діяльність з планування безперервної роботи із заходами по усуненню інцидентів.

      d. Переглядати план забезпечення безперервної роботи та відновлення функціонування системи з [Призначення:
      визначеною організацією частотою].

      e. Оновлювати план забезпечення безперервної роботи та відновлення функціонування з урахуванням змін в організації,
      системі або середовищі експлуатації, а також проблем, що виникають при реалізації, виконанні або тестуванні
      плану забезпечення безперервної роботи та відновлення функціонування.

      f. Повідомляти про зміни в плані забезпечення безперервної роботи та відновлення функціонування [Призначення:
      визначений організацією ключовий персонал з відновлення функціонування (ідентифікується за ім’ям та/або за
      ролями) та елементів організації].

      g. Включати уроки, отримані під час тестування плану забезпечення безперервної роботи та відновлення функціонування
      у навчання та тестування для випадків надзвичайних ситуацій.

      h. Забезпечити захист плану забезпечення безперервної роботи та відновлення функціонування від несанкціонованого
      доступу або змін.


      Параметри:

      1. Призначення: персонал або ролі, визначені організацією

      2. Призначення: визначеного організацією ключового персоналу з непередбачених обставин (ідентифікується за
      ім’ям та/або за ролями) та елементів організації

      3. Призначення: визначеною організацією частотою

      4. Призначення: визначений організацією ключовий персонал з відновлення функціонування (ідентифікується за
      ім’ям та/або за ролями) та елементів організації'
    annotation: Планування системи забезпечення безперервної роботи та відновлення функціонування є частиною загальної
      організаційної програми для досягнення цілей місії. Планування системи забезпечення безперервної роботи та
      відновлення функціонування стосується відновлення системи та впровадження альтернативних процесів, коли системи
      скомпрометовані. Ефективність планування системи забезпечення безперервної роботи та відновлення функціонування
      досягається шляхом врахування такого планування протягом усього життєвого циклу системи. Планування системи
      забезпечення безперервної роботи та відновлення функціонування щодо розробки апаратного та програмного забезпечення
      може бути ефективним засобом досягнення стійкості системи. Планування системи забезпечення безперервної роботи
      та відновлення функціонування має відображати ступінь відновлення, необхідний для систем організації, оскільки
      не всі системи потребують повного відновлення для досягнення бажаного рівня безперервності операцій. Цілі
      відновлення системи мають відповідати чинному законодавству. Окрім доступності, забезпечення безперервної
      роботи та відновлення функціонування стосуються інших подій, пов’язаних з безпекою, які призводять до зниження
      ефективності роботи, наприклад, зловмисних атак, що загрожують приватності та цілісності системи. Дії, що
      мають розглядатися в планах, охоплюють, наприклад, впорядковану деградацію, вимкнення системи, відкат до ручного
      режиму, альтернативні інформаційні потоки та роботу в режимах, зарезервованих для того, коли системи піддаються
      атаці. Погоджуючи планування системи забезпечення безперервної роботи та відновлення функціонування з діяльністю
      з обробки інцидентів, організації можуть забезпечити проведення необхідних заходів з планування та активізацію
      в разі інциденту безпеки. Організації розглядають, чи конфліктує безперервність операцій під час інциденту
      з можливістю автоматичного вимкнення системи, як зазначено в IR-4(5). Планування реагування на інциденти є
      частиною планування на випадок непередбачених ситуацій для організацій і розглядається в сімействі IR (Incident
      Response).
