  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ia-2.10
    ref_id: IA-2(10)
    name: Ідентифікація та автентифікація (користувачів організації) єдина точка входу
    category: technical
    csf_function: protect
    description: 'Впровадити можливість єдиного входу для [Призначення: облікових записів і послуг системи, визначених
      організацією].


      Параметри:

      1. Призначення: облікових записів і послуг системи, визначених організацією'
    annotation: Система єдиного входу дозволяє користувачам входити один раз і отримувати доступ до кількох ресурсів
      системи. Організації мають аналізувати ефективність єдиного входу, беручи до уваги ризики, які пов’язані з
      відсутністю повторної автентифікації при зверненні до іншого ресурсу. Система єдиного входу може сприяти підвищенню
      рівня безпеки системи у випадках, коли завдяки її використанню можливо забезпечити процедуру багатофакторної
      автентифікації при доступі до компонентів, власні можливості яких не дозволяють реалізувати такі механізми
      автентифікації (наприклад, це може стосуватися застарілих програмних компонентів).
