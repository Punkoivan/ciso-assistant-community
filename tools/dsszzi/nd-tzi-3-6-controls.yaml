  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:cm-2.6
    ref_id: CM-2(6)
    name: Базова конфігурація — Розробка та середовище тестування
    category: process
    csf_function: protect
    description: Підтримувати базову конфігурацію для розробки системи та тестових середовищ, які керуються окремо
      від робочої базової конфігурації.
    annotation: Створення окремих конфігурацій для розробки системи та тестування допомагають захистити системи
      від незапланованих/непередбачуваних подій, пов’язаних з розробкою та тестуванням. Окремі конфігурації дозволяють
      застосовувати управління конфігурацією, яке є найвідповіднішим для кожного типу. Наприклад, управління робочими
      конфігураціями зазвичай вимагає більшої стабільності, тоді як управління конфігураціями розробки або тестування
      вимагає більшої гнучкості. Конфігурації в тестовому середовищі відображають конфігурації в середовищі функціонування,
      наскільки це можливо, так щоб результати тестування відображали запропоновані зміни у операційних системах.
      Це посилення заходу вимагає створення окремих конфігурацій, але не обов’язково окремих фізичних середовищ.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:cm-2.7
    ref_id: CM-2(7)
    name: Базова конфігурація — Конфігурація систем та компонентів для сфер з високим ризиком
    category: process
    csf_function: protect
    description: '(a) Видавати [Призначення: визначених організацією систем або компонентів систем] з [Призначенням:
      визначеними організацією конфігураціями] особам, що перебувають у місцях, які організація вважає місцями зі
      значним ризиком;


      (b) Застосувати [Призначення: визначені організацією запобіжні заходи безпеки] до компонентів, коли особи
      повертаються з поїздки.


      Параметри:

      1. Призначення: визначених організацією систем або компонентів систем

      2. Призначенням: визначеними організацією конфігураціями

      3. Призначення: визначені організацією запобіжні заходи безпеки'
    annotation: Якщо відомо, що системи чи компоненти системи функціонуватимуть у зонах підвищеного ризику, додаткові
      заходи можуть бути впроваджені для протидії підвищеним загрозам. Наприклад, додаткові заходи можуть бути запроваджені
      для портативних комп’ютерів, якими користуються особи, що виїжджають і повертаються з відряджень. Спеціальні
      налаштування портативних комп’ютерів включають очищені жорсткі диски, обмеження програм та більш жорсткі параметри
      конфігурації. Засоби захисту, які застосовуються до мобільних пристроїв після повернення з відряджень, включають
      перевірку мобільного пристрою на наявність ознак фізичного втручання, очищення та повторного створення образів
      дисків. Захист інформації, яка зберігається на мобільних пристроях, розглядається у класі MP (Захист носіїв
      інформації).
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:cm-3
    ref_id: CM-3
    name: Управління змінами конфігурації
    category: process
    csf_function: protect
    description: 'a. Визначити типи змін у системі, які контролюються конфігурацією.

      b. Переглядати запропоновані зміни в конфігурації, контрольовані системою, і схвалити або відхилити ці зміни
      з явним урахуванням аналізу наслідків безпеки. c. Документувати рішення зі зміни конфігурації системи.

      d. Впровадити схвалені зміни конфігурації в систему.

      e. Зберігати записи змін конфігурації системі впродовж [Призначення: певного періоду часу, визначеного організацією].

      f. Здійснювати моніторинг і аналіз дій, пов’язаних зі змінами конфігурації системи.

      g. Координувати та впроваджувати нагляд за діяльністю з управління змінами конфігурації за допомогою [Призначення:
      елементу управління змінами конфігурації, визначеного організацією], який викликається [Вибір (один або кілька):
      [Призначення: з визначеною організацією частотою]; [Призначення: визначені організацією умови зміни конфігурації]].


      Параметри:

      1. Призначення: певного періоду часу, визначеного організацією

      2. Призначення: елементу управління змінами конфігурації, визначеного організацією

      3. Вибір (один або кілька): [Призначення: з визначеною організацією частотою]; [Призначення: визначені організацією
      умови зміни конфігурації]'
    annotation: Управління змінами конфігурації систем передбачає розробку, обґрунтування, реалізацію, тестування,
      перегляд і впровадження змін у системах, включно з оновленням і модифікацією системи. Управління змінами конфігурації
      охоплює зміни базових конфігурацій для компонентів і елементів систем; зміни в налаштуваннях конфігурації
      для продуктів; позапланові зміни; зміни, що необхідні для нівелювання нагальних загроз. Типові процеси управління
      змінами конфігурації в системах містять у собі плани керування конфігурацією або консультативні ради щодо
      змін, які переглядають і затверджують запропоновані зміни в системах. Аудит змін охоплює діяльність до та
      після внесення змін до систем і дії аудиту, що необхідні для впровадження таких змін (також див. SA-10).
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:cm-3.1
    ref_id: CM-3(1)
    name: Управління змінами конфігурації — Автоматизоване документування, повідомлення та заборона внесення змін
    category: technical
    csf_function: protect
    description: 'Впровадити автоматизовані механізми для: (a) документування запропонованих змін у системі; (b)
      повідомлення [Призначення: визначених організацією органів влади, що проводять авторизацію] про запропоновані
      зміни в системі та схвалення запитів змін; (c) виділення запропонованих змін у системі, які не були схвалені
      або відхилені за [Призначенням: визначений організацією період часу]; (d) заборони внесення змін до системи,
      до отримання відповідного погодження; (e) документування всіх змін у системі; (f) повідомлення [Призначення:
      визначеному організацією персоналу], коли завершено погоджені зміни в системі.


      Параметри:

      1. Призначення: визначених організацією органів влади, що проводять авторизацію

      2. Призначенням: визначений організацією період часу

      3. Призначення: визначеному організацією персоналу'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:cm-3.2
    ref_id: CM-3(2)
    name: Управління змінами конфігурації — Тестування, валідація та документування змін
    category: process
    csf_function: protect
    description: Тестувати, перевіряти та документувати зміни в системі до повної їх реалізації.
    annotation: Зміни в системах охоплюють модифікації апаратних, програмних засобів або компонентів мікропрограмного
      забезпечення та налаштування конфігурації, що визначені в CM-6. Тестування має бути організовано таким чином,
      щоб воно не порушувало роботу системи. Уповноважені особи або відповідальні підрозділи, які проводять тестування,
      мають розуміти політику й процедури безпеки та приватності, а також ризики для здоров’я, безпеки навколишнього
      середовища, що пов’язані з конкретними засобами чи процесами. Можуть бути ситуації, у яких перед початком
      процедури тестування операційна система має бути переведена в особливий «off-line» режим (тобто бути знятою
      з експлуатації). У таких випадках час проведення тестування має бути запланований заздалегідь. Якщо проведення
      тестування неможливе (наприклад, якщо неможливо припинення роботи системи), мають бути застосовані компенсаційні
      заходи захисту.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:cm-3.3
    ref_id: CM-3(3)
    name: Управління змінами реалізація змін
    category: technical
    csf_function: protect
    description: 'Внести зміни в поточний базову план системи та розгорнути оновлений базовий план на встановленій
      базі за допомогою [Призначення: автоматизовані механізми, визначені організацією].


      Параметри:

      1. Призначення: автоматизовані механізми, визначені організацією'
    annotation: Автоматизовані інструменти можуть підвищити точність, узгодженість і доступність базової інформації
      про конфігурацію. Автоматизація також може забезпечити збирання та кореляцію даних, механізми оповіщення та
      інформаційні панелі для підтримки прийняття рішень на основі оцінки ризиків в організації.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:cm-3.4
    ref_id: CM-3(4)
    name: Управління змінами конфігурації — Представник безпеки
    category: process
    csf_function: protect
    description: 'Вимагати від [Призначення: визначеного організацією представника з інформаційної безпеки] бути
      членом [Призначення: визначеного організацією елементу керування зміною конфігурацій].


      Параметри:

      1. Призначення: визначеного організацією представника з інформаційної безпеки

      2. Призначення: визначеного організацією елементу керування зміною конфігурацій'
    annotation: До представників інформаційної безпеки належать посадові особи служби захисту інформації, офіцери
      системної та нформаційної безпеки та керівники організації. Такі посадові особи повинні відповідати високим
      вимогам щодо досвіду у сфері захисту інформації, оскільки зміни в конфігурації системи можуть мати непередбачувані
      побічні ефекти, які вимагатимуть негайних реакцій. Виявлення таких змін на ранній стадії процесу може допомогти
      уникнути ненавмисних негативних наслідків, які зрештою можуть вплинути на стан безпеки та приватності систем.
      Захід захисту для керування змінами конфігурації, згаданий у другому параметрі, відображає керування змінами,
      визначеними організаціями в CM-3g.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:cm-3.5
    ref_id: CM-3(5)
    name: Управління змінами конфігурації — Автоматичне реагування безпеки
    category: technical
    csf_function: detect
    description: 'Реалізувати автоматичне [Призначення: визначене організацією реагування безпеки], якщо базова
      конфігурація системи змінюється несанкціонованим чином.


      Параметри:

      1. Призначення: визначене організацією реагування безпеки'
    annotation: 'Можливі реакції безпеки можуть містити: зупинку роботи системи, зупинку вибраних функцій, надсилання
      сповіщень або повідомлень уповноваженим посадовим особам у разі, коли відбувається несанкціонована зміна елемента
      конфігурації.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:cm-3.6
    ref_id: CM-3(6)
    name: Управління змінами конфігурації — Управління засобами криптографічного захисту
    category: process
    csf_function: protect
    description: 'Забезпечити, щоб криптографічні механізми, які використовуються для забезпечення відповідних заходів
      захисту перебували під управлінням конфігурацією [Призначення: визначених організацією заходів безпеки].


      Параметри:

      1. Призначення: визначених організацією заходів безпеки'
    annotation: Незалежно від криптографічних засобів, які використовуються, повинні бути забезпечені процеси й
      процедури для управління ними. Наприклад, якщо пристрої використовують сертифікати для ідентифікації та автентифікації,
      має бути реалізовано процес для регулювання терміну дії цих сертифікатів.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:cm-3.7
    ref_id: CM-3(7)
    name: Управління змінами конфігурації — Перегляд змін у системі
    category: process
    csf_function: detect
    description: 'Перегляньте зміни в системі [Призначення: частота, визначена організацією] або коли [Призначення:
      обставини, визначені організацією], щоб визначити, чи відбулися неавторизовані зміни.


      Параметри:

      1. Призначення: частота, визначена організацією

      2. Призначення: обставини, визначені організацією'
    annotation: Ознаки, які вимагають перегляду змін у системі, і конкретні обставини, що виправдовують такі перегляди,
      можуть бути отримані в результаті діяльності, яку здійснюють організації під час процесу зміни конфігурації
      або процесу постійного моніторингу.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:cm-3.8
    ref_id: CM-3(8)
    name: Управління змінами конфігурації обмеження змін конфігурації
    category: process
    csf_function: protect
    description: 'Запобігати або обмежити зміни конфігурації системи за таких обставин: [Призначення: обставини,
      визначені організацією].


      Параметри:

      1. Призначення: обставини, визначені організацією'
    annotation: Зміни конфігурації системи можуть негативно вплинути на важливі функції безпеки та конфіденційності
      системи. Обмеження на зміни можна застосовувати за допомогою автоматизованих механізмів.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:cm-4
    ref_id: CM-4
    name: Аналіз впливу на безпеку та приватність
    category: process
    csf_function: identify
    description: Аналізувати зміни в системі, щоб визначити потенційну загрозу безпеці та приватності перед реалізацією
      змін.
    annotation: 'Аналіз впливу має проводитися відповідальними за безпеку посадовими особами. Особи, які проводять
      такий аналіз, мають володіти необхідними навичками для проведення технічної експертизи для аналізу змін у
      системах та пов’язаних із цим наслідків щодо безпеки чи приватності. Аналіз впливу на безпеку та приватність
      охоплює: перегляд планів захисту, політик і процедур безпеки та приватності для розуміння вимог безпеки та
      приватності; перегляд проєктної документації системи для реалізації заходів, які можуть впливати на елементи
      управління; визначення того, яким чином можливі зміни в системі створюють нові ризики для приватності та здатність
      впроваджених засобів захисту для зменшення цих ризиків.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:cm-4.1
    ref_id: CM-4(1)
    name: Аналіз впливу на безпеку та приватність — Відокремлені випробувальні середовища
    category: process
    csf_function: identify
    description: Проаналізувати зміни в системі в окремому тестовому середовищі до впровадження змін в операційному
      середовищі, шукаючи вплив на безпеку та приватність через недоліки, слабкості, несумісність або навмисне спричинення
      шкоди.
    annotation: Окреме випробувальне середовище в цьому контексті означає середовище, фізично або логічно ізольоване
      та відмінне від середовища функціонування системи. Розмежування має бути достатнім для того, щоб діяльність
      у випробувальному середовищі не впливала на діяльність у робочому середовищі, а інформація в робочому середовищі
      не передавалася до випробувального середовища. Відокремлення середовища можна досягти фізичними або логічними
      засобами. Якщо фізично окремі випробувальні середовища не можуть використовуватися, мають бути визначені механізми
      для здійснення логічного поділу.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:cm-4.2
    ref_id: CM-4(2)
    name: Аналіз впливу на безпеку та приватність — Верифікація функцій безпеки та приватності
    category: process
    csf_function: identify
    description: Після змін у системі переконайтеся, що відповідні заходи захисту реалізовано правильно і вони функціонують
      належним чином та дають бажаний результат щодо дотримання вимог безпеки та приватності для системи.
    annotation: Реалізація в цьому контексті стосується встановлення зміненого коду в операційній системі, що може
      вплинути на заходи безпеки або конфіденційності.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:cm-5
    ref_id: CM-5
    name: Обмеження доступу до зміни
    category: process
    csf_function: protect
    description: Визначити, задокументувати, затвердити та забезпечити застосування фізичних і логічних обмежень
      доступу, пов’язаних зі змінами в системі.
    annotation: Будь-які зміни апаратних, та/або програмних компонентів систем можуть потенційно впливати на загальну
      безпеку систем. Тому лише кваліфіковані уповноважені особи можуть мати доступ до систем з метою ініціювання
      змін, включно з оновленням і модифікацією. Обмеження доступу до змін також стосується бібліотек програмного
      забезпечення. Обмеження доступу включають фізичний і логічний контроль доступу (див. AC-3 та PE-3), автоматизацію
      робочого процесу, абстрактні рівні (тобто зміни, впроваджені в зовнішні інтерфейси, а не безпосередньо в системі),
      а також тимчасові зміни (тобто зміни відбуваються лише протягом визначеного часу).
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:cm-5.1
    ref_id: CM-5(1)
    name: Обмеження доступу до автоматичного доступу
    category: technical
    csf_function: protect
    description: "(a) Застосовувати обмеження доступу за допомогою [Призначення: автоматизовані механізми, визначені\
      \ організацією];\n \n(b) автоматично генерувати записи аудиту для виконаних дій.\n\nПараметри:\n1. Призначення:\
      \ автоматизовані механізми, визначені організацією"
    annotation: Має бути проведена реєстрація записів доступу до системи, пов’язаних із застосуванням змін конфігурації,
      для забезпечення здійснення контролю змін конфігурації та підтримки фактичних дій у випадках, якщо виявлені
      будь-які несанкціоновані зміни.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:cm-5.2
    ref_id: CM-5(2)
    name: Обмеження доступу до зміни — Перегляд змін у системі
    category: process
    csf_function: protect
    description: 'Вилучено: перенесено до CM-3(7).'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:cm-5.3
    ref_id: CM-5(3)
    name: Обмеження доступу до зміни — Підписані компоненти
    category: process
    csf_function: protect
    description: 'Вилучено: перенесено до CM-14.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:cm-5.4
    ref_id: CM-5(4)
    name: Обмеження доступу до зміни — Подвійна авторизація
    category: process
    csf_function: protect
    description: 'Здійснювати подвійну авторизацію для внесення змін до [Призначення: компонентів системи та інформації
      на рівні системи, визначених організацією].


      Параметри:

      1. Призначення: компонентів системи та інформації на рівні системи, визначених організацією'
    annotation: Подвійна авторизація має здійснюватися для гарантування того, що будь-які зміни у вибраних компонентах
      не можуть відбутися, якщо двоє кваліфікованих осіб, які мають достатньо навичок і досвіду для визначення,
      чи запропоновані зміни є коректними, не затвердять їх.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:cm-5.5
    ref_id: CM-5(5)
    name: Обмеження доступу до зміни — Обмеження повноважень для виробництва та експлуатації
    category: process
    csf_function: protect
    description: '(a) обмежити повноваження для зміни компонентів системи та інформації, пов’язаної із системою,
      у виробничому або операційному середовищі;

      (b) переглядати та переоцінювати повноваження [Призначення: визначеною організацією з частотою].


      Параметри:

      1. Призначення: визначеною організацією з частотою'
    annotation: У багатьох організаціях системи мають різні призначення, підтримують багато завдань, функцій і процесів.
      Обмеження привілеїв щодо зміни компонентів системи стосовно операційних систем необхідно, оскільки зміни в
      компоненті системи можуть мати вплив на функції та процеси. Складні відносини між системами та процесами в
      деяких випадках можуть бути невідомі розробникам.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:cm-5.6
    ref_id: CM-5(6)
    name: Обмеження доступу до зміни — Обмеження повноважень для бібліотек
    category: process
    csf_function: protect
    description: Обмежити повноваження для зміни програмного забезпечення, яке перебуває в бібліотеках програмного
