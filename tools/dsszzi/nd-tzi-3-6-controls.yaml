      в потребах організації, зміни в навколишньому інформаційному середовищі та в разі виявлення потенційно шкідливих
      чи несприятливих подій тощо.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ac-4.4
    ref_id: AC-4(4)
    name: Управління інформаційними потоками — Управління потоком зашифрованої інформації
    category: technical
    csf_function: protect
    description: 'Запобігати обходу [Призначення: механізмів управління потоками, визначених організацією] зашифрованої
      інформації шляхом [Вибір (один або декілька):

