  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:pl-7
    ref_id: PL-7
    name: Концепція експлуатації
    category: process
    csf_function: govern
    description: 'a. Розробити концепцію експлуатації інформаційної системи, яка описує, як організація має намір
      керувати системою з погляду забезпечення безпеки та приватності інформації.

      b. Переглядати й оновлювати концепцію експлуатації [Призначення: з визначеною організацією частотою].


      Параметри:

      1. Призначення: з визначеною організацією частотою'
    annotation: Концепція експлуатації — це документ, який призначений для користувача та містить інформацію про
      робочі характеристики системи з погляду користувача. На відміну від концепції функціонування, концепція експлуатації
      може містити один або декілька сценаріїв експлуатації системи. Концепція експлуатації розробляється перед
      початком розробки системи на стадії проєктування. Вона є основою для формування функціональних вимог до системи.
      Концепція експлуатації може бути внесена до плану захисту інформації та персональних даних або до інших документів
      життєвого циклу розробки систем. Зміни в концепції експлуатації мають відображатися в постійних оновленнях
      планів захисту інформації та персональних даних, архітектурі безпеки та приватності й інших відповідних документах,
      включно з, наприклад, документами щодо життєвого циклу розробки системи та специфікації.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:pl-8
    ref_id: PL-8
    name: Архітектура безпеки та приватності
    category: process
    csf_function: protect
    description: 'a. Розробити архітектуру безпеки та приватності для інформаційної системи, яка:

      1. характеризує методологію, вимоги та підходи, які слід вживати для забезпечення конфіденційності, цілісності
      та доступності інформації, що циркулює в системі;

      2. характеризує методологію, вимоги та підхід до обробки персональних даних для мінімізації ризику їх втрати;

      3. характеризує, як архітектури безпеки та приватності інтегруються в архітектуру підприємства;

      4. характеризує будь-які припущення, що пов’язані з безпекою та приватністю, щодо зовнішніх служб і залежності
      від них.

      b. Переглядати й оновлювати архітектуру безпеки та приватності [Призначення:з визначеною організацією частотою],
      щоб відображати оновлення в архітектурі підприємства.

      c. Відображати заплановані зміни архітектури плану безпеки та приватності, концепції експлуатації інформаційної
      системи, аналізу критичності, організаційних заходах, постачань та закупівель.


      Параметри:

      1. Призначення: з визначеною організацією частотою'
    annotation: 'Цей захід безпеки стосується дій, що вживаються організаціями з проєктування та розробки систем.
      Архітектури безпеки та приватності на системному рівні мають відповідати й доповнювати організаційні архітектури
      безпеки та приватності, описані в PM-7, які є невіддільною частиною і розробляються як частина архітектури
      підприємства. Архітектури безпеки та приватності містять: опис архітектури, розміщення і розподіл функцій
      безпеки та приватності (включно із заходами захисту), інформацію про безпеку та приватність для зовнішніх
      інтерфейсів; інформацію, якою обмінюються через інтерфейси, та пов’язані механізми захисту з кожним інтерфейсом.
      Крім того, архітектури безпеки та приватності можуть містити іншу інформацію, наприклад: ролі користувачів
      і привілеї доступу, які присвоєні кожній ролі; унікальні вимоги безпеки та приватності; типи інформації, що
      обробляється, зберігається та передається системою; пріоритети відновлення інформаційних і послуг системи
      та будь-які інші конкретні потреби захисту. У сучасних обчислювальних архітектурах організаціям стає все складніше
      контролювати всі інформаційні ресурси. Можуть бути наявними залежність від зовнішніх інформаційних послуг
      і постачальників послуг. Опис таких залежностей в архітектурах безпеки та приватності є важливим для розробки
      комплексної стратегії захисту місії. Створення, розробка, документування та підтримка конфігурації систем
      організації має вирішальне значення для впровадження й ефективної архітектури безпеки та приватності. Розробка
      архітектури безпеки та приватності має координуватися зі службою безпеки інформації для забезпечення визначення
      й ефективної реалізації заходів захисту, необхідних для забезпечення вимог безпеки та приватності. PL-8 насамперед
      орієнтований на організації для того, щоб впевнитися, що архітектура системи інтегрована до архітектури організації
      або тісно з нею пов’язана. В той же час, SA-17 в першу чергу орієнтований на розробників та інтеграторів зовнішніх
      продуктів інформаційних технологій та систем. SA-17, який доповнює PL8, обирається у випадках, коли організація
      передає розробку системи або її компонентів зовнішнім організаціям, а також у разі необхідності продемонструвати
      узгодженість архітектури заходів захисту та приватності корпоративній архітектурі організації.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:pl-8.1
    ref_id: PL-8(1)
    name: Архітектура безпеки та приватності — «глибока оборона»
    category: process
    csf_function: protect
    description: 'Спроєктувати архітектуру безпеки та приватності для інформаційної системи, використовуючи підхід
      «глибокої оборони», що:

      (a) призначає [Призначення: визначені організацією заходи захисту] для [Призначення: визначених організацією
      місць та архітектурних рівнів];

      (b) забезпечує, щоб призначені заходи захисту діяли скоординовано та на взаємодоповнювальній основі.


      Параметри:

      1. Призначення: визначені організацією заходи захисту

      2. Призначення: визначених організацією місць та архітектурних рівнів'
    annotation: Організації стратегічно розділяють елементи забезпечення безпеки та приватності у відповідних архітектурах,
      щоб зловмисникам необхідно було подолати численні заходи захисту для досягнення своєї мети. Створення для
      зловмисників вищезазначених умов призводить до додаткових часових витрат, необхідних для атаки на інформаційні
      ресурси організації, що в свою чергу збільшує ймовірність виявлення такої атаки. Координація виділених елементів
      заходів захисту має важливе значення для у випадках, коли атака на один із таких елементів може призвести
      до некоректної роботи решти. Непередбачувані наслідки можуть включати блокування системи та каскадні сигнали
      тривоги. Розміщення заходів захисту в системах і організаціях є важливим процесом, який вимагає ретельного
      аналізу. Вартість активів організації є важливим фактором для впровадження додаткових рівнів захисту. Підхід
      до побудови архітектури «глибокої оборони» включає в себе принцип модульності та багаторівневості (див. SA-8
      (3)), розділення функціональних можливостей користувача та системи (див. SC-2) та ізоляції функції безпеки
      (див. SC-3).
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:pl-8.2
    ref_id: PL-8(2)
    name: Архітектура безпеки та приватності - різноманітність постачальників
    category: process
    csf_function: protect
    description: 'Забезпечити, щоб [Призначення: визначені організацією заходи захисту], призначені для [Призначення:
      визначених організацією місць та архітектурних рівнів], були отримані від різних постачальників.


      Параметри:

      1. Призначення: визначені організацією заходи захисту

      2. Призначення: визначених організацією місць та архітектурних рівнів'
    annotation: Різні продукти інформаційних технологій мають різні сильні та слабкі сторони. Надання широкого спектру
      продуктів доповнює індивідуальні пропозиції. Наприклад, постачальники, що пропонують захист від зловмисного
      коду, зазвичай оновлюють свою продукцію в різний час, часто розробляючи рішення для відомих вірусів на основі
      їх пріоритетів та графіків розробки. Завдяки наявності різних продуктів у різних об’єктах захисту збільшується
      ймовірність, що принаймні один з них виявить зловмисний код. Що стосується приватності, постачальники можуть
      пропонувати продукти, які відслідковують особисту інформацію в системах, використовуючи різні методи відслідковування.
      Використання більшою кількості таких продуктів надасть більшу впевненість в тому, що персональні дані включені
      в реєстр.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:pl-9
    ref_id: PL-9
    name: Централізоване управління
    category: process
    csf_function: govern
    description: 'Централізовано управляти [Призначення: визначеними організацією організаційними заходами захисту
      та пов’язаними з ними процесами].


      Параметри:

      1. Призначення: визначеними організацією організаційними заходами захисту та пов’язаними з ними процесами'
    annotation: 'Централізоване управління стосується управління в цілому в організації та впровадження вибраного
      заходу захисту, а також пов’язаних з цим процесів. Це охоплює: планування, впровадження, оцінювання, надання
      дозволу та моніторинг визначених організацією централізовано керованих заходів і процесів. Централізоване
      управління заходів захисту сприяє та полегшує стандартизацію впровадження й управління, а також розумне використання
      ресурсів організації. Оскільки централізоване управління заходами захисту пов’язане з концепцією спільних
      (успадкованих) мір безпеки, таке управління сприяє та полегшує стандартизацію реалізації мір безпеки та управління,
      а також розумне використанні ресурсів організації. Заходи захисту та процеси, які підлягають централізованому
      управлінню, можуть виконувати вимоги незалежного оцінювання з метою забезпечення дотримання початкових та
      поточних дозволів для роботив рамках проведення постійного організаційного моніторингу. Автоматизовані інструменти
      (наприклад, інструменти управління захистом інформації та подіями, інструменти керування та моніторингу безпеки
      організації) можуть підвищити точність, послідовність і доступність інформації, пов’язаної з центральним управлінням
      заходами захисту і процесами. Автоматизація також може забезпечити можливість зведення та співвідношення даних,
      роботу механізмів оповіщення, створення інформаційних панелей для створення можливості прийняття рішень на
      основі ризиків в організації. В рамках процесу вибору заходів захисту організація визначає елементи управління,
      які можуть бути застосовані для центрального управління, виходячи із можливостей та ресурсів. Не завжди можливо
      організувати центральне управління кожного аспекту заходу захисту. У таких випадках заходи захисту можуть
      впроваджуватися та керуватися гібридно: централізовано або на системному рівні. Заходи захисту та заходи посилення,
      які можна використати для повного або часткового централізованого управління, включають, але не обмежуються:
      AC-2(1), AC-2(2), AC-2(3), AC-2(4), AC-4(all), AC-17(1), AC-17(2), AC-17(3), AC17(9), AC-18(1), AC-18(3),
      AC-18(4), AC-18(5), AC-19(4), AC-22, AC-23, AT-2(1), AT-2(2), AT-3(1), AT-3(2), AT-3(3), AT-4, AU-3, AU-6(1),
      AU-6(3), AU-6(5), AU-6(6), AU-6(9), AU-7(1), AU-11, AU-13, AU-16, CA-2(1), CA-2(2), CA-2(3), CA-3(1), CA-3(2),
      CA-3(3), CA-7(1), CA-9, CM-2(2), CM-3(1), CM-3(4), CM-4, CM-6, CM-6(1), CM-7(2), CM-7(4), CM-7(5), CM-8(all),
      CM-9(1), CM-10, CM-11, CP-7(all), CP-8(all), SC-43, SI-2, SI-3, SI4(all), SI-7, SI-8.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:pl-10
    ref_id: PL-10
    name: Вибір базового профілю безпеки
    category: process
    csf_function: govern
    description: Вибрати базовий профіль безпеки для інформаційної системи.
    annotation: 'Вибір базового профілю безпеки визначається потребами зацікавлених сторін. Потреби та проблеми
      зацікавлених сторін передбачають вимоги та завдання, що пов’язані з місією у рамках чинного законодавства.
      Базовий профіль безпеки являє собою відправну точку для забезпечення приватності, інформації та інформаційних
      систем із подальшим адаптуванням дій для управління ризиками відповідно до місії, бізнесу чи інших обмежень
      (див. PL-11). Організації вибирають один з базових профілів безпеки після: огляду типів інформації, яка обробляється,
      зберігається та передається в системах організації; аналізу можливого несприятливого впливу чи наслідків втрати
      або компрометації системи (інформації) щодо діяльності й активів організації, окремих людей, інших організацій;
      врахування результатів оцінювань ризику.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:pl-11
    ref_id: PL-11
    name: Налаштування базового профілю безпеки
    category: process
    csf_function: govern
    description: Налаштувати вибраний базовий профіль безпеки, застосовуючи вказані дії для налаштування.
    annotation: 'Налаштування базового профілю безпеки дозволяє організаціям налаштовувати набір заходів захисту.
      Це полегшує вибір заходів захисту та дозволяє організаціям розробляти плани захисту інформації та персональних
      даних, які: відображають їх конкретні місії (призначення), функції та завдання; середовища, у яких працюють
      їх системи; загрози та вразливості, що можуть вплинути на їхні системи. Налаштування базового профілю безпеки
      здійснюється шляхом: визначення та призначення загальних заходів захисту; міркувань щодо розміщення; вибору
      компенсаційних заходів захисту; призначення значень параметрам; доповнення базового профілю додатковими заходами
      захисту (за необхідності).'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:pm-1
    ref_id: PM-1
    name: Програма (концепція) інформаційної безпеки
    category: policy
    csf_function: govern
    description: 'a. Розробити та поширити на організаційному рівні план програми (концепцію) з інформаційної безпеки,
      яка:

      1. містить огляд вимог до програми (концепції) безпеки й описує заходи управління програмою інформаційної
      безпеки та загальних заходів безпеки, які використовуються або плануються для виконання цих вимог;

      2. містить визначення та розподіл ролей, обов’язків, відповідальності керівництва, заходи з координації діяльності
      організації і забезпечення відповідності вимогам законодавства та іншим нормативним документам;

      3. відображає координацію між організаційними елементами, що відповідають за інформаційну безпеку;

      4. затверджена вищою посадовою особою, що відповідає та підзвітна за управління ризиками, пов’язаними з організаційними
      операціями (включно з завданнями (місією), функціями, іміджем і репутацією організації), організаційні активи,
      фізичних осіб, інші організації та державу.

      b. Переглядати та оновлювати загальноорганізаційний план програми (концепцію) інформаційної безпеки [Призначення:
      з визначеною організацією частотою] та у випадку [Призначення: визначені організацією випадки].

      c. Забезпечити захист плану програми (концепції) інформаційної безпеки від несанкціонованого розкриття та
      зміни.


      Параметри:

      1. Призначення: з визначеною організацією частотою

      2. Призначення: визначені організацією випадки'
    annotation: План програми (концепція) інформаційної безпеки являє собою формальний документ, в якому міститься
      огляд вимог безпеки для програми інформаційної безпеки в масштабах всієї організації та описує існуючі заходи
      захисту управління програмами та загальні заходи захисту в цілому, а також заплановані заходи захисту які
      будуть відповідати вищезазначеним вимогам. Залежно від складності організаційної архітектури, програма (концепція)
      інформаційної безпеки може бути представлена в одному документі або в декількох. Плани програм забезпечення
      приватності та плани управління ризиками ланцюга постачання розглядаються окремо в PM-18 та SR-2 відповдіно.
      На документальному рівні план програми відображає основні положення щодо забезпечення інформаційної безпеки
      та визначені організацією загальні заходи захисту. План надає вичерпну інформацію про заходи захисту (в тому
      числі специфікацію параметрів для операцій призначення та вибору, відображаючи таку інформацію в явному вигляді
      або за допомогою посилань) для забезпечення реалізації, яка однозначно відповідає меті плану, та визначення
      ризику, який виникне у разі впровадження такого плану. Оновлення планів програм інформаційної безпеки включають
      в себе організаційні зміни та проблеми, які були виявлені під час впровадження плану або отриманих в результаті
      контрольного оцінювання. Заходи захисту менеджменту інформаційної безпеки можуть бути реалізовані на рівні
      організації, місії, бізнес-процесу та є важливою складовою програми інформаційної безпеки організації. Заходи
      захисту менеджменту інформаційної безпеки відрізняються від звичайних, специфічних для системи та гібридних
      заходів захисту, оскільки являються незалежними від будь-якої конкретної системи. Разом індивідуальні плани
      безпеки та план програми інформаційної безпеки організації забезпечують повне охоплення засобів заходів захисту,
      що використовуються в організації. Плани захисту для окремих систем і загальноорганізаційна програма інформаційної
      безпеки мають охоплювати всі заходи захисту, які застосовуються в організації. Загальні заходи захисту мають
      бути задокументовані в додатку до програми (концепції) інформаційної безпеки, якщо вони не внесені в окремі
      плани безпеки системи. Загальноорганізаційна програма інформаційної безпеки має містити посилання на окремі
      плани захисту, які містять описи загальних заходів захисту. Якщо програма (концепція) інформаційної безпеки
      складається з кількох документів, у кожному з них має бути зазначена посадова особа, відповідальна за розробку,
      реалізацію, оцінювання, надання дозволу та моніторинг відповідних загальних заходів безпеки.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:pm-2
    ref_id: PM-2
    name: Ролі програми інформаційної безпеки
    category: process
    csf_function: govern
    description: Призначити старшу посадову особу служби інформаційної безпеки, яка наділена відповідними завданнями
      та ресурсами для здійснення координації, розробки, впровадження та підтримки програми (концепції) інформаційної
      безпеки.
    annotation: Старша особа служби інформаційної безпеки —посадова особа в організації. Для державних органів (відповідно
      до чинного законодавства) ця особа є посадовою особою інформаційної безпеки. Організації можуть також визначати
      цю посадову особу як старшу посадову особу з інформаційної безпеки.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:pm-3
    ref_id: PM-3
    name: Ресурси забезпечення інформаційної безпеки та приватності
    category: process
    csf_function: govern
    description: 'a. Внести ресурси, необхідні для реалізації програми інформаційної безпеки та приватності, у процес
      планування капіталовкладень і запитів на інвестиції та задокументувати всі винятки з цієї вимоги.

      b. Підготувати документацію, необхідну для розв’язання завдань програми інформаційної безпеки та приватності
      в процесі планування фінансування та запитів на інвестування відповідно до чинних законів, виконавчих наказів,
      директив, політик, правил, стандартів.

      c. Забезпечити доступ до ресурсів, призначених для розв’язання завдань із захисту інформації та приватності.'
    annotation: Посадовим особам, відповідальним за питання інформаційної безпеки, мають бути виділені необхідні
      ресурси для їхньої діяльності. Організації можуть призначити та уповноважити раду з капіталовкладень або подібну
      групу для управління та надання контролю за аспектами інформаційної безпеки та приватності, пов’язаними з
      процесом планування капіталовкладень і управління інвестиціями.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:pm-4
    ref_id: PM-4
    name: План дій та етапи
    category: process
    csf_function: govern
    description: 'a. Запровадити процес для забезпечення того, щоб плани дій та етапи програм безпеки та приватності,
      програм управління ризиками ланцюга постачання і пов’язаних систем організації:

      1. розроблялися та підтримувалися;

      2. задокументовані корегувальні заходи захисту адекватно реагували на ризики для операцій організацї і активів,
      фізичних осіб, інших організацій та держави;

      3. оприлюднювалися відповідно до встановлених вимог до звітності.

      b. Переглядати плани дій та етапи для узгодженості з організаційною стратегією управління ризиками й організаційними
      пріоритетами щодо дій з реагування на ризики.'
    annotation: План дій (з виділеними основними етапами) є ключовим документом у програмах інформаційної безпеки
      та приватності. Плани дій та основні етапи мають бути розроблені на загальноорганізаційному рівні, визначаючи
      пріоритетність дій щодо реагування на ризики та забезпечуючи їх відповідність цілям і завданням організації
      . План дій та оновлення важливих етапів має базуватися на результатах контрольних оцінювань і постійних моніторингових
      заходів. Може бути кілька планів дій і етапів, що відповідають рівню інформаційної системи, місії/рівню процесу
      та організаційному рівню управління. У той час як для органів державної влади необхідні плани дій і основні
      етапи, інші організації можуть допомогти зменшити ризики шляхом документування та відстеження запланованих
      заходів із відновлення. Конкретні вказівки щодо планів дій і етапів на системному рівні надаються в CA-5.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:pm-5
    ref_id: PM-5
    name: Інвентаризація системи
    category: process
    csf_function: govern
    description: 'Розробити та оновити [Завдання: частота, визначена організацією] перелік систем організації.


      Параметри:

      1. Завдання: частота, визначена організацією'
    annotation: '[OMB A-130] надає вказівки щодо проведення інвентаризації систем і відповідних вимог до звітності.
      Системна інвентаризація стосується загальноорганізаційної інвентаризації систем, а не компонентів системи,
      як описано в CM-8.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:pm-5.1
    ref_id: PM-5(1)
    name: Інвентаризація системи - інвентаризація персональних даних
    category: process
    csf_function: govern
    description: 'Створення, підтримка та оновлення [Призначення: частота, визначена організацією] процедури інвентаризації
      всіх систем, програм і проектів, які обробляють персональні дані.


      Параметри:

      1. Призначення: частота, визначена організацією'
    annotation: 'Інвентаризація систем, програм і проектів, які обробляють персональні дані, підтримує відображення
      дій із даними, надаючи особам повідомлення про конфіденційність, зберігаючи точні персональні дані та обмежуючи
      обробку таких даних, якщо така вони не потрібні для оперативних цілей. Організації використовують такі інструменти,
      щоб гарантувати, що системи обробляють персональні дані лише для авторизованих цілей і що ця обробка все ще
      актуальна та необхідна для визначеної мети в системі. Повязані заходи: AC-3, CM-8, CM-12, CM-13, PL-8, PM-22,
      PT-3, PT-5, SI-12, SI-18.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:pm-6
    ref_id: PM-6
    name: Показники продуктивності
    category: process
    csf_function: govern
    description: Розробити, відстежувати та звітувати про результати вимірювань показників продуктивності забезпечення
      безпеки інформації та приватності.
    annotation: Показники продуктивності — це показники, які використовуються організацією для вимірювання ефективності
      програм інформаційної безпеки та конфіденційності, а також заходів захисту, що використовуються для підтримки
      програми. Щоб сприяти управлінню ризиками безпеки та приватності, організації розглядають узгодження показників
      ефективності з організаційною толерантністю до ризику, як визначено в стратегії управління ризиками.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:pm-7
    ref_id: PM-7
    name: Архітектура підприємства
    category: process
    csf_function: govern
    description: 'Заходи захисту: Розробити корпоративну архітектуру з урахуванням вимог програми інформаційної
      безпеки та приватності, а також результатів оцінки ризику для операцій і активів організації, фізичних осіб,
      інших організацій та держави.'
    annotation: Інтеграція вимог і заходів захисту в архітектуру організації гарантує, що питання безпеки та приватності
      розв’язуються на початку життєвого циклу розробки системи й безпосередньо та явно пов’язані з місією і процесами
      організації та вбудовуються відповідно до стратегії управління ризиками організації. Для PM-7 архітектури
      безпеки та приватності розробляються на системному рівні всіх систем організації. Для PL-8 архітектури безпеки
      та приватності розробляються на рівні, який представляє окрему систему. Архітектури системного рівня узгоджуються
      з архітектурами безпеки та приватності, визначеними в організації. Вимоги до безпеки та приватності та інтеграції
      заходів захисту найефективніше досягаються шляхом суворого застосування Risk Management Framework [SP 800-37]
      і допоміжних стандартів безпеки та інструкцій.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:pm-7.1
    ref_id: PM-7(1)
    name: Архітектура підприємства — Розвантаження
    category: process
    csf_function: govern
    description: 'Розвантажити [Призначення: несуттєві функції або послуги, визначені організацією] шляхом перенесення
      до інших систем, компонентів системи або передачі зовнішньому постачальнику.


      Параметри:

      1. Призначення: несуттєві функції або послуги, визначені організацією'
    annotation: Не кожна функція або послуга, яку надає система, є важливою для виконання цілей чи функцій організації.
      Друк або копіювання є прикладом несуттєвої, але допоміжної послуги для організації. Якщо це можливо, такі
      допоміжні, але несуттєві функції чи послуги не розміщуються разом із функціями чи послугами, які підтримують
      основні цілі чи функції організації. Підтримка таких функцій у тій самій системі чи системному компоненті
      збільшує поверхню атаки на основні функції або послуги організації. Переміщення допоміжних, але несуттєвих
      функцій до некритичної системи, системного компонента або зовнішнього постачальника також може підвищити ефективність
      основної системи, шляхом передачі таких функції або послуг під контроль окремих осіб або постачальників, які
      є експертами в галузі таких функцій або послуг.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:pm-8
    ref_id: PM-8
    name: План захисту критичної інфраструктури
    category: process
    csf_function: govern
    description: Визначити завдання інформаційної безпеки та приватності при розробці документуванні та оновленні
      плану захисту критичної інфраструктури та ключових ресурсів.
    annotation: Стратегії захисту мають базуватися на визначенні пріоритетності критичних активів і ресурсів. Вимоги
      та рекомендації щодо визначення критичної інфраструктури та основних ресурсів, а також підготовки відповідного
      плану захисту критичної інфраструктури містяться в чинному законодавстві.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:pm-9
    ref_id: PM-9
    name: Стратегія управління ризиками
    category: process
    csf_function: govern
    description: "a. Розробити комплексну стратегію управління:\n\t1. ризиками безпеки для операцій та активів організації,\
      \ фізичних осіб, інших організацій і держави, пов’язаних з експлуатацією та використанням систем організації;\n\
      \t2. ризиками приватності для фізичних осіб, які можуть виникати внаслідок збирання, обміну, зберігання, передачі,\
      \ використання та розпорядження персональними даними;\nb. Реалізувати стратегію управління ризиками в масштабах\
      \ організації.\nc. Переглядати й оновлювати стратегію управління ризиками [Призначення: з визначеною організацією\
      \ частотою] або, якщо потрібно, у разі змін в організації.\n\nПараметри:\n1. Призначення: з визначеною організацією\
      \ частотою"
    annotation: 'Загальноорганізаційна стратегія управління ризиками охоплює: прийнятні методики оцінювання ризику,
      стратегії зменшення ризику безпеки та приватності ланцюгів постачань, процес послідовного оцінювання ризику
      безпеки та приватності ланцюгів постачань по всій організації та підходи до моніторингу ризику. Старша посадова
      особа з управління ризиками має зіставляти процеси управління інформаційною безпекою з процесами стратегічного,
      оперативного та бюджетного планування. Функція управління ризиками, яку очолює старша посадова особа, відповідальна
      за управління ризиками, може сприяти послідовному застосуванню стратегії управління ризиками в усій організації.
      Стратегія управління ризиками може ґрунтуватися на вхідних даних, пов’язаних із ризиком безпеки та приватності,
      з інших джерел, як внутрішніх, так і зовнішніх для організації, щоб гарантувати, що стратегія є широкою та
      всеосяжною. Стратегія управління ризиками ланцюга постачання, описана в PM-30, також може надати корисні дані
      для загальної стратегії управління ризиками організації.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:pm-10
    ref_id: PM-10
    name: Процес авторизації
    category: process
    csf_function: govern
    description: 'a. Управляти станом безпеки та приватності інформаційних систем організації та середовищ, у яких
      ці інформаційні системи експлуатуються через процедури авторизації.

      b. Призначити окремих осіб для виконання певних ролей і обов’язків у рамках організаційного процесу управління
      ризиками.

      c. Інтегрувати процеси авторизації в загальноорганізаційну програму управління ризиками.'
    annotation: 'Процеси авторизації систем в організації і робочих середовищ вимагають впровадження: загальноорганізаційного
      процесу управління ризиками; структури управління ризиками та супутніх стандартів; рекомендацій щодо безпеки
      та приватності. Конкретні ролі для процесів управління ризиками включають відповідального керівника ризиків
      (функцію) та призначених посадових осіб для кожної системи в організації та основного постачальника засобів
      захисту. Процеси акредитації мають бути інтегровані з процесами постійного моніторингу для полегшення постійного
      розуміння та прийняття ризиків безпеки та приватності для операцій і активів організації, осіб та інших організацій
      і країни.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:pm-11
    ref_id: PM-11
    name: Визначення завдань і процесів
    category: process
    csf_function: govern
    description: 'a. Визначити організаційні завдання та процеси з урахуванням інформаційної безпеки та приватності
      й ризиків, пов’язаних з організаційними операціями, організаційними активами, фізичними особами, іншими організаціями
      та державою.

      b. Визначити потреби захисту інформації та персональних даних, які випливають із завданнь і процесів.

      c. Переглядати й перевіряти завдання та процеси [Призначення: з визначеною організацією частотою].


      Параметри:

      1. Призначення: з визначеною організацією частотою'
    annotation: Потреби в захисті — це незалежні від технології, необхідні можливості протидії загрозам через компрометацію
      інформації (тобто втрати конфіденційності, цілісності, доступності чи приватності). Необхідність захисту інформації
      та персональних даних при обробці інформації випливає з місії та ділових потреб, що визначаються зацікавленими
      сторонами в організаціях, місії та процесів, визначених для задоволення цих потреб, та стратегії управління
      організаційними ризиками. Захист інформації та потреби в обробці персональних даних визначають необхідні заходи
      захисту для організації та систем. Для визначення потреб у захисті та обробці персональних даних, невід’ємним
      є розуміння несприятливих наслідків, до яких може призвести компрометація або злам таких даних. Процес категоризації
      використовується для визначення такого потенційного впливу. Ризики приватності для осіб можуть виникати через
      компрометацію персональних даних або як ненавмисні наслідки чи побічні ефекти їх обробки на будь-якій стадії
      життєвого циклу персональних даних. Оцінка ризиків приватності використовується для визначення пріоритетності
      ризиків, які створюються для осіб у результаті системної обробки песональних даних. Така оцінка дозволяє обрати
      необхідний захід захисту. Визначення місії та процесів і пов’язані з цим вимоги щодо захисту мають документуватися
      відповідно до організаційної політики та процедур.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:pm-12
    ref_id: PM-12
    name: Програма інсайдерської загрози
    category: process
    csf_function: govern
    description: Впровадити програму інсайдерської (внутрішньої) загрози, яка передбачає наявність команди з обробки
      інцидентів, пов’язаних з внутрішньою дисципліною.
    annotation: Відповідно до Указу 13587 [EO 13587] і Національної політики щодо внутрішніх загроз [ODNI NITP]
      організації, які обробляють секретну інформацію, зобов’язані створювати програми інсайдерських загроз. Стандарти
      та рекомендації, що застосовуються до програм інсайдерських загроз, також можуть ефективно застосовуватися
      для підвищення безпеки критичної інформації. Програми інсайдерської загрози містять заходи для виявлення та
      запобігання зловмисній інсайдерській діяльності за допомогою централізованої інтеграції та аналізу технічної
      і нетехнічної інформації для виявлення потенційних проблем щодо інсайдерської загрози. Старша посадова особа,
      призначена керівником, має забезпечувати та здійснювати контроль за програмою. Окрім централізованої інтеграції
      та аналізу, програми інсайдерських загроз вимагають від організацій підготувати політику та плани впровадження
      інсайдерських загроз для окремих підрозділів, здійснювати моніторинг дій окремих співробітників на робочих
      місцях, де, обробляється інформація з обмеженим доступом, проводити навчання зі співробітниками для поінформованості
      про інсайдерські загрози, отримувати доступ до інформації з окремих підрозділів для аналізу інсайдерської
      загрози та проводити самооцінку інсайдерських загроз в підрозділах. Програми інсайдерських загроз можуть ініціювати
      створення груп, що займаються поводженням з інцидентами, які, можливо, уже наявні в організації, — таких як
      команди реагування на інциденти комп’ютерної безпеки. Записи стосовно кадрових ресурсів є особливо важливими
      (оскільки є переконливі докази, які свідчать про те, що деяким видам інсайдерських злочинів часто передує
      нетехнічна поведінка на робочому місці, включно з, наприклад, постійним незадоволенням і конфліктами з колегами).
      Однак використання записів стосовно поведінки кадрового складу може створювати значні ризики приватності.
      Має бути залучена юридична служба для забезпечення дотримання всіх вимог щодо приватності персональних даних.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:pm-13
    ref_id: PM-13
    name: Безпека та приватність працівників
    category: process
    csf_function: govern
    description: Створити програму розвитку та вдосконалення спеціалістів з питань безпеки та приватності.
    annotation: Програми розвитку та підвищення обізнаності спеціалістів з питань безпеки та приватності містять,
      наприклад, визначення знань, умінь і навичок, необхідних для виконання обов’язків і завдань безпеки та приватності,
      розробку навчальних програм на основі ролей для осіб, яким призначені ролі та обов’язки щодо безпеки та приватності,
      надання вказівок для вимірювання та побудови індивідуальних кваліфікацій для посадових осіб і кандидатів на
      посади, пов’язані з безпекою та приватністю. Програми заохочують організації наймати на посади з питань безпеки
      та приватності кваліфікованих працівників. Програми розвитку та підвищення обізнаності спеціалістів з питань
      безпеки та приватності доповнюють програми інформаційного забезпечення і навчання з питань безпеки та зосереджуються
      на інституціоналізації основних можливостей безпеки та приватності, підготовці персоналу щодо впровадження
      дій, необхідних для захисту операцій організації, активів і персональних даних.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:pm-14
    ref_id: PM-14
    name: Тестування, навчання та моніторинг
    category: process
    csf_function: govern
    description: 'a. Впровадити процес забезпечення планів організації проведення тестування безпеки та приватності,
      навчання та моніторингу діяльності, пов’язаної з інформаційними системами організації, який:

      1.  розробленим та підтримується постійно;

      2. виконується своєчасно.

      b. Перевіряти плани тестування, навчання та моніторингу для узгодженості з організаційною стратегією управління
      ризиками та загальноорганізаційними пріоритетами дій щодо реагування на ризик.'
    annotation: Цей захід захисту надає рекомендації щодо тестування безпеки та приватності, навчання та моніторингових
      заходів, що проводяться в масштабах усієї організації та допомагає гарантувати, що організації здійснюють
      нагляд за діяльністю з тестування, навчання та моніторингу, а також координують ці дії. Зі зростанням важливості
      програм постійного моніторингу, впровадження інформаційної безпеки та приватності на трьох рівнях ієрархії
      управління ризиками та широкого використання загальних заходів захисту, організації координують і консолідують
      заходи тестування та моніторингу, які регулярно проводяться як частина поточних оцінки, що підтримують різноманітні
      заходи захисту. Навчальні заходи з безпеки та приватності, які зосереджені на окремих системах і конкретних
      ролях, також потребують координації між усіма організаційними елементами. Плани та заходи тестування, навчання
      та моніторингу базуються на поточних оцінках загроз і вразливості.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:pm-15
    ref_id: PM-15
    name: Контакти з групами та асоціаціями з питань безпеки інформації та приватності
    category: process
    csf_function: govern
    description: 'Створити та інституціоналізувати контакти між обраними групами та асоціаціями зі спільнотами безпеки
      та приватності для:

      a. сприяння постійному навчанню та підготовці персоналу в галузі безпеки інформації та приватності;

      b. підтримки ознайомленості з рекомендованими практиками безпеки інформації та приватності, техніками та технологіями;

      c. розповсюдження поточної інформації про стан безпеки та приватності, включно із загрозами, вразливостями
      та інцидентами.'
    annotation: Постійний контакт з групами та асоціаціями з питань безпеки інформації та приватності має велике
      значення в умовах технологій і загроз, які швидко змінюються. До груп і асоціацій з питань безпеки інформації
      та приватності належать, наприклад, спеціальні групи за інтересами, професійні асоціації, форуми, новинарні
      групи та групи фахівців з безпеки інформації та приватності. Організації обирають групи та асоціації на основі
      місій і ділових функцій організації. Організації поділяють загрозу, вразливість та інформацію про інциденти,
      а також контекстуальні уявлення, методи дотримання та проблеми приватності, що відповідають чинним законам,
      наказам, директивам, політикам, правилам, стандартам та рекомендаціям.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:pm-16
    ref_id: PM-16
    name: Програма інформування про загрози
    category: process
    csf_function: identify
    description: Запровадити програму інформування про загрози, яка містить можливості спільного обміну інформацією
      між організаціями для аналізу загроз.
    annotation: Через постійну мінливість і все більшу кваліфікацію порушників, шанси успішного порушення або компрометації
      систем, що належать організації різко зростають. Однією з найкращих методик для вирішення цієї проблеми є
      обмін інформацією про загрози, включаючи події загрози (тобто тактику, методики та процедури), які організації
      зазнали, пом'якшення, які організації виявили, та які виявились ефективними проти певних видів загроз. Обмін
      інформацією про загрози може бути двостороннім або багатостороннім. Прикладами двостороннього обміну щодо
      загрози можуть бути державно-комерційні кооперативи та державно-урядові кооперативи. Прикладами багатостороннього
      обміну є організації, які беруть участь у консорціумах. Інформація про загрози може бути дуже чутливою (у
      такому разі необхідна наявність спеціальних угод між контрагентами щодо взаємного нерозголошення).
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:pm-16.1
    ref_id: PM-16(1)
    name: Програма інформування про загрози — Автоматизовані засоби для обміну інформацією про загрози
    category: process
    csf_function: identify
    description: Використовувати автоматизовані засоби з метою максимізації ефективності обміну інформацією про
      виявлені загрози.
    annotation: Для досягнення максимальної ефективності моніторингу важливо знати, яку загрозу та індикатори повинні
      шукати датчики. Використовуючи налагоджені сервіси та автоматизовані інструменти, організації значно покращують
      свою здатність швидко ділитися та передавати в засоби моніторингу виявлені загрози.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:pm-17
    ref_id: PM-17
    name: Захист публічної інформації у зовнішніх системах
    category: process
    csf_function: govern
    description: 'a. Розробити політику та процедури для забезпечення того, щоб вимоги до захисту публічної (некласифікованої)
      інформації, яка обробляється, зберігається або передається у зовнішніх системах, здійснювалися відповідно
      до чинного законодавства.

      b. Оновлювати політику та процедури [Призначення: з визначеною організацією частотою].


      Параметри:

      1. Призначення: з визначеною організацією частотою'
    annotation: Контрольована некласифікована інформація визначається Національною адміністрацією архівів та записів
      разом із вимогами захисту та розповсюдження такої інформації та кодифікується в [32 CFR 2002], а спеціально
      для систем, зовнішніх для федеральної організації, 32 CFR 2002.14H. Політика прописує конкретне використання
      та умови, які повинні бути реалізовані відповідно до процедур організації, включаючи його договірні процеси.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:pm-18
    ref_id: PM-18
    name: Програма (концепція) забезпечення приватності
    category: process
    csf_function: govern
    description: 'a. Розробити та поширити загальноорганізаційну програму (концепцію) забезпечення приватності,
      яка:

      1. містить опис структури програми забезпечення приватності та ресурсів, призначених для її реалізації;

      2. містить огляд вимог до забезпечення приватності й опис засобів управління програмою забезпечення приватності
      та загальних заходів захисту, встановлених або запланованих для задоволення цих вимог;

      3. визначає обов’язки посадової особи щодо приватності, а також визначає обов’язки інших посадових осіб і
      персоналу з питань забезпечення приватності;

      4. описує зобов’язання керівництва, стратегічні цілі та завдання програми забезпечення приватності;

      5. відображає координацію між організаційними структурами, відповідальними за різні аспекти приватності;

      6. затверджена високопосадовцем, який є відповідальним (та підзвітним) за: управління ризиками приватності,
      що виникають при здійсненні операцій організації (включно із завданнями, функціями, іміджем і репутацією);
      організаційними активами, фізичними особами, іншими організаціями та країнами.


      b. Оновлювати програму [Призначення: за визначеною організацією частотою], а також в разі змін законодавства,
      змін в організації і виявлення проблем в ході реалізації програми або оцінювання заходів приватності.


      Параметри:

      1. Призначення: за визначеною організацією частотою'
    annotation: 'Програма приватності — це документ, який описує: структуру програми приватності; ресурсів, присвячених
      програмі приватності; ролі старшої посадової особи щодо приватності, а також визначає обов’язки інших посадових
      осіб і персоналу з питань забезпечення приватності, стратегічні цілі та завдання програми приватності, управління
      програмами та загальний контроль, що існує або планується для задоволення чинних вимог приватності та управління
      ризиками приватності. Програма приватності може бути інтегрована з планами захисту інформації або може бути
      представлена самостійно. Старша посадова особа з питань приватності несе відповідальність за загальні, специфічні
      та гібридні заходи захисту щодо забезпечення приватності в організації та управління програмами приватності.
      Програми приватності мають містити достатньо інформації щодо управління та загальних заходів захисту (включно
      зі специфікацією параметрів). Плани захисту персональних даних окремих систем та плани приватності для всієї
      організації разом мають повністю охоплювати всі заходи захисту, що застосовуються в організації для забезпечення
      конфіденційності. Заходи захисту програми приватності, як правило, впроваджуються на рівні організації та
      є важливими для її керування в організації. Вони відрізняються від звичайних, специфічних та гібридних заходів
      захисту, оскільки не залежать від конкретної інформаційної системи. Разом плани приватності для окремих систем
      і план програми приватності для всієї організації забезпечують повне охоплення заходів захисту щодо конфіденційності
      в організації. Організації на власний розсуд вирішують, чи описувати загальні заходи захисту в одному документі,
      чи в декількох. Якщо програма приватності містить кілька документів, організація вказує в кожному документі
      організаційну посадову особу, відповідальну за розробку, реалізацію, оцінювання та моніторинг відповідних
      загальних заходів захисту. Загальні заходи захисту мають бути задокументовані в додатку до програми приватності
      організації, якщо вони не внесені в окремий план. План програми приватності для всієї організації вказує,
      які окремі плани приватності містять опис заходів захисту для забезпечення конфіденційності.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:pm-19
    ref_id: PM-19
    name: Керівні ролі програми приватності
    category: process
    csf_function: govern
    description: Призначити старшу посадову особу з питань забезпечення приватності з повноваженнями, завданням,
      підзвітністю і ресурсами для координації, розробки та реалізації відповідних вимог забезпечення приватності
      й управління ризиками приватності в рамках програми забезпечення приватності всієї організації.
    annotation: Офіцер з питань приватності має бути штатним працівником організації. Для органів державної влади
      відповідно до законів, указів, директив, нормативних актів, стандартів та рекомендацій – ця особа призначається
      старшою посадовою особою органу з питань приватності. Організації також можуть називати цю посадову особу
      головним офіцером з питань приватності. Старша посадова особа органу з питань приватності також входить до
      складу комісії (ради) з управління даними (див. PM-23) та комісії (ради) з цілісності даних (див. PM-24).
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:pm-20
    ref_id: PM-20
    name: Система записів програми приватності
    category: process
    csf_function: govern
    description: 'підтримувати центральну вебсторінку ресурсу на головному загальнодоступному вебсайті організації,
      яка слугує центральним джерелом інформації про програму приватності організації та яка:

      a. забезпечує доступ громадськості до інформації про діяльність щодо забезпечення приватності в організації
      та можливість комунікації з уповноваженою посадовою особою з питань забезпечення приватності;

      b. оприлюднює організаційну політику забезпечення приватності на вебсайті організації або іншим чином;

      c. використовує публічні адреси електронної пошти та/або телефонні лінії, щоб дати можливість громадськості
      надавати відгуки та/або направляти запитання щодо програми приватності в організації.'
    annotation: Для органів державної влади вебсторінки мають розташовуватися на домені .gov.ua. Органи державної
      влади включають оцінку впливу на публічну приватність, систему сповіщень про записи, повідомлення та угоди,
      винятки та правила впровадження, звіти про конфіденційність, політику конфіденційності, інструкції для осіб,
      які надсилають запити на доступ або зміни, адреси електронної пошти для запитань/скарг, блоги, періодичні
      видання.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:pm-20.1
    ref_id: PM-20(1)
    name: Система записів програми приватності — Політика приватності вебсайтів, додатків і цифрових послуг
    category: process
    csf_function: govern
    description: 'Розробити та опублікувати політику конфіденційності на всіх зовнішніх вебсайтах, у мобільних додатках
      та інших цифрових службах, яка:

      a) написана простою мовою та організована так, щоб її було легко зрозуміти та впроваджувати;

      b) надає інформацію, необхідну громадськості для прийняття обґрунтованого рішення про те, як взаємодіяти з
      організацією;

      c) оновлюються щоразу, коли організація вносить суттєві зміни до політики, яку вона описує, і включає позначку
      часу/дати для інформування громадськості про дату останніх змін.'
    annotation: Організації публікують політику приватності на всіх зовнішніх вебсайтах, у мобільних додатках та
      інших цифрових службах. Організації розміщують посилання на відповідну політику приватності на будьяких відомих
      основних точках входу на вебсайт, додатках чи цифрових сервісах. Крім того, організації надають посилання
      на політику приватності на будь-якій вебсторінці, яка збирає персональні дані. На організації можуть поширюватися
      відповідні закони, виконавчі накази, директиви, нормативні акти чи політики, які вимагають надання певної
      інформації громадськості. Персонал організації консультується зі старшим представником агентства з приватності
      та юрисконсультантом щодо таких вимог.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:pm-21
    ref_id: PM-21
    name: Облік розкриття персональних даних
    category: process
    csf_function: govern
    description: 'a. Забезпечити доступ громадськості до інформації із забезпечення приватності в організації та
      можливість комунікації з уповноваженою посадовою особою з питань забезпечення приватності щодо:

      1. дати, характеру та мети кожного розкриття запису;

      2. імені та адреси особи або організації, щодо яких було зроблено розкриття даних.

      b. Обліковувати та зберігати випадки розкриття персональних даних протягом терміну дії запису або п’яти років
      після розкриття інформації.

      c. Здійснювати облік випадків розкриття персональних даних, доступних особі, зазначеній у записі за запитом.'
    annotation: Облік випадків розкриття персональних даних полягає в тому, щоб дозволити особам дізнатися, кому
      були розкриті записи про них; створити основу для подальшого консультування одержувачів записів будь-яких
      виправлених або оскаржених записів; надати аудиту відомості для наступних перевірок відповідності організацій
      щодо виконання умов розкриття інформації. Для органів державної влади облік та зберігання випадків розкриття
      персональних даних є обов'язковим згідно з [PRIVACT]; організації повинні звернутися до старшою посадової
      особи з питань приватності та юрисконсультанта з таких питань і бути обізнаними з законодавчими винятками
      та дорученнями OMB, пов'язаними з цим положенням. Організації можуть використовувати будь-яку систему для
      зберігання записів про випадки розкриття, якщо з неї можна скласти документ зі списком всіх випадків розкриття
      разом з іншою необхідною інформацією. Також можливе використання автоматизованих механізмів для визначення
      часу розкриття персональних даних, включаючи комерційні сервіси, які надають сповіщення та повідомлення. Облік
      випадків розкриття також може бути використаний для допомоги організаціям у перевірці дотримання вимог законодавства
      з питань приватності та політик щодо розкриття або поширення персональних даних та обмежень щодо їх розповсюдження.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:pm-22
    ref_id: PM-22
    name: Управління якістю персональних даних
    category: process
    csf_function: govern
    description: 'Розробити та задокументувати загальноорганізаційну політику та процедури, які довзолять:

      a. Проводити огляд точності, актуальності, своєчасності та повноти персональних даних протягом їх життєвого
      циклу;

      b. Коригувати або видаляти неточну або застарілу інформацію;

      c. Інформувати осіб або інші відповідні організації про внесення змін або видалення персональної інформації;

      d. Оскаржувати відмови на запити щодо коригування чи видалення.'
    annotation: 'Настанови щодо Управління якістю персональних даних містять обґрунтовані кроки, які організації
      вживають для підтвердження точності й актуальності персональних даних, що визначаються протягом її життєвого
      циклу. Життєвий цикл персональних даних містить: створення, збір, використання, обробку, зберігання, обслуговування,
      розповсюдження, розкриття та розміщення персональних даних. Організаційні політики та процедури для управління
      якістю персональних даних є важливими, оскільки неточні або застарілі персональні дані, які зберігаються організаціями,
      можуть створювати проблеми для осіб. Організації розглядають якість персональних даних, які задіяні в бізнес-функціях,
      де неточна інформація може призвести до негативних рішень або відмови у послугах та пільгах, або розкриття
      такої інформації може призвести до негативних наслідків. У певних обставинах правильна інформація може створювати
      проблеми для особи, тому організації розглядають створення політик та процедур для видалення такої інформації.
      Старша посадова особа з питань приватності забезпечує наявність практичних засобів та механізмів, які є доступними
      для осіб або їх уповноважених представників для звернення щодо виправлення або видалення персональних даних.
      Процеси виправлення або видалення даних чітко визначені та доступні для громадськості. Організації використовують
      обгрунтований (дискреційний) підхід до визначення, чи слід видаляти або виправляти дані на основі обсягу запитів
      щодо запропонованих змін, та наслідків таких змін. Крім того, процеси включають надання відповідей особам
      щодо відмови у запитах на виправлення або видалення. У відповіді наводяться причини прийнятих рішень, забезпечується
      можливість реєстрації індивідуальних скарг на ці рішення та запитів на перегляд початкових визначень. Для
      забезпечення прозорості та підтвердження виконаних дій, організації повідомляють осіб або їх уповноважених
      представників, коли персональна інформація цих осіб була виправлена або видалена.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:pm-23
    ref_id: PM-23
    name: Орган управління персональними даними
    category: process
    csf_function: govern
    description: 'створити орган управління персональними даними, на якого покладено [Призначення: визначені організацією
      функції] та виконання [Призначення: визначені організацією обов’язки].


      Параметри:

      1. Призначення: визначені організацією функції

      2. Призначення: визначені організацією обов’язки'
    annotation: Орган управління персональними даними може допомогти забезпечити наявність злагоджених політик у
      організації та можливість дотримання балансу між використанням даних та вимогами щодо забезпечення їх безпеки
      та приватності. Орган з управління персональними даними встановлює політики, процедури та стандарти, що сприяють
      управлінню даними таким чином, щоб персональні дані були ефективно контрольовані та зберігалися відповідно
      до чинного законодавства, виконавчих наказів, директив, політик, стандартів та рекомендацій. Обов'язки можуть
      включати розробку та впровадження рекомендацій, що підтримують моделювання даних, якість, цілісність та потреби
      у деідентифікації персональних даних на всіх етапах їх життєвого циклу, а також перегляд та затвердження заявок
      на надання даних за межі організації, архівування заявок, проведення моніторингу після надання даних для гарантування
      того, що прийняті рішення на підставі даних залишаються актуальними та обгрунтованими. До складу органу управління
      персональними даними входять керівник інформаційної служби, старша посадова особа з інформаційної безпеки
      та старша посадова особа з питань приватності. Органи державної влади повинні створити Орган з управління
      персональними даними з конкретними функціями та обовязками згідно з [EVIDACT] та політиками, встановленими
      згідно з [OMB M-1923].
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:pm-24
    ref_id: PM-24
    name: Орган з питань цілісності даних
    category: process
    csf_function: govern
    description: 'Створити орган з питань цілісності даних для здійснення:

      a. Розгляду пропозицій щодо проведення відповідної програми або участі у ній.

      b. Проведення огляду усіх поточних програм, в яких бере участь організація.'
    annotation: Орган з питань цілісності даних – це орган, який складається зі старших посадових осіб, які призначені
      керівником органу державної влади і який відповідає за огляд пропозицій щодо проведення або участі у програмі
      відповідності та здійснення щорічного огляду всіх програм відповідності, в яких орган брав участь. Загалом,
      програма відповідності - це комп'ютерне порівняння записів з двох або більше автоматизованих систем записів
      [PRIVACT], які зберігаються не в органі державної влади (або його представника). Програма порівняння пов'язана
      з державними програмами соціальних вигод або державними записами про персонал та заробітну плату. Як мінімум,
      до складу органу з питань цілісності даних входять генеральний інспектор відповідного відомства та старша
      посадова особа з питань приватності.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:pm-25
    ref_id: PM-25
    name: Мінімізація кількості персональних даних, що використовуються під час тестування, навчання та досліджень
    category: process
    csf_function: govern
    description: 'a. Розробити та впровадити політики та процедури, спрямовані на врегулювання питань використання
      персональних даних для внутрішнього тестування, навчання та досліджень.

      b. Вжити заходи щодо обмеження або зведення до мінімуму кількості персональних даних, які використовуються
      для внутрішнього тестування, навчання та досліджень.

      c. Надавати дозвіл на використання персональних даних, коли така інформація вимагається для внутрішнього тестування,
      навчання і досліджень.

      d. Здійснювати огляд та оновлення політик та процедур, спрямованих на врегулювання питань використання персональних
      даних для внутрішнього тестування, навчання та досліджень [Призначення: з визначеною організацією частотою].


      Параметри:

      1. Призначення: з визначеною організацією частотою'
    annotation: Організації часто використовують персональні дані для тестування нових застосунків чи систем, для
      наукових цілей та навчання. Використання персональних даних для тестування, досліджень і навчання збільшує
      ризик несанкціонованого розголошення або неправомірного використання таких даних. Організації мають консультуватися
      зі старшою посадовою особою з питань приватності та юридичним відділом, щоб переконатися, що використання
      персональних даних для тестування, навчання та досліджень є сумісним з початковою метою, для якої вони були
      зібрані. За можливості, організації використовують заповнювачі даних для уникнення розголошення персональних
      даних під час проведення тестування, навчання та досліджень.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:pm-26
    ref_id: PM-26
    name: Управління скаргами
    category: process
    csf_function: govern
    description: 'Впровадити процес отримання та реагування на скарги, проблеми чи запитання від фізичних осіб щодо
      організаційної практики забезпечення приватності, який охоплює:

      a. механізми, які легко використовувати та які є легкодоступними для громадськості;

      b. усю інформацію, необхідну для успішного подання скарг;

      c. механізми відстеження, що забезпечують отримання всіх скарг та їх вчасний і належний розгляд протягом [Призначення:
      визначений організацією період часу];

      d. підтвердження отримання скарг, заявлених проблем чи запитань від фізичних осіб протягом [Призначення: визначений
      організацією період часу];

      e. надання відповідей на отримані скарги, заявлені проблеми чи запитання від фізичних осіб протягом [Призначення:
      визначений організацією період часу].


      Параметри:

      1. Призначення: визначений організацією період часу'
    annotation: 'Скарги та запити фізичних осіб можуть слугувати цінним джерелом зворотнього зв’язку для організації,
      що дозволяє поліпшити операційні моделі, використання технологій, практики збору даних, а також контроль приватності
      й безпеки. До механізмів, які можуть бути використані для зворотного зв’язку, належать: електронна пошта,
      телефонна гаряча лінія або вебформи.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:pm-27
    ref_id: PM-27
    name: Звітність з питань забезпечення приватності
    category: process
    csf_function: govern
    description: 'a. Розробити [Призначення: визначені організацією звіти з питань забезпечення приватності] та
      надати:

      1. [Завдання: наглядові органи, визначені організацією] для перевірки дотримання вимог законодавства, а також
      визначених регуляторними актами та нормативними документами, розробленими відповідно до політики конфіденційності;

      2. [Призначення: посадові особи, визначені організацією] та інший персонал, відповідальний за моніторинг дотримання
      програми приватності.

      b. Переглядати і оновлювати звіти з питань забезпечення приватності [Призначення: частота, визначена організацією].


      Параметри:

      1. Призначення: визначені організацією звіти з питань забезпечення приватності

      2. Завдання: наглядові органи, визначені організацією

      3. Призначення: посадові особи, визначені організацією

      4. Призначення: частота, визначена організацією'
    annotation: Внутрішня та зовнішня звітність з питань забезпечення приватності допомагає організаціям забезпечувати
      відповідальність та прозорість в операціях з персональними даними. Надання звітності також може допомогти
      організаціям визначити прогрес у виконанні вимог щодо забезпечення приватності та контролю, порівнювати результати
      з іншими урядовими органами, виявляти вразливості, ідентифікувати недоліки в політиці та її реалізації, а
      також виявляти ефективні моделі забезпечення приватності. Для органів державної влади звіти з питань забезпечення
      приватності включають щорічні звіти старшої посадової особи агентства з питань приватності до OMB, звіти до
      Конгресу, які вимагаються регулюючими документами Закону про комісію 9/11 та інші публічні звіти, які вимагаються
      законом, регулюванням або політикою, включаючи внутрішні політики організації. Старша посадова особа агентства
      з питань приватності консультується з юрисконсультантами, за необхідності, щоб забезпечити дотримання всіх
      відповідних вимог щодо звітності про забезпечення приватності
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:pm-28
    ref_id: PM-28
    name: Оцінка ризиків
    category: process
    csf_function: identify
    description: 'a. Визначити та задокументувати:

      1. припущення, що впливають на оцінку ризиків, реагування на ризики та моніторинг ризиків;

      2. обмеження, що впливають на оцінку ризиків, реагування на ризики та моніторинг ризиків;

      3. пріоритети та компроміси, які розглядаються організацією для здійснення управління ризиками;

      4. стійкість організації до ризиків.

      b. Поінформувати [Призначення: визначений організацією персонал] про результати визначення ризиків.

      c. Переглядати та оновлювати підходи щодо визначення ризиків [Призначення: з визначеною організацією частотою].


      Параметри:

      1. Призначення: визначений організацією персонал

      2. Призначення: з визначеною організацією частотою'
    annotation: Оцінка ризиків є найбільш ефективною, коли проводиться на рівні організації з консультацією зацікавлених
      сторін всієї організації, включаючи організаторів місії, бізнесу та систем. Оцінка ризиків, відповідь на ризики
      та моніторинг ризиків ґрунтуються на стратегії управління ризиками, яка формується на основі припущень, обмежень,
      рівня прийняття ризику, пріоритетів та компромісів, визначених у процесі оцінки ризиків. Результати оцінки
      ризиків передаються персоналу організації, включаючи власників(організаторів) місії та бізнесу, власників
      інформації, систем, уповноважених посадових осіб, старшої посадової особи з питань приватності, старшоїпосадової
      особи з питань управління ризиками.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:pm-29
    ref_id: PM-29
    name: Ролі керівників програми управління ризиками
    category: process
    csf_function: govern
    description: 'a. Призначити старшу посадову особу, відповідальну за управління ризиками, для узгодження процесів
      управління організації інформаційною безпекою та приваністю, включаючи процеси планування стратегії, фінансування,
      діяльності організації;

      b. Створити посаду відповідального за управління ризиками (або покласти відповідні обов’язки на посадову особу
      організації) з метою розгляду та аналізу ризиків з точки зору всієї організації та забезпечення узгодженого
      управління ризиками в межах всієї організації.'
    annotation: Відповідальна старша посадова особа з питань управління ризиками очолює виконавчу (функціональну)
      службу з питань управління ризиками в організації.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:pm-30
    ref_id: PM-30
    name: План управління ризиками ланцюга постачання
    category: process
    csf_function: govern
    description: 'a. Розробити план управління ризиками ланцюга постачання, пов’язаного з розробкою, придбанням,
      обслуговуванням та утилізацією систем, компонентів системи та послуг для системи.

      b. Реалізувати план управління ризиками ланцюга постачання послідовно та наскрізно по всій організації.

      c. Переглядати й оновлювати план управління ризиками ланцюга постачання [Призначення: з визначеною організацією
      частотою] або, якщо потрібно, у разі змін в організації.


      Параметри:

      1. Призначення: з визначеною організацією частотою'
    annotation: План управління ризиками ланцюга постачання на рівні організації включає чітке визначення інтересів
      та стійкості щодо ризиків ланцюга постачання для організації, прийнятні стратегії або контроль за ризиками
      ланцюга постачання, процес постійної оцінки та моніторингу ризиків ланцюга постачання, підходи до впровадження
      та комунікації стратегії управління ризиками ланцюга постачання, а також пов'язані з цим ролі та відповідальності.
      Управління ризиками ланцюга постачання включає врахування ризиків безпеки та приватності, пов'язаних з розробкою,
      придбанням, підтримкою та видаленням систем, компонентів систем та послуг для системи. План управління ризиками
      ланцюга постачання можна включити до загального плану управління ризиками організації та використовувати його
      для керування та надання інформації щодо політик управління ризиками ланцюга постачання та планів управління
      ризиками ланцюга на рівні системи. Крім того, використання послуг спеціаліста з ризик-менеджменту може допомогти
      забезпечити послідовне, широкомасштабне застосування стратегії управління ризиками в ланцюгу постачання на
      рівні організації. План управління ризиками ланцюга постачання впроваджується на рівні організації, а також
      місії/бізнесу, тоді як план управління ризиками ланцюга постачання (див. SR-2) впроваджується на рівні системи.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:pm-30.1
    ref_id: PM-30(1)
    name: План управління ризиками ланцюга постачання — Постачання критичноважливих товарів або товарів, що мають
      важливе значення для діяльності організації
    category: process
    csf_function: govern
    description: Виявляти, визначати пріоритети та оцінювати постачальників критичноважливих технологій, продуктів
      та послуг, в тому числі тих, які мають важливе значення для діяльності організації.
    annotation: Визначення та пріоритезація постачальників критичних або невідкладних технологій, продуктів та послуг
      є надзвичайно важливим для успіху місії/бізнесу організації. Оцінка постачальників проводиться за допомогою
      оглядів постачальників (див. SR-6) та процесів оцінки ризиків ланцюга постачання (див. RA-3(1)). Аналіз ризиків
      ланцюга постачання може допомогти організації визначити системи або компоненти, для яких потрібні додаткові
      засоби мінімізації ризиків ланцюга постачання.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:pm-31
    ref_id: PM-31
    name: План безперервного моніторингу
    category: process
    csf_function: govern
    description: 'Розробити план безперервного моніторингу в масштабах всієї організації та впровадити програми
      безперервного моніторингу, які включають:

      a. Встановити відповідні показників для моніторингу в масштабах всієї організації [Призначення: визначені
      організацією показники];

      b. Встановити [Призначення: частота, визначеної організацією] для здійснення моніторингу та [Призначення:
      періодичність, визначена організацією] проведення оцінки ефективності контролю;

      c. Постійний моніторинг визначених організацією показників відповідно до стратегії безперервного моніторингу;

      d. Співставлення та аналіз інформації, отриманої в результаті здійснення моніторингу, та контрольних оцінок;

      e. Заходи реагування на результати аналізу оцінок контролю та моніторингових даних;

      f. Звітування про стан безпеки та приватності систем організації перед [Призначення: визначеним організацією
      персоналом чи посадовою особою] [Призначення: з визначеною організацією періодичністю].


      Параметри:

      1. Призначення: визначені організацією показники

      2. Призначення: частота, визначеної організацією

      3. Призначення: періодичність, визначена організацією

      4. Призначення: визначеним організацією персоналом чи посадовою особою

      5. Призначення: з визначеною організацією періодичністю'
    annotation: 'Постійний моніторинг на рівні організації сприяє постійній увазі до стану безпеки та приватності
      в організації для підтримки ризик-менеджменту та прийняття рішень організації. Термін "постійний" означає,
      що організації оцінюють та моніторять свої заходи захисту та ризики з достатньою частотою для підтримки прийняття
      рішень на основі ризику. Різні типи заходів захисту можуть вимагати різної частоти моніторингу. Постійний
      моніторинг дозволяє організаціям керувати ризиками та реагувати на них, використовуючи результати моніторингу.
      Програми постійного моніторингу дозволяють організаціям підтримувати авторизацію систем та загальних заходів
      захисту в динамічних середовищах експлуатації з мінливими умовами щодо потреб місії та бізнесу, загроз, вразливостей
      та технологій. Можливість отримання постійного доступу до інформації, пов''язаної з безпекою та приватністю,
      через звіти та інформаційні панелі дає посадовим особам організації змогу приймати ефективні, своєчасні та
      обґрунтовані рішення щодо управління ризиками, включаючи постійну авторизацію. Для подальшого сприяння управлінню
      ризиками безпеки та приватності, організації розглядають можливість вирівнювання організаційно визначених
      метрик моніторингу з організаційною стійкістю до ризиків, визначеною планом управління ризиками. Вимоги до
      моніторингу, включаючи необхідність проведення самого моніторингу, можуть бути згадані в інших заходах захисту
      та їх посиленнях, таких як: AC-2g, AC-2(7), AC-2(12)(a), AC-2(7)(b), AC-2(7)(c), AC-17(1), AT-4a, AU-13, AU-13(1),
      AU-13(2), CA-7, CM-3f, CM-6d, CM-11c, IR-5, MA-2b, MA-3a, MA-4a, PE-3d, PE-6, PE14b, PE-16, PE-20, PM-6, PM-23,
      PS-7e, SA-9c, SC-5(3)(b), SC-7a, SC-7(24)(b), SC-18b, SC-43b, SI-4.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:pm-32
    ref_id: PM-32
    name: Призначення
    category: process
    csf_function: govern
    description: 'Аналізувати [Призначення: визначені організацією системи чи системні компоненти], які підтримують
      важливі для місії послуги чи функції, щоб гарантувати, що інформаційні ресурси використовуються відповідно
      до їх призначення.


      Параметри:

      1. Призначення: визначені організацією системи чи системні компоненти'
    annotation: Системи призначені для підтримки конкретної місії або бізнес-функції. Однак з часом системи та компоненти
      систем можуть використовуватися для підтримки послуг та функцій, які виходять за межі передбаченого місією
      чи бізнес-функцією. Таке використання може спричинити ризики витоку інформації у небажані середовища, що значно
      збільшить загрозу безпеці. При цьому системи стають більш вразливими до компрометації, що може вплинути на
      послуги та функції, для яких вони призначені. Це особливо впливає на послуги та функції, що є невідкладними
      для виконання місії. Шляхом аналізу використання ресурсів, організації можуть виявити такі можливі вразливості.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ps-1
    ref_id: PS-1
    name: Політика та процедури кадрової безпеки
    category: policy
    csf_function: govern
    description: 'a. Розробити, задокументувати та поширити серед [Призначення: визначених організацією персоналу або ролей]:
  
      1. [Впровадити (одну або декілька): на рівні організації, на рівні місії/бізнес процесу, на рівні системи] політику кадрової
      безпеки, яка:
  
      (a) містить мету, сферу застосування, ролі, обов’язки, відповідальність керівництва, координацію між організаційними підрозділами
      та систему контролю відповідності (complaince);
  
      (b) відповідає чинному законодавству, виконавчим наказам, директивам, нормам, політикам, стандартам та рекомендаціям.
  
      2. Процедури, що сприяють здійсненню політики кадрової безпеки та пов’язаних з ними заходів кадрової безпеки.
  
  
      b. Призначити [Призначення: визначену організацією посадову особу] для управління розробкою, документуванням та впровадженням
      політики та процедур кадрової безпеки.
  
      c. Переглядати та оновлювати:
  
      1. Поточну політику кадрової безпеки [Призначення: з визначеною організацією частотою] та подальші заходи, визначені організацію.
  
      2. Поточні процедури кадрової безпеки [Призначення: з визначеною організацією частотою] та подальші заходи, визначені
      організацію.
  
  
  
      Параметри:
  
  
      1. Призначення: визначених організацією персоналу або ролей
  
  
      2. Впровадити (одну або декілька): на рівні організації, на рівні місії/бізнес процесу, на рівні системи
  
  
      3. Призначення: визначену організацією посадову особу
  
  
      4. Призначення: з визначеною організацією частотою'
    annotation: Цей захід захисту стосується встановлення політики та процедур для ефективного здійснення заходів і їх посилень
      у класі PS. Стратегія управління ризиками є важливим фактором у встановленні політики та процедур. Комплексна політика
      та процедури допомагають забезпечити безпеку та приватність. За наявності політики, а також планів захисту інформації
      та персональних даних на рівні організації, конкретні системні політики та процедури можуть бути не потрібні. Політика
      може бути внесена до складу загальної політики безпеки та приватності або може бути представлена кількома політиками (у
      випадках складної архітектури). Процедури описують, як має реалізуватися політика чи заходи захисту та як вони можуть
      бути спрямовані на персонал або роль, яка є об’єктом процедури. Процедури можуть бути задокументовані в планах захисту
      інформації та персональних даних (як один або декілька документів). Події, що можуть послужити приводом для оновлення
      політики та процедур з персональної безпеки, включають, але не обмежуються оціночними або висновками аудиту, інцидентами
      або порушеннями безпеки, змінами відповідних законів, указів, директив, нормативних актів, політик, стандартів та рекомендацій.
      Просте повторення заходів захисту не вважається організаційною політикою чи процедурою
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ps-2
    ref_id: PS-2
    name: Визначення посадового ризику
    category: process
    csf_function: protect
    description: 'a. Визначити ризики для всіх посад організації.
  
      b. Встановити критерії відбору осіб, які заміщують ці посади.
  
      c. Переглядати та оновлювати посадові ризики [Призначення: з визначеною організацією частотою].
  
  
  
      Параметри:
  
  
      1. Призначення: з визначеною організацією частотою'
    annotation: Класифікації ризику посад відображають політику та рекомендації Офісу з питань управління персоналом (OPM).
      Правильна класифікація посад є основою ефективної та послідовної оцінки придатності персоналу та програми забезпечення
      його безпеки. Система класифікації посад (PDS) оцінює обов'язки та відповідальність посади для визначення ступеня потенційної
      шкоди ефективності або цілісності служби, що може бути завдана через невірні дії посадової особи, та встановлює рівень
      ризику для цієї посади. Оцінка PDS також визначає, чи можуть обов'язки та відповідальність посади створити потенційний
      негативний вплив на національну безпеку та встановлює рівень чутливості такої посади. Результати оцінки визначають, який
      рівень перевірки проводиться для посади. Класифікації ризику можуть впливати на типи дозволів, які отримують особи під
      час доступу до інформаційних ресурсів та систем організації. Критерії відбору посад включають вимоги щодо призначення
      явних ролей із захисту інформації. Частини 1400 та 731 Загального кодексу федеральних регуляцій, Заголовок 5, встановлюють
      вимоги для організацій щодо оцінки відповідальних посад на відповідність рівню чутливості та ризику відповідно до їх обов'язків
      і відповідальності.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ps-3
    ref_id: PS-3
    name: Перевірка персоналу
    category: process
    csf_function: protect
    description: 'a. Перевіряти окремих осіб перед дозволом на доступ до інформаційної системи.
  
      b. Переглядати окремих осіб відповідно до [Призначення: визначених організацією умов, що вимагають перегляду, та якщо
      це визначено необхідною частотою повторного перегляду].
  
  
  
      Параметри:
  
  
      1. Призначення: визначених організацією умов, що вимагають перегляду, та якщо це визначено необхідною частотою повторного
      перегляду'
    annotation: Діяльність щодо перевірки персоналу має проводитися з урахуванням чинного законодавства, а також конкретних
      критеріїв, встановлених для визначення посадового ризику призначених на посади осіб. Організації можуть визначати різні
      умови доступу персоналу до систем на основі типів інформації, що обробляються, зберігаються або передаються системами.
      Прикладами перевірки персоналу є виявлення наявності судимостей та перевірки відповідних відомостей у відповідних органах.
      Організації можуть встановлювати різні умови та частоту повторної перевірки персоналу, який отримує доступ до систем,
      в залежності від типів інформації, яку обробляють, зберігають або передають ці системи.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ps-3.1
    ref_id: PS-3(1)
    name: Перевірка персоналу — Інформація з обмеженим доступом
    category: process
    csf_function: protect
    description: Переконатися, що особи, які мають доступ до інформаційної системи, що обробляє, зберігає або передає інформацію
      з обмеженим доступом, є перевіреними та уповноваженими на доступ до найвищої категорії критичності інформації, до якої
      вони мають доступ в інформаційній системі.
    annotation: Інформація з обмеженим доступом є найбільш чутливою інформацією, яку органи державної влади обробляють, зберігають
      або передають. Необхідно мати відповідний рівень допуску та доступу до системи, що обробляє інформацію з обмеженим доступом,
      перед тим, як мати доступ до такої інформації. Дозволи на доступ забезпечуються заходом захисту з питань забезпечення
      доступу до систем (див. AC-3) та управління інформаційними потоками (див. AC-4).
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ps-3.2
    ref_id: PS-3(2)
    name: Перевірка персоналу — Інструктаж
    category: process
    csf_function: protect
    description: Переконатися, що особи, яким передбачається надати доступ до системи, де обробляється, зберігається або передається
      інформація з обмеженим доступом, пройшли відповідний офіційний інструктаж про всі відповідні типи інформації, до якої
      вони отримають доступ в системі.
    annotation: До типів інформації, для доступу до якої необхідне проходження спеціального інструктажу, належить будь-яка інформація
      з обмеженим доступом (персональні дані, критична інформація, таємна інформація).
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ps-3.3
    ref_id: PS-3(3)
    name: Перевірка персоналу — Інформація, що потребує додаткових заходів захисту
    category: process
    csf_function: protect
    description: 'Переконатися, що особи, які звертаються до ІС та які зберігають, обробляють або передають інформацію, що потребує
      додаткових заходів захисту:
  
      (a) мають чинний дозвіл на доступ, який відповідає законам, наказам, настановам, директивам тощо;
  
      (b) задовольняють [Призначення: визначені організацією додаткові критерії відбору персоналу].
  
  
  
      Параметри:
  
  
      1. Призначення: визначені організацією додаткові критерії відбору персоналу'
    annotation: До інформації, яка потребує додаткових заходів захисту, належить критична інформація, персональні дані та таємна
      інформація. Критерії забезпечення безпеки персоналу включають перевірку відповідності кваліфікаційних вимог персоналу
      до рівня чутливості посади
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ps-3.4
    ref_id: PS-3(4)
    name: Перевірка персоналу — Вимоги до громадянства
    category: process
    csf_function: protect
    description: 'Переконатися, що особи, які звертаються до системи обробки, зберігання або передачі [Призначення: визначених
      організацією типів інформації], задовольняють [Призначення: визначені організацією вимоги до громадянства].
  
  
  
      Параметри:
  
  
      1. Призначення: визначених організацією типів інформації
  
  
      2. Призначення: визначені організацією вимоги до громадянства'
    annotation: null
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ps-4
    ref_id: PS-4
    name: Звільнення персоналу
    category: process
    csf_function: protect
    description: 'При припиненні особою індивідуального трудового договору в організації необхідно:
  
      a. відключити доступ до системи протягом [Призначення: визначеного організацією періоду часу];
  
      b. завершити або скасувати всі засоби автентифікації та облікові дані, пов’язані з цією особою;
  
      c. провести співбесіди при звільненні, які містять обговорення [Призначення: визначених організацією тем інформаційної
      безпеки];
  
      d. отримати все майно, пов’язане із заходами безпеки під час користування системою організації;
  
      e. зберігати доступ до інформації та систем організації, які раніше контролювала звільнена особа.
  
  
  
      Параметри:
  
  
      1. Призначення: визначеного організацією періоду часу
  
  
      2. Призначення: визначених організацією тем інформаційної безпеки'
    annotation: 'До властивості системи належать: токени автентифікації, технічні посібники адміністрації системи, ключі, ідентифікаційні
      картки та інші дані. Вихідні співбесіди можуть гарантувати, що особи, які завершують трудову діяльність, розуміють обмеження
      безпеки, які накладені на колишніх працівників. Під час вихідних бесід можуть порушуватися такі теми: нагадування про
      угоди щодо нерозголошення; можливі обмеження щодо майбутньої роботи та інші. У певних ситуаціях має бути проведена деактивація
      облікових записів системи.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ps-4.1
    ref_id: PS-4(1)
    name: Звільнення персоналу — Вимоги після закінчення трудової діяльності
    category: process
    csf_function: protect
    description: '(a) Повідомити звільненх особ про чинні, юридично обов’язкові вимоги, що діють після закінчення трудової діяльності
      й що стосуються захисту інформації, яка стала їм відома під час виконання службових обов’язків.
  
      (b) Вимагати від звільнених осіб підписати підтвердження вимог після закінчення трудової діяльності в рамках процесу звільнення.'
    annotation: Організації можуть консультуватися з юридичними відділами щодо вимог після закінчення трудової діяльності.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ps-4.2
    ref_id: PS-4(2)
    name: Звільнення персоналу — Автоматизоване сповіщення
    category: process
    csf_function: protect
    description: 'Впровадити автоматизовані механізми для повідомлення [Призначення: визначеного організацією персоналу або
      ролей] після звільнення особи.
  
  
  
      Параметри:
  
  
      1. Призначення: визначеного організацією персоналу або ролей'
    annotation: В організаціях з великою кількістю співробітників не весь персонал, який повинен знати про дії звільнення, отримує
      відповідні сповіщення або отримує їх невчасно. Автоматизовані механізми можуть використовуватися для надсилання автоматичних
      сповіщень персоналу організації або конкретній ролі після припинення трудової діяльності. Такі автоматизовані сповіщення
      можуть передаватися різними способами, включно з, наприклад, телефоном, електронною поштою, текстовим повідомленням. Автоматизовані
      механізми також можна використовувати для швидкого й повного блокування доступу до ресурсів системи після звільнення працівника.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ps-5
    ref_id: PS-5
    name: Переведення персоналу
    category: process
    csf_function: protect
    description: 'a. Переглядати та підтверджувати поточну оперативну потребу в поточних дозволах логічного та фізичного доступу
      до систем і об’єктів, коли особи перепризначаються або переводяться на інші посади в організації.
  
      b. Ініціювати [Призначення: визначені організацією дії щодо переведення або перепризначення] в межах [Призначення: визначеного
      організацією часового періоду після формальної дії переказу].
  
      c. Змінювати повноваження доступу, якщо це необхідно, щоб відповідати будь-яким змінам операційної потреби через перепризначення
      або переведення.
  
      d. Повідомляти про переведення персоналу [Призначення: визначений організацією персонал або посадові особи] в рамках [Призначення:
      визначений організацією період часу].
  
  
  
      Параметри:
  
  
      1. Призначення: визначені організацією дії щодо переведення або перепризначення
  
  
      2. Призначення: визначеного організацією часового періоду після формальної дії переказу
  
  
      3. Призначення: визначений організацією персонал або посадові особи
  
  
      4. Призначення: визначений організацією період часу'
    annotation: Цей захід захисту застосовується у випадках, коли в організації перепризначення чи передача повноважень відбувається
      постійно. Дії, які можуть знадобитися для переведення персоналу в межах організації, охоплюють, наприклад, повернення
      старих та видачу нових ключів, ідентифікаційних карток і пропусків, закриття старих облікових записів системи та створення
      нових, зміну авторизацій доступу до системи (тобто привілеїв).
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ps-6
    ref_id: PS-6
    name: Угоди про доступ
    category: process
    csf_function: protect
    description: 'a. Розробити та оформити угоди про доступ до інформаційних систем організації.
  
      b. Переглядати та оновлювати угоди про доступ [Призначення: з визначеною організацією частотою].
  
      c. Переконатися, що особи, які потребують доступу до організаційної інформації та систем:
  
      1. підписали відповідні угоди про доступ перед тим, як отримати доступ;
  
      2. повторно підписали угоди про доступ для підтримки доступу до інформаційних систем організації, коли угоди про доступ
      були оновлені або [Призначення: з визначеною організацією частотою].
  
  
  
      Параметри:
  
  
      1. Призначення: з визначеною організацією частотою'
    annotation: До угод про доступ належать угоди про нерозголошення, правила поведінки та угоди про конфлікт інтересів. Підписані
      угоди про доступ містять підтвердження того, що люди прочитали, зрозуміли та погоджуються дотримуватися обмежень, пов’язаних
      з організаційними системами, до яких їм дозволений доступ. Організації можуть використовувати електронні підписи для підтвердження
      угод про доступ, якщо це не заборонено організаційною політикою.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ps-6.1
    ref_id: PS-6(1)
    name: Угоди про доступ — Інформація, що вимагає спеціального захисту
    category: process
    csf_function: protect
    description: 'Вилучено: включено до PS-3.'
    annotation: null
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ps-6.2
    ref_id: PS-6(2)
    name: Угоди про доступ — Інформація з обмеженим доступом, що вимагає спеціального захисту
    category: process
    csf_function: protect
    description: 'Переконатися, що доступ до інформації з обмеженим доступом, який вимагає спеціального захисту, надається лише
      особам, які:
  
      (a) мають чинний дозвіл на доступ, що відповідає вимогам чинного законодавства;
  
      (b) задовільняють відповідним критеріям безпеки щодо персоналу;
  
      (c) прочитали, зрозуміли й підписали угоду про нерозголошення.'
    annotation: Секретна інформація, яка потребує особливого захисту, включає додаткову інформацію, інформацію Програми спеціального
      доступу (SAP) і конфіденційну інформацію з розділами (SCI). До інформації з обмеженим доступом, яка потребує спеціального
      захисту, належать персональні дані, критична інформація, таємна інформація. Критерії безпеки персоналу відображають чинні
      закони, накази, директиви, положення, політику, стандарти та настанови.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ps-6.3
    ref_id: PS-6(3)
    name: Угоди про доступ — Вимоги після закінчення трудової діяльності
    category: process
    csf_function: protect
    description: '(a) Повідомити особам про чинні, юридично обов’язкові вимоги після закінчення трудової діяльності щодо захисту
      організаційної інформації.
  
      (b) Вимагати від осіб підписання підтвердження вимог, якщо це необхідно, як частину надання першого доступу до інформації.'
    annotation: Організації можуть консультуватися з юридичним відділом щодо питань, пов’язаних з вимогами після закінчення
      трудових відносин.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ps-7
    ref_id: PS-7
    name: Безпека зовнішнього персоналу
    category: process
    csf_function: protect
    description: 'a. Встановити вимоги щодо безпеки персоналу, включно з ролями й обов’язками щодо безпеки для зовнішніх постачальників
      послуг.
  
      b. Вимагати від зовнішніх постачальників дотримання правил і процедур кадрової безпеки, встановлених організацією.
  
      c. Вимагати безпечного ставлення персоналу до документів.
  
      d. Вимагати від зовнішніх постачальників повідомляти [Призначення: визначені організацією персонал або ролі] щодо будь-яких
      переведень або звільнення зовнішнього персоналу, який володіє організаційними повноваженнями або має системні привілеї
      в межах [Призначення: визначеного організацією строку].
  
      e. Контролювати відповідності постачальника визначеним вимогам щодо безпеки інформації.
  
  
  
      Параметри:
  
  
      1. Призначення: визначені організацією персонал або ролі
  
  
      2. Призначення: визначеного організацією строку'
    annotation: 'До зовнішніх постачальників належать: провайдери послуг; підрядники й інші організації, що надають послуги
      з розробки системи, послуги з впровадження інформаційних технологій; аутсорсингові послуги; послуги тестування/оцінювання
      та управління мережею і безпекою. Організації прямо вносять вимоги безпеки персоналу в документи, що пов’язані з придбанням.
      Зовнішні провайдери можуть мати персонал, який працює в установах організації з обліковими даними або системними привілеями,
      наданими організаціями. Повідомлення про зміни зовнішнього персоналу мають забезпечувати належне припинення привілеїв
      та повноважень. Організації визначають передачу та припинення привілеїв, про які можна звітувати, за характеристиками,
      пов’язаними з безпекою, які включають функції, ролі та характер облікових даних або привілеїв, пов’язаних з особами, яким
      їх було передано або припинено.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ps-8
    ref_id: PS-8
    name: Кадрові санкції
    category: process
    csf_function: protect
    description: 'a. Використовувати формальний процес санкцій для осіб, які не дотримуються встановлених правил і процедур
      інформаційної безпеки.
  
      b. Повідомляти [Призначення: визначений організацією персонал або ролі] в межах [Призначення: визначеного організацією
      періоду часу], коли починається офіційний процес накладання санкцій працівникам, визначаючи особу та причину санкції.
  
  
  
      Параметри:
  
  
      1. Призначення: визначений організацією персонал або ролі
  
  
      2. Призначення: визначеного організацією періоду часу'
    annotation: Кадрові санкції мають відповідати чинному законодавству, наказам, директивам, положенням, політикам, стандартам
      і рекомендаціям. Кадрові санкції мають бути описані в угодах про доступ і можуть бути внесені як частина загальної кадрової
      політики та процедур організацій. Організації можуть консультуватися з юридичним відділом щодо питань кадрових санкцій.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ps-9
    ref_id: PS-9
    name: Опис позицій
    category: process
    csf_function: protect
    description: Включіть ролі й обов’язки з безпеки та приватності в опис посади в організації.
    annotation: Специфікація ролей у сфері безпеки та приватності в описі посад окремих організацій сприяє ясності розуміння
      таких обов’язків, а також вимог щодо рольової підготовки з безпеки та приватності.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ra-1
    ref_id: RA-1
    name: Політика та процедури оцінювання ризику
    category: policy
    csf_function: govern
    description: 'a. Розробити, задокументувати та поширити серед [Призначення: визначеного організацією персоналу або посадових
      осіб]:
  
      1. Політику оцінювання ризику, яка:
  
      (a) містить мету, сферу застосування, ролі, обов’язки, відповідальність керівництва, координацію між організаційними підрозділами
      та систему контролю відповідності (complaince);
  
      (b) відповідає чинному законодавству, виконавчим наказам, директивам, нормам, політикам, стандартам і керівним принципам.
  
      2. Процедури, що сприяють здійсненню політики оцінювання ризику та пов’язаних з ними заходів оцінювання ризику.
  
  
      b. Призначити [Призначення: визначена організацією посадову особу] для управління політикою та процедурами оцінювання
      ризику.
  
  
      c. Переглядати й оновлювати:
  
      1. Поточну політику оцінювання ризику [Призначення: з визначеною організацією частотою].
  
      2. Поточні процедури оцінювання ризику [Призначення: з визначеною організацією частотою].
  
  
  
      Параметри:
  
  
      1. Призначення: визначеного організацією персоналу або посадових осіб
  
  
      2. Призначення: визначена організацією посадову особу
  
  
      3. Призначення: з визначеною організацією частотою'
    annotation: Цей захід захисту стосується встановлення політики та процедур для ефективного здійснення заходів і їх посилень
      у класі RA, які впроваджуються в системах та організаціях. Стратегія управління ризиками є важливим фактором у встановленні
      політики та процедур. Комплексна політика та процедури допомагають забезпечити безпеку та приватність. Тому, важливо доясягти
      взаємодії роботи програм безпеки та приватності при розробці політик та процедур оцінки ризиків. За наявності політики,
      а також планів захисту інформації та персональних даних на рівні організації, конкретні системні політики та процедури
      можуть бути не потрібні. Політика може бути внесена до складу загальної політики безпеки та приватності або може бути
      представлена кількома політиками (у випадках складної архітектури). Процедури оцінки ризиків можуть бути передбачені для
      програм забезпечення безпеки та приватності для процесів місії/бізнесу, а також, за потреби, всієї системи. Процедури
      описують, як має реалізуватися політика чи заходи захисту та як вони можуть бути спрямовані на персонал або роль, яка
      є об’єктом процедури. Процедури можуть бути задокументовані в планах захисту інформації та персональних даних (як один
      або декілька документів). Події, які можуть призвести до необхідності оновлення політики та процедур оцінки ризиків, включають
      результати оцінки та аудиту, випадки порушення безпеки або внесення змін до законів, наказів, директив, положеннях, політиках,
      стандартах та рекомендаціях.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ra-2
    ref_id: RA-2
    name: Категоріювання безпеки
    category: process
    csf_function: identify
    description: 'a. Здійснити категоріювання інформаційної системи й інформації, яку вона обробляє, зберігає та передає.
  
      b. Задокументувати результати категоріювання безпеки, включно з обґрунтуванням, у плані захисту інформаційної системи.
  
      c. Підтвердити, що посадова особа або уповноважений офіційний представник переглядає та затверджує рішення про категоріювання
      безпеки.'
    annotation: Категорії безпеки описують можливі несприятливі наслідки для операцій організації, активів організації і осіб,
      якщо інформація та системи будуть скомпрометовані через втрату конфіденційності, цілісності чи доступності. Категоризація
      безпеки є одним з типів характеризації втрат активів в процесах інженерії систем безпеки, який проводиться на протязі
      життєвого циклу розробки системи. Організації можуть використовувати процедури оцінки ризиків конфіденційності або оцінки
      впливу на приватність для кращого розуміння можливих негативних наслідків для фізичних осіб. [CNSSI 1253] надає додаткові
      рекомендації з категоризації для систем національної безпеки. Організації проводять процес категоризації безпеки як загальноорганізаційну
      діяльність із залученням керівників інформаційних служб, старших посадових осіб з інформаційної безпеки відомства, старших
      посадових осіб відомства з питань конфіденційності, власників систем, місій і підприємств, а також власників або розпорядників
      інформації. При цьому, враховуються потенційні негативні наслідки для інших організацій, а також, відповідно до указів
      Президента з питань національної безпеки та [USA PATRIOT], для держави в цілому. Процеси категоризації безпеки сприяють
      розробці інвентаризації інформаційних активів і, разом з CM-8, визначення відповідності компонентів системи категоріям
      безпеки в залежності від того, де обробляється, зберігаєтсья або передається інформація. Процес категоризації безпеки
      переглядається на протязі життєвого циклу розробки системи з метою забезпечення точності та актуальності категорій безпеки.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ra-2.1
    ref_id: RA-2(1)
    name: Категоріювання безпеки — Категоріювання другого рівня
    category: process
    csf_function: identify
    description: Провести категоріювання другого рівня для інформаційних систем організації з метою отримання додаткової деталізації
      рівнів критичності інформаційної системи.
    annotation: 'У результаті такої класифікації системи можуть отримати позначки «низький», «середній» або «високий» рівень
      критичності. Організації, які бажають додаткової деталізації в системах позначень критичності, можуть надалі розподілити
      системи на підкатегорії. Наприклад, категоріювання другого рівня в системі з помірним рівнем може створити три нові підкатегорії:
      низько-середній, помірно-середній і високо-середній. Це вторинне категоріювання та отримані підкатегорії безпеки системи
      дають організаціям можливість вибрати пріоритет фінансування, пов’язаний з вибором заходів захисту й адаптацією цільових
      профілів безпеки. Категоріювання другого рівня може також використовуватися для визначення тих систем, які є винятково
      важливими для завдань і процесів організації. Оцінка рівня впливу може також використовуватися для визначення тих систем,
      які можуть бути особливо цікавими або цінними для зловмисників, а також представляти критичну втрату для державної установи,
      іноді називаються об''єктами критичної важливості. У випадку таких об''єктів критичної важливості організації можуть більше
      зосередитися на складності, агрегації та обміні інформацією. У разі об''єктів критичної важливості організації зазвичай
      виявляють більш складну структуру та взаємозв''язок між її складовими. Це може відображатися на архітектурі та топології
      мережі, що потребує більш ретельного аналізу, планування та керування. Крім того, у таких системах може бути велика кількість
      даних з різних джерел, що потребує їх агрегації та аналізу для забезпечення цілісної картини безпеки. Інформаційний обмін
      між різними складовими системи також може створювати додаткові завдання для забезпечення безпеки. Організації можуть використовувати
      різноманітні техніки та підходи для керування цими вразливостями, такі як збір та обробка даних для розуміння потенційних
      загроз, розробка політик та процедур для ефективного обміну інформацією та регулярний аудит для забезпечення відповідності
      заходам безпеки. Системи об’єктів критичної важливості можуть бути відокремлені від інших систем шляхом розділення систем
      з високим впливом на системи з низько-високим, помірно-високим та надзвичайно-високим рівнями впливу. Організації можуть
      також використовувати рекомендації, викладені в [CNSSI 1253] для категоризації безпеки.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ra-3
    ref_id: RA-3
    name: Оцінювання ризику
    category: process
    csf_function: identify
    description: 'a. Проводити оцінювання ризику, включно з вірогідністю й величиною шкоди від:
  
      1. несанкціонованого доступу, використання, розголошення, руйнування, модифікації або знищення інформаційної системи,
      інформації, яку вона обробляє, зберігає та передає; а також будь-якої пов’язаної інформації;
  
      2. проблем, пов’язаних з приватністю фізичних осіб, що виникають у результаті обробки персональних даних.
  
      b. Інтегрувати результати оцінювання ризику та рішення з управління ризиками на рівні організації та завдань/процесів
      з оцінюванням ризиків на рівні інформаційної системи.
  
      c. Задокументувати результати оцінювання ризику до [Вибір: планів безпеки та приватності; звіту про оцінювання ризику;
      [Призначення: визначеного організацією документа]].
  
      d. Переглядати результати оцінювання ризиків [Призначення: з визначеною організацією частотою].
  
      e. Поширити результати оцінювання ризику серед [Призначення: визначеного організацією персоналу або посадових осіб].
  
      f. Оновлювати оцінювання ризику [Призначення: з визначеною організацією частотою] або коли є суттєві зміни в інформаційній
      системі, її робочому середовищі чи інших умовах, які можуть вплинути на стан безпеки або приватність інформаційної системи.
  
  
  
      Параметри:
  
  
      1. Вибір: планів безпеки та приватності; звіту про оцінювання ризику; [Призначення: визначеного організацією документа]
  
  
      2. Призначення: з визначеною організацією частотою
  
  
      3. Призначення: визначеного організацією персоналу або посадових осіб'
    annotation: 'Оцінка ризиків враховує загрози, вразливості, ймовірність та вплив на діяльність та активи організації, окремих
      осіб, інші організації та державу. Оцінювання ризиків має враховувати загрози, вразливості, імовірність і вплив на організаційні
      операції та активи, осіб, інші організації на основі функціювання та використання систем. Оцінювання ризиків також враховує
      ризик зовнішніх сторін, включно з: особами, які мають доступ до систем організації; підрядниками, що працюють у системі
      від імені організації; постачальниками послуг; суб’єктами аутсорсингу. Організації можуть проводити оцінювання ризиків
      на всіх трьох рівнях ієрархії управління ризиками (тобто рівень організації, рівень процесів, рівень системи) і на будь-якій
      фазі життєвого циклу розробки системи та на будь-якому етапі життєвого циклу розробки системи. Оцінювання ризиків також
      може проводитися на різних етапах системи управління ризиками, включаючи підготовку, категоризацію, вибір засобів захисту,
      впровадження заходів захисту, оцінку заходів захисту, дозвіл на їх застосування та моніторинг. Оцінка ризиків є неперервним
      процесом, що проводиться на протязі усього життєвого циклу розробки системи. Оцінки ризиків можуть включати інформацію
      про систему, включаючи проект системи, призначення використання, результати тестування та артефакти, що пов''язані з ланцюгом
      постачання. У цьому випадку, артефакти можуть включати документацію, код програмного забезпечення, аудити безпеки та інші
      матеріали, що можуть служити джерелом інформації для процесу оцінки ризиків. Оцінки ризиків можуть відігравати важливу
      роль у процесах вибору заходів захисту, зокрема під час застосування рекомендацій щодо налаштування та в ранніх стадіях
      визначення можливостей.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ra-3.1
