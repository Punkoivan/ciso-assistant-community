      планування відновлення після стихійних лих, планування безперервності операцій, планування відновлення критичної
      інфраструктури, планування реагування на кіберінциденти тощо.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:cp-2.2
    ref_id: CP-2(2)
    name: План забезпечення безперервної роботи та відновлення функціонування — Планування ресурсів
    category: process
    csf_function: recover
    description: Здійснити планування ресурсів з метою забезпечення необхідного потенціалу для обробки інформації,
