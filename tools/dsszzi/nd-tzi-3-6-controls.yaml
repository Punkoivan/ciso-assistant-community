    annotation: 'Захищені домени обробки — це простори обробки, які контролюють взаємодію з іншими просторами обробки
      для забезпечення управління інформаційними потоками між ними, а також від/до об’єктів даних.

      Захищена обробка домену може бути забезпечена, наприклад, шляхом


      впровадження домену та типового примусового виконання. Системні процеси присвоюються доменам, інформація ідентифікується
      за типами, а інформаційні потоки контролюються на основі дозволеного доступу до інформації (визначається доменом
      і типом інформації).'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ac-4.3
