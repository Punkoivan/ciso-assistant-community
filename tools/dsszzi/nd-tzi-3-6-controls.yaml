    csf_function: protect
    description: '[Вилучено: включено до CM-7].'
    annotation: null
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ac-17.9
    ref_id: AC-17(9)
    name: Віддалений доступ — Відключення або деактивація доступу
    category: technical
    csf_function: protect
    description: 'Забезпечити можливість швидкого відключення або деактивації віддаленого доступу до системи в межах
      [Призначення: визначеного організацією періоду часу].


      Параметри:

      1. Призначення: визначеного організацією періоду часу'
    annotation: Це посилення заходу вимагає наявності можливості швидко від’єднувати поточних користувачів, віддалено
      отримуючи доступ до системи, або деактивувати подальший віддалений доступ. Швидкість відключення або деактивації
      може змінюватися залежно від критичності місій або функцій і необхідності усунення негайного чи майбутнього
      віддаленого доступу до систем.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ac-17.10
    ref_id: AC-17(10)
    name: Автентифікація віддалених команд
    category: technical
    csf_function: protect
    description: 'Запровадити [Призначення: механізми, визначені організацією] для автентифікації [Призначення:
      віддалені команди, визначені організацією]


      Параметри:

      1. Призначення: механізми, визначені організацією

      2. Призначення: віддалені команди, визначені організацією'
    annotation: 'Автентифікація віддалених команд захищає від несанкціонованих команд і повторного відтворення авторизованих
      команд.

      Здатність автентифікувати віддалені команди важлива для віддалених систем, для яких втрата, несправність,
      неправильне спрямування або використання можуть мати негайні або серйозні наслідки, такі як травми, смерть,
      пошкодження майна, втрата цінних активів, збій місії або бізнес-функцій, або компрометація секретної чи контрольованої
      несекретної інформації. Механізми автентифікації для віддалених команд гарантують, що системи приймають і
      виконують команди в передбаченому порядку, виконують лише авторизовані команди та відхиляють несанкціоновані
      команди. Як приклад, можна використовувати для автентифікації віддалених команд криптографічні механізми.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ac-18
    ref_id: AC-18
    name: Бездротовий доступ
    category: technical
    csf_function: protect
    description: 'a. Установити обмеження на використання, вимоги до конфігурації/підключення та рекомендації щодо
      здійснення бездротового доступу.


      b. Авторизувати бездротовий доступ до системи, перш ніж будуть дозволені такі підключення.'
    annotation: 'До бездротових технологій належать: використання мікрохвиль, пакетний радіозв’язок, положення стандартів
      802.11x та Bluetooth.

      Бездротові мережі використовують протоколи автентифікації, які забезпечують захист облікових даних і взаємну
      автентифікацію.


      Повязані заходи: AC-2, AC-3, AC-17, AC-19, CA-9, CM-7, ІА-2, ІА-3, ІА-8, PL-4,

      SC-40, SC-43, SI-4.


      Посилення заходів:


      (1) БЕЗДРОТОВИЙ ДОСТУП - АВТЕНТИФІКАЦІЯ ТА ШИФРУВАННЯ


      Забезпечити захист бездротового доступу до системи за допомогою автентифікації [Вибір (один або кілька): користувачів;
      пристроїв] та шифрування.


      Рекомендації з реалізації: Бездротові мережі є значною потенційною вразливістю, якою можуть скористатися зловмисники.
      Щоб захистити системи з бездротовими точками доступу, надійна автентифікація користувачів і пристроїв разом
      із надійним шифруванням може зменшити сприйнятливість до загроз з боку зловмисників.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ac-18.1
