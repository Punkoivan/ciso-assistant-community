      2. Вибір (один або кілька): локального, дистанційного, мережного'
    annotation: 'Пристрої, що потребують унікальної взаємної ідентифікації, визначаються за типом або власне пристроєм
      (чи комбінацією обох параметрів). До визначених організацією типів пристроїв можуть належати пристрої, які
      не є власністю організації. Для ідентифікації та автентифікації пристроїв у локальних мережах можуть використовуватися:
      МАС-адреси, адреси в протоколі TCP/IP, дані автентифікації зі стандарту IEEE 802.1x, TLS, RADIUS серверу тощо.
      Організації мають визначати необхідність таких механізмів автентифікації на основі категорій безпеки систем.
      Через проблеми здійснення цього заходу безпеки в широкому масштабі організації можуть обмежувати його застосування
      визначеною кількістю (і типом) пристроїв на основі потреб організації.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ia-3.1
    ref_id: IA-3(1)
    name: Ідентифікація та автентифікація пристроїв — Криптографічна двобічна автентифікація
    category: technical
    csf_function: protect
    description: 'Автентифікувати [Призначення: певні пристрої, визначені організацією та/або типи пристроїв] перед
      встановленням [Вибір (один або кілька): локального; віддаленого; мережевого] підключення за допомогою двобічної
      автентифікації, яка заснована на криптографічних механізмах.


      Параметри:

      1. Призначення: певні пристрої, визначені організацією та/або типи пристроїв

      2. Вибір (один або кілька): локального; віддаленого; мережевого'
    annotation: Локальне з’єднання — це будь-яке з’єднання з пристроєм, що відбувається без використання мережі.
      Мережеве з’єднання — це будь-яке з’єднання з пристроєм, що відбувається через мережу. Віддалене з’єднання
      — це будь-яке з’єднання з пристроєм, що відбувається через зовнішню мережу. Двонаправлена автентифікація забезпечує
      надійніший захист для перевірки ідентичності інших пристроїв для підключень, які становлять більший ризик.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ia-3.2
    ref_id: IA-3(2)
    name: Ідентифікація та автентифікація пристроїв — Криптографічна двобічна мережа автентифікації
    category: technical
    csf_function: protect
    description: 'Виключено: включено до IA-3(1).'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ia-3.3
    ref_id: IA-3(3)
    name: Ідентифікація та автентифікація пристроїв — Динамічний розподіл адреси
    category: technical
    csf_function: protect
    description: '(a) У разі динамічного розподілу адреси визначити вимоги щодо оренди динамічного розміщення адреси
      та тривалості такої оренди, призначених для пристроїв відповідно до [Призначення: інформації про оренду, визначеної
      організацією, та тривалість такої оренди]; (b) Провести аудит інформації щодо оренди при призначенні на пристрій.


      Параметри:

      1. Призначення: інформації про оренду, визначеної організацією, та тривалість такої оренди'
    annotation: Протокол динамічної конфігурації хоста (DHCP) є прикладом засобу, за допомогою якого клієнти можуть
      динамічно отримувати призначення мережевих адрес.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ia-3.4
    ref_id: IA-3(4)
    name: Ідентифікація та автентифікація пристроїв — Атестація пристрою
    category: technical
    csf_function: protect
    description: 'Здійснювати ідентифікацію та автентифікацію пристроїв на основі атестації за допомогою [Призначення:
      визначеного організацією процесу управління конфігурацією].


      Параметри:

      1. Призначення: визначеного організацією процесу управління конфігурацією'
    annotation: Атестація пристрою стосується ідентифікації та автентифікації пристрою на основі його конфігурації
      та відомого робочого стану. Атестацію пристрою можна визначити за допомогою криптографічного гешу пристрою.
      Якщо атестація пристрою є засобом ідентифікації та автентифікації, то важливо, щоб виправлення та оновлення
      пристрою оброблялися через процес керування конфігурацією безпечно та не порушувало ідентифікацію та автентифікацію
      на інших пристроях.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ia-4
    ref_id: IA-4
    name: Управління ідентифікацією
    category: process
    csf_function: protect
    description: 'Управляти системними ідентифікаторами шляхом:

      a. отримання дозволу від [Призначення: визначеного організацією персоналу або ролей] для призначення ідентифікатора
      особі, групі, ролі або пристрою;

      b. вибору ідентифікатора, який ідентифікує окрему особу, групу, роль або пристрій;

      c. призначення ідентифікатора особі, групі, ролі або пристрою;

      d. запобігання повторному використанню ідентифікаторів впродовж [Призначення: визначеного організацією періоду
      часу].


      Параметри:

      1. Призначення: визначеного організацією персоналу або ролей

      2. Призначення: визначеного організацією періоду часу'
    annotation: Загальні ідентифікатори пристроїв охоплюють, наприклад, МАС-адреси, ІР-адреси або унікальні ідентифікатори
      токенів. Управління індивідуальними ідентифікаторами не застосовується до спільних облікових записів системи.
      Зазвичай індивідуальні ідентифікатори — це імена користувачів облікових записів системи, призначених цим особам.
      У таких випадках в управлінні обліковими записами AC-2 використовуються імена облікових записів, надані IA-4.
      Цей захід безпеки також стосується окремих ідентифікаторів, не пов’язаних із системними обліковими записами.
      Запобігання повторному використанню ідентифікаторів передбачає запобігання присвоєнню раніше використовуваних
      ідентифікаторів особи, групи, ролі чи пристрою іншим особам, групам, ролям або пристроям.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ia-4.1
    ref_id: IA-4(1)
    name: Управління ідентифікацією — Заборона використання ідентифікаторів облікових записів таких самих, як і
      публічні ідентифікатори
    category: process
    csf_function: protect
    description: Заборонити використання ідентифікаторів облікових записів системи, які збігаються із загальнодоступними
      ідентифікаторами для індивідуальних облікових записів.
    annotation: Заборона використання ідентифікаторів облікових записів системи, які є такими самими, як і загальнодоступні
      ідентифікатори (наприклад, ідентифікатори адреси електронної пошти) дозволяє знизити ризик того, що порушник
      вгадає ідентифікатор користувача в системах. Використання цього заходу безпеки лише знижує ризик вгадування
      ідентифікатора; це посилення заходу необхідно використовувати разом із (а не замість) відповідними засобами
      захисту автентифікаторів та атрибутів для захисту облікового запису в цілому.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ia-4.2
    ref_id: IA-4(2)
    name: Управління ідентифікацією — Авторизація супервайзера
    category: process
    csf_function: protect
    description: 'Виключено: Включено до IA-12(1).'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ia-4.3
    ref_id: IA-4(3)
    name: Управління ідентифікацією — Множинні форми сертифікації
    category: process
    csf_function: protect
    description: 'Виключено: Включено до IA-12(2).'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ia-4.4
    ref_id: IA-4(4)
    name: Управління ідентифікацією - ідентифікація статусу користувача
    category: process
    csf_function: protect
    description: 'Управляти індивідуальними ідентифікаторами, однозначно ідентифікуючи кожного індивідуума як [Призначення:
      визначена організацією ознака, що ідентифікує індивідуальний статус].


      Параметри:

      1. Призначення: визначена організацією ознака, що ідентифікує індивідуальний статус'
    annotation: До характеристик статусу осіб належать, наприклад, статус підрядника, наявність іноземного громадянства.
      Ідентифікація статусу осіб за специфічними ознаками надає додаткову інформацію про осіб, з якими спілкується
      персонал організації. Наприклад, державному службовцю може бути корисно знати, що одна з осіб у електронному
      повідомленні є підрядником.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ia-4.5
    ref_id: IA-4(5)
    name: Управління ідентифікацією — Динамічне управління
    category: process
    csf_function: protect
    description: 'Динамічно управляти індивідуальними ідентифікаторами відповідно до [Призначення: політика динамічних
      ідентифікаторів, визначена організацією].


      Параметри:

      1. Призначення: політика динамічних ідентифікаторів, визначена організацією'
    annotation: На відміну від традиційних підходів до ідентифікації, які передбачають статичні облікові записи
      для попередньо зареєстрованих користувачів, розподілені системи можуть надавати ідентифікатори суб’єктам,
      які раніше не були відомі безпосередньо під час взаємодії. У цих ситуаціях організації передбачають і забезпечують
      динамічну видачу ідентифікаторів. При цьому важливе значення мають заздалегідь налагоджені довірчі відносини
      та механізми з відповідними органами для підтвердження ідентичності та пов’язаних даних.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ia-4.6
    ref_id: IA-4(6)
    name: Управління ідентифікацією — Крос-організаційне управління
    category: process
    csf_function: protect
    description: 'Здійснювати координацію з [Призначення: визначеними організацією  зовнішніми організаціями] для
      міжорганізаційного управління ідентифікаторами.


      Параметри:

      1. Призначення: визначеними організацією зовнішніми організаціями'
    annotation: Управління міжорганізаційними ідентифікаторами забезпечує можливість належним чином ідентифікувати
      осіб, групи, ролі або пристрої під час проведення міжорганізаційних заходів, пов’язаних з обробкою, зберіганням
      або передачею інформації.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ia-4.7
    ref_id: IA-4(7)
    name: Управління ідентифікацією — Особиста реєстрація
    category: process
    csf_function: protect
    description: 'Виключено: Включено до IA-12(4).'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ia-4.8
    ref_id: IA-4(8)
    name: Управління ідентифікацією - попарні псевдонімні ідентифікатори
    category: process
    csf_function: protect
    description: Створити попарні псевдонімні ідентифікатори.
    annotation: Парний псевдонімний ідентифікатор — це непрозорий ідентифікатор абонента, який неможливо вгадати,
      створений постачальником ідентифікаційної інформації для використання окремою повірюючою стороною. Генерування
      парних псевдонімних ідентифікаторів без ідентифікаційної інформації про користувача перешкоджає відстеженню
      активності користувачів. Попарні псевдонімні ідентифікатори мають бути унікальними для кожної сторони, за
      винятком ситуацій, коли сторони мають тісні довірчі відносини, які підтверждуються операційною потребою у
      взаємодії, або всі сторони дають згоду на взаємодію таким чином.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ia-4.9
    ref_id: IA-4(9)
    name: Управління ідентифікацією — Обслуговування атрибутів і захист
    category: process
    csf_function: protect
    description: 'Зберігайте атрибути для кожної унікально ідентифікованої особи, пристрою чи служби в [Призначення:
      визначене організацією захищене центральне сховище].


      Параметри:

      1. Призначення: визначене організацією захищене центральне сховище'
    annotation: Для кожного з об’єктів, розглянутих у IA-2, IA-3, IA-8 та IA-9, важливо підтримувати атрибути автентифікації
      на постійній основі в центральному (захищеному) сховищі.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ia-5
    ref_id: IA-5
    name: Управління автентифікатором
    category: technical
    csf_function: protect
    description: 'Управляти системними автентифікаторами шляхом:

      a. перевірки, як частини початкового розподілу автентифікатора, особи, групи, ролі або пристрою, який отримує
      автентифікатор;

      b. створення вихідного вмісту автентифікатора для будь-яких автентифікаторів, виданих організацією;

      c. забезпечення того, щоб автентифікатори мали достатню стійкість механізму для їх використання за призначенням;

      d. створення та реалізація адміністративних процедур для первинного розповсюдження автентифікаторів, для втрачених/скомпрометованих
      або пошкоджених автентифікаторів, а також для відкликання автентифікаторів;

      e. зміни типових автентифікаторів перед першим використанням;

      f. зміни/оновлення автентифікаторів у встановлений [Призначення: визначений організацією період часу за типом
      автентифікатора] або коли відбуваються [Призначення: події, визначені організацією];

      g. захисту вмісту автентифікатора від несанкціонованого розкриття та модифікацій;

      h. вимоги до осіб, які використовують пристрої, використовувати спеціальні заходи безпеки для захисту автентифікаторів;
      i. вимоги змінювати автентифікатори для облікових записів груп/ролей при зміні членства в цих облікових записах.


      Параметри:

      1. Призначення: визначений організацією період часу за типом автентифікатора

      2. Призначення: події, визначені організацією'
    annotation: До індивідуальних автентифікаторів належать паролі, криптографічні пристрої, біометричні дані, сертифікати,
      пристрої з одноразовим паролем та ідентифікаційні значки. Початковий вміст автентифікатора — це фактичний
      вміст автентифікатора, наприклад, початковий пароль. Вихідний вміст автентифікатора — це фактичний вміст автентифікатора,
      наприклад, початковий пароль. Вимоги щодо вмісту автентифікатора охоплюють, наприклад, мінімальну довжину
      пароля. Розробниками можуть надаватися компоненти системи із заводськими обліковими записами автентичності
      за замовчуванням для забезпечення початкової установки та конфігурації. Автентифікаційні дані за замовчуванням
      часто добре відомі, легко вгадуються та становлять значний ризик безпеки. Вимога щодо захисту індивідуальних
      автентифікаторів може бути реалізована через заходи безпеки PL-4 або PS-6 для автентифікаторів, що перебувають
      у власності фізичних осіб, та заходи безпеки AC-3, AC-6 та SC-28 для автентифікаторів, що зберігаються в системах
      організації, включно з паролями, які зберігаються в гешованих чи зашифрованих форматах або файлах, що містять
      зашифровані чи гешовані паролі. Системи підтримують управління автентифікатором за допомогою встановлених
      організацією налаштувань та обмежень для різних характеристик автентифікатора, включно з, наприклад, мінімальною
      довжиною пароля, проміжком часу перевірки синхронних одноразових маркерів та кількістю дозволених відхилень
      на етапі перевірки біометричної автентифікації. Дії, які можуть бути вжиті для захисту індивідуальних автентифікаторів,
      охоплюють, наприклад, надійне зберігання автентифікатора, заборону розголошення або передачі автентифікатора,
      а також вимогу негайного повідомлення про загублені, викрадені чи скомпрометовані автентифікатори. Управління
      автентифікатором охоплює видачу та відкликання автентифікаторів тимчасового доступу (наприклад, необхідного
      для віддаленого обслуговування). До автентифікаторів пристроїв належать сертифікати та паролі.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ia-5.1
    ref_id: IA-5(1)
    name: Управління автентифікатором — Автентифікація на основі пароля
    category: technical
    csf_function: protect
    description: 'Для автентифікації на основі пароля необхідно:

      (a) вести список часто використовуваних, очікуваних або скомпрометованих паролів та оновлювати його [Призначення:
      з визначеною організацією частотою], а також при підозрі, що паролі організацій скомпрометовані прямо чи опосередковано;

      (b) перевіряти, коли користувачі створюють або оновлюють паролі, що паролі не перебувають у визначеному організацією
      списку найчастіше використовуваних, очікуваних або скомпрометованих паролів у IA-5(1)(a);

      (c) передавати паролі лише через криптографічно захищені канали;

      (d) зберігати паролі за допомогою затвердженого алгоритму гешування, переважно використовуючи ключову геш-функцію;

      (e) вимагати негайного вибору нового пароля після відновлення облікового запису;

      (f) дозволити користувачеві вибирати довгі паролі та фрази, включно з пробілами та всіма друкованими символами;

      (g) використовувати автоматизовані інструменти для допомоги користувачеві у виборі надійних автентифікаторів
      паролів;

      (h) застосовувати наступні правила складу та складності: [Призначення: правила складу та складності, визначені
      організацією].


      Параметри:

      1. Призначення: з визначеною організацією частотою

      2. Призначення: правила складу та складності, визначені організацією'
    annotation: Це посилення заходу застосовується до паролів незалежно від їхнього використання в однофакторній
      або багатофакторній автентифікації. Надається перевага використанню довгих паролів. При цьому слід застосовувати
      закріплені правила генерації паролів (наприклад, мінімальна довжина символів для довгих паролів) за певних
      обставин можна забезпечити дотримання цієї вимоги в IA-5(1)(h). Якщо пароль втрачений (користувач його забув),
      має відбуватися відновлення облікового запису. Криптографічно захищені паролі містять односторонні криптографічні
      геші паролів. Список часто використовуваних, скомпрометованих або очікуваних паролів включає попередньо зламані
      паролі, слова зі словника та повторювані або послідовні символи. Список містить контекстно-залежні слова,
      такі як назва служби, ім’я користувача та похідні від них.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ia-5.2
    ref_id: IA-5(2)
    name: Управління автентифікатором — Автентифікація на основі відкритого ключа
    category: technical
    csf_function: protect
    description: '(a) Для автентифікації на основі відкритого ключа: 1) забезпечити авторизований доступ до відповідного
      закритого ключа; 2) зіставити автентифіковану особу з обліковим записом особи чи групи; (b) При використанні
      інфраструктури відкритого ключа (РКІ): 1) перевіряти сертифікати шляхом створення та перевірки шляху сертифікації
      до прийнятої довіреної прив’язки, включно з перевіркою інформації про статус сертифіката; 2) впровадити локальний
      кеш даних для підтримки виявлення та перевірки шляху.'
    annotation: Асиметрична криптографія може бути надійним механізмом автентифікації осіб і пристроїв. При використанні
      інфраструктури відкритих ключів (PKI) інформація про стан шляхів сертифікації містить списки відкликаних сертифікатів
      або відповіді протоколу статусу сертифіката. Для електронних посвідчень особистості (в тому числі PIV карток),
      у яких зберігається особистий ключ користувача, валідація сертифікатів передбачає побудову та перевірку шляху
      сертифікації до кореневого сертифіката. Впровадження локального списку відкликаних сертифікатів дозволяє здійснювати
      перевірку валідності в ситуаціях, коли системи тимчасово відключені від зовнішньої мережі.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ia-5.3
    ref_id: IA-5(3)
    name: Управління автентифікатором — Особиста або довірча автентифікація зовнішньої сторони
    category: technical
    csf_function: protect
    description: 'Виключено: Включено до IA-12(4).'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ia-5.4
    ref_id: IA-5(4)
    name: Управління автентифікатором — Автоматизована підтримка для визначення міцності пароля
    category: technical
    csf_function: protect
    description: 'Виключено: Включено до IA-5(1).'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ia-5.5
    ref_id: IA-5(5)
    name: Управління автентифікатором — Зміна автентифікаторів до доставки
    category: technical
    csf_function: protect
    description: Вимагати, щоб розробники та інсталятори компонентів системи надавали унікальні автентифікатори
      або змінювали за замовчуванням автентифікатори до доставки та встановлення.
    annotation: Це посилення заходу розширює вимогу щодо зміни автентифікаторів за замовчуванням після встановлення
      системи, вимагаючи від розробників видавати унікальні автентифікатори або змінити автентифікатори за замовчуванням
      для компонентів системи перед їхнім інсталюванням. Однак це, як правило, не стосується розробників комерційних
      позаштатних продуктів інформаційних технологій. Вимоги до унікальних автентифікаторів можуть бути надані в
      супровідній документації, що надається організаціям при закупівлі систем або компонентів системи.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ia-5.6
    ref_id: IA-5(6)
    name: Управління автентифікатором — Захист автентифікаторів
    category: technical
    csf_function: protect
    description: Захищати автентифікатори відповідно з категорією безпеки інформації, до якої надає доступ використання
      автентифікатора.
    annotation: Для систем, які обробляють інформацію різних категорій безпеки інформації без надійного фізичного
      чи логічного розділення між категоріями, автентифікатори, що використовуються для надання доступу до систем,
      мають захищатися відповідно до найвищої категорії безпеки в системах. Категорії безпеки інформації визначаються
      як частина процесу категоризації безпеки.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ia-5.7
    ref_id: IA-5(7)
    name: Управління автентифікатором — Відсутність вбудованих незашифрованих статичних автентифікаторів
    category: technical
    csf_function: protect
    description: Переконатися, що незашифровані статичні автентифікатори не вбудовані в застосунки або сценарії
      доступу та не збережені на функціональній клавіші.
    annotation: Окрім програм, інші форми статичного зберігання включають сценарії доступу та функціональні клавіші.
      Організації проявляють обережність, визначаючи, чи є вбудовані чи збережені автентифікатори в зашифрованій
      чи незашифрованій формі Якщо автентифікатори можуть використовуватися без явного введення (завдяки вбудованим
      функціям), то вони вважаються незашифрованими незалежно від того, чи захищена така функція сама по собі.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ia-5.8
    ref_id: IA-5(8)
    name: Управління автентифікатором - багатосистемні облікові записи
    category: technical
    csf_function: protect
    description: 'Реалізувати [Призначення: визначені організацією заходи безпеки] для управління ризиком компрометації
      через те, що користувачі мають облікові записи в декількох системах.


      Параметри:

      1. Призначення: визначені організацією заходи безпеки'
    annotation: 'Якщо особа має облікові записи в декількох системах, є ризик, що компрометація одного облікового
      запису може призвести до компрометації інших облікових записів (якщо використовуються одні й ті самі автентифікатори
      для всіх облікових записів). Для зниження такого ризику можливі заходи охоплюють: наявність різних автентифікаторів
      для різних систем; використання механізму єдиного входу; використання додатково одноразових паролів.Організації
      також можуть використовувати правила поведінки (див. PL-4) і угоди про доступ (див. PS-6), щоб зменшити ризик
      кількох облікових записів системи.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ia-5.9
    ref_id: IA-5(9)
    name: Управління автентифікатором — Управління об’єднанням автентифікаторів
    category: technical
    csf_function: protect
    description: 'Використовувати [Призначення: визначені організацією зовнішні організації] для об’єднання автентифікаторів.


      Параметри:

      1. Призначення: визначені організацією зовнішні організації'
    annotation: Під час проведення міжорганізованих заходів, пов’язаних з обробкою, зберіганням або передачею інформації,
      має бути забезпечена можливість належної взаємної автентифікації.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ia-5.10
    ref_id: IA-5(10)
    name: Управління автентифікатором — Динамічне зв’язування мандатів
    category: technical
    csf_function: protect
    description: 'Динамічно прив’язуйте ідентифікатори та автентифікатори за такими правилами: [Призначення: правила
      зв’язування, визначені організацією].


      Параметри:

      1. Призначення: правила зв’язування, визначені організацією'
    annotation: Перевірка автентичності вимагає певної форми прив’язки між цифровою ідентичністю та автентифікатором,
      що використовується для її підтвердження. У загальноприйнятих підходах це зв’язування відбувається шляхом
      попереднього надання ідентичності та автентифікатора системі. Наприклад, прив’язка між іменем користувача
      (тобто ідентичністю) та паролем (тобто автентифікатором) здійснюється шляхом надання системі ідентичності
      та автентифікатора як пари. Нові методи автентифікації дозволяють здійснювати зв’язок між ідентичністю та
      автентифікатором поза системою. Наприклад, за допомогою смарткартки, якщо ідентичність та автентифікатор пов’язані
      разом на ній. Використовуючи ці облікові дані, системи можуть автентифікувати цифрові ідентичності, які не
      були попередньо зв’язані самою системою, динамічно надаючи інформацію про цифрову ідентичність після процедури
      автентифікації. З цієї точки зору заздалегідь налагоджені довірчі відносини з відповідними органами для підтвердження
      ідентичності мають важливе значення.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ia-5.11
    ref_id: IA-5(11)
    name: Управління автентифікатором — Автентифікація на основі апаратних токенів
    category: technical
    csf_function: protect
    description: 'Вилучено: Включено до IA-2(1) та IA-2(2).'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ia-5.12
    ref_id: IA-5(12)
    name: Управління автентифікатором — Ефективність біометричної автентифікації
    category: technical
    csf_function: protect
    description: 'Для біометричної автентифікації використовувати механізми, які задовольняють [Призначення: визначені
      організацією вимоги до якості біометрії].


      Параметри:

      1. Призначення: визначені організацією вимоги до якості біометрії'
    annotation: На відміну від автентифікації на основі паролів, яка забезпечує можливість точно визначити відповідність
      введених користувачем паролів з тим, що зберігається, біометрична автентифікація не забезпечує таких точних
      перевірок. Залежно від типу біометричної автентифікації та типу механізму визначення відповідності (порівняння),
      є певна розбіжність між представленими біометричними даними та збереженими раніше (які служать основою для
      порівняння). Ефективність узгодження — це швидкість, з якою біометричний алгоритм правильно визначає таку
      відповідність. Вимоги до ефективності біометричної автентифікації містять, наприклад, коефіцієнт відповідності,
      який забепечується системою.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ia-5.13
    ref_id: IA-5(13)
    name: Управління автентифікатором - закінчення терміну кешування автентифікаторів
    category: technical
    csf_function: protect
    description: 'Заборонити використання кешованих автентифікаторів після [Призначення: визначеного організацією
      періоду часу].


      Параметри:

      1. Призначення: визначеного організацією періоду часу'
    annotation: Кешовані автентифікатори використовуються для автентифікації на локальній машині, коли мережа недоступна.
      Якщо кешована інформація автентифікації застаріла, дійсність інформації автентифікації може бути недостовірною.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ia-5.14
    ref_id: IA-5(14)
    name: Управління автентифікатором — Управління змістом довірчих сховищ інфраструктури відкритих ключів
    category: technical
    csf_function: protect
    description: Для автентифікації на основі інфраструктури з відкритим ключем використовувати загальноорганізаційну
      методологію управління вмістом довірених сховищ інфраструктури відкритого ключа, встановлених на всіх платформах,
      включно з мережами, операційними системами, браузерами та застосунками.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ia-5.15
    ref_id: IA-5(15)
    name: Управління автентифікатором — Продукти та послуги затверджені уповноваженим органом
    category: technical
    csf_function: protect
    description: Використовувати лише схвалені та затверджені уповноваженим органом продукти та послуги.
    annotation: Продукти та послуги, затверджені уповноваженим органом — це продукти та послуги, які були затверджені
      відповідно до вимог нормативних документів і законодавства та розміщені в затверджених списках.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ia-5.16
    ref_id: IA-5(16)
    name: Управління автентифікатором — Передача особистої або довірчої автентифікації зовнішньої сторони
    category: technical
    csf_function: protect
    description: 'Вимагати, щоб передача [Призначення: визначених організацією видів та/або конкретних автентифікаторів]
      проводилась [Вибір: особисто; довіреною зовнішньою стороною] до [Призначення: визначеного організацією, зареєстрованого
      органу] здійснювалася з авторизацією [Призначення: визначеними організацією персоналом або ролями].


      Параметри:

      1. Призначення: визначених організацією видів та/або конкретних автентифікаторів

      2. Вибір: особисто; довіреною зовнішньою стороною

      3. Призначення: визначеного організацією, зареєстрованого органу

      4. Призначення: визначеними організацією персоналом або ролями'
    annotation: Передача автентифікаторів особисто або довіреною зовнішньою стороною покращує та підвищує надійність
      процесу автентифікації особи.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ia-5.17
    ref_id: IA-5(17)
    name: Управління автентифікатором — Автоматизовані засоби виявлення атак з використанням біометричних автентифікаторів
    category: technical
    csf_function: protect
    description: Використовувати механізми виявлення атак із використанням штучно виготовлених артефактів для біометричних
      автентифікаторів.
    annotation: Біометричні характеристики не є таємницею. Такі характеристики можна отримати через Інтернет або
      просто сфотографувавши людину. Відбитки пальців можуть бути скопійовані навіть, якщо людина про це не здогадується.
      За допомогою захоплення зображення з високою роздільною здатністю можна отримати візерунок райдужної оболонки
      тощо. Автоматизовані засоби виявлення атак з використанням біометричних автентифікаторів можуть зменшити ризик
      виникнення цих типів атак та ускладнити створення арефактів для зламу біометричного датчика.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ia-5.18
    ref_id: IA-5(18)
    name: Управління автентифікатором — Менеджер паролів
    category: technical
    csf_function: protect
    description: 'a) Використовуйте [Призначення: визначені організацією менеджери паролів] для створення та керування
      паролями;

      b) Захистіть паролі за допомогою [Призначення: елементи керування, визначені організацією].


      Параметри:

      1. Призначення: визначені організацією менеджери паролів

      2. Призначення: елементи керування, визначені організацією'
    annotation: Для систем, де використовуються статичні паролі, часто важко переконатися, що паролі є достатньо
      складними та що вони не використовуються в кількох системах. Менеджер паролів є вирішенням цієї проблеми,
      оскільки він автоматично генерує та зберігає надійні та різні паролі для різних облікових записів. Потенційний
      ризик використання менеджерів паролів полягає в тому, що зловмисники можуть націлитися на список паролів,
      згенерованих менеджером паролів. Таким чином, список паролів вимагає захисту, включаючи шифрування паролів
      (див. IA-5(1)(d)) і збереження цього списку офлайн в токені.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ia-6
    ref_id: IA-6
    name: Зворотний зв’язок автентифікатора
    category: technical
    csf_function: protect
    description: Забезпечити приховану зворотну передачу інформації автентифікації в процесі автентифікації для
      забезпечення захисту інформації від можливої експлуатації та використання неавторизованими особами.
    annotation: Зворотній зв’язок не повинен містити інформацію, яка дозволила б стороннім особам скомпрометувати
      механізми автентифікації. Загроза типу «shoulder surfing» може бути більш імовірною для таких систем або компонентів,
      як настільні персональні комп’ютери чи ноутбуки з відносно великими моніторами, тоді як для інших, наприклад
      для мобільних пристроїв з невеликими дисплеями, вона є малоймовірною. Засіб для нівелювання зворотного зв’язку
      автентифікатора має вибиратися відповідно. До засобів приховування зворотнього зв’язку автентифікатора може
      належати відображення зірочок при введенні паролю або обмеження часу зворотнього зв’язку перед його приховуванням.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ia-7
    ref_id: IA-7
    name: Автентифікація криптографічного модуля
    category: technical
    csf_function: protect
    description: Впровадити механізми автентифікації в криптографічний модуль, який відповідає вимогам чинних законів,
      виконавчих розпоряджень, директив, політик, правил, стандартів та рекомендацій для такої автентифікації.
    annotation: Механізми автентифікації в криптографічному модулі можуть використовуватися для автентифікації оператора,
      який отримує доступ до модуля, і для перевірки того, що оператор має право виконувати конкретні дії.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ia-8
    ref_id: IA-8
    name: Ідентифікація та автентифікація користувачі, що не належать до організації)
    category: technical
    csf_function: protect
    description: Унікально ідентифікувати та автентифікувати користувачів, що не належать до організації або процеси
      (що не належать організації), які діють від імені користувачів.
    annotation: До користувачів, що не належать до організації, відносяться ті користувачі системи, які явно не
      зазначені в IA-2. Ці особи мають бути однозначно ідентифіковані й автентифіковані для отримання доступу, виняток
      становлять тільки випадки, коли потрібен доступ до загальнодоступних, чітко визначених і задокументованих
      в AC-14 ресурсів. Для ухвалення збалансованого й адекватного рішення щодо необхідності чіткої ідентифікації
      та автентифікації таких користувачів, організації мають враховувати багато факторів, включно з необхідністю
      масштабування, доцільністю, безпекою та приватністю.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ia-8.1
    ref_id: IA-8(1)
    name: Ідентифікація та автентифікація (користувачі, що не належать до організації) визнання посвідчень ідентифікаційних
      даних від інших установ
    category: technical
    csf_function: protect
    description: Приймати та в електронному вигляді перевіряти облікові дані (посвідчення ідентифікаційних даних),
      видані іншими установами для встановлення особи.
    annotation: Це посилення заходу стосується як логічних, так і фізичних систем контролю доступу. Посвідчення
      ідентифікаційних даних особи — це облікові дані, видані уповноваженими установами, які відповідають чинному
      законодавству. Адекватність та надійність емітентів карт PIV розглядаються та авторизуються за допомогою [
      SP 800-79-2 ].
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ia-8.2
    ref_id: IA-8(2)
    name: Ідентифікація та автентифікація (користувачі, що не належать до організації) — Визнання зовнішніх посвідчень
      ідентифікаційних даних
    category: technical
    csf_function: protect
    description: 'a) Приймати тільки зовнішні облікові дані (посвідчення ідентифікаційних даних), що відповідають
      вимогам нормативних документів та стандартів;

      b) Документувати та підтримувати список прийнятих зовнішніх автентифікаторів.'
    annotation: Це посилення заходу стосується систем організації, доступних для громадськості (наприклад загальнодоступних
      вебсайтів). Зовнішні облікові автентифікатори — це ті дані, які видаються зовнішніми структурами. Вимоги щодо
      зовнішніх облікових даних мають відповідати або перевищувати набір вимог щодо безпеки та приватності, які
      затверджені в організації (це дозволить сторонам довіряти таким даним).
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ia-8.3
    ref_id: IA-8(3)
    name: Ідентифікація та автентифікація (користувачі, що не належать до організації) — Використання затверджених
      продуктів
    category: technical
    csf_function: protect
    description: 'Вилучено: Включено до IA-8(2).'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ia-8.4
    ref_id: IA-8(4)
    name: Ідентифікація та автентифікація (користувачі, що не належать до організації) — Використання профілів виданих
      уповноваженим органом
    category: technical
    csf_function: protect
    description: 'Відповідайте наведеним нижче профілям для керування ідентифікацією. Для керування ідентифікацією
      забезпечити відповідність до профілів [Призначення: визначені організацією профілі керування ідентифікацією],
      що видані уповноваженим органом.


      Параметри:

      1. Призначення: визначені організацією профілі керування ідентифікацією'
    annotation: Це посилення стосується відкритих стандартів управління цифровими ідентичностями. Для гарантування
      надійності й актуальності стандартів управління цифровими ідентичностями, вони мають відповідати чинним державним
      та міжнародним нормативним документам. Профілі таких даних мають бути затверджені уповноваженими органами.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ia-8.5
    ref_id: IA-8(5)
    name: Ідентифікація та автентифікація (користувачі, що не належать до організації) — Визнання посвідчень особи
      (piv-i)
    category: technical
    csf_function: protect
    description: 'Приймати та підтверджувати облікові дані або дані PKI, які відповідають [Призначення: політика,
      визначена організацією] Приймати та підтверджувати в електронному вигляді облікові дані для підтвердження
      особи, що видаються недержавними органами.


      Параметри:

      1. Призначення: політика, визначена організацією'
    annotation: Це посилення застосовується як до логічного контролю доступу, так і до фізичного. Воно стосується
      недержавних органів, що прагнуть взаємодіяти з державними системами, і яким можна довіряти. Прийняття облікових
      даних PIV-I може здійснюватися PIV, PIV-I та іншими комерційними або зовнішніми постачальниками ідентифікаційної
      інформації. Прийняття та перевірка облікових даних, сумісних із PIV-I, застосовується як до логічних, так
      і до фізичних систем контролю доступу для недержавних емітентів посвідчень особи, які бажають взаємодіяти
      з урядовими системами Політика щодо сертифікатів X.509 Федерального центру сертифікації мостів (FBCA) відповідає
      вимогам PIV-I. Картка PIV-I співмірна з обліковими даними PIV, як визначено в цитованих посиланнях. Облікові
      дані PIV-I – це облікові дані, видані постачальником послуг PIV-I, чия політика сертифікатів PIV-I відповідає
      політиці сертифікатів Federal Bridge PIV-I. Постачальник PIV-I проходить перехресну сертифікацію з FBCA (безпосередньо
      або через інший міст PKI) із політиками, які зіставлено та схвалено як такі, що відповідають вимогам політик
      PIV-I, визначених у політиці сертифікатів FBCA.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ia-8.6
    ref_id: IA-8(6)
    name: Ідентифікація та автентифікація (користувачі, що не належать до організації) — Розмежування
    category: technical
    csf_function: protect
    description: 'Застосувати наступні заходи, щоб розмежувати атрибути користувача або зв’язки підтвердження ідентифікатора
      між окремими особами, постачальниками облікових даних і довіреними сторонами: [Призначення: заходи, визначені
      організацією].


      Параметри:

      1. Призначення: заходи, визначені організацією'
    annotation: Однакові рішення в управлінні цифровими ідентичностями можуть створювати підвищені ризики приватності
      (оскільки потенційні зловмисники легко зможуть відстежувати осіб). Використання таблиць відповідності ідентифікаторів
      або криптографічних методів, для розмежування постачальників облікових даних і довірених сторін один від одного
      або зробити атрибути ідентифікації менш видимими для сторін, може зменшити ці ризики конфіденційності.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ia-9
    ref_id: IA-9
    name: Послуги ідентифікації та автентифікації
    category: technical
    csf_function: protect
    description: 'Ідентифікувати та автентифікувати [Призначення: визначені організацією системні служби та застосунки],
      перш ніж встановлювати зв’язок з пристроями, користувачами або іншими послугами чи застосунками.


      Параметри:

      1. Призначення: визначені організацією системні служби та застосунки'
    annotation: До служб, які можуть вимагати ідентифікації та автентифікації, належать, наприклад, вебзастосунки,
      які використовують цифрові сертифікати, або послуги, які запитують дані з бази даних. Методи ідентифікації
      та автентифікації для служб/застосунків системи охоплюють, наприклад, підписи інформації або коду, графіки
      походження та електронні підписи, які вказують на джерела послуг. Рішення щодо дійсності ідентифікації та
      автентифікації приймаються службами, окремими від тих, які діють на основі цих рішень. Це може статися в системах
      з розподіленими архітектурами. У таких ситуаціях рішення щодо ідентифікації та автентифікації (замість фактичних
      ідентифікаторів і даних автентифікації) надаються службам, які повинні діяти відповідно до цих рішень.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ia-9.1
    ref_id: IA-9(1)
    name: Послуги ідентифікації та автентифікації - обмін інформацією
    category: technical
    csf_function: protect
    description: 'Виключено: перенесено до IA-9.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ia-9.2
    ref_id: IA-9(2)
    name: Послуги ідентифікації та автентифікації — Передача рішень
    category: technical
    csf_function: protect
    description: 'Виключено: перенесено до IA-9.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ia-10
    ref_id: IA-10
    name: Адаптивна автентифікація
    category: technical
    csf_function: protect
    description: 'Вимагати, щоб особи, які отримують доступ до системи, використовували [Призначення: визначені
      організацією додаткові методи або механізми автентифікації] відповідно до конкретних [Призначення: визначених
      організацією обставин або ситуацій].


      Параметри:

      1. Призначення: визначені організацією додаткові методи або механізми автентифікації

      2. Призначення: визначених організацією обставин або ситуацій'
    annotation: Порушники можуть скомпрометувати окремі механізми автентифікації та згодом спробувати видати себе
      за законних користувачів. Ця ситуація потенційно може статися з будь-якими механізмами автентифікації. Для
      зниження ймовірності такої загрози організації можуть використовувати конкретні методи чи механізми та реалізовувати
      протоколи для оцінювання підозрілої поведінки. До такої поведінки може належати доступ до інформації, яку
      користувач зазвичай не запитував і яка йому не потрібна для виконання службових обов’язків, або спроби отримати
      доступ до інформації з підозрілих мережевих адрес. У заздалегідь визначених ситуаціях організації можуть вимагати
      від користувачів надання додаткової інформації для автентифікації. Адаптивна автентифікація не замінює і не
      використовується замість багатофакторних механізмів, але може розширювати реалізацію цих заходів безпеки.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ia-11
    ref_id: IA-11
    name: Повторна автентифікація
    category: technical
    csf_function: protect
    description: 'Вимагати від користувачів повторної автентифікації, при [Призначення: визначених організацією
      обставинах або ситуаціях, що вимагають повторної автентифікації].


      Параметри:

      1. Призначення: визначених організацією обставинах або ситуаціях, що вимагають повторної автентифікації'
    annotation: Окрім вимог повторної автентифікації у випадках, пов’язаних з блокуванням пристроїв, організації
      можуть вимагати повторну автентифікацію користувачів у певних ситуаціях, зокрема при зміні автентифікатора
      або ролі, категорії безпеки системи, при використанні привілейованих облікових записів або після проходження
      встановленого проміжку часу.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ia-12
    ref_id: IA-12
    name: Перевірка справжності (ідентичності)
    category: process
    csf_function: protect
    description: 'a. Засвідчити особи користувачів, яким потрібні облікові записи для логічного доступу до систем
      на основі вимог гарантій відповідного рівня, як це зазначено у відповідних стандартах і рекомендаціях.

      b. Встановити ідентифікатори користувачів унікальні для особи.

      c. Збирати, затверджувати та перевіряти докази (свідчення) ідентичності особи.'
    annotation: Підтвердження ідентичності — це процес збору та перевірки персональних даних користувача для видачі
      облікових даних для доступу до системи. Цей захід безпеки призначений для зменшення ймовірності загроз при
      реєстрації користувачів та створенні їхніх облікових записів. Стандарти та вказівки, що визначають рівні забезпечення
      ідентифікації для підтвердження особи, включають [SP 800-63-3] і [SP 800-63A]. На організації можуть поширюватися
      закони, виконавчі накази, директиви, нормативні акти або правила, які стосуються збору ідентифікаційних даних.
      Персонал організації консультується зі старшим представником агентства з конфіденційності та юрисконсультантом
      щодо таких вимог.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ia-12.1
    ref_id: IA-12(1)
    name: Перевірка справжності (ідентичності) - авторизація супервайзера
    category: process
    csf_function: protect
    description: Вимагати, щоб процес реєстрації для отримання облікового запису для логічного доступу містив авторизацію
      супервайзера.
    annotation: Авторизація супервайзера забезпечує додатковий рівень перевірки, щоб переконатися, що ланцюжок керування
      користувача знає про обліковий запис і що обліковий запис є важливим для виконання завдань і функцій організації,
      а привілеї користувача відповідають передбачуваним обов’язкам і повноваженням в організації.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ia-12.2
    ref_id: IA-12(2)
    name: Перевірка справжності (ідентичності) — Посвідчення особи
    category: process
    csf_function: protect
    description: Вимагати пред’явлення до реєстраційного органу документів, що посвідчують особу.
    annotation: Вимога перевірки доказів ідентичності (документальних та/або біометричних) зменшує ймовірність використання
      особами чужих персональних даних. Форми доказів мають відповідати конкретній системі та залежати від ролей
      та привілеїв, пов’язаних з обліковим записом користувача.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ia-12.3
    ref_id: IA-12(3)
    name: Перевірка справжності (ідентичності) - перевірка та верифікація доказів ідентичності
    category: process
    csf_function: protect
    description: 'Вимагати, щоб надані докази ідентифікації були підтверджені та перевірені за допомогою [Призначення:
      визначені організацією методи перевірки та верифікації].


      Параметри:

      1. Призначення: визначені організацією методи перевірки та верифікації'
    annotation: Перевірка та верифікація посвідчень особи підвищує впевненість у тому, що акаунти, ідентифікатори
      та автентифікатори видаються істинному користувачеві. Верифікація — це процес підтвердження того, що докази
      є справжніми та достовірними та що дані, які містяться в доказах, є правильними, актуальними та стосуються
      реальної особи. Верифікація підтверджує та встановлює зв’язок між заявленою особою та фактичним існуванням
      користувача, який надає докази. Прийнятні методи перевірки та верифікації посвідчень ідентичності мають відповідати
      конкретній системі та залежати від ролей і привілеїв, пов’язаних з обліковим записом користувача.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ia-12.4
    ref_id: IA-12(4)
    name: Перевірка справжності (ідентичності) — Очна перевірка та верифікація
    category: process
    csf_function: protect
    description: Вимагати, щоб підтвердження та перевірка посвідчень особи проводилися особисто в призначеному органі
      реєстрації.
    annotation: Особиста верифікація знижує ймовірність видачі шахрайських даних, оскільки це вимагає фізичної присутності
      осіб, надання фізичних документів, що посвідчують особу, та фактичної взаємодії з органами реєстрації.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ia-12.5
    ref_id: IA-12(5)
    name: Перевірка адреси
    category: process
    csf_function: protect
    description: 'Вимагати, щоб [Вибір: реєстраційний код; повідомлення про перевірку] доставлялися через зовнішній
      канал для перевірки адреси (фізичної або цифрової) реєстрації користувачів.


      Параметри:

      1. Вибір: реєстраційний код; повідомлення про перевірку'
    annotation: Для зменшення ризику того, що порушники маскуватимуться під легітимних користувачів під час процесу
      перевірки ідентичності, організації можуть використовувати додаткові методи для підвищення впевненості, що
      особою, пов’язаною з адресою запису, є та сама особа, яка брала участь у реєстрації. Підтвердження може мати
      форму тимчасового коду або повідомлення про підтвердження. Адреса (фізична або електронна) доставки цих тимчасових
      даних отримується з облікових записів, а не від користувача. Домашня адреса — приклад фізичної адреси. Адреси
      електронної пошти та телефонні номери — приклади електронних адрес.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ia-12.6
    ref_id: IA-12(6)
    name: Перевірка справжності (ідентичності) - прийняття ідентифікацій, схвалених третьою стороною
    category: process
    csf_function: protect
    description: 'Приймати ідентифікатори із зовнішньою перевіркою з [Призначення: рівень гарантії ідентичності,
      визначений організацією].


      Параметри:

      1. Призначення: рівень гарантії ідентичності, визначений організацією'
    annotation: Для обмеження непотрібного повторного підтвердження особи, особливо користувачів, організації можуть
      приймати докази, які надані іншими установами та організаціями (за умови, що такі докази відповідають політиці
      безпеки організації та мають достатній рівень гарантій).
