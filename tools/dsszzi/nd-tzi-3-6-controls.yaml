    csf_function: protect
    description: '[Вилучено до AC-2k.].'
    annotation: null
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ac-2.11
    ref_id: AC-2(11)
    name: Управління обліковими записами — Умови використання
    category: process
    csf_function: protect
    description: 'Забезпечити дотримання [Призначення: обставин та/або умов використання, визначених організацією]
      для [Призначення: визначених організацією облікових записів системи].


      Параметри:

      1. Призначення: обставин та/або умов використання, визначених організацією

      2. Призначення: визначених організацією облікових записів системи'
    annotation: Це посилення допомагає застосувати принцип мінімізації привілеїв, підвищити підзвітність користувачів
      та забезпечити більш ефективний моніторинг облікових записів. Такий моніторинг містить, наприклад, сповіщення
      про використання облікового запису поза визначеними параметрами. При цьому можуть бути описані конкретні умови
      або обставини, за яких системні облікові записи можуть використовуватися (наприклад, лише в певні дні тижня,
      протягом певного часу, тощо).
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ac-2.12
    ref_id: AC-2(12)
    name: Управління обліковими записами — Моніторинг нетипового використання облікових записів
    category: technical
    csf_function: protect
    description: 'a) Проводити моніторинг облікових записів системи на [Призначення:

      визначене організацією нетипове використання].

      b) Повідомляти про нетипове використання облікових записів системи [Призначення: визначеного організацією
      персоналу або ролей].


      Параметри:

      1. Призначення: визначене організацією нетипове використання

      2. Призначення: визначеного організацією персоналу або ролей'
    annotation: До нетипового використання належить, наприклад, доступ до систем у певний час доби та день місяця
      чи з локацій, які не відповідають робочим функціям персоналу. Моніторинг облікових записів може ненавмисно
      створити ризики приватності. Дані, зібрані для виявлення нетипового використання, можуть виявити раніше невідому
      інформацію про поведінку людей. Ці ризики мають бути оціненими та задокументованими. На основі таких оцінок
      мають бути ухвалені рішення відповідно до чинної програми (концепції) приватності.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ac-2.13
    ref_id: AC-2(13)
    name: Управління обліковими записами — Деактивація облікових записів осіб з високим рівнем ризику
    category: technical
    csf_function: protect
    description: 'Деактивувати облікові записи користувачів, які становлять значний ризик, у межах [Призначення:
      визначеного організацією періоду часу] після виявлення ризику.


      Параметри:

      1. Призначення: визначеного організацією періоду часу'
    annotation: 'Користувачами, які становлять значний ризик для


      організацій, є особи, щодо яких наявні достовірні докази, що вказують на їхній намір використовувати або свій
      санкціонований доступ до систем для заподіяння шкоди напряму, або через посередників. Такий ризик містить
      можливі несприятливі наслідки для організаційних операцій і активів, окремих людей, інших організацій чи держави.
      Для своєчасного здійснення цього посилення необхідна тісна координація та співпраця між посадовими особами,
      адміністраторами системи та менеджерами з управління персоналом.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ac-3
    ref_id: AC-3
    name: Забезпечення доступу
    category: technical
    csf_function: protect
    description: Застосовувати затверджені повноваження для логічного доступу до інформації та ресурсів системи
      відповідно до чинної політики (правил) управління доступом.
    annotation: Політика управління доступом контролює доступ між активними об’єктами чи суб’єктами (тобто користувачами
      або процесами, що діють від імені користувачів) та пасивними об’єктами чи об’єктами (тобто пристроями, файлами,
      записами, доменами) в системах організації. Окрім забезпечення авторизованого доступу на системному рівні
      та визнання того, що системи можуть розміщувати багато застосунків і служб для підтримки операцій, механізми
      забезпечення доступу також можуть бути використані на рівні застосунків і послуг для забезпечення підвищеної
      інформаційної безпеки.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ac-3.1
    ref_id: AC-3(1)
    name: Забезпечення доступу — Обмежений доступ до привілейованих функцій
    category: technical
    csf_function: protect
    description: '[Вилучено: включено до AC-6].'
    annotation: null
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ac-3.2
    ref_id: AC-3(2)
    name: Забезпечення доступу — Подвійна авторизація
    category: technical
    csf_function: protect
    description: 'Забезпечити подвійну авторизацію для [Призначення: визначених організацією привілейованих команд
      та/або інших дій, визначених організацією].


      Параметри:

      1. Призначення: визначених організацією привілейованих команд та/або інших дій, визначених організацією'
    annotation: Подвійна авторизація являє собою двоосібний контроль. Механізми подвійної авторизації вимагають
      схвалення двох уповноважених осіб для виконання дії. Механізми подвійної авторизації повинні бути спрощені
      у випадках, коли необхідні негайні реакції для забезпечення громадської та екологічної безпеки.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ac-3.3
    ref_id: AC-3(3)
    name: Забезпечення доступу — Мандатне управління доступом
    category: technical
    csf_function: protect
    description: 'Застосовувати [Призначення: визначену організацією мандатну (mandatory)

      політику управління доступом] щодо всіх суб’єктів і об’єктів доступу, у яких політика:


      (a) одноманітно застосовується для всіх суб’єктів і об’єктів у межах системи;


      (b) вказує, що суб’єкт, якому було надано доступ до інформації, обмежений у виконанні будь-якої з таких дій:

      (1) передача інформації неавторизованим суб’єктам або об’єктам;

      (2) надання іншим суб’єктам привілеїв;

      (3) зміна одного чи декількох атрибутів безпеки суб’єкта, об’єкта, системи або компонентів системи;

      (4) вибір атрибутів безпеки та значень атрибутів, які повинні бути пов’язані з новоствореними або зміненими
      об’єктами;

      (5) зміна правил, що регулюють управління доступом;


      (c) має бути вказано, що [Призначення: визначеним організацією суб’єктам] можуть бути явно надані [Призначення:
      визначені організацією привілеї], так що вони не обмежуються будь-яким з перелічених вище обмежень.


      Параметри:

      1. Призначення: визначену організацією мандатну (mandatory) політику управління доступом

      2. Призначення: визначеним організацією суб’єктам

      3. Призначення: визначені організацією привілеї'
    annotation: 'Обов’язковий (мандатний) контроль доступу — це тип недискреційного управління доступом. Вищезазначений
      клас обов’язкових політик контролю доступу обмежує дії, які суб’єкти можуть вжити з інформацією, отриманою
      з об’єктів даних, до яких їм уже надано доступ (наприклад обмеження передачі інформації неавторизованим об’єктам).
      Цей клас обов’язкових політик контролю доступу також обмежує дії, які суб’єкти можуть вжити щодо розповсюдження
      привілеїв контролю доступу, тобто суб’єкт з привілеєм не може передавати цей привілей іншим суб’єктам. Політика
      має поширюватися на всі суб’єкти та об’єкти системи (забезпечення цієї рекомендації можливе з використанням
      AC-25). Дія політики обмежена межами системи (тобто, як тільки інформація передається поза межі системи, можуть
      знадобитися додаткові засоби для того, щоб обмеження щодо інформації залишалися в силі).


      Описані вище довірені суб’єкти отримують привілеї, що відповідають поняттю мінімізації привілею (див. AC-6).
      Довіреним суб’єктам надаються лише мінімальні привілеї щодо вищезазначеної політики, які необхідні для задоволення
      потреб організації. Цей захід є найбільш ефективним за умови, що наявний відповідний мандат, який встановлює
      політику доступу до інформації з обмеженим доступом, а користувачі системи не мають права доступу до всієї
      такої інформації, яка перебуває в системі. Цей захід може впроваджуватися спільно з AC-3(4). Суб’єкт, діяльність
      якого обмежена політикою відповідно до цього заходу, може діяти за менш жорстких обмежень AC-3 (4), але політика
      відповідно до цього заходу має перевагу над менш жорсткими обмеженнями AC3 (4). Наприклад, обов’язкова політика
      контролю доступу накладає обмеження щодо передачі інформації іншому суб’єкту, який не має відповідних прав
      доступу. AC-3 (4) дозволяє суб’єкту передавати інформацію будь-якому іншому суб’єкту, наділеному аналогічними
      (достатніми для цього) правами.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ac-3.4
    ref_id: AC-3(4)
    name: Забезпечення доступу — Дискреційне управління доступом
    category: technical
    csf_function: protect
    description: 'Застосовувати [Призначення: визначену організацією дискреційну політику управління доступом] щодо
      визначених суб’єктів і об’єктів доступу, для яких політика визначає, що суб’єкт, якому було надано доступ
      до інформації, може виконати одну чи більше з таких дій:


      (a) передача інформацію будь-яким іншим суб’єктам чи об’єктам;


      (b) призначення своїх привілей іншим суб’єктам;


      (c) зміна атрибутів безпеки суб’єктів, об’єктів, систем або компонентів системи;


      (d) вибір атрибутів безпеки, які будуть пов’язані з новоствореними або переглянутими об’єктами;


      (e) зміна правил, що регулюють управління доступом.


      Параметри:

      1. Призначення: визначену організацією дискреційну політику управління доступом'
    annotation: Реалізація дискреційної політики контролю доступу не обмежує суб’єкт у діях, які він може вживати
      з інформацією, до якої йому вже надано доступ. Таким чином, суб’єктам, яким надано доступ до інформації, можуть
      передавати (тобто суб’єкти мають право на передання) інформацію іншим суб’єктам або об’єктам. Це посилення
      може впроваджуватися спільно з AC-3(3). Суб’єкт, обмежений у своїй діяльності політикою AC-3(3) та АС-3(15),
      все ще може діяти в умовах менш жорстких обмежень цього посилення. Тому, хоча AC-3 (3) накладає обмеження,
      що не дозволяють суб’єкту передавати інформацію іншому суб’єкту, який не має відповідних прав доступу, AC-3(4)
      дозволяє суб’єкту передавати інформацію будь-якому суб’єкту з однаковим рівнем прав доступу. Дія політики
      обмежена межами системи. Після передачі інформації за межі системи, можуть знадобитися додаткові засоби для
      того, щоб обмеження щодо інформації залишалися в силі. Хоча більш традиційні визначення дискреційного контролю
      доступу вимагають контролю доступу, заснованого на ідентичності, ця вимога не є обов’язковою для використання
      дискреційного контролю доступу.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ac-3.5
    ref_id: AC-3(5)
    name: Забезпечення доступу — Інформація щодо безпеки
    category: technical
    csf_function: protect
    description: 'Запобігати доступу до [Призначення: інформації щодо безпеки, яка визначена організацією], за винятком
      випадків, коли наявні безпечні неробочі стани системи.


      Параметри:

      1. Призначення: інформації щодо безпеки, яка визначена організацією'
    annotation: 'Інформація щодо безпеки — це будь-яка інформація всередині систем, яка може вплинути на роботу
      функцій безпеки чи надання послуг з гарантування безпеки таким чином, що може призвести до неприйняття політик
      безпеки системи або порушення конфіденційності коду та даних. Інформація щодо безпеки містить, наприклад,
      правила фільтрації маршрутизаторів/брандмауерів, інформацію управління криптографічними ключами, параметри
      конфігурації служб безпеки та списки контролю доступу. Безпечні, непрацездатні стани системи охоплюють час,
      коли система не виконує функції, пов’язані з діяльністю організації;

      наприклад система працює в офлайн-режимі для обслуговування, усунення несправностей тощо.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ac-3.6
    ref_id: AC-3(6)
    name: Забезпечення доступу — Захист інформації користувача та системи
    category: technical
    csf_function: protect
    description: '[Вилучено: включено до MP-4 та SC-28].'
    annotation: null
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ac-3.7
    ref_id: AC-3(7)
    name: Забезпечення доступу — Управління доступом на основі ролей
    category: technical
    csf_function: protect
    description: 'Застосовувати політику управління доступом на основі ролей щодо визначених суб’єктів і об’єктів
      та управління доступом на основі [Призначення: визначених організацією ролей та користувачів, уповноважених
      приймати такі ролі].


      Параметри:

      1. Призначення: визначених організацією ролей та користувачів, уповноважених приймати такі ролі'
    annotation: Контроль доступу на основі ролей (RBAC) — це політика управління доступом, яка обмежує доступ до
      системи для авторизованих користувачів. Конкретні ролі можуть створюватися на основі функцій завдань і дозволів
      (тобто привілеїв) для виконання необхідних операцій у системах, пов’язаних з визначеними організацією ролями.
      Коли користувачу надається організаційна роль, він успадковує права, визначені для цієї ролі. RBAC спрощує
      адміністрування привілеїв, оскільки привілеї не присвоюються безпосередньо кожному користувачеві (така кількість
      користувачів може бути досить великою), а натомість набуваються за допомогою розподілу ролей. RBAC може бути
      реалізований як обов’язкова або дискреційна форма контролю доступу. При застосуванні RBAC з обов’язковим контролем
      доступу, сфера діяльності суб’єктів і об’єктів, на які поширюється політика визначається вимогами AC-3 (3).
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ac-3.8
    ref_id: AC-3(8)
    name: Забезпечення доступу — Анулювання прав доступу
    category: technical
    csf_function: protect
    description: 'Здійснювати анулювання прав доступу в результаті змін атрибутів безпеки суб’єктів і об’єктів на
      основі [Призначення: визначених організацією правил, що регулюють терміни скасування прав доступу].


      Параметри:

      1. Призначення: визначених організацією правил, що регулюють терміни скасування прав доступу'
    annotation: 'Анулювання правил доступу може відрізнятися залежно від типу анульованого доступу. Наприклад, якщо
      суб’єкт (тобто користувач або процес)

      був видалений з групи, доступ може не бути анульовано до наступного відкриття об’єкта чи наступного разу,
      коли суб’єкт спробує отримати новий доступ до об’єкта.

      Анулювання на основі зміни міток безпеки може набрати чинності негайно. Якщо система не може забезпечити можливість
      негайного анулювання доступу, для цього мають бути впровадженні додаткові механізми (у разі, коли негайне
      анулювання необхідне).'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ac-3.9
    ref_id: AC-3(9)
    name: Забезпечення доступу — Керована передача (публікація) інформації
    category: technical
    csf_function: protect
    description: 'Передавати (публікувати) інформацію за межами встановленої межі системи можливо, якщо:


      a) Приймальна [Призначення: визначена організацією система або компонент системи] забезпечує [Призначення:
      визначені організацією заходи безпеки];


      b) [Призначення: визначені організацією заходи безпеки] використовуються для підтвердження відповідності інформації,
      призначеної для керованих передач (публікації).


      Параметри:

      1. Призначення: визначена організацією система або компонент системи

      2. Призначення: визначені організацією заходи безпеки'
    annotation: 'Система може забезпечити безпеку організаційної інформації лише у своїх межах. Для забезпечення
      належного захисту інформації після її передачі поза встановлені межі системи можливо, знадобиться додатковий
      контроль. У ситуаціях, коли система не в змозі визначити адекватність захисту, що надається суб’єктами за
      її межами, як пом’якшувальний контроль можуть бути застосовані процедурні заходи. Засоби, що використовуються
      для визначення достатності рівня безпеки, що надаються зовнішніми системами, можуть містити, наприклад: проведення
      перевірок або періодичні випробування та оцінювання; встановлення угод між організацією та її партнерами;
      чи якийсь інший процес. Засоби, що використовуються зовнішніми організаціями для захисту отриманої інформації,
      можуть відрізнятися від тих заходів, які впроваджені в самій системі; вони мають бути достатніми для забезпечення
      послідовного вирішення положень політики безпеки для захисту інформації.


      Це посилення вимагає від систем використання технічних чи процедурних засобів для перевірки інформації перед
      передаванням за власні межі. Наприклад, якщо система передає інформацію, яка належить системі іншої організації,
      необхідно застосовувати технічні засоби для перевірки відповідності атрибутів безпеки приймальної системи
      відповідно до цієї експортованої інформації.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ac-3.10
    ref_id: AC-3(10)
    name: Забезпечення доступу — Перегляд аудитом механізмів контролю доступу
    category: technical
    csf_function: protect
    description: 'Застосувати перегляд аудитом механізмів автоматизованого управління доступу при [Призначення:
      визначених організацією умовах] [Призначення: визначеними організацією ролями].


      Параметри:

      1. Призначення: визначених організацією умовах

      2. Призначення: визначеними організацією ролями'
    annotation: У певних ситуаціях, наприклад, коли є загроза життю людини або здатності організації виконувати
      критичні функції, можуть знадобитися механізми контролю доступу. Перелік таких ситуацій є вичерпним та визначається
      конкретними організаціями.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ac-3.11
    ref_id: AC-3(11)
    name: Забезпечення доступу — Обмеження доступу до спеціальної інформації
    category: technical
    csf_function: protect
    description: 'Обмежити прямий доступ до сховищ даних, що містять [Призначення: визначені організацією типи інформації].


      Параметри:

      1. Призначення: визначені організацією типи інформації'
    annotation: 'Це посилення покликане забезпечити гнучкість контролю доступу до конкретних фрагментів інформації
      всередині системи.

      Наприклад, доступ на основі ролей може бути використаний для отримання лише певного набору ідентифікаційної
      інформації з бази даних, а не доступу до бази даних у повному обсязі.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ac-3.12
    ref_id: AC-3(12)
    name: Забезпечення доступу — Встановлення та забезпечення доступу до застосунків
    category: technical
    csf_function: protect
    description: 'a) Вимагати від застосунків встановити в процесі інсталяції доступ до таких застосунків системи
      і функцій: [Призначення: визначених організацією програм та функції системи];

      b) Впровадити механізм примусового застосування, щоб запобігти доступу, відмінному від заявленого.


      c) Схвалити зміни доступу після початкового встановлення застосунків.


      Параметри:

      1. Призначення: визначених організацією програм та функції системи'
    annotation: Це посилення призначене для програм, які потребують доступу до чинних застосунків і функцій системи,
      включно з, наприклад, контактами користувачів, глобальною системою позиціювання, камерою, клавіатурою, мікрофоном,
      контактами чи іншими файлами.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ac-3.13
    ref_id: AC-3(13)
    name: Забезпечення доступу — Управління доступом на основі атрибутів
    category: technical
    csf_function: protect
    description: 'Здійснювати політику управління доступу на основі атрибутів (atribute-based)

      для визначених суб’єктів і об’єктів доступу й управляти доступом на основі [Призначення: визначених організацією
      атрибутів для ухвалення рішень про доступ].


      Параметри:

      1. Призначення: визначених організацією атрибутів для ухвалення рішень про доступ'
    annotation: 'Управління доступом на основі атрибутів (ABAC) — це політика управління доступом, яка обмежує доступ
      до системи авторизованих користувачів на основі їхніх атрибутів, таких як посадові функції; екологічні ознаки
      (наприклад час доби); атрибути ресурсу (класифікація документа).

      Можуть створюватися конкретні правила на основі атрибутів і дозволів (тобто привілеїв) для виконання необхідних
      операцій у системі, пов’язаних з визначеними атрибутами та правилами. Коли користувачам призначаються атрибути,
      які визначені в політиці чи правилах, вони можуть отримати доступ до системи з відповідними привілеями або
      їм може надаватися динамічний доступ до захищеного ресурсу. ABAC може бути реалізований як обов’язкова чи
      дискреційна форма контролю доступу. У разі використання ABAC з обов’язковим контролем доступу, вимоги AC-3(3)
      визначають сферу діяльності суб’єктів і об’єктів, на які поширюється політика.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ac-3.14
    ref_id: AC-3(14)
    name: Забезпечення доступу — Індивідуальний доступ
    category: technical
    csf_function: protect
    description: 'Надайте [Призначення: механізми, визначені організацією], щоб дозволити особам мати доступ до
      певних елементів їх особистої інформації: [Призначення:

      елементи, визначені організацією]


      Параметри:

      1. Призначення: механізми, визначені організацією

      2. Призначення: елементи, визначені організацією'
    annotation: 'Індивідуальний доступ надає особам можливість переглядати особисту інформацію про них, яка зберігається
      в записах організації, незалежно від формату. Доступ допомагає людям зрозуміти, як обробляється їх особиста
      інформація та переконатися, що їхні дані точні.

      Механізми доступу можуть включати форми запитів та інтерфейси додатків. Для федеральних агентств процеси приватності
      можна знайти в системах сповіщень про записи та на вебсайтах агентств. Доступ до певних типів записів може
      бути невідповідним (наприклад, для федеральних агентств записи правоохоронних органів у системі записів можуть
      бути звільнені від розголошення відповідно до приватності або вимагати певних рівнів гарантії автентифікації.
      Персонал організації консультується зі старшою посадовою особою агентства щодо конфіденційності та з юрисконсультантом
      для визначення відповідних механізмів та прав чи обмежень доступу.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ac-3.15
    ref_id: AC-3(15)
    name: Забезпечення доступу — Дискреційний та обовʼязковий доступ
    category: technical
    csf_function: protect
    description: '(a) Застосовувати [Призначення: визначену організацією політику обов’язкового контролю доступу]
      до набору охоплених суб’єктів і об’єктів, указаних у політиці;


      (b) Застосування [Призначення: визначена організацією дискреційна політика контролю доступу] до набору охоплених
      суб’єктів і об’єктів, указаних у політиці.


      Параметри:

      1. Призначення: визначену організацією політику обов’язкового контролю доступу

      2. Призначення: визначена організацією дискреційна політика контролю доступу'
    annotation: Одночасне впровадження політики обов’язкового контролю доступу та політики контролю доступу на власний
      розсуд може забезпечити додатковий захист від несанкціонованого виконання коду користувачами або процесами,
      що діють від імені користувачів. Це допомагає запобігти компрометації всієї системи одним скомпрометованим
      користувачем або процесом.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ac-4
    ref_id: AC-4
    name: Управління інформаційними потоками
    category: technical
    csf_function: protect
    description: 'Застосувати затверджені повноваження для управління потоком інформації всередині системи та між
      пов’язаними системами на основі [Призначення: визначеними організацією політиками управління інформаційним
      потоком].


      Параметри:

      1. Призначення: визначеними організацією політиками управління інформаційним потоком'
    annotation: 'Управління інформаційними потоками регулює межі пересування інформації як всередині системи, так
      і між взаємопов’язаними системами без явного врахування подальшого доступу до цієї інформації. Обмеження управління
      потоками охоплюють, наприклад, запобігання передачі інформації в Інтернеті, блокування зовнішнього трафіку,
      обмеження вебзапитів в Інтернеті, які не відповідають обмеженням внутрішніми проксі-серверами, та обмеження
      передачі інформації між організаціями на основі структури даних і вмісту. Передача інформації між системами
      з різними політиками безпеки створює ризик того, що такий режим передачі порушує одну або декілька політик
      безпеки домену. У таких ситуаціях власники інформації мають надавати вказівки у визначених пунктах впровадження
      політики між взаємопов’язаними системами. Конкретні архітектурні рішення можуть застосовуватися в разі, якщо
      потрібне впровадження певної політики безпеки.

      Наприклад, за потреби контролю одностороннього інформаційного потоку між двома взаємопов’язаними системами
      можуть використовуватися апаратні засоби, визначатися атрибути та механізми доступу.

      Управління інформаційними потоками має впроваджуватися з урахуванням характеристик інформації, що обробляється,
      а також із врахуванням інформаційного шляху. Примусові заходи можуть застосовуватися, наприклад, у пристроях
      захисту периметру, включно з наборами правил, конфігураціями, які обмежують системні послуги, надають можливість
      фільтрування пакетів на основі заголовка або можливість фільтрації повідомлень на основі вмісту. Надійність
      таких механізмів має бути визначена за результатами проведеного оцінювання. Посилення заходу (3)-(22) загалом
      стосуються управління інформаційними потоками, які передаються між декількома системами (вони базуються на
      глибокому аналізі, вдосконалених методах фільтрації, апаратних рішеннях). Такі можливості можуть бути відсутніми
      в системах комерційного призначення.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ac-4.1
    ref_id: AC-4(1)
    name: Управління інформаційними потоками — Атрибути безпеки об'єкту
    category: technical
    csf_function: protect
    description: 'Використовувати [Призначення: визначені організацією атрибути безпеки], пов’язані з [Призначення:
      визначеними організацією інформацією, джерелами та об’єктами призначення], щоб запровадити [Призначення: визначену
      організацією політику управління потоками інформації] як основу для ухвалення рішень щодо управління потоками.


      Параметри:

      1. Призначення: визначені організацією атрибути безпеки

      2. Призначення: визначеними організацією інформацією, джерелами та об’єктами призначення

      3. Призначення: визначену організацією політику управління потоками інформації'
    annotation: 'Механізми управління інформаційними потоками оперують атрибутами безпеки інформації (вміст і структура
      даних) та об’єктами джерела та призначення. На основі цих атрибутів визначаються ситуації, які можуть суперечити
      політикам безпеки. Наприклад, інформаційному об’єкту, який має гриф «таємно», дозволено потік до об’єкта призначення
      з грифом

      «таємно», але інформаційному об’єкту з грифом «цілком таємно» заборонено надходити до об’єкта призначення
      з грифом «таємно». Атрибути безпеки можуть також містити джерела й адреси призначення, використовувані в брандмауерах.
      Управління потоками за допомогою явних атрибутів безпеки може використовуватися для контролю певних типів
      інформації.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ac-4.2
    ref_id: AC-4(2)
    name: Управління інформаційними потоками — Домени обробки даних
    category: technical
    csf_function: protect
    description: 'Використовувати захищені домени обробки даних для забезпечення [Призначення: визначеної організацією
      політики управління потоками інформації] як основу для ухвалення рішень щодо управління потоками.


