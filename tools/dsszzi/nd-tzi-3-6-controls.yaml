  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:au-16.2
    ref_id: AU-16(2)
    name: Міжорганізаційний аудит — Обмін інформацією аудиту
    category: process
    csf_function: protect
    description: 'Надавати інформацію про міжорганізаційний аудит до [Призначення: організацій, визначених організацією]
      на основі [Призначення: визначеної організацією міжорганізаційної угоди про обмін].


      Параметри:

      1. Призначення: організацій, визначених організацією

      2. Призначення: визначеної організацією міжорганізаційної угоди про обмін'
    annotation: Через розподілений характер інформації аудиту спільний обмін може бути важливим для ефективного
      аналізу аудиту. Наприклад, записи аудиту однієї організації можуть не надати достатньої інформації для визначення
      належного або неналежного використання ресурсів особами інших організацій. У деяких випадках лише «домашні»
      організації мають відповідні дані для ухвалення таких рішень.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:au-16.3
    ref_id: AU-16(3)
    name: Міжорганізаційний аудит — Розмежування
    category: process
    csf_function: protect
    description: 'Запровадити [Призначення: заходи, визначені організацією], щоб розмежувати людей від інформації
      аудиту, що передається в межах організації.


      Параметри:

      1. Призначення: заходи, визначені організацією'
    annotation: Збереження ідентичності в журналах аудиту може мати наслідки для конфіденційності, наприклад, створювати
      умови щодо відстеження та створення профілю осіб, які не є необов’язковими з операційної точки зору. Ці ризики
      можуть бути ще більше посилені при передачі інформації в межах організації. Впровадження криптографічних методів,
      що підвищують конфіденційність, може розмежувати людей від інформації аудиту, зменшити ризики конфіденційності
      та зберегти підзвітність.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ca-1
    ref_id: CA-1
    name: Політика і процедури оцінювання, акредитації та моніторингу
    category: policy
    csf_function: govern
    description: 'a. Розробити, задокументувати та поширити серед [Призначення: визначеного організацією персоналу
      або посад]:


      1. [Вибір (один або декілька): Рівень організації; Рівень місії/бізнес-процесу; рівень системи] політика оцінювання,
      авторизації та моніторингу, яка:


      (a) містить мету, сферу застосування, ролі, обов''язки, відповідальність керівництва, координацію між організаційними
      підрозділами та систему контролю відповідності (complaince);


      (b) відповідає чинним законам, нормативним документам, наказам, положенням, політиці, стандартам і керівним
      принципам.


      2. Процедури, що сприяють реалізації політики оцінювання, авторизації та моніторингу безпеки та приватності,
      а також пов''язаних з ними заходів оцінювання, авторизації та моніторингу безпеки та приватності.


      b. Призначити [Призначення: посадова особа, визначена організацією] для управління розробкою, документуванням
      і розповсюдженням політики та процедур оцінювання, авторизації та моніторингу;


      c. Переглядати та оновлювати поточне оцінювання, авторизацію та моніторинг:


      1. Політику [Призначення: частота, визначена організацією] та наступне [Призначення: події, визначені організацією];


      2. Процедури [Призначення: частота, визначена організацією] та наступні [Призначення: події, визначені організацією].


      Параметри:

      1. Призначення: визначеного організацією персоналу або посад

      2. Вибір (один або декілька): Рівень організації; Рівень місії/бізнес-процесу; рівень системи

      3. Призначення: посадова особа, визначена організацією

      4. Призначення: частота, визначена організацією

      5. Призначення: події, визначені організацією'
    annotation: Цей захід захисту стосується встановлення політики та процедур для ефективного здійснення заходів
      і їхніх посилень у класі CA. Стратегія управління ризиками є важливим фактором у встановленні політики та
      процедур. Комплексна політика та процедури допомагають забезпечити безпеку та приватність. За наявності політики,
      а також планів захисту інформації та персональних даних на рівні організації, конкретні системні політики
      та процедури можуть бути не потрібні. Політика може бути внесена до складу загальної політики безпеки та приватності
      або може бути представлена кількома політиками (у випадках складної архітектури). Процедури описують, як має
      реалізуватися політика чи заходи захисту та як вони можуть бути спрямовані на персонал або роль, яка є об'єктом
      процедури. Процедури можуть бути задокументовані в планах захисту інформації та персональних даних (як один
      або декілька документів). Події, які можуть спричинити оновлення політики та процедур оцінки, авторизації
      та моніторингу, включають висновки оцінювання чи аудиту, інциденти чи порушення безпеки або зміни у чинних
      законах, розпорядженнях, директивах, постановах, політиках, стандартах і вказівках. Просте повторне встановлення
      засобів контролю не є організаційною політикою чи процедурою
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ca-2
    ref_id: CA-2
    name: Оцінювання
    category: process
    csf_function: identify
    description: 'a. Виберіть відповідного оцінювача або команду з оцінки для типу оцінювання, яке буде проводитися;


      b. Розробіть план контрольної оцінки, який описує обсяг оцінки, в тому числі:


      1. заходи захисту та посилені заходи, що підлягають оцінюванню;


      2. процедури оцінювання, які використовуватимуться для визначення ефективності заходів;


      3. середовище оцінювання, групу оцінювання, ролі й обов''язки з оцінювання.


      c. Забезпечити розгляд і затвердження плану оцінювання уповноваженою офіційною особою або призначеним для
      проведення оцінювання представником;


      d. Оцінити заходи захисту в системі та в її середовищі функціонування з [Призначення: визначеною організацією
      частотою] для визначення, наскільки коректно реалізовані заходи безпеки і чи працюють вони за призначенням
      і дають бажаний результат щодо дотримання встановлених вимог безпеки та приватності;


      e. Підготувати звіт оцінювання безпеки, який документує результати оцінювання;


      f. Надати результати оцінювання з безпеки [Призначення: особам або ролям, визначеним організацією].


      Параметри:

      1. Призначення: визначеною організацією частотою

      2. Призначення: особам або ролям, визначеним організацією'
    annotation: 'Оцінювачі гарантовано мають володіти необхідними навичками та технічними знаннями для розробки
      результативних планів оцінювання та проведення оцінювання системно-специфічних, гібридних, загальних і програмних
      заходів контролю, якщо це необхідно. Необхідні навички включають загальні знання концепцій і підходів до управління
      ризиками, а також комплексні знання та досвід роботи з апаратним і програмним забезпеченням та системними
      компонентами вбудованого програмного забезпечення. Організації оцінюють заходи захисту в системах і середовищах,
      у яких ці системи працюють, як частину початкових і поточних авторизацій, безперервного моніторингу, щорічних
      оцінок FISMA, проектування та розробку системи, розробку системи безпеки, розробку приватності та життєвого
      циклу системи. Оцінювання допомагає переконатися, що впроваджені заходи захисту відповідають вимогам інформаційної
      безпеки та приватності, виявляють слабкі місця та недоліки у проектуванні системи, надають важливу інформацію,
      необхідну для прийняття рішень, заснованих на ризиках в рамках процесів авторизації та мають процедури для
      пом''якшення вразливості. Оцінювання щодо впроваджених заходів відбувається відповідно до планів захисту інформації
      та персональних даних. Оцінювання також може проводитися протягом життєвого циклу системи як частина процесів
      системної інженерії та розробки системної безпеки. Спроектовані засоби захисту можна оцінити під час розробки
      запитів на пропозиції, оцінки відповідей та проведення аналізу такого проектування. Якщо план впровадження
      заходів захисту та подальше впровадження відповідно до проекту оцінюється під час розробки, остаточне контрольне
      тестування може бути простим підтвердженням із використанням попередньо завершеної контрольної оцінки та всіх
      результатів. Організації можуть розробити єдиний зведений план оцінювання безпеки та приватності для системи
      або окремі плани. Зведений план оцінювання чітко розмежовує ролі та відповідальність за контрольне оцінювання.
      Якщо в оцінці системи беруть участь кілька організацій, скоординований підхід може зменшити надмірність і
      пов''язані з цим витрати. Організації можуть використовувати інші види заходів з оцінювання, такі як сканування
      вразливостей і моніторинг системи для підтримки безпеки та приватності протягом усього життєвого циклу. Звіти
      про оцінювання документуються достатньо детально, для того щоб можна було визначити: точність, повноту звітів
      і нехибність того, що контролювання виконано правильно, у відповідності до призначення; створити бажаний результат
      щодо дотримання вимог. Результати оцінювання надаються посадовим особам або ролям, відповідальним за сегменти,
      які проходили оцінювання. У ході щорічного оцінювання організації можуть використовувати такі джерела: початкові
      або поточні результати акредитації системи, результати поточного моніторингу тощо. Організації забезпечують,
      щоб результати оцінювання були актуальними та отриманими з відповідним рівнем незалежності. Наявні результати
      контрольного оцінювання можуть бути використані повторно, якщо це потрібно. Частота проведення оцінювання
      встановлюється відповідно до стратегій моніторингу безпеки організації. Зовнішній аудит включно з аудитом
      зовнішніх організацій, таких як регулювальні органи, не входить у сферу цього заходу.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ca-2.1
    ref_id: CA-2(1)
    name: Оцінювання — Незалежні експерти
    category: process
    csf_function: identify
    description: Залучати незалежних експертів або групи з оцінювання для проведення оцінювання безпеки та приватності.
    annotation: 'Незалежні експерти або групи з оцінювання — це особи або групи, які проводять неупереджене оцінювання
      систем. Неупередженість передбачає, що експерти не мають жодних інтересів до розробки, експлуатації, підтримки
      чи управління системами, що оцінюються. Для досягнення неупередженості експерти: не повинні мати взаємного
      чи конфліктного інтересу з організаціями, де проводяться оцінювання; не можуть оцінювати власну роботу; не
      можуть виконувати функції керівників або службовців організацій, у яких проводиться оцінювання. Уповноважені
      посадові особи визначають необхідний рівень незалежності на основі категорій безпеки систем та/або ризику
      для операцій організації, активів або осіб.

      Уповноважені особи визначають необхідний рівень незалежності на основі категорій безпеки систем та/або ризику
      для операцій організації, активів або осіб та рівень незалежності оцінювача для впевненості у тому, що результати
      є надійними та їх можна використовувати для ухвалення достовірних рішень. Визначення незалежності оцінювача
      включає в себе те, чи мають послуги з оцінки за контрактом достатню незалежність, наприклад, коли власники
      системи не беруть безпосередньої участі в процесах укладання контрактів або не можуть вплинути на неупередженість
      оцінювачів, які проводять оцінювання. На етапі проектування та розробки системи наявність незалежних оцінювачів
      аналогічна наявності незалежних малих і середніх підприємств, залучених до перевірки такого проектування.
      Якщо організації, які володіють системами, невеликі або структури організацій вимагають, щоб оцінювання проводили
      особи, які перебувають у ланцюжку розробки, експлуатації чи управління власниками системи, незалежності в
      процесах оцінювання можна досягти, забезпечивши ретельний аналіз результатів оцінювання, перевіривши та проаналізувавши
      їх незалежними групами експертів для підтвердження повноти, точності, цілісності та надійності.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ca-2.2
    ref_id: CA-2(2)
    name: Оцінювання — Спеціалізовані оцінки
    category: process
    csf_function: identify
    description: 'Ввести як частину оцінювання заходів безпеки та приватності, [Призначення: з визначеною організацією
      частотою], [Вибір: з попередженням; без попередження], [Вибір (один або кілька): поглиблений моніторинг; сканування
      уразливостей; тестування на шкідливих користувачів; оцінювання внутрішньої загрози; тестування продуктивності
      та навантаження; [Призначення: організаційно визначені інші форми оцінювання]].


      Параметри:

      1. Призначення: з визначеною організацією частотою

      2. Вибір: з попередженням; без попередження

      3. Вибір (один або кілька): поглиблений моніторинг; сканування уразливостей; тестування на шкідливих користувачів;
      оцінювання внутрішньої загрози; тестування продуктивності та навантаження; [Призначення: організаційно визначені
      інші форми оцінювання]'
    annotation: 'Організації можуть проводити спеціалізовані оцінювання включно з: перевіркою підтвердження інсайдерської
      загрози, тестуванням «зловмисних» користувачів, моніторингом системи та іншими формами тестування. Такі оцінювання
      можуть поліпшити готовність системи безпеки та приватності, визначити поточний рівень ефективності таких систем.
      Організації проводять такі типи спеціалізованих оцінювань відповідно до чинного законодавства, наказів, директив,
      політик, положень, стандартів і вказівок. Уповноважені посадові особи затверджують методи оцінювання згідно
      з виконавчою функцією щодо організаційного ризику. Організації можуть у процесах усунення вразливості враховувати
      виявлені під час оцінювань вразливості.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ca-2.3
    ref_id: CA-2(3)
    name: Оцінювання — Зовнішні організації
    category: process
    csf_function: identify
    description: 'Використовуйте результати контрольного оцінювання, які виконує [Призначення: зовнішня організація,
      визначена організацією] на [Призначення: система, визначена організацією], коли оцінювання відповідає [Завдання:
      вимоги, визначені організацією].


      Параметри:

      1. Призначення: зовнішня організація, визначена організацією

      2. Призначення: система, визначена організацією

      3. Завдання: вимоги, визначені організацією'
    annotation: 'Організації можуть покладатися на оцінювання безпеки та приватності систем організації, що визначені
      іншими (зовнішніми) організаціями. Використання таких оцінювань і повторне використання наявних результатів
      оцінювання може значно скоротити час і ресурси, необхідні для проведення оцінювань. Фактори, які враховують
      організації при визначенні того, чи приймати результати оцінювання від зовнішніх організацій, можуть містити:
      минулий досвід; репутацію організації, що проводить оцінювання; рівень деталізації наданих оцінок тощо. Акредитовані
      випробувальні лабораторії, які підтримують Програму загальних критеріїв [ISO 15408-1], Програму перевірки
      криптографічного модуля NIST (CMVP) або Програму перевірки криптографічного алгоритму NIST (CAVP), можуть
      надавати результати незалежного оцінювання, які організації можуть використовувати.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ca-3
    ref_id: CA-3
    name: Взаємодія систем
    category: process
    csf_function: identify
    description: 'a. схвалити та керувати обміном інформацією між системою та іншими системами за допомогою [Вибір
      (один або кілька): угоди безпеки взаємозв''язку; договори безпеки обміну інформацією; меморандуми про взаєморозуміння;
      угоди про рівень обслуговування; угоди користувача; угоди про нерозголошення; [Доручення: тип договору, визначений
      організацією]];.


      b. документувати, як частину угоди про обмін, характеристики інтерфейсу, вимоги до безпеки та приватності,
      засоби контролю та відповідальність для кожної системи, а також характер переданої інформації;


      c. здійснювати перегляд та оновлення угод з [Призначення: визначеною організацією частотою].


      Параметри:

      1. Вибір (один або кілька): угоди безпеки взаємозв''язку; договори безпеки обміну інформацією; меморандуми
      про взаєморозуміння; угоди про рівень обслуговування; угоди користувача; угоди про нерозголошення; [Доручення:
      тип договору, визначений організацією]

      2. Призначення: визначеною організацією частотою'
    annotation: 'Цей захід захисту застосовується до виділених з''єднань між двома або більше окремими системами.
      Обмін системною інформацією включає підключення через орендовані лінії або віртуальні приватні мережі, підключення
      до постачальників послуг Інтернету, спільне використання бази даних або обмін інформацією про транзакції баз
      даних, підключення та обмін із хмарними службами, обмін через вебслужби або обмін файлами через протоколи
      передачі файлів, мережевих протоколів (наприклад, IPv4, IPv6), електронної пошти чи іншого типу зв''язку між
      організаціями. Організації враховують ризики, пов''язані з новими або посиленими загрозами, які можуть виникнути,
      коли відбувається обмін інформацією з іншими системами, які можуть мати інші вимоги до безпеки та приватності
      та елементи керування. Сюди входять системи в межах однієї організації та зовнішні по відношенню до організації
      системи. Спільна авторизація систем, які обмінюються інформацією, як описано в CA-6(1) або CA-6(2), може допомогти
      налагодити зв''язок і зменшити ризики. Уповноважені посадові особи визначають ризик, пов''язаний з обміном
      системною інформацією, і засоби контролю, необхідні для належного зменшення ризику. Вибрані типи угод базуються
      на таких факторах, як рівень впливу інформації, якою обмінюються, відносини між організаціями, які обмінюються
      інформацією (наприклад, уряд — уряд, уряд — бізнес, бізнес — бізнес, уряд або бізнес — постачальник послуг,
      уряд або бізнес для окремої особи), або рівень доступу до системи користувачам іншої системи. Якщо системи,
      які обмінюються інформацією, мають одну і ту саму посадову особу, організаціям не потрібно укладати угоди.


      Натомість характеристики інтерфейсу між системами (наприклад, як відбувається обмін інформацією, як інформація
      захищена) описані у відповідних планах безпеки та приватності. Якщо системи, які обмінюються інформацією,
      мають різних уповноважених осіб в одній організації, організації можуть розробити угоди або надати однакову
      інформацію у відповідному типі угоди CA-3a та у відповідних планах безпеки та приватності для систем. Організації
      можуть включати інформацію про угоди в офіційні контракти, особливо для обміну інформацією між федеральними
      агентствами та нефедеральними організаціями (включно з постачальниками послуг, підрядниками, розробниками
      систем і системними інтеграторами). У рамках оцінювання ризику, організації мають розглядати системи, які
      спільно використовують одні й ті самі мережі.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ca-3.1
