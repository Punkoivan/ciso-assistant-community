      дії, яка може призвести до значних збитків. Параметри конструкції для такого механізму можуть вимагати одночасних дій
      (наприклад, вистріл з ядерної зброї вимагає, щоб дві різні уповноважені особи віддали правильну команду протягом невеликого
      часового вікна) або послідовності операцій, де кожна послідовна дія забезпечується деякими попередніми, але жодна особа
      не може виконати більше однієї дії.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:sa-8.16
