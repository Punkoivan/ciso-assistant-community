      стійкості до корозії. Система за замовчуванням є надійною, і будь-яке з’єднання із зовнішнім об’єктом використовується
      для доповнення її функцій. Якщо системі необхідно підтримувати зв’язок із іншим зовнішнім об’єктом, щоб підтримувати свою
      надійність, тоді ця система буде вразливою до зловмисних і незловмисних загроз, які можуть призвести до втрати або погіршення
      цього з’єднання. Перевага принципу самостійної надійності полягає в тому, що ізоляція системи зробить її менш вразливою
      для атак. Наслідком цього принципу є здатність системи (або системного компонента) працювати ізольовано, а потім повторно
      синхронізуватися з іншими компонентами, коли знову потрібне з’єднання з ними.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:sa-8.17
    ref_id: SA-8(17)
    name: Безпека та приватність принципів інжинірингу — Безпечно розподілена композиція
    category: technical
    csf_function: protect
    description: 'Запровадити принцип безпечно розподіленої композиції в [Призначення: визначені організацією системи або системні
      компоненти].
  
  
  
      Параметри:
  
  
      1. Призначення: визначені організацією системи або системні компоненти'
    annotation: Принцип безпечно розподіленої композиції стверджує, що композиція розподілених компонентів, які застосовують
      однакову політику безпеки системи, призводить до системи, яка забезпечує виконання цієї політики принаймні так само добре,
      як і окремі компоненти. Багато принципів проектування безпеки систем стосуються того, як компоненти можуть або повинні
      взаємодіяти. Необхідність створити або включити можливість із складу розподілених компонентів може збільшити релевантність
      цих принципів. Зокрема, переміщення політики безпеки з автономної на розподілену систему або систему системної інженерії
      може мати несподівані або миттєві результати. Комунікаційні протоколи та механізми узгодженості розподілених даних допомагають
      забезпечити узгоджене застосування політики в розподіленій системі. Щоб забезпечити загальносистемний рівень гарантії
      правильного застосування політики, архітектура безпеки розподіленої складеної системи ретельно аналізується.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:sa-8.18
    ref_id: SA-8(18)
    name: Безпека та приватність принципів інжинірингу — Довірені канали комунікації
    category: technical
    csf_function: protect
    description: 'Проектування довірених каналів зв’язку в [Призначення: визначені організацією системи або компоненти системи].
  
  
  
      Параметри:
  
  
      1. Призначення: визначені організацією системи або компоненти системи'
    annotation: Довірені канали зв’язку проектуються там, де існує потенційна загроза для зв’язку між компонентами (тобто взаємозв’язків
      між компонентами), кожен канал зв’язку є надійним до рівня, який відповідає залежностям безпеки, які він підтримує (тобто
      як інші компоненти довіряють йому виконувати свої функції безпеки). Довірені канали зв’язку досягаються шляхом поєднання
      обмеження доступу до каналу зв’язку (щоб забезпечити прийнятну відповідність надійності кінцевих точок, залучених у зв’язок)
      і застосування наскрізного захисту для даних, що передаються через канал зв’язку (для захисту від перехоплення та модифікації
      та ще більше підвищити гарантію належного наскрізного зв’язку).
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:sa-8.19
    ref_id: SA-8(19)
    name: Безпека та приватність принципів інжинірингу — Постійний захист
    category: technical
    csf_function: protect
    description: 'Запровадити принцип безперервного захисту в [Призначення: визначені організацією системи або компоненти системи].
  
  
  
      Параметри:
  
  
      1. Призначення: визначені організацією системи або компоненти системи'
    annotation: Принцип постійного захисту стверджує, що компоненти та дані, які використовуються для забезпечення виконання
      політики безпеки, мають безперервний захист, який узгоджується з політикою безпеки та архітектурою безпеки. Жодних гарантій
      того, що система може забезпечити захист конфіденційності, цілісності, доступності та конфіденційності для своїх проектних
      можливостей, неможливо зробити, якщо є прогалини в захисті. Такі гарантії щодо здатності забезпечити надані можливості
      вимагають постійного захисту даних та інформації. Тобто не може бути періодів, протягом яких дані та інформація залишаються
      незахищеними під час керування системою (тобто під час створення, зберігання, обробки чи передачі даних та інформації,
      а також під час ініціалізації, виконання, збою системи, переривання та вимкнення). Безперервний захист вимагає дотримання
      принципів концепції еталонного монітора (тобто кожен запит перевіряється еталонним монітором; еталонний монітор здатний
      захистити себе від несанкціонованого втручання; і достатню впевненість у правильності та повноті механізму можна отримати
      за допомогою аналізу та тестування) та принципу безпечного збою та відновлення (тобто збереження безпечного стану під
      час помилки, несправності, відмови та успішної атаки; збереження безпечного стану під час відновлення до нормального,
      погіршеного або альтернативного режиму роботи). Безперервний захист також поширюється на системи, призначені для роботи
      в різних конфігураціях, включаючи ті, які забезпечують повну робочу здатність, і конфігурації в погіршеному режимі, які
      забезпечують часткову робочу здатність. Принцип безперервного захисту вимагає, щоб зміни в політиках безпеки системи можна
      було простежити до операційної потреби, яка керує конфігурацією, і щоб їх можна було перевірити (тобто можна перевірити,
      що запропоновані зміни не переведуть систему в небезпечний стан). Недостатня відстежуваність і перевірка можуть призвести
      до непослідовних станів або розривів захисту через складні проблеми, які не можна виправити. Використання попередньо перевірених
      визначень конфігурації, які відображають нову політику безпеки, дає змогу аналізу визначити, що перехід від старої політики
      до нової є по суті атомарним і що будь-які залишкові ефекти від старої політики гарантовано не суперечать новій політиці.
      Здатність демонструвати постійний захист ґрунтується на чіткому формулюванні потреб у захисті життєвого циклу як вимог
      безпеки зацікавлених сторін.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:sa-8.20
    ref_id: SA-8(20)
    name: Безпека та приватність принципів інжинірингу — Безпечне керування метаданими
    category: technical
    csf_function: protect
    description: 'Запровадити принцип безпечного керування метаданими в [Призначення: визначені організацією системи або компоненти
      системи].
  
  
  
      Параметри:
  
  
      1. Призначення: визначені організацією системи або компоненти системи'
    annotation: Принцип безпечного керування метаданими стверджує, що метадані є об’єктами «першого класу» для політики безпеки,
      коли політика вимагає повного захисту інформації або самозахисту підсистеми безпеки. Принцип безпечного керування метаданими
      ґрунтується на визнанні того, що система, підсистема чи компонент не можуть досягти самозахисту, якщо вони не захищають
      дані, на які вони покладаються для правильного виконання. Дані зазвичай не інтерпретуються системою, яка їх зберігає.
      Вони можуть мати семантичне значення (тобто містити інформацію) для користувачів і програм, які обробляють дані. І навпаки,
      метадані — це інформація про дані, наприклад ім’я файлу або дата створення файлу. Метадані прив’язані до цільових даних,
      які вони описують у спосіб, який система може інтерпретувати, але їх не потрібно зберігати всередині цільових даних або
      близько до них. Можуть існувати метадані, метою яких є самі метадані (наприклад, рівень класифікації або рівень впливу
      назви файлу), включаючи метадані з самопосиланням. Очевидна вторинність метаданих може призвести до нехтування їх законною
      потребою в захисті, що призведе до порушення політики безпеки, включаючи викрадання інформації. Особливе важливо звернути
      увагу на захист метаданих, пов’язаних з системами багаторівневої безпеки (MLS). Системи MLS забезпечують доступ суб'єкта
      до об'єкта на основі відносних рівнів чутливості. Звідси випливає, що всі суб’єкти та об’єкти, що знаходяться в зоні контролю
      системи MLS, або прямо позначені, або опосередковано приписуються рівнями чутливості. Наслідком мічених метаданих для
      систем MLS є те, що об’єкти, що містять метадані, маркуються. Як і під час оцінювання потреб захисту даних, увага приділяється
      тому, щоб захист конфіденційності та цілісності оцінювався окремо, уточнювався та розподілявся для метаданих, як це було
      б зроблено для даних місії, бізнесу та системи.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:sa-8.21
    ref_id: SA-8(21)
    name: Безпека та приватність принципів інжинірингу — Самоаналіз
    category: technical
    csf_function: protect
    description: 'Запровадити принцип самоаналізу безпеки в [Завдання: визначені організацією системи або компоненти системи].
  
  
  
      Параметри:
  
  
      1. Завдання: визначені організацією системи або компоненти системи'
    annotation: Принцип самоаналізу стверджує, що компонент системи здатний оцінювати свій внутрішній стан і функціональність
      в обмеженій мірі на різних етапах виконання, і що ця здатність до самоаналізу є пропорційною рівню надійності, закладеному
      в систему. На системному рівні самоаналіз може бути досягнутий за допомогою ієрархічних оцінок надійності, створених за
      принципом «знизу вгору». У цьому підході компоненти нижчого рівня перевіряють цілісність даних і правильну функціональність
      (в обмеженій мірі) компонентів вищого рівня. Наприклад, довірені послідовності завантаження включають довірений компонент
      нижчого рівня, який засвідчує надійність наступних компонентів вищого рівня, щоб можна було встановити перехідний ланцюг
      довіри. У корені компонент засвідчує сам себе, що зазвичай передбачає аксіоматичне або нав’язане середовищем припущення
      щодо його цілісності. Результати самоаналізу можна використовувати для захисту від зовнішніх помилок, внутрішньої несправності
      або тимчасових помилок. Дотримуючись цього принципу, деякі прості несправності або помилки можна виявити, не дозволяючи
      наслідкам помилки або несправності поширюватися за межі компонента. Крім того, самопаналіз можна використовувати для підтвердження
      конфігурації компонента, виявлення будь-яких потенційних конфліктів у цій конфігурації.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:sa-8.22
    ref_id: SA-8(22)
    name: Безпека та приватність принципів інжинірингу — Звітність і відстежуваність
    category: technical
    csf_function: protect
    description: 'Запровадження принципу звітності та відстеження безпеки в [Призначення: визначені організацією системи або
      компоненти системи].
  
  
  
      Параметри:
  
  
      1. Призначення: визначені організацією системи або компоненти системи'
    annotation: Принцип звітності та відстежуваності стверджує, що можна відстежити дії, пов’язані з безпекою (тобто, суб’єктно-об’єктні
      взаємодії) до суб’єкта, від імені якого виконуються дії. Принцип звітності та відстеження вимагає надійної інфраструктури,
      яка може записувати деталі про дії, що впливають на безпеку системи (наприклад, підсистема аудиту). Щоб записати деталі
      про дії, система здатна однозначно ідентифікувати суб’єкт, від імені якого виконується дія, а також записати відповідну
      послідовність дій, які виконуються. Політика звітності також вимагає, щоб сам контрольний журнал був захищений від несанкціонованого
      доступу та модифікації. Принцип найменших привілеїв допомагає відстежувати дії до конкретних суб’єктів, оскільки він збільшує
      деталізацію звітності. Пов’язування певних дій із системними об’єктами та, зрештою, користувачами, а також захист контрольного
      журналу від несанкціонованого доступу та модифікацій забезпечує неспростовність, оскільки після запису дії неможливо змінити
      контрольний слід. Інша важлива функція, яку виконує звітність і відстеження, полягає в рутинному та криміналістичному
      аналізі подій, пов’язаних із порушенням політики безпеки. Аналіз журналів аудиту може надати додаткову інформацію, корисну
      для визначення шляху або компонента, який дозволив порушити політику безпеки, і дії осіб, пов’язані з порушенням політики
      безпеки.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:sa-8.23
    ref_id: SA-8(23)
    name: Безпека та приватність принципів інжинірингу — Безпечні параметри за замовчуванням
    category: technical
    csf_function: protect
    description: 'Реалізація принципу безпеки за замовчуванням у [Призначення: визначені організацією системи або компоненти
      системи].
  
  
  
      Параметри:
  
  
      1. Призначення: визначені організацією системи або компоненти системи'
    annotation: 'Принцип безпечних параметрів за замовчуванням
  
  
      стверджує, що стандартна конфігурація системи (включаючи її складові підсистеми, компоненти та механізми) відображає обмежувальне
      та консервативне застосування політики безпеки. Принцип безпечних параметрів за замовчуванням застосовується до початкової
      (тобто типової) конфігурації системи, а також до проектування безпеки та контролю доступу та інших функцій безпеки, які
      дотримуються стратегії «заборонити, якщо не авторизовано явно». Аспект початкової конфігурації цього принципу вимагає,
      щоб будь-яка конфігурація системи, підсистеми або системного компонента «як постачалася» не сприяла порушенню політики
      безпеки та не могла перешкоджати роботі системи в конфігурації за замовчуванням у тих випадках, коли сама політика безпеки
      вимагає налаштування користувача. Обмежувальні параметри за замовчуванням означають, що система працюватиме «як при постачанні»
      з відповідним самозахистом і матиме змогу запобігти порушенням безпеки до встановлення запланованої політики безпеки та
      конфігурації системи. У випадках, коли захист, який забезпечується продуктом «як доставлено», є неадекватним, зацікавлені
      сторони оцінюють ризик його використання до встановлення безпечного початкового стану. Дотримання принципу безпеки за
      замовчуванням гарантує, що система буде встановлена в безпечному стані після успішного завершення ініціалізації. У ситуаціях,
      коли системі не вдається завершити ініціалізацію, вона або виконає необхідну операцію, використовуючи безпечні параметри
      за замовчуванням, або не виконає операцію. Зверніться до принципів безперервного захисту, безпечної відмови та відновлення,
      які паралельні цьому принципу, щоб забезпечити можливість виявлення та відновлення після відмови. Інженерний підхід до
      безпеки цього принципу стверджує, що механізми безпеки відхиляють запити, якщо запит не визнано правильно сформованим
      і сумісним з політикою безпеки. Небезпечна альтернатива — дозволити запит, якщо не буде показано, що він не відповідає
      політиці. У великій системі умови, які задовольняються для надання запиту, який відхилено за замовчуванням, часто набагато
      компактніші та повніші, ніж ті, які потрібно було б перевірити, щоб відхилити запит, який надається за замовчуванням.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:sa-8.24
    ref_id: SA-8(24)
    name: Безпека та приватність принципів інжинірингу — Збої безпеки і відновлення
    category: technical
    csf_function: protect
    description: 'Реалізуйте принцип проектування безпечного збою та відновлення в [Призначення: визначені організацією системи
      або компоненти системи].
  
  
  
      Параметри:
  
  
      1. Призначення: визначені організацією системи або компоненти системи'
    annotation: Принцип безпечного збою та відновлення полягає у тому, що збій системної функції чи механізму, чи будь-яка дія
      відновлення у відповідь на збій не призведе до порушення політики безпеки. Принцип безпечного збою та відновлення паралельний
      принципу безперервного захисту для гарантування, що система здатна виявляти (в певних межах) фактичну та загрозливу несправність
      на будь-якому етапі її роботи (тобто ініціалізація, нормальна робота, завершення роботи та технічне обслуговування) та
      вживати відповідних заходів, для гарантування збереження політики безпеки. Крім того, якщо система спроектована так, що
      здатна відновлюватися після загроз або збоїв для відновлення звичайних, знижених або альтернативних безпечних операцій
      та забезпечує підтримання безпечного стану без порушень політики безпеки. Збій – це стан, за якого поведінка компонента
      відхиляється від заданої або очікуваної поведінки для явно задокументованого вхідного сигналу. Після виявлення збою функції
      безпеки, система може змінити налаштування так, щоб обійти несправний компонент, зберігаючи безпеку та забезпечуючи всі
      або частину функціональних можливостей вихідної системи чи повністю вимкнутися для запобігання порушенням політики безпеки.
      Для цього, функції реконфігурації системи розробляються для забезпечення безперервного виконання політики безпеки на різних
      етапах функціонування. Інший метод, який можна використати для відновлення після збоїв, полягає у виконанні відкату до
      безпечного стану (який може бути початковим станом), а потім або завершення роботи, або заміни служби чи компонента, які
      вийшли з ладу, для відновлення безпечних операцій. Відмова компонента може бути виявлена або не виявлена компонентами,
      які його використовують. Принцип безпечного збою вказує на те, що компоненти виходять з ладу в стані, який забороняє,
      а не надає доступ. Наприклад, номінально «атомарна» операція, перервана до завершення, не порушує політику безпеки та
      призначена для обробки подій переривання за допомогою використання атомарності вищого рівня та механізмів відкату (наприклад,
      транзакцій). Якщо послуга використовується, її властивості атомарності добре задокументовані та охарактеризовані, щоб
      компонент, який користується цією послугою, міг належним чином виявляти та обробляти події переривання. Наприклад, система
      розроблена так, щоб реагувати на відключення та підтримувати повторну синхронізацію та узгодженість даних після відключення.
      Стратегії захисту від збоїв, які використовують реплікацію механізмів застосування політики (глибокий захист), можуть
      дозволити системі продовжувати працювати в безпечному стані, навіть якщо один механізм не зміг захистити систему. Проте,
      якщо механізми подібні, додатковий захист може бути ілюзорним, оскільки супротивник може просто атакувати серією. Таким
      чином у мережевій системі порушення безпеки в одній системі чи службі може дозволити зловмиснику зробити те ж саме в інших
      подібних реплікованих системах і службах. Застосовуючи кілька механізмів захисту, характеристики яких значно відрізняються,
      можна зменшити ймовірність копіювання чи повторення атак. Проводять аналіз для розуміння витрат та переваг таких методів
      резервування напротивагу збільшення використання ресурсів і негативного впливу на загальну продуктивність системи. Додатковий
      аналіз проводять, коли складність цих механізмів зростає, як у випадку динамічної поведінки. Підвищена складність зазвичай
      знижує надійність. Якщо ресурс неможливо постійно захищати, дуже важливо виявити та усунути будь-які порушення безпеки,
      перш ніж ресурс знову буде використаний у безпечному контексті.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:sa-8.25
    ref_id: SA-8(25)
    name: Безпека та приватність принципів інжинірингу — Економічна безпека
    category: technical
    csf_function: protect
    description: 'Впровадити принцип проектування економічної безпеки в [Завдання: визначені організацією системи або компоненти
      системи].
  
  
  
      Параметри:
  
  
      1. Завдання: визначені організацією системи або компоненти системи'
    annotation: Принцип економічної безпеки стверджує, що механізми безпеки не коштують дорожче, ніж потенційна шкода, яка може
      виникнути внаслідок порушення безпеки. Це важлива для безпеки форма аналізу витрат і вигод, яка використовується в управлінні
      ризиками. Припущення щодо вартості аналізу витрат і вигод заважають розробнику системи включати механізми безпеки більшої
      міцності, ніж необхідно, де міцність механізму пропорційна вартості. Принцип економічної безпеки також вимагає аналізу
      переваг гарантій відносно вартості такої гарантії з точки зору зусиль, витрачених на отримання відповідних і достовірних
      доказів, а також необхідного аналізу для оцінки та отримання висновків щодо надійності та ризику на основі доказів.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:sa-8.26
    ref_id: SA-8(26)
    name: Безпека та приватність принципів інжинірингу — Безпека продуктивності
    category: technical
    csf_function: protect
    description: 'Запровадити принцип безпеки продуктивності в [Призначення: визначені організацією системи або компоненти системи].
  
  
  
      Параметри:
  
  
      1. Призначення: визначені організацією системи або компоненти системи'
    annotation: Принцип безпеки продуктивності стверджує, що механізми безпеки побудовані таким чином, щоб вони не погіршували
      продуктивність системи без потреби. Вимоги зацікавлених сторін і проектування продуктивності та безпеки в системі точно
      сформульовані та визначені пріоритетними. Щоб реалізація системи відповідала вимогам проектування та була визнана прийнятною
      для зацікавлених сторін (тобто перевірка на відповідність вимогам зацікавлених сторін), розробники дотримуються визначених
      обмежень, у тому, що можливості продуктивності потребують певних можливостей захисту. Загальний вплив служб безпеки, що
      потребують інтенсивних обчислень (наприклад, криптографії), оцінено та продемонстровано, що вони не мають значного впливу
      на питання продуктивності з вищим пріоритетом або вважаються такими, що забезпечують прийнятний компроміс продуктивності
      для надійного захисту. Компенсаційні механізми включають служби безпеки, які вимагають менше обчислювальних потужностей,
      якщо вони недоступні або недостатні. Недостатність служби безпеки визначається функціональними можливостями та міцністю
      механізму. Міцність механізму вибирається з огляду на вимоги безпеки та критичні для продуктивності накладні витрати (наприклад,
      керування криптографічним ключем) і оцінку можливостей загрози. Принцип безпеки продуктивності веде до включення функцій,
      які допомагають у застосуванні політики безпеки, але спричиняють мінімальні накладні витрати, наприклад апаратні механізми
      низького рівня, на основі яких можна створювати служби вищого рівня. Такі низькорівневі механізми зазвичай дуже специфічні,
      мають дуже обмежену функціональність і оптимізовані для продуктивності. Наприклад, коли права доступу до частини пам’яті
      надано, багато систем використовують апаратні механізми, щоб гарантувати, що подальший доступ включатиме правильну адресу
      пам’яті та буде здійснений у правильний спосіб. Застосування цього принципу підсилює необхідність проектування в системі
      безпеки з нуля та включення простих механізмів на нижніх рівнях, які можна використовувати як будівельні блоки для механізмів
      вищого рівня.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:sa-8.27
    ref_id: SA-8(27)
    name: Безпека та приватність принципів інжинірингу — Людський фактор безпеки
    category: technical
    csf_function: protect
    description: 'Запровадити принцип безпеки людського фактору в [Завдання: визначені організацією системи або компоненти системи].
  
  
  
      Параметри:
  
  
      1. Завдання: визначені організацією системи або компоненти системи'
    annotation: Принцип безпеки, заснованої на людському факторі, передбачає, що інтерфейс користувача для функцій безпеки та
      допоміжних служб є інтуїтивно зрозумілим, зручним і забезпечує зворотній зв’язок щодо дій користувача, які впливають на
      таку політику та її застосування. Механізми, які забезпечують дотримання політики безпеки, не є нав’язливими для користувача
      та розроблені таким чином, щоб не знижувати його ефективність. Механізми застосування політики безпеки також надають користувачеві
      значущий, чіткий і відповідний відгук і попередження, коли приймаються небезпечні рішення. Особлива увага приділяється
      інтерфейсам, за допомогою яких персонал, відповідальний за адміністрування та роботу системи, налаштовує конфігурацію
      та політики безпеки. В ідеалі такий персонал здатний зрозуміти вплив свого вибору. Персонал із системними адміністративними
      та експлуатаційними обов’язками може налаштовувати системи перед запуском і адмініструвати їх під час роботи з упевненістю,
      що їхні наміри правильно зіставлені з механізмами системи. Служби безпеки, функції та механізми не перешкоджають і не
      ускладнюють використання системи за призначенням. Існує компроміс між зручністю використання системи та суворістю, необхідною
      для виконання політики безпеки. Якщо механізми безпеки незручні або складні у використанні, користувачі можуть вимикати
      їх, уникати їх використання, або використовувати способами, несумісними з вимогами безпеки та потребами захисту, для задоволення
      яких їх було розроблено.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:sa-8.28
    ref_id: SA-8(28)
    name: Безпека та приватність принципів інжинірингу — Прийнятна безпека
    category: technical
    csf_function: protect
    description: 'Реалізуйте принцип проектування прийнятної безпеки в [Призначення: визначені організацією системи або компоненти
      системи].
  
  
  
      Параметри:
  
  
      1. Призначення: визначені організацією системи або компоненти системи'
    annotation: Принцип прийнятної безпеки вимагає, щоб рівень конфіденційності та продуктивності, які забезпечує система, відповідали
      очікуванням користувачів. Сприйняття особистої конфіденційності може вплинути на поведінку, мораль і ефективність користувачів.
      Виходячи з організаційної політики конфіденційності та дизайну системи, користувачі повинні мати можливість обмежити свої
      дії, щоб захистити свою конфіденційність. Якщо система не забезпечує інтуїтивно зрозумілий інтерфейс або не відповідає
      очікуванням щодо конфіденційності та продуктивності, користувачі можуть повністю уникати систему, або використовувати
      її у спосіб, який може бути неефективним або навіть небезпечним.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:sa-8.29
    ref_id: SA-8(29)
    name: Безпека та приватність принципів інжинірингу — Повторювані і документовані процедури
    category: technical
    csf_function: protect
    description: 'Запровадити принцип повторюваних і документованих процедур у [Призначення: визначені організацією системи
      або системні компоненти].
  
  
  
      Параметри:
  
  
      1. Призначення: визначені організацією системи або системні компоненти'
    annotation: Принцип повторюваних і документованих процедур стверджує, що техніки і методи, які використовуються для створення
      компонента системи, дозволяють пізніше повністю і правильно реконструювати той самий компонент. Повторювані та документовані
      процедури підтримують розробку компонента, ідентичного компоненту, створеному раніше, який широко використовується. У
      випадку інших артефактів системи (наприклад, документації та результатів тестування) повторюваність підтримує послідовність
      і можливість перевірки артефактів. Повторювані та документовані процедури можуть бути запроваджені на різних етапах життєвого
      циклу розробки системи та сприяють здатності оцінювати вимоги гарантії для системи. Приклади включають систематичні процедури
      для розробки та перегляду коду, процедури для управління конфігурацією засобів розробки та артефактів системи, а також
      процедури для доставки системи.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:sa-8.30
    ref_id: SA-8(30)
    name: Безпека та приватність принципів інжинірингу — Процесуальна строгість
    category: technical
    csf_function: protect
    description: 'Запровадити принцип процедурної строгості в [Призначення: визначені організацією системи або системні компоненти].
  
  
  
      Параметри:
  
  
      1. Призначення: визначені організацією системи або системні компоненти'
    annotation: Принцип процедурної строгості стверджує, що строгість процесу життєвого циклу системи співмірна з його передбачуваною
      надійністю. Строгість процедур визначає обсяг, глибину та деталізацію процедур життєвого циклу системи. Суворі процедури
      життєвого циклу системи дають впевненость в тому, що система працює коректно та не містить функцій, що можуть працювати
      декількома способами. По-перше, процедури накладають стримування та противаги на процес життєвого циклу, щоб запобігти
      впровадженню невизначеної функціональності, по-друге – суворі процедури, що застосовуються під час розробки системи безпеки
      та подальших специфікацій і проектних документів, дають розуміння реальної побудови системи, замість того, щоб вірити,
      що реалізований компонент є авторитетним (що потенційно оманливо). Нарешті, модифікувати існуючий компонент системи легше,
      якщо є детальні специфікації, які описують його поточний дизайн, замість того, щоб вивчати вихідний код або схеми, щоб
      спробувати зрозуміти, як він працює. Суворість процедур допомагає гарантувати, що функціональні вимоги безпеки та гарантії
      були задоволені, і це сприяє створенню більш обґрунтованої основи для визначення надійності та ризику. Суворість процедури
      повинна відповідати бажаному ступеню впевненості для системи. Якщо необхідна надійність системи низька, високий рівень
      процедурної жорсткості може додати непотрібних витрат, тоді як висока надійність є критичною і вартість високої процедурної
      строгості в такому випадку є обгрунтованою.
