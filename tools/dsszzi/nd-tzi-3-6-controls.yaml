    description: '(a) Оцінити ризики ланцюга постачання, пов’язані з [Призначення: визначеними організацією системами, компонентами
      системи та системними службами];
  
      (b) Оновлювати оцінювання ризику ланцюга постачання [Призначення: з визначеною організацією частотою], коли відбуваються
      значні зміни у відповідному ланцюгу постачання, або коли зміни в інформаційній системі, робочому середовищі чи інших умовах
      можуть вимагати змін у ланцюгу постачання.
  
  
  
      Параметри:
  
  
      1. Призначення: визначеними організацією системами, компонентами системи та системними службами
  
  
      2. Призначення: з визначеною організацією частотою'
    annotation: Події, пов’язані з ланцюгом постачання, охоплюють, наприклад, зриви постачання,крадіжки, використання несправних
      компонентів, використання підробок, зловмисні розробки, неправильну доставку та введення шкідливого коду. Ці події можуть
      мати істотний вплив на конфіденційність, цілісність або доступність системи та її інформації, а отже також можуть негативно
      впливати на організаційні операції (включно з місією, функціями, іміджем чи репутацією), організаційні активи, осіб та
      інші організації. Події, пов’язані з ланцюгом постачання, можуть бути ненавмисними або зловмисними і можуть виникати в
      будь-якій точці життєвого циклу системи. Аналіз ризиків ланцюга постачання може допомогти організації визначити системи
      або компоненти, для яких необхідні додаткові заходи захисту.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ra-3.2
    ref_id: RA-3(2)
    name: Оцінювання ризику — Використання інформації з усіх доступних джерел
    category: process
    csf_function: identify
    description: Використовуйте інформацію з усіх доступних джерел для аналізу ризиків.
    annotation: Організації використовують дані з усіх джерел, щоб інформувати про інженерні рішення, рішення щодо придбання
      та управління ризиками. Розвідка з усіх джерел складається з інформації, отриманої з усіх доступних джерел, включаючи
      загальнодоступну інформацію або інформацію з відкритих джерел, дані про вимірювання та сигнатури, людський інтелект, дані
      про сигнали та дані про зображення. Інтелектуальні дані з усіх джерел використовуються для аналізу ризику вразливості
      (як навмисної, так і ненавмисної) від процесів розробки, виробництва та доставки, людей і середовищ. Аналіз ризиків можна
      проводити для постачальників на кількох рівнях ланцюга постачання, достатніх для управління ризиками. Організації можуть
      укладати угоди з іншими організаціями щодо обміну розвідувальною інформацією всіх джерел або прийнятих рішень, якщо це
      відповідає вимогам. З метою управління ризиками може бути проведений щодо постачальників на декількох рівнях ланцюга постачання.
      За необхідності, організації можуть укладати договори про обмін інформацією з розвідувальних джерел або про прийняття
      рішень, що базуються на такій інформації, з іншими організаціями.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ra-3.3
