  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ac-4.12
    ref_id: AC-4(12)
    name: Управління інформаційними потоками — Ідентифікатори типу даних
    category: technical
    csf_function: protect
    description: 'При передачі інформації між різними захищеними доменами використовувати [Призначення: визначені
      організацією ідентифікатори типів даних] для перевірки даних, необхідних для ухвалення рішень щодо інформаційного
