    annotation: Перш ніж дозволити використання спільних або групових облікових записів, необхідно проаналізувати
      ризики, які пов’язані з відсутністю підзвітності таких облікових записів.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ac-2.10
