  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:sa-22
    ref_id: SA-22
    name: Компоненти системи, що не підтримуються
    category: process
    csf_function: identify
    description: 'a. Замінювати компоненти системи, якщо підтримка компонентів більше не доступна розробнику, постачальнику
      або виробнику.
  
      b. Надавати такі варіанти альтернативних джерел для подальшої підтримки непідтримуваних компонентів [Вибір (один або більше):
      внутрішня підтримка; [Призначення: підтримка, визначена організацією від зовнішніх постачальників]].
  
  
  
      Параметри:
  
  
      1. Вибір (один або більше): внутрішня підтримка; [Призначення: підтримка, визначена організацією від зовнішніх постачальників]'
    annotation: Підтримка компонентів системи включає виправлення програмного забезпечення, оновлення мікропрограм, запасні
      частини та контракти на технічне обслуговування. Прикладом непідтримуваних компонентів є випадки, коли постачальники більше
      не надають критичних програмних виправлень або оновлень продуктів, що може призвести до можливості для зловмисників використовувати
      слабкі місця в установлених компонентах. Винятки із заміни непідтримуваних компонентів системи включають системи, які
      забезпечують критично важливу місію або бізнес-можливості, де нові технології недоступні або де системи настільки ізольовані,
      що встановлення замінних компонентів неможливе. Альтернативні джерела підтримки вирішують необхідність забезпечення постійної
      підтримки компонентів системи, які більше не підтримуються оригінальними виробниками, розробниками або постачальниками,
      коли такі компоненти залишаються важливими для місії організації та бізнесфункцій. Якщо необхідно, організації можуть
      створити внутрішню підтримку, розробивши налаштовані виправлення для критичних компонентів програмного забезпечення, або
      альтернативно отримати послуги зовнішніх постачальників, які надають постійну підтримку для визначених непідтримуваних
      компонентів через договірні відносини. Такі договірні відносини можуть включати постачальників програмного забезпечення
      з доданою вартістю і відкритим кодом. Підвищений ризик використання непідтримуваних компонентів системи можна зменшити,
      наприклад, заборонивши підключення таких компонентів до загальнодоступних чи неконтрольованих мереж або запровадивши інші
      форми ізоляції.
