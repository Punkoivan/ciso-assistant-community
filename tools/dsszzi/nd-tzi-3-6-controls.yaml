    csf_function: protect
    description: 'Вилучено: Включено до SC-28(1).'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:mp-3
    ref_id: MP-3
    name: Маркування носіїв інформації
    category: process
    csf_function: protect
    description: 'a. Наносити на носії інформації маркування, що вказують на обмеження поширення, обробки, а також
      застереження та відповідні мітки безпеки (якщо такі є) інформації.

      b. Звільнити [Призначення: визначені організацією типи носіїв системи] від маркування, якщо носії залишаються
      в межах [Призначення: визначених організацією контрольованих зон].


      Параметри:

      1. Призначення: визначені організацією типи носіїв системи

      2. Призначення: визначених організацією контрольованих зон'
    annotation: Маркування безпеки стосується застосування або використання атрибутів безпеки стосовно внутрішніх
      структур даних всередині систем. Маркування безпеки, як правило, не вимагається для носіїв, що містять загальнодоступну
      інформацію. Однак деякі організації можуть вимагати відповідного маркування носіїв інформації, яке свідчить
      про те, що інформація є загальнодоступною. Маркування носіїв має здійснюватися відповідно до чинного законодавства.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:mp-4
    ref_id: MP-4
    name: Зберігання носіїв інформації
    category: technical
    csf_function: protect
    description: 'a. Фізично контролювати та безпечно зберігати [Призначення: визначені організацією типи цифрових
      та/або нецифрових носіїв інформації] в межах [Призначення: визначених організацією контрольованих зон].

      b. Захищати системні носії, які визначені в MP-4 до того часу, як носії знищуються або очищаються, з використанням
      затвердженого обладнання, методів та процедур.


      Параметри:

      1. Призначення: визначені організацією типи цифрових та/або нецифрових носіїв інформації

      2. Призначення: визначених організацією контрольованих зон'
    annotation: Фізичний контроль носіїв містить, наприклад, проведення інвентаризації, контроль за місцем перебування
      носіїв тощо. Тип носія інформації, що використовується, має відповідати категорії безпеки або інформації,
      що зберігається на носії. Контрольовані зони — це зони, які забезпечують достатню фізичну та процедурну гарантію
      для задоволення вимог, встановлених для захисту інформації та систем. Зберігання носіїв інформації, на яких
      зберігається загальнодоступна інформація, вимагає меншого рівня гарантій. У цих ситуаціях фізичний контроль
      доступу може самостійно забезпечити належний захист.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:mp-4.1
    ref_id: MP-4(1)
    name: Зберігання носіїв інформації — Криптографічний захист
    category: technical
    csf_function: protect
    description: 'Вилучено: Включено до SC-28(1).'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:mp-4.2
    ref_id: MP-4(2)
    name: Зберігання носіїв інформації — Автоматизований обмежений доступ
    category: technical
    csf_function: protect
    description: Впровадити автоматизовані механізми для обмеження доступу до зон зберігання носіїв інформації та
      для реєстрації спроб доступу та доступу, який надано.
    annotation: До автоматизованих механізмів належать, наприклад, клавіатури, біометричні зчитувачі або зчитувачі
      карт на зовнішніх частинах зон.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:mp-5
    ref_id: MP-5
    name: Транспортування носіїв інформації
    category: process
    csf_function: protect
    description: 'a. Захищати та контролювати [Призначення: визначені організацією типи носіїв системи] під час
      транспортування за межами контрольованих зон, використовуючи [Призначення: визначені організацією заходи безпеки].

      b. Вести облік носіїв системи інформації під час транспортування за межами контрольованих зон.

      c. Документувати дії, пов’язані з транспортуванням носіїв системи.

      d. Обмежити діяльність уповноваженого персоналу, пов’язану з транспортуванням носіїв системи.


      Параметри:

      1. Призначення: визначені організацією типи носіїв системи

      2. Призначення: визначені організацією заходи безпеки'
    annotation: 'Фізичні та технічні засоби захисту носіїв інформації мають відповідати категорії безпеки інформації,
      що зберігається на носії. До засобів захисту носіїв під час транспортування належать захищені контейнери та
      криптографічні методи захисту. Криптографічні методи можуть забезпечувати захист конфіденційності й цілісності,
      залежно від використовуваних механізмів. Діяльність, що пов’язана з транспортуванням, охоплює: власне транспортування,
      підготовку до транспортування та підготовку до експлуатації після транспортування. До транспортування може
      бути залучений зовнішній персонал. Процес транспортування має бути відстежуваним (до засобів відстежування
      можуть належати процедури протоколювання, використання механізмів запобігання та виявлення можливої підробки).
      Організації мають встановлювати процедури документування відповідно до процесів і носіїв інформації організації,
      які транспортуються.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:mp-5.1
    ref_id: MP-5(1)
    name: Транспортування носіїв контрольованими зонами
    category: process
    csf_function: protect
    description: 'Вилучено: Включено до MP-5.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:mp-5.2
    ref_id: MP-5(2)
    name: Транспортування носіїв інформації — Документування дій
    category: process
    csf_function: protect
    description: 'Вилучено: Включено до MP-5.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:mp-5.3
    ref_id: MP-5(3)
    name: Транспортування носіїв інформації — Зберігачі
    category: process
    csf_function: protect
    description: Залучати визначених зберігачів інформації під час транспортування носіїв системи за межі контрольованих
      зон.
    annotation: Визначені зберігачі надають організаціям конкретні точки зв’язку під час транспортування носіїв
      інформації.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:mp-5.4
    ref_id: MP-5(4)
    name: Транспортування захист
    category: process
    csf_function: protect
    description: 'Вилучено: Включено до SC-28(1).'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:mp-6
    ref_id: MP-6
    name: Знищення інформації на носіях інформації
    category: process
    csf_function: protect
    description: 'a. Очищувати [Призначення: визначені організацією системні носії] перед утилізацією, випуском
      за межі організаційного контролю, або перед повторним використанням [Призначення: методами та процедурами
      очищення, визначеними організацією].

      b. Використовувати механізми очищення зі стійкістю та цілісністю, що відповідає категорії безпеки або рівню
      секретності інформації.


      Параметри:

      1. Призначення: визначені організацією системні носії

      2. Призначення: методами та процедурами очищення, визначеними організацією'
    annotation: 'Цей захід безпеки поширюється на всі системні носії інформації як цифрові, так і нецифрові, інформація
      на яких має бути знищена незалежно від того, чи вважається носій знімним. Прикладами носіїв є: цифрові носії
      інформації, що містяться в сканерах, копіювальних пристроях, принтерах, ноутбуках, робочих станціях, мережевих
      компонентах, мобільних пристроях; та нецифрові носії інформації — такі як папір і мікрофільми. Процес очищення
      має видаляти інформацію з носія інформації, щоб її неможливо було отримати чи відновити. Методи очищення запобігають
      розголошенню інформації стороннім особам у разі, коли такі носії використовуються повторно або передаються
      на утилізацію (видалення, форматування, криптографічне забілювання тощо). Організації встановлюють механізми
      очищення відповідно до категорії безпеки інформації, яка розміщена на носіях інформації.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:mp-6.1
    ref_id: MP-6(1)
    name: Знищення інформації на носіях інформації — Перегляд, затвердження, відстеження, документування та перевірка
    category: process
    csf_function: protect
    description: Переглядати, затверджувати, відстежувати, документувати та перевіряти очищення носіїв інформації
      та дії з їх утилізації.
    annotation: 'Організації переглядають і затверджують перелік носіїв інформації, які підлягають очищенню для
      забезпечення дотримання політики збереження записів. Дії відстеження та документування охоплюють: складання
      переліку персоналу, який переглядає і затверджує заходи щодо очищення; види носіїв інформації; конкретні файли,
      що зберігаються на носії; застосовувані методи очищення; дату й час проведення очищення; персонал, який здійснив
      очищеннятощо. Організації перевіряють, чи було очищення носіїв інформації перед знищенням.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:mp-6.2
    ref_id: MP-6(2)
    name: Знищення інформації на носіях інформації — Перевірка обладнання
    category: process
    csf_function: protect
    description: 'Перевіряти обладнання та процедури для очищення [Призначення: з визначеною організацією частотою],
      щоб переконатися в досягненні запланованого очищення.


      Параметри:

      1. Призначення: з визначеною організацією частотою'
    annotation: Перевірка обладнання та процедур очищення може проводитися кваліфікованими й уповноваженими зовнішніми
      організаціями.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:mp-6.3
    ref_id: MP-6(3)
    name: Знищення інформації на носіях інформації — Неруйнівні методи
    category: process
    csf_function: protect
    description: 'Застосовувати методи неруйнівного очищення до портативних запам’ятовувальних пристроїв перед підключенням
      таких пристроїв до системи за наступних обставин: [Призначення: визначених організацією умов, що вимагають
      очищення портативних запам’ятовувальних пристроїв].


      Параметри:

      1. Призначення: визначених організацією умов, що вимагають очищення портативних запам’ятовувальних пристроїв'
    annotation: До портативних пристроїв зберігання даних відносяться зовнішні або знімні жорсткі диски (напр.,
      твердотільні, магнітні), оптичні диски, магнітні або оптичні стрічки, пристрої флеш-пам'яті, карти флеш-пам'яті
      карти пам'яті та інші зовнішні або знімні диски. У портативні пристрої зберігання даних легко може бути вбудований
      зловмисний код. Багато таких пристроїв отримані з недостовірних джерел і можуть містити шкідливий код, який
      можна легко перенести в системи через порти USB чи інші портали входу. Рекомендується сканувати пристрої зберігання
      даних, проте процедура очищення забезпечує додаткову впевненість у тому, що такі пристрої не містять шкідливого
      коду. Організації розглядають можливість очищення портативних пристроїв зберігання даних, коли пристрої купуються
      у виробників або постачальників перед початком використанням.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:mp-6.4
    ref_id: MP-6(4)
    name: Знищення інформації на носіях інформації — Керована несекретна інформація
    category: process
    csf_function: protect
    description: 'Вилучено: Включено до MP-6.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:mp-6.5
    ref_id: MP-6(5)
    name: Знищення інформації на носіях інформації — Секретна інформація
    category: process
    csf_function: protect
    description: 'Вилучено: Включено до MP-6.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:mp-6.6
    ref_id: MP-6(6)
    name: Знищення інформації на носіях інформації — Знищення носіїв інформації
    category: process
    csf_function: protect
    description: 'Вилучено: Включено до MP-6.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:mp-6.7
    ref_id: MP-6(7)
    name: Знищення інформації на носіях інформації — Подвійна авторизація
    category: process
    csf_function: protect
    description: 'Здійснювати подвійну авторизацію для очищення [Призначення: визначених організацією носіїв системи].


      Параметри:

      1. Призначення: визначених організацією носіїв системи'
    annotation: Організації використовують подвійну авторизацію для очищення, щоб гарантувати, що очищення носіїв
      інформації системи не може відбутися без участі двох технічно кваліфікованих осіб, які виконують призначене
      завдання. Особи, які проводять очищення носіїв інформації системи, повинні володіти достатніми навичками та
      досвідом для визначення чи відповідає запропонована процедура очищення чинним стандартам, політикам, і процедурам
      організації. Подвійна авторизація також повинна гарантувати, що очищення відбувається за призначенням, захищаючи
      від помилок і неправдивих заяв про виконання процедури очищення. Подвійна авторизація являє собою двоосібний
      контроль. Механізми подвійної авторизації вимагають схвалення двох уповноважених осіб для виконання дії. Щоб
      зменшити ризик змови, організація розглядає можливість ротації обов’язків подвійної авторизації з іншими особами.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:mp-6.8
    ref_id: MP-6(8)
    name: Знищення інформації на носіях інформації — Віддалене очищення або стирання інформації
    category: process
    csf_function: protect
    description: 'Забезпечити віддалену можливість очищення або стирання інформації з [Призначення: визначених організацією
      систем або компонентів системи] або за: [Призначення: визначених організацією умов].


      Параметри:

      1. Призначення: визначених організацією систем або компонентів системи

      2. Призначення: визначених організацією умов'
    annotation: Це удосконалення забезпечує захист даних/інформації про організаційні системи та компоненти системи,
      якщо такі системи або компоненти отримані від сторонніх осіб. Для віддалених команд очищення/стирання вимагається
      надійна автентифікація. Функція очищення або стирання може бути реалізована різними способами, включно з,
      наприклад, перезаписом даних/інформації кілька разів або знищенням ключа, необхідного для розшифрування зашифрованих
      даних.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:mp-7
    ref_id: MP-7
    name: Використання носіїв інформації
    category: process
    csf_function: protect
    description: 'a. [Вибір: обмежити; заборонити] використання [Призначення: визначених організацією типів носіїв
      системи] на [Призначення: визначені організацією системи або компоненти системи], використовуючи [Призначення:
      визначені організацією заходи безпеки].

      b. Заборонити використання портативних пристроїв зберігання даних в системах організації, якщо такі пристрої
      не мають визначеного власника.


      Параметри:

      1. Вибір: обмежити; заборонити

      2. Призначення: визначених організацією типів носіїв системи

      3. Призначення: визначені організацією системи або компоненти системи

      4. Призначення: визначені організацією заходи безпеки'
    annotation: Цей захід безпеки також застосовується до мобільних пристроїв. На відміну від MP-2, який обмежує
      доступ користувача до носіїв інформації, (MP-7) обмежує використання певних типів носіїв у системах, наприклад,
      обмежуючи/забороняючи використання флеш-накопичувачів або зовнішніх накопичувачів. Організації можуть використовувати
      технічні та нетехнічні засоби для обмеження використання носіїв інформації системи. Організації можуть обмежувати
      використання переносних пристроїв зберігання даних, наприклад, використовуючи фізичні перешкоди для запобігання
      доступу до певних зовнішніх портів, або відключити/видалити можливість вставляти, зчитувати чи записувати
      на такі пристрої. Організації можуть також обмежувати використання портативних пристроїв зберігання, обмеживши
      перелік дозволених до використання лише затвердженими пристроями, включно з, наприклад, пристроями, що надаються
      організацією, пристроями, наданими іншими затвердженими організаціями.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:mp-7.1
    ref_id: MP-7(1)
    name: Використання носіїв інформації — Заборона використання без визначеного власника
    category: process
    csf_function: protect
    description: 'Вилучено: Включено до MP-7.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:mp-7.2
    ref_id: MP-7(2)
    name: Використання носіїв інформації — Заборона використання стійких до очищення носіїв інформації
    category: process
    csf_function: protect
    description: Заборонити використання в системах організації засобів, що не піддаються очищенню.
    annotation: Окремі типи носіїв не підтримують команди очищення; або якщо вони підтримуються, інтерфейси на цих
      пристроях не підтримуються стандартизовано.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:mp-8
    ref_id: MP-8
    name: Зниження категорії безпеки носіїв інформації
    category: process
    csf_function: protect
    description: 'a. Встановити [Призначення: визначений організацією процес зниження категорії безпеки носіїв інформації],
      який охоплює використання механізмів зниження грифа секретності носіїв інформації за стійкістю та цілісністю,
      що відповідає категорії безпеки або рівню секретності інформації.

      b. Забезпечити, щоб процес зниження категорії безпеки носія відповідав категорії безпеки або рівню секретності
      інформації, яку потрібно видалити, а також рівню доступу потенційних одержувачів до інформації з меншим рівнем
      секретності.

      c. Визначати [Призначення: визначені організацією системні носії, що вимагають зниження категорії безпеки].

      d. Знижувати категорію безпеки визначеного носія за допомогою встановленого процесу.


      Параметри:

      1. Призначення: визначений організацією процес зниження категорії безпеки носіїв інформації

      2. Призначення: визначені організацією системні носії, що вимагають зниження категорії безпеки'
    annotation: Цей захід безпеки застосовується до всіх носіїв інформації системи — цифрових та нецифрових, — які
      можуть покидати межі організації. Процес пониження категорії безпеки носіїв інформації передбачає надійну
      передачу інформації з носія. Також можливе редагування змісту інформації на носії для пониження категорії
      безпеки.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:mp-8.1
    ref_id: MP-8(1)
    name: Зниження категорії безпеки носіїв інформації - документування процесу
    category: process
    csf_function: protect
    description: Документувати дії зі зниження категорії безпеки носіїв інформації.
    annotation: 'При проведенні процедури пониження категорії безпеки носіїв інформації має бути задокументовано:
      ідентифікаційний номер носія; уповноважену особу, яка проводила процес пониження категорії безпеки; метод
      пониження та уповноважену особу, яка віддала розпорядження щодо пониження категорії безпеки.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:mp-8.2
    ref_id: MP-8(2)
    name: Зниження категорії безпеки носіїв інформації — Перевірка обладнання
    category: process
    csf_function: protect
    description: 'Перевіряти обладнання та процедури заниження категорії безпеки [Призначення: з визначеною організацією
      частотою], щоб переконатися в досягненні запланованих заходів щодо зниження.


      Параметри:

      1. Призначення: з визначеною організацією частотою'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:mp-8.3
    ref_id: MP-8(3)
    name: Зниження категорії безпеки носіїв інформації — Критична інформація
    category: process
    csf_function: protect
    description: 'Знижувати категорію безпеки носіїв, що містять [Призначення: визначену організацією критичну інформацію]
      до рівня публічного доступу.


      Параметри:

      1. Призначення: визначену організацією критичну інформацію'
    annotation: Для пониження категорії безпеки носіїв інформації використовуйте затверджені інструменти, методи
      і процедури очищення.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:mp-8.4
    ref_id: MP-8(4)
    name: Зниження категорії безпеки носіїв інформації — Таємна інформація
    category: process
    csf_function: protect
    description: Знижувати категорію безпеки носіїв, що містять секретну інформацію, до категорії безпеки для осіб
      без необхідних дозволів на доступ.
    annotation: Зниження категорії безпеки носіїв інформації має відбуватися відповідно до затверджених положень
      з використанням надійних методів та інструментів.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:pe-1
    ref_id: PE-1
    name: Політика та процедури фізичного захисту та захисту робочого середовища
    category: policy
    csf_function: govern
    description: "a. Розробляє, документує та поширює серед [Призначення: визначеного організацією персоналу або\
      \ ролей]:\n\t1. політику в галузі фізичного захисту та захисту робочого середовища, яка:\n\t\t(a) містить\
      \ мету, сферу застосування, ролі, обов’язки, відповідальність керівництва, координацію між організаційними\
      \ підрозділами та систему контролю відповідності (complaince);\n\t\t(b) відповідає чинному законодавству,\
      \ виконавчим наказам, директивам, нормам, політикам, стандартам і керівним принципам;\n     2. процедури,\
      \ які сприяють виконанню політики та заходів у галузі фізичного захисту та захисту робочого середовища.\n\n\
      b. Призначити [Призначення: визначену організацією посадову особу] для управління політикою та процедурами\
      \ фізичного захисту та захисту робочого середовища. \nc. Переглядати та оновлювати:\n1. поточну політику фізичного\
      \ захисту та захисту робочого середовища [Призначення: з визначеною організацією частотою];\n2. поточні процедури\
      \ фізичного захисту та захисту робочого середовища [Призначення: з визначеною організацією частотою].\n\n\
      Параметри:\n1. Призначення: визначеного організацією персоналу або ролей\n2. Призначення: визначену організацією\
      \ посадову особу\n3. Призначення: з визначеною організацією частотою"
    annotation: Цей захід захисту стосується встановлення політики та процедур для ефективного здійснення заходів
      та їх посилень у класі PE. Стратегія управління ризиками є важливим фактором у встановленні політики та процедур.
      Комплексна політика та процедури допомагають забезпечити безпеку та приватність. За наявності політики, а
      також планів захисту інформації та персональних даних на рівні організації, конкретні системні політики та
      процедури можуть бути не потрібні. Політика може бути внесена до складу загальної політики безпеки та приватності
      або може бути представлена кількома політиками (у випадках складної архітектури). Процедури описують, як має
      реалізуватися політика чи заходи захисту та як вони можуть бути спрямовані на персонал або роль, що є об’єктом
      процедури. Процедури можуть бути задокументовані в планах захисту інформації та персональних даних (як один
      або декілька документів).
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:pe-2
    ref_id: PE-2
    name: Авторизація фізичного доступу
    category: process
    csf_function: protect
    description: 'a. Розробити, затвердити та вести перелік осіб, які мають право авторизованого доступу до об’єкта,
      де перебуває система.

      b. Надати повноваження для доступу до об’єкта.

      c. Переглядати список доступу, у якому закріплений перелік персоналу або ролей, яким дозволений санкціонований
      доступ до об’єкта [Призначення: з визначеною організацією частотою].

      d. Видалити персонал зі списку доступу до об’єкта, коли такий доступ більше не потрібний.


      Параметри:

      1. Призначення: з визначеною організацією частотою'
    annotation: Цей захід застосовується до працівників і відвідувачів. Особи, які мають постійні посвідчення фізичного
      доступу, не вважаються відвідувачами. Вхідні дані авторизації містять, наприклад, значки, ідентифікаційні
      картки та смарткарти. Організації визначають необхідний рівень авторизації відповідно до чинного законодавства,
      політики, стандартам та інструкцій. Цей захід захисту застосовується лише до територій всередині об’єктів,
      які не були визначені як загальнодоступні.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:pe-2.1
    ref_id: PE-2(1)
    name: Авторизація фізичного доступу — Доступ на основі посади або ролі
    category: process
    csf_function: protect
    description: Авторизувати фізичний доступ до об’єкта, де перебуває система, на основі ролі або посади.
    annotation: Доступ до об’єкта на основі ролі включає доступ уповноваженого постійного персоналу та включає регулярне/постійне
      технічне обслуговування, чергових офіцерів та медичний персонал.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:pe-2.2
    ref_id: PE-2(2)
    name: Авторизація фізичного доступу — Дві форми ідентифікації
    category: process
    csf_function: protect
    description: 'Вимагати дві форми ідентифікації від [Призначення: визначеного організацією списку прийнятних
      форм ідентифікації] для доступу відвідувачів до об’єкта, де перебуває система.


      Параметри:

      1. Призначення: визначеного організацією списку прийнятних форм ідентифікації'
    annotation: До форм ідентифікації належать, наприклад, ідентифікація за допомогою паспорту, посвідчення особистості,
      посвідчення водія. Для отримання доступу до об’єктів за допомогою автоматизованих механізмів організації можуть
      використовувати картки доступу, ключові картки, PIN-коди та біометричні дані.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:pe-2.3
    ref_id: PE-2(3)
    name: Авторизація фізичного доступу — Обмеження доступу без супроводу
    category: process
    csf_function: protect
    description: 'Заборонити доступ без супроводу до об’єкта, де перебуває система, персоналу з [Вибір (один або
      більше): рівень допуску для всієї інформації, що міститься в системі; авторизація офіційного доступу до всієї
      інформації, що міститься в системі; необхідність доступу до всієї інформації, що міститься в системі; [Призначення:
      визначені організацією повноваження]].


      Параметри:

      1. Вибір (один або більше): рівень допуску для всієї інформації, що міститься в системі; авторизація офіційного
      доступу до всієї інформації, що міститься в системі; необхідність доступу до всієї інформації, що міститься
      в системі; [Призначення: визначені організацією повноваження]'
    annotation: Через надзвичайно чутливий характер інформації з обмеженим доступом, що зберігається в певних установах,
      важливо, щоб особи, які не мають дозволу доступу, супроводжувалися відповідальними авторизованими особами.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:pe-3
    ref_id: PE-3
    name: Керування фізичним доступом
    category: technical
    csf_function: protect
    description: 'a. Забезпечити авторизацію фізичного доступу за адресою [Призначення: визначені організацією точки
      входу й виходу до об’єкта, де перебуває система] шляхом:

      1. перевірки індивідуального дозволу доступу до об’єкта;

      2. управління входом та виходом на об’єкт за допомогою [Вибір (один або кілька): [Призначення: визначених
      організацією фізичних систем або пристроїв контролю доступу]; охорони].


      b. Вести журнали контролю фізичного доступу для [Призначення: визначені організацією точки входу/виходу].

      c. Забезпечити [Призначення: визначені організацією заходи захисту] для контролю доступу в зони всередині
      об’єкта, позначені як загальнодоступні.

      d. Супроводжувати відвідувачів та контролювати активність відвідувачів [Призначення: визначені організацією
      умови, що вимагають супроводу відвідувачів і моніторингу].

      e. Забезпечити захист ключів, кодів доступу та інших пристроїв фізичного доступу.

      f. Проводити інвентаризацію [Призначення: визначених організацією пристроїв фізичного доступу] кожен [Призначення:
      визначена організацією частота].

      g. Здійснювати зміну кодів доступу та ключів [Призначення: з визначеною організацією частотою], коли ключі
      втрачені, комбінації скомпрометовані або фізичні особи переведені чи звільнені.


      Параметри:

      1. Призначення: визначені організацією точки входу й виходу до об’єкта, де перебуває система

      2. Вибір (один або кілька): [Призначення: визначених організацією фізичних систем або пристроїв контролю доступу];
      охорони

      3. Призначення: визначені організацією точки входу/виходу

      4. Призначення: визначені організацією заходи захисту

      5. Призначення: визначені організацією умови, що вимагають супроводу відвідувачів і моніторингу

      6. Призначення: визначених організацією пристроїв фізичного доступу

      7. Призначення: визначена організацією частота

      8. Призначення: з визначеною організацією частотою'
    annotation: Цей захід застосовується до працівників і відвідувачів. Особи, які мають постійні посвідчення фізичного
      доступу, не вважаються відвідувачами. До пристроїв фізичного доступу належать, наприклад, клавіші, замки та
      зчитувачі карт. Фізичні системи контролю доступу мають відповідати чинному законодавству. Організації можуть
      вести журнали аудиту (процедурні та/або автоматизовані). До фізичних точок доступу належать точки доступу
      до об’єктів, внутрішні точки доступу до систем або компонентів системи, що потребують додаткових засобів захисту.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:pe-3.1
    ref_id: PE-3(1)
    name: Керування фізичним доступом — Доступ до системи
    category: technical
    csf_function: protect
    description: 'Застосовувати авторизацію фізичного доступу до системи на додаток до керування фізичного доступу
      до об’єкта в [Призначення: визначені організацією фізичні приміщення, що містять один або більше компонентів
      системи].


      Параметри:

      1. Призначення: визначені організацією фізичні приміщення, що містять один або більше компонентів системи'
    annotation: Це посилення забезпечує додаткову фізичну безпеку для тих областей, що розташовані в приміщеннях,
      з великою кількістю компонентів системи.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:pe-3.2
    ref_id: PE-3(2)
    name: Керування фізичним доступом — Межі об’єкту та системи
    category: technical
    csf_function: protect
    description: 'Здійснювати перевірку безпеки [Призначення: з визначеною організацією частотою] на фізичній межі
      об’єкта або системи для видалення інформації або вилучення компонентів системи.


      Параметри:

      1. Призначення: з визначеною організацією частотою'
    annotation: Організації мають визначати ступінь, частоту та/або випадковість перевірок безпеки для адекватного
      зменшення ризику, пов’язаного з ексфільтрацією.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:pe-3.3
    ref_id: PE-3(3)
    name: Керування фізичним доступом — Безперервна охорона
    category: technical
    csf_function: protect
    description: 'Забезпечити цілодобову безперервну охорону для контролю доступу [Призначення: визначені організацією
      фізичні точки доступу] до об’єкта, де перебуває система.


      Параметри:

      1. Призначення: визначені організацією фізичні точки доступу'
    annotation: Розміщення охорони у місцях фізичного доступу до об’єкту забезпечує організації можливість швидкого
      реагування. Охорона також надає можливість для спостереженням за людьми в зоні об’єктів, не охоплених відеоспостереженням.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:pe-3.4
    ref_id: PE-3(4)
    name: Керування фізичним доступом — Шафи з блокуванням
    category: technical
    csf_function: protect
    description: 'Використовувати шафи з блокуванням для захисту [Призначення: визначених організацією компонентів
      системи] від несанкціонованого фізичного доступу.


      Параметри:

      1. Призначення: визначених організацією компонентів системи'
    annotation: 'Найбільший ризик несанкціонованого використання портативних пристроїв, таких як смартфонів, планшетів
      та ноутбуків – це крадіжка. Організації можуть використовувати шафи з блокуванням, щоб зменшити або усунути
      ризик крадіжки обладнання. Такі шафи бувають різних розмірів, від тих що захищають один ноутбук, до шаф, які
      можуть захистити


      декілька серверів, комп’ютерів та периферійних пристроїв.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:pe-3.5
    ref_id: PE-3(5)
    name: Керування фізичним доступом — Захист від злому
    category: technical
    csf_function: protect
    description: 'Застосовувати [Призначення: визначені організацією заходи захисту] для [Вибір (один або більше):
      виявлення; запобігання] фізичної підробки або підміни [Призначення: визначених організацією апаратних компонентів]
      всередині системи.


      Параметри:

      1. Призначення: визначені організацією заходи захисту

      2. Вибір (один або більше): виявлення; запобігання

      3. Призначення: визначених організацією апаратних компонентів'
    annotation: Має бути забезпечене виявлення та запобігання несанкціонованому втручанню або несанкціонованому
      впливу в апаратні компоненти. У заходах щодо виявлення та запобігання можуть використовуватися різні типи
      технологій протидії несанкціонованому впливу.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:pe-3.6
    ref_id: PE-3(6)
    name: Керування фізичним доступом — Тестування на можливість проникнення
    category: technical
    csf_function: protect
    description: 'Вилучено: включено до CA-8.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:pe-3.7
    ref_id: PE-3(7)
    name: Керування фізичним доступом — Фізичні перешкоди
    category: technical
    csf_function: protect
    description: Обмежити доступ за допомогою фізичних перешкод.
    annotation: До фізичних перешкод належать, наприклад, кронштейни, бетонні плити, стінки та гідравлічні бар’єри.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:pe-3.8
    ref_id: PE-3(8)
    name: Керування фізичним доступом - контроль доступу у вестибюлі (холі)
    category: technical
    csf_function: protect
    description: 'Запроваджуйте контроль доступу у вестибюлі в [Завдання: місця, визначені організацією в межах
      закладу].


      Параметри:

      1. Завдання: місця, визначені організацією в межах закладу'
    annotation: Контроль доступу у вестибюлі є частиною фізичної системи контролю доступу між двома наборами блокованих
      дверей. Вестибюлі призначені для запобігання проникненню сторонніх осіб за авторизованими особами в приміщення
      з контрольованим доступом. Відсутність такого контролю може призвести до несанкціонованого доступу до об’єкта.
      Блокувальні дверні контролери можна використовувати для обмеження кількості осіб, які входять до контрольованих
      точок доступу, і для забезпечення зон утримання під час перевірки авторизації фізичного доступу. Блокувальні
      дверні контролери можуть бути повністю автоматизованими (тобто контролювати відкриття та закриття дверей)
      або частково автоматизованими (тобто можна використовувати охоронців для контролю кількості осіб, які входять
      у зону утримання).
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:pe-4
    ref_id: PE-4
    name: Контроль доступу до джерел і ліній електроживлення
    category: technical
    csf_function: protect
    description: 'Контролювати фізичний доступ до [Призначення: визначених організацією систем розподілу та постачання
      живлення] у рамках можливостей організації, використовуючи [Призначення: встановлені організацією заходи та
      засоби захисту].


      Параметри:

      1. Призначення: визначених організацією систем розподілу та постачання живлення

      2. Призначення: встановлені організацією заходи та засоби захисту'
    annotation: 'Засоби безпеки джерел і ліній електроживлення запобігають випадковим пошкодженням, збоям та фізичним
      підробкам. Такі заходи також можуть бути необхідними для запобігання підслуховуванню або модифікації незашифрованих
      передач. Засоби, що використовуються для контролю фізичного доступу до розподільних ліній і ліній електроживлення
      системи, містять: блокування електропроводки; відключення або блокування запасних гнізд; захист кабельних
      каналів трубопроводами або кабельними лотками; встановлення датчиків прослуховування та інше.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:pe-5
    ref_id: PE-5
    name: Контроль доступу до пристроїв виведення інформації
    category: technical
    csf_function: protect
    description: 'Керувати фізичним доступом до вихідних даних з [Призначення: визначені організацією пристрої для
      виведення інформації], для запобігання несанкціонованому отриманню користувачами вихідних даних.


      Параметри:

      1. Призначення: визначені організацією пристрої для виведення інформації'
    annotation: 'Контроль фізичного доступу до пристроїв виведення інформації охоплює: розміщення пристроїв виведення
      інформації в ізольованих приміщеннях або інших захищених зонах і забезпечення доступу лише уповноважених осіб;
      розміщення пристроїв виведення інформації в місцях, за якими може бути встановлений контроль; встановлення
      моніторних або екранних фільтрів; використання навушників тощо. До пристроїв виведення інформації належать,
      наприклад, монітори, принтери, копіювальні пристрої, сканери, факсимільні машини та аудіопристрої.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:pe-5.1
    ref_id: PE-5(1)
    name: Контроль доступу до пристроїв виведення інформації доступ до вихідних даних уповноваженими особами
    category: technical
    csf_function: protect
    description: 'Вилучено: включено до PE-5.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:pe-5.2
    ref_id: PE-5(2)
    name: Контроль доступу до пристроїв виведення інформації доступ до вихідних даних фізичними особами
    category: technical
    csf_function: protect
    description: Пов’язувати дані про цифрову ідентичність з підтвердженням отримання даних від вихідних пристроїв.
    annotation: До методів прив’язки ідентичності до даних, отриманих з пристроїв виведення належать, наприклад,
      встановлення функцій захисту на факсимільних машинах, копіювальних апаратах і принтерах. Така функціональність
      дозволяє здійснювати автентифікацію на пристроях виведення інформації.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:pe-5.3
    ref_id: PE-5(3)
    name: Контроль доступу до пристроїв виведення інформації маркування пристроїв виведення інформації
    category: technical
    csf_function: protect
    description: 'Вилучено: включено до PE-22.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:pe-6
    ref_id: PE-6
    name: Моніторинг фізичного доступу
    category: technical
    csf_function: detect
    description: 'a. Проводити моніторинг фізичного доступу до об’єкта, де перебуває система, з метою виявлення
      та реагування на інциденти фізичної безпеки.

      b. Переглядати журнали фізичного доступу [Призначення: з визначеною організацією частотою] на предмет наявності
      [Призначення: визначених організацією подій або потенційних ознак подій].

      c. Узгоджувати результати перегляду та розслідувань з організаційними можливостями реагування на інциденти.


      Параметри:

      1. Призначення: з визначеною організацією частотою

      2. Призначення: визначених організацією подій або потенційних ознак подій'
    annotation: Моніторинг фізичного доступу має поширюватися і на загальнодоступні зони в межах об’єктів організації.
      Це може бути досягнуто, наприклад, за допомогою охоронців, використання обладнання для відеоспостереження
      або використання сенсорних пристроїв. Моніторинг може підтримуватись засобами контролю аудиту журналів, такими
      як AU-2, в разі якщо журнал є частиною автоматизованої системи. До можливостей реагування на інциденти вносять
      розслідування та реагування на виявлені інциденти фізичної безпеки. До інцидентів безпеки належать, наприклад,
      порушення безпеки або підозрілі фізичні дії (доступ поза межами звичайного робочого часу; повторний доступ
      тощо).
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:pe-6.1
    ref_id: PE-6(1)
    name: Моніторинг фізичного доступу — Охоронна сигналізація та обладнання для спостереження
    category: technical
    csf_function: detect
    description: Здійснювати моніторинг фізичного доступу до об’єкта, де розміщується система, використовуючи засоби
      сигналізації та обладнання для спостереження.
    annotation: Використання сигналізації дозволяє попереджати персонал охорони про спробу несанкціонованого доступу
      на об’єкт. Система сигналізації працює у поєднанні з фізичними бар’єрами, системами відеоспостереження та
      охороною, з реагуванням коли ці заходи безпеки скомпроментовані чи порушені.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:pe-6.2
    ref_id: PE-6(2)
    name: Моніторинг фізичного доступу — Автоматичне розпізнавання вторгнень та відповідна реакція
    category: technical
    csf_function: detect
    description: 'Впровадити автоматизовані механізми для розпізнавання [Призначення: визначених організацією класів
      або типів вторгнень] та ініціювання [Призначення: визначених організацією відповідних реакцій].


      Параметри:

      1. Призначення: визначених організацією класів або типів вторгнень

      2. Призначення: визначених організацією відповідних реакцій'
    annotation: Заходи реагування можуть включати в себе оповіщення окремих співробітників організації або правоохоронних
      органів. Автоматизовані механізми, впроваджені для реагування включають системні сповіщення, електроні та
      текстові повідомлення, а також активацію механізму блокування дверей. Моніторинг фізичного доступу може бути
      скоординований з системами виявлення вторгнень та можливостями системного моніторингу, для забезпеченян комплексного
      захисту організації від загроз.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:pe-6.3
    ref_id: PE-6(3)
    name: Моніторинг фізичного доступу — Відеоспостереження
    category: technical
    csf_function: detect
    description: 'a) Впровадити відеоспостереження організацією зонами];

      b) Переглядати відеозаписи [ Призначення: з визначеною організацією частотою];

      c) Зберігати відеозапи протягом [Призначення: визначеними організацією періодами часу];


      Параметри:

      1. Призначення: з визначеною організацією частотою

      2. Призначення: визначеними організацією періодами часу'
    annotation: Це посилення стосується запису відеоспостереження з метою подальшого перегляду (за необхідністю).
      Моніторинг відеоспостереження не є обов’язковим та має впроваджуватися на розсуд організації. Необхідно брати
      до уваги можливі правові нюанси, особливо якщо таке спостереження проводиться в громадському місці.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:pe-6.4
    ref_id: PE-6(4)
    name: Моніторинг фізичного доступу — Моніторинг фізичного доступу до системи
    category: technical
    csf_function: detect
    description: 'Здійснювати моніторинг фізичного доступу до системи на додаток до моніторингу фізичного доступу
      до об’єкта в [Призначення: визначені організацією фізичні приміщення, що містять один або більше компонентів
      системи].


      Параметри:

      1. Призначення: визначені організацією фізичні приміщення, що містять один або більше компонентів системи'
    annotation: Це посилення контролю забезпечує додатковий моніторинг областей, де зосереджені компоненти системи
      (наприклад, серверні зали, зони зберігання носіїв інформації та центри зв’язку). Моніторинг фізичного доступу
      може бути скоординований з системами виявлення вторгнень та можливостями системного моніторингу, щоб забезпечити
      комплексний та інтегрований захист організації від загроз.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:pe-7
    ref_id: PE-7
    name: Контроль відвідувачів
    category: process
    csf_function: protect
    description: 'Вилучено: Включено до PE-2 і PE-3.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:pe-8
    ref_id: PE-8
    name: Реєстр доступу відвідувачів
    category: process
    csf_function: detect
    description: 'a. Вести реєстр доступу відвідувачів до об’єкта, де перебуває система, впродовж [Призначення:
      визначеного організацією періоду часу].

      b. Переглядати реєстр доступу відвідувачів [Призначення: з визначеною організацією частотою].

      c. Повідомляти про порушення в реєстрі відвідувачів [Призначення: персонал визначений організацією].


      Параметри:

      1. Призначення: визначеного організацією періоду часу

      2. Призначення: з визначеною організацією частотою

      3. Призначення: персонал визначений організацією'
    annotation: 'Реєстри доступу відвідувачів зазвичай мають містити: імена й організації відвідувачів, підписи
      відвідувачів, форми ідентифікації, дати доступу, часи в’їзду та виїзду, мету відвідувань. Перевірка реєстру
      дозволяє визначити, чи дозволи на доступ є актуальними та необхідними для пітримки завдань організації та
      її функцій. Записи доступу не є обов’язковими для публічного доступу.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:pe-8.1
    ref_id: PE-8(1)
    name: Реєстр доступу відвідувачів — Автоматизоване ведення та перегляд реєстру відвідувачів
    category: process
    csf_function: detect
    description: Впровадити автоматизовані механізми для ведення та перегляду (аналізу) реєстру відвідувачів.
    annotation: Записи про доступ відвідувачів можуть зберігатися тп підтримуватись в базі даних, доступ до якої
      має персонал організації. Автоматизований доступ до таких записів полегшує регулярний перегляд записів, щоб
      визначити, чи є дозвіл на доступ актуальним.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:pe-8.2
    ref_id: PE-8(2)
    name: Реєстр доступу відвідувачів — Реєстр фізичного доступу
    category: process
    csf_function: detect
    description: 'Вилучено: включено до PE-2.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:pe-8.3
    ref_id: PE-8(3)
    name: Реєстр доступу відвідувачів — Обмеження інформації, що ідентифікують особу
    category: process
    csf_function: detect
    description: 'Обмежте доступ до персональних даних, що міститься в реєстрі відвідувачів, та визначені в оцінці
      ризиків конфіденційності [Призначення: елементи визначені організацією].


      Параметри:

      1. Призначення: елементи визначені організацією'
    annotation: Організації можуть мати вимоги, які визначають вміст реєстрів про доступ відвідувачів. Обмеження
      персональних даних, що ідентифікують особу, в реєстрі доступу відвідувачів допомагає знизити ризики конфіденційності.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:pe-9
    ref_id: PE-9
    name: Енергетичне обладнання та кабелі
    category: technical
    csf_function: protect
    description: Захищати енергетичне обладнання і силові кабелі системи від пошкоджень і руйнувань.
    annotation: Організація визначає тип захисту, необхідний для енергетичного обладнання та кабелів, що використовуютсья
      в різних місцях. Вони можуть бути як внутрішніми так і зовнішніми по відношенню до об’єктів організації та
      середовища експлуатації. Це посилення забезпечує додатковий моніторинг областей, де є концентрація компонентів
      системи (серверні зали, зони зберігання носіїв інформації та центри зв’язку).
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:pe-9.1
    ref_id: PE-9(1)
    name: Енергетичне обладнання та кабелі — Резервні кабелі
    category: technical
    csf_function: protect
    description: 'Використовувати резервні силові кабельні системи, які фізично відокремлені на відстань [Призначення:
      визначена організацією відстань].


      Параметри:

      1. Призначення: визначена організацією відстань'
    annotation: Наявність фізично відокремлених та надлишкових силових кабелів забезпечить живлення у випадку, якщо
      один з кабелів буде пошкоджений.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:pe-9.2
    ref_id: PE-9(2)
    name: Енергетичне обладнання та кабелі — Автоматичне керування напругою
    category: technical
    csf_function: protect
    description: 'Впровадити механізми автоматичного керування напругою для [Призначення: визначених організацією
      критичних компонентів системи].


      Параметри:

      1. Призначення: визначених організацією критичних компонентів системи'
    annotation: Автоматичні контролювати й регулювати напругу.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:pe-10
    ref_id: PE-10
    name: Аварійне відключення
    category: technical
    csf_function: protect
    description: 'a. Забезпечити можливість відключення системи або окремих компонентів системи від живлення в надзвичайних
      ситуаціях.

      b. Встановити перемикачі або пристрої аварійного відключення в [Призначення: визначені організацією місця
      розташування в системі або в компоненті системи] для забезпечення безпечного та легкого доступу персоналу.

      c. Захищати механізми (систему) аварійного відключення живлення від несанкціонованої активації.


      Параметри:

      1. Призначення: визначені організацією місця розташування в системі або в компоненті системи'
    annotation: Це посилення застосовується до областей, де є концентрація компонентів системи (серверні зали, зони
      зберігання носіїв інформації та центри зв’язку).
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:pe-10.1
    ref_id: PE-10(1)
    name: Аварійне відключення — Випадкова і несанкціонована активація
    category: technical
    csf_function: protect
    description: 'Виключено: включено до PE-10.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:pe-11
    ref_id: PE-11
    name: Аварійне енергозабезпечення
    category: technical
    csf_function: recover
    description: 'Впровадити тимчасове джерело безперебійного живлення для забезпечення [Вибір (один або кілька):
      впорядковане виключення системи; перехід системи на довгострокову альтернативну систему живлення] в разі втрати
      первинного джерела живлення.


      Параметри:

      1. Вибір (один або кілька): впорядковане виключення системи; перехід системи на довгострокову альтернативну
      систему живлення'
    annotation: Джерело безперебійного живлення (ДБЖ) – це електрична система або механізм, який забезпечує аварійне
      живлення в разі виходу з ладу основного джерела живлення. ДЖБ зазвичай використовується для захисту комп’ютерів,
      центрів обробки даних, комунікаційного обладнання або іншого електричного обладнання, де несподіване відключення
      живлення може призвести до збоїв роботи, втрати даних або інформації, травм чи смертельних випадків. ДБЖ відрізняється
      від аварійної системи електроживлення або резервного генератора тим, що ДБЖ забезпечує миттєвий захист від
      перебоїв у подачі електроенергії від основного джерела живлення. Час автономного ДБЖ відносно невеликий, але
      забезпечує достатній час для запуску резервного джерела живлення, або належного вимкнення системи.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:pe-11.1
    ref_id: PE-11(1)
    name: Аварійне енергозабезпечення довгострокове альтернативне джерело живлення — Мінімальні експлуатаційні можливості
    category: technical
    csf_function: recover
    description: Забезпечити для системи наявність довгострокового альтернативного джерела живлення, яке може підтримувати
      мінімально необхідну експлуатаційну спроможність у разі тривалої втрати первинного джерела живлення.
    annotation: Це посилення може бути реалізоване, наприклад, за допомогою вторинного джерела живлення або іншого
      зовнішнього джерела живлення. Довгострокові альтернативні джерела живлення для систем організації можуть активуватися
      вручну або автоматично.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:pe-11.2
    ref_id: PE-11(2)
    name: Аварійне енергозабезпечення довгострокове альтернативне джерело живлення — Автономне живлення
    category: technical
    csf_function: recover
    description: 'Забезпечити для системи наявність довгострокового альтернативного джерела живлення, яке:

      (a) є автономним;

      (b) не залежить від зовнішнього постачання енергії;

      (c) здатне підтримувати [Вибір: мінімально необхідні операційні можливості; повна експлуатаційна здатність]
      у разі тривалої втрати первинного джерела живлення.


      Параметри:

      1. Вибір: мінімально необхідні операційні можливості; повна експлуатаційна здатність'
    annotation: Це посилення можна забезпечити, наприклад, за допомогою одного або декількох генераторів достатньої
      потужності. Довгострокові альтернативні джерела живлення можуть активуватися вручну або автоматично.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:pe-12
    ref_id: PE-12
    name: Аварійне освітлення
    category: technical
    csf_function: protect
    description: Використовувати та підтримувати системи автоматичного аварійного освітлення, які активуються в
      разі відключення електроживлення або збою та які охоплюють аварійні виходи та маршрути евакуації всередині
      об’єкта.
    annotation: Цей захід безпеки застосовується до областей, де є концентрація компонентів системи (серверні зали,
      зони зберігання носіїв інформації та центри зв’язку).
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:pe-12.1
    ref_id: PE-12(1)
    name: Аварійне освітлення — Основні завдання та функції
    category: technical
    csf_function: protect
    description: Забезпечити аварійне освітлення для всіх зон, які підтримують виконання основних завдань і функцій.
    annotation: Організація визначає свої основні функції.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:pe-13
    ref_id: PE-13
    name: Протипожежний захист
    category: technical
    csf_function: protect
    description: Використовувати та підтримувати в працездатньому стані пристрої та системи пожежогасіння й виявлення
      пожежі. Забезпечити роботу систем протипожежного захисту незалежним джерелом живлення.
    annotation: Цей захід безпеки застосовується до областей, де є концентрація компонентів системи, включно з,
      наприклад, серверними залами, зонами зберігання носіїв інформації та центрами зв’язку. До приладів або систем
      пожежогасіння, які можуть потребувати незалежного джерела енергії, належать спринклерні системи, нерухомі
      пожежні шланги та детектори диму.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:pe-13.1
    ref_id: PE-13(1)
    name: Протипожежний захист — Пристрої та системи виявлення
    category: technical
    csf_function: protect
    description: 'Використовувати такі пристрої/системи для виявлення пожежі в системі, які активуються автоматично
      та повідомляють [Призначення: визначені організацією персонал або посадові особи] та [Призначення: визначену
      організацією аварійну команду] у разі пожежі.


      Параметри:

      1. Призначення: визначені організацією персонал або посадові особи

      2. Призначення: визначену організацією аварійну команду'
    annotation: Організації можуть заздалегідь визначити персонал або ролі, яким має бути наданий доступ до необхідного
      обладнання в разі виникнення позаштатної ситуації.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:pe-13.2
    ref_id: PE-13(2)
    name: Протипожежний захист - пристрої та системи автоматичного пожежогасіння
    category: technical
    csf_function: protect
    description: '(a) Використовувати такі пристрої/системи пожежогасіння для системи, які забезпечують автоматичне
      сповіщення про будь-яку активацію [Призначення: визначені організацією персонал або ролі] і [Призначення:
      визначену організацією аварійну команду].

      (b) Впровадити системи та засоби автоматичного гасіння пожежі, коли об’єкт не укомплектований відповідним
      персоналом на постійній основі.


      Параметри:

      1. Призначення: визначені організацією персонал або ролі

      2. Призначення: визначену організацією аварійну команду'
    annotation: Організації можуть заздалегідь визначити персонал або ролі організації, яким має бути наданий доступ
      до відповідного обладнання в разі виникнення позаштатної ситуації.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:pe-13.3
    ref_id: PE-13(3)
    name: Протипожежний захист — Автоматичне пожежогасіння
    category: technical
    csf_function: protect
    description: 'Виключено: включено до PE-13(2).'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:pe-13.4
    ref_id: PE-13(4)
    name: Протипожежний захист — Перевірки
    category: technical
    csf_function: protect
    description: 'Переконатися, що об’єкт проходить перевірки пожежної безпеки [Призначення: з визначеною організацією
      частотою], переконатися, що на об’єкті усуваються виявлені недоліки в межах [Призначення: визначеного організацією
      часу].


      Параметри:

      1. Призначення: з визначеною організацією частотою

      2. Призначення: визначеного організацією часу'
    annotation: Уповноважений та кваліфікований персонал, що перебуває під юрисдикцією організації включають пожежних
      інспекторів. Організації надають супровід під час перевірок у ситуаціях, коли системи, що знаходяться на об’єкті
      містять конфіденційну інформацію.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:pe-14
    ref_id: PE-14
    name: Контроль температури та вологості
    category: technical
    csf_function: protect
    description: 'a. Підтримувати температуру та вологість у приміщенні, де розташована система в рамках [Призначення:
      визначеного організацією рівня].

      b. Контролювати рівні температури та вологості [Призначення: з визначеною організацією частотою].


      Параметри:

      1. Призначення: визначеного організацією рівня

      2. Призначення: з визначеною організацією частотою'
    annotation: Цей захід безпеки застосовується до областей, де є концентрація компонентів системи (серверні зали,
      зони зберігання носіїв інформації та центри зв’язку).
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:pe-14.1
    ref_id: PE-14(1)
    name: Контроль температури та вологості - автоматичний контроль
    category: technical
    csf_function: protect
    description: Впровадити автоматичне регулювання температури та вологості на об’єкті для запобігання потенційно
      шкідливим для інформаційної системи коливанням.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:pe-14.2
    ref_id: PE-14(2)
    name: Контроль температури та вологості - моніторинг за допомогою сигналізацій та сповіщень
    category: technical
    csf_function: protect
    description: 'Впровадити моніторинг температури та вологості з використанням засобів сигналізації або сповіщення
      до [Призначення: визначеного організацією персоналу або ролей] про потенційно небезпечні зміни для персоналу
      або обладнання.


      Параметри:

      1. Призначення: визначеного організацією персоналу або ролей'
    annotation: Сигнал тривоги або сповіщення може бути звуковим сигналом або візуальним повідомленням у режимі
      реального часу для персоналу або ролей, визначених організацією. Такі тривоги та сповіщення можуть допомагти
      мінімізувати шкоду для людей та шкоду для активів організації, сприяючи своєчасному реагуванню на інциденти.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:pe-15
    ref_id: PE-15
    name: Захист від пошкодження водою
    category: technical
    csf_function: protect
    description: Забезпечити захист інформаційної системи від пошкоджень, що виникають у разі витоку води, використовуючи
      відповідні ізоляційні або запірні клапани.
    annotation: Цей захід безпеки застосовується до областей, де є концентрація компонентів системи (серверні зали,
      зони зберігання носіїв інформації та центри зв’язку). Ізоляційні клапани можуть застосовуватися на додаток
      до або замість головних запірних клапанів для відключення подачі води в конкретних проблемних точках.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:pe-15.1
    ref_id: PE-15(1)
    name: Захист від пошкодження водою — Автоматична підтримка
    category: technical
    csf_function: protect
    description: 'Впровадити автоматизовані механізми виявлення води поблизу інформаційної системи та оповіщення
      [Призначення: визначеного організацією персоналу або ролей].


      Параметри:

      1. Призначення: визначеного організацією персоналу або ролей'
    annotation: До автоматизованих механізмів належать, наприклад, датчики виявлення води, тривожні сигнали та системи
      оповіщення.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:pe-16
    ref_id: PE-16
    name: Доставка та видалення
    category: process
    csf_function: protect
    description: 'a. Проводити авторизацію, моніторинг і контроль [Призначення: визначені організацією типи компонентів
      інформаційної системи], що входять і виходять з об’єкта;

      b. вести облік цих елементів.


      Параметри:

      1. Призначення: визначені організацією типи компонентів інформаційної системи'
    annotation: Для посилення дозволів на вхід і вихід з компонентів системи може знадобитися обмеження доступу
      до областей доставки та ізоляція областей від системи.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:pe-17
    ref_id: PE-17
    name: Альтернативне робоче місце
    category: process
    csf_function: protect
    description: 'a. Визначити та задокументувати [Призначення: визначені організацією альтернативні робочі місця],
      які дозволені для використання працівниками.

      b. Впровадити [визначені організацією заходи захисту] на альтернативних робочих місцях.

      c. Оцінити ефективність заходів захисту на альтернативних робочих місцях.

      d. Надати працівникам засоби комунікації з персоналом служби інформаційної безпеки в разі інцидентів безпеки.


      Параметри:

      1. Призначення: визначені організацією альтернативні робочі місця'
    annotation: До альтернативних робочих місць належать, наприклад, урядові установи або приватні помешкання працівників.
      Альтернативні робочі місця можуть використовуватися попри їхню територіальну відокремленість. Організації
      можуть визначати різні набори заходів захисту для конкретних альтернативних робочих місць. Цей захід пов’язаний
      з діяльністю щодо планування забезпечення безперервної роботи та відновлення функціонування.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:pe-18
    ref_id: PE-18
    name: Розташування компонентів системи
    category: process
    csf_function: protect
    description: 'Встановити компоненти інформаційної системи на об’єкті, з метою мінімізації потенційної шкоди
      від [Призначення: визначеної організацією фізичної та екологічної небезпеки], та мінімізації можливості несанкціонованого
      доступу.


      Параметри:

      1. Призначення: визначеної організацією фізичної та екологічної небезпеки'
    annotation: До фізичних та екологічних небезпек належать повені, пожежі, смерчі, землетруси, урагани, терористичні
      акти, вандалізм, інші форми електромагнітного випромінювання. Близьке розташування точок входу для авторизованих
      осіб близько до основних точок входу може збільшити ризик несанкціонованого доступу до комунікацій організації,
      включно з, наприклад, використанням бездротових снайферів або мікрофонів.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:pe-18.1
    ref_id: PE-18(1)
    name: Розташування компонентів системи — Місце розміщення об’єкта
    category: process
    csf_function: protect
    description: 'Вилучено: перенесено до PE-23.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:pe-19
    ref_id: PE-19
    name: Витік інформації
    category: technical
    csf_function: protect
    description: Забезпечити захист від витоку інформації шляхом випромінювання електромагнітних сигналів.
    annotation: Витік інформації — це навмисне чи ненавмисне розміщення даних або інформації в ненадійному середовищі.
      Засоби та порядок захисту має бути затверджений у документації щодо категорії безпеки, планах і політиках.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:pe-19.1
    ref_id: PE-19(1)
    name: Витік інформації — Національні політики та процедури щодо пемв
    category: technical
    csf_function: protect
    description: Забезпечити захист інформаційної системи, передачу даних та мережі відповідно до національних політик
      і процедур захисту від ПЕМВ на основі категорії безпеки або класифікації інформації.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:pe-20
    ref_id: PE-20
    name: Моніторинг та відстеження активів
    category: technical
    csf_function: detect
    description: 'Використовувати [Призначення: визначені організацією технології визначення місця розташування]
      для моніторингу та відстеження місця розташування та переміщення [Призначення: визначених організацією активів]
      у [Призначення: визначені організацією контрольовані зони].


      Параметри:

      1. Призначення: визначені організацією технології визначення місця розташування

      2. Призначення: визначених організацією активів

      3. Призначення: визначені організацією контрольовані зони'
    annotation: Технології розташування активів можуть допомогти організаціям забезпечити збереження критичних ресурсів,
      зокрема транспортних засобів, обладнання або основних компонентів системи в дозволених місцях. Організації
      можуть консультуватися з уповноваженими компетентними особами щодо розгортання та використання технологій
      розташування активів для розв’язання потенційних проблем приватності.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:pe-21
    ref_id: PE-21
    name: Захист від електромагнітного імпульсу
    category: technical
    csf_function: protect
    description: 'Використовувати [Призначення: визначені організацією заходи захисту] проти пошкодження електромагнітним
      імпульсом для [Призначення: визначених організацією систем].


      Параметри:

      1. Призначення: визначені організацією заходи захисту

      2. Призначення: визначених організацією систем'
    annotation: 'Електромагнітний імпульс (ЕМІ) — це короткий сплеск електромагнітної енергії, який розповсюджується
      по діапазону частот. Такі енергетичні сплески можуть бути природними або техногенними. Втручання ЕМІ може
      пошкоджувати електронне обладнання. Заходи захисту, що застосовуються для зменшення ризику ЕМІ, охоплюють:
      екранування, запобігання перенапрузі, ферорезонансні трансформатори, заземлення та інше.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:pe-22
    ref_id: PE-22
    name: Маркування компонентів
    category: process
    csf_function: protect
    description: 'Позначати [Призначення: визначені організацією апаратні компоненти], що вказують рівень впливу
      або класифікацію інформації, яка дозволена для обробки, зберігання або передачі з використанням апаратних
      компонентів.


      Параметри:

      1. Призначення: визначені організацією апаратні компоненти'
    annotation: До апаратних компонентів, які можуть потребувати маркування, належать, наприклад, пристрої введення/виведення
      інформації, багатофункціональні пристрої, копіювальні пристрої. Маркування має містити інформацію щодо атрибутів
      безпеки. Маркування зазвичай не потрібне для апаратних пристроїв, які обробляють загальнодоступну інформацію
      (проте організації можуть вимагати наявність маркування на таких апаратних компонентах). Маркування апаратних
      компонентів має відповідати чинному законодавству.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:pe-23
    ref_id: PE-23
    name: Розташування обʼєкта
    category: process
    csf_function: protect
    description: 'a. сплануйте розташування або ділянку об’єкта, де знаходиться система, враховуючи фізичні та екологічні
      ризики;

      b. для існуючих об’єктів врахуйте фізичні та екологічні ризики в організаційній стратегії управління ризиками.'
    annotation: Фізичні та екологічні ризики включають повені, пожежі, торнадо, землетруси, урагани, тероризм, вандалізм,
      електромагнітні імпульси, електричні перешкоди та інші форми вхідного електромагнітного випромінювання. Розташування
      компонентів системи на об’єкті розглядається в PE-18.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:pl-1
    ref_id: PL-1
    name: Політики та процедури планування безпеки
    category: policy
    csf_function: govern
    description: "a. Розробити, задокументувати та поширити серед [Призначення: визначеного організацією персоналу\
      \ або ролей]:\n1. [вибір (один або декілька): рівень організації; рівень місії/бізнес процесу; рівень системи]\
      \ політику планування, яка:\n\t(a) містить мету, сферу застосування, ролі, обов’язки, відповідальність керівництва,\
      \ координацію між організаційними підрозділами та системою контролю (complaince);\n\t(b) відповідає чинному\
      \ законодавству, виконавчим наказам, директивам, нормам, політикам, стандартам та керівним принципам;\n2.\
      \ процедури, що полегшують здійснення планування політики безпеки та приватності й пов’язані з ними заходи.\n\
      \nb. Призначити [Призначення: визначену організацією посадову особу] для управління політикою та процедурами\
      \ планування політики безпеки та приватності.\nc. Переглядати та оновлювати поточне планування:\n\t1. політики\
      \ планування безпеки та приватності [Призначення:з визначеною організацією частотою] та наступні [Призначення:\
      \ визначені організацією події];\n\t2. поточні процедури планування політики [Призначення: з визначеною організацією\
      \ частотою] та наступні[Призначення: визначені організацією події].\n\nПараметри:\n1. Призначення: визначеного\
      \ організацією персоналу або ролей\n2. Призначення: визначену організацією посадову особу\n3. Призначення:\
      \ з визначеною організацією частотою\n4. Призначення: визначені організацією події"
    annotation: Цей захід захисту стосується встановлення політики та процедур для ефективного здійснення заходів
      і їх посилень у класі PL. Стратегія управління ризиками є важливим фактором у встановленні політики та процедур.
      Комплексна політика та процедури допомагають забезпечити безпеку та приватність. За наявності політики, а
      також планів захисту інформації та персональних даних на рівні організації, конкретні системні політики та
      процедури можуть бути не потрібні. Політика може бути внесена до складу загальної політики безпеки та приватності
      або може бути представлена кількома політиками (у випадках складної архітектури). Процедури описують, як має
      реалізуватися політика чи заходи захисту та як вони можуть бути спрямовані на персонал або роль, яка є об’єктом
      процедури. Процедури можуть бути задокументовані в планах захисту інформації та персональних даних (як один
      або декілька документів). Події, які можуть спричинити оновлення політики та процедур планування, включають,
      але не обмежуються, висновки оцінки чи аудиту, інциденти чи порушення безпеки або зміни в законах, розпорядженнях,
      директивах, положеннях, політиках, стандартах і рекомендаціях. Просте повторне встановлення засобів контролю
      не є організаційною політикою чи процедурою.)
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:pl-2
    ref_id: PL-2
    name: Плани захисту інформації та персональних даних
    category: process
    csf_function: govern
    description: 'a. Розробити план захисту інформації та персональних даних для інформаційної системи, який:

      1. узгоджується з архітектурою підприємства організації;

      2. чітко визначає складові компоненти системи;

      3. описує оперативний контекст інформаційної системи з точки зору завдань та процесів;

      4. визначає осіб, які виконують системні ролі та обов’язки;

      5. визначає тип інформації, яка обробляється, зберігається та передається системою;

      6. надає огляд вимог безпеки та приватності інформаційної системи;

      7. описує будь які конкретні загрози системи, які викликають стурбованість організації;

      8. надає результати оцінки ризику конфіденційності для систем, в яких обробляються персональні дані;

      9. описує робоче середовище інформаційної системи та будь які залежності від систем або компонентів систем
      або підключень до таких систем та їх компонентів;

      10. надає огляд вимог безпеки та конфіденційності системи;

      11. визначає будь які відповідні контрольні базові рівні або накладання, якщо вони застосовуються;

      12. описує чинні або заплановані заходи щодо забезпечення безпеки та приватності, включно з обґрунтуванням
      рішень щодо налаштування

      13. включає виявлення ризиків для архітектури безпеки і приватності, а також проєктних рішень;

      14. включає дії, пов’язані з безпекою та конфіденційністю, які впливають на систему, виконання яких вимагає
      планування та координацію з [Призначення: визначені організацією окремі особи або групи];

      15. розглядається та затверджується уповноваженою посадовою особою або призначеним представником до початку
      реалізації плану.

      b. Поширити копії планів захисту інформації та персональних даних і повідомляти про подальші зміни планів
      серед [Призначення:визначеного організацією персоналу або ролей].

      c. Переглядати плани захисту інформації та персональних даних [Призначення: з визначеною організацією частотою].

      d. Оновлювати плани захисту інформації та персональних даних для врахування змін в інформаційній системі й
      робочому середовищі або проблем, виявлених у ході реалізації або оцінювання заходів безпеки та приватності.

      e. забезпечити захист планів захисту інформації та персональних даних від несанкціонованого розголошення та
      змін.


      Параметри:

      1. Призначення: визначені організацією окремі особи або групи

      2. Призначення: визначеного організацією персоналу або ролей

      3. Призначення: з визначеною організацією частотою'
    annotation: Плани захисту інформації та персональних даних системи охоплюють цю систему та її компоненти у визначених
      відповідними дозволами межах. Вони містять огляд вимог безпеки та приватності системи, а також заходи захисту,
      які відповідатимуть цим вимогам. Плани містять деталізований опис призначення кожного із визначених заходів
      захисту, що дозволить здійснити їх правильне впровадження та оцінити ефективність застосування. Документація
      повинна відображати вичерпну інформацію щодо впровадження заходів захисту з урахуванням їх гібридності відповідно
      до специфіки конкретної системи, а також відповідності намірам щодо функціональності такої системи. Плани
      захисту інформації та персональних даних також можуть використовуватися при проєктуванні та розробці систем
      для підтримки життєвого циклу процесів захисту інформації та персональних даних. Плани захисту інформації
      та персональних даних повинні бути живими документами, які підлягають оновленню та адаптації протягом життєвого
      циклу розробки системи (наприклад, під час визначення можливостей системи, аналізу алтернатив, відповідності
      попиту та пропозиції, а також огляди проектних рішень). Розділ 2.1 описує різні типи вимог, які мають відношення
      до організацій протягом життєвого циклу системи, а також взаємозвязок між вимогами та заходами захисту. Організація
      може розробляти єдиний для впровадження план захисту інформації та приватності або підтримувати декілька планів.
      Плани захисту інформації та приватності пов’язують вимоги щодо захисту інформації та приватності з набором
      заходів захисту та вдосконаленням контролю. Плани захисту інформації та персональних даних повинні містити
      достатню інформацію (включно зі специфікацією значень параметрів), щоб дозволити розробку та реалізацію, яка
      однозначно відповідає намірам планів і подальшому визначенню ризиків для операцій і активів організації, фізичних
      осіб, інших організацій. Це зменшує обсяг документації, пов’язаної з концепцією інформаційної безпеки. Плани
      захисту інформації та персональних даних не містять детальної інформації щодо планування безперервної роботи
      та відновлення функціонування чи інформації про реагування на інциденти, але містять достатню інформацію для
      визначення того, що необхідно виконати для реалізації заходів, визначених у цих планах. Дії, що пов’язані
      з безпекою та приватністю, охоплюють, наприклад, оцінювання безпеки та приватності, перевірки й технічне обслуговування
      програмного забезпечення, управління виправленнями та тестуваннями плану забезпечення безперервної роботи
      й відновлення функціонування. Планування та координація мають охоплювати позаштатні ситуації (природного чи
      техногенного походження). Процес, визначений організаціями для планування й координації заходів, пов’язаних
      з безпекою та приватністю, за потреби може бути внесений у політики безпеки та приватності для систем чи інших
      документів.
