  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ac-14
    ref_id: AC-14
    name: Дозволені дії без ідентифікації або автентифікації
    category: process
    csf_function: protect
    description: 'a. Визначити [Призначення: дозволені організацією дії користувачів], які можуть виконуватися в
      системі без ідентифікації або автентифікації відповідно до завдань та функцій організації.


      b. Документувати та визначити відповідне обґрунтування в плані безпеки системи дій користувача, які не потребують
      ідентифікації або автентифікації.


      Параметри:

      1. Призначення: дозволені організацією дії користувачів'
    annotation: Цей захід безпеки стосується ситуацій, коли визначено, що процедури ідентифікації або автентифікації
      не потрібні. Обмежена кількість дій користувачів (наприклад доступ до відкритих вебсайтів або доступ до інших
      відкритих систем, приймання телефонних дзвінків чи факсів). Також мають бути визначені дії, які зазвичай вимагають
      ідентифікації або автентифікації, але з певних обставин ці процедури можуть бути опущені (наприклад при доступі
      через фізичний бар’єр, який самостійно здатен забезпечити захист від несанкціонованого доступу). Цей захід
      безпеки повинен застосовуватися на етапі, коли процедури ідентифікації або автентифікації ще не були пройдені.
      Може бути визначено, що в системі немає допустимих дій користувачів, які не пройшли ідентифікацію та автентифікацію.
