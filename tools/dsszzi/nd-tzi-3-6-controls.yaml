      при наданні таких послуг, може бути корисною, коли виникає потреба зрозуміти компроміси, пов’язані з обмеженням певних
      функцій та послуг або блокуванням певних портів та протоколів.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:sa-9.3
    ref_id: SA-9(3)
    name: Зовнішні послуги для системи — Створення та підтримка довірчих відносин з постачальниками
    category: process
    csf_function: protect
    description: 'Створити, задокументувати та підтримувати довірчі відносини із зовнішніми постачальниками послуг на основі
      таких вимог, властивостей, факторів або умов: [Призначення: визначених організацією вимог, властивостей, факторів або
      умов щодо безпеки та приватності, що визначають прийнятні довірчі відносини].
  
  
  
      Параметри:
  
  
      1. Призначення: визначених організацією вимог, властивостей, факторів або умов щодо безпеки та приватності, що визначають
      прийнятні довірчі відносини'
    annotation: Довірчі відносини між організаціями та зовнішніми постачальниками послуг відображають ступінь впевненості в
      тому, що ризик від використання зовнішніх послуг знаходиться на прийнятному рівні. Довірчі стосунки можуть допомогти організаціям
      отримати підвищений рівень впевненості в тому, що постачальники послуг забезпечують адекватний захист послуг, що надаються,
      а також можуть бути корисними під час реагування на інциденти або під час планування оновлень. Довірчі відносини можуть
      бути складними через потенційно велику кількість суб’єктів, які беруть участь у взаємодії між споживачем і постачальником,
      підпорядковані відносини та рівні довіри, а також типи взаємодії між сторонами. У деяких випадках ступінь довіри ґрунтується
      на рівні контролю, який організації можуть здійснювати над зовнішніми постачальниками послуг щодо заходів захисту, необхідних
      для захисту послуги, інформації чи приватності особи. Рівень контролю встановлюється умовами контрактів або угод про рівень
      обслуговування
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:sa-9.4
