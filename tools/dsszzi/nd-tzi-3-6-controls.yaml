  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:sa-23
    ref_id: SA-23
    name: Спеціалізація
    category: process
    csf_function: protect
    description: 'Покращення [Вибір (один або кілька): проектування; модифікація; збільшення; реконфігурація] на [Призначення:
      системи або системні компоненти, визначені організацією], які підтримують важливі служби або функції для підвищення надійності
      цих систем або компонентів.
  
  
  
      Параметри:
  
  
      1. Вибір (один або кілька): проектування; модифікація; збільшення; реконфігурація
  
  
      2. Призначення: системи або системні компоненти, визначені організацією'
    annotation: Часто необхідно покращити систему або компонент системи, який підтримує важливі послуги або функції, щоб максимізувати
      надійність ресурсу. Іноді це вдосконалення виконується на рівні проектування. В інших випадках це робиться після проектування,
      або шляхом модифікації розглянутої системи, або шляхом доповнення системи додатковими компонентами. Наприклад, додаткові
      функції автентифікації або неспростування можуть бути додані до системи, щоб покращити ідентичність критичних ресурсів
      іншим ресурсам, які залежать від ресурсів, визначених організацією.
