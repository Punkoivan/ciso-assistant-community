    annotation: Принцип безпечної модифікації системи стверджує, що модифікація системи підтримує безпеку системи з огляду на
      вимоги безпеки та толерантність до ризику зацікавлених сторін. Оновлення або модифікації системи можуть перетворити безпечну
      систему на незахищену. Процедури модифікації системи гарантують, що якщо система має підтримувати свою надійність, до
      будь-яких змін в системі застосовується така ж суворість, як під час її початкової розробки. Оскільки модифікації можуть
      вплинути на здатність системи підтримувати свій безпечний стан, необхідний ретельний аналіз безпеки модифікації перед
      її впровадженням і розгортанням. Цей принцип є паралельним принципу безпечної еволюції.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:sa-8.32
    ref_id: SA-8(32)
    name: Безпека та приватність принципів інжинірингу — Достатнє документування
    category: technical
    csf_function: protect
    description: 'Запровадити принцип достатнього документування в [Призначення: визначені організацією системи або компоненти
      системи].
  
  
  
      Параметри:
  
  
      1. Призначення: визначені організацією системи або компоненти системи'
    annotation: Принцип достатнього документування стверджує, що персонал організації, відповідальний за взаємодію з системою,
      забезпечений відповідною документацією та іншою інформацією для підтримки правильного функціонування безпеки системи.
      Незважаючи на спроби дотримуватися таких принципів, як безпека з урахуванням людського фактору та прийнятна безпека, системи
      за своєю суттю є складними, а задум використання механізмів безпеки та наслідки неправильного використання або неправильної
      конфігурації механізмів безпеки не завжди інтуїтивно очевидні. Необізнані та недостатньо навчені користувачі можуть створити
      вразливі місця через помилки недогляду та вчинення неумисних дій. Наявність документації та навчання допомагає забезпечити
      обізнаність персоналу, який відіграє вирішальну роль у досягненні таких принципів, як постійний захист. Документація має
      бути написана чітко та підтримуватися навчанням, яке забезпечує обізнаність із безпекою та розуміння пов’язаних із безпекою
      обов’язків.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:sa-8.33
    ref_id: SA-8(33)
    name: Безпека та приватність принципів інжинірингу — Мінімізація
    category: technical
    csf_function: protect
    description: 'Запровадити принцип мінімізації конфіденційності за допомогою [Призначення: процеси, визначені організацією].
  
  
  
      Параметри:
  
  
      1. Призначення: процеси, визначені організацією'
    annotation: Принцип мінімізації стверджує, що організації повинні обробляти лише таку персональну інформацію, яка має безпосереднє
      відношення та необхідна для досягнення авторизованої мети, і зберігати її лише до тих пір, доки це необхідно для досягнення
      мети. В організаціях мають діяти процеси, що відповідають чинному законодавству та політикам, для впровадження принципу
      мінімізації.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:sa-9
    ref_id: SA-9
    name: Зовнішні послуги для системи
    category: process
    csf_function: protect
    description: 'a. Вимагати, щоб постачальники зовнішніх послуг для системи відповідали вимогам безпеки та приватності в організації
      та застосовували такі заходи захисту [Призначення: встановлені організацією заходи безпеки та приватності].
  
      b. Визначити та задокументувати нагляд організаціїповноваження та обов’язки користувачів щодо зовнішніх послуг для системи.
  
      c. Використовувати наступні процеси, методи та техніки для постійного моніторингу дотримання контролю зовнішніми постачальниками
      послуг: [Призначення: визначені організацією процеси, методи та техніки].
  
  
  
      Параметри:
  
  
      1. Призначення: встановлені організацією заходи безпеки та приватності
  
  
      2. Призначення: визначені організацією процеси, методи та техніки'
    annotation: Зовнішні сервіси — це ті сервіси, які реалізуються поза межами системи і надаються зовнішнім постачальником,
      де організація не має прямого контролю за впровадженням необхідних заходів захисту або оцінкою ефективності впроваджених
      заходів. Організації можуть встановлювати відносини із зовнішніми постачальниками послуг різними способами (ділове партнерство,
      контракти, міжвідомчі угоди, ліцензійні угоди, спільні підприємства та обміни ланцюгами постачання). Відповідальність
      за управління ризиками щодо використання зовнішніх послуг для системи залишається на уповноважених посадових особах. Для
      зовнішніх по відношенню до організацій послуг ланцюжок довіри вимагає, щоб організації встановили та зберігали певний
      рівень впевненості в тому, що кожен постачальник у відносинах «споживач-постачальник» забезпечує адекватний захист послуг,
      що надаються. Ступінь і характер цього ланцюга довіри змінюються залежно від відносин між організаціями та зовнішніми
      постачальниками. Організації документують основу для довірчих відносин для їх контролю. Документація зовнішніх послуг
      для системи включає державні органи, постачальників послуг, ролі та обов’язки безпеки кінцевих користувачів, а також угоди
      про рівень обслуговування. Угоди про рівень обслуговування визначають очікувані показники ефективності запроваджених заходів
      захисту, описують вимірні результати та визначають засоби правового захисту та вимоги до реагування на виявлені випадки
      невідповідності
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:sa-9.1
