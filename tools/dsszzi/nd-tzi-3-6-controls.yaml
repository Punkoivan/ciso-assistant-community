    annotation: 'Для збільшення зручності можливо повідомити


      користувачів про завершення поточного сеансу. У разі потреби продовження роботи користувач має направити запит
      на подовження сеансу. Період часу завершення сеансу, що очікує, базується на параметрах, визначених у базовому
      контролі AC-12.'
