  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ra-5
    ref_id: RA-5
    name: Сканування вразливостей
    category: technical
    csf_function: identify
    description: 'a. Сканувати на наявність вразливостей в інформаційній системі та інстальованих застосунках [Призначення:
      з визначеною організацією частотою та/або випадково відповідно до визначеного організацією процесу] і коли виявляються
      нові вразливості, які потенційно впливають на інформаційну систему.
  
      b. Використовувати інструменти та методи сканування вразливості, які полегшують сумісність між інструментами та автоматизують
      частини процесу управління вразливостями, використовуючи стандарти для:
  
      1. обліку платформ, недоліків програмного забезпечення та неправильних конфігурацій;
  
      2. форматування контрольних списків і процедур тестування;
  
      3. вимірювання впливу вразливості.
  
      c. Аналізувати звіти про сканування вразливості та результати контрольних оцінювань.
  
      d. Виправити наявні вразливості [Призначення: визначений організацією час відгуку] відповідно до організаційної оцінки
      ризику.
  
      e. Ділитися інформацією, отриманою в процесі сканування вразливостей та контрольного оцінювання серед [Призначення: визначеного
      організацією персоналу або ролей], щоб допомогти усунути подібні вразливі місця в інших системах.
  
      f. Використовувати інструменти сканування вразливості, які містять можливість легко оновлювати вразливості, що були проскановані.
  
  
  
      Параметри:
  
  
      1. Призначення: з визначеною організацією частотою та/або випадково відповідно до визначеного організацією процесу
  
  
      2. Призначення: визначений організацією час відгуку
  
  
      3. Призначення: визначеного організацією персоналу або ролей'
    annotation: 'Категоріювання безпеки інформації та систем проводиться на основі сканування вразливостей. Щоб не пропустити
      потенційні джерела вразливостей, таких як компоненти інфраструктури (наприклад, комутатори, маршрутизатори, захисники,
      датчики), мережеві принтери, сканери та копіювальні пристрої, організації визначають необхідний рівень моніторингу вразливостей
      для компонентів системи. Швидке оновлення засобів моніторингу вразливостей у випадку виявлення та анонсування нових вразливостей,
      а також при розробці нових методів сканування, допомагає забезпечити ефективне виявлення нових вразливостей, що можуть
      залишитися непоміченими засобами моніторингу вразливостей, що вже використовуються. Щоб якомога швидше виявляти та усувати
      потенційні вразливості системи, важливо підтримувати постійний процес оновлення засобів моніторингу вразливостей. Для
      моніторингу та аналізу вразливостей спеціалізованого програмного забезпечення можуть застосовуватися різні підходи, такі
      як: статичний аналіз – передбачає аналіз вихідного коду програми без його запуску. Застосовується для виявлення можливих
      проблем у програмному коді, таких як помилки в синтаксисі, можливі вразливості безпеки, недостатньо оптимізований код
      тощо; динамічний аналіз – передбачає аналіз програми при її виконанні. Застосовується для виявлення потенційних помилок
      в програмі, таких як вразливості безпеки, падіння програми, невірний вихід програми тощо. Цей метод дозволяє отримати
      більш точну інформацію про поведінку програми за час її виконання; бінарний аналіз – метод аналізу файлів, що виконуються.
      Це дозволяє виявляти потенційні вразливості та помилки в програмах, не маючи доступу до вихідного коду. Такий метод може
      використовуватися для аналізу програм, які вже розгорнуті в середовищі виробництва або для виявлення вразливостей у сторонньому
      програмному забезпеченні; гібридний підхід, який комбінує у собі ці три підходи. Організації можуть використовувати ці
      методи аналізу під час огляду вихідного коду та в різних інструментах, включаючи вебпрограми для сканування додатків,
      статичні засоби аналізу та бінарні аналізатори. Моніторинг вразливостей включає сканування рівня оновлення заходів безпеки,
      сканування функцій, портів, протоколів та служб, до яких не повинен мати доступ користувач або пристрій, а також сканування
      механізмів керування потоками, які неправильно налаштовані або працюють некоректно. Можливість постійного аналізу компонентів
      (різноманітних програмних модулів, бібліотек, оперативних систем, мережевих пристроїв, баз даних, сервісів, веб-додатків,
      аплікацій, протоколів та інших складових системи) за допомогою інструментів постійного моніторингу вразливостей також
      може бути включена в процес моніторингу вразливостей. Інструментальні засоби можуть покращити точність виявлення вразливостей
      та застосовуватися в усій організації без необхідності їхнього сканування. Інструменти моніторингу вразливостей, які сприяють
      інтероперабельності, повинні бути підтверджені протоколом автоматизованого забезпечення безпеки (Security Content Automated
      Protocol, SCAP). Таким чином, організації розглядають можливість використання інструментів сканування, які вказують на
      вразливості відповідно до умовних назв вразливостей (Common Vulnerabilities and Exposures (CVE) та використовують мову
      Open Vulnerability Assessment Language (OVAL) для визначення наявності вразливостей. Для отримання інформації про вразливості
      використовуються такі джерела, як перелік Common Weakness Enumeration (CWE) та Національна база даних вразливостей (NVD).
      Оцінки контролю, такі як заходи «червоної команди», надають додаткові джерела потенційних вразливостей, які необхідно
      сканувати. У цьому контексті "червона команда" - це термін, який використовується для позначення групи людей, які намагаються
      знайти вразливості в системі або мережі, використовуючи техніки та інструменти, що можуть використовувати зловмисники.
      Отже, контрольні оцінки, які проводить "червона команда", можуть виявляти потенційні вразливості, які не були виявлені
      засобами моніторингу вразливостей, і ці вразливості також потрібно сканувати. Організації також розглядають можливість
      використання інструментів сканування, які вказують на наслідки вразливостей за допомогою системи оцінювання вразливостей
      (Common Vulnerability Scoring System (CVSS). Моніторинг вразливості включає канал та процес отримання повідомлень про
      вразливості безпеки від широкої громадськості. Надання повідомлень про вразливості може бути дуже простим - наприклад,
      опублікувати адресу електронної пошти або створити веб-форму, яка моніторить та приймає повідомлення. Ці повідомлення
      можуть стосуватися заявок на добровільне тестування системи на вразливість або про повідомлення про проблеми з безпекою,
      що були виявлені. Організації зазвичай припускають, що дослідження, спрямовані на пошук вразливостей в їхніх системах,
      відбуваються з чи без їх згоди. Щоб забезпечити більш високу ймовірність того, що про вразливості буде повідомлено безпосередньо
      організацію для їх подальшого усунення, організації можуть використовувати публічні канали для сповіщення про такі вразливості.
      Організації також можуть використовувати фінансові стимули (також відомі як "винагороди за виправлення помилок"), щоб
      додатково заохочувати зовнішніх дослідників безпеки повідомляти про виявлені вразливості. Програми винагород за виправлення
      помилок можуть бути адаптовані під потреби організації. Винагороди можуть надаватися на постійній основі або протягом
      певного періоду часу і бути запропоновані як широкому загалу, так і підібраним групам осіб. Організації можуть одночасно
      запускати публічні та приватні програми винагород ("bug bounty") і вибирати певних учасників, яким можуть надавати частковий
      доступ з високопривілейованих точок, щоб оцінити вразливості з точок зору привілейованого користувача.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ra-5.1
    ref_id: RA-5(1)
    name: Сканування вразливостей — Оновлення можливостей інструменту
    category: technical
    csf_function: identify
    description: 'Вилучено: включено до RA-5.'
    annotation: null
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ra-5.2
    ref_id: RA-5(2)
    name: Сканування вразливостей — Оновлення за частотою, перед новим скануванням або при ідентифікації
    category: technical
    csf_function: identify
    description: 'Оновлювати перелік вразливостей системи, що були проскановані [Вибір: один або більше]; [Призначення: з визначеною
      організацією частотою; перед новим скануванням; коли виявлені та зареєстровані нові вразливості].
  
  
  
      Параметри:
  
  
      1. Вибір: один або більше
  
  
      2. Призначення: з визначеною організацією частотою; перед новим скануванням; коли виявлені та зареєстровані нові вразливості'
    annotation: Через складність сучасного програмного забезпечення, систем та інших компонентів, нові вразливості до атак виникають
      постійно. Тому, важливо включати будь-які нові виявлені вразливості до списку вразливостей для перевірки, щоб організація
      могла негайно вжити заходів для зниження ризиків, пов'язаних з цими вразливостями.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ra-5.3
    ref_id: RA-5(3)
    name: Сканування вразливостей — Широта та глибина покриття
    category: technical
    csf_function: identify
    description: Запровадити процедури сканування вразливостей, які дозволять визначити широту й глибину покриття.
    annotation: Широту охоплення сканування вразливостей можна виразити у відсотках компонентів в межах системи, за конкретними
      типами систем, за критичністю систем або за кількістю вразливостей, які необхідно перевірити. Глибина охоплення сканування
      на вразливість може бути виражена як рівень системи, що підлягає моніторингу організацією (наприклад, компонент, модуль,
      підсистема, елемент). Організації можуть визначити, наскільки детально потрібно сканувати систему на вразливості, враховуючи
      власну готовність приймати ризики та інші фактори, які можуть впливати на безпеку їхньої системи. Інструменти сканування
      та їх конфігурація можуть впливати на рівень деталізації та охоплення. Для досягнення бажаного рівня деталізації та охоплення
      можуть знадобитись кілька інструментів сканування. [SP 800-53A] надає додаткову інформацію про ширину та глибину охоплення.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ra-5.4
    ref_id: RA-5(4)
    name: Сканування вразливостей — Виявна інформація
    category: technical
    csf_function: identify
    description: 'Визначити непередбачено-виявну інформацію про інформаційну систему та застосувати [Призначення: визначені
      організацією коригувальні дії].
  
  
  
      Параметри:
  
  
      1. Призначення: визначені організацією коригувальні дії'
    annotation: Доступна інформація - це інформація, яку можуть отримати зловмисники, не використовуючи для цього шкідливі методи,
      такі як спроби несанкціонованого доступу до системи, де зберігається ця інформація. Замість цього вони можуть використовувати
      інші методи, такі як збір відкритої інформації або високо-розумні пошукові запити. До заходів з протидії можуть входити
      оповіщення персоналу організації, видалення позначеної інформації, внесення зсмін до системи, щоб ускладнити доступ зловмисника
      до позначеної інформації. Це вдосконалення не враховує умисно доступну інформацію, яка може бути включена в можливість
      встановлення пасток (наприклад, honeypots, honeynets, deception nets), що були розгорнуті організацією.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ra-5.5
    ref_id: RA-5(5)
    name: Сканування вразливостей — Привілейований доступ
    category: technical
    csf_function: identify
    description: 'Реалізувати авторизацію привілейованого доступу до [Призначення: визначених організацією компонентів системи]
      для [Призначення: визначеної організацією діяльності з виявлення вразливостей].
  
  
  
      Параметри:
  
  
      1. Призначення: визначених організацією компонентів системи
  
  
      2. Призначення: визначеної організацією діяльності з виявлення вразливостей'
    annotation: У певних випадках сканування на вразливості може бути більш інтенсивним, або компонент системи, що є об'єктом
      сканування, може містити інформацію з обмеженим доступом або персональні дані. Надання привілейованого доступу до певних
      компонентів системи дозволяє проводити більш детальне сканування на вразливості та забезпечує захист конфіденційності
      такого сканування.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ra-5.6
    ref_id: RA-5(6)
    name: Сканування вразливостей — Автоматизований аналіз тенденцій
    category: technical
    csf_function: identify
    description: Впровадити автоматизовані механізми для порівняння результатів сканування вразливостей з часом, щоб визначити
      тенденції вразливості системи.
    annotation: Використання автоматизованих механізмів для аналізу кількох сканувань на вразливості з часом може допомогти
      виявити тенденції у вразливості системи та встановити схеми атак.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ra-5.7
    ref_id: RA-5(7)
    name: Сканування вразливостей — Автоматизоване виявлення та сповіщення про неавторизовані компоненти
    category: technical
    csf_function: identify
    description: 'Вилучено: включено до CM-8.'
    annotation: null
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ra-5.8
    ref_id: RA-5(8)
    name: Сканування вразливостей — Огляд журналів аудиту за минулі періоди
    category: technical
    csf_function: identify
    description: 'Переглядати журнали аудиту за минулі періоди, щоб визначити, чи була вразливість, яка виявлена в [Призначення:
      системі, визначеній організацією], була використана до її виявлення протягом [Призначення: визначеного організацією періоду
      часу].
  
  
  
      Параметри:
  
  
      1. Призначення: системі, визначеній організацією
  
  
      2. Призначення: визначеного організацією періоду часу'
    annotation: Перевірка історичних аудит-логів може бути корисною для проведення дослідження, оскільки вона дозволяє встановити,
      чи була нещодавно виявлена вразливість в системі використана зловмисником у минулому. Це може надати важливу інформацію
      для аналізу подій та подальшого покращення захисту системи. Такий аналіз може допомогти визначити, наприклад, масштаб
      попереднього кібератаки, методику, використану під час атаки, викрадену або змінену інформацію, що належить організації,
      підірвані можливості місії або бізнесу та тривалість атаки.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ra-5.9
    ref_id: RA-5(9)
    name: Сканування вразливостей — Тестування на проникнення
    category: technical
    csf_function: identify
    description: 'Вилучено: включено до CA-8.'
    annotation: null
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ra-5.10
    ref_id: RA-5(10)
    name: Сканування вразливостей — Зіставлення інформації про сканування
    category: technical
    csf_function: identify
    description: Порівнувати результати сканування вразливостей для визначення наявності численних вразливостей на множинних
      векторів атак.
    annotation: Вектор атаки — це шлях або засіб, за допомогою якого зловмисник може отримати доступ до системи, щоб доставити
      шкідливий код або викрасти інформацію. Організації можуть використовувати дерева атак, щоб показати, як ворожі дії супротивників
      взаємодіють і поєднуються, щоб спричинити несприятливий вплив або негативні наслідки для систем і організацій. Така інформація,
      разом із корельованими даними з інструментів сканування вразливостей, може забезпечити більшу ясність щодо векторів атак
      із кількома вразливими місцями та кількома переходами. Кореляція інформації про сканування вразливостей особливо важлива,
      коли організації переходять від старих технологій до новіших (наприклад, переходять від мережевих протоколів IPv4 до IPv6).
      Під час таких переходів деякі системні компоненти можуть ненавмисно залишитися некерованими, що створює можливості для
      використання зловмисниками.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ra-5.11
    ref_id: RA-5(11)
    name: Сканування вразливостей — Програма публічного оприлюднення
    category: technical
    csf_function: identify
    description: Встановіть публічний канал для отримання повідомлень про вразливості в системах організації і компонентах системи.
    annotation: Канал повідомлень є загальнодоступним і містить чіткі формулювання, які дозволяють добросовісно дослідити та
      розкрити вразливості організації. Організація не обумовлює свій дозвіл очікуванням безстрокового нерозголошення суб’єктом,
      що звітує, але може вимагати певний період часу для належного усунення вразливості.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ra-6
    ref_id: RA-6
    name: Заходи протидії технічній розвідці
    category: process
    csf_function: identify
    description: 'Використовувати заходи ПДТР за [Призначення: визначені організацією місця] [Вибір (один або кілька): [Призначення:
      з визначеною організацією частотою]; [Призначення: за визначеними організацією подіями або показниками]].
  
  
  
      Параметри:
  
  
      1. Призначення: визначені організацією місця
  
  
      2. Вибір (один або кілька): [Призначення: з визначеною організацією частотою]; [Призначення: за визначеними організацією
      подіями або показниками]'
    annotation: Заходи ПДТР мають впроваджуватися кваліфікованим персоналом. Організації використовують заходи ПДТР для виявлення
      наявності приладів технічного спостереження, а також для виявлення недоліків технічного захисту інформації. Крім того,
      заходи ПДТР забезпечують оцінювання стану технічного захисту інформації та об’єктів і охоплюють ретельну візуальну, електронну
      та фізичну перевірку об’єктів, що обстежуються. Аналіз заходів ПДТР надає інформацію для оцінювання ризиків і критичної
      інформації організації щодо впливу на організацію потенційних порушників.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ra-7
    ref_id: RA-7
    name: Реагування на ризик
    category: process
    csf_function: identify
    description: Реагувати на результати оцінювання, моніторингу й аудиту безпеки та приватності.
    annotation: 'До варіантів реагування на ризик належать: зменшення ризику шляхом впровадження нових заходів захисту або посилення
      наявних заходів; прийняття ризику з відповідним обґрунтуванням; обмін, перенесення ризику або відхилення ризику. Організаційна
      толерантність до ризику впливає на рішення та дії щодо реагування на ризик. Цей захід захисту визначає необхідність проведення
      відповідного реагування на ризик до того, як буде сформовано план дій. Наприклад, може бути ухвалене рішення про прийняття
      ризику або відхилення ризику, або про можливість негайно пом’якшити ризик. Тому план дій і введення важливих етапів не
      потрібні. Однак якщо реакція на ризик є пом’якшення ризику, а пом’якшення не може бути завершено негайно, формується план
      дій та вказівки про основні його етапи.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ra-8
    ref_id: RA-8
    name: Оцінювання впливу на приватність
    category: process
    csf_function: identify
    description: 'Проводити оцінювання впливу на приватність інформаційних систем, програм або інших заходів, які становлять
      ризик приватності перед тим, як:
  
      a. розробити або закупити інформаційні технології, які збирають, підтримують чи поширюють критичну інформацію;
  
      b. ініціювати створення нових архівів інформації, яка:
  
      1. буде зібрана, збережена чи розповсюджена за допомогою інформаційних технологій;
  
      2. містить персональні дані, які дозволяють встановити фізичне або онлайнз’єднання з конкретною особою.'
    annotation: 'Оцінювання впливу на приватність — це аналіз того, яким чином відбувається управління інформацією для забезпечення:
      відповідності такого управління чинним законодавчим і регуляторним вимогам щодо приватності; визначення супутніх ризиків
      приватності та наслідків збору, використання, обробки, зберігання, поширення персональних даних; визначення та оцінювання
      механізмів захисту й альтернативних процесів управління інформацією для зменшення потенційних проблем приватності. Оцінювання
      впливу на приватність подається у вигляді офіційного документа, який містить деталізацію процесу та результати аналізу.
      Для проведення аналізу організації використовують процеси оцінювання ризиків. Організації проводять та розробляють оцінку
      впливу на приватність з достатньою ясністю та конкретністю, щоб продемонструвати, що організація повністю врахувала вимоги
      щодо забезпечення приватності та включила відповідні заходи забезпечення приватності від початкових етапів діяльності
      організації та протягом життєвого циклу інформації. Для здійснення ефективної оцінки впливу на приватність, вища посадова
      особа з питань приватності організації співпрацює з менеджерами програм, власниками систем, фахівцями з інформаційних
      технологій, представниками служби безпеки, юристами та іншими працівниками організації, які мають відповідну компетенцію.
      Крім того, оцінка впливу на приватність не є обмеженою в часі діяльністю, яка обмежена певним етапом життєвого циклу інформаційної
      системи або персональних даних. Натомість, аналіз приватності продовжується протягом життєвого циклу інформаційної системи
      та персональних даних. Тому, оцінка впливу на приватність є живим документом, який організації оновлюють кожного разу,
      коли змінюються інформаційні технології, практики організації або інші фактори, які змінюють ризики приватності, пов''язані
      з використанням таких інформаційних технологій. Для проведення оцінки впливу на приватність організації можуть використовувати
      оцінювання ризиків з питань безпеки та приватності. Організації також можуть використовувати інші відповідні процеси з
      різними назвами, включаючи аналіз ризиків приватності. Публікація результатів оцінки впливу на приватність може бути засобом
      інформування громадськості про практики організації щодо захисту приватності. Хоча проведення та публікація оцінки впливу
      на приватність можуть бути вимогами законодавства, організації можуть також створювати такі політики для внутрішнього
      використання, незалежно від наявності відповідних вимог законодавства. Для державних установ оцінка впливу на приватність
      може бути обов''язковою згідно з [EGOV]. Установи повинні отримати консультації від своєї старшої посадової особи з питань
      приватності та юрисконсультанта щодо необхідності проведення оцінки впливу на приватність відповідно до вимог [EGOV].
      Крім того, вони мають мати на увазі статутні виключення та рекомендації OMB щодо надання такої оцінки.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ra-9
    ref_id: RA-9
    name: Аналіз критичності
    category: process
    csf_function: identify
    description: 'Визначити критичні компоненти інформаційної системи та функції, виконавши аналіз критичності для [Призначення:
      визначених організацією систем, компонентів системи або послуг для системи] в [Призначення: визначенні організацією точки
      ухвалення рішень у життєвому циклі розробки системи].
  
  
  
      Параметри:
  
  
      1. Призначення: визначених організацією систем, компонентів системи або послуг для системи
  
  
      2. Призначення: визначенні організацією точки ухвалення рішень у життєвому циклі розробки системи'
    annotation: Не всі системні компоненти, функції чи служби обов’язково потребують посиленого захисту. Аналіз критичності
      є ключовим принципом управління ризиками в ланцюгах постачання та надає інформацію про пріоритетність заходів захисту.
      Визначення критичних компонентів і функцій системи має враховувати чинні норми, директиви, політики, стандарти та вказівки,
      вимоги щодо функціональності системи, інтерфейсів систем і компонентів, а також залежностей систем і компонентів. Системні
      інженери мають проводити комплексну функціональну декомпозицію системи для виявлення важливих для місії функцій і компонентів.
      Функціональна декомпозиція містить визначення основних місій організації, що підтримуються системою, декомпозицію на конкретні
      функції для виконання цих місій, а також відстеження компонентів апаратного та програмного забезпечення. Це означає, що
      проводиться аналіз місій, які система повинна виконувати, щоб ідентифікувати конкретні функції, необхідні для досягнення
      цих місій. Також проводяться пошуки зв'язків між цими функціями та компонентами обладнання, програмного та апаратного
      забезпечення, які забезпечують виконання цих функцій. Це також охоплює випадки, коли декілька компонентів, які належать
      до однієї системи, взаємодіють для виконання певних функцій. Критичність системи або її компонентів може залежати від
      їхнього операційного середовища, зокрема від зв'язків та залежностей від інших кіберфізичних систем, пристроїв та послуг
      ІТ, що можуть бути підключені до системи, а також залежностей від інших систем, з якими вона може взаємодіяти. Компоненти
      системи, які дають безпосередній доступ до критичних компонентів або функцій системи, є критичними через внутрішні вразливості,
      які вони створюють. Оцінка критичності компонентів та функцій ґрунтується на тому, як відмова компонентів або функцій
      може вплинути на виконання місій, які підтримує система, що містить ці компоненти та функції. Аналіз критичності виконується
      під час розробки, модифікації або оновлення архітектури чи проекту. Якщо провести аналіз критичності на ранніх етапах
      життєвого циклу розробки системи, організації можуть внести зміни до проекту системи з метою зменшення критичності окремих
      компонентів та функцій, наприклад, шляхом додавання резервних елементів або альтернативних шляхів при проектуванні системи
      системи. Аналіз критичності також може впливати на заходи захисту, необхідні розробникам-підрядникам. Крім того, важливим
      аспектом є проведення аналізу критичності інформації, нарівні з аналізом критичності систем, її компонентів та сервісів.
      Такий аналіз проводиться в рамках категоризації безпеки в RA-2.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ra-10
    ref_id: RA-10
    name: Активний пошук загроз
    category: technical
    csf_function: detect
    description: 'a. Створити та підтримувати можливості активного пошуку кіберзагроз:
  
      1. пошук індикаторів компроментації в системах організації;
  
      2. виявлення, відстеження та знищення загроз, які можуть обходити існуючі засоби контролю безпеки.
  
      b. використовуйте можливості активного пошуку загроз [Призначення: частота, визначена організацією].
  
  
  
      Параметри:
  
  
      1. Призначення: частота, визначена організацією'
    annotation: Активний пошук загроз – це засіб кіберзахисту, який відмінний від традиційних заходів захисту, таких як брандмауери,
      системи виявлення та запобігання вторгненням, карантин шкідливого коду в пісочницях, а також технології та системи керування
      інформацією про безпеку та подіями. Активний пошук кіберзагроз передбачає проактивний пошук систем організації, мереж
      та інфраструктури на наявність складних загроз. Мета полягає в тому, щоб відслідковувати та перешкоджати кіберзлочинцям
      якомога раніше в послідовності атак і відчутно підвищити швидкість і точність реагування організацій на них. Ознаками
      компрометації є незвичайний мережевий трафік, незвичні зміни файлів і наявність шкідливого коду. Команди пошуку загроз
      використовують наявні дані про загрози та можуть створювати нові дані про загрози, які надають іншим організаціям обміну
      та аналізу інформації (ISAO), центрам обміну та аналізу інформації (ISAC), а також відповідним урядовим департаментам
      і установам.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:sa-1
    ref_id: SA-1
    name: Політика та процедури придбання системи та послуг
    category: policy
    csf_function: govern
    description: "a. Розробити, задокументувати та поширити серед [Призначення: визначеного організацією персоналу або ролей]:\n\
      1. [Вибір (один або декілька): рівень організації; рівень місії/бізнес-процесу; рівень системи] політики придбання систем\
      \ і послуг, яка:\n\t(a) містить мету, сферу застосування, ролі, обов’язки, відповідальність керівництва, координацію між\
      \ організаційними підрозділами та систему контролю (complaince);\n\t(b) відповідає чинному законодавству, виконавчим наказам,\
      \ директивам, нормам, політикам, стандартам і рекомендаціям.\n2. Процедури, що полегшують впровадження політики та заходів\
      \ придбання систем і послуг.\nb. Призначити [Призначення: визначену організацією посадову особу] для управління політикою\
      \ та процедурами придбання системи та послуг.\nc. Переглядати й оновлювати поточні політику та процедури придбання систем\
      \ та послуг:\n1. Поточну політику придбання системи та послуг [Призначення: з визначеною організацією частотою].\n2. Поточні\
      \ процедури придбання системи та послуг [Призначення: з визначеною організацією частотою] та наступні [Призначення: події,\
      \ визначені організацією].\n\n\nПараметри:\n\n1. Призначення: визначеного організацією персоналу або ролей\n\n2. Вибір\
      \ (один або декілька): рівень організації; рівень місії/бізнес-процесу; рівень системи\n\n3. Призначення: визначену організацією\
      \ посадову особу\n\n4. Призначення: з визначеною організацією частотою\n\n5. Призначення: події, визначені організацією"
    annotation: Цей захід захисту стосується встановлення політики та процедур для ефективного здійснення заходів і їх посилень
      у класі SA. Стратегія управління ризиками є важливим фактором у встановленні політики та процедур. Комплексна політика
      та процедури допомагають забезпечити безпеку та приватність. За наявності політики, а також планів захисту інформації
      та персональних даних на рівні організації, конкретні системні політики та процедури можуть бути не потрібні. Політика
      може бути внесена до складу загальної політики безпеки та приватності або може бути представлена кількома політиками (у
      випадках складної архітектури). За потреби можна встановити процедури для програм безпеки та приватності, для місії чи
      бізнес-процесів, а також для систем. Процедури описують, як має реалізуватися політика чи заходи захисту та як вони можуть
      бути спрямовані на персонал або роль, що є об’єктом процедури. Процедури можуть бути задокументовані в планах захисту
      інформації та персональних даних (як один або декілька документів). Події, які можуть спричинити оновлення політики та
      процедур придбання систем та послуг, включають висновки оцінювання або аудиту, інциденти чи порушення безпеки або зміни
      в законах, розпорядженнях, директивах, положеннях, політиках, стандартах і рекомендаціях. Просте повторне встановлення
      заходів захисту не є організаційною політикою чи процедурою.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:sa-2
    ref_id: SA-2
    name: Розподіл ресурсів
    category: process
    csf_function: govern
    description: 'a. Визначити вимоги щодо інформаційної безпеки та приватності для систем або послуг для системи при плануванні
      завдань та процесів.
  
      b. Визначити, задокументувати та розподілити ресурси, які необхідні для захисту систем або послуг для системи у рамках
      процесу фінансового планування в організації та управління інвестиціями.
  
      c. Створити окрему позицію бюджету для фінансування заходів із забезпечення інформаційної безпеки та приватності.'
    annotation: Розподіл ресурсів для інформаційної безпеки та приватності стосується фінансування для придбання систем та послуг,
      фінансування обслуговування та забезпечення ланцюга постачання протягом усього життєвого циклу системи.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:sa-3
    ref_id: SA-3
    name: Життєвий цикл розробки системи
    category: process
    csf_function: govern
    description: 'a. Придбати, розробити та керувати системою, використовуючи [Призначення: визначений організацією життєвий
      цикл розробки], який охоплює питання захисту інформації та приватності.
  
      b. Визначити та задокументувати роль і обов’язки із забезпечення безпеки та приватності інформації протягом усього життєвого
      циклу розробки системи.
  
      c. Визначити осіб, які мають повноваження та обов’язки в області інформаційної безпеки та приватності.
  
      d. Інтегрувати процес управління інформаційною безпекою та приватністю в процеси життєвого циклу розробки системи.
  
  
  
      Параметри:
  
  
      1. Призначення: визначений організацією життєвий цикл розробки'
    annotation: Процес життєвого циклу розробки системи надає основу для успішного розвитку, впровадження та функціонування
      систем. Для застосування необхідних заходів захисту протягом усього життєвого циклу розробки системи потрібне базове розуміння
      інформаційної безпеки та приватності, загроз, уразливостей, несприятливих наслідків і ризиків для критичних місій та функцій.
      Принципи, які описані в SA-8, допомагають правильно розробляти, кодувати й тестувати системи та компоненти системи. До
      процесів життєвого циклу розробки системи мають бути залучені кваліфіковані працівники служби безпеки інформації, а також
      інші посадові особи, які мають відношення до питань проєктування та розгортання систем. За необхідності може проводитися
      додаткове навчання на базі ролей. Ефективна інтеграція вимог безпеки та приватності в архітектурі організації також допомагає
      гарантувати, що важливі питання безпеки та приватності враховуються протягом життєвого циклу системи та що ці міркування
      безпосередньо пов’язані з місією організації та бізнес-процесами. Цей процес також полегшує інтеграцію архітектур інформаційної
      безпеки та приватності в архітектурі організації відповідно до плану (стратегії) управління ризиками організації. Оскільки
      життєвий цикл розробки системи охоплює безліч організацій, включно з, наприклад, зовнішніми постачальниками, розробниками
      та постачальниками послуг, важливо усвідомити, що функції управління (та управління ризиками) в ланцюгах постачання та
      контролю відіграють значну роль у загальній ефективності управління системою протягом цього життєвого циклу розробки.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:sa-3.1
    ref_id: SA-3(1)
    name: Життєвий цикл розробки системи — Управління середовищем розробки
    category: process
    csf_function: govern
    description: Забезпечити захист середовища розробки системи, відповідно до ризиків протягом усього життєвого циклу розробки
      системи для системи, компонентів системи або служб.
    annotation: Передвиробниче середовище включає середовища розробки, тестування та інтеграції. Аналіз критичності та застосування
      заходів захисту розробниками також сприяють створенню безпечнішого середовища розробки системи.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:sa-3.2
    ref_id: SA-3(2)
    name: Життєвий цикл розробки системи — Використання реальних даних
    category: process
    csf_function: govern
    description: '(a) Затвердити, задокументувати та контролювати використання реальних даних у середовищах розробки, тестування
      та інтеграції системи, компонента системи або послуг для системи.
  
      (b) Захистити середовище розробки для системи, системного компонента або системної служби на тому ж рівні впливу або класифікації,
      що й будь-які реальні дані, що використовуються в середовищі розробки.'
    annotation: Реальні дані також називаються оперативними даними. Використання реальних даних у виробничих середовищах може
      призвести до значного ризику для організацій. Крім того, використання персональних даних під час тестування, досліджень
      і навчання підвищує ризик несанкціонованого розголошення або неправомірного використання таких даних. Тому для організації
      важливо керувати будь-якими додатковими ризиками, які можуть виникнути в результаті використання поточних або оперативних
      даних. Організації можуть мінімізувати такий ризик, використовуючи тестові дані під час проєктування, розробки й тестування
      систем, компонентів системи та сервісів. Методи оцінки ризику можуть бути використані, щоб визначити, чи є ризик використання
      реальних чи оперативних даних прийнятним.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:sa-3.3
    ref_id: SA-3(3)
    name: Життєвий цикл розробки системи — Оновлення технологій
    category: process
    csf_function: govern
    description: Планувати та впровадити графік оновлення технологій для підтримки системи протягом усього життєвого циклу розробки
      системи.
    annotation: 'Планування оновлення технологій може охоплювати апаратне та програмне забезпечення, процеси, персонал, постачальників
      послуг і обладнання. Використання застарілої технології може збільшити ризики безпеки та приватності, пов’язані з: непідтримуваними
      компонентами; підробленими або перепрофільованими компонентами, компонентами, які не відповідають вимогам безпеки чи приватності,
      повільними або непрацездатними компонентами, компонентами з ненадійних джерел, випадковою помилкою персоналу або підвищеною
      складність. Технологічні оновлення зазвичай відбуваються на стадії експлуатації та обслуговування життєвого циклу розробки
      системи.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:sa-4
    ref_id: SA-4
    name: Процес закупівель
    category: process
    csf_function: govern
    description: 'Включіть такі вимоги, описи та критерії, явно або за допомогою посилання, використовуючи [Вибір (один або
      більше): стандартні пункти контракту; [Призначення: пункти контракту, визначені організацією]] в контракті про придбання
      системи, системного компонента або системної послуги:
  
      a. функціональні вимоги безпеки та приватності;
  
      b. вимоги до стійкості механізму;
  
      c. вимоги до забезпечення безпеки та приватності;
  
      d. заходи захисту для забезпечення вимог безпеки та приватності;
  
      e. вимоги до захисту документації з безпеки та приватності;
  
      f. опис середовища розробки системи та середовища, у якому система призначена для роботи;
  
      g. розподіл відповідальності або визначення сторін, відповідальних за управління інформаційною безпекою, приватністю та
      управлінням ланцюгами постачання;
  
      h. критерії прийнятності.
  
  
  
      Параметри:
  
  
      1. Вибір (один або більше): стандартні пункти контракту; [Призначення: пункти контракту, визначені організацією]'
    annotation: Функціональні вимоги безпеки та приватності зазвичай випливають із вимог високого рівня безпеки та приватності,
      описаних у SA-2. Похідні вимоги включають можливості безпеки та приватності, функції та механізми. Вимоги до міцності,
      пов’язані з такими можливостями, функціями та механізмами, включають ступінь правильності, повноти, стійкість до втручання
      або обходу та стійкість до прямої атаки. Вимоги до гарантії включають процеси розробки, процедури та методології, а також
      докази діяльності з розробки та оцінки, які дають підстави для впевненості в тому, що необхідна функціональність реалізована
      та має необхідну силу механізму. [SP 800-160-1] описує процес розробки вимог як частину життєвого циклу розробки системи.
      Заходи захисту можна розглядати як опис засобів захисту та можливостей захисту, відповідних для досягнення конкретних
      цілей безпеки та приватності організації та для відображення вимог зацікавлених сторін до безпеки та приватності. Заходи
      захисту вибираються та впроваджуються, щоб задовольнити системні вимоги та включати обов’язки розробника та організації.
      Заходи захисту можуть включати технічні, адміністративні та фізичні аспекти. У деяких випадках вибір і впровадження заходів
      захисту може вимагати додаткової специфікації з боку організації у формі похідних вимог або інстанційованих значень параметрів
      таких заходів. Похідні вимоги та значення параметрів заходів захисту можуть бути необхідними для забезпечення відповідного
      рівня деталізації їх впровадження протягом життєвого циклу розробки системи. Вимоги щодо документації безпеки та приватності
      охоплюють усі етапи життєвого циклу розробки системи. Документація містить вказівки для користувачів і адміністраторів
      щодо впровадження та роботи заходів захисту. Рівень деталізації, необхідний у такій документації, базується на категоризації
      безпеки або рівні класифікації системи та ступені, до якого організації залежать від можливостей, функцій або механізмів,
      щоб відповідати очікуванням реагування на ризики. Вимоги можуть містити обов’язкові параметри конфігурації, які визначають
      дозволені функції, порти, протоколи та служби. Критерії прийнятності для систем, компонентів системи і послуг для системи
      визначаються так само, як критерії для будь-якого організаційного придбання або закупівлі.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:sa-4.1
    ref_id: SA-4(1)
    name: Процес закупівель — Функціональні властивості заходів
    category: process
    csf_function: govern
    description: Вимагати від розробника системи, компонента системи або системної служби надати опис функціональних властивостей
      заходів захисту, які повинні бути реалізовані.
    annotation: Функціональні властивості засобів безпеки та приватності описують функціональні можливості (тобто безпеку чи
      приватність, функції чи механізми), заходи захисту інтерфейсів, а також стосуються функціональності та структури даних.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:sa-4.2
    ref_id: SA-4(2)
    name: Процес закупівель — Розробка та впровадження інформації для заходів
    category: process
    csf_function: govern
    description: 'Вимагати від розробника системи, компонента системи або системної служби надати інформацію про розробку та
      реалізацію для вибраних заходів, яка містить: [Вибір (один або більше): пов’язані з безпекою зовнішні системні інтерфейси;
      архітектуру (проєкт) високого рівня; архітектури (проєкт) низького рівня; вихідний код або апаратні схеми; [Призначення:
      визначена організацією інформація щодо розробки та впровадження]] на [Призначення: визначений організацією рівень деталізації].
  
  
  
      Параметри:
  
  
      1. Вибір (один або більше): пов’язані з безпекою зовнішні системні інтерфейси; архітектуру (проєкт) високого рівня; архітектури
      (проєкт) низького рівня; вихідний код або апаратні схеми; [Призначення: визначена організацією інформація щодо розробки
      та впровадження]
  
  
      2. Призначення: визначений організацією рівень деталізації'
    annotation: Залежно від складності організації може вимагатися різний рівень деталізації документації з розробки та впровадження
      заходів, вимог до надійності та стійкості, а також вимог до аналізу й тестування. Система може бути розділена на кілька
      підсистем, кожна підсистема своєю чергою може містити один або кілька модулів. Проектування високого рівня для системи
      виражається в термінах підсистем та інтерфейсів між підсистемами, що забезпечують функціональність, важливу для безпеки.
      Низькорівневе проектування системи виражається в термінах модулів та інтерфейсів між модулями, що забезпечують функціональність,
      важливу для безпеки. Документація щодо розробки та впровадження може містити виробника, версію, серійний номер, геш-підпис
      перевірки, бібліотеки програмного забезпечення, що використовуються, дату придбання або завантаження, а також постачальника
      або джерело завантаження. Вихідний код і апаратні схеми називаються представленням реалізації системи.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:sa-4.3
    ref_id: SA-4(3)
    name: Процес закупівель — Методи, техніки та практики розробки
    category: process
    csf_function: govern
    description: 'Вимагати від розробника системи, системного компонента або системної служби продемонструвати використання
      процесу життєвого циклу розробки системи, що містить у собі:
  
      a) [Призначення: визначені організацією методи проєктування (інженерії) систем];
  
      b) [Вибір (один або більше): методи проєктування безпеки систем; методи проєктування приватності; проєктування (інженерії)
      систем];
  
      c) [Призначення: визначені організацією методи розробки програмного забезпечення; методи тестування, оцінювання, перевірки
      та підтвердження; та процеси контролю якості].
  
  
  
      Параметри:
  
  
      1. Призначення: визначені організацією методи проєктування (інженерії) систем
  
  
      2. Вибір (один або більше): методи проєктування безпеки систем; методи проєктування приватності; проєктування (інженерії)
      систем
  
  
      3. Призначення: визначені організацією методи розробки програмного забезпечення; методи тестування, оцінювання, перевірки
      та підтвердження; та процеси контролю якості'
    annotation: Використання сучасних методів, технік і практик розробки програмного забезпечення, методів системної інженерії,
      а також процесів контролю якості протягом життєвого циклу розробки системи допомагає зменшити кількість прихованих помилок
      у системах, компонентах системи та в послугах для системи. Зменшення кількості та серйозності таких помилок зменшує кількість
      вразливостей у цих системах, компонентах і службах. Прозорість у методах і техніках, які розробники обирають і впроваджують
      для проектування систем, безпеки систем і приватності, розробки програмного забезпечення, оцінки компонентів і систем,
      а також процесів контролю якості, забезпечує підвищений рівень впевненості в надійності системи, системного компонента
      або придбання системної послуги.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:sa-4.4
    ref_id: SA-4(4)
    name: Процес закупівель — Віднесення компонентів до систем
    category: process
    csf_function: govern
    description: 'Вилучено: включено до CM-8 (9).'
    annotation: null
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:sa-4.5
    ref_id: SA-4(5)
    name: Процес закупівель — Конфігурації системи, компонента та системної служби
    category: process
    csf_function: govern
    description: 'Вимагати від розробника системи, компонента системи або системної служби:
  
      (a) встановити систему, компонент або системну службу за допомогою [Призначення: визначених організацією конфігурацій
      безпеки];
  
      (b) використовувати ці конфігураційні налаштування за замовчуванням для будь-якої наступної переінсталяції або оновлення
      системи, компонента чи послуги.
  
  
  
      Параметри:
  
  
      1. Призначення: визначених організацією конфігурацій безпеки'
    annotation: Конфігурації безпеки містять, наприклад, затверджені базові профілі безпеки та будь-які обмеження щодо функцій,
      портів, протоколів і служб. До характеристик безпеки належать, наприклад, необхідність зміни паролів за замовчуванням.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:sa-4.6
    ref_id: SA-4(6)
    name: Процес закупівель — Використання засобів захисту інформації
    category: process
    csf_function: govern
    description: '(a) Використовувати засоби захисту інформації, які пройшли державну експертизу або сертифікацію, створені
      для технічного та криптографічного захисту інформації.
  
      (b) Переконатися, що ці засоби захисту мають позитивний експертний висновок або сертифікат відповідності, а також відповідні
      дозволи для використання для захисту критичної інформації.'
    annotation: Для використання схваленого NSA керування ключами можуть знадобитися комерційні стандартні IA або продукти інформаційної
      технології з підтримкою IA, які використовуються для захисту секретної інформації за допомогою криптографічних засобів.
      Див. [NSA CSFC].
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:sa-4.7
    ref_id: SA-4(7)
    name: Процес закупівель — Затверджені профілі захищеності
    category: process
    csf_function: govern
    description: (a) Обмежити використання комерційної готової до використання технічної продукції, створеної для захисту інформації
      та з функцією підтримки забезпечення безпеки інформації, до тих продуктів, які були успішно оцінені відповідно до профілю
      захищеності для конкретного типу технології, затвердженого уповноваженим державним органом, якщо такий профіль наявний.
      (b) У разі, якщо немає профілю захищеності для певного типу технологій, затвердженого уповноваженим органом, але забезпечення
      політики безпеки продукту, що надається на комерційній основі, залежить від криптографічних функцій, — вимагати, щоб криптографічний
      модуль пройшов державну експертизу, мав позитивний експертний висновок і був рекомендований до використання уповноваженим
      органом.
    annotation: null
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:sa-4.8
    ref_id: SA-4(8)
    name: Процес закупівель — План безперервного моніторингу заходів безпеки
    category: process
    csf_function: govern
    description: Вимагати від розробника системи, системного компонента або системної служби створити план безперервного моніторингу
      ефективності заходів безпеки та приватності, який узгоджується з відповідним планом постійного моніторингу організації.
    annotation: План безперервного моніторингу визначає, чи реалізований у системі повний набір запланованих і необхідних систем
      безпеки та заходів приватності. Такі плани мають бути розроблені з достатнім рівнем деталізації.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:sa-4.9
    ref_id: SA-4(9)
    name: Процес закупівель — Функції, порти, протоколи та послуги, що використовуються
    category: process
    csf_function: govern
    description: Вимагати від розробника системи, компонента системи або системної служби визначити функції, порти, протоколи
      та послуги, призначені для використання організацією.
    annotation: Ідентифікація функцій, портів, протоколів і послуг на ранніх стадіях життєвого циклу розробки системи (наприклад,
      під час початкових етапів визначення вимог і проектування) дозволяє організаціям впливати на архітектуру системи, компонента
      системи чи служби. Це допомагає уникати або мінімізувати використання функцій, портів, протоколів або служб, що створюють
      зайві ризики, а також розуміти компроміси, пов’язані з блокуванням конкретних портів, протоколів або служб. Рання ідентифікація
      функцій, портів, протоколів і служб дозволяє уникнути дорогої модернізації заходів захисту після впровадження системи,
      компонента або системної служби. SA-9 описує вимоги до зовнішніх послуг для системи. Організації визначають, які функції,
      порти, протоколи та послуги надаються із зовнішніх джерел.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:sa-4.10
    ref_id: SA-4(10)
    name: Процес закупівель — Використання затверджених продуктів підтвердження особистості (piv)
    category: process
    csf_function: govern
    description: Використовувати лише ту інформаційно-технічну продукцію, що перебуває в списку продуктів схвалених FIPS 201,
      затверджених уповноваженим органом, для можливостей підтвердження особистості (PIV), реалізованих в системах організації.
    annotation: Продукти зі списку продуктів, затверджених FIPS 201, відповідають вимогам NIST щодо підтвердження особи (PIV)
      федеральних службовців і підрядників. Картки PIV використовуються для багатофакторної автентифікації в системах і організаціях.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:sa-5
    ref_id: SA-5
    name: Системна документація
    category: process
    csf_function: govern
    description: 'a. Отримати або розробити документацію адміністратора для системи, системного компонента або системної служби,
      яка описує:
  
      1. безпечне налаштування, установку та роботу системи, компонента або служби;
  
      2. ефективне використання, підтримку функцій та механізмів безпеки та приватності;
  
      3. відомі вразливості щодо конфігурації та використання адміністративних або привілейованих функцій.
  
      b. Отримати або розробити документацію користувача для системи, системного компонента або системної служби, яка описує:
  
      1. функції та механізми безпеки та приватності та способи ефективного використання цих функцій і механізмів;
  
      2. методи взаємодії з користувачем, що дозволяють окремим особам використовувати систему, компонент або службу безпечнішим
      чином та захищати індивідуальну приватність;
  
      3. обов’язки користувача щодо забезпечення безпеки системи, компонента або служби та приватності окремих осіб.
  
      c. Документувати спроби отримати доступ до документації системи, системного компонента чи системної служби, коли така
      документація недоступна або ж відсутня, і вжити [Призначення: визначені організацією заходи] у відповідь.
  
      d. Поширити документацію серед [Призначення: визначеного організацією персоналу або посадових осіб].
  
  
  
      Параметри:
  
  
      1. Призначення: визначені організацією заходи
  
  
      2. Призначення: визначеного організацією персоналу або посадових осіб'
    annotation: Цей захід допомагає організаційному персоналу зрозуміти впровадженнґ та роботу заходів захисту. Організації
      розглядають можливість встановлення конкретних заходів захисту для визначення якості та повноти наданого контенту. Системна
      документація може використовуватися, наприклад, для підтримки управління ризиками ланцюга постачань, реагування на інциденти
      та інших функцій. До посадових осіб або ролей, що потребують документації, можуть належати власники системи, посадові
      особи служби безпеки, системні адміністратори. До спроб отримати документацію можуть належати прямий контакт з виробниками
      чи постачальниками та вебпошук. Неможливість отримати необхідну документацію може виникнути, наприклад, через вік системи
      чи компонента або відсутність підтримки розробників і підрядників. У таких ситуаціях організаціям може знадобитися відтворити
      цю документацію. Рівень захисту, що надається для документації, має бути співмірним з категорією безпеки або класифікацією
      системи. Документація, що стосується вразливостей системи, може вимагати підвищеного рівня захисту. Захищена робота системи
      включає початковий запуск системи та відновлення безпечної роботи системи після перерви в роботі системи.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:sa-5.1
