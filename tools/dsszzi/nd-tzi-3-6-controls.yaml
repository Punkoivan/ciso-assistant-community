    name: Міжорганізаційний аудит — Збереження ідентичності
    category: process
    csf_function: protect
    description: Вимагати, щоб ідентичність особистості зберігалася в міжорганізаційних журналах аудиту.
    annotation: Це посилення застосовується, коли є необхідність відстежувати дії, які виконуються конкретною особою
