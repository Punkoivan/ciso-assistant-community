  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:sa-15
    ref_id: SA-15
    name: Процеси, стандарти та інструменти розробки
    category: process
    csf_function: protect
    description: 'a. Вимагати від розробника системи, системного компонента або системної служби слідувати документованому процесу
      розробки, який:
  
      1. явно відповідає вимогам безпеки та приватності;
  
      2. визначає стандарти й інструменти, які використовуються в процесі розробки;
  
      3. документує конкретні параметри та конфігурації інструментарію, що використовуються в процесі розробки;
  
      4. документує, управляє та забезпечує цілісність змін у процесі та/або інструментах, які використовуються в процесі розробки.
      Ознайомитися з процесом розробки, стандартами, інструментами, параметрами інструментарію і конфігураціями інструментів
      [Призначення: визначена організацією частота], щоб визначити, чи можуть вибрані й використовувані процеси, стандарти,
      інструменти, параметри та конфігурації інструментів задовольнити [Призначення: визначені організацією вимоги до безпеки
      та приватності].
  
  
  
      Параметри:
  
  
      1. Призначення: визначена організацією частота
  
  
      2. Призначення: визначені організацією вимоги до безпеки та приватності'
    annotation: Засоби розробки включають мови програмування та системи автоматизованого проектування. Огляди процесів розробки
      включають використання моделей зрілості для визначення потенційної ефективності таких процесів. Підтримка цілісності змін
      в інструментах і процесах сприяє ефективній оцінці ризиків ланцюга постачання і зменшенню їх наслідків. Така цілісність
      вимагає контролю конфігурації протягом життєвого циклу розробки системи для відстеження авторизованих змін і запобігання
      несанкціонованим змінам.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:sa-15.1
    ref_id: SA-15(1)
    name: Процес, стандарти та інструменти розробки — Показники якості
    category: process
    csf_function: protect
    description: 'Вимагати від розробника системи, компонента системи або системної служби:
  
      (a) визначити показники якості на початку процесу розробки;
  
      (b) надати докази відповідності показникам якості [Вибір (один або більше): [Призначення: визначена організацією частота];
      [Призначення: визначені організацією етапи розгляду програми]; після постачання].
  
  
  
      Параметри:
  
  
      1. Вибір (один або більше): [Призначення: визначена організацією частота]; [Призначення: визначені організацією етапи
      розгляду програми]; після постачання'
    annotation: Організації використовують показники якості для встановлення прийнятних рівнів якості системи. Метрики можуть
      включати показники якості, які є наборами критеріїв завершення або стандартів достатності, які представляють задовільне
      виконання конкретних етапів проекту розробки системи. Наприклад, перевірка якості може вимагати усунення всіх попереджень
      компілятора або визначення того, що такі попередження не впливають на ефективність необхідних можливостей безпеки чи приватності.
      На етапах виконання проектування контроль якості забезпечує чіткі, недвозначні показники прогресу. Інші показники застосовуються
      до всього проекту вцілому. Метрики можуть включати визначення порогових значень серйозності вразливостей відповідно до
      стійкості організації щодо ризику, наприклад вимоги відсутності відомих вразливостей у поставленій системі із середньою
      або високою серйозністю загальної системи оцінки вразливостей (CVSS).
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:sa-15.2
    ref_id: SA-15(2)
    name: Процеси, стандарти та інструменти розробки — Засоби відстеження безпеки та приватності
    category: process
    csf_function: protect
    description: Вимагати від розробника системи, системного компонента або системної служби вибирати та використовувати засоби
      відстеження безпеки та приватності під час процесу розробки.
    annotation: Група розробників системи обирає і розгортає засоби відстеження безпеки та приватності, включаючи системи відстеження
      вразливостей або робочих елементів, які полегшують призначення, сортування, фільтрацію та відстеження виконаних робочих
      елементів або завдань, пов’язаних із процесами розробки.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:sa-15.3
    ref_id: SA-15(3)
    name: Процеси, стандарти та інструменти розробки — Аналіз критичності
    category: process
    csf_function: protect
    description: 'Вимагати від розробника системи, системного компонента або системної служби виконати аналіз критичності:
  
      a) у наступних точках ухвалення рішень у життєвому циклі розробки системи: [Призначення: визначені організацією точки
      ухвалення рішень у життєвому циклі розробки системи];
  
      b) на наступному рівні суворості [Призначення: визначена організацією ширина/глибина аналізу критичності].
  
  
  
      Параметри:
  
  
      1. Призначення: визначені організацією точки ухвалення рішень у життєвому циклі розробки системи
  
  
      2. Призначення: визначена організацією ширина/глибина аналізу критичності'
    annotation: Аналіз критичності, який виконує розробник, надає вхідні дані для аналізу критичності, який виконує організація.
      Внесок розробників є важливим для аналізу критичності організацією, оскільки вона може не мати доступу до детальної проектної
      документації для компонентів системни, які розроблені як комерційні готові продукти. Така проектна документація включає
      функціональні специфікації, проекти високого рівня, проекти низького рівня, вихідний код і схеми обладнання. Аналіз критичності
      важливий для систем організації, які позначаються як активи високої вартості. Активи високої вартості можуть бути системами
      з помірним або високим впливом через підвищений конкурентний інтерес або потенційний негативний вплив на державну установу.
      Внесок розробників особливо важливий, коли організації проводять аналіз критичності ланцюга постачання.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:sa-15.4
    ref_id: SA-15(4)
    name: Процес, стандарти та інструменти розробки — Моделювання загроз та аналіз вразливостей
    category: process
    csf_function: protect
    description: 'Вилучено: Включено до SA-11 (2).'
    annotation: null
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:sa-15.5
    ref_id: SA-15(5)
    name: Процес, стандарти та інструменти розробки — Зменшення поверхні атаки
    category: process
    csf_function: protect
    description: 'Вимагати від розробника системи, системного компонента або системної служби зменшити поверхню атаки до [Призначення:
      визначені організацією межі].
  
  
  
      Параметри:
  
  
      1. Призначення: визначені організацією межі'
    annotation: Зменшення площі атаки тісно пов’язане з аналізом загроз і вразливостей, а також архітектурою системи. Зменшення
      поверхні атаки — це засіб зменшення ризику для організацій, даючи зловмисникам менше можливостей використовувати слабкі
      місця або недоліки (тобто потенційні вразливості) у системах, компонентах системи і послуг для системи. Зменшення поверхні
      атаки включає в себе реалізацію концепції багаторівневого захисту, застосування принципів найменших привілеїв і найменших
      функціональних можливостей, застосування безпечних практик розробки програмного забезпечення, припинення використання
      небезпечних функцій, зменшення точок входу, доступних для неавторизованих користувачів, зменшення кількості коду, який
      виконується, і видалення програми інтерфейсів програмування (API), уразливих до атак.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:sa-15.6
    ref_id: SA-15(6)
    name: Процес, стандарти та інструменти розробки — Постійне вдосконалення
    category: process
    csf_function: protect
    description: Вимагає від розробника системи, системного компонента або системної служби реалізувати явний процес для постійного
      вдосконалення процесу розробки.
    annotation: Розробники систем, компонентів системи і послуг для системи розглядають ефективність і результативність своїх
      процесів розробки для досягнення цілей якості та вирішення можливостей безпеки та приватності в поточних загрозливих середовищах.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:sa-15.7
    ref_id: SA-15(7)
    name: Процеси, стандарти та інструменти розробки — Автоматизований аналіз вразливостей
    category: process
    csf_function: protect
    description: 'Вимагати від розробника системи, компонента системи або системної служби [Призначення: частота, визначена
      організацією]:
  
      (a) виконувати автоматизований аналіз вразливостей за допомогою [Призначення: визначені організацією інструменти];
  
      (b) визначити потенційні можливості використання виявлених вразливостей;
  
      (c) визначити потенційні можливості зменшення ризику для вразливих місць;
  
      (d) надавати результати аналізу [Призначення: визначено організацією персоналу або посадовим особам].
  
  
  
      Параметри:
  
  
      1. Призначення: частота, визначена організацією
  
  
      2. Призначення: визначені організацією інструменти
  
  
      3. Призначення: визначено організацією персоналу або посадовим особам'
    annotation: Автоматизовані інструменти можуть бути ефективними в аналізі слабких місць або недоліків у великих і складних
      системах, які можна використовувати, розставляючи пріоритети вразливостей за ступенем серйозності та надаючи рекомендації
      щодо зменшення ризиків
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:sa-15.8
    ref_id: SA-15(8)
    name: Процес, стандарти та інструменти розробки — Повторне використання інформації про загрози та вразливості
    category: process
    csf_function: protect
    description: Вимагати від розробника системи, компонента системи або системної служби використовувати моделювання загроз
      та аналіз вразливостей з аналогічних систем, компонентів або служб для інформування про поточний процес розробки.
    annotation: Аналіз вразливостей, виявлених у подібних програмних продуктах, може свідчити про потенційні проблеми з проектуванням
      і впровадженням систем, що розробляються. Подібні системи або системні компоненти можуть існувати в організаціях-розробниках.
      Інформація про вразливості доступна з різних державних і приватних джерел, включаючи національну базу даних про вразливості
      NIST.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:sa-15.9
    ref_id: SA-15(9)
    name: Процес, стандарти та інструменти розробки — Використання реальних даних
    category: process
    csf_function: protect
    description: 'Вилучено: Включено до SA-3 (2).'
    annotation: null
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:sa-15.10
    ref_id: SA-15(10)
    name: Процеси, стандарти та інструменти розробки — План реагування на інциденти
    category: process
    csf_function: protect
    description: "Вимагати від розробника системи, компонента системи або системної служби надавати, реалізовувати та перевіряти\
      \ план реагування на інциденти. \n\n**Рекомендації з реалізації:**\nПлан реагування на інциденти, наданий розробниками,\
      \ може надавати інформацію, недоступну для організацій, і бути включений до плану реагування на інциденти в організації.\
      \ Інформація для розробників також може бути надзвичайно корисною, наприклад, коли організації реагують на вразливості\
      \ в комерційних готових продуктах."
    annotation: null
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:sa-15.11
    ref_id: SA-15(11)
    name: Процес, стандарти та інструменти розробки — Резервування системи або компонента
    category: process
    csf_function: protect
    description: Вимагати від розробника системи або системного компонента резервування системи або компонента, який буде випущено
      або доставлено разом з відповідними доказами, що підтверджують остаточну перевірку безпеки та приватності.
    annotation: Архівування системи або компонентів системи вимагає від розробника збереження ключових артефактів розробки,
      включаючи специфікації апаратного забезпечення, вихідний код, об’єктний код і відповідну документацію з процесу розробки,
      яка може забезпечити готову базову конфігурацію для оновлень або модифікацій системи та компонентів.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:sa-15.12
    ref_id: SA-15(12)
    name: Процес, стандарти та інструменти розробки — Мінімізація персональної інформації
    category: process
    csf_function: protect
    description: Вимагати від розробника системи чи системного компонента мінімізувати використання персональної інформації
      в середовищах розробки та тестування.
    annotation: Організації можуть мінімізувати ризик конфіденційності особи, використовуючи такі методи, як деідентифікація
      або синтетичні дані. Обмеження використання ідентифікаційної інформації в середовищах розробки та тестування допомагає
      знизити рівень ризику конфіденційності, який створює система.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:sa-16
    ref_id: SA-16
    name: Навчання, що надається розробниками
    category: process
    csf_function: protect
    description: 'Вимагати від розробника системи, системного компонента або системної служби забезпечити наступне навчання
      щодо правильного використання та функціонування реалізованих функцій, заходів і механізмів безпеки та приватності [Призначення:
      визначене організацією навчання].
  
  
  
      Параметри:
  
  
      1. Призначення: визначене організацією навчання'
    annotation: Навчання персоналу має важливе значення для забезпечення ефективності заходів захисту, впроваджених в системах
      організації. Типи навчання включають веб- та комп’ютерне навчання, навчання в аудиторії та практичне навчання (включаючи
      мікронавчання). Організації також можуть запросити навчальні матеріали від розробників для проведення внутрішнього навчання
      або запропонувати самонавчання персоналу організації. Організації визначають тип необхідного навчання та можуть вимагати
      різних типів навчання для різних функцій безпеки та приватності, заходів захисту та механізмів.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:sa-17
    ref_id: SA-17
    name: Проєкт та архітектура безпеки та приватності для розробника
    category: process
    csf_function: protect
    description: 'Вимагати від розробника системи, системного компонента або системної служби створення специфікації проєкту
      та архітектури безпеки та приватності, яка:
  
      a. узгоджується з архітектурою безпеки та приватності організації яка є невід’ємною частиною корпоративної архітектури
      організації;
  
      b. точно та повністю описує необхідні функції безпеки та приватності, а також розподіл заходів захисту між фізичними та
      логічними компонентами;
  
      c. пояснює, як разом працюють окремі функції, механізми та служби безпеки для забезпечення необхідних можливостей безпеки
      та єдиного підходу до захисту.'
    annotation: Архітектура безпеки та приватності розробників спрямована на зовнішніх розробників, хоча їх також можна застосовувати
      і для внутрішньої (власної) розробки. Навпаки, PL-8 спрямований на внутрішніх розробників, які гарантують, що організації
      розроблять архітектуру безпеки та приватності, інтегровану з архітектурою організації. Різниця між SA-17 і PL-8 особливо
      важлива, коли організації передають розробку систем, компонентів системи або послуг для системи аутсорсингу та коли існує
      вимога продемонструвати узгодженість з корпоративною архітектурою та архітектурою безпеки та приватності організації.
      [ISO 15408-2], [ISO 15408-3] і [SP 800-160-1] надають інформацію про архітектуру та безпеки, включаючи офіційні моделі
      політики, компоненти, що стосуються безпеки, формальну та неофіційну переписку, концептуально просте проектування, і структурування
      для найменших привілеїв і тестування.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:sa-17.1
    ref_id: SA-17(1)
    name: Проєкт та архітектура безпеки та приватності для розробника — Формальна модель політики
    category: process
    csf_function: protect
    description: 'Вимагати від розробника системи, компонента системи або системної служби: (a) створювати, як невіддільну частину
      процесу розробки, формальну модель політики, що описує [Призначення: визначені організацією елементи організаційної політики
      безпеки], які підлягають виконанню; (b) довести, що формальна модель політики є внутрішньо послідовною і достатньою для
      виконання визначених елементів політики безпеки організації, коли вона реалізована.
  
  
  
      Параметри:
  
  
      1. Призначення: визначені організацією елементи організаційної політики безпеки'
    annotation: Формальні моделі описують певну поведінку або політику безпеки та приватності за допомогою формальних мов, таким
      чином дозволяючи формально підтвердити правильність цієї поведінки та політики. Не всі компоненти системи можна моделювати.
      Як правило, формальні специфікації охоплюють поведінку або політики, такі як недискреційні політики контролю доступу.
      Організації обирають формальну мову моделювання та підхід на основі характеру поведінки та політики, які необхідно описати,
      та наявних інструментів.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:sa-17.2
    ref_id: SA-17(2)
    name: Проєкт та архітектура безпеки та приватності для розробника — Компоненти, що необхідні для забезпечення безпеки
    category: process
    csf_function: protect
    description: 'Вимагати від розробника системи, компонента системи або системної служби:
  
      (a) визначити апаратне, програмне та мікропрограмне забезпечення, що необхідне для забезпечення безпеки;
  
      (b) надати обґрунтування того, що визначення апаратного, програмного та мікропрограмного забезпечення, яке необхідне для
      забезпечення безпеки, є повним.'
    annotation: Релевантне для безпеки апаратне, програмне та вбудоване програмне забезпечення представляють частину системи,
      компонента або служби, яка, як довіряється, працюватиме правильно для підтримки необхідних властивостей безпеки.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:sa-17.3
    ref_id: SA-17(3)
    name: Проєкт та архітектура безпеки та приватності для розробника — Формальна відповідність
    category: process
    csf_function: protect
    description: 'Вимагати від розробника системи, компонента системи або системної служби:
  
      (a) створювати, як невіддільну частину процесу розробки, офіційну специфікацію верхнього рівня, яка визначає інтерфейси
      апаратного, програмного та мікропрограмного забезпечення, що необхідне для забезпечення безпеки, з погляду виключень,
      повідомлень про помилки та ефектів;
  
      (b) надавати докази, якщо це можливо, з додатковою неофіційною демонстрацією, що формальна специфікація верхнього рівня
      відповідає формальній моделі політики;
  
      (c) показувати через неофіційну демонстрацію, що формальна специфікація верхнього рівня повністю охоплює інтерфейси апаратного,
      програмного та мікропрограмного забезпечення, яке необхідне для забезпечення безпеки;
  
      (d) демонструвати, що формальна специфікація верхнього рівня є точним описом реалізованого апаратного, програмного та
      мікропрограмного забезпечення, яке необхідне для забезпечення безпеки;
  
      (e) описувати апаратне, програмне та мікропрограмне забезпечення, що необхідне для забезпечення безпеки, яке не розглядається
      в офіційній специфікації верхнього рівня, але є строго внутрішнім для апаратного, програмного та мікропрограмного забезпечення,
      що необхідне для забезпечення безпеки.'
    annotation: Формальні методи можуть бути використані, щоб показати, що властивості безпеки високого рівня задовольняють
      формальному опису системи, і що формальний опис системи правильно реалізований описом деякого нижчого рівня, включаючи
      опис апаратного забезпечення. Узгодженість між офіційною специфікацією верхнього рівня та формальними моделями політики,
      як правило, не піддається повному доказу. Тому для демонстрації такої послідовності може знадобитися поєднання формальних
      і неформальних методів. Узгодженість між офіційною специфікацією верхнього рівня та фактичною реалізацією може вимагати
      використання неофіційної демонстрації через обмеження застосовності формальних методів, щоб довести, що специфікація точно
      відображає реалізацію. Апаратні, програмні та мікропрограмні механізми, внутрішні для компонентів, що мають відношення
      до безпеки, включають регістри відображення та прямий вхід і вихід з пам’яті.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:sa-17.4
    ref_id: SA-17(4)
    name: Проєкт та архітектура безпеки та приватності для розробника — Неформальна відповідність
    category: process
    csf_function: protect
    description: 'Вимагати від розробника системи, компонента системи або системної служби:
  
      (a) створювати, як невіддільну частину процесу розробки, неформальну описову специфікацію верхнього рівня, яка визначає
      інтерфейси апаратного, програмного та мікропрограмного забезпечення, що необхідне для забезпечення безпеки, з погляду
      виключень, повідомлень про помилки та ефекти;
  
      (b) демонструвати через [Вибір: неофіційна демонстрація, переконливий аргумент з формальними методами і т. д.], що описова
      специфікація верхнього рівня узгоджується з формальною моделлю політики;
  
      (c) показати за допомогою неофіційної демонстрації, що описова специфікація верхнього рівня повністю охоплює інтерфейси
      апаратного, програмного та мікропрограмного забезпечення, пов’язаного з безпекою;
  
      (d) показати, що описова специфікація верхнього рівня є точним описом інтерфейсів апаратного, програмного та мікропрограмного
      забезпечення, пов’язаного з безпекою;
  
      (e) описати важливе для безпеки апаратне, програмне забезпечення та механізми вбудованого програмного забезпечення, які
      не розглядаються в описовій специфікації верхнього рівня, але важливі для безпеки апаратного забезпечення та мікропрограмного
      забезпечення.
  
  
  
      Параметри:
  
  
      1. Вибір: неофіційна демонстрація, переконливий аргумент з формальними методами і т. д.'
    annotation: Узгодженість між описовою специфікацією верхнього рівня (тобто проектом високого/низького рівня) та моделлю
      формальної політики, як правило, не піддається повному доведенню. Тому для демонстрації такої послідовності може знадобитися
      поєднання формальних і неформальних методів. Механізми апаратного, програмного та мікропрограмного забезпечення, суворо
      внутрішні для апаратного, програмного та мікропрограмного забезпечення, що мають відношення до безпеки, включають регістри
      відображення та прямий вхід і вихід пам’яті.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:sa-17.5
    ref_id: SA-17(5)
    name: Проєкт та архітектура безпеки та приватності для розробника — Концептуальний проєкт
    category: process
    csf_function: protect
    description: 'Вимагати від розробника системи, компонента системи або системної служби:
  
      (a) розробити та структурувати апаратне, програмне й мікропрограмне забезпечення, що необхідне для забезпечення безпеки
      та використовує повний, концептуально простий механізм захисту з точно визначеною семантикою;
  
      (b) внутрішньо структурувати апаратне, програмне та мікропрограмне забезпечення, що має відношення до безпеки, зі специфікаціями
      цього механізму.'
    annotation: Принцип зменшеної складності стверджує, що проект системи є максимально простим і малим (див. SA-8(7)). Невеликий
      і простий проект легше зрозуміти й проаналізувати і має, як правило, менше помилок (див. AC-25, SA-8(13)). Принцип зменшеної
      складності застосовується до будь-якого аспекту системи, але він має особливе значення для безпеки через різноманітні
      аналізи, які виконуються для отримання доказів щодо нових властивостей безпеки системи. Застосування принципу зниженої
      складності сприяє здатності розробників системи розуміти правильність і повноту функцій безпеки системи та полегшує ідентифікацію
      потенційних вразливостей. Наслідок зменшення складності стверджує, що простота системи безпосередньо пов’язана з кількістю
      вразливостей, які вона міститиме. Тобто простіші системи містять менше вразливостей. Важливою перевагою зниження складності
      є те, що легше зрозуміти, чи була політика безпеки зафіксована в системі, і що менше вразливостей, ймовірно, буде введено
      під час інженерних робіт. Додатковою перевагою є те, що будь-який такий висновок щодо правильності, повноти та наявності
      вразливостей можна зробити з вищим ступенем упевненості на відміну від висновків, зроблених у ситуаціях, коли проект системи
      є складним.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:sa-17.6
    ref_id: SA-17(6)
    name: Проєкт та архітектура безпеки та приватності для розробника — Структура для тестування
    category: process
    csf_function: protect
    description: Вимагати від розробника системи, системного компонента або системної служби структурувати відповідне апаратне,
      програмне та мікропрограмне забезпечення для тестування.
    annotation: Застосування принципів проектування безпеки в [SP 800-160-1] сприяє повному, узгодженому та комплексному тестуванню
      й оцінці систем, компонентів системи і послуг. Ретельність такого тестування сприяє створенню доказів для створення ефективного
      випадку гарантії або аргументу щодо надійності системи, системного компонента або послуги.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:sa-17.7
    ref_id: SA-17(7)
    name: Проєкт та архітектура безпеки та приватності для розробника — Структура для найменшого привілею
    category: process
    csf_function: protect
    description: Вимагати від розробника системи, системного компонента або системної служби структурувати апаратне, програмне
      та мікропрограмне забезпечення, необхідне для забезпечення безпеки таким чином, щоб полегшити контроль доступу з найменшими
      привілеями.
    annotation: Принцип найменших привілеїв стверджує, що кожному компоненту надається достатня кількість привілеїв для виконання
      визначених ним функцій, але не більше (див. SA-8(14)). Застосування принципу найменших привілеїв обмежує сферу дій компонента,
      що має два бажаних ефекту. По-перше, вплив на безпеку збою, пошкодження або неправильного використання компонента системи
      призводить до мінімізації впливу на безпеку. По-друге, спрощується аналіз безпеки компонента. Найменший привілей — це
      поширений принцип, який відображається в усіх аспектах проектування безпечної системи. Інтерфейси, які використовуються
      для виклику можливостей компонентів, доступні лише для певних підмножин користувачів, а конструкція компонентів підтримує
      досить дрібну деталізацію привілеїв. Наприклад, у випадку механізму аудиту може бути інтерфейс для менеджера аудиту, який
      налаштовує параметри аудиту; інтерфейс для оператора аудиту, який забезпечує безпечний збір і зберігання даних аудиту;
      і, нарешті, ще один інтерфейс для перевіряючого аудитора, якому потрібно лише переглядати зібрані дані аудиту, але не
      потрібно виконувати операції з цими даними. На додаток до своїх проявів на інтерфейсі системи, найменші привілеї можуть
      використовуватися як керівний принцип для внутрішньої структури самої системи. Одним із аспектів внутрішніх найменших
      привілеїв є конструювання модулів таким чином, щоб лише елементи, інкапсульовані модулем, безпосередньо керувалися функціями
      в модулі. Зовнішні по відношенню до модуля елементи, на які може вплинути робота модуля, одержують непрямий доступ через
      взаємодію (наприклад, через виклик функції) з модулем, який містить ці елементи. Іншим аспектом внутрішніх найменших привілеїв
      є те, що область даного модуля або компонента включає лише ті елементи системи, які необхідні для його функціональності,
      а режими доступу до елементів (наприклад, читання, запис) мінімальні.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:sa-17.8
    ref_id: SA-17(8)
    name: Проєкт та архітектура безпеки та приватності для розробника — Оркестровка
    category: process
    csf_function: protect
    description: 'Проектування [Призначення: визначені організацією критичні системи або системні компоненти] зі скоординованою
      поведінкою для реалізації таких можливостей: [Призначення: визначені організацією можливості, за системою чи компонентом].
  
  
  
      Параметри:
  
  
      1. Призначення: визначені організацією критичні системи або системні компоненти
  
  
      2. Призначення: визначені організацією можливості, за системою чи компонентом'
    annotation: Ресурси безпеки, які розподілені, розташовані на різних рівнях або в різних елементах системи чи реалізовані
      для підтримки різних аспектів надійності, можуть взаємодіяти непередбаченими або неправильними способами. Негативні наслідки
      можуть включати каскадні збої, перешкоди або розриви в охопленні. Координація поведінки ресурсів безпеки (наприклад, шляхом
      забезпечення встановлення одного патча на всіх ресурсах перед внесенням змін у конфігурацію, які припускають, що патч
      поширюється) може запобігти таким негативним взаємодіям.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:sa-17.9
    ref_id: SA-17(9)
    name: Проєкт та архітектура безпеки та приватності для розробника — Різноманітність проектування
    category: process
    csf_function: protect
    description: 'Використовуйте різне проектування для [Призначення: визначені організацією критично важливі системи або компоненти
      системи], щоб задовольнити загальний набір вимог або забезпечити еквівалентну функціональність.
  
  
  
      Параметри:
  
  
      1. Призначення: визначені організацією критично важливі системи або компоненти системи'
    annotation: Різноманітність проектування досягається шляхом надання однакової специфікації вимог багатьом розробникам, кожен
      з яких відповідає за розробку варіанту системи або системного компонента, який має відповідати заданим вимогам. Варіативність
      може бути в проектуванні програмного забезпечення чи апаратного забезпечення або в обох випадках одразу. Відмінності в
      конструкціях варіантів можуть бути результатом досвіду розробника (наприклад, попереднього використання шаблону проектування),
      стилю проектування (наприклад, під час розкладання необхідної функції на менші, визначення того, що є окремою функцією
      і як розбити функції на підфункції), вибір бібліотек і середовище розробки (наприклад, різні інструменти проектування
      полегшують візуалізацію деяких шаблонів проектування). Різноманітність проектування апаратного забезпечення включає прийняття
      різних рішень щодо того, яку інформацію зберігати в аналоговій формі, а яку інформацію перетворювати в цифрову форму,
      передачу тієї самої інформації в різний час і введення затримок у вибірці (часова рознесеність). Різноманітність проектування
      зазвичай використовується для підтримки відмовостійкості.
