      ключами, а також моніторинг інцидентів, аналіз і реагування. Ризики, які оцінюються, можуть включати ризики системи, місії
      чи бізнесу, безпеки, конфіденційності чи ланцюга постачання.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:sa-9.2
