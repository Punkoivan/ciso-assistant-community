  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ac-19.4
    ref_id: AC-19(4)
    name: Контроль доступу для мобільних пристроїв — Обмеження для засекреченої інформації
    category: technical
    csf_function: protect
    description: 'a) Заборонити використання незахищених мобільних пристроїв на об’єктах, де експлуатуються системи,
      що обробляють, зберігають або передають секретну інформацію, якщо це спеціально не дозволено уповноваженою
      особою.


      b) Забезпечити наступні обмеження на осіб, яким дозволено уповноваженою особою використовувати незахищені
      мобільні пристрої в установах, що містять системи обробки, зберігання або передачі секретної інформації:

      (1) підключення незахищених мобільних пристроїв до засекречених систем заборонено;

      (2) підключення незахищених мобільних пристроїв до незасекречених систем вимагає схвалення уповноваженої посадової
      особи;

      (3) використання внутрішніх або зовнішніх модемів або бездротових інтерфейсів у незахищених мобільних пристроях
      заборонено;

      (4) незахищені мобільні пристрої та інформація, що зберігається на цих пристроях, підлягають випадковим перевіркам
      та перевіркам [Призначення:

      визначеними організацією посадовими особами із захисту інформації], і якщо секретна інформація знайдена, застосовується
      політика обробки інцидентів.

      с) Обмежити підключення захищених мобільних пристроїв до засекречених систем відповідно до [Призначення: визначеної
      організацією політики безпеки].


      Параметри:

      1. Призначення: визначеними організацією посадовими особами із захисту інформації

      2. Призначення: визначеної організацією політики безпеки'
    annotation: Немає.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ac-19.5
    ref_id: AC-19(5)
    name: Контроль доступу для мобільних пристроїв — Повне шифрування пристроїв та сховищ інформації
    category: technical
    csf_function: protect
    description: 'Організація має застосувати [Вибір: повне шифрування пристроїв; шифрування сховищ інформації]
      для захисту конфіденційності та цілісності інформації на [Призначення: визначених організацією мобільних пристроях].


      Параметри:

      1. Вибір: повне шифрування пристроїв; шифрування сховищ інформації

      2. Призначення: визначених організацією мобільних пристроях'
    annotation: Шифрування на основі контейнерів забезпечує тонший підхід до шифрування даних/інформації на мобільних
      пристроях, включно з, наприклад, шифруванням вибраних структур даних, таких як файли, записи чи поля.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ac-20
    ref_id: AC-20
    name: Використання зовнішніх систем
    category: process
    csf_function: protect
    description: 'a. [Вибір (один або кілька): Встановіть [Призначення: умови, визначені організацією]; Визначте
      [Призначення: визначені організацією засоби контролю, які, як стверджується, будуть реалізовані на зовнішніх
      системах]], узгоджені з довірчими відносинами, встановленими з іншими організаціями, які володіють, експлуатують
      та/або обслуговують зовнішні системи, дозволяючи уповноваженим особам:


      1. доступ до системи із зовнішніх систем;


      2. обробляти, зберігати або передавати керовану організацією інформацію за допомогою зовнішніх систем;


      b. Заборонити використання [Призначення: організаційно-визначені типи зовнішніх систем].


      Параметри:

      1. Вибір (один або кілька): Встановіть [Призначення: умови, визначені організацією]; Визначте [Призначення:
      визначені організацією засоби контролю, які, як стверджується, будуть реалізовані на зовнішніх системах]

      2. Призначення: організаційно-визначені типи зовнішніх систем'
    annotation: 'Зовнішні системи — це системи або компоненти систем, які перебувають поза авторизованими межами,
      встановленими організаціями, і щодо яких організації, як правило, не мають безпосередньої можливості нагляду
      та повноважень щодо застосування необхідного заходу безпеки або оцінювання його ефективності. До зовнішніх
      систем належать: персональні системи, компоненти або пристрої; приватні обчислювальні пристрої та пристрої
      зв’язку в комерційних або громадських об’єктах;

      системи, що належать або контролюються недержавними організаціями; а також державні системи, які не перебувають
      у власності, під управлінням або під безпосереднім наглядом організації. Цей захід безпеки стосується використання
      зовнішніх систем для обробки, зберігання або передачі організаційної інформації, включно з, наприклад, доступом
      до хмарних служб.

      Для деяких зовнішніх систем (тобто систем, якими керують інші відомства та організації, підпорядковані ним),
      довірчі відносини, що були встановлені між ними, можуть не містити чітких умов. Системи в межах цих організацій
      не можна вважати зовнішніми (наприклад, коли між такими організаціями наявні попередні угоди чи коли такі
      відносини регулюються чинним законодавством, директивами або іншими розпорядженнями). До уповноважених осіб
      належать штатні працівники, підрядники або інші особи, які мають дозвіл на доступ до систем організації і
      щодо яких організації мають право встановлювати конкретні правила поведінки щодо доступу до системи.

      Обмеження, які накладаються на уповноважених осіб, не повинні бути уніфікованими, оскільки ці обмеження можуть
      змінюватися залежно від довірчих відносин.

      Цей захід безпеки не застосовується до зовнішніх систем, які використовуються для доступу до публічних інтерфейсів
      до систем організації. Конкретні умови використання зовнішніх систем мають бути встановлені відповідно до
      політик і заходів безпеки. Загальні положення та умови мають стосуватися: конкретних типів застосунків, до
      яких в системах організації можна отримати доступ із зовнішніх систем;

      найвищої категорії безпеки інформації, яка може оброблятися, зберігатися або передаватися в зовнішніх системах.
      Також можуть бути накладені додаткові обмеження на працівників, які можуть використовувати зовнішні системи.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ac-20.1
    ref_id: AC-20(1)
    name: Використання зовнішніх систем — Обмеження на авторизоване використання
    category: process
    csf_function: protect
    description: 'Дозволити авторизованим особам використовувати зовнішню систему для доступу до системи або для
      обробки, зберігання чи передачі інформації, що контролюється організацією, лише після:


      a) перевірки виконання необхідних заходів безпеки та приватності щодо зовнішніх систем, як зазначено в політиці
      безпеки та приватності організації, а також планах безпеки та приватності;

      b) збереження погоджених угод про підключення або обробку системи з організаційною структурою, на якій розміщена
      зовнішня система.'
    annotation: Це посилення заходу регулює випадки, коли користувачам, які використовують зовнішні системи, потрібно
      отримати доступ до систем організації. У таких ситуаціях необхідні гарантії наявності в зовнішніх системах
      необхідних заходів безпеки, які мінімізують можливі наслідки (компрометація, пошкодження) на організаційну
      систему. Перевірка того, що необхідний захід безпеки впроваджено, може бути проведена, наприклад, шляхом зовнішнього
      незалежного оцінювання, атестацією чи в інший спосіб, залежно від рівня довіри.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ac-20.2
    ref_id: AC-20(2)
    name: Використання зовнішніх систем — Переносні пристрої зберігання даних
    category: process
    csf_function: protect
    description: 'Обмежити використання портативних пристроїв зберігання даних авторизованими особами на зовнішніх
      системах за допомогою [Призначення:

      обмеження, визначені організацією].


      Параметри:

      1. Призначення: обмеження, визначені організацією'
    annotation: Обмеження на використання переносних пристроїв зберігання даних у зовнішніх системах можуть містити
      повну заборону використання таких пристроїв або обмеження їхнього використання за визначених умов.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ac-20.3
    ref_id: AC-20(3)
    name: Використання зовнішніх систем — Системи та компоненти, що не перебувають у власності організації
    category: process
    csf_function: protect
    description: 'Обмежити використання систем або компонентів системи, які не перебувають у власності організації,
      для обробки, зберігання або передачі організаційної інформації за допомогою [Призначення: обмеження, визначені
      організацією]


      Параметри:

      1. Призначення: обмеження, визначені організацією'
    annotation: 'До систем або компонентів, що не перебувають у власності організації, належать такі, що є власністю
      інших організацій, а також персональні системи та компоненти. Використання систем або компонентів, що не належать
      організації, несе потенційні ризики (у деяких випадках ризик є досить високим і треба повністю заборонити
      використання систем або компонентів, що не належать організації; в інших випадках використання таких систем
      або компонентів може бути дозволено з певними обмеженнями).

      Обмеження можуть містити вимоги до: впровадження затвердженого заходу безпеки та приватності; обмеження доступу
      до певних типів інформації, послуг чи застосунків; обмеження діяльності з обробки та зберігання на серверах
      або інших компонентах системи, передбачених організацією.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ac-20.4
    ref_id: AC-20(4)
    name: Використання зовнішніх систем — Пристрої для зберігання даних, які можуть мати доступ до мережі
    category: process
    csf_function: protect
    description: 'Заборонити використання [Призначення: визначених організацією пристроїв для зберігання даних,
      які можуть мати доступ до мережі] у зовнішніх системах.


      Параметри:

      1. Призначення: визначених організацією пристроїв для зберігання даних, які можуть мати доступ до мережі'
    annotation: До пристроїв для зберігання даних, які можуть мати доступ до мережі, належать онлайн-пристрої зберігання
      даних у загальнодоступних, гібридних або приватних хмарних системах.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ac-20.5
    ref_id: AC-20(5)
    name: Використання зовнішніх систем — Портативні пристрої для зберігання даних — Заборона використання
    category: process
    csf_function: protect
    description: Заборонити використання уповноваженими особами портативних пристроїв зберігання даних, підконтрольних
      організації, у зовнішніх системах.
    annotation: Обмеження на використання портативних пристроїв зберігання даних, підконтрольних організації, у
      зовнішніх системах включаює повну заборону на використання таких пристроїв. Заборона такого використання забезпечується
      за допомогою технічних та/або нетехнічних методів.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ac-21
    ref_id: AC-21
    name: Розповсюдження інформації
    category: process
    csf_function: protect
    description: 'a. Спростити обмін інформацією, надаючи авторизованим користувачам змогу визначати, чи відповідають
      повноваження на доступ, що призначені партнерам для обміну, обмеженням доступу та повноваженням з приватності
      щодо інформації для [Призначення: визначених організацією обставин обміну інформацією, коли це необхідно користувачу].


      b. Використовувати [Призначення: визначені організацією автоматизовані механізми або ручні процеси], щоб допомогти
      користувачам в ухваленні рішень щодо обміну інформацією та співпраці.


      Параметри:

      1. Призначення: визначених організацією обставин обміну інформацією, коли це необхідно користувачу

      2. Призначення: визначені організацією автоматизовані механізми або ручні процеси'
    annotation: 'Цей захід безпеки застосовується до інформації, доступ до якої може бути певним чином обмежений
      на основі формального чи адміністративного заходу. Прикладами такої інформації може бути: інформація, що стосується
      договорів;

      конфіденційна інформація; інформація, що стосується спеціальних програм або відділень доступу; привілейована
      медична інформація та особиста інформація.

      Віднесення інформації до одного з перерахованих типів можливо на основі аналізу можливих ризиків у разі компрометації
      таких даних, а також за результатами аналізу впливу на приватність у разі настання таких інцидентів. Залежно
      від обставин обміну інформацією, спільне використання інформації може бути обмежене в рамках організації чи
      групи користувачів, або можуть бути визначені лише конкретні авторизовані особи, які можуть мати доступ до
      такої інформації.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ac-21.1
    ref_id: AC-21(1)
    name: Розповсюдження інформації — Автоматична підтримка ухвалення рішень
    category: process
    csf_function: protect
    description: 'Використовувати [Призначення: автоматизовані механізми, визначені організацією], щоб забезпечити
      виконання рішень щодо обміну інформацією авторизованими користувачами на основі авторизації доступу партнерів
      з обміну та обмежень доступу до інформації що підлягає обміну.


      Параметри:

      1. Призначення: автоматизовані механізми, визначені організацією'
    annotation: Немає.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ac-21.2
    ref_id: AC-21(2)
    name: Розповсюдження інформації — Пошук і перевірка інформації
    category: process
    csf_function: protect
    description: 'Впровадити сервіси пошуку та перевірки інформації, які забезпечують [Призначення: визначені організацією
      обмеження обміну інформацією].


      Параметри:

      1. Призначення: визначені організацією обмеження обміну інформацією'
    annotation: Служби пошуку та відновлення інформації ідентифікують ресурси інформаційної системи, що відповідають
      інформаційній потребі.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ac-22
    ref_id: AC-22
    name: Публічно доступний контент
    category: process
    csf_function: protect
    description: 'a. Призначити осіб, що уповноважені на розміщення інформації в загальнодоступній системі.


      b. Навчати уповноважених осіб тому, щоб загальнодоступна інформація не містила інформацію з обмеженим доступом.


      c. Переглядати запропонований зміст інформації до публікації в загальнодоступній системі, щоб гарантувати,
      що там не міститься інформація з обмеженим доступом.


      d. Переглядати вміст загальнодоступної системи на предмет наявності там інформації з обмеженим доступом з
      [Призначення: визначеною організацією частотою]; така інформація має бути видалена в разі її виявлення.


      Параметри:

      1. Призначення: визначеною організацією частотою'
    annotation: Відповідно до чинного законодавства, наказів, директив, політик, громадськість не має права доступу
      до непублічної інформації. Цей захід безпеки стосується систем, які контролюються організацією та надають
      доступ до неї населенню здебільшого без процедур ідентифікації чи автентифікації. Правила розміщення інформації
      на базі систем, що не належать організації, мають базуватися на політиках організації.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ac-23
    ref_id: AC-23
    name: Захист від несанкціонованого інтелектуального аналізу
    category: technical
    csf_function: protect
    description: 'Використовувати [Призначення: визначені організацією техніки виявлення та попередження витоку
      даних] для [Призначення: визначених організацією об’єктів зберігання даних] для виявлення та захисту від несанкціонованого
      інтелектуального аналізу даних.


      Параметри:

      1. Призначення: визначені організацією техніки виявлення та попередження витоку даних

      2. Призначення: визначених організацією об’єктів зберігання даних'
    annotation: 'Інтелектуальний аналіз даних – це аналітичний процес, який намагається знайти кореляції або шаблони
      у великих наборах даних з метою виявлення даних або знань. До об’єктів зберігання даних належать, наприклад,
      бази даних, записи бази даних і поля бази даних. Конфіденційну інформацію можна отримати за допомогою операцій
      інтелектуального аналізу даних. Аналіз персональних даних може призвести до неочікуваних відкриттів щодо окремих
      осіб і створити ризики для конфіденційності. Перед виконанням аналізу даних організації визначають, чи є така
      діяльність дозволеною. На організації можуть поширюватися відповідні закони, виконавчі накази, директиви,
      нормативні акти чи політики, які стосуються вимог до аналізу даних. Персонал організації консультується зі
      старшим представником агентства щодо конфіденційності та юридичним консультантом щодо таких вимог.

      Методи запобігання та виявлення передачі даних можуть містити: обмеження типів відповідей, що надаються на
      запити до бази даних; обмеження кількості та частоти запитів до бази даних; повідомлення персоналу про нетипові
      запити до бази даних або звернення до них. Цей захід безпеки забезпечує захист організаційної інформації від
      витоку зі сховищ даних. Захід безпеки AU-13 стосується моніторингу інформації, яка, можливо, була отримана
      (санкціоновано або несанкціоновано) у сховищах даних і тепер є доступною (наприклад на зовнішніх сайтах).
      [EO 13587] вимагає створення програми внутрішніх загроз для стримування, виявлення та пом’якшення внутрішніх
      загроз, включаючи захист конфіденційної інформації від використання, компрометація або несанкціонованого розголошення.
      Захист від інтелектуального аналізу даних вимагає впровадження відповідних методів його запобігання та виявлення.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ac-24
    ref_id: AC-24
    name: Рішення щодо управління доступом
    category: technical
    csf_function: protect
    description: '[Вибір: Встановити процедури; Запровадити механізми], щоб забезпечити застосування [Призначення:
      визначені організацією рішення щодо контролю доступу] до кожного запиту щодо доступу до виконання доступу.


      Параметри:

      1. Вибір: Встановити процедури; Запровадити механізми

      2. Призначення: визначені організацією рішення щодо контролю доступу'
    annotation: Рішення щодо управління доступом (також відомі як рішення про авторизацію) мають бути забезпечені
      у випадках, коли для отримання конкретного доступу вимагається певна авторизаційна інформація. Зауважимо,
      що забезпечення доступу відбувається у випадках, коли в системі впроваджені заходи безпеки щодо управління
      доступом. Попри те, що рішення щодо управління доступом і заходи щодо управління доступом часто покладені
      на один суб’єкт, — це не завжди оптимальне розподілення обов’язків. Наприклад, для деяких архітектур і розподілених
      систем такі функції можуть бути покладені на різні сутності.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ac-24.1
    ref_id: AC-24(1)
    name: Рішення щодо управління доступом — Інформація про передачу авторизованого доступу
    category: technical
    csf_function: protect
    description: 'Передавати [Призначення: визначену організацією інформацію щодо авторизації доступу] за допомогою
      [Призначення: визначених організацією заходів безпеки] до [Призначення: визначених організацією систем], які


      забезпечують ухвалення рішень щодо управління доступом.


      Параметри:

      1. Призначення: визначену організацією інформацію щодо авторизації доступу

      2. Призначення: визначених організацією заходів безпеки

      3. Призначення: визначених організацією систем'
    annotation: 'У розподілених системах процеси авторизації та рішення щодо управління доступом можуть відбуватися
      в окремих частинах систем. У таких випадках інформація про авторизацію має передаватися надійно, тому рішення
      щодо управління доступом мають бути впроваджені у відповідних місцях. Для виконання рішень щодо управління
      доступом може знадобитися передача атрибутів безпеки у складі авторизаційної інформації. Це пояснюється тим,
      що в розподілених системах можуть бути впроваджені різні рішення щодо управління доступом, так само як можуть
      бути наявні різні суб’єкти, що ухвалюють такі рішення послідовно (при цьому кожен з таких суб’єктів вимагає
      наявність атрибутів безпеки для ухвалення рішення).

      Посилення заходу щодо захисту авторизаційної інформації гарантує, що така інформація не може бути підроблена
      або порушена в процесі передачі.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ac-24.2
    ref_id: AC-24(2)
    name: Рішення щодо управління доступом — Відсутність ідентифікації користувача або процесу, що діє від імені
      користувача
    category: technical
    csf_function: protect
    description: 'Здійснювати ухвалення рішень щодо управління доступом, засновуючись на [Призначення: визначених
      організацією атрибутах безпеки], які не охоплюють ідентифікацію користувача або процесу, що діє від імені
      користувача.


      Параметри:

      1. Призначення: визначених організацією атрибутах безпеки'
    annotation: 'У певних ситуаціях необхідно, щоб рішення щодо управління доступом ухвалювалися без інформації
      щодо особи, яка надає запит.

      Здебільшого таке виникає у випадках, коли вимагається збереження конфіденційності користувача. В інших ситуаціях
      ідентифікаційна інформація користувача просто непотрібна для ухвалення рішень щодо управління доступом і,
      особливо у випадку розподілених систем, передача такої інформації з необхідним ступенем надійності може бути
      дуже дорогою або такою, що складно реалізовується.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ac-25
    ref_id: AC-25
    name: Диспетчер доступу
    category: technical
    csf_function: protect
    description: 'Впровадити диспетчер доступу для [Призначення: визначеної організацією політики контролю доступу],
      який захищений від несанкціонованого доступу, завжди був доступний для виклику та досить компактний, щоб бути
      підданим аналізу й тестуванню, надійність якого може бути гарантована.


      Параметри:

      1. Призначення: визначеної організацією політики контролю доступу'
    annotation: 'Інформація, що міститься в системі, являє собою структури даних. Внутрішні структури даних можуть
      бути представлені двома видами сутностей:

      активні та пасивні. Активні сутності зазвичай називають суб’єктами — вони асоціюються з особами, пристроями
      або процесами, що діють від їх імені. Пасивними сутностями виступають об’єкти, які асоціюються зі структурами
      даних, такими як записи, буфери, таблиці, файли, порти зв’язку. Диспетчери доступу застосовують обов’язкові
      політики управління доступом — тип контролю доступу, який обмежує доступ до об’єктів суб’єктів на основі ідентичності
      груп, до яких вони належать.

      Управління доступом є обов’язковим, оскільки суб’єктам з певними привілеями (тобто дозволами доступу) заборонено
      передавати ці привілеї будь-яким іншим суб’єктам (прямо чи опосередковано), тобто система має забезпечувати
      чітке виконання політики управління доступом. Диспетчер доступу перешкоджає порушенню роботи механізму.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:at-1
    ref_id: AT-1
    name: Політика та процедури підвищення обізнаності та навчання
    category: policy
    csf_function: protect
    description: "a. Розробити, задокументувати та поширити [Призначення: серед визначеного організацією персоналу\
      \ або ролей]:\n1. [Вибір (один або декілька): Рівень організації; Рівень місії/бізнес-процесу; рівень системи]\
      \ політики обізнаності та навчання у сфері забезпечення безпеки та приватності, яка:\n\ta) містить мету, сферу\
      \ застосування, ролі, обов’язки, відповідальність керівництва, координацію між організаційними підрозділами\
      \ та систему контролю відповідності (complaince);\n\t(b) відповідає чинним законам, нормативним документам,\
      \ директивам, нормам, політикам, стандартам та керівним документам.\n\n2. Процедури, що сприяють реалізації\
      \ політики підвищення обізнаності та професійної підготовки в галузі безпеки, приватності, а також пов’язаних\
      \ з ними заходів захисту інформації та персональних даних.\nb. Призначити [Призначення: визначену організацією\
      \ посадову особу] для управління політикою та процедурами підвищення обізнаності та навчання у сфері забезпечення\
      \ безпеки та приватності.\nc. Переглядати та оновлювати:\n\n1. Поточну політика [Призначення: частота, визначена\
      \ організацією] і наступне [Призначення: події, визначені організацією];\n2. Процедури [Призначення: частота,\
      \ визначена організацією] та наступні [Призначення: події, визначені організацією].\n\nПараметри:\n1. Призначення:\
      \ серед визначеного організацією персоналу або ролей\n2. Вибір (один або декілька): Рівень організації; Рівень\
      \ місії/бізнес-процесу; рівень системи\n3. Призначення: визначену організацією посадову особу\n4. Призначення:\
      \ частота, визначена організацією\n5. Призначення: події, визначені організацією"
    annotation: Цей захід захисту стосується встановлення політики та процедур для ефективного здійснення заходів
      та їх посилень у класі AT. Стратегія управління ризиками є важливим фактором у встановленні політики та процедур
      обізнаності та навчання. За наявності політики, а також планів захисту інформації та персональних даних на
      рівні організації, конкретні системні політики та процедури можуть бути непотрібні. Політика може бути внесена
      до складу загальної політики безпеки та приватності або може бути представлена кількома політиками (у випадках
      складної архітектури). Процедури описують, як має реалізуватися політика чи заходи захисту та як вони можуть
      бути спрямовані на персонал або роль, яка є об’єктом процедури. Процедури можуть бути задокументовані в планах
      захисту інформації та персональних даних (як один чи декілька документів). Події, які можуть спричинити оновлення
      політики й процедур підвищення обізнаності та навчання, включають висновки оцінки чи аудиту, інциденти чи
      порушення безпеки або зміни у чинних законах, розпорядженнях, директивах, постановах, політиках, стандартах
      і вказівках. Повторне встановлення засобів контролю не є організаційною політикою чи процедурою.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:at-2
    ref_id: AT-2
    name: Навчання з підвищення обізнаності
    category: process
    csf_function: protect
    description: 'Впровадити базові тренінги з підвищення обізнаності у сфері безпеки та приватності для користувачів
      системи (включно з менеджерами, керівниками компаній і підрядниками):

      a. Забезпечити навчання грамотності з питань безпеки та конфіденційності для користувачів системи (включаючи
      менеджерів, керівників вищої ланки та підрядників):

      1. як частину початкового навчання для нових користувачів і [Призначення: частота, визначена організацією]
      після цього;

      2. якщо цього потребують системні зміни або наступні [Призначення: події, визначені організацією].

      b. Використовувати наведені нижче методи, щоб підвищити рівень безпеки та конфіденційності користувачів системи
      [Завдання: визначені організацією методи поінформованості];

      c. Оновлювати навчання грамотності та зміст обізнаності [Завдання: частота, визначена організацією] і наступні
      [Завдання: події, визначені організацією];

      d. Включити уроки, отримані з внутрішніх або зовнішніх інцидентів безпеки або порушень, у навчання грамотності
      та методи підвищення обізнаності.


      Параметри:

      1. Призначення: частота, визначена організацією

      2. Призначення: події, визначені організацією

      3. Завдання: визначені організацією методи поінформованості'
    annotation: 'Зміст тренінгів з питань безпеки та приватності, а також методів обізнаності щодо безпеки та приватності
      має визначатися на основі конкретних вимог і систем організації, до яких персонал отримав дозвіл на доступ.
      Зміст має розкривати необхідність інформаційної безпеки та приватності, а також розкривати дії користувачів
      щодо збереження безпеки та приватності, реагування на інциденти безпеки та приватності. У тренінгах також
      має надаватися інформація щодо необхідності дотримання безпеки операцій. Повідомлення для підвищення обізнаності
      щодо безпеки та приватності можуть містити: демонстрацію плакатів, поширення матеріалів про безпеку та приватність,
      розсилки рекомендацій/повідомлень електронною поштою, показ повідомлень на екрані входу в систему та проведення
      інформаційних заходів щодо захисту інформації та приватності. Періодичність навчання з підвищення обізнаності
      після початкової підготовки (тобто описаного AT-2a.1) визначається чинними законами, директивами, положеннями
      та політиками (пропонується принцип збільшення періоду між тренінгами). Таке навчання може проводитися сесійно
      й охоплювати актуальну інформацію про зміни в політиці безпеки та приватності організації, переглянуті очікування
      щодо безпеки та приватності та/або теми з початкового навчання.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:at-2.1
    ref_id: AT-2(1)
    name: Навчання з підвищення обізнаності — Практичні заняття
    category: process
    csf_function: protect
    description: Ввести до програми навчання практичні заняття (вправи) з тренування обізнаності, які імітують інциденти
      в області безпеки та приватності.
    annotation: 'Практичні вправи можуть містити використання засобів соціальної інженерії та бути направлені на:
      збір інформації; отримання несанкціонованого доступу; імітування несприятливого впливу відкриття зловмисних
      вкладень електронної пошти або перехід за шкідливим вебпосиланнями. Практичні вправи, пов’язані з приватністю,
      можуть містити, наприклад, практичні модулі з тестами щодо обробки персональної інформації.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:at-2.2
    ref_id: AT-2(2)
    name: Навчання з підвищення обізнаності — Внутрішні загрози
    category: process
    csf_function: protect
    description: Ввести до програми навчання вправи з розпізнавання та виявлення потенційних індикаторів внутрішніх
      загроз.
    annotation: 'Потенційними індикаторами наявності внутрішніх загроз можуть бути такі ознаки: довготривале незадоволення
      роботою; спроби отримати доступ до інформації, яка не є потрібною для виконання службових обов’язків; нез’ясований
      доступ до фінансових ресурсів; знущання чи сексуальне домагання колег; насильство на робочому місці та інші
      серйозні порушення організаційної політики, процедур, директив і правил. Навчання з питань безпеки та приватності
      має містити рекомендації, як повідомляти про занепокоєння працівників і керівництва щодо потенційних індикаторів
      внутрішніх загроз через організаційні канали відповідно до встановленої політики та процедур.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:at-2.3
    ref_id: AT-2(3)
    name: Навчання з підвищення обізнаності — Соціальна інженерія та соціальний інтелектуальний аналіз даних
    category: process
    csf_function: protect
    description: Ввести до програми навчання вправи з підвищення обізнаності щодо розпізнавання та повідомлення
      про потенційні та фактичні атаки, з використанням методів соціальної інженерії та інтелектуального аналізу
      соціальних даних.
    annotation: Соціальна інженерія — це методи спонукання (обману) когось на розкриття інформації або вживання
      дій, які можуть бути використані для нападу чи компрометації систем. Прикладами соціальної інженерії може
      виступати фішинг, претекстинг і хейдгайтинг. Соціальний інтелектуальний аналіз даних — це спроба в соціальному
      середовищі зібрати інформацію про організацію, яка може бути використана для майбутніх атак. Навчання з питань
      безпеки та приватності має містити відомості про те, як повідомляти про занепокоєння працівників і керівництва
      щодо потенційних і реальних випадків соціального інжинірингу та інтелектуального аналізу даних через організаційні
      канали на основі встановленої політики та процедур.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:at-2.4
    ref_id: AT-2(4)
    name: Навчання з підвищення обізнаності — Підозрілі повідомлення та аномальна поведінка системи
    category: process
    csf_function: protect
    description: 'Провести навчання грамотності щодо розпізнавання підозрілих комунікацій і аномальної поведінки
      в системах організації за допомогою [Завдання: визначені організацією індикатори шкідливого коду]


      Параметри:

      1. Завдання: визначені організацією індикатори шкідливого коду'
    annotation: Добре навчений персонал забезпечує ще один контроль організації, який можна використовувати як частину
      стратегії поглибленого захисту від зловмисного коду, який потрапляє в організації через електронну пошту або
      вебдодатки. Персонал, який навчений розпізнавати ознаки потенційно підозрілої електронної пошти (наприклад,
      отримання несподіваного електронного листа, отримання електронного листа з дивною чи поганою граматикою або
      отримання електронного листа від незнайомого відправника, адреса якого схожа на відому компанію чи підрядника)
      та правильно реагувати на підозрілу електронну пошту чи вебповідомлення. Щоб цей процес працював ефективно,
      персонал проходить навчання та інформує про такі підозрілі повідомлення. Навчання персоналу тому, як розпізнавати
      аномальну поведінку в системах, може забезпечити організації завчасне попередження про наявність шкідливого
      коду. Визнання аномальної поведінки персоналом організації може доповнити інструменти та системи виявлення
      шкідливого коду та захисту, які використовують в організації.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:at-2.5
    ref_id: AT-2(5)
    name: Навчання з підвищення обізнаності — Вдосконалена стійка загроза
    category: process
    csf_function: protect
    description: Забезпечити навчання грамотності щодо стійкої постійної загрози.
    annotation: Ефективним способом виявлення вдосконалених стійких загроз (APT) і запобігання успішним атакам є
      проведення спеціального навчання для окремих осіб. Навчання включає різні способи, якими APT можуть проникнути
      в організацію (наприклад, через вебсайти, електронні листи, спливаючі рекламні вікна, статті та соціальну
      інженерію) та прийоми розпізнавання підозрілих електронних листів, використання знімних систем у незахищених
      налаштуваннях і потенційне націлювання на людей удома.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:at-2.6
    ref_id: AT-2(6)
    name: Навчання з підвищення обізнаності — Середовище кіберзагроз
    category: process
    csf_function: protect
    description: 'a. Забезпечити навчання грамотності щодо середовища кіберзагроз; і

      b. Відображати поточну інформацію про кіберзагрози в операціях системи.'
    annotation: Оскільки загрози продовжують змінюватися з часом, навчання грамотності в організації є динамічним.
      Крім того, навчання щодо загроз не проводиться ізольовано від операцій системи, які підтримують місію організації
      та бізнес-функції.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:at-3
    ref_id: AT-3
    name: Рольове навчання
    category: process
    csf_function: protect
    description: 'a. Забезпечити проведення навчання з питань безпеки та приватності на основі ролей для працівників
      з ролями та обов’язками: [Призначення: визначені організацією ролі та обов’язки]:

      1. перед авторизацією доступу до системи, інформації або виконанням призначених обов’язків і [Призначення:
      частота, визначена організацією] після цього;

      2. коли цього потребують системні зміни.

      b. Оновити навчальний контент на основі ролей [Призначення: частота, визначена організацією] і наступні [Призначення:
      події, визначені організацією];

      c. Включіть у рольове навчання, інформацію, отриману з внутрішніх або зовнішніх інцидентів та порушень безпеки.


      Параметри:

      1. Призначення: визначені організацією ролі та обов’язки

      2. Призначення: частота, визначена організацією

      3. Призначення: події, визначені організацією'
    annotation: 'Відповідний зміст тренінгів з безпеки та приватності на основі ролей має бути визначений на основі
      обов’язків осіб і конкретних вимог щодо безпеки та приватності організації та інформаційних систем, до яких
      персонал має доступ, включно з технічною підготовкою, пов’язаною з безпекою, спеціально розробленою для виконання
      покладених на них обов’язків. Ролі, які можуть вимагати навчання з безпеки та приватності: власники системи;
      уповноважені посадові особи; працівники служби безпеки (захисту інформації); посадові особи, відповідальні
      за проєктування архітектори підприємств; посадові особи з питань закупівель; системні інженери; розробники
      систем і програмного забезпечення; системні адміністратори; адміністратори мереж; адміністратори баз даних;
      персонал, що здійснює діяльність з управління конфігурацією; аудитори; персонал, що має доступ до програмного
      забезпечення на рівні системи; персонал, який має обов’язки з планування дій у надзвичайних ситуаціях та реагування
      на надзвичайні ситуації; персонал, що відповідає за управління приватністю; персонал, що має доступ до персональних
      даних. Комплексне рольове навчання стосується менеджерських, експлуатаційних і технічних ролей, що охоплюють
      фізичні, кадрові й технічні гарантії та контрзаходи. Таке навчання може містити огляд політики, процедур,
      інструментів і методів для визначених ролей. Організації проводять навчання, необхідне для виконання посадовими
      особами своїх обов’язків, пов’язаних з операціями та безпекою ланцюгів постачання, у контексті програм інформаційної
      безпеки та приватності. Рольове навчання з питань безпеки та приватності повинні також проходити підрядники.
      Типи навчання включають веб- та комп’ютерне навчання, навчання в аудиторії та практичне навчання (включаючи
      мікронавчання). Регулярне оновлення навчального матеріалу на основі ролей допомагає гарантувати, що його зміст
      залишається доречним і ефективним. Події, які можуть спричинити оновлення змісту навчання на основі ролей,
      включають, але не обмежуються ними, висновки оцінки або аудиту, інциденти безпеки або порушення, або зміни
      в застосовних законах, розпорядженнях, директивах, постановах, політиках, стандартах і інструкціях.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:at-3.1
    ref_id: AT-3(1)
    name: Рольове навчання — Заходи захисту робочого середовища
    category: process
    csf_function: protect
    description: 'Надати [Призначення: визначеним організацією персоналу чи посадам] з початку роботи та з [призначенням:
      визначеною організацією частотою] підготовку з питань застосування заходів захисту робочого середовища.


      Параметри:

      1. Призначення: визначеним організацією персоналу чи посадам'
    annotation: Заходи захисту робочого середовища охоплюють пристрої/системи пожежогасіння та системи виявлення
      пожеж, спринклерні системи, ручні вогнегасники, нерухомі пожежні шланги, детектори диму, контролери температури/вологості,
      опалення, вентиляції та кондиціонування повітря всередині об’єкта. Організації визначають персонал з конкретними
      ролями й обов’язками, пов’язаними із заходами безпеки робочого середовища, який має проходити спеціалізовану
      підготовку.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:at-3.2
    ref_id: AT-3(2)
    name: Рольове навчання — Фізичні заходи безпеки
    category: process
    csf_function: protect
    description: 'Надати [Призначення: визначеним організацією персоналу чи ролям] з початку роботи та з [Призначення:
      визначеною організацією частотою] підготовку з питань застосування та експлуатації заходів фізичної безпеки.


      Параметри:

      1. Призначення: визначеним організацією персоналу чи ролям

      2. Призначення: визначеною організацією частотою'
    annotation: Фізичні заходи безпеки охоплюють пристрої контролю фізичного доступу, фізичну сигналізацію, обладнання
      для контролю/спостереження та охорону безпеки (процедури розгортання й експлуатації). Організації визначають
      персонал з конкретними ролями та обов’язками, пов’язаними з фізичними заходами безпеки, який має проходити
      спеціалізовану підготовку.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:at-3.3
    ref_id: AT-3(3)
    name: Рольове навчання — Практичні заняття
    category: process
    csf_function: protect
    description: Ввести до програми навчання практичні заняття з безпеки та приватності, які мають підкріпити досягнення
      цілей навчання.
    annotation: Практичні заняття з безпеки можуть охоплювати тренінги з безпеки для розробників програмного забезпечення.
      Такі тренінги мають містити вправи з протидії імітованим кібератакам, що використовують загальні вразливості
      програмного забезпечення, або фішинг-атакам, націленим на старших керівників. Практичні заняття щодо приватності
      можуть містити модулі з тестами щодо обробки персональних даних у різних сценаріях та методи оцінювання шкідливого
      впливу на приватність.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:at-3.4
    ref_id: AT-3(4)
    name: Рольове навчання — Підозрілі зв’язки та аномальна поведінка системи
    category: process
    csf_function: protect
    description: 'Вилучено: включено до AT-2(4).'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:at-3.5
    ref_id: AT-3(5)
    name: Рольове навчання — Обробка персональних даних
    category: process
    csf_function: protect
    description: 'Забезпечити [Призначення: персонал або посади, визначені організацією] початкове та [Призначення:
      частота, визначену організацією] навчання з використання та управління обробкою персональних даних та контролю
      прозорості.


      Параметри:

      1. Призначення: персонал або посади, визначені організацією

      2. Призначення: частота, визначену організацією'
    annotation: Обробка персональної інформації та контроль прозорості включають повноваження організації обробляти
      персональну інформацію та цілі її обробки. Рольове навчання для федеральних агентств розглядає типи інформації,
      яка може становити персональні дані, а також ризики, міркування та зобов’язання, пов’язані з її обробкою.
      Таке навчання також передбачає повноваження обробляти персональні дані, задокументовану в політиках конфіденційності
      та повідомленнях, повідомленнях про систему записів, угодах і повідомленнях про комп’ютерне зіставлення, оцінці
      впливу на конфіденційність, заявах приватності, контрактах, угодах про обмін інформацією, меморандумах про
      взаєморозуміння та/ або іншу документацію.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:at-4
    ref_id: AT-4
    name: Навчальні записи
    category: process
    csf_function: protect
    description: 'a. Документувати та відстежувати індивідуальні навчальні заходи із забезпечення безпеки та приватності,
      включно з базовою підготовкою з питань безпеки та приватності, а також спеціальною підготовкою з питань безпеки
      та приватності визначених посадових осіб.


      b. Зберігати індивідуальні записи про навчання впродовж [Призначення: визначеного організацією періоду часу].


      Параметри:

      1. Призначення: визначеного організацією періоду часу'
    annotation: Документацію щодо спеціалізованого навчання можуть вести окремі керівники за бажанням організації.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:at-5
    ref_id: AT-5
    name: Контакти з групами безпеки та асоціаціями
    category: process
    csf_function: protect
    description: 'Вилучено: Включено до PM-15.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:at-6
    ref_id: AT-6
    name: Відгуки про проведені навчання
    category: process
    csf_function: protect
    description: 'Надати відгук про результати організаційного навчання наступному персоналу [Призначення: з визначеною
      організацією частотою та визначеному організацією персоналу]


      Параметри:

      1. Призначення: з визначеною організацією частотою та визначеному організацією персоналу'
    annotation: 'Зворотний зв’язок із навчанням включає результати тренінгу


      з підвищення обізнаності та результати тренінгу на основі ролей. Результати навчання, особливо невдачі персоналу
      на критичних посадах, можуть свідчити про потенційно серйозну проблему. Тому важливо, щоб керівники вищої
      ланки були поінформовані про такі ситуації, та могли вжити відповідних заходів. Зворотний зв’язок із навчанням
      підтримує оцінку та оновлення організаційного навчання, описаного в AT-2(b) та AT-3(b)'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:au-1
    ref_id: AU-1
    name: Політика та процедури аудиту та підзвітності
    category: policy
    csf_function: protect
    description: "a.     Розробити, задокументувати та поширити [Призначення: серед персоналу або ролей, що їх визначила\
      \ організація]:\n\n1. [Вибір (один або декілька): Рівень організації; Рівень місії/бізнес-процесу; рівень\
      \ системи] політика аудиту та підзвітності, яка:\n\t(a) містить мету, сферу застосування, ролі, обов’язки,\
      \ відповідальність керівництва, координацію між організаційними підрозділами та систему контролю відповідності\
      \ (complaince);\n\t(b) відповідає чинним законам, нормативним документам, директивам, нормам, політикам, стандартам\
      \ та керівним документам.\n2.      Процедури, що сприяють здійсненню політики аудиту та підзвітності, а також\
      \ пов’язані з ними заходи аудиту та підзвітності.\n\nb. Призначити [Призначення: визначену організацією старшу\
      \ посадову особу] для управління політикою та процедурами аудиту та підзвітності.\n\nc. Переглядати та оновлювати\
      \ поточний аудит та підзвітність:\n\n1. політику [Призначення: частота, визначена організацією] та наступне\
      \ [Призначення: події, визначені організацією];\n\n2. процедури аудиту [Призначення: визначеною організацією\
      \ частотою] та [Завдання: події, визначені організацією].\n\nПараметри:\n1. Призначення: серед персоналу або\
      \ ролей, що їх визначила організація\n2. Вибір (один або декілька): Рівень організації; Рівень місії/бізнес-процесу;\
      \ рівень системи\n3. Призначення: визначену організацією старшу посадову особу\n4. Призначення: частота, визначена\
      \ організацією\n5. Призначення: події, визначені організацією\n6. Призначення: визначеною організацією частотою"
    annotation: Цей захід захисту стосується встановлення політики та процедур для ефективного здійснення заходів
      та їх посилень у класі AU. Стратегія управління ризиками є важливим фактором у встановленні політики та процедур.
      Комплексна політика та процедури допомагають забезпечити безпеку та приватність. За наявності політики, а
      також планів захисту інформації та персональних даних на рівні організації, конкретні системні політики та
      процедури можуть бути не потрібні. Політика може бути внесена до складу загальної політики безпеки та приватності
      або може бути представлена кількома політиками (у випадках складної архітектури). Процедури описують, як має
      реалізуватися політика чи заходи захисту та як вони можуть бути спрямовані на персонал або роль, що є об’єктом
      процедури. Процедури можуть бути задокументовані в планах захисту інформації та персональних даних (як один
      або декілька документів). Події, які можуть спричинити оновлення політики та процедур аудиту та підзвітності,
      включають висновки оцінки або аудиту, інциденти чи порушення безпеки або зміни у чинних законах, розпорядженнях,
      директивах, положеннях, політиках, стандартах і вказівках. Просте повторне встановлення засобів контролю не
      є організаційною політикою чи процедурою.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:au-2
    ref_id: AU-2
    name: Події аудиту
    category: process
    csf_function: protect
    description: 'Заходи захисту:


      a.    Визначити типи подій, які система може реєструвати для підтримки функції аудиту: [Призначення: типи
      подій, визначені організацією, які система здатна реєструвати];


      b.    Координувати функції аудиту безпеки з іншими організаційними підрозділами, які вимагають інформації,
      пов’язаної з аудитом, для посилення взаємної підтримки та допомоги у виборі типів подій, що перевіряються;


      c.    Визначити, які типи подій підлягають аудиту: [Призначення: визначені організацією події, що підлягають
      аудиту (підмножина подій, що підлягають аудиту, визначених в AU-2 a.), а також частота (або ситуація, що вимагає)
      проведення аудиту для кожної ідентифікованої події]


      d.    Обґрунтувати, чому типи подій, що перевіряються, вважаються достатніми для підтримки розслідувань інцидентів
      (постфактум), пов’язаних з безпекою та приватністю;


      e.    Перегляньте й оновіть типи подій, вибрані для журналювання [Призначення: частота, визначена організацією].


      Параметри:

      1. Призначення: типи подій, визначені організацією, які система здатна реєструвати

      2. Призначення: визначені організацією події, що підлягають аудиту (підмножина подій, що підлягають аудиту,
      визначених в AU-2 a.), а також частота (або ситуація, що вимагає) проведення аудиту для кожної ідентифікованої
      події

      3. Призначення: частота, визначена організацією'
    annotation: 'Подія — це будь-яке явище, що відбувається в системі. Організації ідентифікують типи подій аудиту
      як такі події, що мають значення та стосуються безпеки систем і середовища, у яких ці системи функціонують.
      Типи подій аудиту можуть містити: зміни паролів; невдалі входи в систему або невдалий доступ; зміна атрибутів
      безпеки, використання адміністративних привілеїв. Після визначення типів подій аудиту для кожного з них призначаються
      заходи безпеки, які мають бути реалізовані. Визначаючи набір типів подій, які будуть реєструватися, організації
      вважають, що моніторинг і аудит є відповідними для кожного засобу контролю, який необхідно запровадити. Для
      повноти реєстрація подій включає всі протоколи, які працюють і підтримуються системою. Для того щоб збалансувати
      вимоги до аудиту з іншими потребами системи, цей захід безпеки також вимагає виявити ту підмножину типів подій
      аудиту, які мають перевірятися в певний момент часу. Наприклад, може бути визначено, що в системі повинна
      бути можливість запису кожного доступу до файлів — як успішного, так і невдалого, але разом з тим, має бути
      можливість активації/деактивації такої функції за конкретних обставин. Типи подій, які організації бажають
      реєструвати, можуть змінюватися. Перегляд і оновлення набору зареєстрованих подій є необхідним, щоб переконатися,
      що події залишаються актуальними та продовжують підтримувати потреби організації. Організації розглядають,
      які типи подій журналювання можуть виявити персональні дані, що може спричинити загрозу конфіденційності,
      а також як пом’якшити такі ризики. Наприклад, існує ймовірність виявлення персональних даних в контрольному
      сліді, особливо якщо подія журналювання базується на шаблонах або часу використання. Вимоги до аудиту, включно
      з необхідністю обробки подій аудиту, можуть посилатися на інші засоби безпеки та конфіденційності й посилення,
      наприклад AC-2 (4), AC-3 (10), AC-6 (9), AC-17 (1), CM-3f, CM-5 (1), IA-3 (3.b), MA-4 (1), MP-4 (2), PE-3,
      PM-21, RA-8, SC-7 (9), SC-7 (15), SI-3 (8), SI-4 (22), SI-7 (8) та SI-10 (1). Також можуть бути визначені
      типи заходів, що підлягають аудиту (регулюється чинним законодавством, наказами, директивами та політиками).
      Записи аудиту можуть створюватися на різних рівнях, у тому числі на рівні пакетів (у випадках, коли інформація
      проходить через мережу). Вибір відповідного рівня аудиту є важливим аспектом і може сприяти виявленню першопричин
      інцидентів (зокрема потенційних). Визначаючи типи подій, організації розглядають журналювання, необхідне для
      охоплення пов’язаних типів подій, таких як кроки в розподілених процесах на основі транзакцій і дії, які відбуваються
      в сервіс-орієнтованих архітектурах.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:au-2.1
