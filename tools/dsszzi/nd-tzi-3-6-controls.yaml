    category: process
    csf_function: recover
    description: 'a. Протестувати план забезпечення безперервної роботи та відновлення функціонування системи з
      [Призначення: визначеною організацією частотою], використовуючи [Призначення: тести, що визначила організація],
      з метою визначення ефективності плану та організаційної готовності виконати план.

      b. Переглядати результати тестування плану.

      c. За необхідності ініціювати коригувальні дії.


      Параметри:

      1. Призначення: визначеною організацією частотою

      2. Призначення: тести, що визначила організація'
    annotation: 'Методи тестування плану забезпечення безперервної роботи та відновлення функціонування для визначення
      ефективності планів та виявлення потенційних недоліків у них містять: анкетування, моделювання ситуацій та
      комплексні вправи. Організації проводять тестування на основі вимог безперервності в планах на випадок позаштатних
      ситуацій і охоплюють визначення впливу на організаційні операції, активи та осіб, що виникають внаслідок дій
      у позаштатних ситуаціях. Корегувальні дії мають бути гнучкими з погляду обсягів і строків.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:cp-4.1
    ref_id: CP-4(1)
    name: Тестування плану забезпечення безперервної роботи та відновлення функціонування — Координація з пов’язаними
      планами
    category: process
    csf_function: recover
    description: Координувати тестування плану забезпечення безперервної роботи та відновлення функціонування з
      організаційними підрозділами, що відповідають за реалізацію пов’язаних планів.
    annotation: Плани, які пов’язані з планом забезпечення безперервної роботи та відновлення функціонування, містять,
      наприклад, плани безперервності, плани відновлення після аварій, плани безперервності операцій, плани критичної
      інфраструктури, плани реагування на кіберінциденти. Це посилення заходу не вимагає від організацій створювати
      організаційні елементи для обробки пов’язаних планів або узгоджувати такі елементи з конкретними планами.
      Однак це необхідно, якщо такі організаційні елементи відповідають за пов’язані плани. У такому разі організації
      повинні координувати ці елементи.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:cp-4.2
    ref_id: CP-4(2)
    name: Тестування плану забезпечення безперервної роботи та відновлення функціонування — Альтернативна платформа
      тестування
    category: process
    csf_function: recover
    description: 'Організація тестує план забезпечення безперервної роботи та відновлення функціонування на альтернативній
      платформі тестування:

      (a) ознайомлює персонал з об’єктом та наявними ресурсами;

      (b) оцінює можливості альтернативної платформи тестування для підтримки безперервної роботи.'
    annotation: Умови функціонування на альтернативній платформі можуть значно відрізнятися від умов на основній
      платформі. Можливість відвідати альтернативну платформу і відчути фактичні можливості, доступні на ній, може
      надати важливу інформацію про потенційні вразливості, які можуть вплинути на важливу місію організації та
      бізнес-функції, а також уточнити план забезпечення безперервної роботи та відновлення функціонування для усунення
      вразливостей, виявлених під час тестування.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:cp-4.3
    ref_id: CP-4(3)
    name: Тестування плану забезпечення безперервної роботи та відновлення функціонування — Автоматичне тестування
    category: process
    csf_function: recover
    description: 'Перевіряйте план забезпечення безперервної роботи та відновлення функціонування за допомогою [Призначення:
      автоматизовані механізми, визначені організацією].


      Параметри:

      1. Призначення: автоматизовані механізми, визначені організацією'
    annotation: Автоматизовані механізми сприяють більш ретельному та ефективному тестуванню планів забезпечення
      безперервної роботи та відновлення функціонування. Це відбувається шляхом забезпечення більш повного висвітлення
      проблем у позаштатних ситуаціях; шляхом вибору більш реалістичних тестових сценаріїв і середовищ.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:cp-4.4
    ref_id: CP-4(4)
    name: Тестування плану забезпечення безперервної роботи та відновлення функціонування — Повне відновлення
    category: process
    csf_function: recover
    description: Ввести повне відновлення та повернення системи до відомого стану як частину тестування плану забезпечення
      безперервної роботи та відновлення функціонування.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:cp-4.5
    ref_id: CP-4(5)
    name: Тестування плану забезпечення безперервної роботи та відновлення функціонування — Самовиклик
    category: process
    csf_function: recover
    description: 'Застосовуйте [Призначення: визначені організацією механізми] до [Призначення: визначену організацією
      систему чи компонент системи], щоб порушити роботу системи чи компонента системи та негативно вплинути на
      них.


      Параметри:

      1. Призначення: визначені організацією механізми

      2. Призначення: визначену організацією систему чи компонент системи'
    annotation: Часто найкращим методом оцінки стійкості системи є порушення її роботи певним чином. Механізми,
      що використовуються організацією, можуть порушувати функції системи або системні служби багатьма способами,
      включаючи припинення або відключення критичних компонентів системи, зміну конфігурації компонентів системи,
      погіршення критичної функціональності (наприклад, обмеження пропускної здатності мережі) або зміну привілеїв.
      Автоматизовані, постійні та змодельовані кібератаки та збої в обслуговуванні можуть виявити несподівані функціональні
      залежності та допомогти організації визначити її здатність забезпечити стійкість перед обличчям фактичної
      кібератаки.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:cp-5
    ref_id: CP-5
    name: Оновлення плану  забезпечення безперервної роботи та відновлення функціонування
    category: process
    csf_function: recover
    description: 'Вилучено: Включено до CP-2'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:cp-6
    ref_id: CP-6
    name: Альтернативне місце зберігання
    category: technical
    csf_function: recover
    description: 'a. Створити альтернативне місце зберігання, включно з необхідними угодами, що дозволяють зберігати
      та видавати інформацію резервного копіювання системи.

      b. Переконатися, що в альтернативному місці зберігання впроваджені заходи захисту, аналогічні заходам захисту
      основної локації.'
    annotation: Альтернативні місця зберігання — це місця, які географічно відокремлені від основних місць зберігання.
      Географічно розподілені архітектури, які підтримують вимоги щодо надзвичайних ситуацій, можуть вважатися альтернативними
      місцями зберігання. Пункти, на які поширюються угоди про альтернативні місця зберігання, включають екологічні
      умови в альтернативних місцях, правила доступу до систем і засобів, фізичні вимоги та вимоги щодо захисту
      навколишнього середовища, а також координацію доставки та отримання резервних носіїв. Альтернативні місця
      зберігання мають бути затверджені в планах забезпечення безперервної роботи та відновлення функціонування,
      щоб організації могли виконувати основні функції та завдання, незважаючи на збої в системах організації.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:cp-6.1
    ref_id: CP-6(1)
    name: Альтернативне місце зберігання — Відділення від первинного сховища
    category: technical
    csf_function: recover
    description: Визначити альтернативне місце зберігання, яке відокремлене від основного місця зберігання, щоб
      зменшити сприйнятливість до тих самих загроз.
    annotation: Загрози, які впливають на альтернативні місця зберігання, мають бути визначені при проведенні оцінювання
      ризику (наприклад, стихійні лиха, структурні збої, атаки та помилки). За результатами оцінювання загроз організації
      визначають, що вважається достатнім ступенем поділу між основними та альтернативними місцями зберігання.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:cp-6.2
    ref_id: CP-6(2)
    name: Rа-3.
    category: technical
    csf_function: recover
    description: Налаштувати альтернативне місце зберігання для полегшення операцій відновлення відповідно до часу
      відновлення та встановлених цілей відновлення.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:cp-6.3
    ref_id: CP-6(3)
    name: Альтернативне місце зберігання — Доступність
    category: technical
    csf_function: recover
    description: Визначити потенційні проблеми доступності для альтернативного місця зберігання в разі збоїв або
      стихійних лих по всьому регіоні та в загальних рисах окреслити дії щодо пом’якшення наслідків.
    annotation: Порушення в усіх регіонах стосуються тих типів перебоїв, які є широкими в географічному масштабі.
      Дії щодо пом’якшення наслідків охоплюють, наприклад, дублювання резервної інформації в інших альтернативних
      місцях зберігання, або забезпечення фізичного доступу для отримання резервної інформації, якщо електронний
      доступ до альтернативного місця зберігання порушений.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:cp-7
    ref_id: CP-7
    name: Альтернативний майданчик роботи
    category: technical
    csf_function: recover
    description: 'a. Створити альтернативний майданчик для роботи, включно з необхідними угодами, які дозволяють
      передачу та відновлення [Призначення: визначених організацією операцій системи] для основних завдань і функцій
      у рамках [Призначення: визначеного організацією періоду часу, відповідно термінам відновлення та встановленим
      цілям відновлення], коли можливості основного майданчика недоступні.

      b. Забезпечити на альтернативному майданчику доступними для роботи інформацію, обладнання та прилади, необхідні
      для передачі та відновлення роботи або укласти контракти протягом встановленого організацією періоду часу
      для передачі та відновлення роботи.

      c. Впровадити на альтернативному майданчику роботи заходи захисту, еквівалентні тим, що впровадженні на основному
      майданчику.


      Параметри:

      1. Призначення: визначених організацією операцій системи

      2. Призначення: визначеного організацією періоду часу, відповідно термінам відновлення та встановленим цілям
      відновлення'
    annotation: Альтернативний майданчик роботи — це майданчик, який географічно відокремлений від основного майданчика
      роботи. Альтернативний майданчик роботи забезпечує можливість роботи, якщо основний майданчик роботи не доступний.
      Географічно розподілені будівлі також можуть розглядатися як альтернативні майданчики роботи. Альтернативні
      майданчики роботи мають бути затверджені в планах забезпечення безперервної роботи та відновлення функціонування,
      щоб організації могли виконувати основні функції та завдння, незважаючи на збої в системах. Можливість альтернативної
      обробки може бути реалізована за допомогою фізичного майданчика або за допомогою постачальника хмарних послуг
      або іншої внутрішньої чи зовнішньої служби обробки. Географічно розподілені архітектури, які підтримують вимоги
      на випадок непередбачених ситуацій, також можуть розглядатися як альтернативні майданчики обробки. Контроль,
      який охоплюється угодами про альтернативні майданчики обробки, включає умови навколишнього середовища на альтернативних
      майданчиках, правила доступу, фізичні вимоги та вимоги щодо захисту навколишнього середовища, а також координацію
      передачі та призначення персоналу.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:cp-7.1
    ref_id: CP-7(1)
    name: Альтернативний майданчик для роботи — Відділення від основного майданчика
    category: technical
