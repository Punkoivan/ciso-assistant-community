    ref_id: IA-2(12)
    name: Ідентифікація та автентифікація (користувачів організації) прийняття повноважень для верифікації особистої
      інформації (piv credentials)
    category: technical
    csf_function: protect
    description: Прийняти та електронним шляхом підтвердити повноваження облікових даних особистої ідентифікації.
    annotation: Це посилення заходу застосовується у випадках, коли організації впроваджують логічні системи контролю
      доступу та фізичні системи контролю доступу. Верифікатори особистої інформації (PIV) — це облікові дані, що
      видані уповноваженими органами. Облікові дані, сумісні з PIV, — це облікові дані, видані федеральними агентствами,
      які відповідають публікації FIPS 201 і допоміжним керівним документам. Адекватність та надійність емітентів
      карток PIV авторизовано за допомогою [SP 800-79-2]. Прийняття облікових даних, сумісних із PIV, включає похідні
      облікові дані PIV, використання яких розглядається в [SP 800-166]. Картка спільного доступу DOD (CAC) є прикладом
      облікових даних PIV.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ia-2.13
    ref_id: IA-2(13)
    name: Ідентифікація та автентифікація (користувачів організації) автентифікація по зовнішньому каналу
    category: technical
    csf_function: protect
    description: 'Застосовуйте такі механізми зовнішньої автентифікації в [Призначення: умови, визначені організацією]:
      [Призначення: визначена організацією зовнішня автентифікація].


      Параметри:

      1. Призначення: умови, визначені організацією

      2. Призначення: визначена організацією зовнішня автентифікація'
    annotation: Зовнішня автентифікація передбачає використання двох окремих шляхів зв’язку для ідентифікації та
      автентифікації користувачів або пристроїв в інформаційній системі. Перший шлях (внутрішній) використовується
      для ідентифікації та автентифікації користувачів або пристроїв і, як правило, це шлях, по якому проходить
      інформація. Другий шлях (зовнішній) використовується для незалежної перевірки автентифікації та/або запитаної
      дії. Наприклад, користувач проходить автентифікацію за допомогою ноутбука на віддаленому сервері, до якого
      користувач бажає отримати доступ, і запитує певну дію сервера через цей шлях зв’язку. Згодом сервер зв’язується
      з користувачем через мобільний телефон користувача, щоб переконатися, що запитана дія походить від користувача.
      Користувач може підтвердити заплановану дію особі по телефону або надати код автентифікації. Зовнішня автентифікація
      може використовуватися для пом’якшення фактичних або ймовірних атак «людина посередині». Умови або критерії
      для активації включають підозрілу діяльність, нові індикатори загрози, підвищений рівень загрози або рівень
      впливу чи класифікації інформації в запитуваних транзакціях.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ia-3
    ref_id: IA-3
    name: Ідентифікація та автентифікація пристроїв
    category: technical
    csf_function: protect
    description: 'Унікально ідентифікувати та автентифікувати [Призначення: визначені організацією типи пристроїв]
      перед установкою [Вибір (один або кілька): локального, дистанційного, мережного] підключення.


