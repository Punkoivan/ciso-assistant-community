    annotation: Бібліотеки програмного забезпечення містять привілейовані програми.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:cm-5.7
    ref_id: CM-5(7)
    name: Обмеження доступу до зміни — Автоматичне впровадження заходів захисту
