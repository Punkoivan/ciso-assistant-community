      та стверджує, що ступінь захисту, наданий компоненту, співрозмірний з його надійністю. У міру того, як довіра до компонента
      зростає, захист від неавторизованої модифікації компонента також зростає до такого ж ступеня. Захист від несанкціонованої
      модифікації може бути у формі власного самозахисту компонента та вродженої надійності, або він може походити від захисту,
      наданого компоненту іншими елементами чи атрибутами архітектури безпеки (щоб включити захист у робочому середовищі).
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:sa-8.12
    ref_id: SA-8(12)
    name: Безпека та приватність принципів інжинірингу — Ієрархічний захист
    category: technical
    csf_function: protect
    description: 'Запровадити принцип ієрархічного захисту в [Призначення: визначені організацією системи або системні компоненти].
  
  
  
      Параметри:
  
  
      1. Призначення: визначені організацією системи або системні компоненти'
    annotation: Принцип ієрархічного захисту стверджує, що компонент не потрібно захищати від більш надійних компонентів. У
      гіршому випадку найбільш надійний компонент захищає себе від усіх інших компонентів. Наприклад, якщо ядро операційної
      системи вважається найбільш надійним компонентом у системі, то воно захищає себе від усіх ненадійних програм, які підтримує,
      але програми, навпаки, не потребують захисту від ядра. Надійність користувачів теж розглядається при застосування принципу
      ієрархічного захисту. Довіреній системі не потрібно захищати себе від настільки ж надійного користувача, що відображає
      використання ненадійних систем у середовищах «високого рівня системи», де користувачі заслуговують високої довіри та де
      застосовуються інші засоби захисту для обмеження та захисту середовища виконання «високого рівня системи».
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:sa-8.13
    ref_id: SA-8(13)
    name: Безпека та приватність принципів інжинірингу — Мінімізовані елементи безпеки
    category: technical
    csf_function: protect
    description: 'Запровадити принцип проектування безпеки з мінімізованими елементами безпеки в [Призначення: визначені організацією
      системи або компоненти системи].
  
  
  
      Параметри:
  
  
      1. Призначення: визначені організацією системи або компоненти системи'
    annotation: 'Принцип мінімізації елементів безпеки передбачає відсутність у системі сторонніх довірених компонентів. Принцип
      мінімізації елементів безпеки має два аспекти: загальну вартість аналізу безпеки та складність аналізу безпеки. Довірені
      компоненти, як правило, дорожчі для створення та впровадження через підвищену жорсткість процесів розробки. Надійні компоненти
      вимагають детальнішого аналізу безпеки для підтвердження їх надійності. Таким чином, щоб знизити вартість і зменшити складність
      аналізу безпеки, система містить якомога менше надійних компонентів. Аналіз взаємодії довірених компонентів з іншими компонентами
      системи є одним із найважливіших аспектів перевірки безпеки системи. Якщо взаємодія між компонентами є надмірно складною,
      безпеку системи також буде важче перевірити, ніж у системі, внутрішні довірчі відносини якої прості та зрозуміло побудовані.
      Загалом менша кількість довірених компонентів призводить до меншої кількості внутрішніх довірчих відносин і спрощення
      системи.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:sa-8.14
    ref_id: SA-8(14)
    name: Безпека та приватність принципів інжинірингу — Найменші привілеї
    category: technical
    csf_function: protect
    description: 'Запровадити принцип мінімальних привілеїв проектування безпеки в [Призначення: системи, визначені організацією,
      або системні компоненти].
  
  
  
      Параметри:
  
  
      1. Призначення: системи, визначені організацією, або системні компоненти'
    annotation: 'Принцип найменших привілеїв стверджує, що кожному компоненту системи надається достатня кількість привілеїв
      для виконання визначених ним функцій, але не більше. Застосування принципу найменших привілеїв обмежує сферу дій компонента,
      що має два позитивні ефекти: вплив на безпеку збою, пошкодження або неправильного використання компонента матиме мінімальний
      вплив на безпеку, а аналіз безпеки компонента буде спрощений. Найменший привілей — це поширений принцип, який відображається
      в усіх аспектах проектування безпеки системи. Інтерфейси, які використовуються для виклику можливостей компонентів, доступні
      лише для певних підмножин користувачів, а конструкція компонентів підтримує досить дрібну деталізацію привілеїв. Наприклад,
      у випадку механізму аудиту може бути інтерфейс для менеджера аудиту, який налаштовує параметри аудиту; інтерфейс для оператора
      аудиту, який забезпечує безпечний збір і зберігання даних аудиту; і, нарешті, ще один інтерфейс для перевіряючого аудитора,
      якому потрібно лише переглядати зібрані дані аудиту, але не потрібно виконувати операції з цими даними. На додаток до
      своїх проявів на системному інтерфейсі, найменші привілеї можуть використовуватися як керівний принцип внутрішньої структури
      самої системи. Одним із аспектів внутрішніх найменших привілеїв є конструювання модулів таким чином, щоб лише елементи,
      інкапсульовані модулем, безпосередньо керувалися функціями в модулі. Зовнішні по відношенню до модуля елементи, на які
      може вплинути робота модуля, мають опосередкований доступ через взаємодію (наприклад, через виклик функції) з модулем,
      який містить ці елементи. Інший аспект мінімальних внутрішніх привілеїв полягає в тому, що область даного модуля або компонента
      включає лише ті системні елементи, які необхідні для його функціональності, і що режими доступу до елементів (наприклад,
      читання, запис) є мінімальними.'
