      2. Вибір (один або кілька): локального, дистанційного, мережного'
    annotation: 'Пристрої, що потребують унікальної взаємної ідентифікації, визначаються за типом або власне пристроєм
      (чи комбінацією обох параметрів). До визначених організацією типів пристроїв можуть належати пристрої, які
      не є власністю організації. Для ідентифікації та автентифікації пристроїв у локальних мережах можуть використовуватися:
      МАС-адреси, адреси в протоколі TCP/IP, дані автентифікації зі стандарту IEEE 802.1x, TLS, RADIUS серверу тощо.
      Організації мають визначати необхідність таких механізмів автентифікації на основі категорій безпеки систем.
      Через проблеми здійснення цього заходу безпеки в широкому масштабі організації можуть обмежувати його застосування
      визначеною кількістю (і типом) пристроїв на основі потреб організації.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ia-3.1
    ref_id: IA-3(1)
    name: Ідентифікація та автентифікація пристроїв — Криптографічна двобічна автентифікація
    category: technical
    csf_function: protect
    description: 'Автентифікувати [Призначення: певні пристрої, визначені організацією та/або типи пристроїв] перед
      встановленням [Вибір (один або кілька): локального; віддаленого; мережевого] підключення за допомогою двобічної
      автентифікації, яка заснована на криптографічних механізмах.


      Параметри:

      1. Призначення: певні пристрої, визначені організацією та/або типи пристроїв

      2. Вибір (один або кілька): локального; віддаленого; мережевого'
    annotation: Локальне з’єднання — це будь-яке з’єднання з пристроєм, що відбувається без використання мережі.
      Мережеве з’єднання — це будь-яке з’єднання з пристроєм, що відбувається через мережу. Віддалене з’єднання
      — це будь-яке з’єднання з пристроєм, що відбувається через зовнішню мережу. Двонаправлена автентифікація забезпечує
      надійніший захист для перевірки ідентичності інших пристроїв для підключень, які становлять більший ризик.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ia-3.2
    ref_id: IA-3(2)
    name: Ідентифікація та автентифікація пристроїв — Криптографічна двобічна мережа автентифікації
    category: technical
    csf_function: protect
    description: 'Виключено: включено до IA-3(1).'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ia-3.3
    ref_id: IA-3(3)
    name: Ідентифікація та автентифікація пристроїв — Динамічний розподіл адреси
    category: technical
    csf_function: protect
    description: '(a) У разі динамічного розподілу адреси визначити вимоги щодо оренди динамічного розміщення адреси
      та тривалості такої оренди, призначених для пристроїв відповідно до [Призначення: інформації про оренду, визначеної
      організацією, та тривалість такої оренди]; (b) Провести аудит інформації щодо оренди при призначенні на пристрій.


      Параметри:

      1. Призначення: інформації про оренду, визначеної організацією, та тривалість такої оренди'
    annotation: Протокол динамічної конфігурації хоста (DHCP) є прикладом засобу, за допомогою якого клієнти можуть
      динамічно отримувати призначення мережевих адрес.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ia-3.4
    ref_id: IA-3(4)
    name: Ідентифікація та автентифікація пристроїв — Атестація пристрою
    category: technical
    csf_function: protect
    description: 'Здійснювати ідентифікацію та автентифікацію пристроїв на основі атестації за допомогою [Призначення:
      визначеного організацією процесу управління конфігурацією].


      Параметри:

      1. Призначення: визначеного організацією процесу управління конфігурацією'
    annotation: Атестація пристрою стосується ідентифікації та автентифікації пристрою на основі його конфігурації
      та відомого робочого стану. Атестацію пристрою можна визначити за допомогою криптографічного гешу пристрою.
      Якщо атестація пристрою є засобом ідентифікації та автентифікації, то важливо, щоб виправлення та оновлення
      пристрою оброблялися через процес керування конфігурацією безпечно та не порушувало ідентифікацію та автентифікацію
      на інших пристроях.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ia-4
    ref_id: IA-4
    name: Управління ідентифікацією
    category: process
    csf_function: protect
    description: 'Управляти системними ідентифікаторами шляхом:

      a. отримання дозволу від [Призначення: визначеного організацією персоналу або ролей] для призначення ідентифікатора
      особі, групі, ролі або пристрою;

      b. вибору ідентифікатора, який ідентифікує окрему особу, групу, роль або пристрій;

      c. призначення ідентифікатора особі, групі, ролі або пристрою;

      d. запобігання повторному використанню ідентифікаторів впродовж [Призначення: визначеного організацією періоду
      часу].


      Параметри:

      1. Призначення: визначеного організацією персоналу або ролей

      2. Призначення: визначеного організацією періоду часу'
    annotation: Загальні ідентифікатори пристроїв охоплюють, наприклад, МАС-адреси, ІР-адреси або унікальні ідентифікатори
      токенів. Управління індивідуальними ідентифікаторами не застосовується до спільних облікових записів системи.
      Зазвичай індивідуальні ідентифікатори — це імена користувачів облікових записів системи, призначених цим особам.
      У таких випадках в управлінні обліковими записами AC-2 використовуються імена облікових записів, надані IA-4.
      Цей захід безпеки також стосується окремих ідентифікаторів, не пов’язаних із системними обліковими записами.
      Запобігання повторному використанню ідентифікаторів передбачає запобігання присвоєнню раніше використовуваних
      ідентифікаторів особи, групи, ролі чи пристрою іншим особам, групам, ролям або пристроям.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ia-4.1
    ref_id: IA-4(1)
    name: Управління ідентифікацією — Заборона використання ідентифікаторів облікових записів таких самих, як і
      публічні ідентифікатори
    category: process
    csf_function: protect
    description: Заборонити використання ідентифікаторів облікових записів системи, які збігаються із загальнодоступними
      ідентифікаторами для індивідуальних облікових записів.
    annotation: Заборона використання ідентифікаторів облікових записів системи, які є такими самими, як і загальнодоступні
      ідентифікатори (наприклад, ідентифікатори адреси електронної пошти) дозволяє знизити ризик того, що порушник
      вгадає ідентифікатор користувача в системах. Використання цього заходу безпеки лише знижує ризик вгадування
      ідентифікатора; це посилення заходу необхідно використовувати разом із (а не замість) відповідними засобами
      захисту автентифікаторів та атрибутів для захисту облікового запису в цілому.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ia-4.2
    ref_id: IA-4(2)
    name: Управління ідентифікацією — Авторизація супервайзера
    category: process
    csf_function: protect
    description: 'Виключено: Включено до IA-12(1).'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ia-4.3
    ref_id: IA-4(3)
    name: Управління ідентифікацією — Множинні форми сертифікації
    category: process
    csf_function: protect
    description: 'Виключено: Включено до IA-12(2).'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ia-4.4
    ref_id: IA-4(4)
    name: Управління ідентифікацією - ідентифікація статусу користувача
    category: process
    csf_function: protect
    description: 'Управляти індивідуальними ідентифікаторами, однозначно ідентифікуючи кожного індивідуума як [Призначення:
      визначена організацією ознака, що ідентифікує індивідуальний статус].


      Параметри:

      1. Призначення: визначена організацією ознака, що ідентифікує індивідуальний статус'
    annotation: До характеристик статусу осіб належать, наприклад, статус підрядника, наявність іноземного громадянства.
      Ідентифікація статусу осіб за специфічними ознаками надає додаткову інформацію про осіб, з якими спілкується
      персонал організації. Наприклад, державному службовцю може бути корисно знати, що одна з осіб у електронному
      повідомленні є підрядником.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ia-4.5
    ref_id: IA-4(5)
    name: Управління ідентифікацією — Динамічне управління
    category: process
    csf_function: protect
    description: 'Динамічно управляти індивідуальними ідентифікаторами відповідно до [Призначення: політика динамічних
      ідентифікаторів, визначена організацією].


      Параметри:

      1. Призначення: політика динамічних ідентифікаторів, визначена організацією'
    annotation: На відміну від традиційних підходів до ідентифікації, які передбачають статичні облікові записи
      для попередньо зареєстрованих користувачів, розподілені системи можуть надавати ідентифікатори суб’єктам,
      які раніше не були відомі безпосередньо під час взаємодії. У цих ситуаціях організації передбачають і забезпечують
      динамічну видачу ідентифікаторів. При цьому важливе значення мають заздалегідь налагоджені довірчі відносини
      та механізми з відповідними органами для підтвердження ідентичності та пов’язаних даних.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ia-4.6
    ref_id: IA-4(6)
    name: Управління ідентифікацією — Крос-організаційне управління
    category: process
    csf_function: protect
    description: 'Здійснювати координацію з [Призначення: визначеними організацією  зовнішніми організаціями] для
      міжорганізаційного управління ідентифікаторами.


      Параметри:

      1. Призначення: визначеними організацією зовнішніми організаціями'
    annotation: Управління міжорганізаційними ідентифікаторами забезпечує можливість належним чином ідентифікувати
      осіб, групи, ролі або пристрої під час проведення міжорганізаційних заходів, пов’язаних з обробкою, зберіганням
      або передачею інформації.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ia-4.7
    ref_id: IA-4(7)
    name: Управління ідентифікацією — Особиста реєстрація
    category: process
    csf_function: protect
    description: 'Виключено: Включено до IA-12(4).'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ia-4.8
    ref_id: IA-4(8)
    name: Управління ідентифікацією - попарні псевдонімні ідентифікатори
    category: process
    csf_function: protect
    description: Створити попарні псевдонімні ідентифікатори.
    annotation: Парний псевдонімний ідентифікатор — це непрозорий ідентифікатор абонента, який неможливо вгадати,
      створений постачальником ідентифікаційної інформації для використання окремою повірюючою стороною. Генерування
      парних псевдонімних ідентифікаторів без ідентифікаційної інформації про користувача перешкоджає відстеженню
      активності користувачів. Попарні псевдонімні ідентифікатори мають бути унікальними для кожної сторони, за
      винятком ситуацій, коли сторони мають тісні довірчі відносини, які підтверждуються операційною потребою у
      взаємодії, або всі сторони дають згоду на взаємодію таким чином.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ia-4.9
    ref_id: IA-4(9)
    name: Управління ідентифікацією — Обслуговування атрибутів і захист
    category: process
    csf_function: protect
    description: 'Зберігайте атрибути для кожної унікально ідентифікованої особи, пристрою чи служби в [Призначення:
      визначене організацією захищене центральне сховище].


      Параметри:

      1. Призначення: визначене організацією захищене центральне сховище'
    annotation: Для кожного з об’єктів, розглянутих у IA-2, IA-3, IA-8 та IA-9, важливо підтримувати атрибути автентифікації
      на постійній основі в центральному (захищеному) сховищі.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ia-5
    ref_id: IA-5
    name: Управління автентифікатором
    category: technical
    csf_function: protect
    description: 'Управляти системними автентифікаторами шляхом:

      a. перевірки, як частини початкового розподілу автентифікатора, особи, групи, ролі або пристрою, який отримує
      автентифікатор;

      b. створення вихідного вмісту автентифікатора для будь-яких автентифікаторів, виданих організацією;

      c. забезпечення того, щоб автентифікатори мали достатню стійкість механізму для їх використання за призначенням;

      d. створення та реалізація адміністративних процедур для первинного розповсюдження автентифікаторів, для втрачених/скомпрометованих
      або пошкоджених автентифікаторів, а також для відкликання автентифікаторів;

      e. зміни типових автентифікаторів перед першим використанням;

      f. зміни/оновлення автентифікаторів у встановлений [Призначення: визначений організацією період часу за типом
      автентифікатора] або коли відбуваються [Призначення: події, визначені організацією];

      g. захисту вмісту автентифікатора від несанкціонованого розкриття та модифікацій;

      h. вимоги до осіб, які використовують пристрої, використовувати спеціальні заходи безпеки для захисту автентифікаторів;
      i. вимоги змінювати автентифікатори для облікових записів груп/ролей при зміні членства в цих облікових записах.


      Параметри:

      1. Призначення: визначений організацією період часу за типом автентифікатора

      2. Призначення: події, визначені організацією'
    annotation: До індивідуальних автентифікаторів належать паролі, криптографічні пристрої, біометричні дані, сертифікати,
      пристрої з одноразовим паролем та ідентифікаційні значки. Початковий вміст автентифікатора — це фактичний
      вміст автентифікатора, наприклад, початковий пароль. Вихідний вміст автентифікатора — це фактичний вміст автентифікатора,
      наприклад, початковий пароль. Вимоги щодо вмісту автентифікатора охоплюють, наприклад, мінімальну довжину
      пароля. Розробниками можуть надаватися компоненти системи із заводськими обліковими записами автентичності
      за замовчуванням для забезпечення початкової установки та конфігурації. Автентифікаційні дані за замовчуванням
      часто добре відомі, легко вгадуються та становлять значний ризик безпеки. Вимога щодо захисту індивідуальних
      автентифікаторів може бути реалізована через заходи безпеки PL-4 або PS-6 для автентифікаторів, що перебувають
      у власності фізичних осіб, та заходи безпеки AC-3, AC-6 та SC-28 для автентифікаторів, що зберігаються в системах
      організації, включно з паролями, які зберігаються в гешованих чи зашифрованих форматах або файлах, що містять
      зашифровані чи гешовані паролі. Системи підтримують управління автентифікатором за допомогою встановлених
      організацією налаштувань та обмежень для різних характеристик автентифікатора, включно з, наприклад, мінімальною
      довжиною пароля, проміжком часу перевірки синхронних одноразових маркерів та кількістю дозволених відхилень
      на етапі перевірки біометричної автентифікації. Дії, які можуть бути вжиті для захисту індивідуальних автентифікаторів,
      охоплюють, наприклад, надійне зберігання автентифікатора, заборону розголошення або передачі автентифікатора,
      а також вимогу негайного повідомлення про загублені, викрадені чи скомпрометовані автентифікатори. Управління
      автентифікатором охоплює видачу та відкликання автентифікаторів тимчасового доступу (наприклад, необхідного
      для віддаленого обслуговування). До автентифікаторів пристроїв належать сертифікати та паролі.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ia-5.1
    ref_id: IA-5(1)
    name: Управління автентифікатором — Автентифікація на основі пароля
    category: technical
    csf_function: protect
    description: 'Для автентифікації на основі пароля необхідно:

      (a) вести список часто використовуваних, очікуваних або скомпрометованих паролів та оновлювати його [Призначення:
      з визначеною організацією частотою], а також при підозрі, що паролі організацій скомпрометовані прямо чи опосередковано;

      (b) перевіряти, коли користувачі створюють або оновлюють паролі, що паролі не перебувають у визначеному організацією
      списку найчастіше використовуваних, очікуваних або скомпрометованих паролів у IA-5(1)(a);

      (c) передавати паролі лише через криптографічно захищені канали;

      (d) зберігати паролі за допомогою затвердженого алгоритму гешування, переважно використовуючи ключову геш-функцію;

      (e) вимагати негайного вибору нового пароля після відновлення облікового запису;

      (f) дозволити користувачеві вибирати довгі паролі та фрази, включно з пробілами та всіма друкованими символами;

      (g) використовувати автоматизовані інструменти для допомоги користувачеві у виборі надійних автентифікаторів
      паролів;

      (h) застосовувати наступні правила складу та складності: [Призначення: правила складу та складності, визначені
      організацією].


      Параметри:

      1. Призначення: з визначеною організацією частотою

      2. Призначення: правила складу та складності, визначені організацією'
    annotation: Це посилення заходу застосовується до паролів незалежно від їхнього використання в однофакторній
      або багатофакторній автентифікації. Надається перевага використанню довгих паролів. При цьому слід застосовувати
      закріплені правила генерації паролів (наприклад, мінімальна довжина символів для довгих паролів) за певних
      обставин можна забезпечити дотримання цієї вимоги в IA-5(1)(h). Якщо пароль втрачений (користувач його забув),
      має відбуватися відновлення облікового запису. Криптографічно захищені паролі містять односторонні криптографічні
      геші паролів. Список часто використовуваних, скомпрометованих або очікуваних паролів включає попередньо зламані
      паролі, слова зі словника та повторювані або послідовні символи. Список містить контекстно-залежні слова,
      такі як назва служби, ім’я користувача та похідні від них.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ia-5.2
    ref_id: IA-5(2)
    name: Управління автентифікатором — Автентифікація на основі відкритого ключа
    category: technical
    csf_function: protect
    description: '(a) Для автентифікації на основі відкритого ключа: 1) забезпечити авторизований доступ до відповідного
      закритого ключа; 2) зіставити автентифіковану особу з обліковим записом особи чи групи; (b) При використанні
      інфраструктури відкритого ключа (РКІ): 1) перевіряти сертифікати шляхом створення та перевірки шляху сертифікації
      до прийнятої довіреної прив’язки, включно з перевіркою інформації про статус сертифіката; 2) впровадити локальний
      кеш даних для підтримки виявлення та перевірки шляху.'
    annotation: Асиметрична криптографія може бути надійним механізмом автентифікації осіб і пристроїв. При використанні
      інфраструктури відкритих ключів (PKI) інформація про стан шляхів сертифікації містить списки відкликаних сертифікатів
      або відповіді протоколу статусу сертифіката. Для електронних посвідчень особистості (в тому числі PIV карток),
      у яких зберігається особистий ключ користувача, валідація сертифікатів передбачає побудову та перевірку шляху
      сертифікації до кореневого сертифіката. Впровадження локального списку відкликаних сертифікатів дозволяє здійснювати
      перевірку валідності в ситуаціях, коли системи тимчасово відключені від зовнішньої мережі.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ia-5.3
    ref_id: IA-5(3)
    name: Управління автентифікатором — Особиста або довірча автентифікація зовнішньої сторони
    category: technical
    csf_function: protect
    description: 'Виключено: Включено до IA-12(4).'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ia-5.4
    ref_id: IA-5(4)
    name: Управління автентифікатором — Автоматизована підтримка для визначення міцності пароля
    category: technical
    csf_function: protect
    description: 'Виключено: Включено до IA-5(1).'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ia-5.5
    ref_id: IA-5(5)
    name: Управління автентифікатором — Зміна автентифікаторів до доставки
    category: technical
    csf_function: protect
    description: Вимагати, щоб розробники та інсталятори компонентів системи надавали унікальні автентифікатори
      або змінювали за замовчуванням автентифікатори до доставки та встановлення.
    annotation: Це посилення заходу розширює вимогу щодо зміни автентифікаторів за замовчуванням після встановлення
      системи, вимагаючи від розробників видавати унікальні автентифікатори або змінити автентифікатори за замовчуванням
      для компонентів системи перед їхнім інсталюванням. Однак це, як правило, не стосується розробників комерційних
      позаштатних продуктів інформаційних технологій. Вимоги до унікальних автентифікаторів можуть бути надані в
      супровідній документації, що надається організаціям при закупівлі систем або компонентів системи.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ia-5.6
    ref_id: IA-5(6)
    name: Управління автентифікатором — Захист автентифікаторів
    category: technical
    csf_function: protect
    description: Захищати автентифікатори відповідно з категорією безпеки інформації, до якої надає доступ використання
      автентифікатора.
    annotation: Для систем, які обробляють інформацію різних категорій безпеки інформації без надійного фізичного
      чи логічного розділення між категоріями, автентифікатори, що використовуються для надання доступу до систем,
      мають захищатися відповідно до найвищої категорії безпеки в системах. Категорії безпеки інформації визначаються
      як частина процесу категоризації безпеки.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ia-5.7
    ref_id: IA-5(7)
    name: Управління автентифікатором — Відсутність вбудованих незашифрованих статичних автентифікаторів
    category: technical
    csf_function: protect
    description: Переконатися, що незашифровані статичні автентифікатори не вбудовані в застосунки або сценарії
      доступу та не збережені на функціональній клавіші.
    annotation: Окрім програм, інші форми статичного зберігання включають сценарії доступу та функціональні клавіші.
      Організації проявляють обережність, визначаючи, чи є вбудовані чи збережені автентифікатори в зашифрованій
      чи незашифрованій формі Якщо автентифікатори можуть використовуватися без явного введення (завдяки вбудованим
      функціям), то вони вважаються незашифрованими незалежно від того, чи захищена така функція сама по собі.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ia-5.8
    ref_id: IA-5(8)
    name: Управління автентифікатором - багатосистемні облікові записи
    category: technical
    csf_function: protect
    description: 'Реалізувати [Призначення: визначені організацією заходи безпеки] для управління ризиком компрометації
      через те, що користувачі мають облікові записи в декількох системах.


      Параметри:

      1. Призначення: визначені організацією заходи безпеки'
    annotation: 'Якщо особа має облікові записи в декількох системах, є ризик, що компрометація одного облікового
      запису може призвести до компрометації інших облікових записів (якщо використовуються одні й ті самі автентифікатори
      для всіх облікових записів). Для зниження такого ризику можливі заходи охоплюють: наявність різних автентифікаторів
      для різних систем; використання механізму єдиного входу; використання додатково одноразових паролів.Організації
      також можуть використовувати правила поведінки (див. PL-4) і угоди про доступ (див. PS-6), щоб зменшити ризик
      кількох облікових записів системи.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ia-5.9
    ref_id: IA-5(9)
    name: Управління автентифікатором — Управління об’єднанням автентифікаторів
    category: technical
    csf_function: protect
    description: 'Використовувати [Призначення: визначені організацією зовнішні організації] для об’єднання автентифікаторів.


      Параметри:

      1. Призначення: визначені організацією зовнішні організації'
    annotation: Під час проведення міжорганізованих заходів, пов’язаних з обробкою, зберіганням або передачею інформації,
      має бути забезпечена можливість належної взаємної автентифікації.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ia-5.10
    ref_id: IA-5(10)
    name: Управління автентифікатором — Динамічне зв’язування мандатів
    category: technical
    csf_function: protect
    description: 'Динамічно прив’язуйте ідентифікатори та автентифікатори за такими правилами: [Призначення: правила
      зв’язування, визначені організацією].


      Параметри:

      1. Призначення: правила зв’язування, визначені організацією'
    annotation: Перевірка автентичності вимагає певної форми прив’язки між цифровою ідентичністю та автентифікатором,
      що використовується для її підтвердження. У загальноприйнятих підходах це зв’язування відбувається шляхом
      попереднього надання ідентичності та автентифікатора системі. Наприклад, прив’язка між іменем користувача
      (тобто ідентичністю) та паролем (тобто автентифікатором) здійснюється шляхом надання системі ідентичності
      та автентифікатора як пари. Нові методи автентифікації дозволяють здійснювати зв’язок між ідентичністю та
      автентифікатором поза системою. Наприклад, за допомогою смарткартки, якщо ідентичність та автентифікатор пов’язані
      разом на ній. Використовуючи ці облікові дані, системи можуть автентифікувати цифрові ідентичності, які не
      були попередньо зв’язані самою системою, динамічно надаючи інформацію про цифрову ідентичність після процедури
      автентифікації. З цієї точки зору заздалегідь налагоджені довірчі відносини з відповідними органами для підтвердження
      ідентичності мають важливе значення.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ia-5.11
    ref_id: IA-5(11)
    name: Управління автентифікатором — Автентифікація на основі апаратних токенів
    category: technical
    csf_function: protect
    description: 'Вилучено: Включено до IA-2(1) та IA-2(2).'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ia-5.12
    ref_id: IA-5(12)
    name: Управління автентифікатором — Ефективність біометричної автентифікації
    category: technical
    csf_function: protect
    description: 'Для біометричної автентифікації використовувати механізми, які задовольняють [Призначення: визначені
      організацією вимоги до якості біометрії].


      Параметри:

      1. Призначення: визначені організацією вимоги до якості біометрії'
    annotation: На відміну від автентифікації на основі паролів, яка забезпечує можливість точно визначити відповідність
      введених користувачем паролів з тим, що зберігається, біометрична автентифікація не забезпечує таких точних
      перевірок. Залежно від типу біометричної автентифікації та типу механізму визначення відповідності (порівняння),
      є певна розбіжність між представленими біометричними даними та збереженими раніше (які служать основою для
      порівняння). Ефективність узгодження — це швидкість, з якою біометричний алгоритм правильно визначає таку
      відповідність. Вимоги до ефективності біометричної автентифікації містять, наприклад, коефіцієнт відповідності,
      який забепечується системою.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ia-5.13
    ref_id: IA-5(13)
    name: Управління автентифікатором - закінчення терміну кешування автентифікаторів
    category: technical
    csf_function: protect
    description: 'Заборонити використання кешованих автентифікаторів після [Призначення: визначеного організацією
      періоду часу].


      Параметри:

      1. Призначення: визначеного організацією періоду часу'
    annotation: Кешовані автентифікатори використовуються для автентифікації на локальній машині, коли мережа недоступна.
      Якщо кешована інформація автентифікації застаріла, дійсність інформації автентифікації може бути недостовірною.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ia-5.14
    ref_id: IA-5(14)
    name: Управління автентифікатором — Управління змістом довірчих сховищ інфраструктури відкритих ключів
    category: technical
    csf_function: protect
    description: Для автентифікації на основі інфраструктури з відкритим ключем використовувати загальноорганізаційну
      методологію управління вмістом довірених сховищ інфраструктури відкритого ключа, встановлених на всіх платформах,
      включно з мережами, операційними системами, браузерами та застосунками.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ia-5.15
    ref_id: IA-5(15)
    name: Управління автентифікатором — Продукти та послуги затверджені уповноваженим органом
    category: technical
    csf_function: protect
    description: Використовувати лише схвалені та затверджені уповноваженим органом продукти та послуги.
    annotation: Продукти та послуги, затверджені уповноваженим органом — це продукти та послуги, які були затверджені
      відповідно до вимог нормативних документів і законодавства та розміщені в затверджених списках.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ia-5.16
    ref_id: IA-5(16)
    name: Управління автентифікатором — Передача особистої або довірчої автентифікації зовнішньої сторони
    category: technical
    csf_function: protect
    description: 'Вимагати, щоб передача [Призначення: визначених організацією видів та/або конкретних автентифікаторів]
      проводилась [Вибір: особисто; довіреною зовнішньою стороною] до [Призначення: визначеного організацією, зареєстрованого
      органу] здійснювалася з авторизацією [Призначення: визначеними організацією персоналом або ролями].


      Параметри:

      1. Призначення: визначених організацією видів та/або конкретних автентифікаторів

      2. Вибір: особисто; довіреною зовнішньою стороною

      3. Призначення: визначеного організацією, зареєстрованого органу

      4. Призначення: визначеними організацією персоналом або ролями'
    annotation: Передача автентифікаторів особисто або довіреною зовнішньою стороною покращує та підвищує надійність
      процесу автентифікації особи.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ia-5.17
    ref_id: IA-5(17)
    name: Управління автентифікатором — Автоматизовані засоби виявлення атак з використанням біометричних автентифікаторів
    category: technical
    csf_function: protect
    description: Використовувати механізми виявлення атак із використанням штучно виготовлених артефактів для біометричних
      автентифікаторів.
    annotation: Біометричні характеристики не є таємницею. Такі характеристики можна отримати через Інтернет або
      просто сфотографувавши людину. Відбитки пальців можуть бути скопійовані навіть, якщо людина про це не здогадується.
      За допомогою захоплення зображення з високою роздільною здатністю можна отримати візерунок райдужної оболонки
      тощо. Автоматизовані засоби виявлення атак з використанням біометричних автентифікаторів можуть зменшити ризик
      виникнення цих типів атак та ускладнити створення арефактів для зламу біометричного датчика.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ia-5.18
    ref_id: IA-5(18)
    name: Управління автентифікатором — Менеджер паролів
    category: technical
    csf_function: protect
    description: 'a) Використовуйте [Призначення: визначені організацією менеджери паролів] для створення та керування
      паролями;

      b) Захистіть паролі за допомогою [Призначення: елементи керування, визначені організацією].


      Параметри:

      1. Призначення: визначені організацією менеджери паролів

      2. Призначення: елементи керування, визначені організацією'
    annotation: Для систем, де використовуються статичні паролі, часто важко переконатися, що паролі є достатньо
      складними та що вони не використовуються в кількох системах. Менеджер паролів є вирішенням цієї проблеми,
      оскільки він автоматично генерує та зберігає надійні та різні паролі для різних облікових записів. Потенційний
      ризик використання менеджерів паролів полягає в тому, що зловмисники можуть націлитися на список паролів,
      згенерованих менеджером паролів. Таким чином, список паролів вимагає захисту, включаючи шифрування паролів
      (див. IA-5(1)(d)) і збереження цього списку офлайн в токені.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ia-6
    ref_id: IA-6
    name: Зворотний зв’язок автентифікатора
    category: technical
    csf_function: protect
    description: Забезпечити приховану зворотну передачу інформації автентифікації в процесі автентифікації для
      забезпечення захисту інформації від можливої експлуатації та використання неавторизованими особами.
    annotation: Зворотній зв’язок не повинен містити інформацію, яка дозволила б стороннім особам скомпрометувати
      механізми автентифікації. Загроза типу «shoulder surfing» може бути більш імовірною для таких систем або компонентів,
      як настільні персональні комп’ютери чи ноутбуки з відносно великими моніторами, тоді як для інших, наприклад
      для мобільних пристроїв з невеликими дисплеями, вона є малоймовірною. Засіб для нівелювання зворотного зв’язку
      автентифікатора має вибиратися відповідно. До засобів приховування зворотнього зв’язку автентифікатора може
      належати відображення зірочок при введенні паролю або обмеження часу зворотнього зв’язку перед його приховуванням.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ia-7
    ref_id: IA-7
    name: Автентифікація криптографічного модуля
    category: technical
    csf_function: protect
    description: Впровадити механізми автентифікації в криптографічний модуль, який відповідає вимогам чинних законів,
      виконавчих розпоряджень, директив, політик, правил, стандартів та рекомендацій для такої автентифікації.
    annotation: Механізми автентифікації в криптографічному модулі можуть використовуватися для автентифікації оператора,
      який отримує доступ до модуля, і для перевірки того, що оператор має право виконувати конкретні дії.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ia-8
    ref_id: IA-8
    name: Ідентифікація та автентифікація користувачі, що не належать до організації)
    category: technical
    csf_function: protect
    description: Унікально ідентифікувати та автентифікувати користувачів, що не належать до організації або процеси
      (що не належать організації), які діють від імені користувачів.
    annotation: До користувачів, що не належать до організації, відносяться ті користувачі системи, які явно не
      зазначені в IA-2. Ці особи мають бути однозначно ідентифіковані й автентифіковані для отримання доступу, виняток
      становлять тільки випадки, коли потрібен доступ до загальнодоступних, чітко визначених і задокументованих
      в AC-14 ресурсів. Для ухвалення збалансованого й адекватного рішення щодо необхідності чіткої ідентифікації
      та автентифікації таких користувачів, організації мають враховувати багато факторів, включно з необхідністю
      масштабування, доцільністю, безпекою та приватністю.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ia-8.1
    ref_id: IA-8(1)
    name: Ідентифікація та автентифікація (користувачі, що не належать до організації) визнання посвідчень ідентифікаційних
      даних від інших установ
    category: technical
    csf_function: protect
    description: Приймати та в електронному вигляді перевіряти облікові дані (посвідчення ідентифікаційних даних),
      видані іншими установами для встановлення особи.
    annotation: Це посилення заходу стосується як логічних, так і фізичних систем контролю доступу. Посвідчення
      ідентифікаційних даних особи — це облікові дані, видані уповноваженими установами, які відповідають чинному
      законодавству. Адекватність та надійність емітентів карт PIV розглядаються та авторизуються за допомогою [
      SP 800-79-2 ].
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ia-8.2
    ref_id: IA-8(2)
    name: Ідентифікація та автентифікація (користувачі, що не належать до організації) — Визнання зовнішніх посвідчень
      ідентифікаційних даних
    category: technical
    csf_function: protect
    description: 'a) Приймати тільки зовнішні облікові дані (посвідчення ідентифікаційних даних), що відповідають
      вимогам нормативних документів та стандартів;

      b) Документувати та підтримувати список прийнятих зовнішніх автентифікаторів.'
    annotation: Це посилення заходу стосується систем організації, доступних для громадськості (наприклад загальнодоступних
      вебсайтів). Зовнішні облікові автентифікатори — це ті дані, які видаються зовнішніми структурами. Вимоги щодо
      зовнішніх облікових даних мають відповідати або перевищувати набір вимог щодо безпеки та приватності, які
      затверджені в організації (це дозволить сторонам довіряти таким даним).
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ia-8.3
    ref_id: IA-8(3)
    name: Ідентифікація та автентифікація (користувачі, що не належать до організації) — Використання затверджених
      продуктів
    category: technical
    csf_function: protect
    description: 'Вилучено: Включено до IA-8(2).'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ia-8.4
    ref_id: IA-8(4)
    name: Ідентифікація та автентифікація (користувачі, що не належать до організації) — Використання профілів виданих
      уповноваженим органом
    category: technical
    csf_function: protect
    description: 'Відповідайте наведеним нижче профілям для керування ідентифікацією. Для керування ідентифікацією
      забезпечити відповідність до профілів [Призначення: визначені організацією профілі керування ідентифікацією],
      що видані уповноваженим органом.


      Параметри:

      1. Призначення: визначені організацією профілі керування ідентифікацією'
    annotation: Це посилення стосується відкритих стандартів управління цифровими ідентичностями. Для гарантування
      надійності й актуальності стандартів управління цифровими ідентичностями, вони мають відповідати чинним державним
      та міжнародним нормативним документам. Профілі таких даних мають бути затверджені уповноваженими органами.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ia-8.5
    ref_id: IA-8(5)
    name: Ідентифікація та автентифікація (користувачі, що не належать до організації) — Визнання посвідчень особи
      (piv-i)
    category: technical
    csf_function: protect
    description: 'Приймати та підтверджувати облікові дані або дані PKI, які відповідають [Призначення: політика,
      визначена організацією] Приймати та підтверджувати в електронному вигляді облікові дані для підтвердження
      особи, що видаються недержавними органами.


      Параметри:

      1. Призначення: політика, визначена організацією'
    annotation: Це посилення застосовується як до логічного контролю доступу, так і до фізичного. Воно стосується
      недержавних органів, що прагнуть взаємодіяти з державними системами, і яким можна довіряти. Прийняття облікових
      даних PIV-I може здійснюватися PIV, PIV-I та іншими комерційними або зовнішніми постачальниками ідентифікаційної
      інформації. Прийняття та перевірка облікових даних, сумісних із PIV-I, застосовується як до логічних, так
      і до фізичних систем контролю доступу для недержавних емітентів посвідчень особи, які бажають взаємодіяти
      з урядовими системами Політика щодо сертифікатів X.509 Федерального центру сертифікації мостів (FBCA) відповідає
      вимогам PIV-I. Картка PIV-I співмірна з обліковими даними PIV, як визначено в цитованих посиланнях. Облікові
      дані PIV-I – це облікові дані, видані постачальником послуг PIV-I, чия політика сертифікатів PIV-I відповідає
      політиці сертифікатів Federal Bridge PIV-I. Постачальник PIV-I проходить перехресну сертифікацію з FBCA (безпосередньо
      або через інший міст PKI) із політиками, які зіставлено та схвалено як такі, що відповідають вимогам політик
      PIV-I, визначених у політиці сертифікатів FBCA.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ia-8.6
    ref_id: IA-8(6)
    name: Ідентифікація та автентифікація (користувачі, що не належать до організації) — Розмежування
    category: technical
    csf_function: protect
    description: 'Застосувати наступні заходи, щоб розмежувати атрибути користувача або зв’язки підтвердження ідентифікатора
      між окремими особами, постачальниками облікових даних і довіреними сторонами: [Призначення: заходи, визначені
      організацією].


      Параметри:

      1. Призначення: заходи, визначені організацією'
    annotation: Однакові рішення в управлінні цифровими ідентичностями можуть створювати підвищені ризики приватності
      (оскільки потенційні зловмисники легко зможуть відстежувати осіб). Використання таблиць відповідності ідентифікаторів
      або криптографічних методів, для розмежування постачальників облікових даних і довірених сторін один від одного
      або зробити атрибути ідентифікації менш видимими для сторін, може зменшити ці ризики конфіденційності.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ia-9
    ref_id: IA-9
    name: Послуги ідентифікації та автентифікації
    category: technical
    csf_function: protect
    description: 'Ідентифікувати та автентифікувати [Призначення: визначені організацією системні служби та застосунки],
      перш ніж встановлювати зв’язок з пристроями, користувачами або іншими послугами чи застосунками.


      Параметри:

      1. Призначення: визначені організацією системні служби та застосунки'
    annotation: До служб, які можуть вимагати ідентифікації та автентифікації, належать, наприклад, вебзастосунки,
      які використовують цифрові сертифікати, або послуги, які запитують дані з бази даних. Методи ідентифікації
      та автентифікації для служб/застосунків системи охоплюють, наприклад, підписи інформації або коду, графіки
      походження та електронні підписи, які вказують на джерела послуг. Рішення щодо дійсності ідентифікації та
      автентифікації приймаються службами, окремими від тих, які діють на основі цих рішень. Це може статися в системах
      з розподіленими архітектурами. У таких ситуаціях рішення щодо ідентифікації та автентифікації (замість фактичних
      ідентифікаторів і даних автентифікації) надаються службам, які повинні діяти відповідно до цих рішень.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ia-9.1
    ref_id: IA-9(1)
    name: Послуги ідентифікації та автентифікації - обмін інформацією
    category: technical
    csf_function: protect
    description: 'Виключено: перенесено до IA-9.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ia-9.2
    ref_id: IA-9(2)
    name: Послуги ідентифікації та автентифікації — Передача рішень
    category: technical
    csf_function: protect
    description: 'Виключено: перенесено до IA-9.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ia-10
    ref_id: IA-10
    name: Адаптивна автентифікація
    category: technical
    csf_function: protect
    description: 'Вимагати, щоб особи, які отримують доступ до системи, використовували [Призначення: визначені
      організацією додаткові методи або механізми автентифікації] відповідно до конкретних [Призначення: визначених
      організацією обставин або ситуацій].


      Параметри:

      1. Призначення: визначені організацією додаткові методи або механізми автентифікації

      2. Призначення: визначених організацією обставин або ситуацій'
    annotation: Порушники можуть скомпрометувати окремі механізми автентифікації та згодом спробувати видати себе
      за законних користувачів. Ця ситуація потенційно може статися з будь-якими механізмами автентифікації. Для
      зниження ймовірності такої загрози організації можуть використовувати конкретні методи чи механізми та реалізовувати
      протоколи для оцінювання підозрілої поведінки. До такої поведінки може належати доступ до інформації, яку
      користувач зазвичай не запитував і яка йому не потрібна для виконання службових обов’язків, або спроби отримати
      доступ до інформації з підозрілих мережевих адрес. У заздалегідь визначених ситуаціях організації можуть вимагати
      від користувачів надання додаткової інформації для автентифікації. Адаптивна автентифікація не замінює і не
      використовується замість багатофакторних механізмів, але може розширювати реалізацію цих заходів безпеки.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ia-11
    ref_id: IA-11
    name: Повторна автентифікація
    category: technical
    csf_function: protect
    description: 'Вимагати від користувачів повторної автентифікації, при [Призначення: визначених організацією
      обставинах або ситуаціях, що вимагають повторної автентифікації].


      Параметри:

      1. Призначення: визначених організацією обставинах або ситуаціях, що вимагають повторної автентифікації'
    annotation: Окрім вимог повторної автентифікації у випадках, пов’язаних з блокуванням пристроїв, організації
      можуть вимагати повторну автентифікацію користувачів у певних ситуаціях, зокрема при зміні автентифікатора
      або ролі, категорії безпеки системи, при використанні привілейованих облікових записів або після проходження
      встановленого проміжку часу.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ia-12
    ref_id: IA-12
    name: Перевірка справжності (ідентичності)
    category: process
    csf_function: protect
    description: 'a. Засвідчити особи користувачів, яким потрібні облікові записи для логічного доступу до систем
      на основі вимог гарантій відповідного рівня, як це зазначено у відповідних стандартах і рекомендаціях.

      b. Встановити ідентифікатори користувачів унікальні для особи.

      c. Збирати, затверджувати та перевіряти докази (свідчення) ідентичності особи.'
    annotation: Підтвердження ідентичності — це процес збору та перевірки персональних даних користувача для видачі
      облікових даних для доступу до системи. Цей захід безпеки призначений для зменшення ймовірності загроз при
      реєстрації користувачів та створенні їхніх облікових записів. Стандарти та вказівки, що визначають рівні забезпечення
      ідентифікації для підтвердження особи, включають [SP 800-63-3] і [SP 800-63A]. На організації можуть поширюватися
      закони, виконавчі накази, директиви, нормативні акти або правила, які стосуються збору ідентифікаційних даних.
      Персонал організації консультується зі старшим представником агентства з конфіденційності та юрисконсультантом
      щодо таких вимог.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ia-12.1
    ref_id: IA-12(1)
    name: Перевірка справжності (ідентичності) - авторизація супервайзера
    category: process
    csf_function: protect
    description: Вимагати, щоб процес реєстрації для отримання облікового запису для логічного доступу містив авторизацію
      супервайзера.
    annotation: Авторизація супервайзера забезпечує додатковий рівень перевірки, щоб переконатися, що ланцюжок керування
      користувача знає про обліковий запис і що обліковий запис є важливим для виконання завдань і функцій організації,
      а привілеї користувача відповідають передбачуваним обов’язкам і повноваженням в організації.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ia-12.2
    ref_id: IA-12(2)
    name: Перевірка справжності (ідентичності) — Посвідчення особи
    category: process
    csf_function: protect
    description: Вимагати пред’явлення до реєстраційного органу документів, що посвідчують особу.
    annotation: Вимога перевірки доказів ідентичності (документальних та/або біометричних) зменшує ймовірність використання
      особами чужих персональних даних. Форми доказів мають відповідати конкретній системі та залежати від ролей
      та привілеїв, пов’язаних з обліковим записом користувача.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ia-12.3
    ref_id: IA-12(3)
    name: Перевірка справжності (ідентичності) - перевірка та верифікація доказів ідентичності
    category: process
    csf_function: protect
    description: 'Вимагати, щоб надані докази ідентифікації були підтверджені та перевірені за допомогою [Призначення:
      визначені організацією методи перевірки та верифікації].


      Параметри:

      1. Призначення: визначені організацією методи перевірки та верифікації'
    annotation: Перевірка та верифікація посвідчень особи підвищує впевненість у тому, що акаунти, ідентифікатори
      та автентифікатори видаються істинному користувачеві. Верифікація — це процес підтвердження того, що докази
      є справжніми та достовірними та що дані, які містяться в доказах, є правильними, актуальними та стосуються
      реальної особи. Верифікація підтверджує та встановлює зв’язок між заявленою особою та фактичним існуванням
      користувача, який надає докази. Прийнятні методи перевірки та верифікації посвідчень ідентичності мають відповідати
      конкретній системі та залежати від ролей і привілеїв, пов’язаних з обліковим записом користувача.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ia-12.4
    ref_id: IA-12(4)
    name: Перевірка справжності (ідентичності) — Очна перевірка та верифікація
    category: process
    csf_function: protect
    description: Вимагати, щоб підтвердження та перевірка посвідчень особи проводилися особисто в призначеному органі
      реєстрації.
    annotation: Особиста верифікація знижує ймовірність видачі шахрайських даних, оскільки це вимагає фізичної присутності
      осіб, надання фізичних документів, що посвідчують особу, та фактичної взаємодії з органами реєстрації.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ia-12.5
    ref_id: IA-12(5)
    name: Перевірка адреси
    category: process
    csf_function: protect
    description: 'Вимагати, щоб [Вибір: реєстраційний код; повідомлення про перевірку] доставлялися через зовнішній
      канал для перевірки адреси (фізичної або цифрової) реєстрації користувачів.


      Параметри:

      1. Вибір: реєстраційний код; повідомлення про перевірку'
    annotation: Для зменшення ризику того, що порушники маскуватимуться під легітимних користувачів під час процесу
      перевірки ідентичності, організації можуть використовувати додаткові методи для підвищення впевненості, що
      особою, пов’язаною з адресою запису, є та сама особа, яка брала участь у реєстрації. Підтвердження може мати
      форму тимчасового коду або повідомлення про підтвердження. Адреса (фізична або електронна) доставки цих тимчасових
      даних отримується з облікових записів, а не від користувача. Домашня адреса — приклад фізичної адреси. Адреси
      електронної пошти та телефонні номери — приклади електронних адрес.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ia-12.6
    ref_id: IA-12(6)
    name: Перевірка справжності (ідентичності) - прийняття ідентифікацій, схвалених третьою стороною
    category: process
    csf_function: protect
    description: 'Приймати ідентифікатори із зовнішньою перевіркою з [Призначення: рівень гарантії ідентичності,
      визначений організацією].


      Параметри:

      1. Призначення: рівень гарантії ідентичності, визначений організацією'
    annotation: Для обмеження непотрібного повторного підтвердження особи, особливо користувачів, організації можуть
      приймати докази, які надані іншими установами та організаціями (за умови, що такі докази відповідають політиці
      безпеки організації та мають достатній рівень гарантій).
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ir-1
    ref_id: IR-1
    name: Політика та процедури реагування на інциденти
    category: policy
    csf_function: govern
    description: "a. Розробити, задокументувати та поширити [Призначення: серед визначеного організацією персоналу\
      \ або ролей]:\n1. [Вибір (один або декілька): Рівень організації; Рівень місії/бізнес-процесу; рівень системи]\
      \ політики реагування на інциденти, яка:\n\t(a) містить мету, сферу застосування, ролі, обов’язки, відповідальність\
      \ керівництва, координацію між організаційними підрозділами та систему контролю відповідності (complaince);\n\
      \t(b) відповідає чинному законодавству, виконавчим наказам, директивам, нормам, політикам, стандартам та керівним\
      \ принципам;\n\n2. процедури, що забезпечують реалізацію політики реагування на інциденти та пов’язані з нею\
      \ заходи реагування на інциденти.\nb. Призначити [Призначення: визначену організацією посадову особу вищого\
      \ керівництва] для управління, документування і розповсюдження політики та процедур реагування на інциденти.\n\
      c. Переглядати та оновлювати поточні: \n######  \n1. політику реагування на інциденти [Призначення: з визначеною\
      \ організацією частотою] і наступні [Призначення: події, визначені організацією];\n2. процедури реагування\
      \ на інциденти [Призначення: з визначеною організацією частотою] та наступні [Призначення: події, визначені\
      \ організацією].\n\nПараметри:\n1. Призначення: серед визначеного організацією персоналу або ролей\n2. Вибір\
      \ (один або декілька): Рівень організації; Рівень місії/бізнес-процесу; рівень системи\n3. Призначення: визначену\
      \ організацією посадову особу вищого керівництва\n4. Призначення: з визначеною організацією частотою\n5. Призначення:\
      \ події, визначені організацією"
    annotation: Цей захід захисту стосується встановлення політики та процедур для ефективного здійснення заходів
      і їх посилень у класі IR. Стратегія управління ризиками є важливим фактором у встановленні політики та процедур.
      Комплексна політика та процедури допомагають забезпечити безпеку та приватність. За наявності політики, а
      також планів захисту інформації та персональних даних на рівні організації, конкретні системні політики та
      процедури можуть бути не потрібні. Політика може бути внесена до складу загальної політики безпеки та приватності
      або може бути представлена кількома політиками (у випадках складної архітектури). Процедури описують, як має
      реалізуватися політика чи заходи захисту та як вони можуть бути спрямовані на персонал або роль, яка є об’єктом
      процедури. Процедури можуть бути задокументовані в планах захисту інформації та персональних даних (як один
      або декілька документів). Події, які можуть спричинити оновлення політики та процедур реагування на інциденти,
      включають висновки оцінки або аудиту, інциденти чи порушення безпеки або зміни в законах, розпорядженнях,
      директивах, постановах, політиках, стандартах і вказівках. Просте повторне встановлення засобів контролю не
      є організаційною політикою чи процедурою.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ir-2
    ref_id: IR-2
    name: Навчання з реагування на інциденти
    category: process
    csf_function: protect
    description: 'a. Забезпечити навчання користувачів щодо системи реагування на інциденти, відповідно до призначених
      ролей та обов’язків:

      1. у рамках [Призначення: визначеного організацією періоду часу], впродовж якого авторизована роль або відповідальність
      за реагування на інциденти;

      2. у разі внесення змін у систему;

      3. з визначеною [Призначення: визначена організацією частота] у подальшому.

      b. Переглядайте та оновлюйте навчальний контент із реагування на інциденти [Призначення: частота, визначена
      організацією] та наступні [Призначення: події, визначені організацією].


      Параметри:

      1. Призначення: визначеного організацією періоду часу

      2. Призначення: визначена організацією частота

      3. Призначення: частота, визначена організацією

      4. Призначення: події, визначені організацією'
    annotation: Для забезпечення відповідного змісту та рівня деталізації, навчання реагування на інцидент має бути
      пов’язане з ролями й обов’язками персоналу організації. Наприклад, користувачам необхідно знати, як розпізнати
      інцидент і кому повідомити про нього; системним адміністраторам може знадобитися додаткова підготовка з питань
      реагування на інцидент; посадові особи, на яких покладені обов’язки безпосереднього реагування на інцидент,
      можуть пройти додаткову підготовку з криміналістики, звітності, відновлення та відтворення системи. Навчання
      має охоплювати реагування на інциденти, спровоковані як внутрішніми, так і зовнішніми джерелами. Навчання
      з реагування на інциденти для користувачів може бути надано як частина AT-2 або AT-3 . Події, які можуть спричинити
      оновлення навчального вмісту з реагування на інциденти, включають, але не обмежуються тестуванням плану реагування
      на інциденти або реагування на фактичний інцидент (засвоєні уроки), висновками оцінювання чи аудиту або змін
      у чинних законах, розпорядженнях, директивах, правилах, політиках, стандартах та рекомендаціях.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ir-2.1
    ref_id: IR-2(1)
    name: Навчання з реагування на інциденти — Моделювання подій
    category: process
    csf_function: protect
    description: Впровадити в процес навчання моделювання події реагування на інциденти для забезпечення ефективного
      реагування персоналу в кризових ситуаціях.
    annotation: Організації встановлюють вимоги щодо реагування на інциденти в планах реагування на інциденти. Включення
      змодельованих подій у навчання з реагування на інциденти допомагає переконатися, що персонал розуміє свої
      обов’язки та дії, які слід застосовувати в кризових ситуаціях.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ir-2.2
    ref_id: IR-2(2)
    name: Навчання з реагування на інциденти — Автоматизовані навчальні середовища
    category: process
    csf_function: protect
    description: 'Забезпечте навчальне середовище реагування на інциденти, використовуючи [Призначення: автоматизовані
      механізми, визначені організацією].


      Параметри:

      1. Призначення: автоматизовані механізми, визначені організацією'
    annotation: Автоматизовані механізми можуть забезпечити більш реалістичне середовище навчання реагування на
      інциденти, наприклад шляхом надання більш повного висвітлення питань реагування на інциденти, вибору більш
      реалістичних сценаріїв навчання, середовища та можливостей реагування.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ir-2.3
    ref_id: IR-2(3)
    name: Навчання з реагування на інциденти — Злам
    category: process
    csf_function: protect
    description: Проведіть тренінг з реагування на інциденти щодо того, як ідентифікувати порушення та реагувати
      на них, включаючи процес організації повідомлень про порушення.
    annotation: Для державних органів інцидент, пов’язаний із використанням персональних даних, вважається порушенням.
      Порушення призводить до втрати контролю, компрометації, неавторизованого розголошення, несанкціонованого придбання
      або випадку, коли особа, яка не є авторизованим користувачем, отримує доступ або потенційно може отримати
      доступ до персональних даних, авторизований користувач отримує доступ або потенційно міг отримати доступ до
      таких даних не для авторизованих цілей. Навчання з реагування на інциденти нагадує про обов’язок осіб повідомляти
      як про підтверджені, так і про ймовірні порушення, пов’язані з інформацією на будь-якому носії чи у будь-якій
      формі (включаючи паперовий, усний та електронний). Тренування з реагування на інциденти включають вправи,
      які імітують порушення. Див. IR-2(1).
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ir-3
    ref_id: IR-3
    name: Перевірка реагувань на інциденти
    category: process
    csf_function: respond
    description: 'Перевіряти ефективність реагування системи на інциденти [Призначення: з визначеною організацією
      частотою] за допомогою [Призначення: визначених організацією тестів].


      Параметри:

      1. Призначення: з визначеною організацією частотою

      2. Призначення: визначених організацією тестів'
    annotation: Організації мають проводити перевірку можливості реагування на інциденти для визначення загальної
      ефективності та виявлення потенційних недоліків і слабких місць. Перевірка реагування на інциденти охоплює,
      наприклад, використання контрольних списків, моделювання та комплексні тестування. Перевірка реагування на
      інциденти також може містити визначення впливу на організаційні операції, активи й осіб. Для визначення ефективності
      процесів реагування на інциденти мають використовуватися якісні та кількісні показники.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ir-3.1
    ref_id: IR-3(1)
    name: Перевірка реагувань на інциденти - автоматичне тестування
    category: process
    csf_function: respond
    description: 'Перевірте здатність реагування на інциденти за допомогою [Призначення: автоматизовані механізми,
      визначені організацією].


      Параметри:

      1. Призначення: автоматизовані механізми, визначені організацією'
    annotation: Організації можуть використовувати автоматизовані механізми для більш ретельної та ефективної перевірки
      можливостей реагування на інциденти. Це може бути досягнуто, наприклад, шляхом вибору більш реалістичних сценаріїв
      перевірки та тестових середовищ та методів реагування на інциденти.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ir-3.2
    ref_id: IR-3(2)
    name: Перевірка реагувань на інциденти - координація з пов’язаними планами
    category: process
    csf_function: respond
    description: Координувати тестування реагування на інциденти з елементами організацї, що відповідають за пов’язані
      плани.
    annotation: 'Планування тестування щодо реагування на інциденти має бути пов’язане з плануванням: системи забезпечення
      безперервної роботи та відновлення функціонування; безперервності; відновлення після стихійних лих; безперервності
      операцій; критичної інфраструктури тощо.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ir-3.3
    ref_id: IR-3(3)
    name: Перевірка реагувань на інциденти — Постійне поліпшення
    category: process
    csf_function: respond
    description: 'Використовувати якісні та кількісні дані за результатами тестування для: (a) визначення ефективності
      процесів реагування на інциденти; (b) постійного вдосконалення процесів реагування на інциденти; (c) впровадження
      показників та метрик реагування на інциденти, які є точними, послідовними та відтворюваними.'
    annotation: Для постійного вдосконалення діяльності з реагування на інциденти організації можуть використовувати
      показники та критерії для оцінювання програм реагування на інциденти. Ці дії сприяють поліпшенню ефективності
      реагування на інциденти та зменшують можливий негативний вплив інцидентів.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ir-4
    ref_id: IR-4
    name: Обробка інциденту
    category: technical
    csf_function: respond
    description: 'a. Впровадити можливості обробки інцидентів безпеки та приватності, включно з підготовкою, виявленням
      і аналізом, локалізацією, ліквідацією та відновленням.

      b. Координувати діяльність з обробки інцидентів із заходами із забезпечення безперервності функціонування.

      c. Вводити уроки, що отримані з поточних дій з обробки інцидентів, у процедури реагування на інциденти, навчання
      й тестування та вносити відповідні зміни.

      d. Забезпечити, щоб строгість, інтенсивність, обсяг і результати діяльності з обробки інцидентів можна було
      порівняти та передбачити у всій організації.'
    annotation: 'Здатність реагувати на інциденти залежить від можливостей систем і процесів в організації, які
      підтримуються ними. Тому організації мають проєктувати систему реагування на інциденти під час визначення
      функцій/процесів і розробки систем. Інформація, пов’язана з інцидентами, може бути отримана з різних джерел,
      включно, наприклад, з: моніторингу аудиту, мережі, фізичного доступу, звітів користувачів/адміністраторів,
      повідомленях подій ланцюга поставок. Ефективна спроможність поводження з інцидентами містить координацію між
      багатьма підрозділами організації, включно, наприклад, з власниками представництва, власниками системи, уповноваженими
      посадовими особами, кадровою службою, службами безпеки, юридичними департаментами, оперативним персоналом,
      службою закупівель. Передбачувані інциденти безпеки включають отримання підозрілих електронних листів, які
      можуть містити шкідливий код. Підозрілі інциденти в ланцюзі поставок включають внесення підробленого обладнання
      або шкідливого коду в системи або системні компоненти організації. Для державних органів інцидент, пов’язаний
      із персональними даними, вважається порушенням. Порушення призводить до несанкціонованого розголошення, втрати
      контролю, неавторизованого отримання, компрометації або подібного випадку, коли особа, яка не є авторизованим
      користувачем, отримує доступ або потенційно отримує доступ до персональних даних, або авторизований користувач
      отримує доступ або потенційно отримує доступ до таких даних не для авторизованих цілей.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ir-4.1
    ref_id: IR-4(1)
    name: Обробка інциденту — Автоматизовані процеси обробки інцидентів
    category: technical
    csf_function: respond
    description: Використовувати автоматизовані механізми для підтримки процесу обробки інцидентів.
    annotation: 'До автоматизованих механізмів обробки інцидентів належать: онлайн-системи управління інцидентів,
      а також інструменти, що підтримують збір даних у режимі реального часу, системи захоплення мережевих пакетів
      та системи криміналістичного аналізу.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ir-4.2
    ref_id: IR-4(2)
    name: Обробка інциденту — Динамічна реконфігурація
    category: technical
    csf_function: respond
    description: 'Внести динамічну реконфігурацію [Призначення: у визначені організацією системні компоненти] як
      частину здатності реагування на інциденти [Призначення: типи динамічної реконфігурації, визначені організацією].


      Параметри:

      1. Призначення: у визначені організацією системні компоненти

      2. Призначення: типи динамічної реконфігурації, визначені організацією'
    annotation: Динамічна реконфігурація містить, наприклад, зміни правил маршрутизаторів, списків контролю доступу,
      параметрів системи виявлення/запобігання вторгненням та правил фільтрації брандмауерів і шлюзів. Організації
      можуть проводити динамічну реконфігурацію систем для зупинки атак, нейтралізації порушників та ізоляції компонентів
      систем, обмежуючи тим самим масштаби негативного впливу. Мають бути визначені часові рамки для досягнення
      реконфігурації систем, враховуючи потенційну потребу швидкого реагування для ефективної протидії кіберзагрозам.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ir-4.3
    ref_id: IR-4(3)
    name: Обробка інциденту — Безперервність операцій
    category: technical
    csf_function: respond
    description: 'Ідентифікувати [Призначення: визначені організацією класи інцидентів] та [Призначення: визначені
      організацією дії, які необхідно вжити у відповідь згідно з класом інциденту] для забезпечення безперервності
      виконання завдань та функцій організації.


      Параметри:

      1. Призначення: визначені організацією класи інцидентів

      2. Призначення: визначені організацією дії, які необхідно вжити у відповідь згідно з класом інциденту'
    annotation: 'Інциденти можуть класифікуватися як: несправності через помилки проєктування/впровадження, цілеспрямовані
      зловмисні атаки та ненавмисні атаки. Відповідні дії щодо реагування на інциденти охоплюють, наприклад, деградацію,
      вимкнення системи, запровадження ручного режиму/альтернативної технології, згідно з якою система працює по-іншому,
      застосовуючи оманливі заходи, чергуючи інформаційні потоки або працюючи в позаштатному режимі. Організації
      розглядають, чи вимоги безперервності роботи під час інциденту конфліктують із можливістю автоматичного вимкнення
      системи, як визначено у IR-4(5).'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ir-4.4
    ref_id: IR-4(4)
    name: Обробка інциденту — Інформаційна кореляція
    category: technical
    csf_function: respond
    description: Зіставляти інформацію про інцидент та про індивідуальне реагування на інцидент з метою досягнення
      загальноорганізаційного бачення на обізнаність про інциденти та реагування на них.
    annotation: Є типи інцидентів, які можна виявити лише шляхом збору інформації з різних джерел, серед яких різні
      звіти та процедури звітування, встановлені організаціями.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ir-4.5
    ref_id: IR-4(5)
    name: Обробка інциденту — Автоматичне вимкнення системи
    category: technical
    csf_function: respond
    description: 'Реалізувати налаштовувані можливості для автоматичного вимикання системи, якщо виявлено [Призначення:
      визначені організацією порушення безпеки].


      Параметри:

      1. Призначення: визначені організацією порушення безпеки'
    annotation: 'Організації розглядають, чи здатність автоматичного вимкнення системи конфліктує з вимогами безперервності
      роботи, визначеними як частина CP-2 або IR-4(3). Порушення безпеки включають кібератаки, які порушили цілісність
      системи або викрали інформацію, що належить організації, а також серйозні помилки у програмному забезпеченні,
      які можуть негативно вплинути на процеси чи функції організації або поставити під загрозу безпеку


      окремих осіб.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ir-4.6
    ref_id: IR-4(6)
    name: Обробка інциденту - внутрішні загрози - особливі можливості
    category: technical
    csf_function: respond
    description: Реалізувати можливість обробки інцидентів, пов’язаних з внутрішніми загрозами.
    annotation: Реагування на внутрішні загрози мають розглядатися як невіддільна частина спроможності організації
      реагувати на інциденти. Це посилення спрямоване на додатковий акцент на такому типі загрози та потребі в конкретних
      можливостях реагування на такі типи інцидентів.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ir-4.7
    ref_id: IR-4(7)
    name: Обробка інциденту внутрішні загрози - внутрішньоорганізаційна координація
    category: technical
    csf_function: respond
    description: 'Координувати здатність обробки інцидентів для внутрішніх загроз через [Призначення: визначені
      організацією компоненти або елементи організації].


      Параметри:

      1. Призначення: визначені організацією компоненти або елементи організації'
    annotation: 'Реагування на внутрішні загрози потребує тісної координації між різними компонентами організації
      або елементами. До таких компонентів належать: власники місії, власники системи, кадрові відділи, служби безпеки
      тощо. Крім того, організації можуть потребувати зовнішньої підтримки державних і місцевих правоохоронних органів.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ir-4.8
    ref_id: IR-4(8)
    name: Обробка інциденту - координація із зовнішніми організаціями
    category: technical
    csf_function: respond
    description: 'Координувати з [Призначення: визначеними організацією зовнішніми організаціями] для зіставлення
      та поширення [Призначення: інформації, що визначається організацією], для досягнення міжорганізаційного бачення
      обізнаності про інциденти та більш ефективного реагування на інциденти.


      Параметри:

      1. Призначення: визначеними організацією зовнішніми організаціями

      2. Призначення: інформації, що визначається організацією'
    annotation: 'До зовнішніх організацій належать: партнери, члени коаліцій, замовники та зовнішні розробники.
      Міжорганізаційна координація щодо подолання інцидентів може підвищити здатність управління ризиками. Це дозволяє
      організаціям використовувати критичну інформацію з різних джерел для ефективного реагування на інциденти,
      що пов’язані з інформаційною безпекою, та які потенційно можуть вплинути на діяльність організації, активи
      та окремих осіб.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ir-4.9
    ref_id: IR-4(9)
    name: Обробка інциденту — Здатність динамічного реагування
    category: technical
    csf_function: respond
    description: 'Використовувати [Призначення: визначені організацією можливості динамічного реагування] для ефективного
      реагування на інциденти безпеки.


      Параметри:

      1. Призначення: визначені організацією можливості динамічного реагування'
    annotation: Це посилення стосується своєчасного використання нових можливостей організації у відповідь на інциденти
      безпеки та приватності. Сюди входять можливості, що реалізовані на рівні процесів і на системному рівні.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ir-4.10
    ref_id: IR-4(10)
    name: Обробка інциденту — Координація ланцюга постачання
    category: technical
    csf_function: respond
    description: Координувати діяльність з обробки інцидентів, пов’язану з подіями ланцюжка постачання, з іншими
      організаціями, що беруть участь у ланцюжку постачання.
    annotation: 'До організацій, залучених до ланцюгів постачання, належать: розробники систем/продуктів, інтегратори,
      виробники, пакувальники, дистриб’ютори та торгові посередники. До інцидентів у ланцюгах постачання належать:
      порушення, пов’язані з компонентами системи, продуктами інформаційних технологій, процесами розробки або персоналом,
      а також процесами дистрибуції.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ir-4.11
    ref_id: IR-4(11)
    name: Обробка інциденту — Інтегрована група реагування на інцеденти
    category: technical
    csf_function: respond
    description: 'Створити та підтримувати інтегровану групу реагування на інциденти, яку можна розгорнути в будь-якому
      місці, визначеному організацією протягом [Призначення: період часу, визначений організацією].


      Параметри:

      1. Призначення: період часу, визначений організацією'
    annotation: Інтегрована група реагування на інциденти — це команда експертів, яка оцінює, документує і реагує
      на інциденти, щоб системи організації та мережі могли швидко відновитися та запровадити необхідні заходи захисту,
      для уникнення майбутніх інцидентів. До складу групи реагування на інциденти входять аналітики з криміналістики,
      аналітики зловмисного коду, розробники інструментів, інженери з системної безпеки та приватності, а також
      персонал, який працює в режимі реального часу. Можливості обробки інцидентів включають виконання швидкого
      криміналістичного збереження доказів, аналіз і реагування на вторгнення. Для деяких організацій група реагування
      на інциденти може бути міжорганізаційною організацією. Інтегрована група реагування на інциденти спрощує обмін
      інформацією та дозволяє персоналу організації (наприклад, розробникам, виконавцям і операторам) використовувати
      знання команди про виявлену загрозу та впровадити заходи захисту, які дозволяють організаціям ефективніше
      стримувати вторгнення. Крім того, об’єднані групи сприяють швидкому виявленню вторгнень, розробці відповідних
      засобів послаблення та розгортанню ефективних захисних заходів. Наприклад, коли виявлено вторгнення, інтегрована
      команда може швидко розробити відповідну відповідь для операторів, порівняти новий інцидент з інформацією
      про минулі вторгнення та покращити рівень кіберрозвідки. Інтегровані групи реагування на інциденти можуть
      краще визначати тактику, методи та процедури супротивника, які пов’язані з темпом операцій або конкретною
      місією та бізнес-функціями, а також визначати відповідні дії таким чином, щоб не порушувати ці місії та бізнес-функції.
      Групи реагування на інциденти можна розподілити в організаціях, щоб зробити їх більш стійкими.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ir-4.12
    ref_id: IR-4(12)
    name: Обробка інциденту — Зловмисний код та криміналістичний аналіз
    category: technical
    csf_function: respond
    description: Проаналізуйте шкідливий код та/або інші залишкові артефакти, що залишилися в системі після інциденту.
    annotation: Ретельний аналіз зловмисного коду та інших залишкових артефактів інциденту або порушення безпеки
      в ізольованому середовищі може дати організації розуміння тактики, методів та процедур противника. Він також
      може вказувати на особу чи деякі визначальні характеристики супротивника. Крім того, аналіз шкідливого коду
      може допомогти організації розробити відповіді на майбутні інциденти.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ir-4.13
    ref_id: IR-4(13)
    name: Обробка інциденту — Аналіз поведінки
    category: technical
    csf_function: respond
    description: 'Проаналізувати аномальну або підозрювану ворожу поведінку в [Завдання: середовища або ресурси,
      визначені організацією]


      Параметри:

      1. Завдання: середовища або ресурси, визначені організацією'
    annotation: Якщо організація підтримує обманне середовище (пісочницю), аналіз поведінки в цьому середовищі,
      включаючи ресурси, націлені противником, і час інциденту чи події, може дати розуміння тактики, техніки та
      процедур змагання. За межами обманного середовища аналіз аномальної ворожої поведінки (наприклад, змін у продуктивності
      системи чи моделей використання) або підозрюваної поведінки (наприклад, зміни в пошуку розташування певних
      ресурсів) може дати організації таке розуміння.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ir-4.14
    ref_id: IR-4(14)
    name: Обробка інциденту — Центр безпеки
    category: technical
    csf_function: respond
    description: Створити та підтримувати оперативний центр безпеки.
    annotation: Операційний центр безпеки (ОЦБ) є центром безпеки та захисту комп’ютерної мережі організації. Метою
      ОЦБ є захист і моніторинг систем і мереж організації (тобто кіберінфраструктури) на постійній основі. ОЦБ
      також відповідає за виявлення, аналіз і своєчасне реагування на інциденти кібербезпеки. Організація укомплектовує
      ОЦБ кваліфікованим технічним і оперативним персоналом (наприклад, аналітиками безпеки, персоналом з реагування
      на інциденти, інженерами системної безпеки) і реалізує комбінацію технічних, управлінських і операційних засобів
      контролю (включно з інструментами моніторингу, сканування та криміналістики) для моніторингу, об’єднання,
      корелювання, аналізу та реагування на дані про загрози та події, пов’язані з безпекою, з багатьох джерел.
      Ці джерела включають засоби захисту периметра, мережеві пристрої (наприклад, маршрутизатори, комутатори) і
      канали даних агентів кінцевих точок. ОЦБ надає можливість цілісної ситуаційної обізнаності, щоб допомогти
      організаціям визначити рівень безпеки системи та організації. Впровадити ОЦБ можна отримати різними способами.
      Більші організації можуть запровадити спеціальний ОЦБ, тоді як менші організації можуть залучати сторонні
      організації для впровадження ОЦБ.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ir-4.15
    ref_id: IR-4(15)
    name: Обробка інциденту — Звʼязки з громадкістю та відновлення репутації
    category: technical
    csf_function: respond
    description: 'a) керування зв’язками з громадськістю, пов’язаними з інцидентом; і

      b) вживання заходів для відновлення репутації організації.'
    annotation: Для організації важливо мати стратегію для вирішення інцидентів, які були доведені до відома широкої
      громадськості, представили організацію в негативному світлі або вплинули на складові організації (наприклад,
      партнерів, клієнтів). Така публічність може зашкодити організації та вплинути на її здатність виконувати свою
      місію та бізнес-функції. Вжиття проактивних заходів для відновлення репутації організації є важливим аспектом
      відновлення довіри та впевненості її учасників.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ir-5
    ref_id: IR-5
    name: Моніторинг інциденту
    category: technical
    csf_function: detect
    description: Відстежувати та документувати інциденти безпеки та приватності.
    annotation: 'Документування інцидентів системи безпеки та приватності охоплює: ведення записів про кожен інцидент,
      стан інциденту та іншу відповідну інформацію, необхідну для судових експертиз, оцінювання деталей, тенденцій
      та поводження щодо інцидентів. Інформація про інциденти може бути отримана з різних джерел (мережевий моніторинг;
      повідомлення про інциденти; звіти груп реагування на інциденти; скарги користувачів; моніторинг аудиту; моніторинг
      фізичного доступу; звіти користувачів та адміністраторів тощо). IR-4 надає інформацію про типи інцидентів,
      які підходять для моніторингу.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ir-5.1
    ref_id: IR-5(1)
    name: Моніторинг інциденту — Автоматизоване відстеження, збір даних і аналіз
    category: technical
    csf_function: detect
    description: 'Відстежувати інциденти, збирати й аналізувати інформацію про інциденти за допомогою [Призначення:
      автоматизовані механізми, визначені організацією].


      Параметри:

      1. Призначення: автоматизовані механізми, визначені організацією'
    annotation: До автоматизованих механізмів відстеження інцидентів, збору й аналізу даних про інциденти належать
      центри реагування на комп’ютерні інциденти або інші електронні бази даних інцидентів і пристрої мережевого
      моніторингу.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ir-6
    ref_id: IR-6
    name: Звітність про інциденти
    category: process
    csf_function: respond
    description: 'a. Вимагати від персоналу повідомляти про підозрілі інциденти з безпеки та приватності відповідно
      до організаційної спроможності реагування на інциденти впродовж [Призначення: визначеного організацією періоду
      часу].

      b. Звітувати про інциденти безпеки, приватності та ланцюжки постачання в [Призначення: визначений організацією
      уповноважений орган].


      Параметри:

      1. Призначення: визначеного організацією періоду часу

      2. Призначення: визначений організацією уповноважений орган'
    annotation: Типи інцидентів, про які необхідно звітувати, зміст і терміни подання звітів мають відображатися
      в чинних законах, наказах, директивах, положеннях, політиках і стандартах. Інформація про інциденти може інформувати
      про оцінку ризиків, оцінку ефективності контролю, вимоги безпеки для придбань і критерії вибору технологічних
      продуктів.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ir-6.1
    ref_id: IR-6(1)
    name: Звітність про інциденти — Автоматичне звітування
    category: process
    csf_function: respond
    description: 'Повідомляйте про інциденти за допомогою [ Призначення: автоматизовані механізми, визначені організацією
      ].


      Параметри:

      1. Призначення: автоматизовані механізми, визначені організацією'
    annotation: Одержувачі звітів про інциденти вказані в IR-6b . Механізми автоматизованого звітування включають
      електронну пошту, публікацію на вебсайтах (з автоматичними оновленнями) та автоматизовані інструменти та програми
      реагування на інциденти.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ir-6.2
    ref_id: IR-6(2)
    name: Звітність про інциденти - вразливість, пов'язана з інцидентами
    category: process
    csf_function: respond
    description: 'Повідомляти про вразливості системи, пов’язані із зареєстрованими інцидентами безпеки та приватності
      [Призначення: визначеним організацією персоналу чи ролям].


      Параметри:

      1. Призначення: визначеним організацією персоналу чи ролям'
    annotation: Повідомлення про інциденти, які виявляють вразливі місця системи, аналізуються персоналом організації,
      включаючи власників системи, та власників бізнесу, старших офіцерів інформаційної безпеки, старших посадових
      осіб з питань конфіденційності, авторизованих представників та керівника ризиками. Аналіз може служити для
      встановлення пріоритетів та ініціювання дій із запобігання виявленій вразливості системи.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ir-6.3
    ref_id: IR-6(3)
    name: Звітність про інциденти - координація ланцюжка постачання
    category: process
    csf_function: respond
    description: Надати інформацію про інциденти безпеки та приватності постачальнику продукту або послуги та іншим
      організаціям, які беруть участь у ланцюжку постачання систем або компонентів системи, пов’язаних з інцидентом.
    annotation: 'До організацій, залучених до ланцюгів постачання, належать: розробники систем/продуктів, інтегратори,
      виробники, пакувальники, дистриб’ютори та торгові посередники. До інцидентів у ланцюгах постачання належать:
      порушення, які пов’язані з компонентами системи, продуктами інформаційних технологій, процесами розробки або
      персоналом, а також процесами дистрибуції. Організації визначають відповідну інформацію для обміну та враховують
      цінність, отриману від інформування зовнішніх організацій про інциденти в ланцюзі постачання, включаючи можливість
      покращити процеси або визначити першопричину інциденту.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ir-7
    ref_id: IR-7
    name: Підтримка реагування на інциденти
    category: technical
    csf_function: respond
    description: Надавати ресурси для підтримки реагування на інциденти, що є невіддільною частиною спроможностей
      організації реагування на інциденти, які являють собою поради та допомогу користувачам інформаційної системи
      для обробки та формування звітності про інциденти безпеки та приватності.
    annotation: До ресурсів підтримки реагування на інциденти належать службові довідники, групи допомоги, підтримка
      служб судово-медичної експертизи та послуг щодо захисту прав споживачів, якщо це вимагається.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ir-7.1
    ref_id: IR-7(1)
    name: Підтримка реагування на інциденти — Автоматизація підтримки для забезпечення доступності інформації та
      підтримки
    category: technical
    csf_function: respond
    description: 'Впровадити автоматизовані механізми [Призначення: автоматизовані механізми, визначені організацією]
      для збільшення доступності пов’язаної з реагуванням на інциденти інформації та підтримки.


      Параметри:

      1. Призначення: автоматизовані механізми, визначені організацією'
    annotation: Автоматизовані механізми можуть реалізовуватися у двох напрямах від та/або до користувача. Наприклад,
      користувачі можуть мати доступ до вебсайту для запиту допомоги, або механізм надання допомоги може проактивно
      надсилати інформацію користувачам, як частину підвищення розуміння поточних можливостей реагування та підтримки.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ir-7.2
    ref_id: IR-7(2)
    name: Підтримка реагування на інциденти - координація із зовнішніми постачальниками
    category: technical
    csf_function: respond
    description: '(a) Встановити прямі відносини кооперації між здатністю реагування на інциденти та зовнішніми
      постачальниками можливостей захисту системи.

      (b) Визначити членів команди реагування на інциденти в організації для зовнішніх постачальників послуг.'
    annotation: Зовнішні постачальники можуть допомагати захищати, контролювати, аналізувати, виявляти та реагувати
      на несанкціоновану діяльність в інформаційних системах і мережах організації. Також можна прописувати пункти
      в угодах із зовнішніми постачальниками щодо ролей та обов’язків кожної сторони у разі кіберінциденту.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ir-8
    ref_id: IR-8
    name: План реагування на інциденти
    category: process
    csf_function: respond
    description: 'a. Розробити план реагування на інциденти, який:

      1. надає організації дорожню карту для впровадження її можливостей реагування на інциденти;

      2. описує структуру та організацію спроможності реагування на інциденти;

      3. надає високорівневий підхід до того, як здатність реагування на інциденти вписується в загальну практику
      організації;

      4. відповідає унікальним вимогам організації, які пов’язані із завданнями, розміром, структурою і функціями;

      5. визначає підзвітні інциденти;

      6. надає показники для вимірювання можливостей реагування на інциденти всередині організації;

      7. визначає ресурси та управлінську підтримку, необхідну для ефективної підтримки та розвитку можливостей
      реагування на інциденти;

      8. вирішує питання обміну інформацією про інциденти;

      9. явно визначає відповідальність за реагування на інциденти [Призначення: визначеним організацією персоналом
      або ролями];

      10. явно визначає відповідальність за реагування на інциденти [Призначення: визначеним організацією персоналом
      або ролями].

      b. Поширити копії плану реагування на інциденти серед [Призначення: визначеного організацією персоналу, який
      відповідає за конкретні дії, (який визначається за іменем та/або за ролями) та організаційними елементами].

      c. Оновлювати план реагування на інциденти в разі змін в системі та організації або проблем, що виникають
      при реалізації, виконанні чи тестуванні плану.

      d. Повідомляти про зміни плану реагування на інциденти [Призначення: визначений організацією персонал з реагування
      на інциденти, визначений за іменем та/або за ролями) й організаційні елементи].

      e. Захистити план реагування на інциденти від несанкціонованого розкриття та модифікації.


      Параметри:

      1. Призначення: визначеним організацією персоналом або ролями

      2. Призначення: визначеного організацією персоналу, який відповідає за конкретні дії, (який визначається за
      іменем та/або за ролями) та організаційними елементами

      3. Призначення: визначений організацією персонал з реагування на інциденти, визначений за іменем та/або за
      ролями) й організаційні елементи'
    annotation: Важливо застосовувати комплексний підхід до реагування на інциденти. Організаційні місії, функції,
      стратегії, цілі та завдання реагування на інциденти допомагають визначити структуру можливостей реагування
      на інциденти. Як частина можливості всебічного реагування на інциденти, організації розглядають координацію
      та обмін інформацією із зовнішніми організаціями, включно з, наприклад, зовнішніми постачальниками послуг,
      що беруть участь у ланцюзі постачань.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ir-8.1
    ref_id: IR-8(1)
    name: План реагування на інциденти — Обробка персональних даних
    category: process
    csf_function: respond
    description: 'Внести такі додаткові процеси в План реагування на інциденти для інцидентів, пов’язаних з персональними
      даними: (a) процес визначення доцільності повідомлення наглядових організацій і надання такого повідомлення,
      якщо це доречно; (b) процес оцінювання для визначення ступеня шкоди, труднощів, незручностей або несправедливості
      щодо постраждалих осіб та будь-які механізми пом’якшення такої шкоди; (c) ідентифікація застосовних вимог
      щодо конфіденційності.'
    annotation: Відповідно до закону, нормативно-правових актів або політики організації можуть бути зобов’язані
      дотримуватися певних процедур, пов’язаних із порушеннями, зокрема повідомляти окремим особам, відповідним
      організаціям і контролюючим органам; стандарти шкідливості; і помякшення або інші спеціальні вимоги.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ir-9
    ref_id: IR-9
    name: Реагування на витік інформації
    category: process
    csf_function: respond
    description: 'Реагувати на витік інформації шляхом:

      a. призначення [Призначення: персонал або ролі, визначені організацією] відповідального за реагування на витік
      інформації];

      b. визначення конкретної інформації, пов’язаної з джерелом витоку в системі;

      c. попередження [Призначення: визначеного організацією персоналу або ролей] про витік інформації за допомогою
      методу зв’язку, не пов’язаного з витоком;

      d. ізолювання системи або системної компоненти, де відбувся витік інформації;

      e. видалення інформації із системи або компонента;

      f. визначення іншої системи або компонента системи, які згодом могли б бути джерелом витоку інформації;

      g. виконання таких додаткових дій: [Призначення: визначених організацією дій].


      Параметри:

      1. Призначення: персонал або ролі, визначені організацією

      2. Призначення: визначеного організацією персоналу або ролей

      3. Призначення: визначених організацією дій'
    annotation: Витік інформації — ситуація, коли критична інформація ненавмисно розміщується в системах, які не
      мають повноважень її обробляти. Такі витоки інформації виникають, коли інформація, що спочатку мала нижчий
      рівень критичності, передається в систему, а згодом визначається як інформація з вищим рівнем критичності.
      Характер реагування, як правило, ґрунтується на ступені критичності розповсюдженої інформації, можливостях
      системи безпеки, специфічному характері носіїв даних і привілеях осіб, які мають доступ до скомпрометованої
      інформації. Методи, які використовуються для передачі інформації про витік інформації, не мають бути пов’язані
      із фактичним джерелом витоку інформації для мінімізації ризиків подальшого його поширення до того, як він
      буде ізольований або видалений з системи.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ir-9.1
    ref_id: IR-9(1)
    name: Реагування на витік інформації — Відповідальний персонал
    category: process
    csf_function: respond
    description: 'Вилучено: включено до IR-9.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ir-9.2
    ref_id: IR-9(2)
    name: Реагування на витік інформації — Тренування
    category: process
    csf_function: respond
    description: 'Забезпечити навчання з реагування на витік інформації [Призначення: з визначеною організацією
      частотою].


      Параметри:

      1. Призначення: з визначеною організацією частотою'
    annotation: організації встановлюють вимоги щодо реагування на випадки витоку інформації в планах реагування
      на інциденти. Регулярне навчання з реагування на інциденти допомагає переконатися, що персонал організації
      розуміє свої особисті обов’язки та які конкретні дії слід вживати, коли трапляються випадки розливу.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ir-9.3
    ref_id: IR-9(3)
    name: Реагування на витік інформації — Робота після витоку
    category: process
    csf_function: respond
    description: 'Реалізувати [Призначення: визначені організацією процедури] з метою забезпечення, щоб персонал
      організації, на який впливає витік інформації, був спроможний продовжувати виконувати поставлені завдання,
      тоді як постраждалі системи зазнають коригувальних дій.


      Параметри:

      1. Призначення: визначені організацією процедури'
    annotation: Коригувальні дії для систем, постраждалих через витік інформації, можуть забрати багато часу. У
      ці періоди персонал може не мати доступу до постраждалих систем, що потенційно може вплинути на їхню здатність
      вести організаційну діяльність.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ir-9.4
    ref_id: IR-9(4)
    name: Реагування на витік інформації - викриття неавторизованого персоналу
    category: process
    csf_function: respond
    description: 'Застосовуйте [Призначення: визначені організацією механізми захисту] для персоналу, що має доступ
      до інформації, яка не відповідає призначеним правам доступу.


      Параметри:

      1. Призначення: визначені організацією механізми захисту'
    annotation: Гарантії безпеки охоплюють, наприклад, забезпечення того, щоб персонал, який має доступ до інформації,
      був ознайомлений із законами, наказами, директивами, положеннями, правилами, стандартами та вказівками щодо
      інформації та обмежень, що накладаються в разі ознайомлення з такою інформації.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ir-10
    ref_id: IR-10
    name: Інтегрована команда аналізу інформаційної безпеки
    category: technical
    csf_function: respond
    description: 'Вилучено: перенесено до IR-4(11).'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ma-1
    ref_id: MA-1
    name: Політика та процедури технічного обслуговування
    category: policy
    csf_function: govern
    description: "a. Розробити, задокументувати та поширити серед [Призначення: визначеного організацією персоналу\
      \ або посад]: \n1. Політику технічного обслуговування системи, яка:\n\t(a) містить мету, сферу застосування,\
      \ ролі, обов’язки, відповідальність керівництва, координацію між організаційними підрозділами та систему контролю\
      \ відповідності (complaince);\n\t(b) відповідає чинному законодавству, виконавчим наказам, директивам, нормам,\
      \ політикам, стандартам і керівним принципам.\n2. Процедури, що сприяють здійсненню політики та заходів технічного\
      \ обслуговування систем.\nb. Призначити [Призначення: визначену організацією посадову особу] для управління\
      \ політикою та процедурами технічного обслуговування.\nc. Переглядати та оновлювати:\n##### \n1. Поточну політику\
      \ технічного обслуговування систем [Призначення: з визначеною організацією частотою] та слідувати [Призначення:\
      \ події визначені організацією].\n2. Поточні процедури технічного обслуговування систем [Призначення: з визначеною\
      \ організацією частотою] та слідувати [Призначення: події визначені організацією].\n\nПараметри:\n1. Призначення:\
      \ визначеного організацією персоналу або посад\n2. Призначення: визначену організацією посадову особу\n3.\
      \ Призначення: з визначеною організацією частотою\n4. Призначення: події визначені організацією"
    annotation: Цей захід захисту стосується встановлення політики та процедур для ефективного здійснення заходів
      і їх посилень у класі MA. Стратегія управління ризиками є важливим фактором у встановленні політики та процедур.
      Комплексна політика та процедури допомагають забезпечити безпеку та приватність. За наявності політики, а
      також планів захисту інформації та персональних даних на рівні організації, конкретні системні політики та
      процедури можуть бути не потрібні. Політика може бути внесена до складу загальної політики безпеки та приватності
      або може бути представлена кількома політиками (у випадках складної архітектури). Процедури описують, як має
      реалізуватися політика або заходи захисту та як вони можуть бути спрямовані на персонал або роль, що є об’єктом
      процедури. Процедури можуть бути задокументовані в планах захисту інформації та персональних даних (як один
      або декілька документів). Просте переформулювання засобів захисту не є організаційною політикою чи процедурою.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ma-2
    ref_id: MA-2
    name: Контрольоване обслуговування
    category: process
    csf_function: protect
    description: 'a. Планувати, документувати та переглядати записи з технічного обслуговування, ремонту або заміни
      компонентів системи відповідно до вимог виробника та постачальників та/або вимог організації.

      b. Затвердити та здійснювати моніторинг усіх заходів з технічного обслуговування, незалежно від того, виконуються
      вони на місці або віддалено, а також чи обслуговуються системи або системні компоненти на місці, чи переміщуються
      в інше місце.

      c. Вимагати, щоб [Призначення: визначені організацією персонал чи ролі] явно схвалили видалення системи або
      компоненту системи з організаційного обладнання для технічного обслуговування, ремонту чи заміни поза об’єктами
      експлуатації.

      d. Очищати обладнання з погляду видалення всієї інформації з носіїв до вилучення обладнання організації для
      технічного обслуговування, ремонту чи заміни поза об’єктами експлуатації.

      e. Перевірити всі потенційно порушені заходи захисту, щоб переконатися, що вони, як і раніше, працюють належним
      чином після дій з обслуговування, ремонту або заміни.

      f. Вносити [Призначення: визначену організацією інформацію, пов’язану з технічним обслуговуванням] до записів
      з технічного обслуговування.


      Параметри:

      1. Призначення: визначені організацією персонал чи ролі

      2. Призначення: визначену організацією інформацію, пов’язану з технічним обслуговуванням'
    annotation: 'Цей захід безпеки стосується аспектів інформаційної безпеки технічного обслуговування програм і
      застосунків. Технічне обслуговування системи охоплює також ті компоненти, які безпосередньо не пов’язані з
      обробкою та/або збереженням даних чи інформації (сканери, копіювальні апарати та принтери). До необхідної
      інформації при створенні ефективних записів технічного обслуговування належать: дата та час обслуговування;
      найменування осіб або групи, що виконують технічне обслуговування; назва супроводу, якщо це необхідно; опис
      проведеного технічного обслуговування; компоненти системи або обладнання, що вилучені або замінені (включно
      з ідентифікаційними номерами). Рівень деталізації записів технічного обслуговування повинен бути відповідний
      категоріям безпеки систем організації.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ma-2.1
    ref_id: MA-2(1)
    name: Контрольоване обслуговування — Зміст запису
    category: process
    csf_function: protect
    description: 'Вилучено: Включено до MA-2.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ma-2.2
    ref_id: MA-2(2)
    name: Контрольоване обслуговування — Автоматизована технічна діяльність
    category: process
    csf_function: protect
    description: '(a) Використовувати автоматизовані механізми для планування, проведення та документування дій
      з обслуговування, ремонту та заміни системи або її компонентів.

      (b) Надавати оновлені, точні та повні записи про всі дії з технічного обслуговування, ремонту та заміни; замовлених,
      запланованих, виконуваних та завершених дій.'
    annotation: Використання автоматизованих механізмів для управління та контролю технічного обслуговування дозволяє
      забезпечити створення своєчасних, повних та точних записів щодо технічного обслуговування.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ma-3
    ref_id: MA-3
    name: Інструменти для обслуговування
    category: technical
    csf_function: protect
    description: 'a. Затвердити, контролювати та відстежувати використання засобів технічного обслуговування.

      b. Переглядати раніше затверджені інструменти технічного обслуговування [Призначення: з частотою, визначеною
      організацією].


      Параметри:

      1. Призначення: з частотою, визначеною організацією'
    annotation: Цей захід стосується питань безпеки, пов’язаних з інструментами технічного обслуговування, які не
      перебувають у межах організаційної системи, але використовуються в діагностичних і ремонтних заходах в системах
      організації. Організації можуть змінювати ролі відповідальних за затвердження інструментів технічного обслуговування
      залежно від того, як таке затвердження документується. Інструменти технічного обслуговування мають піддаватися
      періодичним перевіркам для вилучення або заміни, як такі, що не є актуальними або ефективними. До інструментів
      технічного обслуговування може належати апаратне та програмне забезпечення. Інструменти технічного обслуговування
      можуть бути потенційними контейнерами транспортування шкідливого коду (навмисно чи ненавмисно). Цей захід
      безпеки не охоплює апаратні чи програмні компоненти, які підтримують системи та є її частиною.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ma-3.1
    ref_id: MA-3(1)
    name: Інструменти для обслуговування — Перевірка інструментів
    category: technical
    csf_function: protect
    description: Оглянути інструменти для технічного обслуговування, які доставлені на об’єкт обслуговим персоналом,
      на предмет неправильних або несанкціонованих модифікацій.
    annotation: Інструменти технічного обслуговування можна вносити на об’єкт обслуговуючим персоналом або завантажити
      з веб-сайту постачальника. Якщо після перевірки інструментів технічного обслуговування було визначено, що
      інструменти модифіковані в неналежний/несанкціонований спосіб або містять шкідливий код, такий інцидент обробляється
      відповідно до організаційної політики та процедур поводження з інцидентами.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ma-3.2
    ref_id: MA-3(2)
    name: Інструменти  для обслуговування — Перевірка носіїв інформації
    category: technical
    csf_function: protect
    description: Перед використанням носіїв у системі перевірити носії, що містять діагностичні та тестові програми
      на наявність шкідливого коду.
    annotation: Якщо після перевірки носіїв, що містять діагностичні та тестові програми, організація визначила
      що носії містять шкідливий код. Такий інцидент розглядається відповідно до політики та процедур обробки інцидентів
      організації.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ma-3.3
    ref_id: MA-3(3)
    name: Інструменти для обслуговування - запобігання несанкціонованому переміщенню
    category: technical
    csf_function: protect
    description: 'Запобігти переміщенню обладнання для технічного обслуговування, що містить організаційну інформацію,
      шляхом:

      (a) перевірки відсутності організаційної інформації, розміщеної на обладнанні;

      (b) очищення або знищення обладнання;

      (c) утримання обладнання на об’єкті;

      (d) отримання дозволу від [Призначення: визначених організацією персоналу чи ролей], які явно дозволяють переміщення
      обладнання з об’єкта.


      Параметри:

      1. Призначення: визначених організацією персоналу чи ролей'
    annotation: До організаційної інформації належить уся інформація, яка є власністю організацій, та інформація,
      що надається організаціям, у яких вони виконують функції управління щодо інформації.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ma-3.4
    ref_id: MA-3(4)
    name: Інструменти для обслуговування - обмеження використання інструмента
    category: technical
    csf_function: protect
    description: Обмежити використання інструментів технічного обслуговування лише авторизованим персоналом.
    annotation: Це посилення стосується систем, які використовуються для технічного обслуговування.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ma-3.5
    ref_id: MA-3(5)
    name: Інструменти для обслуговування - привілейоване виконання
    category: technical
    csf_function: protect
    description: Контроль використання засобів обслуговування, які мають підвищені привілеї виконання.
    annotation: Інструменти обслуговування, які виконуються з підвищеними системними привілеями, можуть призвести
      до несанкціонованого доступу до інформації та активів, що належать організації, які в іншому випадку були
      б недоступні.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ma-3.6
    ref_id: MA-3(6)
    name: Інструменти для обслуговування — Оновлення програмного забезпечення
    category: technical
    csf_function: protect
    description: Перевіряйте засоби захисту, щоб переконатися, що встановлено останні оновлення програмного забезпечення.
    annotation: Засоби захисту, які використовують застаріле та/або неоновлене програмне забезпечення, можуть стати
      вектором загрози для зловмисників і призвести до значної вразливості системи та організації.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ma-4
    ref_id: MA-4
    name: Віддалене обслуговування
    category: technical
    csf_function: protect
    description: 'a. Впровадити та відстежувати віддалені дії з обслуговування та діагностики.

      b. Дозволити використання віддалених засобів технічного обслуговування та діагностики лише відповідно до організаційної
      політики та в разі, якщо це документально зафіксовано в плані безпеки системи.

      c. Використовувати надійну автентифікацію при встановленні віддалених технічних та діагностичних сеансів.

      d. Вести облік віддалених дій з обслуговування та діагностики.

      e. Припинити сесії та мережеві з’єднання, коли завершено віддалене обслуговування.'
    annotation: Віддалене обслуговування та діагностика — це діяльність, яка проводиться через внутрішню або зовнішню
      мережі. Локальні заходи з обслуговування та діагностики — це ті заходи, що здійснюються особами, які фізично
      перебувають у системі чи компоненті системи та не використовують мережеве з’єднання. Методи автентифікації,
      що використовуються для створення віддалених сеансів обслуговування та діагностики, відображають вимоги доступу
      до мережі в IA2. Надійна автентифікація повинна включати інфраструктуру відкритих ключів (PKI), де сертифікати
      зберігаються на токені, захищеному паролем, парольною фразою, або біометричними даними. Забезпечення вимог
      до MA-4 частково виконується іншими органами управління. [SP 800-63B] надає додаткові вказівки щодо надійної
      автентифікації та автентифікаторів.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ma-4.1
    ref_id: MA-4(1)
    name: Віддалене обслуговування — Аудит і огляд
    category: technical
    csf_function: protect
    description: '(а) Журналювання заходів [Призначення: визначені організацією події аудиту] для віддалених сеансів
      обслуговування та діагностики.

      (б) Здійснювати огляд записів про сеанси віддаленого обслуговування та діагностики.


      Параметри:

      1. Призначення: визначені організацією події аудиту'
    annotation: Журнал аудиту для віддаленого обслуговування забезпечується AU-2. Події аудиту визначені в AU-2a.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ma-4.2
    ref_id: MA-4(2)
    name: Віддалене обслуговування — Документування віддаленого обслуговування
    category: technical
    csf_function: protect
    description: 'Вилучено: включено до MA-1 та MA-4.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ma-4.3
    ref_id: MA-4(3)
    name: Віддалене обслуговування - порівняльна безпека та очищення
    category: technical
    csf_function: protect
    description: '(a) Вимагати, щоб віддалені послуги з обслуговування та діагностики виконувалися із системи, яка
      реалізує заходи безпеки і які можна порівняти із заходами, реалізованими в системі, що обслуговується.

      (b) Видалити компонент, який підлягає обслуговуванню, із системи до віддаленого обслуговування або діагностичних
      послуг; очистити компонент (від інформації, що належить організації) після того, як обслуговування виконано,
      перевірити та очистити компонент (від потенційно шкідливого програмного забезпечення) перед тим, повторним
      підключенням компонентів до системи.'
    annotation: Порівнюваність можливостей безпеки систем, діагностичних інструментів та обладнання означає, що
      реалізований захід безпеки в цих системах, інструментах та обладнанні є, як мінімум, настільки ж комплексним,
      як і заходи безпеки в системі, що його обслуговує.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ma-4.4
    ref_id: MA-4(4)
    name: Віддалене обслуговування — Автентифікація та розподіл сесії обслуговування
    category: technical
    csf_function: protect
    description: "Захистити віддалені сеанси обслуговування за допомогою:\n(a) використання [Призначення: визначених\
      \ організацією автентифікаторів, які стійкі до відтворення];\n(b) відокремлення сеансів обслуговування від\
      \ інших мережевих сеансів із системою шляхом:\n\t(1) фізично відокремленого шляху зв’язку;\n\t(2) логічно\
      \ розділеного шляху зв’язку на основі шифрування.\n\nПараметри:\n1. Призначення: визначених організацією автентифікаторів,\
      \ які стійкі до відтворення"
    annotation: Шляхи зв’язку можуть бути логічно розділені за допомогою шифрування.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ma-4.5
    ref_id: MA-4(5)
    name: Віддалене обслуговування — Схвалення та повідомлення
    category: technical
    csf_function: protect
    description: '(a) вимагати схвалення кожного віддаленого сеансу технічного обслуговування [Призначення: персоналом
      або роллю, що визначила організація];

      (b) повідомити [Призначення: персонал або ролі, що визначила організація] про дату та час запланованого віддаленого
      обслуговування.


      Параметри:

      1. Призначення: персоналом або роллю, що визначила організація

      2. Призначення: персонал або ролі, що визначила організація'
    annotation: Сповіщення може здійснюватися технічним персоналом. Затвердження віддалених сесій технічного обслуговування
      здійснюється організаційним персоналом, який має достатню підготовку в галузі інформаційної безпеки та знання
      для визначення відповідності запропонованого обслуговування.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ma-4.6
    ref_id: MA-4(6)
    name: Віддалене обслуговування — Криптографічний захист
    category: technical
    csf_function: protect
    description: Запровадити криптографічні механізми для захисту цілісності та конфіденційності віддаленого обслуговування
      та діагностичних комунікацій.
    annotation: Неспроможність захистити віддалені комунікації для технічного обслуговування та діагностики може
      призвести до того, що неавторизовані особи отримають доступ до організаційної інформації. Несанкціонований
      доступ під час сеансів віддаленого обслуговування може призвести до різноманітних ворожих дій, включаючи вставку
      шкідливого коду, несанкціоновану зміну параметрів системи та витік організаційної інформації. Такі дії можуть
      призвести до втрати або деградації місії або бізнес-можливостей.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ma-4.7
    ref_id: MA-4(7)
    name: Віддалене обслуговування - перевірка віддаленого роз’єднання
    category: technical
    csf_function: protect
    description: Реалізувати перевірку віддаленого роз’єднання в разі припинення віддалених сеансів обслуговування
      та діагностики.
    annotation: Перевірка розриву з’єднання після завершення обслуговування гарантує, що з’єднання, встановлені
      під час сеансів віддаленого обслуговування та діагностики, були розірвані і більше не доступні для використання.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ma-5
    ref_id: MA-5
    name: Технічний персонал
    category: process
    csf_function: protect
    description: 'a. Встановити процедуру авторизації технічного персоналу та вести перелік авторизованих організацій
      технічного обслуговування або персоналу.

      b. Перевіряти, що персонал, який не супроводжується та виконує технічне обслуговування в системі, має необхідні
      дозволи на доступ.

      c. Визначити персонал організації з необхідними повноваженнями щодо доступу та технічною компетенцією для
      нагляду за персоналом з технічного обслуговування, який не має необхідних дозволів на доступ.'
    annotation: Цей захід безпеки застосовується до осіб, які виконують технічне або програмне обслуговування в
      системах організації, тоді як PE-2 стосується фізичного доступу осіб. Особи, які раніше не були визначені
      як уповноважений персонал з технічного обслуговування (виробники інформаційних технологій, постачальники та
      консультанти) можуть потребувати привілейованого доступу до систем організації при проведенні заходів обслуговування.
      На підставі оцінок ризику організації можуть видавати тимчасові повноваження цим особам. Тимчасові повноваження
      можуть бути одноразовими або дуже обмеженими.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ma-5.1
    ref_id: MA-5(1)
    name: Технічний персонал — Особи без належного доступу
    category: process
    csf_function: protect
    description: "(a) Реалізувати процедури залучення персоналу з технічного обслуговування, який не має відповідних\
      \ дозволів (допуску) або не є громадянами України, які (процедури) містять такі вимоги:\n\t(1) обслуговуючий\
      \ персонал, що не має необхідних прав доступу, рівня допуску, або офіційного затвердженого доступу, повинен\
      \ супроводжуватися та бути під наглядом уповноваженого організацією персоналу, з необхідним рівнем допуску,\
      \ а також мати відповідну технічну кваліфікацію для виконання технічного обслуговування та діагностичних заходів\
      \ у системі;\n\t(2) перед тим, як розпочати технічне обслуговування або діагностику персоналом, який не має\
      \ необхідних прав допуску, рівня допуску або офіційного затвердженого доступу, упевнитися, що всі компоненти\
      \ енергонезалежного зберігання інформації в системі очищуються, а всі енергонезалежні носії видаляються або\
      \ фізично відключаються від системи та надійно захищаються.\n(b) Розробити та впровадити альтернативні заходи\
      \ безпеки, якщо компонент системи не може бути очищено, вилучено або відключено від системи."
    annotation: Це посилення стосується осіб, які не мають відповідних дозволів (допуску) або не є громадянами України,
      яким не дозволений доступ до будь-якої секретної або контрольованої некласифікованої інформації, що міститься
      в системах організації. Процедури використання обслугового персоналу мають бути задокументовані в планах безпеки
      систем.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ma-5.2
    ref_id: MA-5(2)
    name: Технічний персонал — Оформлення допуску для систем, що обробляють інформацію з обмеженим доступом
    category: process
    csf_function: protect
    description: Переконатися, що персонал, який виконує технічне обслуговування та діагностику в системі, що обробляє,
      зберігає або передає інформацію з обмеженим доступом, має рівень допуску та офіційне схвалення на доступ для
      найвищого рівня секретності та для всієї інформації в системі.
    annotation: Персонал, який проводить технічне обслуговування систем організації, може мати доступ до інформації
      з обмеженим доступом під час виконання робіт з технічного обслуговування. Щоб зменшити ризики, організація
      використовує персонал, який має допуск відповідний до рівня секретності інформації, що зберігається в системі.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ma-5.3
    ref_id: MA-5(3)
    name: Технічний персонал — Вимоги до громадянства
    category: process
    csf_function: protect
    description: Переконатися, що працівники, які виконують технічне обслуговування та діагностичні заходи з обробки,
      зберігання або передачі таємної інформації, є громадянами України.
    annotation: Персонал, який здійснює технічне обслуговування систем організації, може мати доступ до секретної
      інформації під час виконання робіт з технічного обслуговування. Якщо доступ до до секретної інформації в системах
      обмежений організації для громадян України, таке ж обмеження поширюється і на персонал, який виконує технічне
      обслуговування цих систем.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ma-5.4
    ref_id: MA-5(4)
    name: Технічний персонал — Іноземні громадяни
    category: process
    csf_function: protect
    description: 'Переконайтеся, що: (a) іноземні громадяни з відповідним рівнем допуску залучаються для проведення
      технічного обслуговування та діагностичних робіт у системах, що обробляють інформацію з обмеженим доступом
      тільки тоді, коли ці системи спільно належать і експлуатуються урядами України та закордонних союзників, або
      належать та експлуатуються виключно іноземними союзними урядами; (b) схвалення, згоди та додаткові умови експлуатації,
      що стосуються залучення іноземних громадян для проведення робіт з технічного обслуговування та діагностики
      систем, що обробляють інформацію з обмеженим доступом, повністю задокументовані в Меморандумі про угоду.'
    annotation: Персонал, який проводить технічне обслуговування та діагностику систем організації, може мати доступ
      до секретної інформації. Якщо особам, які не є громадянами України, дозволено виконувати роботи з технічного
      обслуговування та діагностики в системах з обемеженим доступом, то необхідна додаткова перевірка, щоб гарантувати,
      що угоди та обмеження не порушуються.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ma-5.5
    ref_id: MA-5(5)
    name: Технічний персонал — Несистемне обслуговування
    category: process
    csf_function: protect
    description: Переконатися, що персонал, який не супроводжується та здійснює ремонтні роботи, не пов’язаний безпосередньо
      із системою, але перебуває фізично близько від системи, має необхідні дозволи на доступ.
    annotation: До персоналу, що здійснює ремонтні роботи, які не пов’язані безпосередньо із системою, належить,
      наприклад, персонал для охорони.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ma-6
    ref_id: MA-6
    name: Своєчасне обслуговування
    category: process
    csf_function: protect
    description: 'Отримати технічну підтримку та/або запасні частини для [Призначення: визначених організацією компонентів
      системи] в межах [Призначення: визначеного організацією періоду часу] у разі відмови.


      Параметри:

      1. Призначення: визначених організацією компонентів системи

      2. Призначення: визначеного організацією періоду часу'
    annotation: Організації мають визначати найбільш критичні компоненти системи та ключові посадові особи. Дії
      для отримання технічної підтримки зазвичай передбачають наявність відповідних договорів.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ma-6.1
    ref_id: MA-6(1)
    name: Своєчасне обслуговування - профілактичне обслуговування
    category: process
    csf_function: protect
    description: 'Здійснювати профілактичне обслуговування [Призначення: визначених організацією компонентів системи]
      у [Призначення: визначені організацією часові інтервали].


      Параметри:

      1. Призначення: визначених організацією компонентів системи

      2. Призначення: визначені організацією часові інтервали'
    annotation: 'Профілактичне обслуговування охоплює активний огляд і перевірку компонентів системи для підтримки
      обладнання та устаткування у задовільному робочому стані. Таке технічне обслуговування передбачає: систематичне
      обстеження, випробування, вимірювання, налаштування, заміну деталей, виявлення та виправлення несправностей,
      що виникають, або до того як вони виникнуть. Основна мета профілактичного обслуговування — уникнути/пом’якшити
      наслідки відмов обладнання. Профілактичне обслуговування призначене для збереження та відновлення надійності
      обладнання шляхом заміни зношених компонентів до їх виходу з ладу. Методи визначення того, які профілактичні
      (або інші) політики управління відмовами застосовуються, містять, наприклад, оригінальні рекомендації виробника
      обладнання, статистичні записи про несправності, вимоги кодексів, законодавства чи нормативно-правових актів
      у межах юрисдикції, висновки експертів тощо.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ma-6.2
    ref_id: MA-6(2)
    name: Своєчасне обслуговування - планове технічне обслуговування
    category: process
    csf_function: protect
    description: 'Здійснювати планове технічне обслуговування [Призначення: визначених організацією компонентів
      системи] у [Призначення: визначені організацією часові інтервали].


      Параметри:

      1. Призначення: визначених організацією компонентів системи

      2. Призначення: визначені організацією часові інтервали'
    annotation: Планове обслуговування або поточне обслуговування має на меті оцінювання стану обладнання зі здійсненням
      періодичного або постійного (онлайнового) моніторингу стану обладнання. Метою планового обслуговування є проведення
      технічного обслуговування в запланований момент часу, коли діяльність з технічного обслуговування є найбільш
      економічною і до того, як обладнання втратить працездатність. Цей підхід може використовувати принципи контролю
      статистичних процесів для визначення найбільш прийнятного часу для проведення технічного обслуговування. Більшість
      планових перевірок технічного обслуговування проводяться під час роботи обладнання, що дозволяє мінімізувати
      порушення нормальної роботи системи. Планове обслуговування може забезпечити значну економію та більшу надійність
      системи.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ma-6.3
    ref_id: MA-6(3)
    name: Своєчасне обслуговування — Автоматизована підтримка планового технічного обслуговування
    category: process
    csf_function: protect
    description: 'Використовувати автоматизовані механізми для передачі даних планового технічного обслуговування
      до комп’ютеризованої системи управління обслуговуванням [Призначення: автоматизовані засоби визначені організацією].


      Параметри:

      1. Призначення: автоматизовані засоби визначені організацією'
    annotation: Комп’ютеризована система управління технічним обслуговуванням підтримує базу даних з інформацією
      про заходи з технічного обслуговування та автоматизує обробку даних про стан обладнання для планування та
      звітності.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ma-7
    ref_id: MA-7
    name: Технічне обслуговування в польових умовах
    category: process
    csf_function: protect
    description: 'Обмежити або заборонити технічне обслуговування в польових умовах [Призначення: визначені організацією
      системи або системні компоненти] до [Призначення: визначені організацією довірені засоби технічного обслуговування]


      Параметри:

      1. Призначення: визначені організацією системи або системні компоненти

      2. Призначення: визначені організацією довірені засоби технічного обслуговування'
    annotation: Технічне обслуговування в польових умовах — це тип технічного обслуговування системи або компонента
      системи після того, як систему або компонент було розгорнуто в певному місці (тобто в робочому середовищі).
      У деяких випадках польове технічне обслуговування (тобто локальне технічне обслуговування на об’єкті) може
      не виконуватися з таким самим ступенем якості або з такими ж перевірками контролю якості, як технічне обслуговування
      у стандартних умовах. Для критично важливих систем, визначених організацією, може виникнути необхідність обмежити
      або заборонити польове технічне обслуговування на місці та вимагати, щоб таке технічне обслуговування проводилося
      на надійних об’єктах із додатковими заходами захисту.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:mp-1
    ref_id: MP-1
    name: Політика та процедури щодо захисту носіїв інформації
    category: policy
    csf_function: govern
    description: "a. Розробити, задокументувати та поширити серед [Призначення: визначеного організацією персоналу\
      \ або посад]:\n1.  політику захисту носіїв інформації, яка:\n\t(a) містить мету, сферу застосування, ролі,\
      \ обов’язки, відповідальність керівництва, координацію між організаційними підрозділами та систему контролю\
      \ відповідності (complaince);\n\t(b) відповідає чинному законодавству, виконавчим наказам, директивам, нормам,\
      \ політикам, стандартам та керівним принципам;\n2. процедури, які сприяють здійсненню політики та заходів\
      \ захисту носіїв інформації.\nb. Призначити [Призначення: визначену організацією посадову особу] для управління\
      \ розробкою, документування, та розповсюдження політики та процедурами захисту носіїв інформації.\nc. Переглядати\
      \ та оновлювати чинну систему захисту носіїв інформації:\n\t1. поточну політику захисту носіїв інформації\
      \ [Призначення: з визначеною організацією частотою];\n\t2. поточні процедури захисту носіїв інформації [Призначення:\
      \ з визначеною організацією частотою].\n\nПараметри:\n1. Призначення: визначеного організацією персоналу або\
      \ посад\n2. Призначення: визначену організацією посадову особу\n3. Призначення: з визначеною організацією\
      \ частотою"
    annotation: Цей захід захисту стосується встановлення політики та процедур для ефективного здійснення заходів
      та їх посилень у класі MP. Стратегія управління ризиками є важливим фактором у встановленні політики та процедур.
      Комплексна політика та процедури допомагають забезпечити безпеку та приватність. За наявності політики, а
      також планів захисту інформації та персональних даних на рівні організації, конкретні системні політики та
      процедури можуть бути не потрібні. Політика може бути внесена до складу загальної політики безпеки та приватності
      або може бути представлена кількома політиками (у випадках складної архітектури). Процедури описують, як має
      реалізуватися політика чи заходи захисту та як вони можуть бути спрямовані на персонал або роль, що є об’єктом
      процедури. Процедури можуть бути задокументовані в планах захисту інформації та персональних даних (як один
      або декілька документів).
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:mp-2
    ref_id: MP-2
    name: Доступ до носіїв інформації
    category: process
    csf_function: protect
    description: 'Обмежити доступ до [Призначення: визначених організацією типів цифрових та/або нецифрових носіїв
      інформації] [Призначення: визначеним організацією персоналом або ролями].


      Параметри:

      1. Призначення: визначених організацією типів цифрових та/або нецифрових носіїв інформації

      2. Призначення: визначеним організацією персоналом або ролями'
    annotation: 'До носіїв системи належать як цифрові, так і нецифрові носії. До цифрових носіїв належать: дискети,
      магнітні стрічки, зовнішні/знімні жорсткі диски, флешки, компакт-диски, цифрові відеодиски та інші. До нецифрових
      носіїв належать, наприклад, папір і мікрофільми. Обмеження доступу до нецифрових носіїв охоплює, наприклад,
      заборону доступу до медичних записів пацієнтів (за винятком уповноважених медичних працівників). Обмеження
      доступу до цифрових носіїв інформації охоплює, наприклад, обмеження доступу до проєктних специфікацій дизайну,
      що зберігаються на компакт-дисках у медіатеці, керівнику проєкту та особам з команди розробників.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:mp-2.1
    ref_id: MP-2(1)
    name: Доступ до носіїв інформації — Автоматизований обмежений доступ
    category: process
    csf_function: protect
    description: 'Вилучено: Включено до MP-4(2).'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:mp-2.2
    ref_id: MP-2(2)
    name: Доступ до носіїв інформації — Криптографічний захист
