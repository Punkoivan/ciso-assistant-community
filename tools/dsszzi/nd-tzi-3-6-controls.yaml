  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ac-16
    ref_id: AC-16
    name: Атрибути безпеки та приватності
    category: technical
    csf_function: protect
    description: 'a. Визначити засоби для асоціювання (пов’язання) [Призначення: визначених організацією типів атрибутів
      безпеки та приватності], що приймають [Призначення: визначені організацією значення атрибутів безпеки та приватності]
      з інформацією, яка зберігається, обробляється та/або передається.


      b. Пов’язані атрибути безпеки та приватності мають створюватися і зберігатися разом з інформацією.


      c. Встановити дозволені [Призначення: визначені організацією атрибути безпеки] для [Призначення: систем, визначених
      організацією].


      d. Визначити дозволені [Призначення: визначені організацією значення або діапазони] для кожного з встановлених
      атрибутів безпеки та приватності.


      Параметри:

      1. Призначення: визначених організацією типів атрибутів безпеки та приватності

      2. Призначення: визначені організацією значення атрибутів безпеки та приватності

      3. Призначення: визначені організацією атрибути безпеки

      4. Призначення: систем, визначених організацією

      5. Призначення: визначені організацією значення або діапазони'
    annotation: 'Інформація, яка міститься в системі, являє собою структури даних. Внутрішні структури даних можуть
      бути представлені двома видами сутностей:

      активні та пасивні. Активні сутності зазвичай називають суб’єктами — вони асоціюються з особами, пристроями
      або процесами, що діють від їхнього імені. Пасивними сутностями виступають об’єкти, які асоціюються зі структурами
      даних, такими як записи, буфери, таблиці, файли, порти зв’язку. Атрибути безпеки — це форма метаданих, що
      становлять основні властивості або характеристики активних і пасивних сутностей щодо захисту інформації. Атрибути
      приватності, які можуть використовуватися незалежно або в поєднанні з атрибутами безпеки, становлять основні
      властивості чи характеристики суб’єкта господарювання щодо персональних даних. Такі атрибути використовуються
      для забезпечення фіксації факту виконання обов’язків, зв’язку персональних даних всередині об’єктів даних
      та встановлення меж дозволеного використання особистої інформації.

      Атрибути можуть бути явно чи неявно пов’язані з інформацією, що міститься в системах або компонентах системи
      організації.


      Атрибути безпеки та приватності призначаються активним сутностям (тобто суб’єктам), які можуть надсилати чи
      отримувати інформацію, ініціювати переміщення потоку інформації серед об’єктів або впливати на зміну стану
      системи. Ці атрибути можуть також бути пов’язані з пасивними сутностями (тобто об’єктами), які містять чи
      отримують інформацію.

      Призначення атрибутів безпеки та приватності суб’єктам або об’єктам є обов’язковим і не охоплює значення атрибута
      та його тип. Зв’язок атрибутів безпеки та приватності з даними чи інформацією дозволяє застосовувати політику
      безпеки для контролю доступу й управління потоком інформації, а також політику приватності, включно з обмеженнями
      щодо збереження даних та дозволеним використанням особистої інформації. Методи прив’язки визначаються особливостями
      системами та впливають на міцність зв’язку атрибутів з інформацією. Методи зв’язування можуть впливати на
      ступінь необхідних додаткових заходів. Зміст і значення атрибутів безпеки та приватності можуть безпосередньо
      впливати на доступність інформації.


      Типи атрибутів повинні обиратися залежно від конкретної системи, враховуючи її місію та функції. Може бути
      наявний широкий діапазон значень конкретного атрибута безпеки.

      Назви атрибутів безпеки та приватності мають відображати їх зв’язок із сутностями та структурами даних системи.
      Це дозволяє реалізовувати політики безпеки та приватності.

      Назви можуть містити дозволи на доступ, національність, дані щодо захисту життєвого циклу (тобто шифрування
      та закінчення строку дії даних), згоди суб’єкта даних, дозволене використання даних, класифікацію інформації
      відповідно до законодавчих актів. З іншого боку, назви атрибутів безпеки та приватності мають бути зрозумілими
      для посадових осіб.

      Це дає змогу вручну виконувати положення політик безпеки та приватності на основі


      ручного чи процедурного процесів.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ac-16.1
    ref_id: AC-16(1)
    name: Атрибути безпеки та приватності — Динамічне пов’язання атрибутів
    category: technical
    csf_function: protect
    description: 'Динамічно пов’язувати атрибути безпеки та приватності з [Призначенням:

      визначеними організацією суб’єктами й об’єктами] відповідно до [Призначення: визначених організацією політик
      безпеки та приватності], у міру створення та об’єднання інформації.


      Параметри:

      1. Призначенням: визначеними організацією суб’єктами й об’єктами

      2. Призначення: визначених організацією політик безпеки та приватності'
    annotation: Динамічне пов’язування атрибутів безпеки та приватності є доцільним, коли характеристики безпеки
      та приватності інформації можуть змінюватися з часом. Атрибути можуть змінюватися, наприклад, через проблеми
      агрегації інформації (у ситуаціях, коли характеристики безпеки та приватності окремих елементів інформації
      відрізняються від комбінованих елементів), зміни в індивідуальних дозволах доступу (тобто привілеях), зміни
      категорії безпеки інформації, зміни в політиці безпеки та приватності.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ac-16.2
    ref_id: AC-16(2)
    name: Атрибути безпеки та приватності — Зміна значень атрибутів авторизованими особами
    category: technical
    csf_function: protect
    description: 'Надати уповноваженим особам (або процесам, що діють від імені фізичних осіб)

      можливість визначати або змінювати значення відповідних атрибутів безпеки та приватності.'
    annotation: Зміст або значення атрибутів безпеки та приватності можуть безпосередньо впливати на здатність людей
      отримувати доступ до інформації. Тому важливо, щоб системи могли обмежувати можливість створювати або змінювати
      атрибути уповноваженим особам.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ac-16.3
    ref_id: AC-16(3)
    name: Атрибути безпеки та приватності — Підтримка системою пов’язання атрибутів
    category: technical
    csf_function: protect
    description: 'Підтримати пов’язання та цілісність [Призначення: визначених організацією атрибутів безпеки та
      приватності] з [Призначення: визначених організацією суб’єктів і об’єктів].


      Параметри:

      1. Призначення: визначених організацією атрибутів безпеки та приватності

      2. Призначення: визначених організацією суб’єктів і об’єктів'
    annotation: 'Підтримка пов’язання та цілісності атрибутів безпеки та приватності з достатньою впевненістю допомагає
      забезпечити використання пов’язання атрибутів як основи автоматизованих дій, визначених політикою.

      Такі автоматизовані дії можуть впливати на терміни зберігання, терміни надання доступу та рішення щодо управління
      потоком інформації.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ac-16.4
    ref_id: AC-16(4)
    name: Атрибути безпеки та приватності — Пов’язання атрибутів авторизованими особами
    category: technical
    csf_function: protect
    description: 'Впровадити можливість пов’язувати [Призначення: визначені організацією атрибути безпеки та приватності]
      з [Призначення: визначеними організацією суб’єктами та об’єктами] уповноваженими особами (або процесами, що
      діють від імені фізичних осіб).


      Параметри:

      1. Призначення: визначені організацією атрибути безпеки та приватності

      2. Призначення: визначеними організацією суб’єктами та об’єктами'
    annotation: 'Система має надавати можливість спонукання користувачів вибирати конкретні атрибути безпеки або
      приватності, які будуть пов’язані з конкретними інформаційними об’єктами; використання автоматизованих механізмів
      для категоризації інформації за відповідними атрибутами безпеки та приватності на основі визначених політик;
      або забезпечення валідності комбінації вибраних атрибутів безпеки чи приватності.

      Об''єднання атрибутів уповноваженими особами описано в проектній документації. Підтримка, що надається системами,
      може включати запити користувачів щодо вибору атрибутів безпеки та конфіденційності, які будуть пов’язані
      з інформаційними об’єктами, використання автоматизованих механізмів для класифікації інформації за допомогою
      атрибутів на основі визначених політик або забезпечення того, що комбінація вибраних атрибутів безпеки та
      конфіденційності є дійсною. Під час визначення подій, які підлягають перевірці, організації враховують створення,
      видалення або зміну атрибутів'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ac-16.5
    ref_id: AC-16(5)
    name: Атрибути безпеки та приватності — Відображення атрибутів на пристроях виведення
    category: technical
    csf_function: protect
    description: 'Відображати атрибути безпеки та приватності в зручній для людини формі для кожного об’єкту, який
      система передає на пристрої виведення, щоб ідентифікувати [Призначення: визначені організацією спеціальні
      інструкції щодо поширення, обробки чи наступного розподілу інформації], використовуючи [Призначення: визначену
      організацією ідентифікацію, у зручній для людини формі про стандартні угоди про присвоєння імен].


      Параметри:

      1. Призначення: визначені організацією спеціальні інструкції щодо поширення, обробки чи наступного розподілу
      інформації

      2. Призначення: визначену організацією ідентифікацію, у зручній для людини формі про стандартні угоди про
      присвоєння імен'
    annotation: 'До виходів системи можуть належати екрани, сторінки тощо. Пристрої виведення системи можуть містити
      принтери, ноутбуки, відеодисплеї на робочих станціях та персональні цифрові помічники. Для запобігання несанкціонованому
      доступу (наприклад методом підглядання, англ.

      «shoulder surfing») на екрані пристрою виведення має відображатися повне значення атрибутів (крім випадків,
      якщо значення атрибутів також має гриф доступу).'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ac-16.6
    ref_id: AC-16(6)
    name: Атрибути безпеки та приватності — Підтримка пов’язання атрибутів організацією
    category: technical
    csf_function: protect
    description: 'Вимагати від персоналу пов’язувати та підтримувати асоціацію [Призначення:

      визначених організацією атрибутів безпеки та приватності] з [Призначенням:

      визначеними організацією суб’єктами та об’єктами] відповідно до [Призначення: визначеної організацією політики
      безпеки та приватності].


      Параметри:

      1. Призначення: визначених організацією атрибутів безпеки та приватності

      2. Призначенням: визначеними організацією суб’єктами та об’єктами

      3. Призначення: визначеної організацією політики безпеки та приватності'
    annotation: Це посилення заходу вимагає від окремих користувачів (на відміну від системи) підтримувати пов’язування
      атрибутів безпеки та приватності із суб’єктами та об’єктами.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ac-16.7
    ref_id: AC-16(7)
    name: Атрибути безпеки та приватності — Послідовна інтерпретація атрибутів
    category: technical
    csf_function: protect
    description: Забезпечити послідовну інтерпретацію атрибутів безпеки та приватності, що передаються між розподіленими
      компонентами системи.
    annotation: Для застосування політики безпеки та приватності в різних компонентах розподілених систем, атрибутам
      доступу має надаватися послідовна інтерпретація. Мають бути впроваджені процеси для забезпечення реалізації
      атрибутів безпеки та приватності з послідовною інтерпретацією щодо автоматизованого доступу та управління
      потоком інформації для всіх компонентів розподіленої системи.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ac-16.8
    ref_id: AC-16(8)
    name: Атрибути безпеки та приватності — Техніки та технології пов’язання атрибутів
    category: technical
    csf_function: protect
    description: 'Реалізація [Призначення: методи та технології, визначені організацією] для пов’язування атрибутів
      безпеки та конфіденційності з інформацією.


      Параметри:

      1. Призначення: методи та технології, визначені організацією'
    annotation: 'Прив’язка атрибутів безпеки та приватності до інформації є важливою для проведення автоматизованих
      дій щодо забезпечення доступу та виконання потоків. Об’єднання таких атрибутів може бути досягнуто за допомогою
      технологій і технік, які забезпечують різні рівні впевненості.

      Наприклад, можуть використовуватися криптографічні методи, такі як цифрові підписи (за умови надійного зберігання
      ключових даних на захищених апаратнопрограмних носіях).'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ac-16.9
    ref_id: AC-16(9)
    name: Атрибути безпеки та приватності — Перепризначення атрибутів
    category: technical
    csf_function: protect
    description: 'Перепризначення атрибутів безпеки та приватності, пов’язаних з інформацією, здійснювати лише за
      допомогою механізмів перегляду, перевірених з використанням [Призначення: визначених організацією технік або
      процедур].


      Параметри:

      1. Призначення: визначених організацією технік або процедур'
    annotation: Для забезпечення необхідного рівня впевненості в коректності перепризначення атрибутів безпеки та
      приватності мають діяти затверджені механізми перегляду. Це досягається за умови, що такі механізми перегляду
      мають єдину мету та обмежений набір функцій. Перепризначення атрибутів може безпосередньо впливати на заходи
      щодо забезпечення безпеки та приватності, тому використання надійних механізмів перегляду необхідне для забезпечення
      ефективності таких механізмів у послідовному та правильному режимі роботи.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ac-16.10
    ref_id: AC-16(10)
    name: Атрибути безпеки та приватності — Конфігурація атрибутів уповноваженими особами
    category: technical
    csf_function: protect
    description: Надати уповноваженим особам можливість визначати або змінювати тип і значення атрибутів безпеки
      та приватності, доступних для пов’язання із суб’єктами та об’єктами.
    annotation: Тип або значення атрибутів безпеки та приватності можуть безпосередньо впливати на здатність людей
      отримувати доступ до інформації. Важливо мати можливість обмежувати створювання або зміну атрибутів лише авторизованими
      особами.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ac-17
    ref_id: AC-17
    name: Віддалений доступ
    category: technical
    csf_function: protect
    description: 'a. Встановити та задокументувати обмеження на використання, вимоги до конфігурації/підключення
      та рекомендації щодо здійснення кожного типу віддаленого доступу.


      b. Авторизувати віддалений доступ до системи, перш ніж будуть дозволені такі підключення.'
    annotation: 'Віддалений доступ — це доступ до систем організації (або процесів, що діють від імені користувачів),
      який відбувається через зовнішні мережі, такі як Інтернет. Методи віддаленого доступу можуть містити комутований,
      широкосмуговий і бездротовий доступ. Для підвищення конфіденційності та цілісності можуть використовуватися
      зашифровані VPN з’єднання. Використання зашифрованих

      VPN забезпечує достатню впевненість, що використовувані криптографічні механізми будуть реалізовані відповідно
      до чинного законодавства, виконавчих розпоряджень, директив, положень, політик, стандартів і рекомендацій.
      Проте VPN з’єднання проходять через зовнішні мережі, а зашифровані VPN погіршують доступність віддалених з’єднань.
      VPN з’єднання із зашифрованими тунелями також можуть впливати на можливість адекватного контролю трафіку мережевих
      комунікацій на предмет зловмисного коду. Управління віддаленим доступом має застосовуватися до всіх систем,
      за винятком загальнодоступних (включно з вебсерверами). Авторизація кожного типу віддаленого доступу стосується
      авторизації перед дозволом віддаленого доступу без визначення конкретних форматів для такої авторизації. У
      той час як організації можуть використовувати обмін інформацією та угоди про безпеку підключення до системи
      для керування віддаленим доступом до інших систем, такі угоди розглядаються як частина CA-3. Цей захід контролю
      вимагає наявність процедури авторизації перед використанням віддаленого доступу (проте не вказує на конкретні
      механізми авторизації). Обмеження, що стосуються віддаленого доступу, наведені в АС-3.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ac-17.1
    ref_id: AC-17(1)
    name: Віддалений доступ — Автоматизований моніторинг та управління
    category: technical
    csf_function: protect
    description: Проводити моніторинг та управління методами віддаленого доступу.
    annotation: Автоматизований моніторинг і управління методами віддаленого доступу дозволяють виявляти атаки та
      забезпечувати відповідність політиці віддаленого доступу, шляхом перевірки діяльності віддалених користувачів
      на різних компонентах системи, включно із серверами, робочими станціями, ноутбуками, смартфонами та планшетами.
      Журнал аудиту для віддаленого доступу забезпечується AU-2. Події аудиту визначені в AU-2a.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ac-17.2
    ref_id: AC-17(2)
    name: Віддалений доступ — Захист конфіденційності та цілісності за допомогою шифрування
    category: technical
    csf_function: protect
    description: Запровадити криптографічні механізми для захисту конфіденційності та цілісності сесій віддаленого
      доступу.
    annotation: Надійність механізму шифрування має вибиратися, виходячи з результатів процедури категоризації оброблюваної
      інформації.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ac-17.3
    ref_id: AC-17(3)
    name: Віддалений доступ — Керовані точки контролю доступу
    category: technical
    csf_function: protect
    description: Виконувати маршрутизацію всього віддаленого доступу через авторизовані та керовані точки контролю
      управління доступом до мережі.
    annotation: Обмеження переліку точок контролю доступу для віддаленого доступу зменшує кількість вразливих до
      атак точок.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ac-17.4
    ref_id: AC-17(4)
    name: Віддалений доступ — Привілейовані команди та доступ
    category: technical
    csf_function: protect
    description: '(a) Авторизувати виконання привілейованих команд і доступ до інформації, що стосується безпеки,
      за допомогою віддаленого доступу тільки для [Призначення: визначених організацією потреб];


      (b) Задокументувати обґрунтування такого доступу в плані захисту інформації для системи


      Параметри:

      1. Призначення: визначених організацією потреб'
    annotation: Віддалений доступ до систем є значною потенційною вразливістю, якою можуть скористатися зловмисники.
      Таким чином, обмеження виконання привілейованих команд і доступу до інформації, важливої для безпеки, через
      віддалений доступ зменшує вразливість організації та сприйнятливість до загроз з боку зловмисників.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ac-17.5
    ref_id: AC-17(5)
    name: Віддалений доступ — Моніторинг для неавторизованих підключень
    category: technical
    csf_function: protect
    description: '[Вилучено: включено до SI-4].'
    annotation: null
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ac-17.6
    ref_id: AC-17(6)
    name: Віддалений доступ — Захист інформації
    category: technical
    csf_function: protect
    description: Забезпечити захист інформації щодо механізмів віддаленого доступу від неавторизованого використання
      та розкриття.
    annotation: 'Віддалений доступ до інформації іншими організаціями може збільшити ризик несанкціонованого використання
      та розголошення механізмів віддаленого доступу. За можливості розглядається можливість включення вимог віддаленого
      доступу в угоди про обмін інформацією з такими організаціями. Вимоги щодо віддаленого доступу також можуть
      бути включені в правила поведінки (див. PL-4) і угоди про доступ (див.

      PS-6).'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ac-17.7
