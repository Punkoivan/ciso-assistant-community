    annotation: Загрози, які впливають на альтернативні майданчики роботи, мають бути визначені при проведенні оцінювання
      ризику (наприклад, стихійні лиха, структурні збої, атаки та помилки). За результатами оцінювання загроз організації
      визначають, що вважається достатнім ступенем поділу між основними та альтернативними майданчиками роботи.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:cp-7.2
    ref_id: CP-7(2)
    name: Альтернативний майданчик для роботи - Доступність
    category: technical
    csf_function: recover
    description: Визначити потенційні проблеми доступності для альтернативного майданчика для роботи в разі збоїв
      або катастрофи по всьому регіону та окреслити чіткі заходи щодо пом’якшення наслідків.
    annotation: Порушення в усіх регіонах стосуються тих типів перебоїв, які є суттєвими, незалежно від географічного
      розташування (такі висновки мають бути зроблені за результатами оцінювання ризиків).
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:cp-7.3
    ref_id: CP-7(3)
    name: Альтернативний майданчик для роботи - пріоритет обслуговування
    category: technical
    csf_function: recover
    description: Розробити угоди про альтернативний майданчик для роботи, які містять положення щодо пріоритету
      обслуговування відповідно до вимог стосовно організаційної доступності (включно з вимогами щодо часу відновлення).
    annotation: Угоди з пріоритетним обслуговуванням — це угоди з постачальниками послуг, які забезпечують, щоб
      організації отримували пріоритетне обслуговування (відповідно до вимог щодо їх доступності та наявності інформаційних
      ресурсів) на альтернативному майданчику роботи.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:cp-7.4
    ref_id: CP-7(4)
    name: Альтернативний майданчик для роботи - Підготовка для використання
    category: technical
    csf_function: recover
    description: Підготувати альтернативний майданчик для роботи таким чином, щоб майданчик був готовий до використання
      як оперативний майданчик, що підтримує виконання основних завдань і функцій.
    annotation: Підготовка майданчика охоплює, наприклад, налаштування конфігурації для компонентів системи на альтернативному
      майданчику роботи (що відповідає вимогам щодо таких самих налаштувань на основному майданчику).
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:cp-7.5
    ref_id: CP-7(5)
    name: Альтернативний майданчик для роботи - Еквівалентні заходи безпеки інформації
    category: technical
    csf_function: recover
    description: Вилучено. Включено до CP-7
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:cp-7.6
    ref_id: CP-7(6)
    name: Альтернативний майданчик для роботи - нездатність повернутися на основний майданчик
    category: technical
    csf_function: recover
    description: Розробити план та підготуватися до обставин, що виключають повернення на основний майданчик для
      роботи.
    annotation: Можуть виникнути ситуації, які перешкоджають поверненню організації на основний майданчик обробки,
      наприклад, якщо стихійне лихо (наприклад, повінь або ураган) завдало шкоди або зруйнувло об’єкт, і було встановлено,
      що відновлення в тому ж місці є недоцільним.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:cp-8
    ref_id: CP-8
    name: Комунікаційні послуги
    category: technical
    csf_function: recover
    description: 'Впровадити альтернативні комунікаційні послуги, включно з необхідними угодами, що дозволять відновити
      [Призначення: визначені організацією системні операції] для основних завдань і функцій у [Призначення: визначений
      організацією період часу], коли основні можливості зв’язку недоступні на основному місці локації або розташовані
      на альтернативному майданчику для роботи чи зберігання.


      Параметри:

      1. Призначення: визначені організацією системні операції

      2. Призначення: визначений організацією період часу'
    annotation: Цей захід захисту застосовується до комунікаційних послуг (даних і голосових повідомлень) для основних
      та альтернативних майданчиків роботи та зберігання. Альтернативні комунікаційні послуги необхідні для забезпечення
      безперервності виконання функцій і завдань. До них належать, наприклад, додаткові організаційні або комерційні
      наземні чи супутникові лінії зв’язку. Під час укладення угод з надання альтернативних комунікаційних послуг
      організації враховують такі фактори, як доступність та якість обслуговування.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:cp-8.1
    ref_id: CP-8(1)
    name: Комунікаційні послуги — Пріоритет постачання послуг
    category: technical
    csf_function: recover
    description: '(a) Розробити основні та альтернативні угоди про надання комунікаційних послуг, які містять пріоритетні
      положення про надання послуг відповідно до вимог організаційної доступності (включно з вимогами щодо часу
      відновлення).

      (b) Надсилати запит про пріоритети комунікаційних послуг для всіх комунікаційних послуг, що використовуються
      для забезпечення безперервності роботи, якщо основні та/або альтернативні комунікаційні послуги надаються
      загальним оператором.'
    annotation: Організації мають аналізувати потенційний вплив на діяльність у ситуаціях, якщо постачальники комунікаційних
      послуг обслуговують також інші організації, які мають право на пріоритетне обслуговування від постачальників.
      Пріоритет комунікаційних послуг (TSP) — це програма Федеральної комісії зі зв’язку (FCC), яка наказує постачальникам
      комунікаційних послуг (наприклад, компаніям дротового та бездротового зв’язку) надавати пільговий режим користувачам,
      зареєстрованим у програмі, коли їм потрібно додати нові лінії або мати свої. FCC встановлює правила та політику
      для програми TSP, а Департамент внутрішньої безпеки керує програмою TSP. Програма TSP завжди діє і не залежить
      від великої катастрофи чи нападу. Для участі в програмі TSP потрібне федеральне спонсорство.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:cp-8.2
    ref_id: CP-8(2)
    name: Комунікаційні послуги — Єдині точки відмови
    category: technical
    csf_function: recover
    description: Отримати альтернативні комунікаційні послуги з метою зменшення ймовірності спільного використання
      єдиної точки відмови з основними комунікаційними послугами.
    annotation: За певних обставин постачальники комунікаційних послуг або послуги можуть використовувати ті самі
      фізичні лінії, що збільшує вразливість єдиної точки відмови. Важливо забезпечити прозорість постачальника
      щодо фактичної фізичної можливості передачі комунікаційних послуг.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:cp-8.3
    ref_id: CP-8(3)
    name: Комунікаційні послуги - відділення основних та альтернативних провайдерів
    category: technical
    csf_function: recover
    description: Отримувати альтернативні комунікаційні послуги від постачальників, які відокремлені від основних
      постачальників послуг, щоб зменшити сприйнятливості до тих самих загроз.
    annotation: 'До загроз, які впливають на комунікаційні послуги, належать: стихійні лиха, збої, кібератаки, фізичні
      атаки та помилки з бездіяльності. Такі загрози мають бути проаналізовані в ході проведення оцінювання ризиків.
      Загальна сприйнятливість може бути зменшена, наприклад, шляхом мінімізації спільної інфраструктури між провайдерами
      комунікаційних послуг або залученням географічно розподілених провайдерів. Організації можуть розглядати можливість
      використання одного постачальника послуг у ситуаціях, коли постачальник послуг може надавати альтернативні
      комунікаційні послуги, що відповідають вимогам розподілення, розглянутим при оцінюванні ризику.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:cp-8.4
    ref_id: CP-8(4)
    name: Комунікаційні послуги — План забезпечення безперервної роботи постачальника комунікаційних послуг
    category: technical
    csf_function: recover
    description: '(a) вимагати, щоб постачальники основних та альтернативних комунікаційних послуг мали плани забезпечення
      безперервної роботи;

      (b) переглядати плани забезпечення безперервної роботи постачальників комунікаційних послуг для забезпечення
      відповідності планам забезпечення безперервної роботи організації;

      (c) отримати свідчення про тестування планів забезпечення безперервної роботи та навчання постачальників комунікаційних
      послуг [Призначення: з визначеною організацією частотою].


      Параметри:

      1. Призначення: з визначеною організацією частотою'
    annotation: У ході перегляду планів забезпечення безперервної роботи постачальників комунікаційних послуг необхідно
      враховувати властивості таких планів (у деяких ситуаціях короткого огляду плану забезпечення безперервної
      роботи постачальників комунікаційних послуг може бути достатньо). Якщо постачальники комунікаційних послуг
      беруть участь у поточних навчаннях щодо забезпечення безперервної роботи в координації з державними та/або
      місцевими органами влади, то організації можуть зараховувати такі навчання як гарантії щодо надійності та
      кваліфікованості такого постачальника.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:cp-8.5
    ref_id: CP-8(5)
    name: Комунікаційні послуги - тестування альтернативних комунікаційних послуг
    category: technical
    csf_function: recover
    description: 'Тестувати надання альтернативних комунікаційних послуг [Призначення: з визначеною організацією
      частотою].


      Параметри:

      1. Призначення: з визначеною організацією частотою'
    annotation: Тестування альтернативних комунікаційних послуг організовується за договором з постачальниками послуг.
      Тестування може відбуватися паралельно зі звичайними операціями, для гарантування того, що немає погіршення
      задач чи функцій організації.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:cp-9
    ref_id: CP-9
    name: Резервне копіювання
    category: technical
    csf_function: protect
    description: 'a. Проводити резервне копіювання інформації користувачів, що міститься [Призначення: системні
      компоненти, визначені організацією] [Призначення: з визначеною організацією частотою, відповідно до часу відновлення
      та встановлених цілей відновлення].

      b. Проводити резервне копіювання системної інформації на системному рівні, що міститься в системі [Призначення:
      з визначеною організацією частотою, відповідно до завдань відновлення і встановлених цілей відновлення].

      c. Проводити резервне копіювання системної документації, включно з документацією, пов’язаною із забезпеченням
      безпеки та приватності [Призначення: з визначеною організацією частотою, відповідно до часу відновлення та
      встановлених цілей відновлення].

      d. Забезпечити захист конфіденційності, цілісності та доступності резервних копій інформації в місцях їх зберігання.


      Параметри:

      1. Призначення: системні компоненти, визначені організацією

      2. Призначення: з визначеною організацією частотою, відповідно до часу відновлення та встановлених цілей відновлення

      3. Призначення: з визначеною організацією частотою, відповідно до завдань відновлення і встановлених цілей
      відновлення'
    annotation: 'Системна інформація охоплює: інформацію про стан системи, програмне забезпечення, операційну систему,
      прикладне програмне забезпечення, ліцензії тощо. Інформація користувачів охоплює будь-яку інформацію, крім
      системної інформації. Механізми, які можуть застосовуватися для захисту цілісності резервних копій, містять,
      наприклад, цифрові підписи та криптографічні геші. Захист резервної інформації під час транзиту забезпечується
      MP-5 і SC-8.

      Положення щодо резервного копіювання відображаються в планах забезпечення безперервної роботи та відновлення
      функціонування, а також інші вимоги щодо резервного копіювання інформації. На організації можуть поширюватися
      закони, виконавчі накази, директиви, нормативні акти чи політики з вимогами щодо певних категорій інформації
      (наприклад, інформація про особисте здоров’я). Персонал організації консультується з представником з питань
      конфіденційності та юрисконсультантом щодо таких вимог.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:cp-9.1
    ref_id: CP-9(1)
    name: Резервне копіювання — Випробування на надійність та цілісність
    category: technical
    csf_function: protect
    description: 'Тестувати носії резервних копій інформації [Призначення: з визначеною організацією частотою] для
      перевірки надійності носіїв та цілісності інформації.


      Параметри:

      1. Призначення: з визначеною організацією частотою'
    annotation: Необхідно бути впевненим у тому, що інформацію з резервної копії можна отримати. Надійність стосується
      систем і компонентів системи, де зберігається резервна інформація, операцій, які використовуються для отримання
      інформації, і цілісності інформації, що вилучається. Для кожного з аспектів надійності можна використовувати
      незалежні та спеціалізовані тести. Наприклад, дешифрування та передача випадкової вибірки файлів резервних
      копій з альтернативного сховища або майданчика резервного копіювання та порівняння інформації з тією самою
      інформацією в первинному місці обробки може забезпечити таку гарантію.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:cp-9.2
    ref_id: CP-9(2)
    name: Резервне копіювання - тестування відновлення з використанням зразків
    category: technical
    csf_function: protect
    description: Використовувати зразок резервної копії інформації при відновленні вибраних функцій системи як частину
      тестування плану забезпечення безперервної роботи та відновлення функціонування.
    annotation: Необхідна впевненість, що функції системи можна відновити належним чином і що вони зможуть підтримувати
      встановлені функції. Щоб переконатися, що вибрані функції системи ретельно відпрацьовуються під час тестування
      плану забезпечення безперервної роботи, витягується зразок резервної інформації, щоб визначити, чи функції
      працюють належним чином. Організації можуть визначати розмір вибірки для функцій і резервної інформації на
      основі необхідного рівня впевненості.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:cp-9.3
    ref_id: CP-9(3)
    name: Резервне копіювання — Відокремлене сховище критичної інформації
    category: technical
    csf_function: protect
    description: 'Зберігати резервні копії [Призначення: визначеного організацією критичного системного програмного
      забезпечення та іншої інформації, пов’язаної з безпекою] в окремому сховищі або у вогнестійкому контейнері,
      які не пов’язані із системою.


      Параметри:

      1. Призначення: визначеного організацією критичного системного програмного забезпечення та іншої інформації,
      пов’язаної з безпекою'
    annotation: Відокремлене зберігання критичної інформації стосується всієї важливої інформації, незалежно від
      типу носія для зберігання резервних копій. До критичного системного програмного забезпечення належать операційні
      системи, проміжне програмне забезпечення, системи керування криптографічними ключами та системи виявлення
      вторгнень. Інформація, пов’язана з безпекою, включає інвентаризацію системного обладнання, програмного забезпечення
      та мікропрограмних компонентів. Відокремлені сховища мають бути територіально розділеними з організаційними
      системами. Організації можуть забезпечте окреме зберігання шляхом впровадження автоматизованих процесів резервного
      копіювання в альтернативних місцях зберігання (наприклад, центри обробки даних). Адміністрація загального
      обслуговування (GSA) встановлює стандарти та специфікації для контейнерів із захищеністю та вогнестійкістю.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:cp-9.4
    ref_id: CP-9(4)
    name: Резервне копіювання модифікацій
    category: technical
    csf_function: protect
    description: 'Вилучено: Включено до CP-9'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:cp-9.5
    ref_id: CP-9(5)
    name: Резервне копіювання — Передача на альтернативне сховище зберігання
    category: technical
    csf_function: protect
    description: 'Перенести резервні копії інформації системи на альтернативне сховище [Призначення: у визначений
      організацією період часу та швидкість передачі, відповідні часу відновлення та встановленим цілям відновлення].


      Параметри:

      1. Призначення: у визначений організацією період часу та швидкість передачі, відповідні часу відновлення та
      встановленим цілям відновлення'
    annotation: Резервні копії системи можуть бути передані на альтернативні сховища в електронному вигляді або
      на фізичному носії інформації.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:cp-9.6
    ref_id: CP-9(6)
    name: Резервне копіювання — Надлишкова вторинна система
    category: technical
    csf_function: protect
    description: Виконати резервне копіювання системи, підтримуючи надлишкову вторинну систему, яка не пов’язана
      з первинною системою та яку можна активувати без втрати інформації або порушення роботи.
    annotation: Резервного копіювання системи можна досягти шляхом підтримки резервної вторинної системи, яка відображає
      первинну систему, включаючи реплікацію інформації. Якщо існує такий тип резервування та існує достатнє територіальне
      відокремлення між двома системами, вторинна система також може служити альтернативним місцем обробки.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:cp-9.7
    ref_id: CP-9(7)
    name: Резервне копіювання — Подвійна авторизація
    category: technical
    csf_function: protect
    description: 'Використовувати подвійну авторизацію для видалення або знищення [Призначення: визначених організацією
      резервних копій інформації].


      Параметри:

      1. Призначення: визначених організацією резервних копій інформації'
    annotation: Подвійна авторизація забезпечує, щоб видалення резервних копій було можливе лише в тому разі, якщо
      двоє уповноважених осіб схвалили таке рішення (базуючись на тому, що воно відображає організаційну політику
      щодо резервного копіювання). Особи, які видаляють або знищують резервну копію інформації, володіють навичками
      або досвідом, щоб визначити, чи запропоноване видалення або знищення інформації відображає політику та процедури
      організації. Щоб зменшити ризик змови, організації розглядають можливість передачі подвійних повноважень різним
      особам.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:cp-9.8
    ref_id: CP-9(8)
    name: Резервне копіювання — Криптографічний захист
    category: technical
    csf_function: protect
    description: 'Впровадити криптографічні механізми для запобігання несанкціонованому розкриттю та змінам [Призначення:
      визначених організацією резервних копій інформації].


      Параметри:

      1. Призначення: визначених організацією резервних копій інформації'
    annotation: Вибір криптографічних механізмів ґрунтується на необхідності захисту конфіденційності та цілісності
      резервної інформації. Надійність механізму має відповідати категорії безпеки та/або класифікації інформації.
      Це посилення заходу застосовується до резервної інформації системи в основних та альтернативних сховищах.
      Якщо організація впровадила механізми криптографічного захисту, додатково мають бути забезпечені надійні механізми
      управління криптографічними ключами.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:cp-10
    ref_id: CP-10
    name: Відновлення та відтворення системи
    category: technical
    csf_function: recover
    description: 'Забезпечити відновлення та відтворення системи до відомого стану після збою, компрометації або
      помилок у межах [Призначення: визначеного організацією періоду часу, відповідного часу відновлення та встановлених
      цілей відновлення].


      Параметри:

      1. Призначення: визначеного організацією періоду часу, відповідного часу відновлення та встановлених цілей
      відновлення'
    annotation: Відновлення — це виконання плану дій щодо забезпечення безперервної роботи та відновлення функціонування
      систем. Відтворення відбувається після відновлення і містить заходи щодо повернення систем до повноцінного
      функціонування. Операції з відновлення та відтворення відображають пріоритети діяльності, час і цілі відновлення
      та відтворення показників, що відповідають вимогам плану забезпечення безперервної роботи та відновлення функціонування.
      Відтворення передбачає деактивацію будь-яких тимчасових можливостей системи, які, можливо, були необхідні
      для відновлення. Відтворення також охоплює оцінювання повністю відновлених можливостей системи, відновлення
      безперервної моніторингової діяльності та заходів з підготовки систем до подальших можливих збоїв, порушень
      або компрометації. Процедури відновлення та відтворення можуть містити як ручні, так і автоматизовані механізми.
      Організації встановлюють час відновлення та цілі відновлення як частини планування на випадок надзвичайних
      ситуацій.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:cp-10.1
    ref_id: CP-10(1)
    name: Відновлення та відтворення системи — Тестування плану забезпечення безперервної роботи та відновлення
      функціонування
    category: technical
    csf_function: recover
    description: 'Вилучено: Включено до CP-4'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:cp-10.2
    ref_id: CP-10(2)
    name: Відновлення та відтворення системи - відновлення транзакцій
    category: technical
    csf_function: recover
    description: Реалізувати відновлення транзакцій для систем, що базуються на транзакціях.
    annotation: До систем, що базуються на транзакціях, належать системи управління базами даних і системи оброблення
      транзакцій. Механізми відновлення транзакцій можуть містити ведення журналу транзакцій з можливістю відкату.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:cp-10.3
    ref_id: CP-10(3)
    name: Відновлення та відтворення заходи захисту
    category: technical
    csf_function: recover
    description: 'Вилучено: Переадресовано через процедури адаптації'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:cp-10.4
    ref_id: CP-10(4)
    name: Відновлення та відтворення системи — Відновлення в межах часового періоду
    category: technical
    csf_function: recover
    description: 'Забезпечити можливість відновлення компонентів системи в межах [Призначення: визначеного організацією
      періоду відновлення] з інформації управління конфігурацією та захищеною цілісністю, яка описує відомий робочий
      стан компонентів.


      Параметри:

      1. Призначення: визначеного організацією періоду відновлення'
    annotation: Відновлення компонентів системи охоплює, наприклад, повернення компонентів до відомих, операційних
      станів.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:cp-10.5
    ref_id: CP-10(5)
    name: Відновлення та відтворення системи - здатність відмовостійкості
    category: technical
    csf_function: recover
    description: 'Вилучено: Включено до SI-13'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:cp-10.6
    ref_id: CP-10(6)
    name: Відновлення та відтворення системи — Захист компоненту
    category: technical
    csf_function: recover
    description: Забезпечити захист компонентів системи, які використовуються для резервного копіювання та відновлення.
    annotation: Захист компонентів резервного копіювання та відновлення системи (апаратне та програмне забезпечення)
      передбачає використання як фізичних, так і технічних засобів. До програмного забезпечення для резервного копіювання
      та відновлення належать, наприклад, таблиці маршрутизаторів, компілятори й інше системне програмне забезпечення,
      що стосується безпеки.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:cp-11
    ref_id: CP-11
    name: Альтернативні протоколи зв’язку
    category: technical
    csf_function: recover
    description: 'Забезпечити можливість застосування [Призначення: визначені організацією альтернативні протоколи
      зв’язку] для підтримки збереження безперервності функціонування.


      Параметри:

      1. Призначення: визначені організацією альтернативні протоколи зв’язку'
    annotation: Плани забезпечення безперервної роботи та відновлення функціонування та навчання/тестування, що
      пов’язані з цими планами, мають забезпечувати можливість застосування альтернативного протоколу зв’язку як
      частину встановлення стійкості систем організації. Переключення протоколів зв’язку може впливати на програми
      та операційні аспекти систем. Організація має проводити оцінювання потенційних побічних ефектів впровадження
      таких альтернативних протоколів зв’язку.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:cp-12
    ref_id: CP-12
    name: Безпечний режим
    category: technical
    csf_function: protect
    description: 'Коли виявлено [Призначення: визначені організацією умови], організація вводить безпечний режим
      роботи з [Призначення: визначеними організацією обмеженнями в безпечному режимі роботи].


      Параметри:

      1. Призначення: визначені організацією умови

      2. Призначення: визначеними організацією обмеженнями в безпечному режимі роботи'
    annotation: Для систем, що підтримують критичні функції та завдання (наприклад, військові операції та системи
      озброєння, цивільні космічні операції, операції на АЕС та операції з контролю повітряного простору), організації
      можуть визначити певні умови, за яких ці системи повертаються до попередньо визначеного безпечного режиму
      роботи. Безпечний режим роботи, який можна активувати автоматично або вручну, обмежує діяльність (тобто, системи
      можуть функціонувати лише при дотриманні цих умов). До таких обмежень можуть належати, наприклад, виконання
      лише певних функцій, які можна виконувати з обмеженою потужністю або зі зменшеною пропускною здатністю.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:cp-13
    ref_id: CP-13
    name: Альтернативні механізми безпеки
    category: technical
    csf_function: recover
    description: 'Використовуйте [Призначення: визначені організацією альтернативні або додаткові механізми безпеки]
      для реалізації [Призначення: визначених організацією функцій безпеки], коли основні засоби реалізації функцій
      безпеки недоступні або скомпрометовані.


      Параметри:

      1. Призначення: визначені організацією альтернативні або додаткові механізми безпеки

      2. Призначення: визначених організацією функцій безпеки'
    annotation: 'Для забезпечення цілей і завдань організації, а також


      безперервності діяльності організації можуть впроваджуватися альтернативні або додаткові механізми безпеки.
      Ці механізми можуть бути менш ефективними, ніж основні механізми. Однак, маючи можливість легко використовувати
      ці альтернативні або додаткові механізми, організація підвищує гарантії безперервності. Зважаючи на вартість
      і рівень зусиль, необхідних для надання таких альтернативних механізмів безпеки, цей захід безпеки зазвичай
      застосовується лише в критичних системах чи компонентах системи. Наприклад, організація може видати одноразові
      блокноти старшому керівництву, посадовцям і системним адміністраторам, якщо зламано багатофакторні маркери
      — стандартний засіб для досягнення безпечної автентифікації.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ia-1
    ref_id: IA-1
    name: Політика та процедури ідентифікації та автентифікації
    category: policy
    csf_function: protect
    description: "a. Розробити, задокументувати та поширити [Призначення: серед визначеного організацією персоналу\
      \ або посадових осіб]:\n1. [Вибір (один або декілька): Рівень організації; Рівень місії/бізнеспроцесу; рівень\
      \ системи] політики ідентифікації та автентифікації, яка:\n\t(a) містить мету, сферу застосування, ролі, обов’язки,\
      \ відповідальність керівництва, координацію між організаційними підрозділами та систему контролю відповідності\
      \ (complaince);\n\t(b) відповідає чинному законодавству, виконавчим розпорядженням, директивам, положенням,\
      \ політиці, стандартам і керівним принципам;\n\n2. процедури, що спрямовані на реалізацію політики ідентифікації\
      \ та автентифікації і пов’язаних з ними заходів ідентифікації та перевірки автентичності.\n\nb. Призначити\
      \ [Призначення: визначену організацією посадову особу] для управління політикою та процедурами ідентифікації\
      \ та автентифікації.\nc. Переглянути та оновити поточну політику ідентифікації та автентифікації:\n1. політика\
      \ [Призначення: з визначеною організацією частотою] і наступні [Призначення: події, визначені організацією];\n\
      2. процедури [Призначення: з визначеною організацією частотою] і наступні [Призначення: події, визначені організацією].\n\
      \nПараметри:\n1. Призначення: серед визначеного організацією персоналу або посадових осіб\n2. Вибір (один\
      \ або декілька): Рівень організації; Рівень місії/бізнеспроцесу; рівень системи\n3. Призначення: визначену\
      \ організацією посадову особу\n4. Призначення: з визначеною організацією частотою\n5. Призначення: події,\
      \ визначені організацією"
    annotation: Цей захід захисту стосується встановлення політики та процедур для ефективного здійснення заходів
      та їх посилень у класі IA. Стратегія управління ризиками є важливим фактором у встановленні політики та процедур.
      Комплексна політика та процедури допомагають забезпечити безпеку та приватність. За наявності політики, а
      також планів захисту інформації та персональних даних на рівні організації, конкретні системні політики та
      процедури можуть бути не потрібні. Політика може бути внесена до складу загальної політики безпеки та приватності
      або може бути представлена кількома політиками (у випадках складної архітектури). Процедури описують, як має
      реалізуватися політика чи заходи захисту, та можуть бути спрямовані на персонал або роль, яка є об’єктом процедури.
      Процедури можуть бути задокументовані в планах захисту інформації та персональних даних (як один або декілька
      документів). Події, які можуть спричинити оновлення політики та процедур ідентифікації та автентифікації,
      включають висновки оцінювання або аудиту, інциденти чи порушення безпеки або зміни у чинних законах, розпорядженнях,
      директивах, постановах, стандартах і вказівках. Просте повторне встановлення засобів захисту не є організаційною
      політикою чи процедурою.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ia-2
    ref_id: IA-2
    name: Ідентифікація та автентифікація (користувачів організації)
    category: technical
    csf_function: protect
    description: Унікально ідентифікувати та автентифікувати користувачів або процеси, що діють від імені користувачів.
    annotation: 'Організації можуть задовольнити вимоги щодо ідентифікації та автентифікації, дотримуючись вимог
      [HSPD 12]. До користувачів організації належать працівники або особи, які за своїм статусом прирівнюються
      до них, включно з, наприклад, підрядниками та зовнішніми дослідниками. Цей захід безпеки застосовується до
      всіх доступів: тих, які явно визначені в AC-14 і які регулюються використанням групових автентифікаторів без
      індивідуальної автентифікації. Організації можуть вимагати унікальної ідентифікації осіб у групових облікових
      записах для детальної підзвітності індивідуальної діяльності. Для автентифікації можуть використовувати паролі,
      фізичні автентифікатори, біометричні дані або їх комбінацію (для організації багатофакторної автентифікації).
      Доступ до систем організації може бути локальним або мережевим. Локальний доступ — це будь-який доступ до
      систем організації, коли він здійснюється через прямі з’єднання без використання мереж. Мережевий доступ —
      це доступ до систем організації з використанням мережевих з’єднань. Віддалений доступ — це тип мережевого
      доступу, який передбачає використання зовнішніх мереж. До внутрішніх мереж належать локальні мережі. Використання
      зашифрованих віртуальних приватних мереж для мережевих з’єднань між контрольованими організацією кінцевими
      точками та неорганізованими кінцевими точками може трактуватися як внутрішні мережі. Вимоги до ідентифікації
      та автентифікації для користувачів, які не належать до організації, описані в IA-8.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ia-2.1
    ref_id: IA-2(1)
    name: Ідентифікація та автентифікація (користувачів організації) багатофакторна автентифікація привілейованих
      облікових записів
    category: technical
    csf_function: protect
    description: Реалізувати багатофакторну автентифікацію для доступу до привілейованих облікових записів.
    annotation: 'Багатофакторна автентифікація передбачає використання двох або більше різних факторів для успішного
      проходження процедури автентифікації. Фактори визначаються на декількох рівнях: щось, що відомо користувачу
      (наприклад, пароль або особистий ідентифікаційний номер (PIN)); щось, що є в користувача (наприклад, фізичний
      автентифікатор); щось, чим володіє користувач (наприклад, біометричні дані). До фізичних автентифікаторів
      належать, наприклад, апаратні автентифікатори, смарткарти, затвердженні чинним законодавством електронні посвідчення
      особистості (електронні паспорти). Крім автентифікації користувачів на системному рівні (тобто при вході),
      організації можуть також використовувати механізми автентифікації на рівні застосунків для забезпечення підвищеної
      безпеки. Незалежно від типу доступу (локального, мережевого або віддаленого) привілейовані облікові записи
      мають завжди проходити процедуру багатофакторної автентифікації. Організації можуть вживати додаткові заходи
      безпеки (наприклад, більш жорсткі механізми автентифікації) для конкретних типів доступу.'
