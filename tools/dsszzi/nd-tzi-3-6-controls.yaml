    annotation: Метадані — це службова інформація, яка використовується для опису характеристик даних. Метадані
      можуть бути структурними (описують структури даних) або загальними (описують вміст даних). Впровадження дозволених
      потоків інформації на основі метаданих дозволяє реалізувати простіше й ефективніше управління. Метадані мають
      бути проаналізовані щодо точності (значення метаданих є правильними щодо даних), цілісності (захист від несанкціонованих
      змін тегів метаданих) та прив’язки метаданих до корисного навантаження даних (тобто забезпечення методів зв’язування
      з відповідним рівнем упевненості).
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ac-4.7
    ref_id: AC-4(7)
    name: Управління інформаційними потоками — Механізми одностороннього потоку
    category: technical
    csf_function: protect
    description: 'Впровадити [Призначення: визначені організацією односторонні інформаційні потоки] за допомогою
