      сеансів зв’язку, що намагаються передавати зашифровану інформацію; [Призначення: визначеними організацією
      процедурою або методом]'
    annotation: 'Механізмами управління можуть бути: перевірка вмісту, фільтри, політики безпеки та ідентифікатори
      типів даних.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ac-4.5
    ref_id: AC-4(5)
    name: Управління інформаційними потоками — Вбудовування типів даних
    category: technical
    csf_function: protect
    description: 'Впровадити [Призначення: визначені організацією обмеження] для вбудовування типів даних в інші
