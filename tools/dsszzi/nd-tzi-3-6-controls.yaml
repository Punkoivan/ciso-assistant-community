      операції, що деградують під час функціонування системи в позаштатному режимі. Необхідно врахувати, що заходи,
      пов’язані із захистом робочого середовища, повинні бути впроваджені при функціонуванні системи в позаштатному
      режимі. При плануванні ресурсів слід враховувати результати аналізу ризиків, категоризації системи (рівень
      впливу) та організаційній толерантності до ризику.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:cp-2.3
