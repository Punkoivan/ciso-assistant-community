  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:sa-8
    ref_id: SA-8
    name: Безпека та приватність принципів інжинірингу
    category: technical
    csf_function: protect
    description: 'Застосовувати [Призначення: визначені організацією принципи інжинірингу безпеки та конфіденційності системи]
      в специфікації, проєктуванні, розробці, впровадженні та зміні системи й компонентів системи.
  
  
  
      Параметри:
  
  
      1. Призначення: визначені організацією принципи інжинірингу безпеки та конфіденційності системи'
    annotation: 'Принципи безпечного проектування систем і конфіденційності тісно пов’язані з життєвим циклом розробки системи
      та впроваджуються протягом усього життєвого циклу розробки (див. SA-3). Організації можуть застосовувати принципи безпечного
      проектування та конфіденційності до нових систем, що розробляються, або до систем, які оновлюються. Для існуючих систем
      організації застосовують принципи безпечного проектування та конфіденційності для оновлення та модифікації системи, з
      урахуванням поточного стану апаратного, програмного забезпечення та мікропрограмних компонентів у цих системах. Застосування
      принципів безпечного проектування і конфіденційності допомагає організаціям розробляти надійні, захищені та стійкі системи
      та зменшує сприйнятливість до збоїв, небезпеки, загроз та проблем конфіденційності для окремих осіб. Приклади принципів
      безпечного проектування системи включають: розробку багаторівневих засобів захисту; створення політики безпеки та конфіденційності,
      архітектури та елементів керування як основи для проектування та розробки; включення вимог безпеки та конфіденційності
      до життєвого циклу розробки системи; окреслення фізичних і логічних кордонів безпеки; забезпечення навчання розробників
      створенню безпечного програмного забезпечення; адаптація засобів контролю відповідно до потреб організації; і виконання
      моделювання загроз для визначення випадків використання, агентів загроз, векторів і шаблонів атак, шаблонів проектування
      та компенсаційного контролю, необхідного для зменшення ризику. Організації, які застосовують інженерні принципи безпечного
      проектування та конфіденційності, можуть сприяти розробці надійних, безпечних систем, компонентів системи і послуг для
      системи; знизити ризик до прийнятного рівня; і приймати обґрунтовані рішення щодо управління ризиками. Принципи безпечного
      проектування системи також можна використовувати для захисту від певних ризиків ланцюга постачання та включати в конструкцію
      апаратного забезпечення, захищеного від несанкціонованого втручання.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:sa-8.1
    ref_id: SA-8(1)
    name: Безпека та приватність принципів інжинірингу — Чітка абстракція
    category: technical
    csf_function: protect
    description: Реалізуйте принцип проектування безпеки чітких абстракцій.
    annotation: Принцип чітких абстракцій — це принцип, за якого система має прості, чітко визначені інтерфейси та функції,
      які забезпечують узгоджене та інтуїтивно зрозуміле уявлення про дані та способи керування ними. Зрозумілість, простота,
      необхідність і достатність інтерфейсів системи у поєднанні з точним визначенням їхньої функціональної поведінки — сприяє
      легкому аналізу, перевірці та тестуванню, а також правильному та безпечному використанню системи. Чіткість абстракції
      суб'єктивна. Приклади, які відображають застосування цього принципу, включають уникнення надлишкових інтерфейсів, які
      не використовуються; приховування інформації; і уникнення семантичного перевантаження інтерфейсів або їх параметрів. Приховування
      інформації (тобто незалежне від представлення програмування) — це тип проектування, який використовується для забезпечення
      того, щоб внутрішнє представлення інформації в одному системному компоненті не було видимим для іншого системного компонента,
      який викликає перший компонент, таким чином, щоб опублікована абстракція не впливала на те, як даними можна керувати всередині.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:sa-8.2
    ref_id: SA-8(2)
    name: Безпека та приватність принципів інжинірингу — Найменш поширений механізм
    category: technical
    csf_function: protect
    description: 'Реалізація принципу проектування безпеки найменш поширеного механізму в [Призначення: визначені організацією
      системи або компоненти системи]
  
  
  
      Параметри:
  
  
      1. Призначення: визначені організацією системи або компоненти системи'
    annotation: Принцип найменш поширеного механізму стверджує, що кількість механізмів, спільних для кількох користувачів і
      від яких залежать усі користувачі, зведена до мінімуму. Мінімізація механізму передбачає, що різні компоненти системи
      не використовують один ітой самий механізм для доступу до системного ресурсу. Кожен спільний механізм (особливо механізм,
      що включає спільні змінні) відображає потенційний інформаційний шлях між користувачами і має бути ретельно розроблений,
      щоб гарантувати, що він ненавмисно не порушить безпеку. Реалізація принципу найменш спільного механізму допомагає зменшити
      несприятливі наслідки спільного використання стану системи різними програмами. Одна програма, яка пошкоджує спільний стан
      (включаючи спільні змінні), потенційно може пошкодити інші програми, які залежать від цього стану. Принцип найменш загального
      механізму також підтримує принцип простоти конструкції та вирішує проблему прихованих каналів зберігання [LAMPSON73]
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:sa-8.3
    ref_id: SA-8(3)
    name: Безпека та приватність принципів інжинірингу — Модульність і багаторівневість
    category: technical
    csf_function: protect
    description: 'Запровадити принципи проектування безпеки модульності та багаторівневості в [Призначення: визначені організацією
      системи або системні компоненти].
  
  
  
      Параметри:
  
  
      1. Призначення: визначені організацією системи або системні компоненти'
    annotation: Принципи модульності та багаторівневості є основоположними для системної інженерії. Модульність і багаторівневість,
      отримані в результаті функціональної декомпозиції, ефективні в управлінні складною системою, оскільки дозволяють зрозуміти
      структуру системи. Модульна декомпозиція, або вдосконалення дизайну системи, є складним завданням і суперечить загальним
      принциповим положенням. Модульність служить для ізоляції функцій і пов’язаних структур даних у чітко визначені логічні
      одиниці. Розподіл системи на рівні дозволяє краще зрозуміти взаємозв'язки цих одиниць, щоб залежності були чіткими та
      можна було уникнути небажаної складності. Принцип модульності проектування безпеки розширює функціональну модульність,
      щоб включити міркування, засновані на довірі, надійності, привілеях і політиці безпеки. Модульна декомпозиція з урахуванням
      безпеки включає розподіл політик системам у мережі, поділ програм системи на процеси з окремими адресними просторами,
      розподіл політик системи на рівні та поділ процесів на суб’єкти з різними привілеями на основі доменних привілеїв, що
      підтримуються апаратним забезпеченням.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:sa-8.4
    ref_id: SA-8(4)
    name: Безпека та приватність принципів інжинірингу — Частково впорядковані залежності
    category: technical
    csf_function: protect
    description: 'Запровадити принцип проектування безпеки частково впорядкованих залежностей у [Призначення: визначені організацією
      системи або системні компоненти].
  
  
  
      Параметри:
  
  
      1. Призначення: визначені організацією системи або системні компоненти'
    annotation: Принцип частково впорядкованих залежностей стверджує, що синхронізація, виклики та інші залежності в системі
      є частково впорядкованими. Фундаментальною концепцією проектування системи є багаторівневість, за допомогою якої система
      організована в чітко визначені, функціонально пов’язані модулі або компоненти. Рівні лінійно впорядковані щодо міжрівневих
      залежностей, так що вищі рівні залежать від нижчих. Забезпечуючи функціональні можливості для вищих рівнів, деякі рівні
      можуть бути самодостатніми та не залежати від нижчих рівнів. Хоча часткове впорядкування всіх функцій у даній системі
      може бути неможливим, якщо циклічні залежності обмежені для виникнення в межах рівнів, властивими проблемами циклізму
      можна легше керувати. Частково впорядковані залежності та рівневість системи значно сприяють простоті та узгодженості
      дизайну системи та полегшують тестування і аналіз системи.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:sa-8.5
    ref_id: SA-8(5)
    name: Безпека та приватність принципів інжинірингу — Ефективний опосередкований доступ
    category: technical
    csf_function: protect
    description: 'Реалізація принципу проектування безпеки ефективного опосередкованого доступу в [Призначення: системи, визначені
      організацією, або системні компоненти].
  
  
  
      Параметри:
  
  
      1. Призначення: системи, визначені організацією, або системні компоненти'
    annotation: Принцип ефективного опосередкованого доступу стверджує, що механізми забезпечення виконання політики використовують
      найменш поширений доступний механізм, задовольняючи вимоги зацікавлених сторін у межах визначених обмежень. Проміжний
      доступ до ресурсів системи (тобто ЦП, пам’яті, пристроїв, комунікаційних портів, послуг, інфраструктури, даних та інформації)
      часто є домінуючою функцією безпеки захищених систем. Це також дозволяє реалізувати захист можливостей, наданих системою
      зацікавленим сторонам. Проміжний доступ до ресурсів може призвести до обмеженої пропускної здатності в певних місцях системи,
      якщо вона спроектована неправильно. Наприклад, за допомогою апаратних механізмів можна досягти ефективного проміжного
      доступу. Після отримання доступу до низькорівневого ресурсу, такого як пам’ять, апаратні механізми захисту можуть гарантувати,
      що доступ поза межами не відбудеться.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:sa-8.6
    ref_id: SA-8(6)
    name: Безпека та приватність принципів інжинірингу — Мінімізований обмін
    category: technical
    csf_function: protect
    description: 'Запровадити принцип проектування безпеки з мінімальним спільним використанням у [Призначення: визначені організацією
      системи або компоненти системи].
  
  
  
      Параметри:
  
  
      1. Призначення: визначені організацією системи або компоненти системи'
    annotation: Принцип мінільного спільного використання стверджує, що жоден комп’ютерний ресурс не використовується спільно
      між системними компонентами (наприклад, суб’єктами, процесами, функціями), якщо це не є абсолютно необхідною умовою. Мінімальний
      спільний доступ допомагає спростити проектування та впровадження системи. Щоб захистити ресурси домену користувача від
      довільних активних об’єктів, жоден ресурс не надається спільно, якщо цей спільний доступ не було явно запитано та надано.
      Необхідність спільного використання ресурсів може бути мотивована принципом розробки найменш загального механізму у випадку
      внутрішніх організацій або керована вимогами зацікавлених сторін. Однак внутрішній спільний доступ має бути ретельно розроблений
      для уникнення проблем із продуктивністю, прихованим зберіганням і синхронізацією. Спільний доступ за допомогою загального
      механізму може збільшити вразливість даних та інформації для неавторизованого доступу, розголошення, використання або
      модифікації та може негативно вплинути на внутрішні можливості системи. Щоб звести до мінімуму обмін, викликаний загальними
      механізмами, такі механізми можуть бути спроектовані з повторним входом або віртуалізацією для збереження розділення.
      Крім того, ретельно перевіряється використання глобальних даних для обміну інформацією. Відсутність інкапсуляції може
      заплутати зв’язки між об’єктами спільного використання.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:sa-8.7
    ref_id: SA-8(7)
    name: Безпека та приватність принципів інжинірингу — Знижена складність
    category: technical
    csf_function: protect
    description: 'Запровадити принцип проектування безпеки зі зниженою складністю в [Призначення: визначені організацією системи
      або компоненти системи].
  
  
  
      Параметри:
  
  
      1. Призначення: визначені організацією системи або компоненти системи'
    annotation: Принцип зниженої складності стверджує, що дизайн системи є максимально простим і малим. Невеликий і простий
      дизайн є зрозумілим, краще піддається аналізу та менш схильний до помилок. Принцип зменшеної складності застосовується
      до будь-якого аспекту системи, але він має особливе значення для безпеки через різноманітні аналізи, які виконуються для
      отримання доказів щодо нових властивостей безпеки системи. Застосування принципу зниженої складності сприяє здатності
      розробників системи розуміти правильність і повноту функцій безпеки системи. Це також полегшує ідентифікацію потенційних
      вразливостей. Простота системи безпосередньо пов’язана з кількістю вразливостей, які вона міститиме; тобто простіші системи
      містять менше вразливостей. Перевага від зменшення складності полягає в тому, що легше зрозуміти, чи запланована політика
      безпеки була зафіксована в проекті системи, і що менше вразливостей, ймовірно, буде включено під час інженерного проектування
      системи. Додатковою перевагою є те, що будь-який такий висновок щодо правильності, повноти та наявності вразливостей можна
      зробити з вищим ступенем упевненості на відміну від висновків, зроблених у ситуаціях, коли дизайн системи складний. Перехід
      від старих до новіших технологій (наприклад, перехід від IPv4 до IPv6) може потребувати впровадження старішої та новішої
      технологій одночасно протягом перехідного періоду, що призводить до тимчасового збільшення складності системи під час
      такого переходу.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:sa-8.8
    ref_id: SA-8(8)
    name: Безпека та приватність принципів інжинірингу — Еволюція безпеки в системі
    category: technical
    csf_function: protect
    description: 'Реалізація принципу еволюції безпеки в [Призначення: визначені організацією системи або компоненти системи].
  
  
  
      Параметри:
  
  
      1. Призначення: визначені організацією системи або компоненти системи'
    annotation: Принцип еволюції безпеки стверджує, що система розроблена для сприяння підтримці її властивостей безпеки, коли
      відбуваються зміни в структурі системи, інтерфейсах, взаємозв’язках (тобто архітектурі системи), функціональності або
      конфігурації (тобто застосуванні політики безпеки). Зміни включають нову, розширену або оновлену системну здатність; діяльність
      з технічного обслуговування та підтримки; і реконфігурацію. Хоча неможливо спланувати кожен аспект еволюції системи, оновлення
      та зміни системи можна передбачити шляхом аналізу місії чи стратегічного напрямку бізнесу, очікуваних змін у середовищі
      загроз та очікуваних потреб в обслуговуванні та підтримці. Нереалістично очікувати, що складні системи залишатимуться
      безпечними у ситуаціях, не передбачених під час розробки, незалежно від того, пов’язані такі ситуації з робочим середовищем
      чи використанням. Система може бути безпечною в деяких нових ситуаціях, але немає гарантії, що її поведінка завжди буде
      безпечною. Легше вбудувати надійність у систему з самого початку, і з цього випливає, що підтримка надійності системи
      вимагає планування змін, а не адаптації у випадковий або неметодичний спосіб. Переваги цього принципу включають зниження
      витрат постачальника протягом життєвого циклу, зниження права власності, покращення безпеки системи, більш ефективне управління
      ризиками безпеки та меншу невизначеність ризику.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:sa-8.9
    ref_id: SA-8(9)
    name: Безпека та приватність принципів інжинірингу — Довірені компоненти системи
    category: technical
    csf_function: protect
    description: 'Запровадити принцип проектування довірених компонентів у [Призначення: системи, визначені організацією, або
      системні компоненти].
  
  
  
      Параметри:
  
  
      1. Призначення: системи, визначені організацією, або системні компоненти'
    annotation: Принцип довірених компонентів стверджує, що компонент заслуговує довіри принаймні до рівня, співмірного із залежностями
      безпеки, які він підтримує (тобто, наскільки йому довіряють виконувати свої функції безпеки іншими компонентами). Цей
      принцип дозволяє створити таку композицію компонентів, щоб надійність не була випадково знижена, і довіра, як наслідок,
      не була втрачена. Зрештою, цей принцип вимагає певної метрики, за допомогою якої можна виміряти довіру до компонента та
      надійність компонента в одній абстрактній шкалі. Принцип довірених компонентів особливо актуальний при розгляді систем
      і компонентів, у яких існують складні ланцюги довірчих залежностей. Довірчу залежність також називають довірчими відносинами,
      і можуть існувати ланцюги довірчих відносин. Принцип довірених компонентів також застосовується до складного компонента,
      який складається з підкомпонентів (наприклад, підсистеми), які можуть мати різні рівні надійності. Припущення полягає
      в тому, що надійність складеного компонента є надійністю його найменш надійного субкомпонента. Можна припустити, що надійність
      конкретного складеного компонента є вищою, ніж ми припускаємо. Однак будь-яке таке обґрунтування відображає логічне міркування,
      засноване на чіткому формулюванні цілей надійності, а також на відповідних і достовірних доказах. Надійність складного
      компонента – це не те саме, що посилене застосування поглибленого захисту всередині компонента або реплікація компонентів.
      Методи глибокого захисту не підвищують достовірність цілого вище ніж найменш надійний компонент.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:sa-8.10
    ref_id: SA-8(10)
    name: Безпека та приватність принципів інжинірингу — Ієрархічна довіра
    category: technical
    csf_function: protect
    description: 'Запровадити принцип ієрархічної довіри в системі [Призначення: визначені організацією системи або компоненти
      системи].
  
  
  
      Параметри:
  
  
      1. Призначення: визначені організацією системи або компоненти системи'
    annotation: Принцип ієрархічної довіри для компонентів базується на принципі довірених компонентів і стверджує, що залежності
      безпеки в системі створюватимуть частковий порядок, якщо вони зберігають принцип довірених компонентів. Часткове впорядкування
      забезпечує основу для обґрунтування надійності або гарантійного випадку (аргумент гарантії) при створенні безпечної системи
      з неоднорідно надійних компонентів. Для аналізу надійності системи, що складається з неоднорідно надійних компонентів,
      важливо усунути циклічні залежності щодо надійності. Якби більш надійний компонент, розташований на нижчому рівні системи,
      залежав би від менш надійного компонента на вищому рівні, це фактично помістило б компоненти в той самий «менш надійний»
      клас еквівалентності відповідно до принципу надійних компонентів. Довірчі відносини, або ланцюги довіри, можуть мати різні
      прояви. Наприклад, кореневий сертифікат ієрархії сертифікатів є найбільш надійним вузлом в ієрархії, тоді як листи в ієрархії
      можуть бути найменш надійними вузлами. Іншим прикладом є багаторівнева система високого рівня надійності, де ядро безпеки
      (включаючи апаратну базу), розташоване на найнижчому рівні системи, є найбільш надійним компонентом. Однак принцип ієрархічної
      довіри не забороняє використання надто надійних компонентів. У системі з низьким рівнем надійності можуть бути випадки,
      коли доцільно використовувати високонадійний компонент, а не менш надійний (наприклад, через доступність або інший фактор
      співвідношення витрат і вигод). У такому випадку будь-яка залежність високонадійного компонента від менш надійного компонента
      не погіршує надійність отриманої системи з низьким рівнем довіри.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:sa-8.11
    ref_id: SA-8(11)
    name: Безпека та приватність принципів інжинірингу — Зворотній поріг модифікації
    category: technical
