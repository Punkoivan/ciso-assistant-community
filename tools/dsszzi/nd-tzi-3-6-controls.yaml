  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:sa-20
    ref_id: SA-20
    name: Індивідуальна розробка критичних компонентів
    category: process
    csf_function: protect
    description: 'Повторно реалізувати або налаштувати [Призначення: визначені організацією критичні компоненти системи].
  
  
  
      Параметри:
  
  
      1. Призначення: визначені організацією критичні компоненти системи'
    annotation: Організації визначають, що певним компонентам системи, ймовірно, не можна довіряти через загрози та вразливі
      місця в них, та для яких неможливо впровадити життєздатних заходи захисту для належного зменшення ризику. Повторна реалізація
      або спеціальна розробка таких компонентів може задовольнити вимоги щодо вищої впевненості та здійснюється шляхом ініціювання
      змін компонентів системи (включаючи апаратне, програмне та мікропрограмне забезпечення) для зменшення вірогідності стандартних
      атак зловмисників. У ситуаціях, коли альтернативне джерело не доступне, а організації вирішують не перевпроваджувати чи
      не розробляти на замовлення критичні компоненти системи, можна застосувати додаткові заходи захисту. Контроль включає
      розширений аудит, обмеження доступу до вихідного коду та утиліт системи, а також захист від видалення файлів системи та
      програм.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:sa-21
    ref_id: SA-21
    name: Перевірка розробника
    category: process
    csf_function: protect
    description: 'Вимагати, щоб розробник [Призначення: визначених організацією системи, компонент системи або послуги]:
  
      a. мав відповідні дозволи доступу, як визначено призначеним [Призначення: визначеним організацією уповноваженим органом];
  
      b. відповідає таким додатковим критеріям перевірки персоналу: [Призначення: визначені організацією додаткові критерії
      перевірки персоналу].
  
  
  
      Параметри:
  
  
      1. Призначення: визначених організацією системи, компонент системи або послуги
  
  
      2. Призначення: визначеним організацією уповноваженим органом
  
  
      3. Призначення: визначені організацією додаткові критерії перевірки персоналу'
    annotation: Перевірка здійснюється щодо зовнішніх розробників. Внутрішня перевірка розробників регулюється PS-3. Оскільки
      система, компонент системи або системна служба можуть використовуватися в критично важливих діях, важливих для інтересів
      національної або економічної безпеки України , організації зацікавлені в тому, щоб розробники заслуговували на довіру.
      Ступінь довіри, який вимагається від розробників, може відповідати рівню довіри осіб, які отримують доступ до систем,
      компонентів системи або послуг для системи після розгортання. Критерії авторизації та перевірки персоналу включають допуски,
      перевірку репутації, громадянство та національність. Надійність розробника також може включати перевірку та аналіз власності
      компанії та відносин, які компанія має з організаціями, які потенційно можуть вплинути на якість і надійність систем,
      компонентів або послуг, що розробляються. Виконання необхідних критеріїв авторизації доступу та перевірки персоналу включає
      надання списку всіх осіб, які мають право виконувати дії з розробки у вибраній системі, системному компоненті чи службі,
      щоб організації могли підтвердити, що розробник задовольнив вимоги авторизації та перевірки.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:sa-21.1
    ref_id: SA-21(1)
    name: Скринінг розробника — Перевірка скринінгу
