  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ia-2.6
    ref_id: IA-2(6)
    name: Ідентифікація та автентифікація (користувачів організації) мережевий доступ до привілейованих облікових
      записів — Окремий пристрій
    category: technical
    csf_function: protect
    description: 'Реалізація багатофакторної автентифікації для [Вибір (один або кілька): локальний; мережевий;
      віддалений] доступ до [Вибір (один або кілька): привілейовані облікові записи; непривілейовані облікові записи]
      такі, що:

      a) Один із факторів забезпечується пристроєм, окремим від системи, який отримує доступ;

      b) Пристрій відповідає [Призначення: визначені організацією вимоги до міцності механізму].


      Параметри:

      1. Вибір (один або кілька): локальний; мережевий; віддалений

      2. Вибір (один або кілька): привілейовані облікові записи; непривілейовані облікові записи

      3. Призначення: визначені організацією вимоги до міцності механізму'
    annotation: Метою багатофакторної автентифікації для окремого пристрою, який використовує користувач, є зменшення
      ймовірності компрометації автентифікаторів або облікових даних, що зберігаються в системі. Зловмисники можуть
      отримати доступ до таких автентифікаторів або облікових даних і згодом видати себе за авторизованих користувачів.
      Реалізація одного з факторів на окремому пристрої (наприклад, апаратний токен) забезпечує більшу міцність
      механізму та підвищений рівень надійності в процесі автентифікації.
