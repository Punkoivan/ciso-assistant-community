      організації ручного управління персоналом має ухвалюватися залежно від конкретних умов функціонування.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ac-4.10
    ref_id: AC-4(10)
    name: Управління інформаційними потоками — Активація та деактивація фільтрів політики безпеки
    category: technical
    csf_function: protect
    description: 'Впровадити можливість для привілейованих адміністраторів активувати та деактивувати [Призначення:
