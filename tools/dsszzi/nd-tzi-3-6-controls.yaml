    annotation: Інформаційні ресурси, до яких користувачі отримують доступ після процедури проходження автентифікації,
      можуть охоплювати локальні робочі станції, бази даних та захищені паролем вебсайти/вебсервіси.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:ac-12.2
    ref_id: AC-12(2)
    name: Припинення сеансу — Повідомлення про припинення сеансу
    category: technical
