      довірчі відносини; а також проведення регулярних, періодичних, позапланових відвідувань об’єктів постачальника послуг.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:sa-9.5
    ref_id: SA-9(5)
