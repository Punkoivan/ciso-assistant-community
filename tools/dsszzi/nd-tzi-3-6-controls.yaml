name: НД ТЗІ 3.6-006-24 — Каталог заходів захисту
description: 'Каталог заходів захисту з НД ТЗІ 3.6-006-24 (український переклад каталогу NIST SP 800-53 rev5). Наразі
  містить родини: AC (Управління доступом), AT (Обізнаність та навчання), AU (Аудит та підзвітність), CA (Оцінювання,
  авторизація та моніторинг), CM (Управління конфігурацією), CP (Планування безперервної роботи), IA (Ідентифікація
  та автентифікація), IR (Реагування на інциденти), MA (Технічне обслуговування), MP (Захист носіїв інформації),
  PE (Фізичний захист і захист робочого середовища), PL (Планування безпеки), PM (Менеджмент інформаційної безпеки),
  PS (Кадрова безпека), RA (Оцінювання ризику), SA (Придбання системи та послуг). Видобуток з офіційного PDF
  — див. tools/dsszzi/README.md.'
