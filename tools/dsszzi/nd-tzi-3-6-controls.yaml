  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:au-3
    ref_id: AU-3
    name: Зміст записів аудиту
    category: technical
    csf_function: protect
    description: 'Переконатися, що записи аудиту містять інформацію, яка встановлює наступне:

      a.     який тип події стався;

      b.     коли відбулася подія;

      c.     де відбулася подія;

      d.     джерело події;

      e.     наслідки події;

      f.     результат події та ідентифікатор будь-яких осіб або суб’єктів, пов’язаних з подією.'
    annotation: 'Зміст записів аудиту, який може бути необхідний для задоволення вимог цього заходу, може містити:
      часові позначки, джерела подій, ідентифікатори користувача або процесу, описи подій, маркери успіху/відмови,
      пов’язані імена файлів і управління доступом або правила управління потоком, що викликаються. Результати подій
      можуть місити маркери успішності чи відмови події та конкретні результати, наприклад стан безпеки та приватності
      системи після події. Організації розглядають, як записи аудиту можуть виявити інформацію про осіб, яка може
      спричинити загрозу конфіденційності, і як найкраще пом’якшити такі ризики. Наприклад, у журналі аудиту існує
      ймовірність виявлення інформації, що дозволяє ідентифікувати особу, особливо якщо журнал записує вхідні дані
      або ґрунтується на моделях чи часу використання.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:au-3.1
    ref_id: AU-3(1)
    name: Зміст записів аудиту — Додаткова інформація про аудит
    category: technical
    csf_function: protect
    description: 'Формувати записи аудиту, що містять наступну додаткову інформацію: [Призначення: визначену організацією
      додаткову, більш детальну інформацію].


      Параметри:

      1. Призначення: визначену організацією додаткову, більш детальну інформацію'
    annotation: 'Реалізація цього посилення заходу безпеки залежить від функціональності системи для налаштування
      змісту записів аудиту. Додаткова інформація, яка може враховуватися в записах аудиту, може містити: повнотекстовий
      запис привілейованих команд або індивідуальні ідентичності користувачів, які належать до групових облікових
      записів. Рішення щодо можливості обмеження додаткової інформації про аудит може бути ухвалено залежно від
      умов функціонування системи. Рішення про невключення до записів і журналів аудиту інформації, яка потенційно
      може ввести в оману чи ускладнити пошук важливої інформації, може полегшити їхнє використання.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:au-3.2
    ref_id: AU-3(2)
    name: Зміст записів аудиту — Централізоване управління планованим змістом записів аудиту
    category: technical
    csf_function: protect
    description: 'Вилучено: Включено до PL-9.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:au-3.3
    ref_id: AU-3(3)
    name: Зміст записів аудиту — Обмеження елементів персональних даних
    category: technical
    csf_function: protect
    description: 'Обмежити персональні дані, що міститься в записах аудиту, до таких елементів, які визначені в
      оцінці ризику приватності: [Призначення: визначені організацією елементи].


      Параметри:

      1. Призначення: визначені організацією елементи'
    annotation: Обмеження персональних даних у записах аудиту (у випадках, коли така інформація не потрібна для
      оперативних цілей) сприяє зниженню рівня ризику порушення приватності.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:au-4
    ref_id: AU-4
    name: Місткість сховища записів аудиту
    category: technical
    csf_function: protect
    description: 'Розподіляти місткість сховища записів аудиту у відповідності до [Призначення: визначених організацією
      вимог до зберігання записів аудиту].


      Параметри:

      1. Призначення: визначених організацією вимог до зберігання записів аудиту'
    annotation: Розгляду підлягають види аудиту, які мають бути проведені, та вимоги щодо процедур аудиту з метою
      обґрунтування місткості сховища для зберігання записів аудиту. Надання достатнього розміру сховища для зберігання
      записів аудиту знижує ймовірність того, що таке сховище буде переповнене, що своєю чергою може призвести до
      потенційної втрати або зниження ефективності аудиту.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:au-4.1
    ref_id: AU-4(1)
    name: Місткість сховища записів аудиту — Передача до альтернативного сховища
    category: technical
    csf_function: protect
    description: 'Проводити передачу записів аудиту [Призначення: з визначеною організацією частотою] в іншу систему
      або носій інформації, відмінний від системи або системного компонента, який веде аудит.


      Параметри:

      1. Призначення: з визначеною організацією частотою'
    annotation: Передача журналу аудиту, також відома як розвантаження, є звичайним процесом у системах з обмеженою
      ємністю для зберігання журналу аудиту та підтримання їх доступності. Початкове сховище журналу аудиту використовується
      лише тимчасово, поки система не зможе зв’язатися з вторинною або альтернативною системою, призначеною для
      зберігання журналу аудиту, після чого журнали аудиту передаються до альтернативного сховища (як в AU-9(2)).
      Однак метою вибору AU-9(2) є захист конфіденційності та цілісності записів аудиту. Організації можуть вибрати
      будь-яке покращення контролю, щоб отримати вигоду від збільшення ємності журналу аудиту та збереження конфіденційності,
      цілісності та доступності записів і журналів аудиту.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:au-5
    ref_id: AU-5
    name: Реагування на відмови обробки даних аудиту
    category: technical
    csf_function: protect
    description: 'a.    Сповіщати [Призначення: визначені організацією персонал або посади] у разі збою обробки
      даних аудиту в [Призначення: визначений організацією період часу].


      b. Виконати наступні додаткові дії: [Призначення: визначені організацією дії, які необхідно зробити].


      Параметри:

      1. Призначення: визначені організацією персонал або посади

      2. Призначення: визначений організацією період часу

      3. Призначення: визначені організацією дії, які необхідно зробити'
    annotation: 'Збої процесу журналювання аудиту включають помилки програмного та апаратного забезпечення, збої
      в механізмах запису журналу аудиту та досягнення або перевищення ємності зберігання журналу аудиту. Дії можуть
      охоплювати: вимкнення системи, перезапис найстаріших записів аудиту, припинення генерації записів аудиту.
      Прикладами збоїв обробки аудиту можуть бути: помилки програмного та апаратного забезпечення, збої в механізмах
      аудиту, перевищення місткості сховища записів аудиту. Залежно від типу відмови, місця відмови або інших факторів,
      можуть бути вибрані додаткові дії для виконання. Цей захід безпеки може застосовуватися як до конкретного
      сховища даних аудиту (тобто, окремої системної складової, де зберігаються записи аудиту), так і до загального
      сховища записів аудиту організації (тобто всіх сховищ даних аудиту).'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:au-5.1
    ref_id: AU-5(1)
    name: Реагування на відмови обробки даних аудиту — Місткість сховища записів аудиту
    category: technical
    csf_function: protect
    description: 'Забезпечити попередження [Призначення: визначених організацією персоналу, ролей та/або місць]
      у межах [Призначення: визначеного організацією періоду часу], коли обсяг записів аудиту, що зберігаються,
      досягає максимуму місткості сховища.


      Параметри:

      1. Призначення: визначених організацією персоналу, ролей та/або місць

      2. Призначення: визначеного організацією періоду часу'
    annotation: Організації можуть мати кілька сховищ для зберігання даних аудиту, розподілених по декількох компонентах
      системи, причому кожне сховище може мати різну місткість.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:au-5.2
    ref_id: AU-5(2)
    name: Реагування на відмови обробки даних аудиту — Тривожне сповіщення в реальному часі
    category: technical
    csf_function: protect
    description: 'Забезпечити сповіщення в [Призначення: визначений організацією період реального часу] [Призначення:
      визначених організацією персоналу, ролей та/або місць], коли відбуваються такі події збою аудиту: [Призначення:
      визначені організацією події, пов’язані зі збоями та помилками аудиту, які вимагають тривоги в реальному часі].


      Параметри:

      1. Призначення: визначений організацією період реального часу

      2. Призначення: визначених організацією персоналу, ролей та/або місць

      3. Призначення: визначені організацією події, пов’язані зі збоями та помилками аудиту, які вимагають тривоги
      в реальному часі'
    annotation: Попередження мають містити термінові повідомлення. Повідомлення в режимі реального часу мають надаватися
      зі швидкістю інформаційних технологій (тобто час від виявлення події до оповіщення не повинен перевищувати
      секунду).
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:au-5.3
    ref_id: AU-5(3)
    name: Реагування на відмови обробки даних аудиту — Налаштування порогового обсягу трафіку
    category: technical
    csf_function: protect
    description: 'Здійснювати налаштування порогових значень обсягу трафіку комунікаційних мереж, що відображають
      обмеження на можливості аудиту та [Вибір: відхиляти; затримувати] мережевий трафік, якщо він перевищує цей
      поріг.


      Параметри:

      1. Вибір: відхиляти; затримувати'
    annotation: Обробка мережевого трафіку може затримуватися (або відхилятися), якщо об’єм трафіку перевищує можливості
      системи аудиту. Відповідь про відхилення або затримку надається на основі встановлених порогових обсягів трафіку,
      які можна налаштувати на основі змін у ємності зберігання журналу аудиту.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:au-5.4
    ref_id: AU-5(4)
    name: Реагування на відмови обробки даних аудиту — Вимкнення в разі відмови
    category: technical
    csf_function: protect
    description: 'Застосовувати [Вибір: повне вимикання системи; часткове вимикання системи; знижений режим роботи
      з обмеженням доступної/цільової функціональності] у разі [Призначення: визначених організацією збоїв аудиту],
      якщо немає альтернативної можливості аудиту.


      Параметри:

      1. Вибір: повне вимикання системи; часткове вимикання системи; знижений режим роботи з обмеженням доступної/цільової
      функціональності

      2. Призначення: визначених організацією збоїв аудиту'
    annotation: Мають бути визначені типи збоїв аудиту, які можуть спричиняти автоматичне відключення системи. Через
      важливість забезпечення місії та безперервності діяльності організації можуть визначити, що характер невдачі
      аудиту не є настільки серйозним, що вимагає повного вимкнення системи. У таких випадках альтернативними рішеннями
      можуть бути часткове вимкнення системи або робота в деградованому режимі зі зниженою працездатністю.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:au-5.5
    ref_id: AU-5(5)
    name: Реагування на відмови обробки даних аудиту — Можливість альтернативного журналювання аудиту
    category: technical
    csf_function: protect
    description: 'Надання альтернативної можливості журналювання аудиту в разі збою основної можливості журналювання
      аудиту, яка реалізується [Призначення: визначена організацією функція альтернативного журналювання аудиту]


      Параметри:

      1. Призначення: визначена організацією функція альтернативного журналювання аудиту'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:au-6
    ref_id: AU-6
    name: Огляд, аналіз і звітність аудиту
    category: process
    csf_function: detect
    description: 'a.    Переглядати та аналізувати записи системного аудиту [Призначення: з визначеною організацією
      частотою] для виявлення [Призначення: визначеної організацією неналежної або незвичайної діяльності].


      b. Відправляти звіт про аудит [Призначення: визначеним організацією персоналу або посадам].


      c. Налаштувати рівні огляду аудиту, аналізу та звітності в рамках системи, коли змінюється рівень ризику на
      основі інформації від правоохоронних органів, розвідувальної інформації або від інших достовірних джерел інформації.


      Параметри:

      1. Призначення: з визначеною організацією частотою

      2. Призначення: визначеної організацією неналежної або незвичайної діяльності

      3. Призначення: визначеним організацією персоналу або посадам'
    annotation: 'Огляд, аналіз і звітність аудиту стосуються аудиту, пов’язаного з інформаційною безпекою, включно
      з аудитом, який є результатом моніторингу використання облікового запису, віддаленого доступу, бездротового
      зв’язку, підключення мобільних пристроїв, налаштувань конфігурації, інвентаризації компонентів системи, використання
      інструментів технічного обслуговування фізичного доступу тощо. Результати можуть бути передані таким організаційним
      структурам: група реагування на інциденти, довідкова служба, група/відділ захисту інформації. Якщо організаціям
      заборонено переглядати та аналізувати інформацію про аудит (або вони не мають можливості проводити таку діяльність),
      огляд/аналіз можуть проводити інші організації, яким надано такі повноваження. Частота, обсяг, глибина огляду,
      аналізу та звітності аудиту можуть бути скориговані відповідно до потреб організації на основі нової інформації,
      що надійшла.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:au-6.1
    ref_id: AU-6(1)
    name: Огляд, аналіз і звітність аудиту — Автоматизована інтеграція процесів
    category: process
    csf_function: detect
    description: 'Інтегрувати процеси перегляду, аналізу та звітності записів аудиту за допомогою [Призначення:
      автоматизовані механізми, визначені організацією].


      Параметри:

      1. Призначення: автоматизовані механізми, визначені організацією'
    annotation: 'До процесів організації, щодо яких слід застосовувати механізми інтеграції аудиту, належать: реагування
      на інциденти, безперервний моніторинг, планування дій у надзвичайних ситуаціях.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:au-6.2
    ref_id: AU-6(2)
    name: Огляд, аналіз і звітність аудиту — Автоматизовані сповіщення про порушення безпеки
    category: process
    csf_function: detect
    description: 'Вилучено: Включено до SI-4.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:au-6.3
    ref_id: AU-6(3)
    name: Огляд, аналіз і звітність аудиту — Зіставляння сховищ аудиту
    category: process
    csf_function: detect
    description: Аналізувати та зіставляти записи аудиту в різних сховищах задля забезпечення ситуативної обізнаності
      в масштабах організації.
    annotation: Ситуативна обізнаність у масштабах організації містить обізнаність на всіх трьох рівнях управління
      ризиками (тобто на рівні організації, на рівні місії/процесів та системному рівні).
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:au-6.4
    ref_id: AU-6(4)
    name: Огляд, аналіз і звітність аудиту — Централізований перегляд та аналіз
    category: process
    csf_function: detect
    description: Забезпечити та впровадити можливість централізованого перегляду та аналізу записів аудиту з декількох
      компонентів у системі.
    annotation: Автоматизовані механізми централізованого перегляду та аналізу охоплюють, наприклад, механізми управління
      інформаційною безпекою.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:au-6.5
    ref_id: AU-6(5)
    name: Огляд, аналіз і звітність аудиту — Інтегрований аналіз записів аудиту
    category: process
    csf_function: detect
    description: 'Інтегрувати аналіз записів аудиту з аналізом [Вибір (один або більше): інформації про сканування
      уразливостей; даних про продуктивність; інформації про моніторинг системи; [Призначення: визначених організацією
      даних/інформації, зібраних з інших джерел]] для подальшого підвищення здатності виявляти неприйнятну або незвичайну
      діяльність.


      Параметри:

      1. Вибір (один або більше): інформації про сканування уразливостей; даних про продуктивність; інформації про
      моніторинг системи; [Призначення: визначених організацією даних/інформації, зібраних з інших джерел]'
    annotation: Це посилення заходу не вимагає сканування вразливостей, збору даних про продуктивність або моніторингу
      системи. Це посилення вимагає інтеграції аналізу інформації, яка іншим чином обробляється в цих областях,
      з аналізом інформації аудиту. Використання інструментів системи управління подіями та інформацією про безпеку
      можуть полегшити агрегацію/консолідацію записів аудиту з декількох компонентів системи, а також співвідношення
      та аналіз записів аудиту. Використання стандартизованих сценаріїв аналізу записів аудиту, розроблених організаціями
      (при необхідності локалізованих коригувань сценаріїв), забезпечує більш економічні підходи до аналізу зібраної
      інформації. При визначенні правдивості сканування вразливостей і співвіднесення подій виявлення атак з результатами
      сканування, важливим є співвіднесення інформації записів аудиту з інформацією про сканування вразливостей.
      Кореляція з даними про ефективність може виявити атаку типу «відмова в обслуговуванні» або інші типи атак,
      що призводить до несанкціонованого використання ресурсів. Кореляція з інформацією про моніторинг системи може
      допомогти в розкритті атак та поліпшити зв’язок інформації аудиту з операційними ситуаціями
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:au-6.6
    ref_id: AU-6(6)
    name: Огляд, аналіз і звітність аудиту — Кореляція з фізичним моніторингом
    category: process
    csf_function: detect
    description: Зіставляти інформацію із записів аудиту з інформацією, отриманою від моніторингу фізичного доступу,
      для подальшого підвищення здатності ідентифікувати підозрілу, неприйнятну, незвичайну або зловмисну діяльність.
    annotation: Кореляція з фізичним моніторингом може допомогти організаціям визначити приклади підозрілої поведінки
      або підтвердити докази такої поведінки. Наприклад, кореляція ідентичності особи для логічного доступу до певних
      систем з додатковою інформацією про фізичну безпеку, яка була присутня, коли відбувся логічний доступ, може
      бути корисною для розслідування.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:au-6.7
    ref_id: AU-6(7)
    name: Огляд, аналіз і звітність аудиту — Дозволені дії
    category: process
    csf_function: detect
    description: 'Визначити дозволені дії для кожного [Вибір (один або кілька): системного процесу; ролі; користувача],
      пов’язаного з переглядом, аналізом та поданням інформації про аудит.


      Параметри:

      1. Вибір (один або кілька): системного процесу; ролі; користувача'
    annotation: Організації визначають дозволені дії для процесів системи, ролей та/або користувачів, пов’язаних
      з оглядом, аналізом та звітністю аудиту, за допомогою методів управління обліковими записами. Дозволені дії
      мають визначатися, базуючись на принципі найменших привілеїв. До дозволених дій належать, наприклад, читання,
      запис, додавання, видалення.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:au-6.8
    ref_id: AU-6(8)
    name: Огляд, аналіз і звітність аудиту — Аналіз повного тексту привілейованих команд
    category: process
    csf_function: detect
    description: Виконувати повний аналіз тексту привілейованих команд аудиту у фізично окремому компоненті чи підсистемі
      або іншій системі, яка може виконувати такий аналіз.
    annotation: Це посилення заходу регламентує наявність чіткого середовища для спеціалізованого аналізу інформації
      аудиту, яка стосується привілейованих користувачів (без шкоди для такої інформації в системі), у якому користувачі
      мають підвищені привілеї, включно з можливістю виконання привілейованих команд. Повний аналіз тексту належить
      до аналізу, який розглядає повний текст привілейованих команд (тобто команд та всіх параметрів) на відміну
      від аналізу, який враховує лише ім’я команди. Повний аналіз тексту охоплює, наприклад, використання відповідності
      шаблонів та евристики.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:au-6.9
    ref_id: AU-6(9)
    name: Огляд, аналіз і звітність аудиту — Кореляція з інформацією з нетехнічних джерел
    category: process
    csf_function: detect
    description: Зіставляти інформацію з нетехнічних джерел з інформацією аудиту з метою посилення організаційної
      обізнаності.
    annotation: До нетехнічних джерел належать кадрові записи, що документують порушення організаційної політики,
      пов’язані з випадками переслідування та неналежного використання інформаційних активів. Така інформація може
      сприяти виявленню потенційної зловмисної інсайдерської діяльності. Доступ до інформації з нетехнічних джерел
      має бути обмеженим для мінімізації вірогідності ненавмисного оприлюднення приватної інформації. Таким чином,
      кореляція з інформацією з нетехнічних джерел здебільшого відбувається лише тоді, коли людей підозрюють у причетності
      до інциденту безпеки. Організації повинні отримати юридичну консультацію для ініціювання таких дій.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:au-6.10
    ref_id: AU-6(10)
    name: Огляд, аналіз і звітність аудиту — Регулювання рівня аудиту
    category: process
    csf_function: detect
    description: 'Вилучено: Включено до AU-6.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:au-7
    ref_id: AU-7
    name: Скорочення записів аудиту та формування звіту
    category: technical
    csf_function: detect
    description: 'Забезпечити та реалізувати можливості скорочення записів перевірок аудитом і звітів, до рівня,
      який:


      a.     підтримує перевірку, аналіз і звітність аудиту на вимогу та розслідування (постфактум) інцидентів безпеки;


      b.     не змінює оригінальний вміст або час упорядкування записів аудиту.'
    annotation: Скорочення аудиту — це процес, який обробляє зібрану інформацію аудиту та організовує її у форматі
      звіту, що є більш зручним для аналітиків. Можливості скорочення аудиту та формування звітів не завжди виконуються
      тими ж організаційними структурами, які здійснюють діяльність аудиту. Можливість скорочення аудиту може охоплювати,
      наприклад, сучасні методи генерування даних з використанням удосконалених фільтрів для виявлення аномальної
      поведінки в записах аудиту. Упорядкування записів аудиту за часом може бути корисним, якщо деталізація мітки
      часу недостатня.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:au-7.1
    ref_id: AU-7(1)
    name: Скорочення записів аудиту та формування звіту — Автоматична обробка
    category: technical
    csf_function: detect
    description: 'Забезпечити та реалізувати можливість обробки записів аудиту для подій, що становлять інтерес,
      на основі [Призначення: визначених організацією полів у записах аудиту].


      Параметри:

      1. Призначення: визначених організацією полів у записах аудиту'
    annotation: Події, що становлять інтерес, можна визначити за вмістом конкретних полів запису аудиту, включно
      з, наприклад, ідентичністю, типами подій, місцем подій, часом подій, датами подій, залученими системними ресурсами,
      пов’язаними адресами Інтернет-протоколу або доступом до інформаційних об’єктів. Організації можуть визначати
      критерії подій аудиту в будь-якій необхідній мірі деталізації.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:au-7.2
    ref_id: AU-7(2)
    name: Скорочення записів аудиту та формування звіту — Автоматичне сортування та пошук
    category: technical
    csf_function: detect
    description: 'Вилучено: Включено до AU-7(1).'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:au-8
    ref_id: AU-8
    name: Позначка часу
    category: technical
    csf_function: protect
    description: 'a.    Використовувати внутрішньосистемний годинник для створення позначок часу для записів аудиту.


      b.    Застосовувати позначки часу, які відповідають [Призначення: деталізація вимірювання часу, визначена
      організацією] і використовують всесвітній координований час, мають фіксоване зміщення місцевого часу відносно
      всесвітнього координованого часу або включають зміщення місцевого часу як частину позначки часу.


      Параметри:

      1. Призначення: деталізація вимірювання часу, визначена організацією'
    annotation: Позначка часу містить дату та час. Час зазвичай виражається у форматі UTC, GMT або зазначається
      місцевий час зі зміщенням від UTC. Організації можуть визначати різні деталі часу для різних компонентів системи.
      Служба позначок часу може бути критичною для інших можливостей безпеки, таких як контроль доступу, ідентифікація
      та автентифікація.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:au-8.1
    ref_id: AU-8(1)
    name: Позначка часу — Синхронізація з авторитетним джерелом часу
    category: technical
    csf_function: protect
    description: 'Вилучено: Включено до SC-45(1).'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:au-8.2
    ref_id: AU-8(2)
    name: Позначка часу — Вторинне авторитетне джерело часу
    category: technical
    csf_function: protect
    description: 'Вилучено: Включено до SC-45(2).'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:au-9
    ref_id: AU-9
    name: Захист інформації аудиту
    category: technical
    csf_function: protect
    description: 'a. Захист інформації аудиту та інструментів            журналювання     аудиту    від несанкціонованого
      доступу, зміни та видалення;


      b. Сповіщення [Призначення: персонал або ролі, визначені організацією] у разі виявлення несанкціонованого
      доступу, зміни або видалення інформації аудиту.


      Параметри:

      1. Призначення: персонал або ролі, визначені організацією'
    annotation: Інформація аудиту містить усю інформацію, наприклад, записи аудиту, настройки аудиту, звіти аудиту
      та персональну інформацію, необхідну для успішної діяльності системи аудиту. Інструменти журналювання аудиту
      – це програми та пристрої, які використовуються для проведення аудиту системи та журналювання. Захист інформації
      аудиту зосереджується на технічному захисті та обмежує можливість доступу та виконання інструментів журналювання
      аудиту лише уповноваженими особами. Фізичний захист інформації аудиту стосується способів захисту засобів
      масової інформації, заходів фізичного захисту та заходів захисту навколишнього середовища.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:au-9.1
    ref_id: AU-9(1)
    name: Захист інформації аудиту — Апаратні носії інформації одноразового запису
    category: technical
    csf_function: protect
    description: Журнали аудиту мають бути записані на апаратні носії інформації з одноразовим записом.
    annotation: Це посилення заходу застосовується до початкового генерування журналів аудиту (тобто, до збирання
      записів аудиту, що надають інформацію аудиту, яка повинна використовуватися для виявлення, аналізу та звітності)
      та резервного копіювання цих журналів аудиту. Удосконалення не поширюється на записи аудиту до того, як вони
      будуть записані до журналу. До апаратних носіїв інформації з одноразовим записом належать компакт-диски (CD-R,
      DVD-R). Навпаки, використання змінних носіїв із захистом від запису, таких як стрічкові картриджі, дисководи
      з універсальною послідовною шиною (USB), компакт-диски з можливістю повторного запису (CD-RW) і цифрові багатофункціональні
      записи з читанням дисків (DVD-RW) є носіями, захищеними від запису, але з можливістю не одноразового запису.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:au-9.2
    ref_id: AU-9(2)
    name: Захист інформації аудиту — Зберігання на окремих фізичних системах або компонентах
    category: technical
    csf_function: protect
    description: 'Зберігати записи аудиту з [Призначення: визначеною організацією з частотою] у репозиторії, який
      є частиною фізично іншої системи або компонента системи, ніж система або компонент, який перевіряється.


      Параметри:

      1. Призначення: визначеною організацією з частотою'
    annotation: Зберігання інформації про аудит в окремому сховищі може гарантувати, що компрометація системи не
      призведе до компрометації записів аудиту. Зберігання записів аудиту в окремих фізичних системах або компонентах
      також зберігає конфіденційність і цілісність записів аудиту та полегшує керування записами аудиту в межах
      усієї організації. Зберігання записів аудиту в окремих системах або компонентах стосується початкового створення,
      а також резервного копіювання або тривалого зберігання записів аудиту.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:au-9.3
    ref_id: AU-9(3)
    name: Захист інформації аудиту — Криптографічний захист
    category: technical
    csf_function: protect
    description: Запровадити криптографічні механізми для захисту цілісності інформації аудиту та інструментів аудиту.
    annotation: Криптографічні механізми, які використовуються для захисту цілісності інформації аудиту, охоплюють
      використання геш-функцій у парі з асиметричною криптографією, що дозволяє розповсюджувати відкритий ключ для
      перевірки інформації, зберігаючи конфіденційність особистого ключа.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:au-9.4
    ref_id: AU-9(4)
    name: Захист інформації аудиту — Доступ, який надається через членство в підмножині привілейованих користувачів
    category: technical
    csf_function: protect
    description: 'Авторизувати доступ до управління функціональністю аудиту тільки для [Призначення:  визначеної  організацією  підмножини    привілейованих
      користувачів].


      Параметри:

      1. Призначення: визначеної організацією підмножини привілейованих користувачів'
    annotation: Особи з привілейованим доступом також є предметом аудиту та можуть впливати на надійність інформації
      аудиту. Це посилення заходу вимагає, щоб привілейований доступ був додатково визначений між привілеями, пов’язаними
      з аудитом, та іншими привілеями, таким чином обмежуючи користувачів, що мають права користування аудитом.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:au-9.5
    ref_id: AU-9(5)
    name: Захист інформації аудиту — Подвійна авторизація
    category: technical
    csf_function: protect
    description: 'Здійснювати подвійну авторизацію для [Вибір (один або кілька): переміщення; видалення] [Призначення:
      визначеної організацією інформації аудиту].


      Параметри:

      1. Вибір (один або кілька): переміщення; видалення

      2. Призначення: визначеної організацією інформації аудиту'
    annotation: Механізми подвійного авторизації (також відомі як контроль двох осіб) вимагають затвердження двох
      уповноважених осіб для виконання функцій аудиту. Щоб зменшити ризик змови, організації розглядають можливість
      передачі подвійних повноважень іншим особам. Подвійну авторизацію не застосовують у випадках, коли необхідні
      негайні реакції для забезпечення громадської та екологічної безпеки.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:au-9.6
    ref_id: AU-9(6)
    name: Захист інформації аудиту — Доступ тільки для читання
    category: technical
    csf_function: protect
    description: 'Авторизувати доступ лише для читання інформації аудиту для [Призначення: визначеної організацією
      підмножини привілейованих користувачів].


      Параметри:

      1. Призначення: визначеної організацією підмножини привілейованих користувачів'
    annotation: Обмеження привілейованих дозволів користувачів лише для читання допомагає обмежити потенційний збиток
      організаціям, які можуть бути ініційовані такими користувачами, наприклад, видалення записів аудиту для приховування
      зловмисної діяльності.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:au-9.7
    ref_id: AU-9(7)
    name: Захист інформації аудиту — Зберігання на компоненті іншої операційної системи
    category: technical
    csf_function: protect
    description: Зберігати інформацію про аудит на компоненті, що працює з іншою операційною системою, ніж система
      або компонент, який проходить аудит.
    annotation: Це посилення заходу допомагає зменшити ризики при компрометації системи.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:au-10
    ref_id: AU-10
    name: Неспростовність
    category: technical
    csf_function: protect
    description: 'Надавайте неспростовні докази того, що особа (або процес, який діє від імені особи) виконала [Призначення:
      дії, визначені організацією, на які поширюється принцип неспростовності].


      Параметри:

      1. Призначення: дії, визначені організацією, на які поширюється принцип неспростовності'
    annotation: 'До дій, факти здійснення яких не можуть бути спростовані, належать: створення інформації, надсилання
      й отримання повідомлень та затвердження інформації. Неспростовність захищає від претензій авторів про те,
      що вони не є авторами певних документів, відправників про те, що вони не передавали повідомлення, одержувачів
      про те, що вони не отримували повідомлення, і підписантів про те, що вони не підписували документи. Послуги
      неспростовності можна використовувати, щоб визначити, чи інформація надійшла від особи, чи особа виконала
      певні дії (наприклад, надсилання електронного листа, підписання контракту, схвалення запиту на закупівлю або
      отримання конкретної інформації). Організації отримують послуги неспростовності, використовуючи різні техніки
      або механізми, зокрема цифрові підписи та цифрові квитанції про повідомлення.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:au-10.1
    ref_id: AU-10(1)
    name: Неспростовність — Асоціація ідентичності
    category: technical
    csf_function: protect
    description: 'a) Зв’язати особистість джерела інформації з інформацією з [Призначення: визначеною організацією
      міцністю зв’язування].

      b) Впровадити засоби, якими уповноважені особи можуть визначити особу виробника інформації.


      Параметри:

      1. Призначення: визначеною організацією міцністю зв’язування'
    annotation: Це посилення заходу застосовується для реалізації вимоги неспростовності створення інформації. Прив’язка
      ідентифікаторів до інформації підтримує вимоги до аудиту, які надають персоналу засоби ідентифікації того,
      хто створив конкретну інформацію, у разі її передачі. Організації визначають і затверджують міцність зв’язку
      між джерелом інформації та інформацією на основі категорії безпеки інформації та відповідних факторів ризику.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:au-10.2
    ref_id: AU-10(2)
    name: Неспростовність — Ратифікація прив’язки інформації про ідентичність виробника
    category: technical
    csf_function: protect
    description: 'a) Підтвердити прив’язку інформації про ідентичність джерела до інформації з [Призначення: визначеною
      організацією частотою].

      b) Виконати [Призначення: визначені організацією дії] у разі помилки перевірки.


      Параметри:

      1. Призначення: визначеною організацією частотою

      2. Призначення: визначені організацією дії'
    annotation: Це посилення заходу запобігає модифікації інформації. Валідація зв’язку може бути досягнута, наприклад,
      за допомогою криптографічних контрольних сум. Організації визначають, чи перевірки виконуються у відповідь
      на запити користувачів чи генеруються автоматично.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:au-10.3
    ref_id: AU-10(3)
    name: Неспростовність — Ланцюжок збереження доказів
    category: technical
    csf_function: protect
    description: Підтримувати перегляд і випуск ідентичності та повноважень у межах встановленого ланцюжка збереження
      доказів для всієї переглянутої або оприлюдненої інформації.
    annotation: Ланцюжок збереження доказів — це процес, який відстежує рух доказів протягом його життєвого циклу.
      Якщо рецензент є людиною, система пов’язує особу рецензента інформації, яка підлягає передачі, з інформацією
      та інформаційною міткою. Це посилення заходу забезпечує організаційним службовцям засоби для визначення того,
      хто переглядав та оприлюднював інформацію. У випадку автоматизованих оглядів це поліпшення контролю забезпечує
      використання лише затверджених функцій огляду.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:au-10.4
    ref_id: AU-10(4)
    name: Неспростовність — Валідація зв’язку ідентичності переглядача інформації
    category: technical
    csf_function: protect
    description: 'a) Підтвердити прив’язку особистості рецензента до інформації в точках передачі або видачі до
      її випуску або передачі між [Призначення: визначеними організацією домени безпеки].

      b) Виконати [Призначення: визначені організацією дії] у разі помилки перевірки.


      Параметри:

      1. Призначення: визначеними організацією домени безпеки

      2. Призначення: визначені організацією дії'
    annotation: Це посилення контролю запобігає зміні інформації між переглядом і передачею/випуском. Валідація
      зв’язку може бути досягнута, наприклад, за допомогою криптографічних контрольних сум. Організації визначають,
      чи перевірки виконуються у відповідь на запити користувачів чи генеруються автоматично.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:au-10.5
    ref_id: AU-10(5)
    name: Неспростовність — Цифрові підписи
    category: technical
    csf_function: protect
    description: 'Вилучено: Включено до SI-7.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:au-11
    ref_id: AU-11
    name: Збереження записів аудиту
    category: technical
    csf_function: protect
    description: 'Зберігати записи аудиту впродовж [Призначення: визначеного організацією періоду часу, відповідно
      політиці зберігання записів], щоб забезпечити підтримку розслідувань (постфактум) інцидентів безпеки та приватності,
      а також для задоволення вимог нормативних і документів організації щодо збереження даних аудиту.


      Параметри:

      1. Призначення: визначеного організацією періоду часу, відповідно політиці зберігання записів'
    annotation: Записи аудиту мають зберігатися, поки не буде встановлено, що вони більше не потрібні для адміністративних,
      юридичних чи інших операційних цілей. Мають бути описані стандартні категорії записів аудиту та стандартні
      процеси реагування для кожного типу.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:au-11.1
    ref_id: AU-11(1)
    name: Збереження записів аудиту — Довгострокова можливість отримання
    category: technical
    csf_function: protect
    description: 'Впровадити [Призначення: визначені організацією заходи], щоб гарантувати, що довгострокові записи
      аудиту, створені системою, можуть бути отримані.


      Параметри:

      1. Призначення: визначені організацією заходи'
    annotation: 'Це посилення заходу забезпечує технічну можливість довгострокового доступу до записів аудиту. Заходи,
      які можуть використовуватися: перезаписування в актуальних форматах, збереження технічного обладнання для
      читання наявних форматів тощо.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:au-12
    ref_id: AU-12
    name: Генерація даних аудиту
    category: technical
    csf_function: protect
    description: 'a.     Забезпечити генерацію даних аудиту для типів подій, що перевіряються в AU-2а в [Призначення:
      визначених організацією компонентах системи].


      b. Дозволити [Призначення: визначеному організацією персоналу або посадам] вибирати, які типи подій, що перевіряються,
      повинні перевірятися окремими компонентами системи;


      c. Генерувати записи аудиту для типів подій, визначених в AU-2с. з вмістом згідно з AU-3.


      Параметри:

      1. Призначення: визначених організацією компонентах системи

      2. Призначення: визначеному організацією персоналу або посадам'
    annotation: Записи аудиту можуть формуватися з багатьох різних компонентів системи. Перелік типів подій, вказаних
      в AU-2d, — це сукупність типів подій, стосовно яких слід проводити аудит. Ці типи подій — підмножина всіх
      типів подій, для яких система може генерувати записи аудиту.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:au-12.1
    ref_id: AU-12(1)
    name: Генерація даних аудиту — Загальносистемний та синхронізований за часом журналу аудиту
    category: technical
    csf_function: protect
    description: 'Скомпонувати записи аудиту з [Призначення: визначеними організацією системними компонентами] в
      загальносистемний (логічний або фізичний) журнал аудиту, який синхронізований за часом у межах [Призначення:
      визначеного організацією допустимого рівня для взаємозв’язку між мітками часу окремих записів у журналах аудиту].


      Параметри:

      1. Призначення: визначеними організацією системними компонентами

      2. Призначення: визначеного організацією допустимого рівня для взаємозв’язку між мітками часу окремих записів
      у журналах аудиту'
    annotation: Журнал аудиту — це синхронізований за мітками часу в окремих записах аудиту каталог (організація
      такого каталогу можлива лише за умови, що мітки часу в кожному окремому запису аудиту можуть бути пов’язані
      з мітками часу в інших записах аудиту).
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:au-12.2
    ref_id: AU-12(2)
    name: Генерація даних аудиту — Стандартизовані формати
    category: technical
    csf_function: protect
    description: Створити загальносистемний (логічний або фізичний) журнал аудиту, що складається із записів аудиту
      в стандартизованому форматі.
    annotation: Стандартизована (відповідно до прийнятих норм) інформація щодо аудиту може сприяти взаємодії та
      обміну такою інформацією між різними пристроями та системами. Це сприяє виробленню інформації про події, які
      можна легше проаналізувати. Якщо механізми ведення журналу не відповідають стандартизованим форматам, системи
      можуть перетворювати окремі записи аудиту в стандартизовані формати під час формування журналів аудиту системи.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:au-12.3
    ref_id: AU-12(3)
    name: Генерація даних аудиту — Зміни, що вносять авторизовані особи
    category: technical
    csf_function: protect
    description: 'Забезпечити та реалізувати можливість для [Призначення: визначених організацією окремих осіб або
      ролей] змінити аудит, який виконуватиметься на [Призначення: визначених організацією компонентах системи]
      на основі [Призначення: визначених організацією критеріїв вибору подій] у межах [Призначення: визначених організацією
      часових порогів].


      Параметри:

      1. Призначення: визначених організацією окремих осіб або ролей

      2. Призначення: визначених організацією компонентах системи

      3. Призначення: визначених організацією критеріїв вибору подій

      4. Призначення: визначених організацією часових порогів'
    annotation: Це посилення дозволяє організаціям (за потреби) розширити або обмежити аудит. Обмежений, з метою
      економії ресурсів, аудит може бути розширений для ліквідації певних загроз. Крім того, аудит може бути обмежений
      певним набором типів подій для скорочення часу проведення аудиту, аналізу та підготовки звіту аудиту. Організації
      можуть встановлювати межі часу, для яких дії аудиту змінюються, наприклад, у режимі реального часу, протягом
      декількох хвилин або протягом години.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:au-12.4
    ref_id: AU-12(4)
    name: Генерація даних аудиту — Аудит запитів персональних даних
    category: technical
    csf_function: protect
    description: Забезпечити та реалізувати можливості аудиту параметрів подій запитів користувачів для наборів
      даних, що містять персональні дані.
    annotation: Параметри запиту — це явні критерії, які користувач або автоматизована система надає системі для
      отримання даних. Аудит параметрів запитів у наборах даних, що містять персональні дані, збільшує відстежуваність
      (можливість такого аудиту може бути надана лише уповноваженим особам).
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:au-13
    ref_id: AU-13
    name: Моніторинг розкриття інформації
    category: process
    csf_function: detect
    description: 'a. Моніторинг [Завдання: визначена організацією інформація з відкритих джерел та/або інформаційних
      сайтів] [Завдання: частота, визначена організацією] на наявність доказів неавторизованого розголошення конфіденційної
      інформації;


      b. Якщо виявлено розголошення інформації:


      1. Повідомити [Призначення: персонал або ролі, визначені організацією];


      2. Виконайте такі додаткові дії: [Призначення: додаткові дії, визначені організацією].


      Параметри:

      1. Завдання: визначена організацією інформація з відкритих джерел та/або інформаційних сайтів

      2. Завдання: частота, визначена організацією

      3. Призначення: персонал або ролі, визначені організацією

      4. Призначення: додаткові дії, визначені організацією'
    annotation: Несанкціоноване розкриття інформації є формою витоку даних. Інформація з відкритих джерел включає
      сайти соціальних мереж, платформи та сховища обміну кодами. Прикладами організаційної інформації є персональні
      дані, що зберігаються організацією, або конфіденційна інформація, створена організацією.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:au-13.1
    ref_id: AU-13(1)
    name: Моніторинг розкриття інформації — Використання автоматичних засобів
    category: process
    csf_function: detect
    description: 'Моніторинг відкритої інформації та інформаційних сайтів за допомогою [Завдання: визначені організацією
      автоматизовані механізми].


      Параметри:

      1. Завдання: визначені організацією автоматизовані механізми'
    annotation: Автоматизовані механізми можуть містити, наприклад, автоматизовані сценарії для моніторингу нових
      публікацій на обраних вебсайтах, а також послуги сповіщення.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:au-13.2
    ref_id: AU-13(2)
    name: Моніторинг розкриття інформації — Огляд сайтів, що підлягають моніторингу
    category: process
    csf_function: detect
    description: 'Проводити огляд відкритих інформаційних сайтів, що підлягають моніторингу [Призначення: з визначеною
      організацією частотою].


      Параметри:

      1. Призначення: з визначеною організацією частотою'
    annotation: Перегляд поточного списку інформаційних сайтів з відкритими джерелами, які регулярно підлягають
      моніторингу, допомагає переконатися, що вибрані ці сайти є актуальними. Огляд також надає можливість додавати
      нові інформаційні сайти з відкритим кодом, які потенційно можуть надати докази неавторизованого розголошення
      організаційної інформації. Перелік вебсайтів, які підлягають моніторингу, може ґрунтуватися на даних про загрози
      з інших надійних джерел інформації.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:au-13.3
    ref_id: AU-13(3)
    name: Моніторинг розкриття інформації — Авторизоване копіювання інформації
    category: process
    csf_function: detect
    description: Використовуйте методи виявлення, процеси та інструменти, щоб визначити, чи зовнішні суб’єкти копіюють
      організаційну інформацію неавторизованим способом.
    annotation: Несанкціоноване використання або копіювання організаційної інформації зовнішніми особами може спричинити
      негативний вплив на організаційні операції та активи, зокрема завдати шкоди репутації. Така діяльність може
      включати копіювання вебсайту організації супротивником або ворожою загрозою, яка намагається видати себе за
      організацію вебхостингу. Інструменти, методи та процеси виявлення, які використовуються для визначення того,
      чи зовнішні суб’єкти копіюють організаційну інформацію несанкціонованим чином, включають сканування зовнішніх
      вебсайтів, моніторинг соціальних медіа та навчання персоналу розпізнавати несанкціоноване використання інформації
      організації.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:au-14
    ref_id: AU-14
    name: Аудит сесії
    category: technical
    csf_function: protect
    description: 'a. Надавати та реалізувати можливість для [Призначення: користувачів або ролей, визначених організацією]
      для [Вибору (одного або кількох): збору/запису або перегляду/прослуховування] вмісту сесії користувача в [Призначення:
      обставини, визначені організацією];


      b. Розробляти, інтегрувати та використовувати діяльність з аудиту сесії, консультуючись із юрисконсультантом
      щодо її відповідності до чинних законів, розпоряджень, директив, нормативних актів, політик, стандартів і
      вказівок.


      Параметри:

      1. Призначення: користувачів або ролей, визначених організацією

      2. Призначення: обставини, визначені організацією'
    annotation: 'Аудит сесії охоплює: моніторинг натискань клавіш, відстеження відвідуваних вебсайтів, запис інформації
      та/або передачу файлів. Можливість аудиту сесії реалізована на додаток до реєстрації подій і може передбачати
      спеціальної технології захоплення сесії. Аудит сесії може виявити інформацію, яка може спричинити ризик конфіденційності,
      а також способи пом’якшення таких ризиків. Оскільки аудит сесії може вплинути на продуктивність системи та
      мережі, організації активують цю можливість у чітко визначених ситуаціях (наприклад,


      організація підозрює певну особу). Організації консультуються з юрисконсультантами, посадовими особами з питань
      громадянських свобод і конфіденційності, щоб переконатися, що будь-які юридичні проблеми, проблеми з конфіденційністю,
      громадянськими правами чи свободами, включно з використанням ідентифікаційної інформації, розглядаються належним
      чином'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:au-14.1
    ref_id: AU-14(1)
    name: Аудит сесії — Система запуску
    category: technical
    csf_function: protect
    description: Автоматично ініціювати аудит сесії при запуску системи.
    annotation: Автоматична ініціація аудиту сеансу під час запуску допомагає переконатися, що інформація, яка збирається
      про вибраних осіб, є повною та не підлягає компрометації через втручання зловмисників.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:au-14.2
    ref_id: AU-14(2)
    name: Аудит сесії — Захоплення та запис інформації
    category: technical
    csf_function: protect
    description: 'Вилучено: Включено до AU-14.'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:au-14.3
    ref_id: AU-14(3)
    name: Аудит сесії — Віддалений перегляд та прослуховування
    category: technical
    csf_function: protect
    description: Забезпечити та реалізувати можливість авторизованих користувачів віддалено переглядати та прослуховувати
      вміст, пов’язаний із встановленою сесією користувача, у режимі реального часу.
    annotation: Немає.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:au-15
    ref_id: AU-15
    name: Альтернативна можливість аудиту
    category: technical
    csf_function: protect
    description: 'Вилучено: Включено до AU-5(5).'
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:au-16
    ref_id: AU-16
    name: Міжорганізаційний аудит
    category: process
    csf_function: protect
    description: 'Використовувати [Призначення: визначені організацією методи] для координації [Призначення: визначеної
      організацією інформації] серед зовнішніх організацій, коли інформація аудиту передається за межі організації.


      Параметри:

      1. Призначення: визначені організацією методи

      2. Призначення: визначеної організацією інформації'
    annotation: Коли організації використовують системи та/або послуги зовнішніх організацій, можливість аудиту
      потребує узгодженого підходу між організаціями (наприклад, збереження ідентичності осіб, які зверталися за
      конкретними послугами через організаційні межі). Через те, що втрата конфіденційності іноді неможлива, часто
      трапляється так, що міжорганізаційний аудит просто фіксує особу, яка надсилає запити в початковій системі,
      а наступні системи фіксують, що запити надходили від уповноважених осіб. Організації розглядають можливість
      включення процесів узгодження вимог щодо інформаційного аудиту та захисту, отриманої в процесі нього інформації,
      в угоди про обмін інформацією.
  - urn: urn:intuitem:risk:library:dsszzi-nd-tzi-3-6-controls:au-16.1
