      parent_urn: urn:intuitem:risk:req_node:dsszzi-base-security-profile:at
      ref_id: '17'
      name: Навчання з підвищення обізнаності
      description: '1) Забезпечити навчання користувачів системи з питань безпеки: як частину початкового навчання
        для нових користувачів і періодично після цього; якщо цього потребують зміни в системі або наступні події,
        визначені організацією; щодо розпізнавання та повідомлення про індикатори внутрішньої загрози, соціальної
        інженерії, та соціального шпіонажу; 2) оновлювати зміст тренінгу з безпекової обізнаності з визначеною організацією
        періодичністю та після визначених організацією подій.'
      annotation: 'AT-2, AT-2(2). Мінімальні параметри: a.1. щонайменше раз на рік'
      implementation_groups:
      - VK
      - DSK
    - urn: urn:intuitem:risk:req_node:dsszzi-base-security-profile:18
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:dsszzi-base-security-profile:at
      ref_id: '18'
      name: Рольове навчання
      description: 1) Провести тренінги з безпеки для персоналу організації на основі покладених обов'язків перед
        авторизацією доступу до системи або відкритої та конфіденційної інформації, перед виконанням призначених
        обов'язків, а також з частотою, визначеною організацією, після цього; коли цього вимагають зміни в системі
        або визначені організацією події; 2) оновлювати зміст тренінгів з визначеною організацією частотою та після
        визначених організацією подій.
      annotation: 'AT-3. Мінімальні параметри: a.1. щонайменше щороку'
      implementation_groups:
      - VK
      - DSK
