        протоколи, з'єднання та служби; вимкнути або видалити функції, порти, протоколи, з'єднання та служби, які
        є непотрібними або небезпечними.
      annotation: 'CM-7, CM-7(1). Мінімальні параметри: щонайменше раз на рік або в міру внесення змін до системи
        чи виникнення інцидентів; b. усі функції, порти, протоколи, програмне забезпечення та послуги в системі,
        визначені як непотрібні та/або незахищені'
