objects:
  framework:
    urn: urn:intuitem:risk:framework:dsszzi-base-security-profile
    ref_id: DSSZZI-BSP
    name: ДССЗЗІ – Базовий профіль безпеки
    description: 'Базовий профіль безпеки системи на основі положень НД ТЗІ 3.6-006-24,

      побудований на каталозі заходів захисту NIST SP 800-53.

      Об''єднує вимоги для систем, де обробляється відкрита/конфіденційна

      інформація, та систем, де обробляється службова інформація (ДСК),

      через implementation groups.'
    implementation_groups_definition:
    - ref_id: VK
      name: Відкрита/конфіденційна інформація
      description: Базовий профіль для систем, де обробляється відкрита або конфіденційна інформація (НД ТЗІ 3.6-006-24).
    - ref_id: DSK
      name: Службова інформація (ДСК)
      description: Профіль для систем, де обробляється інформація для службового користування (ДСК); включає всі
        вимоги профілю VK плюс додаткові/посилені вимоги.
    requirement_nodes:
    - urn: urn:intuitem:risk:req_node:dsszzi-base-security-profile:ac
      assessable: false
      depth: 1
      ref_id: AC
      name: Управління доступом
    - urn: urn:intuitem:risk:req_node:dsszzi-base-security-profile:1
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:dsszzi-base-security-profile:ac
      ref_id: '1'
      name: Управління обліковими записами
      description: '1) Визначити дозволені та заборонені типи облікових записів у системі; 2) створювати, активувати,
        змінювати, деактивувати та видаляти облікові записи із системи відповідно до політики, процедур, передумов
        і критеріїв організації; 3) визначити авторизованих користувачів системи, належність до груп і ролей, а
        також повноваження доступу (тобто привілеї); 4) авторизувати доступ до системи на основі чинного дозволу
        та цілей використання системи; 5) контролювати використання облікових записів у системі; 6) оповістити персонал
        або ролі організації, коли: облікові записи більше не потрібні; користувачі звільняються або переводяться;
        у системі наявні зміни, які потребують нових знань; 8) вимагати, щоб користувачі виходили з системи після
        очікуваної бездіяльності або за визначеними обставинами.'
      annotation: 'AC-2, AC-2(5). Мінімальні параметри: h.1. 24 години; h.2. 24 години; h.3. 24 години; j. мінімум
        щоквартально; AC-2(5) — кінець робочого дня користувача'
      implementation_groups:
      - VK
      - DSK
      questions:
        urn:intuitem:risk:req_node:dsszzi-base-security-profile:1:question:1:
          type: text
          text: 'AC-2 — Призначення: визначеною організацією відповідальною особою або роллю — вкажіть значення'
        urn:intuitem:risk:req_node:dsszzi-base-security-profile:1:question:2:
          type: text
          text: 'AC-2 — Призначення: визначених організацією політики, процедур та умов — вкажіть значення'
        urn:intuitem:risk:req_node:dsszzi-base-security-profile:1:question:3:
          type: text
          text: 'AC-2 — Призначення: визначеного організацією часового періоду для кожної ситуації — вкажіть значення'
        urn:intuitem:risk:req_node:dsszzi-base-security-profile:1:question:4:
          type: text
          text: 'AC-2 — Призначення: визначеною організацією частотою — вкажіть значення'
        urn:intuitem:risk:req_node:dsszzi-base-security-profile:1:question:5:
          type: text
          text: 'AC-2(5) — Призначення: вичерпано визначений організацією періоду часу очікування або опис того,
            коли необхідно вийти із системи — вкажіть значення'
    - urn: urn:intuitem:risk:req_node:dsszzi-base-security-profile:2
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:dsszzi-base-security-profile:ac
      ref_id: '2'
      name: Забезпечення доступу
      description: Застосовувати затверджені повноваження для логічного доступу до конфіденційної інформації та
        ресурсів у системі.
      annotation: AC-3
      implementation_groups:
      - VK
      - DSK
    - urn: urn:intuitem:risk:req_node:dsszzi-base-security-profile:3
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:dsszzi-base-security-profile:ac
      ref_id: '3'
      name: Управління інформаційними потоками
      description: Застосовувати затверджені дії для управління потоками відкритої та конфіденційної інформації
        всередині системи та між підключеними системами.
      annotation: AC-4
      implementation_groups:
      - VK
      - DSK
      questions:
        urn:intuitem:risk:req_node:dsszzi-base-security-profile:3:question:1:
          type: text
          text: 'AC-4 — Призначення: визначеними організацією політиками управління інформаційним потоком — вкажіть
            значення'
    - urn: urn:intuitem:risk:req_node:dsszzi-base-security-profile:4
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:dsszzi-base-security-profile:ac
      ref_id: '4'
      name: Розмежування обов'язків
      description: Визначити обов'язки осіб, які потребують розмежування; установити правила авторизації доступу
        для підтримки розмежування обов'язків.
      annotation: AC-5
      implementation_groups:
      - VK
      - DSK
      questions:
        urn:intuitem:risk:req_node:dsszzi-base-security-profile:4:question:1:
          type: text
          text: 'AC-5 — Призначення: визначені організацією обов’язки окремих осіб — вкажіть значення'
    - urn: urn:intuitem:risk:req_node:dsszzi-base-security-profile:5
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:dsszzi-base-security-profile:ac
      ref_id: '5'
      name: Мінімізація повноважень
      description: Надавати користувачам (або процесам, що діють від імені користувачів) лише авторизований доступ
        до системи, необхідний для виконання поставлених завдань організації; авторизувати доступ до функцій безпеки,
        визначених організацією та важливих для безпеки інформації.
      annotation: AC-6, AC-6(1), AU-9(4)
      implementation_groups:
      - VK
      - DSK
      questions:
        urn:intuitem:risk:req_node:dsszzi-base-security-profile:5:question:1:
          type: text
          text: 'AC-6(1) — Призначення: особи або ролі, визначені організацією — вкажіть значення'
        urn:intuitem:risk:req_node:dsszzi-base-security-profile:5:question:2:
          type: text
          text: 'AC-6(1) — Призначення: функції безпеки, визначені організацією (розгорнуті в апаратному, програмному
            та мікропрограмному забезпеченні) — вкажіть значення'
        urn:intuitem:risk:req_node:dsszzi-base-security-profile:5:question:3:
          type: text
          text: 'AC-6(1) — Призначення: визначена організацією інформація, необхідна для забезпечення безпеки —
            вкажіть значення'
    - urn: urn:intuitem:risk:req_node:dsszzi-base-security-profile:6
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:dsszzi-base-security-profile:ac
      ref_id: '6'
      name: Мінімізація повноважень – непривілейований доступ до незахищених функцій
      description: Обмежити привілейовані облікові записи в системі для персоналу або ролей, що визначаються організацією;
        вимагати, щоб користувачі (або ролі) з привілейованими обліковими записами використовували непривілейовані
        облікові записи для доступу до незахищених функцій або інформації.
      annotation: 'AC-6(2), AC-6(5). Мінімальні параметри: привілейовані функції'
      implementation_groups:
      - VK
      - DSK
      questions:
        urn:intuitem:risk:req_node:dsszzi-base-security-profile:6:question:1:
          type: text
          text: 'AC-6(2) — Призначення: визначених організацією функцій безпеки або інформації, що стосується безпеки
            — вкажіть значення'
        urn:intuitem:risk:req_node:dsszzi-base-security-profile:6:question:2:
          type: text
          text: 'AC-6(5) — Призначення: визначеним організацією персоналом або ролями — вкажіть значення'
    - urn: urn:intuitem:risk:req_node:dsszzi-base-security-profile:7
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:dsszzi-base-security-profile:ac
      ref_id: '7'
      name: Мінімізація повноважень – заборона непривілейованим користувачам виконувати привілейовані функції
      description: Заборонити непривілейованим користувачам виконувати привілейовані функції.
      annotation: AC-6(10)
      implementation_groups:
      - VK
      - DSK
    - urn: urn:intuitem:risk:req_node:dsszzi-base-security-profile:8
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:dsszzi-base-security-profile:ac
      ref_id: '8'
      name: Невдалі спроби входу в систему
      description: 'Встановити обмеження на кількість (визначену організацією) невдалих спроб входу в систему протягом
        визначеного проміжку часу; автоматично (вибір один або декілька): заблокувати обліковий запис або вузол
        на визначений період; заблокувати обліковий запис або вузол до зняття адміністратором; відкласти наступний
        запит на вхід; повідомити системного адміністратора; вжити інших заходів, коли перевищено максимальну кількість
        невдалих спроб входу в систему.'
      annotation: 'AC-7. Мінімальні параметри: b. повідомити відповідального адміністратора'
      implementation_groups:
      - VK
      - DSK
      questions:
        urn:intuitem:risk:req_node:dsszzi-base-security-profile:8:question:1:
          type: text
          text: 'AC-7 — Призначення: визначену організацією кількість — вкажіть значення'
        urn:intuitem:risk:req_node:dsszzi-base-security-profile:8:question:2:
          type: text
          text: 'AC-7 — Призначення: визначеного організацією часового періоду — вкажіть значення'
        urn:intuitem:risk:req_node:dsszzi-base-security-profile:8:question:3:
          type: multiple_choice
          text: 'AC-7 — Вибір (один або декілька): оберіть значення'
          choices:
          - urn: urn:intuitem:risk:req_node:dsszzi-base-security-profile:8:question:3:choice:1
            value: 'блокування облікового запису/вузла на [Призначення: визначений організацією часовий період]'
          - urn: urn:intuitem:risk:req_node:dsszzi-base-security-profile:8:question:3:choice:2
            value: блокування облікового запису/вузла, доки він не буде розблокований адміністратором
          - urn: urn:intuitem:risk:req_node:dsszzi-base-security-profile:8:question:3:choice:3
            value: 'затримання наступної команди входу в систему за [Надання: визначеним організацією алгоритмом
              затримки]'
          - urn: urn:intuitem:risk:req_node:dsszzi-base-security-profile:8:question:3:choice:4
            value: 'виконати [Призначення: визначені організацією дії]'
    - urn: urn:intuitem:risk:req_node:dsszzi-base-security-profile:9
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:dsszzi-base-security-profile:ac
      ref_id: '9'
      name: Попередження про використання системи
      description: Відображати повідомлення в системі з попередженнями про конфіденційність і безпеку відповідно
        до застосовних правил керівних документів для відкритої та конфіденційної інформації перед тим, як надати
        доступ до системи.
      annotation: AC-8
      implementation_groups:
      - VK
      - DSK
      questions:
        urn:intuitem:risk:req_node:dsszzi-base-security-profile:9:question:1:
          type: text
          text: 'AC-8 — Призначення: визначене організацією сповіщення або банер про використання системи — вкажіть
            значення'
        urn:intuitem:risk:req_node:dsszzi-base-security-profile:9:question:2:
          type: text
          text: 'AC-8 — Призначення: визначені організацією умови — вкажіть значення'
    - urn: urn:intuitem:risk:req_node:dsszzi-base-security-profile:10
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:dsszzi-base-security-profile:ac
      ref_id: '10'
      name: Блокування пристрою
      description: 'Заборонити доступ до системи за допомогою дій (вибір один або декілька): ініціювання блокування
        пристрою після визначеного періоду часу бездіяльності; вимагати від користувача ініціювати блокування пристрою
        перед тим, як залишити систему без нагляду; зберігати блокування пристрою до відновлення доступу користувача
        за допомогою встановлених процедур ідентифікації та автентифікації; приховати за допомогою блокування пристрою
        інформацію, яку раніше було видно на дисплеї, за допомогою публічно доступного зображення.'
      annotation: 'AC-11, AC-11(1). Мінімальні параметри: a. ініціювання блокування пристрою через період, що не
        перевищує 30 хвилин; дія користувача ініціювати блокування пристрою перед тим, як залишити систему без нагляду'
      implementation_groups:
      - VK
      - DSK
      questions:
        urn:intuitem:risk:req_node:dsszzi-base-security-profile:10:question:1:
          type: text
          text: 'AC-11 — Призначення: визначеного організацією періоду — вкажіть значення'
    - urn: urn:intuitem:risk:req_node:dsszzi-base-security-profile:11
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:dsszzi-base-security-profile:ac
      ref_id: '11'
      name: Припинення сеансу
      description: Автоматично завершувати сеанс користувача після умов або подій, що вимагають відключення сеансу,
        визначених організацією.
      annotation: AC-12
      implementation_groups:
      - VK
      - DSK
      questions:
        urn:intuitem:risk:req_node:dsszzi-base-security-profile:11:question:1:
          type: text
          text: 'AC-12 — Призначення: визначених організацією умов або тригерних подій, що вимагають припинення
            сеансу — вкажіть значення'
    - urn: urn:intuitem:risk:req_node:dsszzi-base-security-profile:12
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:dsszzi-base-security-profile:ac
      ref_id: '12'
      name: Віддалений доступ
      description: Встановити обмеження на використання, дії до конфігурації та підключення для кожного типу допустимого
        віддаленого доступу до системи; авторизувати кожен тип віддаленого доступу до системи перед встановленням
        таких з'єднань; виконувати маршрутизацію всього віддаленого доступу до системи через авторизовані та керовані
        точки контролю управління доступом до мережі; авторизувати віддалене виконання привілейованих команд і віддалений
        доступ до інформації, важливої для безпеки.
      annotation: AC-17, AC-17(3), AC-17(4)
      implementation_groups:
      - VK
      - DSK
      questions:
        urn:intuitem:risk:req_node:dsszzi-base-security-profile:12:question:1:
          type: text
          text: 'AC-17(4) — Призначення: визначених організацією потреб — вкажіть значення'
    - urn: urn:intuitem:risk:req_node:dsszzi-base-security-profile:13
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:dsszzi-base-security-profile:ac
      ref_id: '13'
      name: Бездротовий доступ
      description: Встановити обмеження на використання, дії до конфігурації та підключення для кожного типу бездротового
        доступу до системи; авторизувати бездротовий доступ до системи, перш ніж будуть дозволені такі підключення.
      annotation: AC-18
      implementation_groups:
      - VK
      - DSK
    - urn: urn:intuitem:risk:req_node:dsszzi-base-security-profile:14
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:dsszzi-base-security-profile:ac
      ref_id: '14'
      name: Контроль доступу для мобільних пристроїв
      description: Встановити обмеження на використання, дії до конфігурації та підключення для мобільних пристроїв;
        авторизувати підключення мобільних пристроїв до системи; застосувати повне шифрування носія інформації пристрою
        або шифрування на основі шифрування сховищ інформації (контейнерів).
      annotation: 'AC-19, AC-19(5). Мінімальні параметри: усі мобільні комп''ютери/пристрої, які обробляють дані
        організації'
      implementation_groups:
      - VK
