        застосовувати позначки часу, які відповідають визначеній організацією деталізації вимірювання часу і використовують:
        всесвітній координований час (UTC); фіксоване зміщення місцевого часу відносно UTC або зміщення місцевого
        часу як частину позначки часу.'
      annotation: AU-8
      implementation_groups:
      - VK
      - DSK
