      name: Звільнення персоналу. Переведення персоналу
      description: '1) Коли припиняється індивідуальна трудова діяльність: заборонити доступ до системи протягом
        визначеного організацією періоду часу; припинити дію або відкликати автентифікатори та облікові записи,
        пов''язані з особою; відновити властивості системи, пов''язані з безпекою; 2) коли працівників призначають
        або переводять на інші посади в організації: переглянути та підтвердити поточну оперативну потребу в поточних
        логічних і фізичних дозволах доступу до системи та об''єкта; ініціювати дії з переведення або призначення,
        визначені організацією, протягом визначеного організацією періоду часу після дії з переведення або призначення;
        змінювати авторизацію доступу відповідно до будь-яких змін в оперативних потребах.'
      annotation: 'PS-4, PS-5. Мінімальні параметри: a. у разі добровільного звільнення - якомога швидше, але не
        більше ніж за 5 робочих днів; у разі примусового звільнення - у той самий день, що й припинення трудових
        відносин; b. 1-ий параметр: дії з перепризначення, щоб забезпечити видалення або вимкнення всіх системних
        доступів, які більше не потрібні'
      implementation_groups:
      - VK
      - DSK
