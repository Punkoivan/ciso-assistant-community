      description: Визначити типи змін у конфігурації системи, які необхідно контролювати; переглядати запропоновані
        зміни в конфігурації системи, схвалювати або відхиляти такі зміни, враховуючи вплив на безпеку; упроваджувати
        та задокументувати затверджені зміни конфігурації системи; відстежувати та переглядати дії, пов'язані зі
        змінами в конфігурації системи, які необхідно контролювати.
