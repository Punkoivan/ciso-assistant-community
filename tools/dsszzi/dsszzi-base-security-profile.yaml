      ref_id: '15'
      name: Використання зовнішніх систем
      description: '1) Заборонити використання зовнішніх систем, крім систем дозволених організацією; 2) установити
        такі положення, умови та дії щодо безпеки, які повинні бути виконані у зовнішніх системах, перш ніж дозволити
        використання або доступ до цих систем авторизованим особам; 3) дозволити авторизованим особам використовувати
        зовнішню систему для доступу до системи організації або для обробки, зберігання чи передачі відкритої та
        конфіденційної інформації, лише після: перевірки реалізації дій безпеки на зовнішній системі, як зазначено
        в планах безпеки організації; збереження затверджених угод про підключення або обробку даних з організацією,
        що розміщує зовнішню систему, з якою укладено відповідну угоду; 4) обмежити використання портативних пристроїв
        зберігання даних авторизованими особами на зовнішніх системах.'
      annotation: AC-20, AC-20(1), AC-20(2)
