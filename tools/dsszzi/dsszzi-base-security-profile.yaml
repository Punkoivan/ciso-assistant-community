      description: '1) Записи аудиту повинні містити таку інформацію: який тип події стався; коли відбулася подія;
        де відбулася подія; джерело події; наслідки події; результат події та ідентифікатор будь-яких осіб або суб''єктів,
        пов''язаних з подією; 2) за потреби надавати додаткову інформацію для записів аудиту.'
      annotation: AU-3, AU-3(1)
      implementation_groups:
      - VK
      - DSK
