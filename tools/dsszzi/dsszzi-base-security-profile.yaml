    - urn: urn:intuitem:risk:req_node:dsszzi-base-security-profile:at
      assessable: false
      depth: 1
      ref_id: AT
      name: Обізнаність та навчання
    - urn: urn:intuitem:risk:req_node:dsszzi-base-security-profile:17
      assessable: true
