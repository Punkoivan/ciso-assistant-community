      description: Визначити, задокументувати, затвердити та впровадити фізичні та логічні обмеження доступу, пов'язані
        зі змінами в системі.
      annotation: CM-5
      implementation_groups:
      - VK
      - DSK
    - urn: urn:intuitem:risk:req_node:dsszzi-base-security-profile:32
      assessable: true
