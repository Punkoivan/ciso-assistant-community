urn_root: "dsszzi-base-security-profile"
locale: "uk"
ref_id: "DSSZZI-BSP"
framework_name: "ДССЗЗІ – Базовий профіль безпеки"
description: |
  Базовий профіль безпеки системи на основі положень НД ТЗІ 3.6-006-24,
  побудований на каталозі заходів захисту NIST SP 800-53.
  Об'єднує вимоги для систем, де обробляється відкрита/конфіденційна
  інформація, та систем, де обробляється службова інформація (ДСК),
  через implementation groups.
copyright: "Адміністрація Державної служби спеціального зв'язку та захисту інформації України"
provider: "ДССЗЗІ"
packager: "ciso-assistant-ua"

framework_sheet_base_name: "framework"

implementation_groups_sheet_base_name: "imp_grp"

implementation_groups:
  - ref_id: "VK"
    name: "Відкрита/конфіденційна інформація"
    description: "Базовий профіль для систем, де обробляється відкрита або конфіденційна інформація (НД ТЗІ 3.6-006-24)."

  - ref_id: "DSK"
    name: "Службова інформація (ДСК)"
    description: "Профіль для систем, де обробляється інформація для службового користування (ДСК); включає всі вимоги профілю VK плюс додаткові/посилені вимоги."
